<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khóa ôn CCAR-P</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: course player. Navy band on every view, white cards on a pale page, question outline as the side panel. Deliberately one light theme, like learning platforms. */
:root {
  color-scheme: light;
  --bg: #f4f6fa; --sheet: #ffffff; --sunken: #eef1f6; --ink: #1a2233; --muted: #4b5669; --line: #dde2ea; --line2: #b4bdcb;
  --head: #14233d; --head-ink: #ffffff; --head-muted: #c8d2e2; --head-line: #6f7f99; --head-hover: #24375a; --head-track: #33466a; --head-alert: #ffb4a8;
  --accent: #1557d0; --accent-ink: #ffffff; --accent-soft: #e9f0fd;
  --good: #11703f; --good-soft: #e2f5ea; --bad: #b3261e; --bad-soft: #fdeceb; --warn: #875100; --warn-soft: #fff1d6; --amber: #f2a93b;
  --elim: #f0f2f6;
  --display: "Lexend", "Segoe UI", Roboto, Arial, sans-serif;
  --sans: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 18px/1.6 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
code { font: 500 .84em var(--mono); background: var(--sunken); padding: .1em .36em; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero :focus-visible, .bar :focus-visible { outline-color: var(--head-ink); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 16px var(--sans); color: var(--muted); }

.btn { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 17px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #1048b0; border-color: #1048b0; color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.hero .btn, .bar .btn { background: transparent; border-color: var(--head-line); color: var(--head-ink); }
.hero .btn:hover, .bar .btn:hover { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }
.hero .btn.primary, .bar .btn.primary { background: var(--head-ink); border-color: var(--head-ink); color: var(--head); }
.hero .btn.primary:hover, .bar .btn.primary:hover { background: var(--accent-soft); color: var(--head); }
.hero .btn[aria-pressed="true"], .bar .btn[aria-pressed="true"] { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }

/* Navy band */
.hero { background: var(--head); color: var(--head-ink); }
.hero .wrap { padding-block: 40px 44px; display: grid; gap: 18px; }
.hero .eyebrow { color: var(--head-muted); }
.hero h1 { font-size: clamp(32px, 5vw, 46px); font-weight: 700; }
.hero .lead { max-width: 66ch; color: var(--head-muted); font-size: 19px; }
.herofacts { display: flex; flex-wrap: wrap; gap: 8px 32px; list-style: none; margin: 0; padding: 0; }
.herofacts b { font: 600 22px var(--display); margin-right: 6px; font-variant-numeric: tabular-nums; }
.herofacts li { color: var(--head-muted); }
.herofacts li b { color: var(--head-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .primary { padding: 11px 28px; font-size: 18px; }

.card, .cols > section, .sheetx { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.start { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cols > * { min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 17px; }
.tbl th, .tbl td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-weight: 400; }
.tbl tr:last-child th, .tbl tr:last-child td { border-bottom: 0; }
.tbl th { color: var(--muted); width: 38%; padding-right: 12px; }
.tbl .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.start h2, .cols h2 { font-size: 20px; margin-bottom: 10px; }
.note { background: var(--accent-soft); padding: 18px 22px; font-size: 17px; border-radius: 12px; }
.note ul { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }

.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.setcard { display: grid; gap: 4px; text-align: left; background: var(--sheet); color: var(--ink); border: 1px solid var(--line2); border-radius: 12px; padding: 14px 18px; }
.setcard:hover { border-color: var(--accent); }
.setcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.setcard b { font: 600 20px var(--display); }
.setstat { font-weight: 600; font-size: 16px; color: var(--muted); }
.setstat.pass { color: var(--good); } .setstat.fail { color: var(--bad); }
.setscen { font-size: 16px; color: var(--muted); }
.tblwrap { overflow-x: auto; }
.hist th, .hist td { width: auto; padding-right: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Exam */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-ink); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.bar .code { font: 600 18px var(--display); }
.bar .prog { color: var(--head-muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.bar .spacer { flex: 1; }
.bar .btn { padding: 6px 14px; font-size: 16px; }
.timer { font: 600 21px var(--display); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--head-alert); }
.pbar { height: 4px; background: var(--head-track); }
.pbar span { display: block; height: 100%; background: var(--amber); }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding-block: 24px 56px; align-items: start; }
.exam > * { min-width: 0; }
.scen { background: var(--accent-soft); padding: 16px 24px; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; font-size: 17px; }
.scen b { display: block; margin-bottom: 2px; font: 600 17px var(--display); }
.sheet { background: var(--sheet); padding: 22px 24px; border: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.qhead .btn { padding: 4px 12px; font-size: 16px; }
.stem { font-size: 20px; line-height: 1.5; font-weight: 600; max-width: 72ch; }
.instr { margin-top: 12px; font-size: 17px; font-weight: 600; color: var(--accent); }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 13px 16px; background: var(--sheet); border: 1px solid var(--line2); border-radius: 10px; cursor: pointer; }
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
.ltr { width: 30px; height: 30px; display: grid; place-items: center; border: 1.5px solid var(--line2); border-radius: 50%; font: 600 16px/1 var(--sans); background: var(--sheet); }
.opt.multi .ltr { border-radius: 7px; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.off { opacity: .6; cursor: not-allowed; }
.opt.off:hover { border-color: var(--line2); background: var(--sheet); }
.limit { margin-top: 10px; font-size: 16px; color: var(--warn); min-height: 24px; }
.navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.navrow .spacer { flex: 1; }

.map { position: sticky; top: 90px; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto; }
.map h2 { font-size: 18px; }
.map h3 { display: flex; justify-content: space-between; font: 600 16px var(--sans); margin-bottom: 6px; }
.map h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 7px; font: 500 15px var(--sans); padding: 0; }
.cell:hover { border-color: var(--accent); }
.cell.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.cur { outline: 2px solid var(--head); outline-offset: 1px; }
.cell.flag::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; background: var(--amber); border: 2px solid var(--sheet); border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .a { background: var(--accent); }
.legend .f { background: var(--amber); border-radius: 50%; }
.maptoggle { display: none; }

.veil { position: fixed; inset: 0; background: rgba(15, 25, 45, .55); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--sheet); max-width: 480px; width: 100%; padding: 26px; border-radius: 12px; display: grid; gap: 12px; }
.modal h2 { font-size: 22px; }
.modal .sub { color: var(--muted); }
.linklist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.linklist button { border: 1px solid var(--line2); background: none; color: var(--ink); border-radius: 6px; font-size: 15px; padding: 2px 9px; }

/* Result */
.result { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 36px; align-items: end; }
.score { font: 700 clamp(56px, 10vw, 84px)/1 var(--display); font-variant-numeric: tabular-nums; }
.score small { font-size: .28em; font-weight: 500; color: var(--head-muted); }
.tag { display: inline-block; padding: 3px 14px; border-radius: 999px; font: 700 16px var(--sans); }
.tag.pass, .mark.ok { background: var(--good-soft); color: var(--good); }
.tag.fail, .mark.no { background: var(--bad-soft); color: var(--bad); }
.verdict .facts { color: var(--head-muted); margin-top: 6px; }
.scale { position: relative; height: 40px; margin-top: 8px; grid-column: 1 / -1; }
.scale .track, .scale .fill { position: absolute; left: 0; top: 6px; height: 10px; border-radius: 5px; }
.scale .track { right: 0; background: var(--head-track); }
.scale .fill { background: var(--head-ink); }
.scale .tick { position: absolute; top: 0; width: 3px; height: 22px; background: var(--amber); }
.scale .lab { position: absolute; top: 23px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--head-muted); transform: translateX(-50%); }
.scale .lab.l { transform: none; } .scale .lab.r { transform: translateX(-100%); }
.rows { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 54px 60px; gap: 4px 10px; align-items: baseline; font-size: 17px; }
.row .pct, .row .frac { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .frac { color: var(--muted); font-weight: 400; }
.row .b { grid-column: 1 / -1; height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.row .b span { display: block; height: 100%; background: var(--bad); }
.row .b span.g { background: var(--good); } .row .b span.w { background: var(--amber); }
.result > section > h2 { font-size: 22px; margin-bottom: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 15px; font-size: 16px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: inherit; font-size: 16px; padding: 5px 10px; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 8px; max-width: 100%; }
.reviews { display: grid; gap: 14px; }
.rev { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: grid; gap: 12px; }
.rev .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; color: var(--muted); }
.mark { padding: 1px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.mark.blank { background: var(--warn-soft); color: var(--warn); }
.rev .stem { font-size: 19px; }
.ro { display: grid; gap: 6px; }
.ro div { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 12px; border: 1px solid transparent; border-radius: 8px; }
.ro .is { background: var(--good-soft); border-color: var(--good); }
.ro .is .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.ro .wrongpick { background: var(--bad-soft); border-color: var(--bad); }
.ro .wrongpick .ltr { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
.cls { margin: 14px 0; display: grid; gap: 10px; }
.clr { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px 12px; align-items: center; padding: 12px 14px; background: var(--sheet); border: 1px solid var(--line2); border-radius: 10px; }
.clr .t { overflow-wrap: anywhere; }
.clr select { grid-column: 1 / -1; width: 100%; min-height: 42px; padding: 8px 12px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--sunken); color: var(--ink); font: 16px var(--sans); }
.clr select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.clr.ok { border-color: var(--good); background: var(--good-soft); }
.clr.bad { border-color: var(--bad); background: var(--bad-soft); }
.clr .res { grid-column: 1 / -1; font-size: 15px; }
.clr.ok .res b { color: var(--good); } .clr.bad .res b { color: var(--bad); }
.yn { margin-top: 14px; display: grid; gap: 8px; }
.yn .ynh { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px; gap: 8px; padding: 0 12px; font: 600 14px var(--sans); color: var(--muted); }
.yn .ynh span:not(:first-child) { text-align: center; }
.ynr { display: grid; grid-template-columns: 30px minmax(0, 1fr) 76px 76px; gap: 8px 12px; align-items: center; padding: 10px 12px; background: var(--sheet); border: 1px solid var(--line2); border-radius: 10px; }
.ynr .yh { grid-column: 1 / 3; }
.ynb { min-height: 40px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--sheet); color: var(--ink); font: 600 16px var(--sans); cursor: pointer; }
.ynb:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.ynb.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ynb.ok { border-color: var(--good); background: var(--good-soft); color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.ynb.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.ynb:disabled { cursor: default; }
.ynr.miss { border-color: var(--bad); }
.ynkey { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
@media (max-width: 560px) { .yn .ynh { display: none; } .ynr { grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr); } .ynr > .t { grid-column: 2 / -1; } .ynr .ynb:first-of-type { grid-column: 2; } }
.ro .why { font: 700 15px/1.9 var(--sans); white-space: nowrap; }
.ro .is .why { color: var(--good); } .ro .wrongpick .why { color: var(--bad); }
.exp { background: var(--sunken); padding: 14px 18px; border-radius: 8px; }
.exp::before { content: "Giải thích"; display: block; font: 600 16px var(--display); margin-bottom: 2px; }
.empty { color: var(--muted); padding: 16px 0; }

/* Options the hint rules out: grey and dashed, so they recede and the live options stand out */
.opt.elim { background: var(--elim); border-style: dashed; }
.opt.elim .ltr { background: var(--elim); }
.opt.elim.sel { background: var(--accent-soft); border-style: solid; }
.opt.elim.sel .ltr { background: var(--accent); }
.elim code { background: var(--line); }
.elimnote { grid-column: 2; font-size: 16px; line-height: 1.45; color: var(--muted); }
.ro .elim { background: var(--elim); border: 1px dashed var(--line2); }
.ro .wrongpick.elim { background: var(--bad-soft); border: 1px solid var(--bad); }
.ro .elimnote { grid-column: 2 / -1; }
.ro .wrongpick .elimnote { color: var(--bad); }
.opt.right:not(.sel) { background: var(--good-soft); border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.opt.right:not(.sel) .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.rightnote { grid-column: 2; font-size: 16px; line-height: 1.45; font-weight: 700; color: var(--good); }
.hintnote { background: var(--warn-soft); color: var(--warn); display: inline-block; padding: 3px 12px; border-radius: 6px; font-size: 16px; margin-top: 8px; font-weight: 600; }

.sheetx h2 { font-size: 22px; margin-bottom: 4px; }
.sheetx .sub { color: var(--muted); max-width: 72ch; margin-bottom: 18px; }
.egroup { margin-bottom: 20px; }
.egroup h3 { font-size: 17px; padding-bottom: 6px; border-bottom: 2px solid var(--line2); }
.erow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.5; }
.erow > * { min-width: 0; }
.erow .term { font-weight: 600; }
.erow .why { color: var(--muted); }
.ehead { font: 600 15px var(--sans); color: var(--muted); padding: 8px 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
details.sheetx > summary { cursor: pointer; font: 600 20px var(--display); }
details.sheetx[open] > summary { margin-bottom: 8px; }
.dlmsg { color: var(--muted); font-size: 16px; }
.sync .sub { color: var(--muted); max-width: 72ch; margin-bottom: 14px; }
.sync textarea { display: block; width: 100%; min-height: 84px; margin-top: 12px; padding: 10px 12px; font: 400 14px/1.4 var(--mono); color: var(--ink); background: var(--sunken); border: 1px solid var(--line2); border-radius: 8px; resize: vertical; word-break: break-all; }
.sync .syncmsg { margin-top: 10px; font-size: 16px; color: var(--muted); }
.sync .syncmsg.ok { color: var(--good); }
.sync .syncmsg.err { color: var(--bad); }

@media (max-width: 860px) {
  .erow { grid-template-columns: minmax(0, 1fr); }
  .ehead { display: none; }
  .bar .wrap { gap: 6px 8px; padding-block: 8px; }
  .bar .btn { padding: 3px 10px; font-size: 15px; }
  .bar .code { font-size: 16px; }
  .bar .prog { font-size: 15px; }
  .bar .timer { font-size: 18px; }
  .cols, .exam { grid-template-columns: minmax(0, 1fr); }
  .map { position: static; max-height: none; }
  .map:not(.open) { display: none; }
  .maptoggle { display: inline-block; }
  .cells { grid-template-columns: repeat(8, 1fr); }
  .sheet, .scen, .rev, .card, .cols > section, .sheetx { padding-inline: 16px; }
  .stem { font-size: 19px; }
  .opt { padding: 11px 12px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .ro div { grid-template-columns: 30px minmax(0, 1fr); }
  .ro .why { grid-column: 2; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .btn, .cell, .chip { transition: border-color .12s, background .12s, color .12s; } }

.flashwrap { display: grid; gap: 8px; }
.diffblock { margin: 8px 0 28px; scroll-margin-top: 64px; }
.domgroup { scroll-margin-top: 56px; }

<script>

const COURSE_BANK = [{"cat": "T", "topic": 6, "q": "You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps before assessing threats against assets. Which two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact? (Select two.) Each correct answer presents part of the solution.", "o": ["Document the assessment outcome and present it to the risk committee.", "Recommend mitigations and residual-risk acceptance for all identified threats.", "Identify the assets that the deployment touches, along with the sensitivity of each asset.", "Recommend mitigations and residual-risk acceptance for risks that remain.", "Enumerate the threat actors and attack vectors relevant to the deployment."], "a": [2, 4], "sk": ["Which two steps must be completed BEFORE assessing threats"], "note": "Đáp án: {C} + {E}.", "ex": "Đáp án đúng: C, E. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. A — Sai: Không chọn “Document the assessment outcome and present it to the risk committee.” vì đây là hoạt động đánh giá hoặc ra quyết định sau khi đã thực thi, không phải bước chuẩn bị được câu hỏi yêu cầu. B — Sai: Không chọn “Recommend mitigations and residual-risk acceptance for all identified threats.” vì cách diễn đạt tuyệt đối hoặc phạm vi quá rộng làm tăng rủi ro và bỏ qua yêu cầu kiểm soát theo ngữ cảnh. C — Đúng: Phương án này là bước chuẩn bị cần hoàn tất trước khi thực thi: “Identify the assets that the deployment touches, along with the sensitivity of each asset.”. Nó thiết lập đầu vào, tiêu chí hoặc phạm vi cần thiết để bước sau có thể được đánh giá đúng. D — Sai: Không chọn “Recommend mitigations and residual-risk acceptance for risks that remain.” vì đây là hoạt động đánh giá hoặc ra quyết định sau khi đã thực thi, không phải bước chuẩn bị được câu hỏi yêu cầu. E — Đúng: Phương án này là bước chuẩn bị cần hoàn tất trước khi thực thi: “Enumerate the threat actors and attack vectors relevant to the deployment.”. Nó thiết lập đầu vào, tiêu chí hoặc phạm vi cần thiết để bước sau có thể được đánh giá đúng.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q9.", "n": 1}, {"cat": "T", "topic": 7, "q": "You are reviewing instrumentation in a multi-agent system. Which two findings constitute valid observability gaps in the instrumentation? (Select two.) Each correct answer presents a complete solution.", "o": ["Trace spans for each agent step are exported to the shared distributed-tracing backend.", "Latency and token usage on every span are emitted to the central metrics pipeline.", "Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields.", "Model identity and version on each turn are not recorded with the turn artifacts.", "Request-scoped correlation identifiers do not propagate across agent and tool calls."], "a": [3, 4], "sk": ["Which two findings constitute valid observability gaps in the"], "note": "Đáp án: {D} + {E}.", "ex": "Tại sao D đúng: Việc không ghi lại danh tính và phiên bản mô hình (model identity & version) khiến bạn không thể tái hiện lại lỗi, so sánh hiệu năng giữa các phiên bản, hoặc kiểm tra xem sự thay đổi về hành vi của tác tử có xuất phát từ việc cập nhật mô hình hay không.\nTại sao E đúng: Trong hệ thống đa tác tử, định danh tương quan (correlation ID) là chìa khóa để xâu chuỗi toàn bộ luồng xử lý (trace) qua nhiều tác tử và công cụ khác nhau. Nếu không truyền correlation ID, hệ thống sẽ bị đứt gãy vết (trace continuity), gây khó khăn cho việc chẩn đoán sự cố end-to-end.\nTại sao các đáp án khác sai: A, B, C: Đều là các thực hành tốt (best practices) về observability (xuất trace span, theo dõi latency/tokens, và ghi log công cụ có bảo mật dữ liệu nhạy cảm) chứ không phải là \"lỗ hổng\" (gap).\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q95.", "n": 2}, {"cat": "T", "topic": 5, "q": "You are compiling team-setup practices for a Claude Code rollout across an engineering organization. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.", "o": ["Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control.", "Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers.", "Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work.", "Use user scope for team-shared MCP servers so every engineer on the team has consistent access.", "Use project scope for personal editor preferences so the preferences apply consistently within the project."], "a": [0, 1], "sk": ["Which two practices belong on the list"], "note": "Đáp án: {A} + {B}.", "ex": "Đáp án đúng: A, B. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống.\nA. (Sử dụng phạm vi dự án (project scope) cho các MCP server dùng chung trong team và các quy tắc phân quyền được lưu trữ trong hệ thống quản lý phiên bản - VCS.) Đúng: Phạm vi dự án (Project scope) được lưu trực tiếp vào tệp cấu hình của dự án (ví dụ: .claudecode/ hoặc các tệp cấu hình repo) và được commit vào VCS để tất cả các thành viên trong team khi clone repo về đều có chung các MCP server và quy tắc quyền giống nhau.\nB. (Áp dụng cấu hình quản trị trung tâm (managed configuration) cho các thiết lập quan trọng về bảo mật để đảm bảo kỹ sư cá nhân không thể ghi đè.) Đúng: Đối với các chính sách bảo mật bắt buộc toàn công ty (security policy), hệ thống cấu hình quản trị trung tâm (Managed/Organization configuration) được dùng để khóa các thiết lập, ngăn lập trình viên tự ý thay đổi hoặc vượt qua quy định an toàn.\nC. (Sử dụng phạm vi cục bộ (local scope) cho các quy tắc phân quyền quan trọng về bảo mật để mỗi kỹ sư có thể tự tùy chỉnh.) Sai: Các quy tắc bảo mật quan trọng tuyệt đối không được để ở local scope cho cá nhân tự chỉnh sửa, vì sẽ gây ra lỗ hổng bảo mật và sự không nhất quán giữa các máy lập trình viên.\nD. (Sử dụng phạm vi người dùng (user scope) cho các MCP server dùng chung trong team để các định nghĩa có sẵn ở mọi nơi.) Sai: User scope chỉ áp dụng cho cá nhân người dùng đó trên máy họ. Nếu cấu hình MCP server dùng chung ở user scope thì các thành viên khác trong team sẽ không nhận được cấu hình này.\nE. (Sử dụng phạm vi dự án (project scope) cho các tùy chọn trình biên soạn cá nhân để áp dụng nhất quán trong dự án.) Sai: Các sở thích giao diện/trình biên soạn cá nhân (personal editor preferences) thuộc về User scope, không nên đưa vào Project scope vì mỗi lập trình viên có thói quen và giao diện làm việc khác nhau.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q83.", "n": 3}, {"cat": "T", "topic": 6, "q": "You are compiling guardrail tactics for a customer-facing assistant. Which two tactics belong on the guardrail list? Each correct answer presents a complete solution.", "o": ["Embed approved override phrases that users can invoke to bypass guardrails.", "Lower sampling temperature globally to eliminate all variability in responses.", "Validate the model output against a structured schema before downstream actions are taken.", "Layer prompt-level guardrails with runtime content checks rather than relying on either alone.", "Rely on a single hardened system prompt as the only guardrail mechanism."], "a": [2, 3], "sk": ["Which two tactics belong on the guardrail list"], "note": "Đáp án: {C} + {D}.", "ex": "Đáp án đúng: C, D. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. A — Sai: Không chọn “Embed approved override phrases that users can invoke to bypass guardrails.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. B — Sai: Không chọn “Lower sampling temperature globally to eliminate all variability in responses.” vì cách diễn đạt tuyệt đối hoặc phạm vi quá rộng làm tăng rủi ro và bỏ qua yêu cầu kiểm soát theo ngữ cảnh. C — Đúng: Phương án “Validate the model output against a structured schema before downstream actions are taken.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. D — Đúng: Phương án “Layer prompt-level guardrails with runtime content checks rather than relying on either alone.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. E — Sai: Không chọn “Rely on a single hardened system prompt as the only guardrail mechanism.” vì chỉ dựa vào một lớp kiểm soát hoặc phán đoán của mô hình không tạo ra cơ chế thực thi và phòng vệ đáng tin cậy.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q10.", "n": 4}, {"cat": "T", "topic": 7, "q": "You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code. Which integration approach best fits this requirement?", "o": ["Generate documentation from the model's training-data recall without reading any of the actual repository code, accepting that the output will not reflect the current implementation.", "Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step.", "Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.", "Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that documentation generation will be entirely disconnected from the actual implementation."], "a": 2, "sk": ["Which integration approach best fits this requirement"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. A — Sai: Không chọn “Generate documentation from the model's training-data recall without reading any of the actual repository code.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. B — Sai: Không chọn “Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. C — Đúng: Phương án “Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. D — Sai: Không chọn “Disable all filesystem and code-search tools so the subagents cannot read any repository code.” vì cách diễn đạt tuyệt đối hoặc phạm vi quá rộng làm tăng rủi ro và bỏ qua yêu cầu kiểm soát theo ngữ cảnh.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q48.", "n": 5}, {"cat": "T", "topic": 5, "q": "You are diagnosing a Claude Code session whose subagent uses 50,000 tokens of context before the engineer types a single message. Which root cause is most likely?", "o": ["The developer's keyboard layout or input-method configuration is the cause of the elevated context consumption, introducing extra tokens before the engineer types any message.", "Many MCP servers are configured, each contributing tool definitions to the context budget; Tool Search is not enabled, so all definitions load upfront.", "The model has internal personal preferences or default behaviors that silently consume large portions of context budget before any user message is processed, independent of tool configuration.", "The font rendering or display-scaling settings of the IDE are converting visual output into additional context tokens, causing the high pre-session context consumption."], "a": 1, "sk": ["Which root cause is most likely"], "note": "Đáp án: {B}.", "ex": "Đáp án: B. Mỗi MCP server được cấu hình đều nạp định nghĩa tool vào context ngay khi phiên bắt đầu. Khi có nhiều server mà không bật Tool Search (nạp tool theo nhu cầu), toàn bộ định nghĩa tool chiếm hàng chục nghìn token trước khi người dùng nhập gì. A, D (bàn phím, font hiển thị) không liên quan tới token; C sai vì mô hình không có \"sở thích riêng\" ngốn context độc lập với cấu hình.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q11.", "n": 6}, {"cat": "T", "topic": 2, "q": "A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool-selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool-router agent in front of the current agent to filter the tool list per request. Which two findings should you present to justify capability decomposition before adding the router? (Select two.) Each correct answer presents part of the solution.", "o": ["Tool descriptions overlap across multiple claim categories within the agent's tool set.", "Several tools have not been invoked across the most recent 90 days of traffic.", "The 34 tools serve four distinct claim-workflow domains within the triage scope.", "The router pattern is well documented in the team's internal architecture guide.", "The proposed router introduces an additional model call on every incoming request."], "a": [0, 2], "sk": ["Which two findings should you present to justify capability"], "note": "Đáp án: {A} + {C}.", "ex": "Đáp án A (Đúng): Khi số lượng công cụ tăng lên quá nhiều (34 tools), sự trùng lặp trong mô tả khiến LLM bị nhầm lẫn khi lựa chọn công cụ phù hợp. Việc phân rã các công cụ thành các nhóm chức năng riêng biệt sẽ loại bỏ sự mơ hồ này.\nĐáp án C (Đúng): Việc các công cụ tự nhiên chia thành 4 miền quy trình (domains) rõ rệt là bằng chứng kiến trúc lý tưởng để chia nhỏ (decompose) hệ thống thành 4 nhóm/agent chuyên biệt trước khi dùng Router để điều hướng request đến đúng miền.\nCác đáp án sai: B sai vì các công cụ không được sử dụng chỉ cần được loại bỏ hoặc lưu trữ lại (cleanup), không phải là lý do để tái cấu trúc/phân rã kiến trúc. D sai vì việc có tài liệu hướng dẫn chỉ là điều kiện hỗ trợ triển khai, không phải lý do kỹ thuật để biện minh cho việc phân rã hệ thống. E sai vì việc phát sinh thêm một lượt gọi mô hình là một sự đánh đổi/chi phí (trade-off) của mô hình Router, chứ không phải lý do để biện minh cho việc áp dụng nó.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q67.", "n": 7}, {"cat": "T", "topic": 1, "q": "You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata, classify, summarize, and persist. Which pattern is the best fit and why?", "o": ["A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store.", "An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks.", "An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability.", "A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility."], "a": 3, "sk": ["Which pattern is the best fit and why"], "note": "Đáp án: {D}.", "ex": "Đáp án D (Đúng): Bài toán mô tả một quy trình tuyến tính với các bước cố định, xác định rõ từ trước (deterministic steps). Khi các bước đã cố định, việc sử dụng Workflow pattern (dạng chuỗi các bước được lập trình sẵn) sẽ giúp tối ưu chi phí, thời gian phản hồi và đảm bảo tính ổn định, vì không cần tốn token cho việc suy luận/lập kế hoạch vòng lặp như Agentic pattern.\nCác đáp án sai: A sai vì các mô hình agentic vẫn hoàn toàn hỗ trợ gọi công cụ (tool invocations) trong xử lý hàng loạt. B & C sai vì công việc ở đây đã có các bước cố định, không cần đến sự linh hoạt hay lập kế hoạch mở của Agent. Việc dùng Agent trong trường hợp này chỉ làm gia tăng chi phí token không cần thiết và tiềm ẩn rủi ro chạy sai quy trình.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q66.", "n": 8}, {"cat": "T", "topic": 5, "q": "You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities. Which scenario most directly justifies a dedicated subagent?", "o": ["The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions.", "The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection.", "The team has no recurring specialized tasks and uses Claude Code only for isolated general-purpose work that does not justify a dedicated system prompt or tool scope.", "The team wants every Claude Code interaction to use the same generic system prompt with no task-specific specialization, narrow tool permissions, or dedicated model selection."], "a": 0, "sk": ["Which scenario most directly justifies a dedicated subagent"], "note": "Đáp án: {A}.", "ex": "Tại sao A đúng: Động cơ chính để tạo một subagent riêng biệt là khi bạn có các quy trình làm việc chuyên biệt (specialized workflows) diễn ra thường xuyên. Việc thiết lập subagent giúp đóng gói sẵn system prompt chuyên sâu, giới hạn quyền hạn công cụ (để đảm bảo an toàn/nguyên tắc đặc quyền tối thiểu) và tối ưu hóa việc chọn mô hình phù hợp cho tác vụ đó.\nTại sao các đáp án khác sai: B: Câu hỏi bộc phát một lần hoàn toàn có thể xử lý trực tiếp bằng phiên Claude Code thông thường mà không cần tốn công cấu hình subagent. C & D: Đều mô tả việc ưu tiên cấu hình chung/tổng quát cho mọi tác vụ — điều này đi ngược lại mục đích ra đời của subagent (vốn dùng cho các tác vụ phân hóa chuyên sâu).\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q97.", "n": 9}, {"cat": "T", "topic": 6, "q": "You are integrating Claude Code into a workflow that runs against a production database. Which guardrail design most directly preserves safety on data-modifying operations?", "o": ["Allow Claude Code to write directly to the production database without subagent scoping, read-only credential defaults, or human confirmation gates on data-modifying operations.", "Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation.", "Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications.", "Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data."], "a": 3, "sk": ["Which guardrail design most directly preserves safety on data-modifying"], "note": "Đáp án: {D}.", "ex": "Tại sao D đúng: Áp dụng nguyên tắc đặc quyền tối thiểu (Least Privilege) và kiểm soát an toàn nghiêm ngặt đối với môi trường sản xuất bằng cách: mặc định chỉ cấp quyền đọc (read-only); giới hạn các công cụ của subagent không cho tự ý thực hiện câu lệnh chỉnh sửa (INSERT, UPDATE, DELETE); yêu cầu có sự xác nhận của con người (Human-in-the-loop) trước khi chạy bất kỳ lệnh làm thay đổi dữ liệu nào.\nTại sao các đáp án khác sai: A & B: Cấp quyền ghi trực tiếp hoặc quyền tối đa cho AI trên database sản xuất là cực kỳ nguy hiểm, dễ dẫn đến rủi ro mất dữ liệu hoặc sự cố hệ thống do thao tác ngoài ý muốn. C: Tắt logging/auditing làm mất khả năng truy vết và kiểm soát an ninh hệ thống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q103.", "n": 10}, {"cat": "T", "topic": 6, "q": "A security team is evaluating two proposed controls. Control A adds an outbound tool allowlist with destination restrictions and per-call review. Control B scores responses against a stable adversarial evaluation set after each model-version change. Which two risk categories are correctly matched to these controls? (Select two.)", "o": ["Control A - prompt injection from adversarial content in retrieved data", "Control A - silent quality drift after a model-version upgrade", "Control A - data exfiltration via outbound tool calls", "Control B - data exfiltration via outbound tool calls", "Control B - silent quality drift after a model-version upgrade"], "a": [2, 4], "sk": ["Which two risk categories are correctly matched to these"], "note": "Đáp án: {C} + {E}.", "ex": "Đáp án đúng cho câu Q44 trên trang CertLab là C và E.\nC — Đúng: Control A thiết lập danh sách cho phép (allowlist) đối với công cụ gọi ra bên ngoài kèm theo giới hạn điểm đến và kiểm duyệt từng lượt gọi. Kiểm soát này trực tiếp ngăn chặn rủi ro rò rỉ/trích xuất dữ liệu trái phép (data exfiltration) thông qua các outbound tool calls.\nE — Đúng: Control B chấm điểm các phản hồi dựa trên một tập đánh giá đối kháng cố định sau mỗi lần thay đổi phiên bản mô hình. Kiểm soát này giúp phát hiện hiện tượng suy giảm chất lượng ngầm (silent quality drift) sau khi nâng cấp mô hình.\nLý do các phương án còn lại không chính xác: A: Control A chỉ tập trung vào kiểm soát đầu ra (outbound tool calls) chứ không giải quyết rủi ro chèn prompt (prompt injection) từ dữ liệu được truy xuất ở đầu vào. B & D: Bị ghép sai cặp giữa biện pháp kiểm soát và loại rủi ro tương ứng.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q44.", "n": 11}, {"cat": "T", "topic": 6, "q": "You are preparing a HIPAA-eligible deployment for a healthcare customer. Which configuration supports HIPAA compliance using Anthropic-offered tools?", "o": ["Claude Free with no contractual addendum, since consumer products meet HIPAA requirements out of the box.", "Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking.", "Disabling all audit logging so that no PHI is recorded in any log store, on the assumption that the absence of logs satisfies HIPAA requirements without a signed BAA.", "An ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured."], "a": 1, "sk": ["Which configuration supports HIPAA compliance using Anthropic-offered tools"], "note": "Đáp án: {B}.", "ex": "⚠ LỖI DỮ LIỆU TRÊN SITE: lời giải thích hiển thị không khớp câu hỏi (nói về ADR và chọn \"A và D\"). Nguyên văn trên site: Đáp án đúng: A và D. Giải thích: Tại sao A & D đúng: Trong Hồ sơ ghi nhận quyết định kiến trúc (ADR - Architectural Decision Record) tiêu chuẩn: A: Quyết định kiến trúc không phải là cố định vĩnh viễn; nó cần có người chịu trách nhiệm (owner) và thời gian định kỳ xem xét lại nếu các giả định ban đầu không còn đúng. D: Việc nêu rõ các phương án đã cân nhắc (alternatives considered) cùng tiêu chí đánh giá giúp người đọc hiểu lý do tại sao phương án hiện tại lại được chọn, tăng tính minh bạch và thuyết phục. Tại sao các đáp án khác sai: B: Phân phối tài liệu đại trà cho cùng một diễn đàn bất kể phạm vi/đối tượng sẽ gây nhiễu thông tin và tốn thời gian không cần thiết. C: Bỏ qua các phương án bị bác bỏ làm mất đi ngữ cảnh quan trọng, dẫn đến nguy cơ các nhóm sau này lặp lại chính những lựa chọn sai lầm đó. E: Việc bắt buộc dùng một template quá cứng nhắc cho mọi loại quyết định (từ nhỏ đến lớn) gây ra thủ tục rườm rà (bureaucracy) không cần thiết.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q101.", "n": 12}, {"cat": "T", "topic": 6, "q": "A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team has reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair. Which two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution.", "o": ["Approval rate parity does not by itself assess error rate parity across protected groups.", "Match with human underwriters does not establish freedom from underwriter-introduced bias.", "The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions.", "The fairness team's review process likely missed at least some of the protected groups studied.", "A larger sample is needed before any meaningful fairness claim can be made about the model."], "a": [0, 1], "sk": ["Which two Discernment-competency findings should you report"], "note": "Đáp án: {A} + {B}.", "ex": "Đáp án đúng là A và B.\nA — Đúng: Sự bình đẳng về tỷ lệ phê duyệt (approval rate parity) không đồng nghĩa với việc có sự bình đẳng về tỷ lệ sai sót (error rate parity) giữa các nhóm đối tượng được bảo vệ (protected groups). Tỷ lệ khớp cao vẫn có thể ẩn chứa tỷ lệ âm tính giả hoặc dương tính giả chênh lệch lớn giữa các nhóm.\nB — Đúng: Mức độ trùng khớp 94% với các chuyên gia thẩm định (human underwriters) chỉ phản ánh khả năng bắt chước quyết định của con người, chứ không chứng minh được hệ thống hoàn toàn loại bỏ được các thiên vị/định kiến sẵn có do chính các chuyên gia đó đưa vào trong quá trình thẩm định.\nLý do các phương án còn lại không chính xác: C: Khẳng định tỷ lệ khớp 94% là bằng chứng đầy đủ cho sự công bằng là sai lầm; đây là một kết luận ngụy biện vì bỏ qua các yếu tố định kiến và tỷ lệ lỗi phân bổ theo nhóm dân số. D: Phát biểu mang tính phán đoán chủ quan và thiếu cơ sở kỹ thuật để kết luận liệu quy trình đánh giá đã bỏ sót nhóm nào hay chưa. E: Vấn đề ở đây nằm ở bản chất của chỉ số đánh giá (matching rate vs. fairness/bias), không thuần túy là do kích thước mẫu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q61.", "n": 13}, {"cat": "T", "topic": 5, "q": "You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration. Which two steps must be completed BEFORE piloting the configuration with a small group of engineers? (Select two.) Each correct answer presents part of the solution.", "o": ["Define the project-scope baseline covering Model Context Protocol (MCP) servers, permission rules, and subagents.", "Onboard every engineer in the organization to the new configuration through mandatory training sessions.", "Roll out the stabilized configuration to additional teams with documentation and a defined support channel", "Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope.", "Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout."], "a": [0, 3], "sk": ["Which two steps must be completed BEFORE piloting the"], "note": "Đáp án: {A} + {D}.", "ex": "Tại sao A & D đúng: Đây là hai bước chuẩn bị và thiết kế cốt lõi bắt buộc phải hoàn thành trước khi cho nhóm nhỏ dùng thử (pilot). D (Lập kế hoạch & Kiến trúc): Xác định luồng công việc, ranh giới an toàn/bảo mật, và phân chia phân cấp cấu hình (Managed Config vs. Project Scope). A (Cấu hình kỹ thuật): Thiết lập trước bản baseline thực tế về MCP servers, permissions và subagents cho dự án để nhóm pilot có môi trường sẵn sàng trải nghiệm.\nTại sao các đáp án khác sai: B: Việc onboard toàn bộ kỹ sư toàn công ty ngay từ đầu làm mất đi bản chất của một đợt thử nghiệm quy mô nhỏ (pilot). C & E: Mở rộng cho các nhóm khác hay tinh chỉnh/ổn định hóa cấu hình dựa trên kết quả thử nghiệm chỉ diễn ra trong và sau giai đoạn pilot, không thể thực hiện trước khi pilot bắt đầu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q105.", "n": 14}, {"cat": "T", "topic": 7, "q": "An architect is reviewing a set of architecture documentation packages before handing off a Claude-based pipeline to an implementation team. Which two characteristics indicate that a documentation package is sufficient to support implementation without ongoing architect involvement? (Select two.)", "o": ["The document specifies integration contracts, configuration schemas, and expected input/output shapes for each component.", "The document includes a decision log that records the rationale for key architectural choices and the alternatives rejected.", "The document provides a high-level narrative description of the system without component-level detail.", "The document includes the architect's contact information for questions during implementation.", "The document lists all Claude models that were evaluated but does not specify which was selected or why."], "a": [0, 1], "sk": ["Which two characteristics indicate that a documentation package is"], "note": "Đáp án: {A} + {B}.", "ex": "Đáp án A (Đúng): Rõ ràng và chính xác ở cấp độ kỹ thuật. Để đội ngũ kỹ thuật có thể tự triển khai mà không cần hỏi lại kiến trúc sư, họ cần biết chi tiết về hợp đồng giao tiếp (APIs/contracts), định dạng tệp cấu hình, và cấu trúc dữ liệu vào/ra (input/output schemas).\nĐáp án B (Đúng): Việc lưu lại nhật ký quyết định (Architecture Decision Record - ADR) giúp đội ngũ triển khai hiểu tại sao hệ thống lại được thiết kế như vậy. Điều này ngăn họ vô tình đi ngược lại các quyết định kiến trúc ban đầu khi gặp khó khăn hoặc phát sinh vấn đề.\nCác đáp án sai (C, D, E): C sai vì chỉ mô tả tổng quan sẽ thiếu thông tin kỹ thuật chi tiết để lập trình. D sai vì việc vẫn phải liên hệ kiến trúc sư để hỏi đáp chứng tỏ tài liệu chưa đủ độc lập/tự giải thích. E sai vì không đưa ra quyết định chọn mô hình cụ thể sẽ khiến đội ngũ triển khai bị hoang mang, không biết sử dụng mô hình nào.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q64.", "n": 15}, {"cat": "T", "topic": 1, "q": "You are defining where human review must remain in a planned automated pipeline. Which placement reflects sound human-in-the-loop design?", "o": ["Place a human reviewer only after the irreversible action has already executed, making the review a post-hoc audit rather than a meaningful pre-action check or approval gate.", "Place a human reviewer between the model’s output and any high-impact, irreversible action, with explicit criteria for what the reviewer must check before approval.", "Place a human reviewer in the loop for a randomly selected sample of requests, without defining criteria for what the reviewer should check or which output categories require mandatory review.", "Remove all human review steps from the pipeline to maximize throughput, accepting that high-impact and irreversible actions will be taken without any human approval or oversight."], "a": 1, "sk": ["Which placement reflects sound human-in-the-loop design"], "note": "Đáp án: {B}.", "ex": "Sound human-in-the-loop design places review before a high-impact or irreversible action occurs. The reviewer must receive sufficient context and explicit approval criteria so that the checkpoint functions as a meaningful control rather than a ceremonial step. This is especially important when Claude outputs could initiate financial transactions, publish sensitive material, alter access rights, affect employment decisions, or trigger other consequential actions. Option A provides only retrospective auditing and cannot prevent harm. Option C may support monitoring or quality measurement, but random sampling does not protect every case that requires mandatory approval, particularly when review criteria are undefined. Option D removes the accountability and intervention mechanism entirely. Therefore, B provides the strongest design by combining risk-based placement, human authority, and clearly defined verification requirements before execution.\n\nNguồn: tệp ccar-p-new-questions.md, Set 3 · Q114.", "n": 16}, {"cat": "T", "topic": 7, "q": "You are building a feedback-and-alignment routine for a multi-stakeholder deployment. Which two practices belong in the routine? (Select two.) Each correct answer presents a complete solution.", "o": ["Record each session and distribute the recording to stakeholders who could not attend live.", "Escalate any disagreement among stakeholders to the executive sponsor for binding resolution.", "Rotate facilitation among the participating stakeholder groups to share ownership of the routine.", "Set a regular cadence for revisiting expectations and assumptions as conditions evolve over time.", "Reconcile divergent stakeholder positions explicitly rather than papering over them in the moment."], "a": [3, 4], "sk": ["Which two practices belong in the routine"], "note": "Đáp án: {D} + {E}.", "ex": "Đáp án đúng là D và E.\nD — Đúng: Thiết lập lịch trình định kỳ để xem xét lại các kỳ vọng và giả định (Set a regular cadence for revisiting expectations and assumptions) khi các điều kiện thực tế thay đổi theo thời gian. Triển khai AI đòi hỏi sự thích ứng liên tục, do đó việc rà soát định kỳ giúp duy trì sự đồng thuận giữa các bên liên quan.\nE — Đúng: Giải quyết các quan điểm bất đồng của các bên liên quan một cách rõ ràng (Reconcile divergent stakeholder positions explicitly) thay vì che đậy hay bỏ qua chúng tại thời điểm đó. Việc đối mặt và thống nhất các khác biệt ngay từ đầu giúp xây dựng giải pháp bền vững và tránh rủi ro phát sinh về sau.\nLý do các phương án còn lại không chính xác: A: Tự động ghi âm và gửi video cuộc họp cho tất cả các bên mà không qua xem xét hay tổng hợp có thể làm nhiễu thông tin và không tạo ra sự đồng thuận thực sự. B: Lập tức leo thang mọi bất đồng lên cấp lãnh đạo cao cấp (executive leadership) sẽ làm quá tải cấp quản lý và thể hiện sự thiếu hiệu quả trong quy trình làm việc nhóm. C: Xoay vòng người điều phối giữa các nhóm có thể gây thiếu nhất quán trong cách dẫn dắt và làm gián đoạn tiến trình làm việc chung.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q63.", "n": 17}, {"cat": "T", "topic": 6, "q": "You are reviewing an integration specification for security gaps. Which two findings constitute valid security gaps in the specification? (Select two.) Each correct answer presents a complete solution.", "o": ["Tool calls execute server-side under a least-privilege service principal with scoped permissions.", "Service credentials are placed in the prompt context, where they can leak into logs and traces.", "Role-based access control is enforced only at the response-rendering layer after the model accesses restricted data.", "Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session.", "Tool inputs and outputs are encrypted in transit using transport-layer security between services."], "a": [1, 2], "sk": ["Which two findings constitute valid security gaps in the"], "note": "Đáp án: {B} + {C}.", "ex": "Đáp án: B, C. B — Đúng (lỗ hổng): đưa credential của service vào prompt khiến nó có thể lộ qua log, trace, hoặc bị prompt injection trích xuất; credential phải nằm ở tầng thực thi tool. C — Đúng (lỗ hổng): RBAC chỉ áp ở bước hiển thị nghĩa là mô hình đã đọc dữ liệu bị hạn chế; phân quyền phải áp trước khi truy cập/truy xuất. A, D, E là thực hành tốt (least privilege, OAuth theo người dùng với scope giới hạn, mã hóa TLS), không phải lỗ hổng.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q6.", "n": 18}, {"cat": "E", "topic": 5, "q": "You are explaining the precedence of Claude Code configuration scopes to the team. Which precedence ordering, from highest to lowest, is correct?", "o": ["Local > managed > user > command-line arguments > project", "Project > user > managed > local > command-line arguments", "Managed > command-line arguments > local > project > user", "User > project > local > command-line arguments > managed"], "a": 2, "sk": ["Which precedence ordering, from highest to lowest, is correct"], "note": "Đáp án: {C}.", "ex": "Thứ tự ưu tiên của các phạm vi cấu hình trong Claude Code được áp dụng từ cao xuống thấp như sau: Managed (Cấu hình quản lý từ doanh nghiệp/tổ chức): Ghi đè mọi thiết lập khác để đảm bảo tính an toàn và chính sách tuân thủ. Command-line arguments (Tham số dòng lệnh): Các cờ (flags) truyền trực tiếp khi khởi chạy lệnh sẽ đè cấu hình tệp cục bộ. Local (Cấu hình tệp cục bộ / tệp cài đặt dự án cá nhân): Áp dụng riêng cho thư mục/phiên làm việc hiện tại. Project (Cấu hình dự án dùng chung): Các thiết lập lưu trong tệp cấu hình của dự án (như .claude.json hoặc cấu hình chia sẻ trong repo). User (Cấu hình người dùng toàn cục): Cấu hình chung cho tài khoản người dùng trên máy (~/.claude.json), có độ ưu tiên thấp nhất.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q107.", "n": 19}, {"cat": "T", "topic": 7, "q": "A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements: (1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\" (2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.\" (3) \"The API integration costs are running 40% over the projected per-transaction budget.\" (4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.\" Which of the following correctly identifies the primary business value pillar each stakeholder statement represents?", "o": ["Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA", "Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4: Performance SLA", "Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4: Efficiency", "Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4: Solution Cost"], "a": 0, "sk": [], "note": "Đáp án: {A}.", "ex": "Đáp án đúng: A. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. A — Đúng: Phương án “Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. B — Sai: Không chọn “Statement 1: Transformation; Statement 2: Efficiency; Statement 3: Performance SLA; Statement 4: Solution Cost” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. C — Sai: Không chọn “Statement 1: Solution Cost; Statement 2: Performance SLA; Statement 3: Transformation; Statement 4: Efficiency” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. D — Sai: Không chọn “Statement 1: Performance SLA; Statement 2: Solution Cost; Statement 3: Efficiency; Statement 4: Transformation” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống.\n(Lưu ý: trong lời giải thích, nội dung các phương án B/C/D bị xáo trộn so với thứ tự hiển thị — nguyên văn từ site.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q19.", "n": 20}, {"cat": "T", "topic": 1, "q": "You are defining escalation criteria for ambiguous cases in an automated workflow. Which set of criteria best supports consistent escalation?", "o": ["No escalation criteria; the model decides independently on every turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags.", "Escalation only after an affected customer has contacted support to complain, after the automated workflow has already completed without human review.", "Escalation at the discretion of whoever is available when the team's on-call engineer has spare capacity, without a defined threshold, category, or ambiguity criterion.", "A confidence score below a defined threshold, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user's explicit request for review."], "a": 3, "sk": ["Which set of criteria best supports consistent escalation"], "note": "Đáp án: {D}.", "ex": "Đáp án: D. Tiêu chí escalation nhất quán phải rõ ràng và đo được: ngưỡng confidence, nhóm quyết định có tác động lớn, cờ mơ hồ từ classifier, và yêu cầu review của chính người dùng. A để mô hình tự quyết không có tiêu chí; B escalation sau khi đã gây hại; C phụ thuộc người rảnh — đều không nhất quán.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q73.", "n": 21}, {"cat": "T", "topic": 1, "q": "A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X produces higher output quality scores but costs $0.18 per documentation session and averages 4.2 seconds per response. Architecture Y scores slightly lower on quality metrics but costs $0.09 per session and averages 2.1 seconds per response. The stated SLA requires responses under 3 seconds, and the annual volume is projected at 2 million documentation sessions. Which evaluation approach correctly applies business value pillar analysis to this decision?", "o": ["Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments.", "Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment.", "Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity.", "Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most."], "a": 2, "sk": ["Which evaluation approach correctly applies business value pillar analysis"], "note": "Đáp án: {C}.", "ex": "Tại sao C đúng: Tiêu chí cứng (Hard constraint): Kiến trúc X mất 4.2 giây/phản hồi, vi phạm SLA bắt buộc (dưới 3 giây), do đó bị loại bỏ ngay lập tức. Phân tích giá trị doanh nghiệp: Sau khi chỉ còn Kiến trúc Y đáp ứng kỹ thuật/SLA, hệ thống đánh giá theo các trụ cột giá trị: tính toán tiết kiệm chi phí ($0.09/phiên × 2 triệu = $180,000/năm) và đánh giá tác động thực tế của việc giảm nhẹ chất lượng đối với năng suất lâm sàng.\nTại sao các đáp án khác sai: A: Bỏ qua việc đánh giá tuân thủ SLA là thiếu sót nghiêm trọng trong kỹ thuật kiến trúc. B: Bỏ qua vi phạm SLA cứng để ưu tiên điểm chất lượng là không hợp lý. D: Kiến trúc X vẫn vi phạm SLA ở các trường hợp phức tạp, nên không thể đưa vào giải pháp hybrid khi SLA là yêu cầu bắt buộc cho toàn bộ hệ thống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q106.", "n": 22}, {"cat": "T", "topic": 4, "q": "You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models empirically. Which two steps must be completed BEFORE running a representative sample on a candidate model? (Select two.) Each correct answer presents part of the solution.", "o": ["Select the lightest model that consistently meets the quality bar across the sample.", "Retest the model choice when a new model version becomes available.", "Choose a candidate model based on the requirements profile and known capabilities.", "Define the quality bar, latency tolerance, and expected volume for the workload.", "Sign off the production rollout plan with the platform and security teams."], "a": [2, 3], "sk": ["Which two steps must be completed BEFORE running a"], "note": "Đáp án: {C} + {D}.", "ex": "Đáp án đúng cho câu Q45 trên trang CertLab là C và D.\nC — Đúng: Cần phải chọn mô hình ứng viên dựa trên hồ sơ yêu cầu và các khả năng đã biết (requirements profile and known capabilities). Đây là bước xác định phạm vi để chọn ra mô hình phù hợp với bài toán trước khi đem đi thử nghiệm thực tế.\nD — Đúng: Cần phải xác định mức chuẩn chất lượng (quality bar), mức độ chịu đựng độ trễ (latency tolerance) và sản lượng dự kiến (expected volume) cho khối lượng công việc. Việc thiết lập các tiêu chí định lượng này là điều kiện tiên quyết để làm thước đo đánh giá kết quả thử nghiệm trên mẫu đại diện.\nLý do các phương án còn lại không chính xác: A: Chọn mô hình nhẹ nhất chỉ để giảm chi phí mà chưa xem xét các yêu cầu kỹ thuật sẽ dẫn đến kết quả thử nghiệm không chính xác hoặc không đáp ứng được yêu cầu công việc. B: Kiểm thử lại khi có phiên bản mô hình mới là bước diễn ra ở chu kỳ bảo trì/tối ưu sau này, không phải bước chuẩn bị trước khi thử nghiệm mô hình ban đầu. E: Phê duyệt kế hoạch triển khai thực tế (rollout plan) chỉ được thực hiện sau khi việc thử nghiệm và đánh giá thực nghiệm đã hoàn tất thành công.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q45.", "n": 23}, {"cat": "T", "topic": 7, "q": "You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. Which two test types should be prioritized to cover both safety under attack and cross-component correctness? (Select two.)", "o": ["Adversarial tests using prompt-injection and malformed-input cases.", "Regression tests against a stable reference set of previously known-good outputs.", "Smoke tests that verify core paths after each deployment.", "Integration tests that verify end-to-end pipeline behavior across all components.", "Unit tests targeting only individual prompt-template rendering logic."], "a": [0, 3], "sk": ["Which two test types should be prioritized to cover"], "note": "Đáp án: {A} + {D}.", "ex": "Đáp án đúng cho câu Q40 trên trang CertLab là A và D.\nA — Đúng: Adversarial tests (kiểm thử đối kháng) đánh giá tính an toàn dưới các cuộc tấn công tấn công (safety under attack) thông qua kỹ thuật chèn prompt (prompt-injection) và dữ liệu đầu vào độc hại/biến dạng.\nD — Đúng: Integration tests (kiểm thử tích hợp) đảm bảo tính chính xác giữa các thành phần (cross-component correctness) bằng cách xác minh hành vi toàn trình (end-to-end) của cả đường ống xử lý dữ liệu.\nLý do các phương án còn lại không chính xác: B: Kiểm thử hồi quy (Regression testing) giúp phát hiện sai lệch so với kết quả cũ nhưng không kiểm tra được khả năng chống chịu tấn công mới hoặc tính chính xác tương tác đa thành phần. C: Smoke testing chỉ kiểm tra các đường đi cốt lõi cơ bản nhất sau khi triển khai, không đủ sâu để đảm bảo an toàn bảo mật hay tính chính xác phức tạp. E: Unit testing ở đây chỉ tập trung vào logic hiển thị của từng template riêng lẻ mà bỏ qua sự tương tác giữa các thành phần trong đường ống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q40.", "n": 24}, {"cat": "E", "topic": 1, "q": "A customer support team has proposed delegating customer refund decisions to a Claude-driven workflow with no human review for refunds under 50 USD. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain. Which Delegation-competency principle should guide your response?", "o": ["Delegation should always include human review on every decision the workflow produces.", "Delegation scope should reflect the type of risk involved, not the transaction size alone.", "Delegation scope should be set primarily by maximizing efficiency gains across the workflow.", "Delegation should be avoided entirely wherever financial transactions occur in the workflow."], "a": 1, "sk": ["Which Delegation-competency principle should guide your response"], "note": "Đáp án: {B}.", "ex": "Tại sao B đúng: Việc đánh giá rủi ro để giao quyền tự động hóa (Delegation competency) không thể chỉ dựa vào một ngưỡng định lượng đơn giản (như số tiền < $50). Hệ thống phải xem xét các loại rủi ro mang tính bản chất (nature of risk) — ví dụ: rủi ro lạm dụng hệ thống, gian lận lặp đi lặp lại, hoặc tác động đến tài khoản khách hàng. Do đó, quyết định giao quyền phải phản ánh bản chất/mức độ rủi ro tổng thể.\nTại sao các đáp án khác sai: A & D: Quá cứng nhắc, phủ nhận hoàn toàn lợi ích của tự động hóa và không thực tế trong các hệ thống quy mô lớn. C: Tối ưu hóa hiệu quả tự động hóa mà bỏ qua quản trị rủi ro sẽ dẫn đến lỗ hổng an ninh và thiệt hại tài chính.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q110.", "n": 25}, {"cat": "E", "topic": 3, "q": "You are designing the prompt for a ticket-triage classifier with thirty well-defined categories and clear category descriptions in the prompt. Which technique is most appropriate as the starting point?", "o": ["A chain-of-thought prompt for a routing decision that does not require multi-step reasoning.", "A zero-shot prompt that specifies the categories with their descriptions and the required output format.", "A prompt that demands the model invent new categories when the supplied ones do not fit.", "A prompt with no category descriptions, expecting the model to infer the category set."], "a": 1, "sk": ["Which technique is most appropriate as the starting point"], "note": "Đáp án: {B}.", "ex": "A clearly defined closed-set classification task should begin with a concise zero-shot prompt containing the permitted categories, unambiguous category descriptions, and the required output structure. This provides a simple, inexpensive baseline that can be measured against a representative evaluation set. Chain-of-thought prompting adds unnecessary latency and token usage when the routing decision does not require substantive multi-step reasoning. Permitting Claude to invent categories would violate the closed-set contract and complicate downstream automation. Omitting descriptions would increase ambiguity among potentially overlapping labels. If evaluation later reveals persistent confusion between particular categories, the architect can introduce targeted examples or refine the definitions. Prompt complexity should be added in response to measured failure patterns, not assumed to be necessary before establishing baseline performance. Anthropic: Prompt engineering overview\n\nNguồn: tệp ccar-p-new-questions.md, Set 3 · Q115.", "n": 26}, {"cat": "E", "topic": 2, "q": "You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?", "o": ["Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.", "Use a separate model call to summarize all 60 tool definitions before each user turn.", "Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability.", "Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task."], "a": 0, "sk": ["Which design pattern best addresses this issue without sacrificing"], "note": "Đáp án: {A}.", "ex": "Tại sao A đúng: Mẫu thiết kế \"progressive tool discovery\" (hoặc dynamic tool loading/tool search) cho phép hệ thống chỉ nạp một tập hợp công cụ cơ bản hoặc nạp danh mục/công cụ theo nhu cầu thực tế của tác vụ. Điều này giúp tối ưu hóa đáng kể chi phí token và giảm độ trễ (latency) ban đầu mà vẫn giữ nguyên khả năng mở rộng truy cập 60 công cụ khi cần.\nTại sao các đáp án khác sai: B: Việc gọi mô hình riêng để tóm tắt định nghĩa công cụ trước mỗi request làm tăng thêm độ trễ và chi phí (thay vì giảm), đồng thời việc tóm tắt có thể làm mất thông tin quan trọng về tham số của công cụ. C: Nạp toàn bộ 60 công cụ mỗi lần không giải quyết được vấn đề tiêu tốn token và tăng độ trễ phản hồi ban đầu. D: Cố định cứng 5 công cụ cố định sẽ làm mất đi khả năng thực hiện các tác vụ thuộc các lĩnh vực kinh doanh khác (giảm phạm vi năng lực của trợ lý).\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q92.", "n": 27}, {"cat": "T", "topic": 1, "q": "You are designing a human-in-the-loop validation workflow for a new Claude-based deployment and must complete the design steps before piloting the workflow with a representative subset of traffic. Which two steps must be completed BEFORE piloting the workflow with a representative subset of traffic? (Select two.) Each correct answer presents part of the solution.", "o": ["Define the sampling strategy and the escalation criteria at each oversight point in the pipeline.", "Iterate the workflow design based on observed pilot findings before broader rollout to production.", "Onboard the reviewer pool with role-specific training on the check criteria and escalation procedures.", "Document the workflow with check criteria, escalation paths, and service-level agreements (SLAs) for each step.", "Identify the decision points in the pipeline that require human oversight by impact and reversibility."], "a": [0, 4], "sk": ["Which two steps must be completed BEFORE piloting the"], "note": "Đáp án: {A} + {E}.", "ex": "Đáp án đúng: A, E. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống.\nA. Define the sampling strategy and the escalation criteria at each oversight point in the pipeline. (Xác định chiến lược lấy mẫu và các tiêu chí leo thang tại mỗi điểm giám sát trong đường ống xử lý.) Đúng: Để bắt đầu chạy thử nghiệm (pilot), bạn phải biết chính xác sẽ chọn dữ liệu nào để gửi cho con người duyệt (sampling strategy) và điều kiện nào sẽ kích hoạt việc chuyển giao xử lý (escalation criteria). Thiếu hai tiêu chí này thì quy trình thử nghiệm không thể vận hành được.\nE. Identify the decision points in the pipeline that require human oversight by impact and reversibility. (Xác định các điểm ra quyết định trong đường ống xử lý cần có sự giám sát của con người dựa trên mức độ ảnh hưởng và khả năng đảo ngược.) Đúng: Đây là bước kiến trúc ban đầu quan trọng nhất: phân tích các điểm rủi ro trong hệ thống dựa trên tác động (impact) và khả năng sửa chữa/đảo ngược (reversibility) để biết vị trí nào bắt buộc phải gắn con người vào kiểm duyệt trước khi chạy thử.\nB. Iterate the workflow design based on observed pilot findings. (Lặp lại việc cải tiến thiết kế quy trình dựa trên các phát hiện quan sát được từ đợt thử nghiệm.) Sai: Bước này diễn ra trong hoặc SAU quá trình thử nghiệm (pilot), không phải là bước chuẩn bị trước khi thử nghiệm.\nC. Onboard the reviewer pool with role-specific training before any traffic is routed. (Đào tạo đội ngũ người kiểm duyệt theo từng vai trò cụ thể trước khi điều hướng bất kỳ lưu lượng truy cập nào.) Sai: Việc đào tạo đội ngũ là bước chuẩn bị triển khai thực tế (operational onboarding), không phải là một bước thuộc giai đoạn \"thiết kế quy trình\" (design steps) cốt lõi trước khi pilot.\nD. Document the workflow with check criteria and publish it to the team wiki. (Tạo tài liệu quy trình cùng các tiêu chí kiểm tra và xuất bản lên wiki của đội ngũ.) Sai: Tài liệu hóa đầy đủ thường được hoàn thiện và cập nhật sau khi quy trình đã được thử nghiệm, tinh chỉnh và chốt phương án chính thức.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q82.", "n": 28}, {"cat": "T", "topic": 7, "q": "You are compiling continuity practices that span the deployment lifecycle. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.", "o": ["Maintain a stakeholder register and notify the listed parties at every phase transition event.", "Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time.", "Archive every phase deliverable in long-term storage to preserve a record of what was produced.", "Capture lessons learned at the end of each phase and surface them as inputs to the next phase.", "Lock decisions made in early phases to prevent revisiting them as later phases begin."], "a": [1, 3], "sk": ["Which two practices belong on the list"], "note": "Đáp án: {B} + {D}.", "ex": "Tại sao B & D đúng: Tính liên tục trong vòng đời triển khai hệ thống AI tập trung vào việc tái sử dụng tài nguyên đánh giá và học hỏi liên tục: B (Liên tục về mặt kỹ thuật/đánh giá): Giữ lại và phát triển tiếp khung đánh giá cùng bộ dữ liệu chuẩn (reference set) qua các phiên bản giúp duy trì tiêu chuẩn đo lường nhất quán và tiết kiệm tài nguyên. D (Liên tục về mặt quy trình): Thu thập bài học kinh nghiệm sau mỗi giai đoạn và chuyển giao làm đầu vào cho giai đoạn sau giúp hệ thống và quy trình ngày càng hoàn thiện hơn.\nTại sao các đáp án khác sai: A & C: Là các hoạt động quản lý dự án/hồ sơ hành chính thông thường, không mang tính cốt lõi đóng góp vào tính liên tục của giải pháp AI. E: Cố định quyết định và không cho phép xem xét lại khi hoàn cảnh thay đổi đi ngược lại nguyên tắc linh hoạt (agility) và quản trị kiến trúc hiện đại (ADR).\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q113.", "n": 29}, {"cat": "T", "topic": 1, "q": "A Claude architect is leading the discovery phase for a new AI-powered customer service solution. Which two activities are characteristic of structured discovery and requirement gathering for a Claude-based deployment? (Select two.)", "o": ["Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins.", "Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected.", "Generating an initial prototype and iterating based on user reaction rather than written requirements.", "Documenting explicit success criteria and failure thresholds that will gate production depl
