oyment.", "Deferring constraint documentation until the integration design phase to avoid scope creep."], "a": [0, 3], "sk": ["Which two activities are characteristic of structured discovery and"], "note": "Đáp án: {A} + {D}.", "ex": "Tại sao A & D đúng: Trong giai đoạn khám phá và xác định yêu cầu chuẩn hóa: A: Việc trao đổi sớm với các bên liên quan để làm rõ các giới hạn về độ trễ (latency), độ chính xác (accuracy) và tuân thủ (compliance) là cần thiết để định hình đúng phạm vi dự án. D: Việc thiết lập sẵn các tiêu chí thành công (success criteria) và ngưỡng thất bại (failure thresholds) giúp tạo cổng kiểm soát chất lượng rõ ràng cho việc phát hành sản phẩm.\nTại sao các đáp án khác sai: B: Chọn mô hình và hạ tầng trước khi có yêu cầu là đi ngược lại quy trình thiết kế kiến trúc chuẩn. C & E: Việc trì hoãn lấy ý kiến hoặc hoãn ghi nhận các ràng buộc kỹ thuật đến sau sprint 1 sẽ dễ dẫn đến việc làm lại (rework) và đi sai hướng kiến trúc ban đầu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q108.", "n": 30}, {"cat": "T", "topic": 5, "q": "You are integrating Claude Code into a team workflow and must complete the design and configuration steps before piloting the integrated workflow with a small group. Which two steps must be completed BEFORE piloting the integrated workflow? (Select two.) Each correct answer presents part of the solution.", "o": ["Document the integrated workflow with handoff criteria, permission boundaries, and on-call runbooks.", "Identify the workflow steps where AI-assisted tooling adds value and where human authority must remain.", "Negotiate the workflow change with affected teams and obtain formal sign-off from each manager.", "Iterate the integrated workflow based on pilot findings before broader rollout to the team.", "Configure the project-scope MCP servers, permissions, subagents, and persistent project context."], "a": [1, 4], "sk": ["Which two steps must be completed BEFORE piloting the"], "note": "Đáp án: {B} + {E}.", "ex": "Tại sao B & E đúng: B (Thiết kế luồng công việc): Bạn cần xác định ranh giới rõ ràng về trách nhiệm (nơi nào AI hỗ trợ và nơi nào con người giữ quyền quyết định/kiểm duyệt) trước khi cho nhóm nhỏ dùng thử để tránh rủi ro vi phạm quy trình hoặc mất kiểm soát. E (Cấu hình kỹ thuật): Để giai đoạn thử nghiệm (pilot) diễn ra suôn sẻ, hạ tầng kỹ thuật trực tiếp của dự án (MCP servers, permissions, subagents, CLAUDE.md/context) phải được thiết lập xong.\nTại sao các đáp án khác sai: A & C: Việc xuất bản tài liệu hoàn chỉnh chính thức hoặc xin phê duyệt toàn bộ từ tất cả các bên liên quan thường chỉ thực hiện khi chuẩn bị triển khai chính thức trên diện rộng (full rollout), sau khi đã có dữ liệu thực tế từ đợt pilot. D: Việc \"tinh chỉnh dựa trên kết quả thử nghiệm\" diễn ra trong và sau giai đoạn pilot, không thể thực hiện trước khi pilot bắt đầu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q100.", "n": 31}, {"cat": "T", "topic": 6, "q": "You are responding to an adversarial input pattern in which users include text claiming admin authority and instructing the model to bypass safety restrictions. Which combination of controls most effectively mitigates this attack pattern?", "o": ["Trusting that the model will intrinsically recognize and reject all bypass attempts without prompt-level instructions, runtime classifiers, scoped permissions, or audit logging.", "Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts.", "Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs.", "Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification."], "a": 1, "sk": ["Which combination of controls most effectively mitigates this attack"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng: B. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. A — Sai: Không chọn “Trusting that the model will intrinsically recognize and reject all bypass attempts without additional controls.” vì cách diễn đạt tuyệt đối hoặc phạm vi quá rộng làm tăng rủi ro và bỏ qua yêu cầu kiểm soát theo ngữ cảnh. B — Đúng: Phương án “Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. C — Sai: Không chọn “Removing all safety restrictions so there is nothing for the adversary to bypass.” vì cách diễn đạt tuyệt đối hoặc phạm vi quá rộng làm tăng rủi ro và bỏ qua yêu cầu kiểm soát theo ngữ cảnh. D — Sai: Không chọn “Granting users any privilege level they assert in their message content.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q25.", "n": 32}, {"cat": "T", "topic": 5, "q": "You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's conventions and architecture in every session. Which adjustment most directly removes this inefficiency?", "o": ["Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all AI-assisted development productivity for this codebase.", "Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically.", "Tell each engineer to retype the project conventions and architecture context more quickly at the start of each session, reducing time lost without eliminating the repeated manual effort.", "Remove all documented project conventions and architectural standards so engineers have nothing to re-explain at session start, accepting the loss of consistency and shared coding standards."], "a": 1, "sk": ["Which adjustment most directly removes this inefficiency"], "note": "Đáp án: {B}.", "ex": "Tại sao B đúng: Tệp CLAUDE.md đặt ở thư mục gốc của repository đóng vai trò là nguồn ngữ cảnh cố định (persistent context file). Claude Code sẽ tự động đọc tệp này mỗi khi bắt đầu phiên mới, giúp tự động truyền tải các quy chuẩn coding, kiến trúc, và chỉ dẫn vận hành mà không cần con người phải nhắc lại thủ công.\nTại sao các đáp án khác sai: A, C, D: Không phải là giải pháp kỹ thuật hợp lý (C cấm đoán loại bỏ công cụ, C giữ nguyên điểm bất hợp lý, D phá bỏ hoàn toàn quy chuẩn của dự án).\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q111.", "n": 33}, {"cat": "E", "topic": 4, "q": "You are designing a content moderation classifier that processes high volumes of usergenerated comments under a tight per-message latency budget using well-defined classification labels. Which model selection best aligns with the workload?", "o": ["Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity.", "Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth.", "Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict.", "Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling."], "a": 1, "sk": ["Which model selection best aligns with the workload"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng cho câu Q53 trên trang Active Exam — CertLab là B.\nB — Đúng: Haiku là lựa chọn tối ưu cho tác vụ phân loại kiểm duyệt nội dung (content moderation) với khối lượng bình luận lớn và nhãn phân loại đã được xác định rõ. Cấu trúc chi phí thấp và độ trễ phản hồi cực nhỏ của Haiku hoàn toàn đáp ứng ngân sách độ trễ khắt khe (tight per-message latency budget) mà không đòi hỏi khả năng suy luận quá sâu.\nLý do các phương án còn lại không chính xác: A: Opus có chi phí và độ trễ rất cao, không phù hợp cho tác vụ kiểm duyệt lượng lớn dữ liệu ngắn với các nhãn cố định. C: Sonnet cung cấp sự cân bằng tốt cho nhiều tác vụ chung, nhưng đối với tác vụ phân loại đơn giản số lượng lớn, Haiku hiệu quả hơn vượt trội về cả tốc độ lẫn chi phí. D: Bật tính năng suy luận mở rộng (extended thinking) làm tăng đáng kể thời gian phản hồi (latency), đi ngược lại yêu cầu về ngân sách độ trễ của hệ thống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q53.", "n": 34}, {"cat": "T", "topic": 7, "q": "You are responding to a stakeholder request that adds significant scope to a deployment already in flight. Which response best aligns expectations while respecting the stakeholder's underlying need?", "o": ["Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications.", "Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension.", "Acknowledge the request, describe the scope and timeline implications transparently, and propose options—defer it, descope something else, or extend the timeline—for the stakeholder to choose.", "Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays."], "a": 2, "sk": ["Which response best aligns expectations while respecting the stakeholder's"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng là C.\nC — Đúng: Xác nhận yêu cầu, mô tả minh bạch tác động về phạm vi và thời gian, đồng thời đề xuất các tùy chọn (hoãn lại, giảm bớt tính năng khác, hoặc lùi thời hạn) để bên liên quan lựa chọn. Phương án này đáp ứng đúng nguyên tắc quản lý dự án: tôn trọng nhu cầu của stakeholder nhưng vẫn minh bạch về nguồn lực và thời gian.\nLý do các phương án còn lại không chính xác: A: Giấu giếm yêu cầu thay đổi phạm vi với nhóm triển khai sẽ gây bất ngờ tiêu cực, mất lòng tin và làm rối loạn kế hoạch làm việc của nhóm. B: Bác bỏ ngay lập tức mà không thảo luận sẽ làm ảnh hưởng xấu đến mối quan hệ hợp tác với stakeholder và bỏ lỡ cơ hội tìm giải pháp dung hòa. D: Chấp nhận ngay phạm vi phát sinh mà không làm rõ tác động đến tiến độ hay cắt giảm tính năng khác sẽ dẫn đến rủi ro vỡ tiến độ (delay) và quá tải nguồn lực.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q55.", "n": 35}, {"cat": "T", "topic": 7, "q": "You are producing an architecture guide for a new deployment and must complete the planning steps before drafting each section. Which two steps must be completed BEFORE drafting each section of the guide? (Select two.) Each correct answer presents part of the solution.", "o": ["Identify the audience and the questions the guide must answer for that audience.", "Translate the guide into the supported regional languages before drafting.", "Validate the guide with the implementation team and incorporate corrections.", "Establish the document under version control and assign a review cadence.", "Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations."], "a": [0, 4], "sk": ["Which two steps must be completed BEFORE drafting each"], "note": "Đáp án: {A} + {E}.", "ex": "Đáp án đúng: A, E. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. A — Đúng: Phương án này là bước chuẩn bị cần hoàn tất trước khi thực thi: “Identify the audience and the questions the guide must answer for that audience.”. Nó thiết lập đầu vào, tiêu chí hoặc phạm vi cần thiết để bước sau có thể được đánh giá đúng. B — Sai: Không chọn “Translate the guide into the supported regional languages before drafting.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. C — Sai: Không chọn “Validate the guide with the implementation team and incorporate corrections.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. D — Sai: Không chọn “Establish the document under version control and assign a review cadence.” vì đây là hoạt động đánh giá hoặc ra quyết định sau khi đã thực thi, không phải bước chuẩn bị được câu hỏi yêu cầu. E — Đúng: Phương án này là bước chuẩn bị cần hoàn tất trước khi thực thi: “Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations.”. Nó thiết lập đầu vào, tiêu chí hoặc phạm vi cần thiết để bước sau có thể được đánh giá đúng.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q16.", "n": 36}, {"cat": "T", "topic": 7, "q": "You are listing characteristics of strong architectural-decision communication. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.", "o": ["Ownership and review cadence for revisiting the decision when conditions or assumptions change.", "Distribution to a standing review forum with mandatory attendance from senior engineering leaders.", "Omission of rejected alternatives to keep the decision document focused and concise for readers.", "Alternatives considered along with the criteria that were used to evaluate each alternative.", "Use of a consistent template across the team to standardize the visual presentation of decisions."], "a": [0, 3], "sk": ["Which two characteristics belong on the list"], "note": "Đáp án: {A} + {D}.", "ex": "Đáp án đúng: A, D. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. A — Đúng: Phương án “Ownership and review cadence for revisiting the decision when conditions or assumptions change.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. B — Sai: Không chọn “Distribution to a standing review forum regardless of decision scope or audience.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. C — Sai: Không chọn “Omission of rejected alternatives to keep the document concise.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. D — Đúng: Phương án “Alternatives considered along with the criteria that were used to evaluate each alternative.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. E — Sai: Không chọn “Use of a consistent template that all decision authors follow across the organization.” vì cách diễn đạt tuyệt đối hoặc phạm vi quá rộng làm tăng rủi ro và bỏ qua yêu cầu kiểm soát theo ngữ cảnh.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q102.", "n": 37}, {"cat": "T", "topic": 3, "q": "You are evaluating retrieval-strategy claims used by a peer team. For each claim, select yes if the statement is generally accurate. Otherwise, select no.", "o": ["Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text.", "Sparse term-matching retrieval recovers exact terms (such as identifiers and rare tokens) more reliably than dense alone.", "Structured query retrieval is the right fit for filter-and-aggregate workloads against a relational store with schema and indexes.", "Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics.", "Random sampling of a data store is a sound retrieval strategy for production Q&A."], "a": [0, 1, 2], "sk": ["the statement is generally accurate"], "note": "Yes: {A} + {B} + {C} · No: {D} + {E}.", "ex": "Đúng (Yes): A, B, C. Sai (No): D, E.\nA — Yes: Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text.\nB — Yes: Sparse term-matching retrieval recovers exact terms (such as identifiers and rare tokens) more reliably than dense alone.\nC — Yes: Structured query retrieval is the right fit for filter-and-aggregate workloads against a relational store with schema and indexes.\nD — No: Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics.\nE — No: Random sampling of a data store is a sound retrieval strategy for production Q&A.\n\nĐánh giá từng phát biểu: mỗi dòng được chấm độc lập theo mức độ chính xác của nhận định. A — Yes: ... Yes, vì nhận định này mô tả đúng đặc tính hoặc thông lệ phù hợp trong bối cảnh được hỏi. B — Yes (tương tự). C — Yes (tương tự). D — No, vì nhận định này khái quát sai, đánh đồng các khái niệm hoặc đề xuất một cách làm không đáng tin cậy trong thực tế. E — No (tương tự).\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q17.", "n": 38, "yn": 1}, {"cat": "T", "topic": 7, "q": "A pilot AI assistant for procurement specialists shows 89 percent first-response acceptance, but follow-up surveys reveal that specialists frequently override the assistant’s vendor recommendations after considering criteria the assistant did not evaluate. The pilot owner wants to ship the assistant unchanged because of the strong acceptance rate. Which two Discernment-competency observations should you raise BEFORE approving the launch? (Select two.)", "o": ["The acceptance rate alone proves readiness for general production use.", "The survey response rate may not be statistically representative of all specialists.", "The unconsidered criteria represent a scope gap in the assistant's input space.", "Acceptance does not establish whether recommendations remain correct after specialist review.", "The pilot duration was probably too short to demonstrate reliability across the full year."], "a": [2, 3], "sk": ["Which two Discernment-competency observations should you raise BEFORE approving"], "note": "Đáp án: {C} + {D}.", "ex": "C và D. C — Đúng: Việc các chuyên gia thường xuyên ghi đè (override) khuyến nghị cho thấy trợ lý AI đang thiếu sót các tiêu chí đánh giá quan trọng trong không gian đầu vào (input space), dẫn đến khoảng trống về phạm vi (scope gap) cần phải được giải quyết trước khi triển khai đại trà. D — Đúng: Tỷ lệ chấp thuận ban đầu cao (89%) không đồng nghĩa với việc các khuyến nghị thực sự chính xác hoặc tối ưu sau khi đã qua bước kiểm tra và cân nhắc kỹ lưỡng từ chuyên gia nhân sự/mua sắm.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q33.", "n": 39}, {"cat": "E", "topic": 7, "q": "You must present an architectural recommendation to deploy a Claude-based contract review assistant to a steering committee that includes the CFO, the general counsel, and the CIO. Each stakeholder cares about different aspects of the decision. How should you structure the recommendation document?", "o": ["Lead with the technical architecture diagram and the full component list before any other section.", "Lead with detailed cost projections across the full multi-year horizon before the rationale section.", "Present the same dense narrative throughout with no stakeholder differentiation in any section.", "Lead with the architectural decision, then address each stakeholder's primary concerns directly."], "a": 3, "sk": ["How should you structure the recommendation document"], "note": "Đáp án: {D}.", "ex": "Tại sao D đúng: Khi trình bày đề xuất cho cấp lãnh đạo (C-suite), phương pháp hiệu quả nhất là nêu ngay quyết định/khuyến nghị cốt lõi ở phần tóm tắt (Executive Summary). Sau đó, tài liệu cần đi vào chi tiết giải quyết trực tiếp các mối quan tâm trọng tâm của từng stakeholder: CFO: Chi phí, ROI, mô hình thanh toán token/API. General Counsel: Bảo mật dữ liệu, quyền riêng tư, tuân thủ pháp lý và độ chính xác của hợp đồng. CIO: Bán hạ tầng, tích hợp hệ thống, khả năng mở rộng (scalability) và tính bảo mật kỹ thuật.\nTại sao các đáp án khác sai: A & B: Chỉ tập trung thiên vị mối quan tâm của một người (CIO hoặc CFO) và đẩy phần của những người khác xuống cuối, khiến tài liệu thiếu cân bằng. C: Bị thiếu tính cá nhân hóa và gây khó theo dõi cho người đọc.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q88.", "n": 40}, {"cat": "T", "topic": 3, "q": "An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures. Which two investigative steps most directly isolate the root cause? (Select two.)", "o": ["Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes.", "Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window.", "Switch to a different Claude model tier to rule out provider-side changes as a contributing factor.", "Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures.", "Replay a set of pre-maintenance requests against the current configuration and inspect the raw model output before downstream parsing."], "a": [1, 4], "sk": ["Which two investigative steps most directly isolate the root"], "note": "Đáp án: {B} + {E}.", "ex": "Đáp án đúng: B, E. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. A — Sai: Không chọn “Clear the prompt cache and retry to rule out a stale cache as the source.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. B — Đúng: Phương án “Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. C — Sai: Không chọn “Switch to a different Claude model tier to work around the malformed output.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. D — Sai: Không chọn “Increase the max_tokens limit to allow longer responses.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. E — Đúng: Phương án “Replay a set of pre-maintenance requests against the current configuration and inspect the raw model output before downstream parsing.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q26.", "n": 41}, {"cat": "E", "topic": 1, "q": "When the support agent invokes escalate_to_human, human agents report they must re-read the entire raw conversation to understand each case, and average handle time for escalated tickets has risen. What should the agent do at the moment of escalation to fix this?", "o": ["Attach the full untrimmed transcript of the conversation so the human has complete information.", "Enable extended thinking on the escalation turn so the model reasons longer before handing off.", "Escalate earlier in ambiguous cases so humans receive tickets before much conversation has accumulated.", "Produce a structured handoff summary — the customer's issue, verified identifiers, tool results and account state gathered, actions already attempted, and the specific recommended next step."], "a": 3, "sk": ["When the support agent invokes escalate_to_human, human agents report"], "note": "Đáp án: {D}.", "ex": "Why D is correct. Effective human handoff requires a structured summary that front-loads exactly what the human needs: the problem, confirmed identifiers, what was tried, and a recommendation. That is what removes the re-reading burden and shortens handle time. Dumping the full transcript (A) is the current failure mode — it forces the human to reconstruct the case themselves. Extended thinking (B) improves the model's own reasoning but produces no artifact for the human. Escalating earlier (C) changes when tickets arrive, not the missing information problem, and would likely lower first-contact resolution.\n\nNguồn: tệp ccar-p-new-questions.md, Set 3 · Q120.", "n": 42}, {"cat": "T", "topic": 7, "q": "A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles. Which two metrics directly address these requirements? (Select two.)", "o": ["BLEU score computed against a human-annotated reference summary set.", "Role-based access-control enforcement rate measured on a red-team dataset.", "Throughput measured as successful requests processed per minute.", "Per-query token cost measured against the defined cost ceiling.", "Response latency at the 95th percentile across a one-week sample window."], "a": [1, 3], "sk": ["Which two metrics directly address these requirements"], "note": "Đáp án: {B} + {D}.", "ex": "B. Role-based access-control enforcement rate measured on a red-team dataset. (Tỷ lệ thực thi kiểm soát truy cập dựa trên vai trò (RBAC) được đo lường trên tập dữ liệu red-team.) Đúng: Đáp ứng trực tiếp yêu cầu bảo mật/quyền truy cập (\"không bao giờ tiết lộ dữ liệu bệnh nhân cho các vai trò không được cấp phép\"). Việc kiểm thử red-team giúp đo lường chính xác khả năng ngăn chặn rò rỉ dữ liệu của hệ thống.\nD. Per-query token cost measured against the defined cost ceiling. (Chi phí token trên mỗi truy vấn được đo lường so với mức chi phí trần đã xác định.) Đúng: Đáp ứng trực tiếp yêu cầu chi phí (\"nằm trong mức chi phí trần cho mỗi truy vấn\").\nA. BLEU score ... (Điểm BLEU được tính toán dựa trên tập tóm tắt tham chiếu do con người gán nhãn.) Sai: Điểm BLEU dùng để đánh giá chất lượng/độ tương đồng ngôn ngữ của bản tóm tắt, không đo lường chi phí hay kiểm soát truy cập dữ liệu.\nC. Throughput ... (Sản lượng xử lý được đo bằng số yêu cầu thành công trên mỗi phút.) Sai: Chỉ số này đo lường hiệu năng/tải của hệ thống (performance/throughput), không giải quyết yêu cầu về trần chi phí hay bảo mật thông tin bệnh nhân.\nE. Response latency ... (Độ trễ phản hồi ở bách phân vị thứ 95 trong cửa sổ mẫu một tuần.) Sai: Đây là chỉ số đo lường độ trễ (latency), không liên quan đến chi phí token hay quyền truy cập dữ liệu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q75.", "n": 43}, {"cat": "T", "topic": 6, "q": "An architect is reviewing a Claude-based candidate-screening tool prior to deployment. A stakeholder asserts that because the model was not trained on company data, no bias evaluation is necessary. Which two responses most accurately challenge this assertion? (Select two.)", "o": ["Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation.", "Fairness testing is required only when the training dataset is known to contain protected-class labels.", "The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning.", "The system should be evaluated on outcome-disparity metrics across protected groups before deployment.", "Bias evaluation is unnecessary when the model provider has published a responsible-use policy."], "a": [2, 3], "sk": ["Which two responses most accurately challenge this assertion"], "note": "Đáp án: {C} + {D}.", "ex": "Đáp án đúng cho câu hỏi trên là C và D.\nC — Đúng: Mặc dù mô hình chưa được huấn luyện trực tiếp trên dữ liệu nội bộ của công ty, nó vẫn mang theo các thành kiến nhân khẩu học (demographic biases) từ giai đoạn tiền huấn luyện (pretraining). Những thành kiến này có thể xuất hiện trong kết quả sàng lọc ứng viên bất kể việc tinh chỉnh (fine-tuning) sau đó.\nD — Đúng: Trước khi đưa hệ thống vào triển khai thực tế trong quy trình nhân sự, hệ thống cần phải được kiểm định định lượng thông qua các chỉ số chênh lệch kết quả (outcome-disparity metrics) trên các nhóm đối tượng được bảo vệ (protected groups) nhằm đảm bảo sự công bằng.\nLý do các phương án còn lại không chính xác: A: Việc công khai thông tin rằng hệ thống AI đang được sử dụng không thể thay thế cho các nghĩa vụ kiểm tra, đánh giá chất lượng và công bằng của mô hình. B: Kiểm tra tính công bằng không chỉ giới hạn ở việc tập dữ liệu huấn luyện có chứa nhãn lớp được bảo vệ hay không, vì sự thiên vị vẫn có thể phát sinh từ mối quan hệ tương quan ẩn trong dữ liệu. E: Chính sách sử dụng có trách nhiệm từ nhà cung cấp mô hình không miễn trừ trách nhiệm cho tổ chức triển khai trong việc tự đánh giá rủi ro và thiên vị đối với trường hợp sử dụng cụ thể của họ.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q30.", "n": 44}, {"cat": "T", "topic": 7, "q": "A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency. Which two actions most directly address stakeholder expectation alignment in this situation? (Select two.)", "o": ["Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data.", "Pause all development until latency concerns are fully resolved.", "Communicate that latency concerns are a known LLM limitation that cannot be addressed.", "Replace the current Claude model with a third-party model to signal responsiveness.", "Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints."], "a": [0, 4], "sk": ["Which two actions most directly address stakeholder expectation alignment"], "note": "Đáp án: {A} + {E}.", "ex": "Đáp án đúng: A, E. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. A — Đúng: Phương án “Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết. B — Sai: Không chọn “Pause all development until latency concerns are fully resolved.” vì cách diễn đạt tuyệt đối hoặc phạm vi quá rộng làm tăng rủi ro và bỏ qua yêu cầu kiểm soát theo ngữ cảnh. C — Sai: Không chọn “Communicate that latency concerns are a known LLM limitation that cannot be addressed.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. D — Sai: Không chọn “Replace the current Claude model with a third-party model to signal responsiveness.” vì phương án này không đáp ứng đầy đủ điều kiện trọng tâm, xử lý sai giai đoạn hoặc tạo ra đánh đổi không phù hợp với mục tiêu của tình huống. E — Đúng: Phương án “Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints.” phù hợp với nguyên tắc được kiểm tra và xử lý đúng trọng tâm của tình huống mà không mở rộng phạm vi không cần thiết.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q4.", "n": 45}, {"cat": "T", "topic": 7, "q": "You are designing a feedback session for a deployment in flight. Which structure best supports productive stakeholder feedback?", "o": ["Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward.", "Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates.", "Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real time without preparation before the discussion begins.", "End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward."], "a": 1, "sk": ["Which structure best supports productive stakeholder feedback"], "note": "Đáp án: {B}.", "ex": "B — Đúng: Xác định chương trình nghị sự rõ ràng (focused agenda), chia sẻ trước các tài liệu/kết quả (share artifacts in advance), ghi nhận các quyết định và kế hoạch theo dõi bằng văn bản, đồng thời xác nhận người chịu trách nhiệm và thời hạn hoàn thành. Đây là cấu trúc chuẩn chỉnh nhất giúp buổi họp phản hồi đạt hiệu quả cao và có tính hành động thực tế.\nLý do các phương án còn lại không chính xác: A: Tổ chức một cuộc họp mở không có chương trình nghị sự và không ghi chép lại sẽ làm cuộc họp lan man, thiếu tập trung và không đi đến kết quả cụ thể. C: Việc gửi tài liệu ngay tại thời điểm bắt đầu buổi họp khiến các bên liên quan không có thời gian đọc và chuẩn bị ý kiến đóng góp chất lượng. D: Kết thúc buổi họp mà không ghi nhận quyết định hay phân công người theo dõi sẽ làm mất đi giá trị của buổi thu thập phản hồi, dẫn đến việc không có hành động cải thiện nào được thực hiện sau đó.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q47.", "n": 46}, {"cat": "E", "topic": 5, "q": "A Claude architect needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is set. Which configuration scope correctly enforces this requirement?", "o": ["User scope (~/.claude/settings.json) on each engineer's machine.", "Environment variable defined in the CI/CD pipeline only.", "Managed configuration applied centrally and marked as non-overridable.", "Project scope (.claude/settings.json) committed to the repository."], "a": 2, "sk": ["Which configuration scope correctly enforces this requirement"], "note": "Đáp án: {C}.", "ex": "Đáp án C (Đúng): Để ngăn chặn việc cá nhân kỹ sư tự ý ghi đè hoặc tắt các thiết lập bảo mật ở máy cục bộ hay dự án, hệ thống cần một cơ chế Managed configuration áp dụng tập trung (chẳng hạn qua policy của tổ chức) và có thuộc tính khóa/không thể ghi đè (non-overridable).\nCác đáp án sai: A & D sai vì file cấu hình ở User scope (~/.claude/settings.json) hoặc Project scope trong repository đều có thể bị kỹ sư dễ dàng chỉnh sửa hoặc sửa đổi cục bộ trên máy của họ. B sai vì chỉ cấu hình trong CI/CD pipeline thì không bảo vệ hoặc bắt buộc được các thao tác/môi trường phát triển cục bộ (local development environment) của kỹ sư.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q68.", "n": 47}, {"cat": "T", "topic": 6, "q": "You are building an ethics-review checklist for deployments supported by artificial intelligence. Which two checks belong on the list? (Select two.) Each correct answer presents a complete solution.", "o": ["Confirm that vendor licensing terms permit the planned production use of the model.", "Verify that outputs do not rely on generalizations about people that the underlying data does not support.", "Confirm that high-impact decisions retain human accountability rather than being attributed to the model.", "Restrict ethics review to outputs that exceed a defined model-confidence threshold.", "Confirm that latency and throughput targets are met across supported user populations."], "a": [1, 2], "sk": ["Which two checks belong on the list"], "note": "Đáp án: {B} + {C}.", "ex": "B — Đúng: Đây là tiêu chuẩn kiểm tra cốt lõi về tính công bằng, thiên vị (bias) và phòng tránh định kiến. Đảm bảo AI không tự đưa ra các giả định hay khái quát hóa sai lệch về con người (như giới tính, chủng tộc, độ tuổi...) khi dữ liệu không hỗ trợ là yếu tố cơ bản trong đánh giá đạo đức AI. C — Đúng: Nguyên tắc \"Human-in-the-loop\" (Con người tham gia vào quy trình quyết định) và giữ lại trách nhiệm giải trình của con người (human accountability) đối với các quyết định quan trọng (như tài chính, y tế, pháp lý, nhân sự) là một trong những trụ cột đạo đức quan trọng nhất khi triển khai AI.\nLý do các phương án còn lại không chính xác: A: Kiểm tra giấy phép nhà cung cấp thuộc phạm vi Pháp lý và Tuân thủ (Legal & Compliance), không phải là đánh giá đạo đức AI. D: Các vấn đề đạo đức (như thiên vị hoặc đưa ra thông tin độc hại) vẫn có thể xảy ra ngay cả khi mô hình có độ tự tin cao. Do đó, việc giới hạn đánh giá theo ngưỡng tin cậy sẽ bỏ sót nhiều rủi ro nghiêm trọng. E: Đảm bảo độ trễ và sản lượng là tiêu chuẩn về Hiệu năng kỹ thuật (Engineering Performance), không phải tiêu chuẩn đạo đức.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q57.", "n": 48}, {"cat": "T", "topic": 5, "q": "The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries. The Skill includes the firm’s required disclaimers and prohibited-language list. A product manager has asked whether additional guardrails are needed at the application layer or whether the Skill alone is sufficient. Which two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.) Each correct answer presents part of the solution.", "o": ["Log every generated summary to the firm's compliance audit trail for retention.", "Verify the requesting user is authorized to generate investment summaries at all.", "Format output sections according to the firm's standardized house style guidelines.", "Apply the disclaimer template that the compliance team has standardized firm-wide.", "Apply the prohibited-language list that the compliance team maintains and updates."], "a": [0, 1], "sk": ["Which two guardrail responsibilities should remain at the application"], "note": "Đáp án: {A} + {B}.", "ex": "Tại sao A & B đúng: Các tác vụ kiểm soát truy cập (Authentication/Authorization) và kiểm toán (Auditing/Logging) bắt buộc phải do tầng ứng dụng (application layer) đảm nhận. Mô hình LLM hay Claude Skill không thể tự đảm bảo tính xác thực của quyền người dùng, cũng như không thể đảm bảo việc ghi log diễn ra đáng tin cậy 100% không bị bỏ sót hoặc can thiệp.\nTại sao các đáp án khác sai: C, D, E: Định dạng văn bản, thêm mẫu miễn trừ trách nhiệm (disclaimer) hoặc tuân thủ danh sách từ ngữ cấm/phong cách viết hoàn toàn có thể được định cấu hình trực tiếp bên trong prompt system hoặc quy tắc xử lý văn bản của Claude Skill.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q93.", "n": 49}, {"cat": "E", "topic": 1, "q": "You are distinguishing functional from non-functional requirements during discovery. Which item is a non-functional requirement?", "o": ["The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record.", "The system must produce a draft response that a human reviewer can edit before sending.", "The system must classify inbound tickets into a defined set of categories.", "The system must respond at p95 latency under 800 milliseconds at the expected request volume."], "a": 3, "sk": ["Which item is a non-functional requirement"], "note": "Đáp án: {D}.", "ex": "Đáp án đúng: D. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, C — Sai; D — Đúng; mỗi mục lặp lại nội dung phương án kèm lý do chung \"không đáp ứng đầy đủ điều kiện trọng tâm…\" — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q31.", "n": 50}, {"cat": "E", "topic": 7, "q": "You are documenting an architectural decision to support future audit and onboarding. Which artifact is the strongest fit?", "o": ["A slide deck in a presentation folder with no accompanying written rationale.", "A code comment in a single file that contains an opinion of one engineer.", "An Architecture Decision Record that states the context, the decision, the alternatives considered, the consequences, and the date and authors.", "A short verbal note shared during a hallway conversation with no written record."], "a": 2, "sk": ["Which artifact is the strongest fit"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, D — Sai; C — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q85.", "n": 51}, {"cat": "T", "topic": 6, "q": "The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. Which two design decisions should you include? (Select two.) Each correct answer presents part of the solution.", "o": ["Package the procedure as a Claude Skill owned directly by the compliance team.", "Embed the procedure text into each workflow's system prompt at integration time.", "Store the procedure in a shared retrieval corpus accessible to each workflow independently.", "Have each workflow team rewrite the procedure for its own context.", "Reference the same Claude Skill from all three workflow integrations."], "a": [0, 4], "sk": ["Which two design decisions should you include"], "note": "Đáp án: {A} + {E}.", "ex": "Tại sao A & E đúng: Để đảm bảo quy trình được áp dụng đồng nhất (identically) và dễ dàng cập nhật/quản trị: A: Việc đóng gói quy trình thành một Claude Skill do chính đội ngũ tuân thủ sở hữu sẽ giúp đảm bảo tính chính xác, đúng chuẩn pháp lý và là nơi duy nhất quản lý nguồn tri thức này (single source of truth). E: Cả 3 quy trình (Customer Service, Sales, Onboarding) chỉ cần tham chiếu (reference) tới cùng một Skill này. Khi có thay đổi về quy định, đội tuân thủ chỉ cần cập nhật Skill một lần duy nhất, tất cả các hệ thống sẽ tự động cập nhật theo mà không bị lệch chuẩn.\nTại sao các đáp án khác sai: B & D: Nhúng cứng (embed) vào từng system prompt hoặc để từng nhóm tự viết lại sẽ dẫn đến tình trạng phân tán thông tin, bất đồng bộ khi quy định thay đổi và khó kiểm soát tuân thủ. C: Lưu trữ trong tập dữ liệu truy xuất (RAG) không đảm bảo tính thực thi chính xác từng bước như một Skill/Tool được định nghĩa rõ ràng.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q112.", "n": 52}, {"cat": "T", "topic": 6, "q": "A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations. Which two guardrail implementations most directly enforce this constraint? (Select two.)", "o": ["Increase response temperature to introduce variability that reduces the likelihood of specific recommendations.", "Add an output classifier that detects and blocks responses containing regulated investment recommendation language.", "Limit session length to reduce the volume of queries processed per user per day.", "Log all user queries to a SIEM for post-hoc compliance review.", "Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests."], "a": [1, 4], "sk": ["Which two guardrail implementations most directly enforce this constraint"], "note": "Đáp án: {B} + {E}.", "ex": "B — Đúng: Thêm một output classifier giúp phát hiện và chặn các phản hồi chứa ngôn từ tư vấn đầu tư trước khi thông tin được gửi tới người dùng. Đây là biện pháp kiểm soát trực tiếp ở đầu ra (output guardrail). E — Đúng: Định nghĩa rõ ràng các danh mục ngoài phạm vi (out-of-scope) trong system prompt đi kèm câu từ chối cố định đối với các yêu cầu tư vấn đầu tư. Đây là biện pháp kiểm soát trực tiếp ở đầu vào (input/prompt guardrail) giúp định hướng hành vi của mô hình.\nLý do các phương án còn lại không chính xác: A: Tăng temperature làm tăng tính ngẫu nhiên của câu trả lời, điều này không những không ngăn chặn mà còn làm tăng rủi ro mô hình sinh ra thông tin tư vấn không kiểm soát. C: Giới hạn độ dài phiên làm việc không trực tiếp ngăn chặn mô hình đưa ra lời khuyên đầu tư ngay trong các lượt hội thoại đầu tiên. D: Lưu nhật ký (log) truy vấn chỉ phục vụ mục đích kiểm toán/đánh giá sau sự cố, không phải là biện pháp bảo vệ trực tiếp ngăn chặn hành vi vi phạm tại thời điểm thực thi.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q54.", "n": 53}, {"cat": "T", "topic": 7, "q": "You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset. Which two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.) Each correct answer presents part of the solution.", "o": ["Publish the aggregated metrics to a dashboard and gate releases on threshold checks.", "Curate and label the evaluation dataset to match the defined slices.", "Review failure cases with subject matter experts to refine the scoring rubric.", "Define the metrics and slices the framework will report across representative, edge, and adversarial cases.", "Score the deployment outputs against the reference labels and compute aggregate metrics."], "a": [1, 3], "sk": ["Which two steps must be completed BEFORE running the"], "note": "Đáp án: {B} + {D}.", "ex": "Tại sao B & D đúng: Đây là các bước chuẩn bị (preparation/specification) bắt buộc phải có trước khi chạy đánh giá: D: Phải xác định trước đo lường bằng chỉ số nào (metrics) và phân loại dữ liệu ra sao (slices). B: Phải chuẩn bị xong tập dữ liệu đánh giá cùng nhãn chuẩn (reference labels/ground truth) tương ứng với các phân đoạn đó.\nTại sao các đáp án khác sai: E: Việc chấm điểm và tính toán chỉ số chỉ xảy ra trong/sau khi đã chạy hệ thống trên tập dữ liệu. A & C: Phân tích lỗi với chuyên gia và xuất bản kết quả lên dashboard là các bước xử lý sau khi cuộc đánh giá đã hoàn tất.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q104.", "n": 54}, {"cat": "T", "topic": 5, "q": "A Claude architect is auditing configuration scope assignments. Which two statements correctly identify an appropriate use of user-scope configuration versus other scopes? (Select two.)", "o": ["Persisting personal editor theme preferences that follow an engineer across projects.", "Saving a preferred Claude response language that applies to all repositories the engineer uses.", "Enforcing a company-wide policy that must not be overridden by individual engineers.", "Defining MCP server endpoints shared by all contributors to a specific repository.", "Storing API authentication keys so they are not committed to version control."], "a": [0, 1], "sk": ["Which two statements correctly identify an appropriate use of"], "note": "Đáp án: {A} + {B}.", "ex": "A. (Lưu trữ cấu hình giao diện người dùng cá nhân để áp dụng cho kỹ sư đó trên tất cả các dự án.) Đúng: Phạm vi cấp người dùng (User-scope) được thiết kế cho các tùy chọn cá nhân hóa có hiệu lực trên toàn bộ môi trường làm việc của một cá nhân, độc lập với từng dự án cụ thể.\nB. (Lưu ngôn ngữ phản hồi ưu thích của Claude áp dụng cho tất cả các kho lưu trữ mà kỹ sư đó sử dụng.) Đúng: Tương tự giao diện, ưu đãi ngôn ngữ giao tiếp cá nhân là một thiết lập toàn cục của người dùng (user-level), không nên ràng buộc vào cấu hình dự án hay dự án cụ thể.\nC. (Thực thi chính sách toàn công ty mà kỹ sư cá nhân không thể ghi đè.) Sai: Đây thuộc phạm vi chính sách cấp tổ chức/doanh nghiệp (Managed/Organization scope), không phải cấu hình do cá nhân người dùng quản lý.\nD. (Định nghĩa các điểm cuối MCP server chia sẻ cho tất cả người đóng góp trong một kho lưu trữ cụ thể.) Sai: Cấu hình dùng chung cho dự án/kho lưu trữ phải thuộc phạm vi dự án (Project/Repository scope) và được lưu vào phiên bản mã nguồn (commit vào VCS) để cả team cùng sử dụng.\nE. (Lưu trữ khóa xác thực API để tránh bị lưu vào quản lý phiên bản.) Sai: Các khóa xác thực bí mật nên được quản lý qua biến môi trường (Environment variables) hoặc trình quản lý bí mật (Secrets manager) an toàn, thay vì lưu trữ dạng plain configuration ở user-scope.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q69.", "n": 55}, {"cat": "T", "topic": 2, "q": "You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API integration, and agent-to-agent handoff. Which two factors belong on the list? (Select two.) Each correct answer presents a complete solution.", "o": ["Whether the vendor publishes detailed reference documentation for each candidate protocol.", "Whether the team has prior implementation experience with any of the candidate protocols.", "Whether the underlying transport supports encryption in transit between the integrated services.", "Whether the integration must be portable across multiple AI clients in the ecosystem.", "Whether the interaction is stateless and latency-sensitive or stateful and longer-running."], "a": [3, 4], "sk": ["Which two factors belong on the list"], "note": "Đáp án: {D} + {E}.", "ex": "D. (Liệu tích hợp có cần tính linh hoạt/khả năng di trú cao trên nhiều AI client khác nhau trong hệ sinh thái hay không.) Đúng: Đây là lợi thế chính của MCP (Model Context Protocol). MCP đóng vai trò như một chuẩn giao tiếp chung (tương tự USB-C), giúp một server dữ liệu/công cụ có thể kết nối dễ dàng với nhiều AI client khác nhau mà không cần viết lại mã tích hợp cho từng client.\nE. (Liệu tương tác là phi trạng thái (stateless) và nhạy cảm với độ trễ hay có trạng thái (stateful) và chạy trong thời gian dài.) Đúng: Lựa chọn này giúp phân biệt rõ giữa Tích hợp API trực tiếp (thường thích hợp cho các lời gọi hàm ngắn, phi trạng thái, tối ưu độ trễ thấp) với Agent-to-agent handoff (thích hợp cho các quy trình phức tạp, có giữ trạng thái ngữ cảnh và chạy qua nhiều bước xử lý kéo dài).\nA. (Liệu nhà cung cấp có xuất bản tài liệu tham khảo chi tiết cho việc tích hợp hay không.) Sai: Tài liệu tham khảo là yếu tố hỗ trợ kỹ thuật chung, không phải là tiêu chí kiến trúc nền tảng để lựa chọn mô hình tích hợp.\nB. (Liệu đội ngũ có kinh nghiệm triển khai trước đó với mô hình tích hợp này hay không.) Sai: Kinh nghiệm của team ảnh hưởng đến tiến độ thực hiện nhưng không phải yếu tố kỹ thuật mang tính quyết định bản chất giải pháp phù hợp với bài toán.\nC. (Liệu lớp truyền tải bên dưới có hỗ trợ mã hóa khi truyền dữ liệu hay không.) Sai: Mã hóa khi truyền dữ liệu (TLS/HTTPS) là yêu cầu bảo mật tiêu chuẩn bắt buộc cho cả 3 phương thức tích hợp trên, không phải tiêu chí so sánh phân loại.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q70.", "n": 56}, {"cat": "E", "topic": 5, "q": "You are setting up Claude Code for a team that requires every engineer to use the same MCP server set, permission rules, and project context throughout the engineering monorepo. Which configuration scope best meets this requirement?", "o": ["User scope", "Project scope", "Local scope"], "a": 1, "sk": ["Which configuration scope best meets this requirement"], "note": "Đáp án: {B}.", "ex": "Project scope stores repository-level configuration that can be version-controlled and shared with all collaborators. User and local scopes are personal or machine-specific, so they cannot reliably enforce a common MCP server set, permissions, and project context across a team.\n\nNguồn: tệp ccar-p-new-questions.md, Set 3 · Q119.", "n": 57}, {"cat": "T", "topic": 5, "q": "An engineering organization is adopting Claude Code across 200 developers. A team lead proposes that AI-generated pull requests bypass standard code review for changes under 50 lines. Which two Diligence-competency objections should you raise? (Select two.) Each correct answer presents part of the solution.", "o": ["Removing review eliminates the verification mechanism required for AI-generated output across the workflow.", "Code-review capacity should be expanded to handle every code change submitted across the team.", "The threshold should be increased to 200 lines to capture more changes.", "AI-generated pull requests should be rejected by default across the organization.", "Line count is a poor proxy for the actual risk introduced by a code change."], "a": [0, 4], "sk": ["Which two Diligence-competency objections should you raise"], "note": "Đáp án: {A} + {E}.", "ex": "A. (Việc loại bỏ quy trình review sẽ xóa bỏ cơ chế xác minh cần thiết đối với đầu ra do AI tạo ra trong toàn bộ quy trình làm việc.) Đúng: Nguyên tắc cẩn trọng (Diligence) trong việc triển khai AI yêu cầu mọi mã nguồn do AI tạo ra phải được kiểm chứng/xác minh trước khi đưa vào sản xuất. Loại bỏ hoàn toàn bước review đồng nghĩa với việc loại bỏ hàng rào bảo vệ và kiểm soát rủi ro quan trọng này.\nE. (Số lượng dòng code là một tiêu chí đại diện kém để đánh giá rủi ro thực sự mà một thay đổi mã nguồn mang lại.) Đúng: Một thay đổi chỉ tốn 1–2 dòng code (ví dụ: sửa tham số cấu hình bảo mật, đổi logic phân quyền, hay sửa đường dẫn API) vẫn có thể gây ra sự cố nghiêm trọng hoặc lỗ hổng bảo mật lớn. Do đó, dựa vào số dòng code (< 50 dòng) để bỏ qua review là hoàn toàn không hợp lý.\nB. Sai: Đây không phải là phản đối mang tính cốt lõi về mặt cẩn trọng đối với đề xuất, mà chỉ là một đề xuất quản lý nguồn lực. C. Sai: Tăng số dòng lên chỉ làm tăng thêm rủi ro và làm trầm trọng hơn vấn đề bỏ qua kiểm duyệt. D. Sai: Quan điểm này quá cực đoan và phủ nhận hoàn toàn giá trị của công cụ AI. AI vẫn có thể hỗ trợ lập trình hiệu quả miễn là có quy trình kiểm duyệt (human-in-the-loop) phù hợp.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q79.", "n": 58}, {"cat": "E", "topic": 7, "q": "When communicating an architectural decision to a security and compliance reviewer, which content set is most aligned with that audience's primary concerns?", "o": ["Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager.", "Implementation timeline, component interfaces, and deployment sequence for the engineering team.", "Threat model, control mappings, residual-risk acceptance criteria, and audit traceability.", "Decision rationale, business outcomes, and high-level risk summary for executive review."], "a": 2, "sk": ["When communicating an architectural decision to a security and"], "note": "Đáp án: {C}.", "ex": "Tại sao C đúng: Đội ngũ an ninh và tuân thủ chuyên trách việc đánh giá mức độ an toàn và khả năng đáp ứng quy định pháp lý/tiêu chuẩn của hệ thống. Do đó, các tài liệu họ quan tâm trực tiếp nhất phải bao gồm: Threat model: Mô hình hóa các mối đe dọa tiềm ẩn. Control mappings: Các biện pháp kiểm soát an ninh tương ứng. Residual-risk criteria: Đánh giá rủi ro tồn dư có nằm trong mức chấp nhận được không. Audit traceability: Khả năng vết và kiểm toán khi có sự cố.\nTại sao các đáp án khác sai: A & B: Dành cho Quản lý dự án (Project Manager) hoặc Quản lý kỹ thuật (Engineering Lead) quan tâm đến tiến độ và nguồn lực. D: Dành cho cấp lãnh đạo (Executive Review) quan tâm đến bức tranh tổng thể và giá trị kinh doanh.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q96.", "n": 59}, {"cat": "T", "topic": 7, "q": "An architect at Trenova Systems, Inc. is reviewing two draft communication packages for the same architectural decision. Package 1 contains a threat model, residual-risk register, and control-mapping table. Package 2 contains a list of capabilities delivered and feature-level roadmap dependencies. Which two audiences are correctly matched to these packages? (Select two.)", "o": ["Package 1 → engineering implementation team", "Package 2 → executive sponsor", "Package 1 → security and compliance reviewer", "Package 2 → product manager owning the roadmap", "Package 2 → security and compliance reviewer"], "a": [2, 3], "sk": ["Which two audiences are correctly matched to these packages"], "note": "Đáp án: {C} + {D}.", "ex": "Package 1 is designed for security and compliance review because its threat model identifies relevant threats and attack paths, its residual-risk register documents the risks remaining after controls, and its control-mapping table connects safeguards to organizational or regulatory requirements. Package 2 is designed for the product manager because delivered capabilities and roadmap dependencies directly support prioritization, release planning, sequencing, and lifecycle ownership. An engineering implementation team would ordinarily need component diagrams, interface contracts, configuration schemas, deployment instructions, and operational runbooks rather than primarily risk-governance artifacts. An executive sponsor generally needs a concise outcome, cost, risk, and decision summary instead of feature-level dependency details. Effective architecture communication must therefore adapt the content and level of detail to each audience’s responsibilities and decision rights.\n\nNguồn: tệp ccar-p-new-questions.md, Set 3 · Q118.", "n": 60}, {"cat": "T", "topic": 4, "q": "A revenue projection assistant has missed its monthly cost target by 38 percent. Profiling shows three contributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30 percent), and inference on a flagship-tier model (25 percent). Stakeholders require that projection accuracy remain unchanged. Which two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.) Each correct answer presents part of the solution.", "o": ["Reduce the number of historical sales chunks retrieved across each query run.", "Truncate the policy preamble to remove non-essential clauses from the prompt.", "Enable prompt caching on the static policy preamble across the recurring calls.", "Switch the workload to a smaller, faster Claude model tier across all queries.", "Cache common retrieved sales chunks accessed across many of the daily queries."], "a": [2, 4], "sk": ["Which two optimizations should you sequence first to reduce"], "note": "Đáp án: {C} + {E}.", "ex": "C — Đúng: Kích hoạt tính năng prompt caching cho phần văn bản chính sách tĩnh (policy preamble) chiếm tới 6,000 token giúp giảm đáng kể chi phí cho các lần gọi định kỳ mà không làm thay đổi hay ảnh hưởng đến độ chính xác của mô hình. E — Đúng: Việc lưu trữ đệm (cache) các đoạn dữ liệu lịch sử bán hàng thường xuyên được truy cập chung qua nhiều lượt truy vấn hàng ngày giúp tiết kiệm chi phí từ phần trích xuất (30%) mà vẫn giữ nguyên độ chính xác theo yêu cầu của các bên liên quan.\nLý do các phương án còn lại không chính xác: A: Giảm số lượng các đoạn dữ liệu lịch sử truy xuất trên mỗi lượt truy vấn có thể làm mất thông tin và ảnh hưởng trực tiếp đến độ chính xác của dự báo doanh thu. B: Cắt xén phần mở đầu chính sách (preamble) bằng cách xóa các điều khoản phi cốt lõi có nguy cơ làm thay đổi hành vi hoặc độ chính xác của mô hình. D: Chuyển đổi toàn bộ khối lượng công việc sang một dòng mô hình Claude nhỏ và nhanh hơn trên tất cả các truy vấn vi phạm yêu cầu giữ nguyên chất lượng dự báo của mô hình cao cấp (flagship-tier).\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q34.", "n": 61}, {"cat": "T", "topic": 5, "q": "You are compiling a diagnostic toolkit for Claude Code operational issues. Which two diagnostic actions belong in the toolkit? (Select two.) Each correct answer presents a complete solution.", "o": ["Increase the model sampling temperature so that intermittent issues surface more frequently for analysis.", "File a support ticket with vendor support before any local reproduction or evidence collection.", "Reproduce the issue with a minimal reproduction case that isolates one variable at a time.", "Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific.", "List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures."], "a": [2, 4], "sk": ["Which two diagnostic actions belong in the toolkit"], "note": "Đáp án: {C} + {E}.", "ex": "Tại sao C đúng: Phương pháp chuẩn để chẩn đoán lỗi kỹ thuật là tạo một trường hợp kiểm thử tối giản (minimal reproduction case) và cô lập từng biến số. Điều này giúp xác định chính xác nguyên nhân gây lỗi xuất phát từ đâu. Tại sao E đúng: Claude Code phụ thuộc nhiều vào các máy chủ MCP để mở rộng tính năng và kết nối dữ liệu. Việc liệt kê và kiểm tra trạng thái của các MCP server giúp phát hiện nhanh các sự cố mất kết nối hoặc cấu hình sai.\nTại sao các đáp án khác sai: A: Tăng temperature làm tăng tính ngẫu nhiên (chủ quan/sáng tạo) của mô hình, gây khó khăn hơn cho việc chẩn đoán lỗi kỹ thuật vốn cần tính ổn định. B: Báo lỗi cho nhà cung cấp trước khi tự kiểm tra/tái hiện lỗi cục bộ là quy trình không tối ưu. D: Roll back ngay lập tức mà không tìm nguyên nhân gốc rễ sẽ làm gián đoạn việc khắc phục triệt để sự cố.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q89.", "n": 62}, {"cat": "T", "topic": 6, "q": "You are evaluating a Claude-based deployment for adherence to a specific regulation. Which two steps must be completed BEFORE mapping deployment data flows to specific regulatory clauses? (Select two.) Each correct answer presents part of the solution.", "o": ["Compare the in-place controls against the regulatory requirements to identify any compliance gaps.", "Identify the applicability of the regulation based on data types, jurisdiction, and audience.", "Schedule the remediation work with the engineering team based on the prioritized gap findings.", "Document the identified gaps along with recommended remediations and residual risk for signoff.", "Inventory the vendor-provided compliance tooling and confirm which compliance affordances are in place."], "a": [1, 4], "sk": ["Which two steps must be completed BEFORE mapping deployment"], "note": "Đáp án: {B} + {E}.", "ex": "Đáp án đúng cho câu Q42 trên trang CertLab là B và E.\nB — Đúng: Trước khi ánh xạ luồng dữ liệu vào các điều khoản quy định cụ thể, bước đầu tiên phải là xác định tính áp dụng của quy định đó dựa trên loại dữ liệu, phạm vi thẩm quyền pháp lý (jurisdiction) và đối tượng người dùng.\nE — Đúng: Cần phải kiểm kê danh mục các công cụ tuân thủ do nhà cung cấp hỗ trợ và xác nhận các tiện ích tuân thủ sẵn có (compliance affordances) để hiểu rõ nền tảng cung cấp những gì trước khi ánh xạ chi tiết luồng dữ liệu.\nLý do các phương án còn lại không chính xác: A: So sánh các biện pháp kiểm soát hiện tại với yêu cầu pháp lý để tìm ra khoảng trống (gap analysis) chỉ có thể thực hiện sau khi đã ánh xạ luồng dữ liệu vào các điều khoản quy định. C: Lập kế hoạch khắc phục cùng đội ngũ kỹ thuật là bước diễn ra ở cuối quy trình đánh giá tuân thủ (sau khi đã phát hiện và ưu tiên các khoảng trống). D: Tài liệu hóa các khoảng trống và kiến nghị giải pháp xử lý là bước thực hiện sau khi việc đánh giá khoảng trống hoàn tất.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q42.", "n": 63}, {"cat": "T", "topic": 3, "q": "A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline. Which two diagnostic actions most directly identify the root cause of this behavior? (Select two.)", "o": ["Increase the context-window size to allow more retrieved chunks per query.", "Switch the retrieval index to a denser embedding model to improve chunk-relevance scores.", "Determine whether the failure reproduces on the previous model version to test for a model mismatch.", "Reduce the temperature setting to lower response variance across all query types.", "Inspect the system-prompt grounding instructions to determine whether citation constraints remain intact."], "a": [2, 4], "sk": ["Which two diagnostic actions most directly identify the root"], "note": "Đáp án: {C} + {E}.", "ex": "Đáp án: C, E. Pipeline truy xuất không đổi nên nguyên nhân nằm ở phía mô hình hoặc prompt: C kiểm tra lỗi có tái hiện trên phiên bản mô hình trước không (phát hiện thay đổi do nâng cấp model); E kiểm tra chỉ dẫn grounding/citation trong system prompt còn nguyên không. A, B thay đổi retrieval khi retrieval không phải nguyên nhân; D giảm temperature chỉ che triệu chứng, không xác định nguyên nhân gốc.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q18.", "n": 64}, {"cat": "E", "topic": 3, "q": "You are selecting a pattern for a compliance Q&A assistant that must answer policy questions with citations to the authoritative internal source set. Latency, cost, and audit predictability are prioritized. Which pattern is the best fit?", "o": ["Augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer.", "Multi-agent orchestration with a planner, researcher, and writer agent for every query.", "A pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus.", "A static prompt with the entire policy corpus concatenated into every request."], "a": 0, "sk": ["Which pattern is the best fit"], "note": "Đáp án: {A}.", "ex": "Đáp án đúng cho câu Q51 trên trang CertLab là A.\nA — Đúng: Augmented LLM với RAG trên tập tài liệu chính thức (Augmented LLM with RAG over indexed authoritative corpus) và hiển thị trích dẫn (citation rendering) là mô hình chuẩn nhất. Mô hình này giúp giữ độ trễ (latency) thấp, chi phí (cost) tối ưu và đảm bảo tính dự đoán/minh bạch khi kiểm toán (audit predictability) vì câu trả lời luôn bám sát nguồn tài liệu nội bộ đã được chỉ mục.\nLý do các phương án còn lại không chính xác: B: Kiến trúc đa tác vụ (Multi-agent orchestration) với nhiều agent làm tăng độ trễ và chi phí token đáng kể, không phù hợp với tiêu chí ưu tiên độ trễ và chi phí. C: Sử dụng công cụ duyệt web mở (open web-browsing) dễ dẫn đến thông tin không chính xác từ bên ngoài và mất tính kiểm soát khi kiểm toán. D: Nạp toàn bộ tập chính sách vào prompt (static prompt with entire corpus) sẽ tiêu tốn lượng token khổng lồ cho mỗi truy vấn, làm tăng mạnh chi phí và độ trễ.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q51.", "n": 65}, {"cat": "E", "topic": 3, "q": "You are reviewing a peer's draft system prompt that contains contradictory instructions: one section says never to speculate beyond the supplied source, while another says to confidently fill in any gaps. Which response is most appropriate?", "o": ["Add a priority instruction directing the model to evaluate all instructions and apply whichever appears most contextually appropriate on each request.", "Remove or rewrite the gap-filling instruction so the prompt consistently constrains the model to source-supported content.", "Increase temperature so output randomness masks the contradiction.", "Keep both instructions and rely on the model to decide which one to follow on each request."], "a": 1, "sk": ["Which response is most appropriate"], "note": "Đáp án: {B}.", "ex": "Đáp án B (Đúng): Mâu thuẫn trong system prompt làm giảm tính ổn định và độ tin cậy của mô hình AI. Cách giải quyết triệt để và chuẩn xác nhất là loại bỏ hoặc sửa lại các chỉ dẫn xung đột nhau, đảm bảo toàn bộ prompt đi theo một định hướng nhất quán (ngăn ngừa việc mô hình tự bịa thông tin / hallucination).\nCác đáp án sai: A sai vì việc bắt mô hình tự đánh giá mâu thuẫn trong ngữ cảnh chỉ làm tăng rủi ro hành vi không dự đoán được (unpredictable behavior). C sai vì tăng temperature chỉ làm tăng tính ngẫu nhiên của câu trả lời, không giải quyết được mâu thuẫn logic trong prompt. D sai vì giao việc quyết định cho mô hình sẽ dẫn đến kết quả bất định, lúc thì mô hình tuân thủ nguồn, lúc thì tự do suy đoán.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q65.", "n": 66}, {"cat": "T", "topic": 4, "q": "You are evaluating model-selection claims used by a peer team. For each statement, select yes if the statement is generally true. Otherwise, select no.", "o": ["Heavier-reasoning models typically consume more of the rate limit and run more slowly than lighter models on the same input.", "A representative-sample evaluation on the target workload is the right basis for confirming a model selection.", "The most capable model is always the right choice regardless of the workload profile.", "Tiered routing can serve routine traffic with a lighter model while reserving a heavier model for traffic that needs its capability.", "Selecting a model based on which version was most recently announced is the right basis for production decisions."], "a": [0, 1, 3], "sk": ["the statement is generally true"], "note": "Yes: {A} + {B} + {D} · No: {C} + {E}.", "ex": "Đáp án: A, B, D (Yes); C, E (No).\nDưới đây là đáp án Yes / No cho từng phát biểu trong câu Q37 trên trang CertLab:\nA — Yes: Các mô hình suy luận sâu hơn (như Claude Opus) tốn nhiều chi phí rate limit hơn và chạy chậm hơn so with các mô hình nhẹ hơn (như Haiku) trên cùng một lượng input.\nB — Yes: Đánh giá mô hình dựa trên một mẫu đại diện (representative-sample evaluation) của công việc thực tế là cơ sở đúng đắn duy nhất để xác nhận việc lựa chọn mô hình.\nC — No: Mô hình mạnh nhất không phải lúc nào cũng là lựa chọn đúng cho mọi công việc, vì còn cần tối ưu chi phí, độ trễ (latency) và giới hạn tài nguyên.\nD — Yes: Định tuyến phân tầng (Tiered routing) cho phép xử lý các tác vụ thông thường bằng mô hình nhẹ hơn và chỉ dùng mô hình mạnh cho các yêu cầu phức tạp.\nE — No: Lựa chọn mô hình chỉ dựa trên phiên bản mới được phát hành gần nhất không phải là cơ sở đúng đắn cho các quyết định triển khai sản phẩm thực tế (production).\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q37.", "n": 67, "yn": 1}, {"cat": "T", "topic": 1, "q": "A technical team is debating whether to implement a new capability for generating regulatory filings from internal data as a Claude Skill or as an MCP server. The capability requires a fixed authoring procedure with embedded examples, does not need to call live external systems, and must be portable across three Claude deployments: claude.ai, an internal API integration, and Claude Code. Which factor most strongly favors implementing the capability as a Skill?", "o": ["The capability needs to query a live database for the most recent regulatory filings.", "The capability must also be callable from a developer's command-line interface.", "The capability requires direct authentication against the corporate identity provider.", "The capability is procedural knowledge with no live external-system calls required."], "a": 3, "sk": ["Which factor most strongly favors implementing the capability as"], "note": "Đáp án: {D}.", "ex": "D — Đúng: Phương án \"The capability is procedural knowledge with no live external-system calls required.\" là yếu tố quyết định vì Claude Skills được thiết kế chuyên biệt để đóng gói các quy trình tĩnh, hướng dẫn thủ tục (procedural knowledge) kèm theo ví dụ mẫu mà không cần đến cơ chế kết nối hay giao tiếp với hệ thống bên ngoài như một MCP server. Đồng thời, cấu trúc này có tính di động cao, dễ dàng hoạt động trên cả ba môi trường triển khai (claude.ai, internal API, và Claude Code).\nLý do các phương án còn lại không chính xác: A: Việc cần truy vấn cơ sở dữ liệu thời gian thực (live database) đòi hỏi phải xây dựng một Model Context Protocol (MCP) server chứ không phù hợp để làm Claude Skill đơn thuần. B: Yêu cầu gọi từ giao diện dòng lệnh (CLI) của lập trình viên không phải là điểm phân biệt chính yếu ủng hộ Claude Skill hơn MCP vì cả hai đều có cơ chế tích hợp riêng. C: Yêu cầu xác thực trực tiếp với nhà cung cấp danh tính doanh trại (corporate identity provider) nằm ngoài phạm vi cốt lõi của một Skill và thường cần các kiến trúc dịch vụ tích hợp bên ngoài hoặc MCP server bảo mật.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q35.", "n": 68}, {"cat": "T", "topic": 4, "q": "You are classifying token-management tactics by where each tactic applies in the request lifecycle: 'Input Preparation,' 'Prompt Construction,' or 'Output Handling.'", "o": ["Persist the validated output for downstream consumption and audit", "Order the prompt sections so cacheable content sits before per-request content", "Summarize prior conversation history when full history is no longer needed", "Validate the model's structured output against the expected schema", "Move stable repeated content into a cacheable prefix at the head of the prompt", "Trim retrieved passages to spans relevant to the user's question"], "a": [1, 4], "sk": [], "note": "Input Preparation: {C} + {F} · Prompt Construction: {B} + {E} · Output Handling: {A} + {D}.", "ex": "Phân loại đầy đủ (câu gốc dạng phân loại):\nA — Persist the validated output for downstream consumption and audit → Output Handling\nB — Order the prompt sections so cacheable content sits before per-request content → Prompt Construction\nC — Summarize prior conversation history when full history is no longer needed → Input Preparation\nD — Validate the model's structured output against the expected schema → Output Handling\nE — Move stable repeated content into a cacheable prefix at the head of the prompt → Prompt Construction\nF — Trim retrieved passages to spans relevant to the user's question → Input Preparation\n\n(Vietnamese notes trong site) A: Lưu trữ đầu ra đã kiểm duyệt cho các bước sau và kiểm toán. B: Sắp xếp các phần prompt để nội dung có thể cache nằm trước nội dung biến đổi theo yêu cầu. C: Tóm tắt lịch sử trò chuyện khi không còn cần toàn bộ dữ liệu cũ. D: Xác thực đầu ra có cấu trúc của mô hình so với schema dự kiến. E: Đưa nội dung cố định lặp lại vào phần đầu prompt dưới dạng tiền tố có thể cache. F: Cắt gọt các đoạn văn bản truy xuất được để chỉ giữ lại phần liên quan đến câu hỏi.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q109.", "n": 69, "cls": {"c": ["Input Preparation", "Prompt Construction", "Output Handling"], "m": [2, 1, 0, 2, 1, 0]}}, {"cat": "T", "topic": 1, "q": "You are sequencing decomposed components in an invoice-processing pipeline. For each of the decomposed components, select the execution layer it belongs to: 'Pre-Processing,' 'Model Stage,' or 'Post-Processing.'", "o": ["Claude-based classification of invoice type", "Persistence of validated records to the system of record", "Schema validation of the extracted fields", "Claude-based extraction of structured invoice fields", "PII redaction on extracted text prior to model invocation", "Optical character recognition on scanned invoice images"], "a": [4, 5], "sk": [], "note": "Pre-Processing: {E} + {F} · Model Stage: {A} + {D} · Post-Processing: {B} + {C}.", "ex": "Phân loại đầy đủ (câu gốc dạng phân loại):\nA — Claude-based classification of invoice type → Model Stage\nB — Persistence of validated records to the system of record → Post-Processing\nC — Schema validation of the extracted fields → Post-Processing\nD — Claude-based extraction of structured invoice fields → Model Stage\nE — PII redaction on extracted text prior to model invocation → Pre-Processing\nF — Optical character recognition on scanned invoice images → Pre-Processing\n\nA: Tác vụ thực hiện trực tiếp bởi mô hình AI (Claude) để phân loại loại hóa đơn. B: Bước lưu trữ dữ liệu vào hệ thống ghi nhận sau khi hóa đơn đã được trích xuất và kiểm tra tính hợp lệ thành công. C: Kiểm tra và xác thực cấu trúc dữ liệu (schema) của các trường đã được trích xuất bởi mô hình. D: Tác vụ trích xuất dữ liệu có cấu trúc từ hóa đơn do mô hình Claude đảm nhận. E: Quá trình làm sạch, ẩn thông tin nhận dạng cá nhân (PII) trước khi gửi văn bản vào gọi mô hình. F: Bước xử lý ảnh (OCR) ban đầu để chuyển đổi hình ảnh hóa đơn thành văn bản trước khi chuyển qua các bước phân tích tiếp theo.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q32.", "n": 70, "cls": {"c": ["Pre-Processing", "Model Stage", "Post-Processing"], "m": [1, 2, 2, 1, 0, 0]}}, {"cat": "T", "topic": 6, "q": "A Claude architect is designing a HIPAA-compliant pipeline that processes patient records. Which two design decisions directly support HIPAA compliance requirements? (Select two.)", "o": ["Setting max_tokens to a low value to minimize the volume of text generated per request.", "Selecting the highest-capability Claude model to maximize diagnostic accuracy.", "Enforcing role-based access controls so that PHI is retrievable only by authorized personnel.", "Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place.", "Using streaming responses to reduce perceived latency for clinical users."], "a": [2, 3], "sk": ["Which two design decisions directly support HIPAA compliance requirements"], "note": "Đáp án: {C} + {D}.", "ex": "Đáp án đúng: C, D. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống.\nC. (Thực thi kiểm soát truy cập dựa trên vai trò (RBAC) để thông tin sức khỏe cá nhân (PHI) chỉ có thể được truy xuất bởi nhân sự được cấp phép.) Đúng: Quy định bảo mật HIPAA (HIPAA Security Rule) bắt buộc phải có các biện pháp kiểm soát truy cập kỹ thuật (Access Control) để đảm bảo chỉ những người có thẩm quyền mới được xem hoặc xử lý thông tin sức khỏe được bảo vệ (PHI).\nD. (Đảm bảo dữ liệu bệnh nhân không bao giờ bị đưa vào các vòng phản hồi huấn luyện (training feedback loops) gửi cho nhà cung cấp mô hình khi chưa có Thỏa thuận đối tác kinh doanh (BAA).) Đúng: Theo luật HIPAA, việc chia sẻ PHI với bên thứ ba (như nhà cung cấp AI) bắt buộc phải có một Thỏa thuận BAA (Business Associate Agreement) được ký kết legal để đảm bảo trách nhiệm bảo mật dữ liệu và ngăn chặn việc dùng dữ liệu đó để huấn luyện mô hình.\nA. (Đặt max_tokens ở giá trị thấp để giảm độ dài của bản tóm tắt được tạo ra.) Sai: Đây là kĩ thuật giới hạn độ dài đầu ra (output truncation) để tối ưu chi phí/hiệu năng, không có giá trị pháp lý hay bảo mật trong việc tuân thủ quy định HIPAA.\nB. (Lựa chọn mô hình Claude có năng lực cao nhất để tối đa hóa chất lượng tóm tắt.) Sai: Chọn mô hình mạnh hơn giúp cải thiện độ chính xác/chất lượng phản hồi, không liên quan đến việc đáp ứng các tiêu chuẩn an toàn thông tin của HIPAA.\nE. (Sử dụng phản hồi dạng truyền dòng (streaming) để giảm độ trễ cảm nhận cho người dùng lâm sàng.) Sai: Đây là tối ưu hóa trải nghiệm người dùng (UX/latency), không phải tiêu chuẩn pháp lý hay bảo mật tuân thủ HIPAA.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q81.", "n": 71}, {"cat": "E", "topic": 7, "q": "You are integrating human review into a high-volume classification pipeline where reviewing every output is infeasible. Which sampling strategy best balances throughput with quality oversight?", "o": ["No sampling, relying entirely on user complaints to reveal quality and safety problems after they affect users.", "Risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs.", "Inverse sampling that reviews only high-confidence routine outputs and skips low-confidence and high-impact outputs.", "Universal review of every output regardless of confidence or throughput impact."], "a": 1, "sk": ["Which sampling strategy best balances throughput with quality oversight"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng là B.\nB — Đúng: Lấy mẫu phân tầng theo rủi ro (Risk-stratified sampling) là chiến lược tối ưu nhất: đánh giá thủ công toàn bộ các kết quả có độ tin cậy thấp (low-confidence) và tác động cao (high-impact), kết hợp với việc lấy mẫu ngẫu nhiên tỉ lệ nhỏ đối với các kết quả thông thường có độ tin cậy cao (high-confidence). Phương pháp này giúp tối đa hóa khả năng kiểm soát chất lượng mà không làm nghẽn năng suất xử lý của hệ thống.\nLý do các phương án còn lại không chính xác: A: Không lấy mẫu và chỉ dựa vào khiếu nại của người dùng là cách tiếp cận thụ động, khiến các lỗi nghiêm trọng bị bỏ sót và làm giảm trải nghiệm người dùng. C: Lấy mẫu ngược (chỉ kiểm tra các kết quả độ tin cậy cao) sẽ bỏ qua khu vực có rủi ro sai sót cao nhất là các kết quả có độ tin cậy thấp. D: Kiểm tra toàn bộ 100% kết quả là không khả thi đối với hệ thống có lưu lượng lớn (high-volume pipeline) vì sẽ gây ra nghẽn nghiêm trọng và tốn kém chi phí vận hành.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q59.", "n": 72}, {"cat": "T", "topic": 1, "q": "A business sponsor has requested an AI solution to 'improve customer experience.' The sponsor cannot articulate which customer journey is failing, which metric reflects the failure, or which decisions the AI should support. The sponsor is asking you to begin design work next week. Which delegation-competency action should you take first?", "o"
