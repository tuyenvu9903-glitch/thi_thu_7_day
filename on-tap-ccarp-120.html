: ["Recommend that the sponsor revise the request and resubmit it later for evaluation.", "Begin prototyping a generic assistant against the broad request before the next deadline.", "Propose a fixed scope that you commit to by default based on your own assumptions.", "Facilitate a structured discovery to define the failing decision and the target metric."], "a": 3, "sk": ["Which delegation-competency action should you take first"], "note": "Đáp án: {D}.", "ex": "Đáp án đúng là D.\nD — Đúng: Bước đầu tiên tối quan trọng khi yêu cầu của bên tài trợ (sponsor) còn quá mơ hồ là chủ trì một buổi làm việc khai phá có cấu trúc (structured discovery) để xác định rõ quyết định đang gặp rủi ro và chỉ số mục tiêu (target metric). Điều này giúp làm rõ phạm vi bài toán kinh doanh trước khi đầu tư bất kỳ nguồn lực kỹ thuật nào.\nLý do các phương án còn lại không chính xác: A: Yêu cầu người tài trợ tự sửa đổi bằng văn bản trước khi gặp mặt sẽ tạo ra rào cản giao tiếp và không hỗ trợ họ giải quyết bản chất vấn đề khi chính họ chưa rõ mục tiêu. B: Bắt đầu xây dựng bản mẫu (prototype) ngay lập tức khi chưa có mục tiêu hay chỉ số đo lường rõ ràng sẽ gây lãng phí công sức và dễ dẫn đến sản phẩm không đúng kỳ vọng. C: Tự đưa ra phạm vi cố định dựa trên giả định cá nhân là cực kỳ rủi ro, dễ dẫn đến việc giải quyết sai bài toán thực tế của doanh nghiệp.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q60.", "n": 73}, {"cat": "T", "topic": 1, "q": "You are reviewing a peer's end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users. For each statement, indicate Yes if it reflects sound architectural practice. Otherwise, select No.", "o": ["Authentication and authorization run before retrieval so retrieval can filter by identity.", "An asynchronous queue absorbs bursty traffic between intake and the model invocation layer.", "Tax computation is encoded directly in the system prompt rather than in code.", "Conversation logs include unredacted government identifiers to maximize signal for tuning."], "a": [0, 1], "sk": ["it reflects sound architectural practice"], "note": "Yes: {A} + {B} · No: {C} + {D}.", "ex": "Đáp án: A, B (Yes); C, D (No).\nA — Yes: Xác thực và phân quyền (Authentication/Authorization) phải chạy trước bước truy xuất (retrieval) để đảm bảo hệ thống chỉ tìm kiếm và trả về dữ liệu thuộc phạm vi quyền hạn của người dùng, tránh rò rỉ dữ liệu nhạy cảm. B — Yes: Hàng chờ bất đồng bộ (Asynchronous queue) giúp điều hòa và hấp thụ các đợt lưu lượng truy cập tăng đột biến (bursty traffic), bảo vệ tầng gọi mô hình khỏi bị quá tải hoặc chạm giới hạn tỉ lệ (rate limit). C — No: Các phép tính toán cố định (như tính thuế) không nên đưa trực tiếp vào system prompt, mà cần xử lý bằng mã lập trình (code) hoặc công cụ (tool) để đảm bảo độ chính xác tuyệt đối 100%. D — No: Nhật ký hội thoại tuyệt đối không được chứa định danh do chính phủ cấp chưa được che (unredacted PII), vì điều này vi phạm nghiêm trọng các quy định về bảo mật và riêng tư dữ liệu (PII compliance).\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q49.", "n": 74, "yn": 1}, {"cat": "T", "topic": 2, "q": "You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review. For each tool currently configured on the agent, select yes if the tool should remain after a least-privilege audit. Otherwise, select no if it should be removed.", "o": ["A read-only catalog lookup tool that returns vendor and SKU information", "An inbox-send tool that emails purchase requests to vendors directly", "A draft-write tool that creates purchase-request drafts in the review queue", "A production-database admin tool unrelated to procurement", "A read-only policy-document tool that returns the relevant procurement policies"], "a": [0, 2, 4], "sk": ["the tool should remain after a least-privilege audit"], "note": "Yes: {A} + {C} + {E} · No: {B} + {D}.", "ex": "Đúng (Yes): A, C, E. Sai (No): B, D.\nA — Yes: A read-only catalog lookup tool that returns vendor and SKU information\nB — No: An inbox-send tool that emails purchase requests to vendors directly\nC — Yes: A draft-write tool that creates purchase-request drafts in the review queue\nD — No: A production-database admin tool unrelated to procurement\nE — Yes: A read-only policy-document tool that returns the relevant procurement policies\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q36.", "n": 75, "yn": 1}, {"cat": "T", "topic": 7, "q": "You are an architect supporting the iteration phase of a deployed Claude-based system. Which activity most directly fits this phase?", "o": ["Rebuild the entire system architecture from scratch at the start of every iteration cycle regardless of what production telemetry, evaluations, and stakeholder feedback indicate is needed.", "Stop measuring production outcomes once the deployment has successfully launched, treating the go-live milestone as the end of the evaluation and iteration cycle.", "Discard the evaluation framework and reference set once the deployment is in production, accepting that future iterations will have no structured basis for measuring the impact of changes.", "Review production telemetry, sampled output evaluations, and stakeholder feedback to identify the highest-impact change for the next cycle, then plan the change against the evaluation framework."], "a": 3, "sk": ["Which activity most directly fits this phase"], "note": "Đáp án: {D}.", "ex": "Đáp án đúng: D. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, C — Sai; D — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q21.", "n": 76}, {"cat": "T", "topic": 6, "q": "You are listing characteristics of robust guardrail design for an enterprise deployment. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.", "o": ["Centralized log retention for guardrail violations with quarterly review by the security team.", "Per-role tool allow-lists enforced at the orchestration layer before any tool call executes.", "User feedback channels that route reported guardrail failures into the product backlog for triage.", "Periodic refresh of the system prompt wording to keep refusal language current and clear.", "Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance."], "a": [1, 4], "sk": ["Which two characteristics belong on the list"], "note": "Đáp án: {B} + {E}.", "ex": "B — Đúng: Mức độ bảo vệ chủ động và nghiêm ngặt nhất đối với việc gọi công cụ (tool calling) là thực thi danh sách cho phép (allow-list) dựa trên vai trò người dùng (RBAC) ngay tại tầng điều phối trước khi lệnh gọi được phát đi. Điều này ngăn chặn triệt để các hành vi rò rỉ dữ liệu hoặc thực thi lệnh trái phép. E — Đúng: Một rào chắn an toàn vững chắc phải luôn được kiểm thử và đánh giá liên tục đối với các đòn tấn công thực tế. Việc đưa nội dung đối kháng (adversarial inputs) vào bộ suite kiểm thử tự động giúp theo dõi chính xác xem rào chắn có bị suy giảm hiệu năng (regression) theo thời gian hay không.\nLý do các phương án còn lại không chính xác: A: Việc lưu nhật ký và xem xét hàng quý chỉ mang tính chất ghi nhận/phản ứng sau sự cố (passive/reactive monitoring), không phải là đặc tính chủ động bảo vệ của bản thân rào chắn an toàn tại thời điểm thực thi. C: Phản hồi của người dùng về chất lượng là cơ chế thu thập ý kiến chung, không phải là một đặc tính kỹ thuật cốt lõi trong thiết kế guardrail. D: Việc thay đổi văn phong prompt chỉ mang tính chất định hình phong cách phản hồi, không đóng góp vào tính vững chắc (robustness) hay an toàn của hệ thống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q58.", "n": 77}, {"cat": "E", "topic": 6, "q": "You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document retrieval and outbound HTTP calls. Which scenario most directly indicates a data-exfiltration risk?", "o": ["The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request.", "The user submits a routine question and receives a routine answer.", "Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL.", "The internal-document retrieval tool returns a document that the user is authorized to view."], "a": 2, "sk": ["Which scenario most directly indicates a data-exfiltration risk"], "note": "Đáp án: {C}.", "ex": "C — Đúng: Nội dung đối kháng nằm trong tài liệu truy xuất (adversarial content in a retrieved document) hướng dẫn mô hình gọi công cụ HTTP ra bên ngoài để gửi dữ liệu nhạy cảm tới URL do kẻ tấn công kiểm soát. Đây là kịch bản điển hình của tấn công gián tiếp (Indirect Prompt Injection) dẫn đến rò rỉ dữ liệu trái phép (Data Exfiltration).\nLý do các phương án còn lại không chính xác: A: Công cụ HTTP trả về mã 200 khi gọi một tên miền nằm trong danh sách cho phép (allow-listed domain) là hoạt động bình thường theo đúng cấu hình an toàn. B: Người dùng gửi câu hỏi thông thường và nhận được câu trả lời thông thường là luồng sử dụng chuẩn, không thể hiện rủi ro. D: Công cụ truy xuất tài liệu nội bộ trả về tài liệu mà người dùng có quyền xem là hoạt động đúng phân quyền (authorization), không phải rò rỉ dữ liệu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q56.", "n": 78}, {"cat": "E", "topic": 2, "q": "You are configuring tool permissions for a Claude-based assistant. The assistant's defined responsibilities require read access to a knowledge base and write access to a draft queue, and nothing else. Which scoping design best applies least privilege?", "o": ["Allow access to all tools with read permissions globally across the system.", "Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer.", "Allow access to every tool in the catalog and rely on the model to decline tools it should not use.", "Disable all tools entirely to achieve a minimal permission surface."], "a": 1, "sk": ["Which scoping design best applies least privilege"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng: B. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, C, D — Sai; B — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q1.", "n": 79}, {"cat": "E", "topic": 6, "q": "During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior. Which mitigation most directly addresses this threat?", "o": ["Treat all retrieved content as untrusted input and apply input classifiers with output validation.", "Require citations for each claim and constrain responses to source-supported content.", "Restrict outbound tool calls to an approved destination allow-list.", "Score outputs against a stable adversarial evaluation set on each model-version change."], "a": 0, "sk": ["Which mitigation most directly addresses this threat"], "note": "Đáp án: {A}.", "ex": "Đáp án đúng: A. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: B, C, D — Sai; A — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q86.", "n": 80}, {"cat": "T", "topic": 6, "q": "You are assessing a Claude-based system whose dominant risk is silent quality drift on safety-relevant outputs after a model-version upgrade. Which assessment activity most directly addresses this risk?", "o": ["Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production.", "Rotate adversarial inputs randomly so no two upgrades are scored on the same set.", "Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic.", "Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion."], "a": 3, "sk": ["Which assessment activity most directly addresses this risk"], "note": "Đáp án: {D}.", "ex": "Đáp án: D. Rủi ro là chất lượng an toàn trôi âm thầm sau nâng cấp model, nên cần một bộ eval đối kháng cố định, chấm điểm gắn với từng phiên bản, chạy trước khi promote để so sánh cùng một chuẩn. A, C bỏ đánh giá và để lỗi lọt ra production; B xoay vòng bộ input ngẫu nhiên làm mất khả năng so sánh giữa các phiên bản.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q24.", "n": 81}, {"cat": "T", "topic": 5, "q": "You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session. Which diagnostic step should be tried first?", "o": ["Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered.", "Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue.", "Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect.", "Reinstall the developer's operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps."], "a": 2, "sk": ["Which diagnostic step should be tried first"], "note": "Đáp án: {C}.", "ex": "Tại sao C đúng: Kiểm tra xem máy chủ MCP đã được ghi nhận trong danh sách chưa (ví dụ: dùng lệnh /mcp hoặc lệnh liệt kê cấu hình) và khởi động lại/kết nối lại phiên làm việc (reconnect) là bước chẩn đoán nhẹ nhàng, trực tiếp và chính xác nhất. Hầu hết các ứng dụng CLI/IDE cần khởi động lại phiên làm việc để nhận cấu hình MCP mới.\nTại sao các đáp án khác sai: A: Tắt toàn bộ MCP server rồi bật lại từng cái là bước tốn thời gian và quá mức cần thiết đối với trường hợp mới thêm 1 server. B: Đổi dòng sản phẩm không giải quyết được vấn đề cấu hình máy chủ MCP cục bộ. D: Cài đặt lại hệ điều hành là hành động cực đoan, không phù hợp cho một lỗi cấu hình phần mềm đơn giản.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q91.", "n": 82}, {"cat": "T", "topic": 2, "q": "You are reviewing a customer-support agent's configuration. Each candidate tool falls into one of four categories: (1) required to complete defined tasks, (2) frequently used and reduces handoffs, (3) occasionally useful for unrelated work, (4) speculative future utility. Which categories should typically remain in the agent configuration?", "o": ["Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks.", "Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them.", "Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs.", "All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs."], "a": 2, "sk": ["Which categories should typically remain in the agent configuration"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, D — Sai; C — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q84.", "n": 83}, {"cat": "T", "topic": 5, "q": "You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers. Which response is most appropriate?", "o": ["Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency.", "Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add configuration complexity, accepting the full attack surface for all engineers across all projects.", "Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations.", "Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations."], "a": 2, "sk": ["Which response is most appropriate"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, D — Sai; C — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q3.", "n": 84}, {"cat": "T", "topic": 4, "q": "You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request. Which optimization most directly targets the dominant cost driver?", "o": ["Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them.", "Add additional repeated content to the system prompt to give the model more guidance.", "Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query.", "Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver."], "a": 2, "sk": ["Which optimization most directly targets the dominant cost driver"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống.\nC. (Chuyển system prompt dài, lặp lại thành một tiền tố có thể lưu vào bộ nhớ đệm (prompt caching) và cắt gọt ngữ cảnh truy xuất chỉ còn lại các đoạn thực sự liên quan đến từng truy vấn.) Đúng: Phương án này giải quyết trực tiếp cả hai yếu tố gây tốn chi phí nhất: Dùng Prompt Caching cho system prompt cố định giúp giảm mạnh chi phí input token cho các phần lặp lại. Cắt gọt (trim) dữ liệu truy xuất giúp giảm bớt dung lượng context thừa gửi kèm trong mỗi request.\nA. (Tăng độ sâu truy xuất để lấy ra nhiều tài liệu liên quan hơn cho mỗi truy vấn.) Sai: Việc lấy thêm nhiều tài liệu sẽ làm tăng kích thước ngữ cảnh (context size), dẫn đến chi phí token tăng lên thay vì giảm đi.\nB. (Thêm nội dung lặp lại vào system prompt để cải thiện tính căn cứ.) Sai: Thêm nội dung vào system prompt càng làm tăng lượng token và chi phí xử lý.\nD. (Chuyển tất cả các truy vấn sang mô hình lớn nhất/mạnh nhất hiện có để đạt chất lượng tối đa.) Sai: Chuyển sang mô hình lớn hơn sẽ làm chi phí token trên mỗi request tăng lên rất nhiều, đi ngược lại mục tiêu tối ưu hóa chi phí.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q77.", "n": 85}, {"cat": "T", "topic": 3, "q": "You are evaluating prompting claims in a peer's design document. For each claim, select yes if the claim reflects sound practice. Otherwise, select no.", "o": ["Zero-shot is appropriate as a starting point for closed-set classification when categories and descriptions are provided in the prompt.", "Adding a few-shot example set with exact field names anchors output formatting on extraction tasks.", "Chain-of-thought should be the default on every task regardless of complexity.", "Leading-question framing is best mitigated by asking for an even-handed comparison with stated criteria.", "Behavioral differences across model versions can be ignored once a prompt has been validated on one version."], "a": [0, 1, 3], "sk": ["the claim reflects sound practice"], "note": "Yes: {A} + {B} + {D} · No: {C} + {E}.", "ex": "Đúng (Yes): A, B, D. Sai (No): C, E.\nA — Yes: Zero-shot is appropriate as a starting point for closed-set classification when categories and descriptions are provided in the prompt.\nB — Yes: Adding a few-shot example set with exact field names anchors output formatting on extraction tasks.\nC — No: Chain-of-thought should be the default on every task regardless of complexity.\nD — Yes: Leading-question framing is best mitigated by asking for an even-handed comparison with stated criteria.\nE — No: Behavioral differences across model versions can be ignored once a prompt has been validated on one version.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q23.", "n": 86, "yn": 1}, {"cat": "T", "topic": 7, "q": "You are preparing an operational runbook for a Claude-based service. Which content is essential to include in the runbook?", "o": ["Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on.", "Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs.", "Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use.", "Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response."], "a": 1, "sk": ["Which content is essential to include in the runbook"], "note": "Đáp án: {B}.", "ex": "Đáp án: B. Runbook vận hành phải giúp kỹ sư on-call hành động ngay: các cảnh báo thường gặp kèm bước triage, đường escalation, quy trình rollback và liên kết dashboard/log. A, C, D mỗi phương án thiếu một phần thiết yếu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q46.", "n": 87}, {"cat": "T", "topic": 5, "q": "A Claude architect is configuring a shared Claude Code environment for a twelve-person development team. Which two configuration decisions most directly establish a consistent, secure team environment? (Select two.)", "o": ["Commit shared MCP server definitions and tool permissions in project-scope configuration files alongside the repository.", "Apply managed configuration to enforce non-overridable security and compliance policies across all team members.", "Set editor theme and display preferences at the project scope so they are uniform across workstations.", "Instruct each engineer to configure their preferred Claude model in personal user-scope settings.", "Store the team’s shared API key in the project-scope settings.json so all engineers use the same credential."], "a": [0, 1], "sk": ["Which two configuration decisions most directly establish a consistent,"], "note": "Đáp án: {A} + {B}.", "ex": "Project-scope configuration is appropriate for shared MCP definitions, permissions, hooks, and other repository-specific behavior that every team member should receive consistently. Managed configuration complements this by enforcing organization-wide security and compliance requirements that individual developers cannot override. Together, these mechanisms separate collaborative project configuration from centrally controlled policy. Editor themes are personal preferences and do not materially establish a secure environment. Allowing each engineer to select an arbitrary model can undermine consistency when model choice affects behavior, cost, or approved-use requirements. Storing a shared API key in a committed project file is a serious credential-management failure. Claude Code documentation identifies .claude/settings.json as the shared project file and managed settings as the highest-precedence organizational policy layer. Claude Code: Settings files and precedence\n\nNguồn: tệp ccar-p-new-questions.md, Set 3 · Q116.", "n": 88}, {"cat": "E", "topic": 7, "q": "After a prompt-template update, several previously passing test cases now produce unexpected outputs. Which test type is specifically designed to detect this category of failure?", "o": ["Integration tests that verify end-to-end behavior across pipeline components.", "Adversarial tests designed to probe for safety and injection vulnerabilities.", "Regression tests scored against a stable reference set of known-good behavior.", "Smoke tests that verify core paths are reachable after each deployment."], "a": 2, "sk": ["Which test type is specifically designed to detect this"], "note": "Đáp án: {C}.", "ex": "C. (Kiểm thử hồi quy (regression tests) được chấm điểm dựa trên một tập tham chiếu ổn định gồm các hành vi đã biết là đúng/tốt.) Đúng: Kiểm thử hồi quy được thiết kế chính xác để phát hiện xem những thay đổi mới trong mã nguồn hoặc prompt có làm hỏng các tính năng hay kết quả vốn đang hoạt động bình thường trước đó hay không.\nA. Sai: Kiểm thử tích hợp nhằm đảm bảo các thành phần (modules/APIs) tương tác và giao tiếp với nhau trơn tru, không tập trung vào việc phát hiện sự thoái hóa/suy giảm chất lượng đầu ra sau khi chỉnh sửa prompt. B. Sai: Loại kiểm thử này dùng để đánh giá khả năng bảo mật và độ an toàn của mô hình trước các đầu vào độc hại, không dùng để kiểm tra logic đầu ra thông thường. D. Sai: Smoke test chỉ kiểm tra nhanh xem hệ thống có chạy được không (không bị sập/lỗi nghiêm trọng) chứ không đánh giá chi tiết chất lượng hay sự thay đổi độ chính xác của kết quả đầu ra.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q74.", "n": 89}, {"cat": "T", "topic": 1, "q": "You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No.", "o": ["Drafting first-pass investigative reports from semi-structured incident logs for analyst review.", "Computing real-time fraud scores at sub-50-millisecond latency on a streaming pipeline.", "Long-context contract review with structured clause extraction and deviation flagging.", "Replacing a vector index for semantic retrieval over a multi-million-document corpus.", "Routing inbound support tickets into 30 categories with reasoning for the chosen routing."], "a": [0, 2, 4], "sk": ["Claude is appropriate as the primary solution at the architectural level"], "note": "Yes: {A} + {C} + {E} · No: {B} + {D}.", "ex": "Đúng (Yes): A, C, E. Sai (No): B, D.\nA — Yes: Drafting first-pass investigative reports from semi-structured incident logs for analyst review.\nB — No: Computing real-time fraud scores at sub-50-millisecond latency on a streaming pipeline.\nC — Yes: Long-context contract review with structured clause extraction and deviation flagging.\nD — No: Replacing a vector index for semantic retrieval over a multi-million-document corpus.\nE — Yes: Routing inbound support tickets into 30 categories with reasoning for the chosen routing.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q20.", "n": 90, "yn": 1}, {"cat": "T", "topic": 5, "q": "Engineering leadership wants to roll out Claude Skills to 280 developers across 14 teams. Skills will encode internal coding standards, code-review checklists, and incident-postmortem templates. Leadership has asked how to govern Skill authorship so that Skills remain trustworthy without bottlenecking on a single central team. Which governance model should you recommend?", "o": ["Per-developer authorship across the 280 engineers with no team-level coordination required.", "Centralized authorship by a single platform team responsible for every Skill produced.", "Fully decentralized authorship across the 14 teams with no review before publication.", "Federated authorship across the 14 teams with a central review and publication gate."], "a": 3, "sk": ["Which governance model should you recommend"], "note": "Đáp án: {D}.", "ex": "Đáp án đúng: D. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, C — Sai; D — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q27.", "n": 91}, {"cat": "T", "topic": 3, "q": "A research summarization assistant has been deployed for six months. A user has flagged that a generated summary contained a fabricated citation. Which two Diligence-competency actions should you take? (Select two.) Each correct answer presents part of the solution.", "o": ["Sample recent summaries to estimate the fabrication frequency across the population.", "Disable the assistant immediately for all current users without any prior diagnostic analysis.", "Review whether citation-grounding controls exist anywhere in the current generation pipeline.", "Communicate to users that the assistant does not fabricate output as a matter of design.", "Treat the incident as an anecdotal isolated case and take no further investigative action."], "a": [0, 2], "sk": ["Which two Diligence-competency actions should you take"], "note": "Đáp án: {A} + {C}.", "ex": "Đáp án đúng cho câu Q43 trên trang CertLab là A và C.\nA — Đúng: Lấy mẫu ngẫu nhiên các bản tóm tắt gần đây (sample recent summaries) giúp đánh giá định lượng tần suất xuất hiện trích dẫn bịa đặt (hallucination/fabrication frequency) trên toàn bộ hệ thống để xác định quy mô của vấn đề.\nC — Đúng: Kiểm tra lại các cơ chế kiểm soát căn cứ trích dẫn (citation-grounding controls) trong đường ống xử lý hiện tại để xác định xem hệ thống đã có bước đối chiếu/xác minh trích dẫn chưa hay bị hổng ở bước nào.\nLý do các phương án còn lại không chính xác: B: Tắt toàn bộ trợ lý ngay lập tức là phản ứng quá đà và không cần thiết khi chưa đánh giá được mức độ ảnh hưởng thực tế. D: Phủ nhận lỗi và khẳng định trợ lý không thể bịa đặt thông tin là thiếu trung thực và vi phạm nguyên tắc quản trị AI. E: Xem sự cố chỉ là một trường hợp đơn lẻ mà bỏ qua điều tra sẽ tạo ra rủi ro lớn cho chất lượng và độ tin cậy của hệ thống về lâu dài.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q43.", "n": 92}, {"cat": "T", "topic": 5, "q": "You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed. Which resolution step is most appropriate?", "o": ["Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional.", "Disable the permission system entirely across all scopes to remove the denial, eliminating all tool-pattern and deny-rule controls rather than identifying and amending the specific rule.", "Inspect the active permission rules across all scopes—managed, command-line, local, project, and user—to identify which rule is denying the action and confirm whether it should be amended or remain denied.", "Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in question."], "a": 2, "sk": ["Which resolution step is most appropriate"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, D — Sai; C — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q13.", "n": 93}, {"cat": "E", "topic": 3, "q": "A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents. Which mitigation is most directly targeted at this failure mode?", "o": ["Constrain responses to source-supported content, require citations, and add a verification step.", "Score each new model version against a stable adversarial evaluation set.", "Replace the shared API key with per-user OAuth tokens to improve access control.", "Treat retrieved data as untrusted and apply input classifiers at ingestion time."], "a": 0, "sk": ["Which mitigation is most directly targeted at this failure"], "note": "Đáp án: {A}.", "ex": "A. (Ràng buộc các câu trả lời chỉ nằm trong nội dung được hỗ trợ bởi nguồn, yêu cầu dẫn nguồn (citations), và thêm một bước xác minh.) Đúng: Hiện tượng mô hình đưa ra thông tin không có trong tài liệu nguồn gọi là ảo giác (hallucination) hoặc mất tính căn cứ (loss of groundedness). Để khắc phục trực tiếp dạng lỗi này, giải pháp hiệu quả nhất là siết chặt prompt (yêu cầu mô hình chỉ trả lời dựa trên context và phải trích dẫn nguồn) kết hợp với một bước kiểm tra/đánh giá (verification step/evaluator) để lọc bỏ các tuyên bố không có trong tài liệu.\nB. Sai: Việc kiểm thử này giúp phát hiện lỗ hổng bảo mật hoặc độ bền của mô hình trước các câu lệnh cố tình chơi xỏ (prompt injection/adversarial attacks), không phải là giải pháp trực tiếp để ngăn chặn lỗi ảo giác khi truy xuất tài liệu thông thường. C. Sai: Đây là biện pháp quản lý quyền truy cập và bảo mật danh tính (authentication/authorization), hoàn toàn không liên quan đến chất lượng hay độ chính xác của câu trả lời do mô hình tạo ra. D. Sai: Phương pháp này dùng để phòng chống rủi ro dữ liệu bị độc hại hoặc bị chèn mã độc (Indirect Prompt Injection) trong tài liệu nguồn, chứ không giải quyết được việc mô hình tự bịa thêm thông tin ngoài tài liệu lành nghề.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q72.", "n": 94}, {"cat": "E", "topic": 5, "q": "A team manager wants all engineers working on the same repository to share identical MCP server definitions without manual synchronization. Which configuration approach satisfies this requirement?", "o": ["Managed configuration pushed to all endpoints by the administrator.", "Environment variables set at the operating-system level on each workstation.", "Project-scope .claude/settings.json and .mcp.json files committed to the repository.", "Each engineer maintains a personal ~/.claude/settings.json with the shared definitions."], "a": 2, "sk": ["Which configuration approach satisfies this requirement"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, D — Sai; C — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q12.", "n": 95}, {"cat": "T", "topic": 1, "q": "You are identifying signals that a deployment should re-enter design rather than continue iterating in place. Which signal most directly indicates the need for a new design cycle?", "o": ["A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts.", "A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle.", "A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts.", "The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."], "a": 3, "sk": ["Which signal most directly indicates the need for a"], "note": "Đáp án: {D}.", "ex": "Tại sao D đúng: Việc thay đổi nhiệm vụ của các thành phần hệ thống hoặc giao ước/giao thức cốt lõi (core contracts/APIs) tác động trực tiếp đến cấu trúc nền tảng của hệ thống. Khi các yêu cầu mới vượt quá khả năng chịu đựng của kiến trúc hiện tại, việc tiếp tục tinh chỉnh nhỏ tại chỗ (iteration) sẽ gây ra rủi ro lớn và nợ kỹ thuật (technical debt), đòi hỏi hệ thống phải quay lại bước thiết kế kiến trúc (design phase).\nTại sao các đáp án khác sai: A, B, C: Đều là các thay đổi nhỏ về cấu hình, nội dung giao diện hoặc tài liệu hướng dẫn vận hành. Những chỉnh sửa này hoàn toàn có thể thực hiện thông qua việc tinh chỉnh thông thường (iterating in place) mà không cần thiết kế lại hệ thống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q98.", "n": 96}, {"cat": "T", "topic": 2, "q": "A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user. Which two mitigations directly address these specific findings? (Select two.)", "o": ["Validate structured outputs against a schema before downstream actions are executed.", "Enforce RBAC at the retrieval layer before content enters the model context.", "Move credentials out of the prompt context and resolve them from a server-side secret store.", "Add actor attribution to tool-call logs so each call records the initiating user identity.", "Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions."], "a": [3, 4], "sk": ["Which two mitigations directly address these specific findings"], "note": "Đáp án: {D} + {E}.", "ex": "Đáp án đúng: D, E. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, C — Sai; D, E — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q29.", "n": 97}, {"cat": "E", "topic": 2, "q": "You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an internal pricing service that already exposes a stable HTTP API. Which integration mechanism is the most appropriate?", "o": ["A direct API call to the existing endpoint with the appropriate scoped credentials.", "A long-lived stateful session protocol for a stateless single-call interaction.", "A bespoke streaming protocol layered over an unrelated asynchronous message bus.", "An agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service."], "a": 0, "sk": ["Which integration mechanism is the most appropriate"], "note": "Đáp án: {A}.", "ex": "A. (Một cuộc gọi API trực tiếp đến endpoint hiện có với quyền truy cập (credentials) được giới hạn phù hợp.) Đúng: Đối với một tác vụ đơn lẻ (single call), phi trạng thái (stateless), yêu cầu độ trễ thấp và dịch vụ mục tiêu đã có sẵn một HTTP API ổn định, việc gọi trực tiếp API (direct API call/tool call) là phương án tối ưu, đơn giản và hiệu quả nhất.\nB. Sai: Đề bài yêu cầu cuộc gọi phi trạng thái (stateless) và đơn lẻ (single call), nên việc tạo một giao thức phiên giữ trạng thái (stateful) lâu dài sẽ gây phức tạp hóa hệ thống và tăng chi phí tài nguyên không cần thiết. C. Sai: Việc tự phát triển một giao thức streaming tùy chỉnh sẽ làm gia tăng chi phí kỹ thuật không cần thiết khi hệ thống đã có sẵn HTTP API ổn định để trả về dữ liệu giá đơn giản. D. Sai: Chuyển giao agent (agent handoff) phù hợp cho các quy trình phức tạp đòi hỏi ra quyết định đa bước. Đối với một tra cứu dữ liệu đơn giản, việc tạo thêm một agent chỉ làm tăng đáng kể độ trễ (latency) và chi phí xử lý.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q71.", "n": 98}, {"cat": "T", "topic": 3, "q": "You are running a controlled experiment to compare two prompts and must complete the design steps before executing the experiment. Which two steps must be completed BEFORE running the experiment with random assignment? (Select two.) Each correct answer presents part of the solution.", "o": ["Determine the minimum detectable effect size and the sample size needed for power.", "Decide whether to promote, reject, or iterate the candidate based on the analysis.", "Define the hypothesis and the primary success metric for the comparison.", "Analyze the results against the predefined success metric and significance threshold.", "Document the recommendation, the trade-offs accepted, and the alternatives considered."], "a": [0, 2], "sk": ["Which two steps must be completed BEFORE running the"], "note": "Đáp án: {A} + {C}.", "ex": "Đáp án đúng: A, C. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. (Phần còn lại là giải thích mẫu tự động: A, C — Đúng; B, D, E — Sai — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q2.", "n": 99}, {"cat": "T", "topic": 1, "q": "A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing. The team spends approximately 40 percent of engineering capacity on infrastructure maintenance, message bus reliability, and agent state recovery. The CFO has asked you to evaluate moving to managed agent infrastructure to reclaim engineering capacity. The security officer requires that all customer financial data remain within an approved network boundary. Which factor should most heavily influence your recommendation?", "o": ["Whether the current seven agents map cleanly to the patterns supported by managed agents.", "Whether managed agents reduce per-invoice token costs across the existing processing volume.", "Whether managed agents support the current bus topology used by the platform team.", "Whether managed agent data handling satisfies the network boundary required by security."], "a": 3, "sk": ["Which factor should most heavily influence your recommendation"], "note": "Đáp án: {D}.", "ex": "Đáp án đúng: D. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, C — Sai; D — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q15.", "n": 100}, {"cat": "T", "topic": 7, "q": "You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision. Which presentation strategy best serves both audiences?", "o": ["Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs.", "Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience.", "Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it.", "Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."], "a": 1, "sk": ["Which presentation strategy best serves both audiences"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng cho câu Q50 trên trang CertLab là B.\nB — Đúng: Khi trình bày trước đối tượng khán giả kết hợp (mixed audience), chiến lược hiệu quả nhất là bắt đầu bằng quyết định, kết quả kinh doanh đạt được và các đánh đổi đã chấp nhận (dành cho cấp lãnh đạo), sau đó nói sâu về cơ sở kỹ thuật, các giải pháp thay thế và tác động triển khai (dành cho nhóm kỹ thuật).\nLý do các phương án còn lại không chính xác: A: Đi thẳng vào chi tiết kỹ thuật chuyên sâu ngay từ đầu sẽ làm cấp quản lý/lãnh đạo mất tập trung và khó nắm bắt bức tranh tổng thể. C: Bỏ qua toàn bộ lý do/cơ sở lập luận sẽ khiến cả hai nhóm đối tượng không hiểu được nguyên nhân đằng sau quyết định kiến trúc. D: Trình bày một nội dung hỗn hợp không phân loại sẽ làm bài nói bị rối, không đáp ứng đúng mức độ quan tâm riêng biệt của từng nhóm người nghe.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q50.", "n": 101}, {"cat": "E", "topic": 6, "q": "You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role. Where should role-based access control be enforced in the pipeline?", "o": ["Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents.", "At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model.", "Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control.", "After the response is generated, by post-filtering content that should not have been retrieved."], "a": 1, "sk": ["Where should role-based access control be enforced in the"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng cho câu Q52 trên trang Active Exam — CertLab là B.\nB — Đúng: Kiểm soát truy cập dựa trên vai trò (RBAC) phải được thực thi ngay tại tầng truy xuất (retrieval layer), trước khi bất kỳ nội dung bị giới hạn quyền nào được đưa vào bước xây dựng prompt hoặc gửi tới mô hình. Điều này đảm bảo ngăn chặn rò rỉ dữ liệu ngay từ gốc.\nLý do các phương án còn lại không chính xác: A: Đưa quy định quyền vào system prompt dưới dạng hướng dẫn ngôn ngữ tự nhiên không đảm bảo an toàn tuyệt đối, vì mô hình vẫn có thể bị vượt qua (prompt injection) hoặc nhầm lẫn. C: Tin tưởng mô hình tự suy luận ranh giới phân quyền là cực kỳ rủi ro và không đáp ứng tiêu chuẩn an toàn/kiểm toán. D: Lọc nội dung sau khi mô hình đã sinh phản hồi (post-filtering) là quá trễ, vừa lãng phí chi phí token/độ trễ, vừa tạo rủi ro rò rỉ thông tin trong ngữ cảnh hội thoại.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q52.", "n": 102}, {"cat": "T", "topic": 7, "q": "A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal-document summarization system. The report includes these observations: Average summarization time decreased from 47 minutes to 6 minutes per document. Associates spend less time on summaries, but overall billable output has not measurably changed. Infrastructure costs increased by 22% because redundant retry logic generated additional API calls. Some summaries require attorney correction, adding an average of 8 minutes of review per document. Which analysis correctly attributes each observation to the appropriate business-value pillar?", "o": ["Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue.", "Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue.", "Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering.", "Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized; Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."], "a": 3, "sk": ["Which analysis correctly attributes each observation to the appropriate"], "note": "Đáp án: {D}.", "ex": "Đáp án đúng: D. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, C — Sai; D — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q90.", "n": 103}, {"cat": "T", "topic": 4, "q": "A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query. The CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside the organization's tenancy. Which optimization approach should you recommend?", "o": ["Summarize each filing once at intake and run all subsequent queries against the summary.", "Cache the filing as the prompt prefix for reuse across the 14 queries per case.", "Index filings in a vector store and retrieve only the relevant passages per query.", "Move the workload to a smaller Claude model to reduce the per-token cost paid."], "a": 1, "sk": ["Which optimization approach should you recommend"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng cho câu Q39 trên trang CertLab là B.\nB — Đúng: Việc lưu bộ đệm tiền tố (Prompt Caching) cho tài liệu tài liệu hồ sơ pháp lý (~80,000 token) cho phép tái sử dụng ngữ cảnh này qua 14 truy vấn của luật sư. Phương pháp này giảm đến 90% chi phí xử lý token đầu vào cho các lượt truy vấn sau, đồng thời duy trì toàn bộ ngữ cảnh gốc (không giảm chất lượng câu trả lời) và lưu trữ ngay trong phiên làm việc của API (tuân thủ yêu cầu bảo mật tài nguyên tenant).\nLý do các phương án còn lại không chính xác: A: Tóm tắt tài liệu làm mất chi tiết chuyên sâu của hồ sơ pháp lý, ảnh hưởng trực tiếp đến chất lượng câu trả lời cho các câu hỏi chi tiết. C: Việc lưu trữ hồ sơ vào một vector store bên ngoài và chỉ truy xuất các đoạn văn bản liên quan có thể vi phạm yêu cầu của cán bộ bảo mật về việc không lưu nội dung tài liệu ngoài phạm vi tài nguyên tenant (tenancy). D: Chuyển sang mô hình nhỏ hơn làm giảm khả năng suy luận và chất lượng câu trả lời đối với các phân tích pháp lý phức tạp.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q39.", "n": 104}, {"cat": "T", "topic": 2, "q": "You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch. Which response is most appropriate?", "o": ["Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed.", "Reinstall the operating system to clear all permission state without first confirming whether the one-time permission grant caused the failure.", "Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs.", "Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed."], "a": 0, "sk": ["Which response is most appropriate"], "note": "Đáp án: {A}.", "ex": "Đáp án đúng: A. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: B, C, D — Sai; A — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q7.", "n": 105}, {"cat": "T", "topic": 3, "q": "You are classifying chunking strategies by the corpus type each is best suited to. For each chunking strategy, select the appropriate corpus type: 'Long Structured Documents,' 'Heterogeneous Short Records,' or 'Code or Hierarchical Specifications.'", "o": ["Function-level or section-level chunking for code modules", "Tree-aware chunking that follows code or specification hierarchy", "Per-record chunking where each record is one chunk", "Semantic chunking along clause or paragraph boundaries", "Fixed-size chunking with overlap for short records of similar length", "Hierarchical chunking that mirrors document section structure"], "a": [3, 5], "sk": [], "note": "Long Structured Documents: {D} + {F} · Heterogeneous Short Records: {C} + {E} · Code or Hierarchical Specifications: {A} + {B}.", "ex": "Phân loại đầy đủ (câu gốc dạng phân loại):\nA — Function-level or section-level chunking for code modules → Code or Hierarchical Specs\nB — Tree-aware chunking that follows code or specification hierarchy → Code or Hierarchical Specs\nC — Per-record chunking where each record is one chunk → Heterogeneous Short Records\nD — Semantic chunking along clause or paragraph boundaries → Long Structured Documents\nE — Fixed-size chunking with overlap for short records of similar length → Heterogeneous Short Records\nF — Hierarchical chunking that mirrors document section structure → Long Structured Documents\n\n(mẫu tự động) mỗi dòng: Thuộc nhóm “…” vì chức năng được mô tả diễn ra đúng tại lớp hoặc giai đoạn đó; các nhóm còn lại đảm nhiệm vai trò khác trong quy trình.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q22.", "n": 106, "cls": {"c": ["Long Structured Documents", "Heterogeneous Short Records", "Code or Hierarchical Specifications"], "m": [2, 2, 1, 0, 1, 0]}}, {"cat": "T", "topic": 6, "q": "You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI. Which transparency practice most directly supports responsible deployment?", "o": ["Misrepresent the AI's role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency.", "Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information.", "Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed.", "Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system."], "a": 2, "sk": ["Which transparency practice most directly supports responsible deployment"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống.\nC. (Công khai việc sử dụng AI cho người dùng cuối theo chính sách minh bạch của tổ chức và cung cấp một quy trình rõ ràng để kết nối với con người khi cần thiết.) Đúng: Triển khai AI có trách nhiệm đòi hỏi người dùng cuối phải được biết họ đang tương tác với AI và luôn có lựa chọn chuyển tiếp sang hỗ trợ từ con người (human-in-the-loop) khi AI không đáp ứng được yêu cầu hoặc khi phát sinh sự cố.\nA. (Bóp méo/giả mạo vai trò của AI để tránh sự hoài nghi của người dùng về nội dung do AI tạo ra.) Sai: Đây là hành vi lừa dối người dùng, vi phạm nghiêm trọng các nguyên tắc đạo đức và tính minh bạch trong AI. B. (Từ chối trả lời bất kỳ câu hỏi nào của người dùng về cách các phản hồi được tạo ra.) Sai: Việc thiếu giải thích và thiếu giải trình đi ngược lại mục tiêu minh bạch thông tin. D. (Chỉ tiết lộ việc sử dụng AI cho nhân viên nội bộ và người vận hành, đồng thời giấu thông tin đó đối với người dùng cuối.) Sai: Giấu thông tin với người dùng cuối (end-users) không đáp ứng tiêu chuẩn minh bạch đối với dịch vụ hướng tới khách hàng (customer-facing).\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q78.", "n": 107}, {"cat": "T", "topic": 7, "q": "You are selecting the documentation set that should accompany a Claude-based deployment at handoff. Which set is most complete?", "o": ["Architecture overview, ADRs, component-level diagrams, runbooks for common operations, an on-call playbook, and a list of known limitations.", "Code comments scattered across individual source files with no integrating architecture overview, no ADRs, no runbooks, and no on-call playbook to orient operators or new team members.", "A single one-page architecture diagram with no ADRs, no runbooks, no on-call playbook, and no list of known limitations to support operators or future maintainers.", "A verbal handover walkthrough conducted on the day of transition, with no written architecture overview, ADRs, runbooks, playbook, or known limitations captured for future reference."], "a": 0, "sk": ["Which set is most complete"], "note": "Đáp án: {A}.", "ex": "A complete handoff package must help different stakeholders understand, operate, troubleshoot, and evolve the Claude-based solution. An architecture overview explains the system’s structure and responsibilities, while Architecture Decision Records document important decisions, alternatives, and trade-offs. Component-level diagrams provide implementation context without forcing maintainers to reconstruct dependencies from source code. Operational runbooks and an on-call playbook enable reliable incident detection, diagnosis, escalation, and recovery. Documenting known limitations is particularly important for Claude applications because model behavior can vary with prompts, context, input distribution, and external dependencies. Options B, C, and D each provide only a partial or temporary understanding of the system. They would create knowledge gaps, increase operational risk, and make future maintenance dependent on individuals rather than durable organizational documentation.\n\nNguồn: tệp ccar-p-new-questions.md, Set 3 · Q117.", "n": 108}, {"cat": "T", "topic": 7, "q": "You are transitioning a Claude-based deployment from design into implementation. Which handoff package most directly supports a clean transition?", "o": ["The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register.", "A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRs, component contracts, evaluation framework, runbooks, playbook, or known limitations.", "Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on-call playbook, and known limitations.", "Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation framework, runbooks, on-call playbook, or known-limitations register to support the delivery team."], "a": 2, "sk": ["Which handoff package most directly supports a clean transition"], "note": "Đáp án: {C}.", "ex": "Đáp án đúng: C. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, D — Sai; C — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q28.", "n": 109}, {"cat": "T", "topic": 7, "q": "You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band. Which response is most appropriate?", "o": ["Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population.", "Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release.", "Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population.", "Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset."], "a": 1, "sk": ["Which response is most appropriate"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng: B. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: A, C, D — Sai; B — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q87.", "n": 110}, {"cat": "T", "topic": 6, "q": "A technical team is cataloguing risks specific to Claude's use in a document-grounded Q&A system. Which two items represent failure modes intrinsic to LLM-based systems rather than generic software defects? (Select two.)", "o": ["An expired TLS certificate blocks outbound API calls to Claude.", "A database connection timeout causes retrieval to return an empty result set.", "The model refuses a legitimate query because surface features trigger an overly broad safety pattern.", "A misconfigured load balancer routes requests to a deprecated API version.", "The model generates a plausible-sounding answer unsupported by any retrieved document."], "a": [2, 4], "sk": ["Which two items represent failure modes intrinsic to LLM-based"], "note": "Đáp án: {C} + {E}.", "ex": "Đáp án đúng: C, E. Các phương án này bổ sung cho nhau và cùng đáp ứng đầy đủ những yêu cầu được nêu trong tình huống. (Phần còn lại là giải thích mẫu tự động: A, B, D — Sai; C, E — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q8.", "n": 111}, {"cat": "T", "topic": 2, "q": "You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins. Which adjustment most directly addresses this issue without removing capability?", "o": ["Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront.", "Disable every MCP server in the configuration to free up context budget, accepting that the team loses all tool access and cannot perform any MCP-dependent task in the session.", "Increase the prompt's verbosity with additional instructions and context, which consumes more of the context budget rather than reducing the tool-definition overhead causing the issue.", "Add additional MCP servers to give the team more capability, which increases rather than reduces the number of tool definitions loaded into the session's context budget."], "a": 0, "sk": ["Which adjustment most directly addresses this issue without removing"], "note": "Đáp án: {A}.", "ex": "Đáp án đúng: A. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: B, C, D — Sai; A — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q5.", "n": 112}, {"cat": "T", "topic": 7, "q": "You are rolling out monitoring for a Claude-based deployment and must complete the specification steps before instrumenting the deployment. Which two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces? (Select two.) Each correct answer presents part of the solution.", "o": ["Define the metrics and the slices the deployment will monitor across normal and adversarial traffic.", "Tune the alert thresholds based on observed normal-state distributions to reduce false positives.", "Define the service-level objectives (SLOs) and the error budgets the deployment will be held to.", "Build the dashboards that surface metrics across slices at the cadence the team operates on.", "Document the dashboards, alerts, and runbooks for the on-call rotation that will respond."], "a": [0, 2], "sk": ["Which two steps must be completed BEFORE instrumenting the"], "note": "Đáp án: {A} + {C}.", "ex": "Tại sao A & C đúng: Trước khi viết mã phát dữ liệu (instrumentation), bạn phải biết cần đo lường cái gì (định nghĩa metrics & slices ở A) và mục tiêu đo lường là gì (xác định SLOs & Error Budgets ở C). Đây là các bước thiết kế/định nghĩa bắt buộc phải có trước để lập trình viên biết chính xác cần chèn mã theo dõi ở đâu và thu thập tham số nào.\nTại sao các đáp án khác sai: B: Tinh chỉnh ngưỡng cảnh báo (alert thresholds) chỉ có thể thực hiện sau khi hệ thống đã chạy và thu thập được dữ liệu thực tế. D & E: Việc xây dựng dashboard, cài đặt rule cảnh báo và viết tài liệu bàn giao chỉ thực hiện sau khi mã đo lường đã hoạt động và đang gửi dữ liệu về hệ thống.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q99.", "n": 113}, {"cat": "T", "topic": 7, "q": "You are defining an SLA for a Claude-based assistant. Which SLA definition is most operationally meaningful?", "o": ["A target tied to a stakeholder sentiment measure such as “the team feels satisfied,” which cannot be measured objectively or used to trigger a documented breach response.", "A measurable target with a defined metric, threshold, evaluation window, and consequence for breach—for example, 'p95 per-request latency under 800 ms over a 28-day window.'", "A qualitative commitment such as “the system will be fast and reliable,” which names no metric, threshold, or evaluation window.", "A target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined."], "a": 1, "sk": ["Which SLA definition is most operationally meaningful"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng: B. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống.\nB. (Một mục tiêu có thể đo lường được với chỉ số, ngưỡng, cửa sổ đánh giá và hậu quả vi phạm được xác định rõ ràng—ví dụ: 'độ trễ p95 cho mỗi yêu cầu dưới 800 ms trong khoảng thời gian 28 ngày'.) Đúng: Một SLA (Service Level Agreement) có ý nghĩa về mặt vận hành phải đáp ứng đầy đủ 4 yếu tố cấu thành bắt buộc: chỉ số đo lường (metric), ngưỡng định lượng (threshold), khung thời gian đánh giá (evaluation window) và chế tài/hậu quả khi vi phạm (consequence for breach).\nA. (Một mục tiêu gắn liền với cảm nhận của các bên liên quan mà không có ngưỡng hoặc cửa sổ đánh giá được xác định.) Sai: Cảm nhận là định tính, thiếu các chỉ số kỹ thuật và cửa sổ thời gian cụ thể nên không thể theo dõi hay đo lường chính xác. C. (Một cam kết định tính như 'hệ thống sẽ nhanh và đáng tin cậy,' mà không có tiêu chí đo lường.) Sai: Đây chỉ là một tuyên bố nguyện vọng (slogan), không có giá trị kỹ thuật hay pháp lý đối với một SLA. D. (Một mục tiêu gọi tên chỉ số và ngưỡng nhưng bỏ qua cửa sổ đánh giá và hậu quả vi phạm.) Sai: Thiếu khung thời gian (ví dụ: tính theo ngày hay theo tháng) và chế tài xử lý thì không đủ điều kiện để thực thi và giám sát vận hành thực tế.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q80.", "n": 114}, {"cat": "T", "topic": 6, "q": "You are supporting an EU-based deployment with GDPR obligations. Which combination of measures best supports the deployment's GDPR posture?", "o": ["Enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subject rights handling.", "Disabling all data-retention configuration, redaction controls, and data-subject-rights handling to simplify the deployment.", "Using a personal Claude account tier for processing EU personal data at scale, with no signed Data Processing Addendum and no documented data-subject-rights handling procedure.", "Pasting full EU personal data into every prompt to “give Claude complete context” without considering purpose limitation, data minimization, or the organization's Data Processing Addendum obligations."], "a": 0, "sk": ["Which combination of measures best supports the deployment's GDPR"], "note": "Đáp án: {A}.", "ex": "⚠ LỖI DỮ LIỆU TRÊN SITE: lời giải thích hiển thị không khớp câu hỏi (là nội dung của câu Q93 về Skill/application layer, chọn \"A và B\"). Nguyên văn trên site: Đáp án đúng: A và B. Giải thích: Tại sao A & B đúng: Các tác vụ kiểm soát truy cập (Authentication/Authorization) và kiểm toán (Auditing/Logging) bắt buộc phải do tầng ứng dụng (application layer) đảm nhận. Mô hình LLM hay Claude Skill không thể tự đảm bảo tính xác thực của quyền người dùng, cũng như không thể đảm bảo việc ghi log diễn ra đáng tin cậy 100% không bị bỏ sót hoặc can thiệp. Tại sao các đáp án khác sai: C, D, E: Định dạng văn bản, thêm mẫu miễn trừ trách nhiệm (disclaimer) hoặc tuân thủ danh sách từ ngữ cấm/phong cách viết hoàn toàn có thể được định cấu hình trực tiếp bên trong prompt system hoặc quy tắc xử lý văn bản của Claude Skill.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q94.", "n": 115}, {"cat": "T", "topic": 4, "q": "The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume Claude pipeline without degrading output quality on the core use case. Which two optimizations directly target both cost and latency simultaneously? (Select two.)", "o": ["Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls.", "Route straightforward query types to a smaller, faster Claude model and reserve the full model for complex cases.", "Increase max_tokens to reduce the frequency of truncated responses requiring follow-up calls.", "Add a retrieval step that fetches the full source corpus into the context window before generation.", "Expand the system prompt to include additional few-shot examples on every request."], "a": [0, 1], "sk": ["Which two optimizations directly target both cost and latency"], "note": "Đáp án: {A} + {B}.", "ex": "Đáp án đúng cho câu Q41 trên trang CertLab là A và B.\nA — Đúng: Prompt Caching giúp giảm số lượng input token cần tính phí trên các lượt gọi lặp lại và giảm đáng kể thời gian xử lý thời gian phản hồi ban đầu (time-to-first-token latency / p95 latency) nhờ tận dụng bộ đệm ngữ cảnh sẵn có.\nB — Đúng: Model Routing (Định tuyến mô hình) phân loại truy vấn để gửi các tác vụ đơn giản đến các mô hình nhỏ hơn, rẻ hơn và nhanh hơn (như Haiku/Sonnet), chỉ dùng mô hình lớn (Opus) cho câu hỏi phức tạp. Điều này giúp giảm đồng thời cả chi phí trung bình lẫn độ trễ p95.\nLý do các phương án còn lại không chính xác: C: Tăng max_tokens không trực tiếp giảm độ trễ hay chi phí cho từng truy vấn thông thường, thậm chí có thể làm tăng thời gian chờ nếu câu trả lời sinh ra dài hơn. D: Nạp toàn bộ tập văn bản gốc (full corpus) vào context window làm tăng mạnh số lượng input token, dẫn đến tăng chi phí và tăng độ trễ p95. E: Thêm nhiều ví dụ few-shot vào system prompt sẽ làm tăng độ dài prompt, làm tăng chi phí và độ trễ trên mỗi yêu cầu.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q41.", "n": 116}, {"cat": "T", "topic": 5, "q": "You are integrating Claude Code into the team's pull-request workflow. The team wants AI-assisted review without removing human approval. Which integration design best fits this requirement?", "o": ["Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer retains the approval decision under the existing branch-protection rules.", "Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules.", "Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate.", "Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author."], "a": 0, "sk": ["Which integration design best fits this requirement"], "note": "Đáp án: {A}.", "ex": "Đáp án đúng: A. Đây là phương án giải quyết trực tiếp nhất yêu cầu trọng tâm của tình huống. (Phần còn lại là giải thích mẫu tự động: B, C, D — Sai; A — Đúng — rút gọn.)\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q14.", "n": 117}, {"cat": "E", "topic": 4, "q": "You are operating an interactive assistant whose dominant performance constraint is per-turn latency. Quality on routine turns is already acceptable. Which configuration adjustment most directly improves latency without disproportionately damaging quality?", "o": ["Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions.", "Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system-prompt content.", "Increase retrieval depth to the corpus maximum to improve recall regardless of latency.", "Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it."], "a": 1, "sk": ["Which configuration adjustment most directly improves latency without disproportionately"], "note": "Đáp án: {B}.", "ex": "Đáp án đúng là B.\nB — Đúng: Giảm độ sâu truy xuất (retrieval depth) xuống tập các đoạn văn top-k có khả năng bao phủ câu trả lời tốt nhất, đồng thời lưu bộ nhớ đệm (cache) cho các nội dung system prompt cố định. Đây là giải pháp cải thiện độ trễ (latency) trực tiếp và hiệu quả nhất vì giảm số lượng token cần xử lý ở bước truy xuất mà không làm ảnh hưởng đáng kể đến chất lượng câu trả lời.\nLý do các phương án còn lại không chính xác: A: Tắt tính năng lưu bộ nhớ đệm prompt (prompt caching) sẽ buộc hệ thống phải tính toán lại toàn bộ prompt ở mỗi lượt, làm tăng đáng kể độ trễ và chi phí. C: Tăng độ sâu truy xuất sẽ đưa thêm nhiều dữ liệu vào ngữ cảnh, làm tăng số lượng token và khiến độ trễ tăng cao hơn. D: Chuyển sang mô hình lớn nhất (heaviest model) ở mỗi lượt sẽ làm tăng mạnh thời gian phản hồi, đi ngược lại mục tiêu tối ưu độ trễ.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q62.", "n": 118}, {"cat": "T", "topic": 5, "q": "The engineering lead at Trenova Systems, Inc. is evaluating two proposals for improving developer workflows using Claude-assisted tooling. Proposal A adds Claude Code to the IDE for inline code generation and review. Proposal B routes all code-generation requests through a shared Slack bot without IDE integration. Which two observations most accurately evaluate these proposals against workflow-improvement objectives? (Select two.)", "o": ["Proposal B is superior because centralizing requests in Slack creates an auditable log of all code-generation activity.", "Proposal B introduces workflow friction by requiring developers to leave the IDE, undermining the productivity objective.", "Proposal A reduces context switching by providing AI assistance at the point of development without requiring a separate tool.", "Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue.", "Both proposals are equivalent because the model capabilities are identical regardless of the integration point."], "a": [1, 2], "sk": ["Which two observations most accurately evaluate these proposals against"], "note": "Đáp án: {B} + {C}.", "ex": "Đáp án đúng cho câu Q38 trên trang CertLab là B và C.\nB — Đúng: Phương án B buộc lập trình viên phải chuyển đổi qua lại giữa môi trường phát triển (IDE) và Slack, tạo ra rào cản luồng công việc (workflow friction) và giảm hiệu suất chung.\nC — Đúng: Phương án A tích hợp trực tiếp vào IDE giúp giảm thiểu việc chuyển đổi ngữ cảnh (context switching) bằng cách hỗ trợ AI ngay tại điểm viết mã mà không cần công cụ trung gian.\nLý do các phương án còn lại không chính xác: A: Dù việc lưu vết trên Slack có tạo ra nhật ký kiểm toán, điều này không làm cho Phương án B vượt trội hơn về mặt cải thiện luồng làm việc lập trình. D: Xử lý bất đồng bộ qua thông báo Slack chỉ gây chậm trễ hơn thay vì nâng cao tốc độ luồng công việc (workflow velocity). E: Mặc dù mô hình AI nền tảng có thể giống nhau, điểm tích hợp (integration point) quyết định lớn đến trải nghiệm người dùng, tốc độ và sự gián đoạn luồng công việc.\n\nNguồn: tệp ccar-p-new-questions.md, Set 1 · Q38.", "n": 119}, {"cat": "T", "topic": 7, "q": "You are choosing the level of detail for an implementation guide. The audience is a delivery team that will build the deployment. Which guidance composition best serves them?", "o": ["Component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks.", "Component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks.", "An architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration-parameter tables, or operational runbooks for the delivery team to follow.", "An architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation."], "a": 0, "sk": ["Which guidance composition best serves them"], "note": "Đáp án: {A}.", "ex": "Đáp án đúng: A. (Trách nhiệm của từng thành phần, hợp đồng giao tiếp (contracts) giữa các thành phần, biểu đồ tuần tự (sequence diagrams) của các luồng chính, các tham số cấu hình kèm giá trị mặc định, và tài liệu hướng dẫn vận hành (runbooks).) Đúng: Đội ngũ thực thi/triển khai (delivery team) cần một tài liệu kỹ thuật toàn diện, có tính thực tiễn cao để vừa viết code, tích hợp các thành phần, vừa triển khai và vận hành được hệ thống. Tất cả các chi tiết về giao tiếp, tham số cấu hình và runbook đều cần thiết cho công việc của họ.\nB/C/D — Sai: B thiếu sequence diagrams/tham số cấu hình/runbook; C thiếu cấu hình và runbook; D chỉ là tóm tắt cho quản lý/kiến trúc sư, thiếu chi tiết triển khai.\n\nNguồn: tệp ccar-p-new-questions.md, Set 2 · Q76.", "n": 120}];
const COURSE_CH = [{"id": 1, "title": "Thiết kế giải pháp & kiến trúc agent", "rules": ["Bước <b>cố định, biết trước<\/b> → workflow/chuỗi prompt do code điều phối; chỉ dùng agent khi đường đi <b>không biết trước<\/b>.", "Multi-agent chỉ khi việc tách được thành phần <b>độc lập<\/b>; sửa đổi <b>phụ thuộc chặt<\/b> → một agent, một context. Giao việc cho subagent: <b>mục tiêu, phạm vi, định dạng đầu ra, điểm dừng<\/b>.", "Discovery: hỏi rõ <b>kết quả kinh doanh đo được<\/b>, người dùng, ràng buộc; tách yêu cầu chức năng và <b>phi chức năng<\/b> (độ trễ, bảo mật, khả dụng).", "Human-in-the-loop đặt <b>trước hành động khó đảo ngược<\/b>; escalation theo <b>tiêu chí rõ<\/b> (ngưỡng confidence, nhóm tác động lớn, yêu cầu của người dùng) và bàn giao kèm <b>tóm tắt có cấu trúc<\/b>.", "Vòng lặp agent: đọc <code>stop_reason<\/code>, trả mọi <code>tool_result<\/code> đúng <code>tool_use_id<\/code>, lưu <b>checkpoint<\/b> để resume; ràng buộc bắt buộc → ép bằng <b>code/hook<\/b>, không chỉ dặn trong prompt.", "Claude <b>không phù hợp<\/b> làm giải pháp chính cho tính toán real-time dưới 50 ms hay thay vector index; hợp với đọc hiểu, trích xuất, phân loại có lý do."]}, {"id": 2, "title": "Tool, MCP & tích hợp", "rules": ["Chọn sai tool → viết lại <b>mô tả tool<\/b> (làm gì, khi nào dùng, tham số); <b>gộp/bỏ<\/b> tool trùng; quá nhiều tool → <b>tách theo domain<\/b> / Tool Search.", "Schema <b>chặt<\/b>, validate trước khi chạy, trả <b>lỗi có cấu trúc<\/b> (<code>is_error<\/code>, retry được không); lỗi tạm thời → retry có <b>backoff<\/b> trong tool.", "MCP: dữ liệu đọc → <b>resource<\/b>; hành động → <b>tool<\/b>; workflow người dùng chọn → <b>prompt<\/b>. Local → <b>stdio<\/b>; dùng chung từ xa → <b>HTTP + OAuth<\/b> theo người dùng.", "Một lời gọi <b>đơn lẻ, stateless, độ trễ thấp<\/b> → gọi API trực tiếp; MCP khi cần tái sử dụng/khám phá tool qua nhiều client.", "<b>Least privilege<\/b>: chỉ giữ tool đúng trách nhiệm (đọc catalog, viết nháp); bỏ tool gửi trực tiếp/ admin không liên quan; hành động có tác dụng phụ phải <b>idempotent<\/b>."]}, {"id": 3, "title": "Prompt, RAG & structured output", "rules": ["Đầu ra cho hệ thống → <b>schema + structured output<\/b> và <b>validate<\/b> trước khi đưa xuống; cho phép <b>null/not_found<\/b> để không bịa.", "Grounding: trích dẫn trước rồi trả lời, <b>citations<\/b>, cho phép nói “không có trong tài liệu”. Mâu thuẫn trong system prompt → <b>sửa chỉ dẫn<\/b> cho nhất quán.", "Retrieval: dense cho diễn đạt khác, sparse/keyword cho <b>mã, định danh<\/b>, <b>hybrid + rerank<\/b>; chunk theo <b>cấu trúc<\/b> tài liệu (đoạn/mục, hàm/cây cho code, mỗi bản ghi một chunk).", "Phân loại tập đóng có mô tả rõ → bắt đầu <b>zero-shot<\/b>; few-shot <b>đa dạng, cân bằng<\/b> để neo định dạng. Chain-of-thought <b>không mặc định<\/b> cho mọi việc.", "Hành vi đổi sau <b>nâng cấp model<\/b> → tái hiện trên phiên bản cũ, chạy lại eval; so sánh prompt bằng <b>thí nghiệm có kiểm soát<\/b> (cùng bộ dữ liệu, tiêu chí định trước)."]}, {"id": 4, "title": "Model, chi phí & hiệu năng", "rules": ["Tiền tố lớn lặp lại → <b>prompt caching<\/b>: nội dung ổn định đặt trước, nội dung động sau breakpoint.", "Khối lượng lớn, không gấp → <b>Batch API<\/b>; tương tác cần nhanh → <b>streaming<\/b>, model nhỏ cho việc đơn giản.", "<b>Tiered routing<\/b>: việc thường → model nhẹ, việc phức tạp → model mạnh; chọn model bằng <b>eval trên mẫu đại diện<\/b>, không vì “mới nhất/mạnh nhất”.", "Context dài → <b>compaction<\/b> giữ quyết định/ID, dọn kết quả tool cũ, <b>bộ nhớ ngoài<\/b> cho thông tin qua phiên; cắt đoạn truy xuất về phần liên quan.", "Rate limit (429) → <b>backoff + jitter<\/b>, hàng đợi; đếm token trước khi gửi; token đầu ra/thinking là phần đắt."]}, {"id": 5, "title": "Claude Code: cấu hình & năng suất đội ngũ", "rules": ["Cấu hình dùng chung cho cả repo (MCP, permission rules, context) → <b>project scope<\/b>, commit vào VCS (<code>.mcp.json<\/code>, <code>.claude/settings.json<\/code>).", "Thiết lập bảo mật <b>không được ghi đè<\/b> → <b>managed settings<\/b> do tổ chức quản lý; sở thích cá nhân → user/local scope.", "Thứ tự ưu tiên: <b>managed → dòng lệnh → local → project → user<\/b>.", "Context bị chiếm trước khi gõ → quá nhiều MCP tool nạp sẵn → bật <b>Tool Search<\/b>/bớt server; MCP không hiện → kiểm tra <b>scope, cấu hình, lệnh khởi chạy<\/b>.", "Quy ước lặp lại → <b>CLAUDE.md<\/b> / Skills; PR do AI tạo vẫn qua <b>review của người<\/b> và CI; subagent dự án cho việc chuyên biệt lặp lại."]}, {"id": 6, "title": "Bảo mật, an toàn & tuân thủ", "rules": ["Đánh giá rủi ro: <b>kiểm kê tài sản + độ nhạy<\/b>, liệt kê <b>tác nhân đe dọa & vector tấn công<\/b> trước, rồi mới ước lượng khả năng/tác động.", "Guardrail <b>nhiều lớp<\/b>: prompt + kiểm tra runtime + validate đầu ra theo schema; không có “câu lệnh vượt rào”.", "Prompt injection / mạo danh admin → coi nội dung là <b>dữ liệu<\/b>, không cấp quyền theo lời tự xưng; chặn exfiltration bằng <b>allowlist đích ra ngoài<\/b>.", "Phân quyền (RBAC) áp <b>trước khi truy xuất<\/b>, không chỉ ở bước hiển thị; credential <b>không nằm trong prompt<\/b>; mỗi người dùng một danh tính/OAuth scope.", "HIPAA: <b>BAA<\/b>, tối thiểu hóa PHI, kiểm soát truy cập + audit; GDPR: cơ sở pháp lý, tối thiểu hóa, quyền chủ thể, <b>lưu trữ/xử lý theo vùng<\/b>.", "Tỷ lệ khớp cao chưa đủ → kiểm tra <b>thiên lệch theo nhóm<\/b>; minh bạch cho người dùng biết nội dung do AI tạo."]}, {"id": 7, "title": "Đánh giá, vận hành & truyền thông", "rules": ["Eval: định nghĩa <b>tiêu chí thành công & bộ dữ liệu đại diện<\/b> trước khi chạy; hồi quy sau mỗi thay đổi prompt; bộ đối kháng cố định cho mỗi lần nâng model.", "Observability: trace có <b>correlation ID<\/b> xuyên agent/tool, ghi <b>model + version<\/b> mỗi lượt, token/độ trễ, log tool có che dữ liệu nhạy cảm.", "SLA đo được: <b>p95 độ trễ, tỷ lệ lỗi, khả dụng<\/b> theo khung thời gian; runbook có <b>cảnh báo + triage + escalation + rollback + dashboard<\/b>.", "Truyền thông quyết định: <b>bối cảnh, phương án đã cân nhắc, đánh đổi, rủi ro<\/b>, điều chỉnh theo người nghe (exec: tác động; kỹ thuật: chi tiết); ADR cho audit.", "Bàn giao: tài liệu kiến trúc, quyết định, vận hành, giới hạn đã biết; yêu cầu mới phát sinh → <b>đánh giá tác động & thay đổi phạm vi có kiểm soát<\/b>.", "Tín hiệu quay lại thiết kế: giả định gốc sai, yêu cầu thay đổi căn bản, vá liên tục không cải thiện."]}];
