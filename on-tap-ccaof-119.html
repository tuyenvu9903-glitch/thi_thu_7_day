và chỉnh sửa kết quả, tự nó không thực hiện phép tính; {C} Research dùng để tìm và tổng hợp nguồn bên ngoài, không tính trên file; {D} Chat thường chỉ sinh chữ, không chạy code nên số liệu không được kiểm chứng.", "ex": "Tại sao chọn đáp án đúng (“Use Code Execution, which runs code in a sandbox…”):\n\nYêu cầu là tính toán tất định trên bảng tính nhiều tab. Code Execution chạy code trong sandbox trên file đã tải lên, nên kết quả được tính thật, lặp lại được và kiểm lại được.\n\nTại sao các phương án khác sai\n“Use an Artifact alone for the calculations, which provides…”: Artifact chỉ là nơi hiển thị và chỉnh sửa kết quả, tự nó không thực hiện phép tính.\n\n“Use the Research feature for the calculations, which gathers…”: Research dùng để tìm và tổng hợp nguồn bên ngoài, không tính trên file.\n\n“Use a standard chat prompt for the calculations, which…”: Chat thường chỉ sinh chữ, không chạy code nên số liệu không được kiểm chứng."}, {"n": 112, "cat": "T", "topic": 2, "q": "A Claude associate is investigating a Claude response that answered only one of three required questions in a prompt. The prompt presented all three questions in one paragraph, separated by commas. Which root cause is most likely?", "o": ["The prompt was too long and Claude focused on the question with the strongest grounding in the surrounding context.", "The prompt’s required questions were addressed implicitly across the response, even though the response did not visibly answer each question.", "The prompt’s task statement did not enumerate the three required questions explicitly enough for Claude to address each one in turn.", "The prompt’s audience and tone specification overshadowed the task statement, so Claude prioritized voice over coverage."], "a": 2, "sk": ["separated by commas"], "note": "Đáp án: {C}. Bẫy: {A} Không có dấu hiệu prompt quá dài; vấn đề là cấu trúc; {B} Câu trả lời không thể hiện rõ việc trả lời ba câu thì không thể coi là đã trả lời; {D} Không có bằng chứng phần giọng văn lấn át nhiệm vụ.", "ex": "Tại sao chọn đáp án đúng (“The prompt’s task statement did not enumerate the three…”):\n\nBa câu hỏi bị gộp trong một đoạn, ngăn bằng dấu phẩy, nên nhiệm vụ không thể hiện rõ là có ba mục bắt buộc. Nguyên nhân gốc là task statement chưa liệt kê tường minh từng câu hỏi. Đánh số từng mục giúp Claude trả lời đủ và lần lượt.\n\nTại sao các phương án khác sai\n“The prompt was too long and Claude focused on…”: Không có dấu hiệu prompt quá dài; vấn đề là cấu trúc.\n\n“The prompt’s required questions were addressed implicitly across the…”: Câu trả lời không thể hiện rõ việc trả lời ba câu thì không thể coi là đã trả lời.\n\n“The prompt’s audience and tone specification overshadowed the task…”: Không có bằng chứng phần giọng văn lấn át nhiệm vụ."}, {"n": 113, "cat": "T", "topic": 3, "q": "A sales manager is refining a Claude-generated solution prototype after a stakeholder review identified two particular concerns. The remainder of the prototype was approved as written. Which iteration approach is most likely to create a strong next version?", "o": ["Rewrite the prototype from scratch incorporating the two specific concerns, since starting fresh integrates the feedback more cleanly than targeted edits.", "Address the two specific concerns and add a third improvement the associate identified, since combining stakeholder feedback with self- identified improvements is more efficient.", "Address the two specific concerns directly, leave unrelated parts unchanged, and document the changes for the next review.", "Address the two specific concerns and also revise unrelated sections to maintain consistent voice across the prototype after the edits."], "a": 2, "sk": ["two particular concerns", "approved as written"], "note": "Đáp án: {C}. Bẫy: {A} Viết lại từ đầu có thể làm hỏng phần đã được duyệt; {B} Thêm cải tiến tự nghĩ ra làm phạm vi review lan rộng ngoài feedback; {D} Sửa các phần không liên quan có thể làm thay đổi nội dung đã được chấp thuận.", "ex": "Tại sao chọn đáp án đúng (“Address the two specific concerns directly, leave unrelated parts…”):\n\nStakeholder chỉ nêu hai điểm cụ thể, phần còn lại đã được duyệt. Cách tốt nhất là sửa đúng hai điểm đó, giữ nguyên phần không liên quan, và ghi lại thay đổi để lần review sau dễ theo dõi.\n\nTại sao các phương án khác sai\n“Rewrite the prototype from scratch incorporating the two specific…”: Viết lại từ đầu có thể làm hỏng phần đã được duyệt.\n\n“Address the two specific concerns and add a third…”: Thêm cải tiến tự nghĩ ra làm phạm vi review lan rộng ngoài feedback.\n\n“Address the two specific concerns and also revise unrelated…”: Sửa các phần không liên quan có thể làm thay đổi nội dung đã được chấp thuận."}, {"n": 114, "cat": "E", "topic": 6, "q": "As a senior analyst, you use Claude to analyze requirements from several stakeholder sources. What is the correct sequence of steps? 1. Group related requirements and flag conflicts or ambiguities for stakeholder review. 2. Validate the structured output against the original sources for accuracy and completeness. 3. Submit the consolidated inputs to Claude using a structured extraction prompt. 4. Gather and label the source materials so that every requirement can be traced. 5. Document the final requirements set with source traceability and status.", "o": ["4, 1, 3, 2, 5", "4, 3, 1, 2, 5", "1, 4, 3, 2, 5", "3, 4, 1, 2, 5"], "a": 1, "sk": ["several stakeholder sources"], "note": "Đáp án: {B}. Bẫy: {A} Nhóm yêu cầu trước khi trích xuất là chưa có gì để nhóm; {C} Nhóm yêu cầu trước cả khi thu thập nguồn; {D} Gửi cho Claude trước khi gom và gắn nhãn nguồn thì mất truy vết.", "ex": "Tại sao chọn đáp án đúng (“4, 3, 1, 2, 5”):\n\nTrình tự đúng là 4, 3, 1, 2, 5. Bước 4: thu thập và gắn nhãn tài liệu nguồn để mọi yêu cầu truy vết được. Bước 3: gửi đầu vào đã gom cho Claude bằng prompt trích xuất có cấu trúc. Bước 1: nhóm yêu cầu liên quan, đánh dấu mâu thuẫn và điểm mơ hồ. Bước 2: kiểm lại với nguồn gốc về độ chính xác và đầy đủ. Bước 5: ghi tài liệu bộ yêu cầu cuối kèm nguồn và trạng thái.\n\nTại sao các phương án khác sai\n“4, 1, 3, 2, 5”: Nhóm yêu cầu trước khi trích xuất là chưa có gì để nhóm.\n\n“1, 4, 3, 2, 5”: Nhóm yêu cầu trước cả khi thu thập nguồn.\n\n“3, 4, 1, 2, 5”: Gửi cho Claude trước khi gom và gắn nhãn nguồn thì mất truy vết."}, {"n": 115, "cat": "T", "topic": 6, "q": "You are assessing whether a request to “redesign new-hire onboarding” should be broken into parts before prompting Claude. Which characteristic of the request most strongly suggests that decomposition would be useful?", "o": ["The request is for a single structured document that can be produced from one set of inputs in one prompt.", "The request requires multiple distinct outputs: a process map, supporting materials, and a measurement plan.", "The request involves a single well-defined output with a clear input and a familiar format.", "The request involves content the associate has produced many times before and knows can be handled in a single well-structured prompt."], "a": 1, "sk": ["most strongly suggests that decomposition would be useful"], "note": "Đáp án: {B}. Bẫy: {A} Một tài liệu từ một bộ đầu vào trong một prompt không cần phân rã; {C} Một đầu ra rõ ràng, định dạng quen thuộc cũng không cần phân rã; {D} Việc đã làm nhiều lần và xử lý được trong một prompt thì không cần tách.", "ex": "Tại sao chọn đáp án đúng (“The request requires multiple distinct outputs: a process map,…”):\n\nPhân rã có ích nhất khi công việc gồm nhiều đầu ra khác nhau, mỗi cái cần nội dung và cách đánh giá riêng. Process map, tài liệu hỗ trợ và measurement plan là ba sản phẩm riêng, nên tách thành các subtask phối hợp giúp rõ ràng và dễ kiểm soát hơn.\n\nTại sao các phương án khác sai\n“The request is for a single structured document that…”: Một tài liệu từ một bộ đầu vào trong một prompt không cần phân rã.\n\n“The request involves a single well-defined output with a…”: Một đầu ra rõ ràng, định dạng quen thuộc cũng không cần phân rã.\n\n“The request involves content the associate has produced many…”: Việc đã làm nhiều lần và xử lý được trong một prompt thì không cần tách."}, {"n": 116, "cat": "E", "topic": 6, "q": "You are a procurement associate breaking down a vendor-evaluation task. Which dependency sequence represents sound ordering?", "o": ["Define evaluation criteria first, gather vendor data against those criteria, then score and rank.", "Rank vendors before any data is collected.", "Score vendors first and decide on the criteria afterward.", "Skip criteria and ask Claude to produce a vendor recommendation from no inputs."], "a": 0, "sk": ["vendor-evaluation task"], "note": "Đáp án: {A}. Bẫy: {B} Xếp hạng khi chưa có dữ liệu là vô căn cứ; {C} Chấm điểm trước rồi mới đặt tiêu chí khiến kết quả thiếu khách quan; {D} Không có tiêu chí và đầu vào thì Claude không thể đưa ra khuyến nghị đáng tin.", "ex": "Tại sao chọn đáp án đúng (“Define evaluation criteria first, gather vendor data against those…”):\n\nThứ tự hợp lý là xác định tiêu chí đánh giá trước, sau đó thu thập dữ liệu nhà cung cấp theo tiêu chí đó, rồi mới chấm điểm và xếp hạng. Tiêu chí có trước giúp việc thu thập đúng trọng tâm và kết quả xếp hạng bảo vệ được.\n\nTại sao các phương án khác sai\n“Rank vendors before any data is collected.”: Xếp hạng khi chưa có dữ liệu là vô căn cứ.\n\n“Score vendors first and decide on the criteria afterward.”: Chấm điểm trước rồi mới đặt tiêu chí khiến kết quả thiếu khách quan.\n\n“Skip criteria and ask Claude to produce a vendor…”: Không có tiêu chí và đầu vào thì Claude không thể đưa ra khuyến nghị đáng tin."}, {"n": 117, "cat": "T", "topic": 6, "q": "You are a marketing manager using Claude to develop ideas for a campaign and must complete the framing steps before generating concepts. Which two framing steps must be completed BEFORE asking Claude to generate concepts? Each correct answer represents part of the solution.", "o": ["Select a finalist concept and prepare it for stakeholder approval.", "Define the goal of the campaign and the success metrics for the campaign.", "Review the Claude-generated concepts and select the two strongest for further development.", "Schedule the campaign launch and the rollout dates with the agency.", "Define the brand voice and the audience the concepts will speak to."], "a": [1, 4], "sk": ["BEFORE asking Claude to generate concepts"], "note": "Đáp án: {B} + {E}. Bẫy: {A} Chọn ý tưởng chung cuộc và chuẩn bị phê duyệt là sau khi đã có ý tưởng; {C} Đánh giá ý tưởng của Claude chỉ làm được sau khi tạo; {D} Lên lịch ra mắt với agency là bước triển khai sau cùng.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Select a finalist concept and prepare…”; B = “Define the goal of the campaign…”; C = “Review the Claude-generated concepts and select…”; D = “Schedule the campaign launch and the…”; E = “Define the brand voice and the…”.\n\nTại sao chọn đáp án đúng (“Define the goal of the campaign and the success…” / “Define the brand voice and the audience the concepts…”):\n\nTrước khi nhờ Claude tạo ý tưởng cần đóng khung hai thứ. Đáp án B: mục tiêu chiến dịch và chỉ số thành công, để ý tưởng hướng tới kết quả đo được. Đáp án E: brand voice và đối tượng mà ý tưởng nhắm tới, để giới hạn độ phù hợp, giọng và phong cách.\n\nTại sao các phương án khác sai\n“Select a finalist concept and prepare it for stakeholder…”: Chọn ý tưởng chung cuộc và chuẩn bị phê duyệt là sau khi đã có ý tưởng.\n\n“Review the Claude-generated concepts and select the two strongest…”: Đánh giá ý tưởng của Claude chỉ làm được sau khi tạo.\n\n“Schedule the campaign launch and the rollout dates with…”: Lên lịch ra mắt với agency là bước triển khai sau cùng."}, {"n": 118, "cat": "E", "topic": 1, "q": "You are a knowledge worker determining whether to escalate Claude-generated output. What is the correct sequence of decision steps? 1. Identify the audience and the impact if the output is incorrect. 2. Document the decision and its rationale for traceability. 3. Compare the output’s risk profile with the organization’s escalation criteria. 4. Decide whether to use the output, iterate further, or escalate. 5. Evaluate the output’s accuracy, completeness, and any unverified claims.", "o": ["5, 1, 3, 4, 2", "3, 1, 5, 4, 2", "1, 5, 3, 4, 2", "1, 3, 5, 4, 2"], "a": 2, "sk": ["whether to escalate"], "note": "Đáp án: {C}. Bẫy: {A} Đánh giá chất lượng trước khi biết mức tác động thì chưa rõ cần kiểm kỹ đến đâu; {B} So với tiêu chí escalation khi chưa có hồ sơ rủi ro; {D} So với tiêu chí trước khi đánh giá chất lượng đầu ra.", "ex": "Tại sao chọn đáp án đúng (“1, 5, 3, 4, 2”):\n\nTrình tự đúng là 1, 5, 3, 4, 2. Bước 1: xác định đối tượng và tác động nếu đầu ra sai. Bước 5: đánh giá độ chính xác, đầy đủ và các claim chưa kiểm chứng. Bước 3: đặt hồ sơ rủi ro đó cạnh tiêu chí escalation của tổ chức. Bước 4: quyết định dùng, lặp tiếp hay escalate. Bước 2: ghi lại quyết định và lý do để truy vết.\n\nTại sao các phương án khác sai\n“5, 1, 3, 4, 2”: Đánh giá chất lượng trước khi biết mức tác động thì chưa rõ cần kiểm kỹ đến đâu.\n\n“3, 1, 5, 4, 2”: So với tiêu chí escalation khi chưa có hồ sơ rủi ro.\n\n“1, 3, 5, 4, 2”: So với tiêu chí trước khi đánh giá chất lượng đầu ra."}, {"n": 119, "cat": "E", "topic": 6, "q": "You are a product designer using Claude in a solution-design exercise. Which solution-design step should be completed first when using Claude?", "o": ["Articulate the problem the solution must address and the constraints in play.", "Compare the candidate concepts against the constraints and select a finalist.", "Produce detailed mock-ups of the chosen solution for stakeholder review.", "Generate candidate solution concepts using Claude across diverse styles."], "a": 0, "sk": ["should be completed first"], "note": "Đáp án: {A}. Bẫy: {B} So sánh ý tưởng với ràng buộc cần có ý tưởng và ràng buộc trước; {C} Mock-up chi tiết là bước cuối cùng; {D} Tạo ý tưởng khi chưa rõ vấn đề và ràng buộc sẽ cho kết quả thiếu trọng tâm.", "ex": "Tại sao chọn đáp án đúng (“Articulate the problem the solution must address and the…”):\n\nBước đầu tiên là nêu rõ vấn đề cần giải quyết và các ràng buộc. Việc này đặt mục tiêu, giới hạn và tiêu chí đánh giá cho các bước sau: tạo ý tưởng bằng Claude, so với ràng buộc để chọn, rồi làm mock-up chi tiết.\n\nTại sao các phương án khác sai\n“Compare the candidate concepts against the constraints and select…”: So sánh ý tưởng với ràng buộc cần có ý tưởng và ràng buộc trước.\n\n“Produce detailed mock-ups of the chosen solution for stakeholder…”: Mock-up chi tiết là bước cuối cùng.\n\n“Generate candidate solution concepts using Claude across diverse styles.”: Tạo ý tưởng khi chưa rõ vấn đề và ràng buộc sẽ cho kết quả thiếu trọng tâm."}, {"n": 120, "cat": "T", "topic": 3, "q": "A Claude associate is incorporating reviewer feedback that named two specific issues with a Claude-drafted brief. The rest of the brief was accepted as written. Which next step is most likely to produce a strong revision?", "o": ["Rewrite the brief from scratch incorporating the two specific issues, since starting fresh integrates the feedback more cleanly than targeted edits.", "Address the two specific issues and add a third improvement the associate identified, since combining reviewer feedback with self-identified improvements is more efficient.", "Address the two specific issues and also revise unrelated sections to maintain a consistent voice across the brief after the edits.", "Address the two specific issues directly, leave unrelated parts unchanged, and document the changes for the next review."], "a": 3, "sk": ["two specific issues", "The rest of the brief was accepted as written"], "note": "Đáp án: {D}. Bẫy: {A} Viết lại từ đầu bỏ đi phần đã được chấp nhận, có thể tạo lỗi mới và bắt reviewer duyệt lại toàn bộ; {B} Thêm cải tiến tự nghĩ ra là thay đổi chưa ai yêu cầu, làm khó việc review và có thể không được chấp nhận; {C} Sửa các phần không liên quan để giữ giọng văn là đụng vào nội dung đã được duyệt, tăng rủi ro và khối lượng review.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Rewrite the brief from scratch incorporating…”; B = “Address the two specific issues and…”; C = “Address the two specific issues and…”; D = “Address the two specific issues directly,…”.\n\nTại sao chọn đáp án đúng (“Address the two specific issues directly, leave unrelated parts…”):\n\nKhi feedback chỉ ra lỗi cụ thể và phần còn lại đã được duyệt, cách sửa tốt nhất là sửa đúng mục tiêu (targeted edits): xử lý đúng các lỗi được nêu, giữ nguyên phần đã duyệt, và ghi lại thay đổi để lần review sau dễ kiểm tra. Sửa lan ra chỗ khác có thể làm hỏng phần đã được chấp nhận và bắt reviewer đọc lại từ đầu.\n\nĐáp án D sửa đúng hai lỗi được nêu, leave unrelated parts unchanged để không đụng phần đã duyệt, và document the changes để reviewer kiểm tra nhanh ở lần sau.\n\nMẹo nhớ: Dạng sửa theo feedback: feedback cụ thể → sửa đúng chỗ, giữ nguyên phần còn lại, ghi lại thay đổi. Bẫy: các đáp án *from scratch*, *add a third improvement*, *also revise unrelated sections* đều làm nhiều hơn yêu cầu.\n\nTại sao các phương án khác sai\n“Rewrite the brief from scratch incorporating the two specific…”: Viết lại từ đầu bỏ đi phần đã được chấp nhận, có thể tạo lỗi mới và bắt reviewer duyệt lại toàn bộ.\n\n“Address the two specific issues and add a third…”: Thêm cải tiến tự nghĩ ra là thay đổi chưa ai yêu cầu, làm khó việc review và có thể không được chấp nhận.\n\n“Address the two specific issues and also revise unrelated…”: Sửa các phần không liên quan để giữ giọng văn là đụng vào nội dung đã được duyệt, tăng rủi ro và khối lượng review."}, {"n": 121, "cat": "E", "topic": 3, "q": "Claude turns a response into a separate Artifact rather than an inline chat reply mainly when the content is:", "o": ["Written in a formal, professional tone", "Substantial, self-contained, and reusable", "A response that simply runs past a few paragraphs of prose", "Generated during an active Research session"], "a": 1, "sk": ["separate Artifact rather than an inline chat reply"], "note": "Đáp án: {B}. Bẫy: {A} Giọng văn trang trọng không quyết định có tạo Artifact hay không; {C} Chỉ dài hơn vài đoạn văn chưa đủ; {D} Artifact không gắn với việc có đang chạy Research hay không.", "ex": "Tại sao chọn đáp án đúng (“Substantial, self-contained, and reusable”):\n\nArtifact là vùng nội dung riêng bên cạnh cuộc trò chuyện, dành cho nội dung đáng kể (substantial), đứng độc lập (self-contained, hiểu được mà không cần đọc chat) và dùng lại được (reusable: chỉnh sửa, tải về, chia sẻ), ví dụ tài liệu, code, trang web, biểu đồ. Câu trả lời hội thoại thông thường, kể cả khá dài, vẫn nằm trong chat.\n\nBa tiêu chí của Artifact là substantial, self-contained, and reusable: nội dung đủ lớn, đứng riêng được, và người dùng sẽ mang đi dùng, sửa hoặc chia sẻ.\n\nMẹo nhớ: Dạng tiêu chí Artifact: nhớ ba chữ S – S – R: Substantial · Self-contained · Reusable. Loại các tiêu chí chỉ về giọng văn, độ dài đơn thuần, hay tính năng khác.\n\nTại sao các phương án khác sai\n“Written in a formal, professional tone”: Giọng văn trang trọng không quyết định có tạo Artifact hay không.\n\n“A response that simply runs past a few paragraphs…”: Chỉ dài hơn vài đoạn văn chưa đủ.\n\n“Generated during an active Research session”: Artifact không gắn với việc có đang chạy Research hay không."}, {"n": 122, "cat": "E", "topic": 4, "q": "A Pro-plan user avoids Haiku 4.5 entirely, believing it is only a lesser model for people who cannot access better ones. Which statement corrects this?", "o": ["Haiku 4.5 is the deliberate choice for quick, high-volume tasks", "Haiku 4.5 produces the highest-quality reasoning of the four", "Haiku 4.5 is offered mainly to Free-plan users as an entry-level option", "Haiku 4.5 is best reserved for tasks needing the deepest reasoning"], "a": 0, "sk": ["only a lesser model"], "note": "Đáp án: {A}. Bẫy: {B} Sai: Haiku không cho chất lượng suy luận cao nhất; {C} Sai: Haiku không chỉ dành cho gói Free; {D} Sai: việc cần suy luận sâu nhất nên dùng model hạng cao hơn, không phải Haiku.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Haiku 4.5 is the deliberate choice…”; B = “Haiku 4.5 produces the highest-quality reasoning…”; C = “Haiku 4.5 is offered mainly to…”; D = “Haiku 4.5 is best reserved for…”.\n\nTại sao chọn đáp án đúng (“Haiku 4.5 is the deliberate choice for quick, high-volume…”):\n\nMỗi model có chỗ dùng riêng. Haiku là model nhanh nhất và nhẹ nhất, được chọn có chủ đích cho các việc nhanh, khối lượng lớn, suy luận nhẹ: ở đó Haiku cho tốc độ và chi phí tốt hơn mà chất lượng vẫn đủ. Chọn model là ghép đúng nhu cầu, không phải luôn chọn model mạnh nhất.\n\nĐáp án A sửa đúng quan niệm sai: Haiku 4.5 là deliberate choice cho quick, high-volume tasks. Nó không phải phương án dự phòng mà là công cụ đúng cho một loại việc cụ thể.\n\nMẹo nhớ: Dạng hiểu đúng vai trò model: mỗi model là công cụ cho một loại việc, không phải bậc thang tốt – kém. Haiku = Quick + High-volume.\n\nTại sao các phương án khác sai\n“Haiku 4.5 produces the highest-quality reasoning of the four”: Sai: Haiku không cho chất lượng suy luận cao nhất.\n\n“Haiku 4.5 is offered mainly to Free-plan users as…”: Sai: Haiku không chỉ dành cho gói Free.\n\n“Haiku 4.5 is best reserved for tasks needing the…”: Sai: việc cần suy luận sâu nhất nên dùng model hạng cao hơn, không phải Haiku."}, {"n": 123, "cat": "E", "topic": 4, "q": "A business user is unsure which model to pick for typical everyday writing and analysis. According to Anthropic's guidance, which model is the recommended default?", "o": ["Haiku 4.5, the fastest and lightest model", "Sonnet 5, the balanced default for most work", "Opus 4.8, reserved for complex high-stakes reasoning", "Fable 5, the newest and most capable model"], "a": 1, "sk": ["typical everyday writing and analysis", "recommended default"], "note": "Đáp án: {B}. Bẫy: {A} Haiku nhanh và nhẹ nhất, hợp việc khối lượng lớn, đơn giản; {C} Opus dành cho suy luận phức tạp, rủi ro cao; {D} Mới nhất và mạnh nhất không có nghĩa là mặc định cho việc thường ngày.", "ex": "Tại sao chọn đáp án đúng (“Sonnet 5, the balanced default for most work”):\n\nTheo hướng dẫn chọn model: Sonnet là mặc định cân bằng cho phần lớn công việc (viết, phân tích, soạn thảo hằng ngày). Haiku cho việc nhanh, nhẹ, khối lượng lớn. Opus dành cho suy luận phức tạp, rủi ro cao. Model mạnh nhất hay mới nhất không tự động là mặc định cho việc thường ngày.\n\nViệc viết và phân tích hằng ngày cần cân bằng chất lượng, tốc độ và chi phí. Sonnet 5 là balanced default for most work, đúng với loại việc này.\n\nMẹo nhớ: Dạng model mặc định: thấy everyday / typical / most work / default → Sonnet. Thấy complex / high-stakes → Opus. Thấy fast / high-volume / light → Haiku.\n\nTại sao các phương án khác sai\n“Haiku 4.5, the fastest and lightest model”: Haiku nhanh và nhẹ nhất, hợp việc khối lượng lớn, đơn giản.\n\n“Opus 4.8, reserved for complex high-stakes reasoning”: Opus dành cho suy luận phức tạp, rủi ro cao.\n\n“Fable 5, the newest and most capable model”: Mới nhất và mạnh nhất không có nghĩa là mặc định cho việc thường ngày."}, {"n": 124, "cat": "E", "topic": 5, "q": "For external-facing or sensitive content, Anthropic recommends disclosing AI involvement in addition to which other safeguard?", "o": ["Attaching citations to the generated draft for source traceability", "Switching to the account's strongest available model", "Turning off the model-improvement training toggle", "Qualified professional review before it reaches consumers"], "a": 3, "sk": ["external-facing or sensitive content", "disclosing AI involvement"], "note": "Đáp án: {D}. Bẫy: {A} Gắn trích dẫn giúp truy nguồn, nhưng không thay được việc chuyên gia kiểm tra nội dung trước khi tới người nhận; {B} Dùng model mạnh nhất có thể cải thiện chất lượng, nhưng không phải biện pháp bảo vệ; {C} Tắt tùy chọn dùng dữ liệu cho huấn luyện là chuyện quyền riêng tư dữ liệu của người dùng, không liên quan tới bảo vệ người nhận nội dung.", "ex": "Tại sao chọn đáp án đúng (“Qualified professional review before it reaches consumers”):\n\nVới nội dung tới tay người dùng cuối hoặc nhạy cảm (tư vấn sức khỏe, pháp lý, tài chính...), chính sách sử dụng của Anthropic yêu cầu hai lớp bảo vệ: minh bạch (cho người nhận biết có AI tham gia) và review bởi chuyên gia đủ thẩm quyền trước khi nội dung tới tay họ. Minh bạch cho người nhận biết; review của chuyên gia đảm bảo nội dung đúng.\n\nBiện pháp đi cùng là qualified professional review before it reaches consumers: một chuyên gia đủ năng lực kiểm tra trước khi nội dung tới người nhận. Công bố có AI tham gia không thay được việc nội dung phải đúng.\n\nMẹo nhớ: Dạng safeguard cho nội dung ra ngoài/nhạy cảm: cặp đôi Disclosure + Qualified human review. Thấy *external-facing / sensitive / consumers* → nghĩ ngay tới chuyên gia review trước khi tới tay người nhận.\n\nTại sao các phương án khác sai\n“Attaching citations to the generated draft for source traceability”: Gắn trích dẫn giúp truy nguồn, nhưng không thay được việc chuyên gia kiểm tra nội dung trước khi tới người nhận.\n\n“Switching to the account's strongest available model”: Dùng model mạnh nhất có thể cải thiện chất lượng, nhưng không phải biện pháp bảo vệ.\n\n“Turning off the model-improvement training toggle”: Tắt tùy chọn dùng dữ liệu cho huấn luyện là chuyện quyền riêng tư dữ liệu của người dùng, không liên quan tới bảo vệ người nhận nội dung."}, {"n": 125, "cat": "E", "topic": 3, "q": "Regenerating the same prompt gives you three noticeably different values for a key metric across three tries. You need a single reliable number for a finance summary due to leadership today. Given the inconsistency across regenerations, what is the most appropriate action?", "o": ["Average the three values and report the resulting mean figure", "Use whichever value is closest to what you already expected", "Treat the inconsistency as a warning; verify the source data", "Pick the value that appeared in two of the three tries"], "a": 2, "sk": ["three noticeably different values for a key metric", "single reliable number"], "note": "Đáp án: {C}. Bẫy: {A} Trung bình của ba con số không đáng tin vẫn là con số không đáng tin, chỉ trông có vẻ khoa học hơn; {B} Chọn con số gần với điều mình đã nghĩ là thiên kiến xác nhận (confirmation bias), không phải kiểm chứng; {D} Hai trên ba lần giống nhau không biến con số thành đúng.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Average the three values and report…”; B = “Use whichever value is closest to…”; C = “Treat the inconsistency as a warning;…”; D = “Pick the value that appeared in…”.\n\nTại sao chọn đáp án đúng (“Treat the inconsistency as a warning; verify the source…”):\n\nKhi các lần tạo lại cho kết quả khác nhau, đó là dấu hiệu Claude không đang dựa vào một nguồn chắc chắn mà đang ước lượng hoặc suy diễn. Không con số nào trong đó đáng tin. Cách xử lý là quay về dữ liệu nguồn để xác định con số đúng (tính lại từ dữ liệu, hoặc dùng Code Execution), không chọn hay tính trung bình các con số không đáng tin.\n\nĐáp án C coi sự không nhất quán là warning và verify the source data. Con số đúng phải đến từ dữ liệu gốc, không phải từ việc chọn giữa các lần đoán của model. Hạn chót gấp không thay đổi điều đó: báo con số sai cho lãnh đạo còn tệ hơn.\n\nMẹo nhớ: Dạng output không nhất quán: kết quả khác nhau giữa các lần chạy = tín hiệu cảnh báo, không phải bài toán chọn. Đáp án đúng luôn là quay về nguồn (verify source data).\n\nTại sao các phương án khác sai\n“Average the three values and report the resulting mean…”: Trung bình của ba con số không đáng tin vẫn là con số không đáng tin, chỉ trông có vẻ khoa học hơn.\n\n“Use whichever value is closest to what you already…”: Chọn con số gần với điều mình đã nghĩ là thiên kiến xác nhận (confirmation bias), không phải kiểm chứng.\n\n“Pick the value that appeared in two of the…”: Hai trên ba lần giống nhau không biến con số thành đúng."}, {"n": 126, "cat": "E", "topic": 4, "q": "A team plans to run a Research session for every routine status question in a daily workflow. What is the key cost consideration they should weigh?", "o": ["Research is unavailable on paid plans for daily use", "Research consumes usage quota faster than a normal message", "Research lowers the account's usage limit ceiling for the rest of the day", "Research runs on a separate budget that does not touch message limits"], "a": 1, "sk": ["every routine status question", "key cost consideration"], "note": "Đáp án: {B}. Bẫy: {A} Sai: Research có trên các gói trả phí; {C} Sai: Research không hạ trần hạn mức của tài khoản; {D} Sai: Research không chạy trên ngân sách riêng.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Research is unavailable on paid plans…”; B = “Research consumes usage quota faster than…”; C = “Research lowers the account's usage limit…”; D = “Research runs on a separate budget…”.\n\nTại sao chọn đáp án đúng (“Research consumes usage quota faster than a normal message”):\n\nResearch tìm kiếm và tổng hợp nhiều nguồn qua nhiều bước, nên tốn hạn mức sử dụng (usage quota) nhanh hơn nhiều so với một tin nhắn thường. Research đáng dùng cho câu hỏi cần điều tra sâu, nhiều nguồn; câu hỏi trạng thái đơn giản thì một tin nhắn thường hoặc web search là đủ.\n\nĐáp án B nêu đúng yếu tố chi phí: Research consumes usage quota faster than a normal message. Dùng nó cho mọi câu hỏi thường ngày sẽ đốt hạn mức nhanh mà không mang lại giá trị tương xứng.\n\nMẹo nhớ: Dạng chi phí tính năng: tính năng càng nhiều bước (Research, Extended Thinking, model mạnh) thì càng tốn hạn mức. Dùng cho việc xứng đáng, không dùng cho việc thường ngày.\n\nTại sao các phương án khác sai\n“Research is unavailable on paid plans for daily use”: Sai: Research có trên các gói trả phí.\n\n“Research lowers the account's usage limit ceiling for the…”: Sai: Research không hạ trần hạn mức của tài khoản.\n\n“Research runs on a separate budget that does not…”: Sai: Research không chạy trên ngân sách riêng."}, {"n": 127, "cat": "E", "topic": 4, "q": "A strategist needs both careful reasoning and heavy multi-source gathering for a detailed market-entry analysis. Which combination does the guidance support for this task?", "o": ["Neither is needed, since a single Web Search covers everything", "Brainstorming alone, since ideation naturally includes reasoning and sources", "Research combined with Extended Thinking for reasoning plus source-gathering", "Concise Style, which balances depth and brevity for you"], "a": 2, "sk": ["careful reasoning and heavy multi-source gathering"], "note": "Đáp án: {C}. Bẫy: {A} Một lần Web Search chỉ hợp tra cứu nhanh, không đủ cho thu thập nhiều nguồn chuyên sâu lẫn suy luận kỹ; {B} Brainstorm tạo ý tưởng, không tự thu thập nguồn hay suy luận kỹ cho phân tích chi tiết; {D} Concise Style chỉ làm câu trả lời ngắn gọn hơn, không thêm khả năng thu thập nguồn hay suy luận, thậm chí ngược với nhu cầu phân tích chi tiết.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Neither is needed, since a single…”; B = “Brainstorming alone, since ideation naturally includes…”; C = “Research combined with Extended Thinking for…”; D = “Concise Style, which balances depth and…”.\n\nTại sao chọn đáp án đúng (“Research combined with Extended Thinking for reasoning plus source-gathering”):\n\nMỗi tính năng đáp ứng một nhu cầu: Research thu thập và tổng hợp thông tin từ nhiều nguồn; Extended Thinking cho Claude thời gian suy luận kỹ hơn trước khi trả lời. Task cần cả hai thì kết hợp cả hai. Web search đơn lẻ chỉ hợp tra cứu nhanh; Style chỉ đổi cách viết.\n\nTask có hai nhu cầu riêng biệt, và đáp án C ghép đúng từng nhu cầu với tính năng: Research cho thu thập nhiều nguồn, Extended Thinking cho suy luận kỹ.\n\nMẹo nhớ: Dạng ghép tính năng: tách đề thành từng nhu cầu, ghép mỗi nhu cầu với một tính năng: nhiều nguồn → Research, suy luận kỹ → Extended Thinking, tính toán → Code Execution, nội dung dùng lại → Artifact.\n\nTại sao các phương án khác sai\n“Neither is needed, since a single Web Search covers…”: Một lần Web Search chỉ hợp tra cứu nhanh, không đủ cho thu thập nhiều nguồn chuyên sâu lẫn suy luận kỹ.\n\n“Brainstorming alone, since ideation naturally includes reasoning and sources”: Brainstorm tạo ý tưởng, không tự thu thập nguồn hay suy luận kỹ cho phân tích chi tiết.\n\n“Concise Style, which balances depth and brevity for you”: Concise Style chỉ làm câu trả lời ngắn gọn hơn, không thêm khả năng thu thập nguồn hay suy luận, thậm chí ngược với nhu cầu phân tích chi tiết."}, {"n": 128, "cat": "T", "topic": 3, "q": "One section of a long Markdown document in an Artifact needs a tone change for a different audience, while the rest is correct. What is the most appropriate way to revise it?", "o": ["highlight the section and request a targeted edit of that part", "regenerate the entire document from scratch with a new prompt", "retry the original prompt to generate an alternate full version", "start a new conversation and rebuild the whole document"], "a": 0, "sk": ["One section", "the rest is correct"], "note": "Đáp án: {A}. Bẫy: {B} Tạo lại toàn bộ tài liệu với prompt mới là vứt phần đã đúng và có thể làm phát sinh lỗi mới ở đó; {C} Chạy lại prompt gốc ra một bản đầy đủ khác, không nhắm vào phần cần đổi giọng, và phần đúng có thể bị thay đổi; {D} Mở cuộc trò chuyện mới và dựng lại toàn bộ tài liệu là tốn công nhất mà không có lợi gì.", "ex": "Tại sao chọn đáp án đúng (“highlight the section and request a targeted edit of…”):\n\nArtifact cho phép chọn (highlight) một phần và yêu cầu Claude chỉ sửa phần đó. Sửa có mục tiêu giữ nguyên phần đã đúng, nhanh hơn, và tránh rủi ro tạo lỗi mới ở chỗ không cần đổi. Tạo lại toàn bộ chỉ hợp khi phần lớn nội dung có vấn đề.\n\nChỉ một phần cần sửa nên cách đúng là highlight the section và yêu cầu targeted edit cho phần đó. Phần còn lại giữ nguyên, không bị thay đổi ngoài ý muốn.\n\nMẹo nhớ: Dạng sửa có mục tiêu: vấn đề cục bộ → sửa cục bộ. Thấy *one section* + *the rest is correct* → highlight + targeted edit.\n\nTại sao các phương án khác sai\n“regenerate the entire document from scratch with a new…”: Tạo lại toàn bộ tài liệu với prompt mới là vứt phần đã đúng và có thể làm phát sinh lỗi mới ở đó.\n\n“retry the original prompt to generate an alternate full…”: Chạy lại prompt gốc ra một bản đầy đủ khác, không nhắm vào phần cần đổi giọng, và phần đúng có thể bị thay đổi.\n\n“start a new conversation and rebuild the whole document”: Mở cuộc trò chuyện mới và dựng lại toàn bộ tài liệu là tốn công nhất mà không có lợi gì."}, {"n": 129, "cat": "E", "topic": 3, "q": "A prompt that has produced excellent results all week returns one oddly disorganized answer. The user believes the prompt itself is fine. What is the best first move?", "o": ["Start a brand-new conversation and re-explain the whole task", "Use Retry to regenerate a fresh answer to the prompt", "Switch to a more capable model for this request", "Rewrite the prompt from scratch to prevent future errors"], "a": 1, "sk": ["excellent results all week", "one oddly disorganized answer"], "note": "Đáp án: {B}. Bẫy: {A} Mở cuộc trò chuyện mới và giải thích lại toàn bộ task tốn công hơn nhiều so với Retry, trong khi chưa có dấu hiệu bối cảnh hiện tại có vấn đề; {C} Đổi sang model mạnh hơn là phản ứng quá mức với một lỗi đơn lẻ, khi model hiện tại đã chạy tốt cả tuần; {D} Viết lại prompt từ đầu là vứt bỏ một prompt đã chứng minh hiệu quả chỉ vì một lần lỗi.", "ex": "Tại sao chọn đáp án đúng (“Use Retry to regenerate a fresh answer to the…”):\n\nOutput của model có tính biến thiên giữa các lần chạy. Một kết quả lạ đơn lẻ từ prompt đã chạy tốt nhiều lần nhiều khả năng là biến thiên ngẫu nhiên, không phải lỗi prompt. Cách thử rẻ nhất là Retry: tạo lại câu trả lời cho cùng prompt. Chỉ khi lỗi lặp lại mới cần chẩn đoán và sửa prompt.\n\nPrompt đã được chứng minh tốt qua cả tuần, lỗi chỉ xảy ra một lần, nên nhiều khả năng là biến thiên ngẫu nhiên. Retry là bước nhanh nhất, rẻ nhất để kiểm tra giả thuyết đó trước khi sửa thứ gì.\n\nMẹo nhớ: Dạng lỗi đơn lẻ vs lỗi lặp lại: lỗi một lần từ cấu hình vốn tốt → thử Retry trước (rẻ nhất). Lỗi lặp lại → mới chẩn đoán và sửa prompt.\n\nTại sao các phương án khác sai\n“Start a brand-new conversation and re-explain the whole task”: Mở cuộc trò chuyện mới và giải thích lại toàn bộ task tốn công hơn nhiều so với Retry, trong khi chưa có dấu hiệu bối cảnh hiện tại có vấn đề.\n\n“Switch to a more capable model for this request”: Đổi sang model mạnh hơn là phản ứng quá mức với một lỗi đơn lẻ, khi model hiện tại đã chạy tốt cả tuần.\n\n“Rewrite the prompt from scratch to prevent future errors”: Viết lại prompt từ đầu là vứt bỏ một prompt đã chứng minh hiệu quả chỉ vì một lần lỗi."}, {"n": 130, "cat": "E", "topic": 3, "q": "You're briefing stakeholders on where Claude's output needs extra scrutiny. Which single category should you tell them to always check against an authoritative primary source before use?", "o": ["Formatting and layout choices in a routine internal draft memo", "Minor tone adjustments applied to a casual internal team message", "Brainstormed lists of rough, early-stage project ideas", "Statistics, legal claims, citations, and direct quotes"], "a": 3, "sk": ["always check against an authoritative primary source", "authoritative primary source"], "note": "Đáp án: {D}. Bẫy: {A} Định dạng và bố cục của bản nháp nội bộ là chuyện trình bày, sai cũng không gây hại; {B} Chỉnh giọng văn nhỏ cho tin nhắn nội bộ thân mật là rủi ro thấp, không cần nguồn gốc; {C} Danh sách ý tưởng brainstorm giai đoạn đầu vốn không phải claim sự thật, không có gì để kiểm với nguồn.", "ex": "Tại sao chọn đáp án đúng (“Statistics, legal claims, citations, and direct quotes”):\n\nMột số loại nội dung có rủi ro hallucination cao và hậu quả lớn nếu sai: số liệu thống kê, claim pháp lý, trích dẫn nguồn và lời trích nguyên văn. Model có thể tạo ra chúng trông rất thật nhưng sai hoặc không tồn tại. Những thứ này phải luôn đối chiếu với nguồn gốc trước khi dùng.\n\nStatistics, legal claims, citations, and direct quotes là nhóm vừa dễ bị bịa (con số, tên văn bản, câu trích trông rất thật) vừa gây hậu quả lớn khi sai. Vì vậy chúng luôn phải kiểm với nguồn gốc.\n\nMẹo nhớ: Dạng nội dung rủi ro cao: nhóm luôn phải kiểm nguồn: Số – Luật – Trích dẫn – Lời trích (statistics, legal, citations, quotes). Loại mọi đáp án có routine / casual / internal / brainstorm / formatting.\n\nTại sao các phương án khác sai\n“Formatting and layout choices in a routine internal draft…”: Định dạng và bố cục của bản nháp nội bộ là chuyện trình bày, sai cũng không gây hại.\n\n“Minor tone adjustments applied to a casual internal team…”: Chỉnh giọng văn nhỏ cho tin nhắn nội bộ thân mật là rủi ro thấp, không cần nguồn gốc.\n\n“Brainstormed lists of rough, early-stage project ideas”: Danh sách ý tưởng brainstorm giai đoạn đầu vốn không phải claim sự thật, không có gì để kiểm với nguồn."}, {"n": 131, "cat": "E", "topic": 4, "q": "Which of the following features lets a user build an interactive working mockup that iterates in its own side panel?", "o": ["Styles, which set tone and format per conversation", "Memory, which synthesizes background insights automatically", "Web search, which returns quick factual lookups", "Artifacts, which hold reusable, iterable content separately"], "a": 3, "sk": ["interactive working mockup", "its own side panel"], "note": "Đáp án: {D}. Bẫy: {A} Styles chỉ chỉnh giọng văn và định dạng câu trả lời, không tạo được nội dung tương tác; {B} Memory ghi nhớ bối cảnh giữa các cuộc trò chuyện, không liên quan tới việc dựng mockup; {C} Web search tra cứu thông tin trên web, không tạo nội dung tương tác.", "ex": "Tại sao chọn đáp án đúng (“Artifacts, which hold reusable, iterable content separately”):\n\nArtifacts hiển thị nội dung trong panel riêng cạnh cuộc trò chuyện: tài liệu, code, và cả ứng dụng nhỏ hay mockup tương tác chạy được ngay. Người dùng có thể yêu cầu chỉnh và xem phiên bản mới ngay trong panel. Styles đổi cách viết, Memory ghi nhớ bối cảnh, Web search tra cứu thông tin.\n\nArtifacts là tính năng duy nhất giữ nội dung separately trong panel riêng, reusable và iterable, nên tạo và chỉnh được mockup tương tác.\n\nMẹo nhớ: Dạng chọn tính năng: thấy interactive / mockup / side panel / iterate / reusable content → Artifacts.\n\nTại sao các phương án khác sai\n“Styles, which set tone and format per conversation”: Styles chỉ chỉnh giọng văn và định dạng câu trả lời, không tạo được nội dung tương tác.\n\n“Memory, which synthesizes background insights automatically”: Memory ghi nhớ bối cảnh giữa các cuộc trò chuyện, không liên quan tới việc dựng mockup.\n\n“Web search, which returns quick factual lookups”: Web search tra cứu thông tin trên web, không tạo nội dung tương tác."}, {"n": 132, "cat": "E", "topic": 4, "q": "You enabled a custom Skill and a colleague worries it will bloat every prompt the way project instructions do. Which fact reassures them?", "o": ["A Skill overrides profile instructions across the whole account", "A Skill is injected into every prompt like instructions", "A Skill can be created only by an org administrator", "A Skill loads only when Claude judges the task relevant"], "a": 3, "sk": ["bloat every prompt"], "note": "Đáp án: {D}. Bẫy: {A} Sai: Skill không ghi đè profile instructions của cả tài khoản; {B} Sai: đây chính là nỗi lo của đồng nghiệp, và nó không đúng; {C} Sai: Skill không chỉ do quản trị viên tổ chức tạo, và chuyện ai tạo cũng không liên quan tới kích thước prompt.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “A Skill overrides profile instructions across…”; B = “A Skill is injected into every…”; C = “A Skill can be created only…”; D = “A Skill loads only when Claude…”.\n\nTại sao chọn đáp án đúng (“A Skill loads only when Claude judges the task…”):\n\nProject instructions được áp vào mọi cuộc trò chuyện trong Project. Skill thì khác: Claude chỉ thấy phần mô tả ngắn của Skill, và chỉ nạp nội dung đầy đủ khi đánh giá task hiện tại có liên quan. Nhờ vậy có thể bật nhiều Skill mà không làm mỗi prompt nặng thêm.\n\nĐáp án D nói đúng cơ chế: Skill loads only when Claude judges the task relevant. Task không liên quan thì nội dung Skill không được nạp vào, nên không làm phình prompt.\n\nMẹo nhớ: Dạng Skill vs Instructions: Instructions = luôn bật (mọi chat trong Project); Skill = nạp khi cần (chỉ khi task liên quan). Nhớ: Skill là hộp công cụ, mở khi cần dùng.\n\nTại sao các phương án khác sai\n“A Skill overrides profile instructions across the whole account”: Sai: Skill không ghi đè profile instructions của cả tài khoản.\n\n“A Skill is injected into every prompt like instructions”: Sai: đây chính là nỗi lo của đồng nghiệp, và nó không đúng.\n\n“A Skill can be created only by an org…”: Sai: Skill không chỉ do quản trị viên tổ chức tạo, và chuyện ai tạo cũng không liên quan tới kích thước prompt."}, {"n": 133, "cat": "E", "topic": 4, "q": "With the Gmail connector active, a user asks Claude to prepare a reply to a vendor. Before actually creating that draft, the connector requires:", "o": ["The user's explicit approval for that specific draft action", "A one-time authorization that covers later email actions", "Nothing further, since the connector itself was already enabled", "Admin sign-off before a reply draft can be generated"], "a": 0, "sk": ["Before actually creating that draft"], "note": "Đáp án: {A}. Bẫy: {B} Sai: không có ủy quyền một lần cho mọi hành động email sau này; {C} Sai: bật connector chỉ cấp quyền truy cập, không có nghĩa là được tự ý tạo nội dung trong hộp thư; {D} Sai: không cần quản trị viên duyệt từng bản nháp.", "ex": "Tại sao chọn đáp án đúng (“The user's explicit approval for that specific draft action”):\n\nConnector cho Claude đọc và thao tác trên dịch vụ của người dùng. Với hành động ghi (tạo bản nháp, gửi, sửa), Claude cần người dùng duyệt rõ ràng cho từng hành động cụ thể. Bật connector chỉ là cấp khả năng truy cập; nó không phải sự đồng ý chung cho mọi hành động về sau.\n\nTạo bản nháp email là hành động ghi vào hộp thư của người dùng, nên cần explicit approval for that specific draft action. Người dùng giữ quyền kiểm soát từng thay đổi trên tài khoản của mình.\n\nMẹo nhớ: Dạng connector và hành động ghi: Bật connector ≠ đồng ý mọi hành động. Hành động ghi/gửi/sửa → cần user approval cho từng hành động.\n\nTại sao các phương án khác sai\n“A one-time authorization that covers later email actions”: Sai: không có ủy quyền một lần cho mọi hành động email sau này.\n\n“Nothing further, since the connector itself was already enabled”: Sai: bật connector chỉ cấp quyền truy cập, không có nghĩa là được tự ý tạo nội dung trong hộp thư.\n\n“Admin sign-off before a reply draft can be generated”: Sai: không cần quản trị viên duyệt từng bản nháp."}, {"n": 134, "cat": "E", "topic": 2, "q": "A business user gets a vague, unhelpful first draft from Claude. According to Anthropic's guidance, what does an effective prompt most reliably need?", "o": ["Forceful, capitalized wording that demands compliance", "The most capable model paired with a high effort setting", "Explicit context, a specific task, and output format", "A single sweeping instruction covering the whole task"], "a": 2, "sk": ["vague, unhelpful first draft"], "note": "Đáp án: {C}. Bẫy: {A} Viết in hoa, ra lệnh mạnh không thêm thông tin nào; {B} Model mạnh hơn và effort cao hơn không bù được việc prompt thiếu bối cảnh; {D} Một chỉ dẫn bao quát chung chung chính là kiểu prompt gây ra output mơ hồ.", "ex": "Tại sao chọn đáp án đúng (“Explicit context, a specific task, and output format”):\n\nHướng dẫn prompt của Anthropic nhấn mạnh rõ ràng và cụ thể: cho Claude bối cảnh (tình huống, mục đích, đối tượng), nhiệm vụ cụ thể (làm gì), và định dạng output mong muốn. Viết in hoa ra lệnh hay đổi sang model mạnh hơn không bù được việc prompt thiếu thông tin.\n\nBản nháp mơ hồ thường do prompt mơ hồ. Explicit context, a specific task, and output format cung cấp đúng ba thứ Claude cần để biết làm gì, cho ai, theo dạng nào.\n\nMẹo nhớ: Dạng prompt hiệu quả: nhớ ba trụ Context – Task – Format. Loại các đáp án dựa vào giọng ra lệnh (*forceful, capitalized*), sức mạnh model (*most capable*), hay chỉ dẫn bao quát (*single sweeping*).\n\nTại sao các phương án khác sai\n“Forceful, capitalized wording that demands compliance”: Viết in hoa, ra lệnh mạnh không thêm thông tin nào.\n\n“The most capable model paired with a high effort…”: Model mạnh hơn và effort cao hơn không bù được việc prompt thiếu bối cảnh.\n\n“A single sweeping instruction covering the whole task”: Một chỉ dẫn bao quát chung chung chính là kiểu prompt gây ra output mơ hồ."}, {"n": 135, "cat": "E", "topic": 4, "q": "Within a single Project, which mechanism makes uploaded material available to every chat in that Project?", "o": ["The Project knowledge base, shared across all chats", "The conversation content of any one chat in the Project", "A Custom Style applied to the current conversation only", "The Project description field entered when creating the Project"], "a": 0, "sk": ["available to every chat in that Project"], "note": "Đáp án: {A}. Bẫy: {B} Nội dung của một chat không tự chia sẻ sang các chat khác trong Project; {C} Custom Style chỉ đổi cách viết trong cuộc trò chuyện hiện tại, không liên quan tới chia sẻ tài liệu; {D} Phần mô tả Project giúp nhận diện Project, không phải nơi chứa tài liệu tham khảo cho các chat.", "ex": "Tại sao chọn đáp án đúng (“The Project knowledge base, shared across all chats”):\n\nProject có knowledge base (project knowledge): tài liệu upload vào đây được chia sẻ cho mọi cuộc trò chuyện trong Project. Tài liệu đính kèm trong một chat chỉ có trong chat đó. Custom Style chỉ chỉnh cách viết; phần mô tả Project chỉ là thông tin giới thiệu.\n\nProject knowledge base, shared across all chats đúng là cơ chế được thiết kế để tài liệu có mặt ở mọi chat trong Project mà không phải upload lại.\n\nMẹo nhớ: Dạng thành phần của Project: Knowledge base = tài liệu dùng chung mọi chat · Instructions = chỉ dẫn áp cho mọi chat · Description = mô tả cho người xem · Chat = riêng từng cuộc.\n\nTại sao các phương án khác sai\n“The conversation content of any one chat in the…”: Nội dung của một chat không tự chia sẻ sang các chat khác trong Project.\n\n“A Custom Style applied to the current conversation only”: Custom Style chỉ đổi cách viết trong cuộc trò chuyện hiện tại, không liên quan tới chia sẻ tài liệu.\n\n“The Project description field entered when creating the Project”: Phần mô tả Project giúp nhận diện Project, không phải nơi chứa tài liệu tham khảo cho các chat."}, {"n": 136, "cat": "E", "topic": 4, "q": "Your conversation context has grown long, and the model is producing inconsistent outputs. Which context-management step should be performed first?", "o": ["Summarize the prior conversation into a concise statement of the current state.", "Continue the existing conversation and hope the model recovers consistency.", "Switch to a different model in the hope that the new model handles long context better.", "Start a fresh conversation and repaste only the essential prior context."], "a": 0, "sk": ["grown long", "inconsistent outputs", "performed first"], "note": "Đáp án: {A}. Bẫy: {B} Tiếp tục như cũ và mong model tự ổn lại là không làm gì với nguyên nhân; {C} Đổi model *in the hope* là đoán mò; {D} Mở chat mới và dán lại phần bối cảnh thiết yếu là hợp lý, nhưng phải tóm tắt trước thì mới biết đâu là bối cảnh thiết yếu.", "ex": "Tại sao chọn đáp án đúng (“Summarize the prior conversation into a concise statement of…”):\n\nHội thoại dài làm các chỉ dẫn và quyết định quan trọng bị chìm giữa nhiều nội dung cũ, nên output dễ lệch hoặc mâu thuẫn. Bước đầu tiên là tóm tắt cuộc trò chuyện thành trạng thái hiện tại ngắn gọn (đã thống nhất gì, đang làm gì). Bản tóm tắt này dùng được ngay trong chat hiện tại, hoặc mang sang chat mới nếu cần làm lại từ đầu.\n\nSummarize the prior conversation thành concise statement of the current state là bước nền: gom lại những gì quan trọng, bỏ phần nhiễu. Có bản tóm tắt này rồi mới tiếp tục trong chat hiện tại hay mở chat mới đều được, mà không mất thông tin quan trọng.\n\nMẹo nhớ: Dạng quản lý context dài: thứ tự Summarize → (Continue hoặc Restart với bản tóm tắt). Tóm tắt luôn đi trước vì là đầu vào cho bước sau.\n\nTại sao các phương án khác sai\n“Continue the existing conversation and hope the model recovers…”: Tiếp tục như cũ và mong model tự ổn lại là không làm gì với nguyên nhân.\n\n“Switch to a different model in the hope that…”: Đổi model *in the hope* là đoán mò.\n\n“Start a fresh conversation and repaste only the essential…”: Mở chat mới và dán lại phần bối cảnh thiết yếu là hợp lý, nhưng phải tóm tắt trước thì mới biết đâu là bối cảnh thiết yếu."}, {"n": 137, "cat": "E", "topic": 4, "q": "You are setting up a Connector for a shared data source that several colleagues will use. Which Connector setup step should be performed first?", "o": ["Document the Connector's purpose and the appropriate use cases for the team", "Confirm the Connector is approved and the data classification is appropriate", "Connect the data source and confirm the authentication is working as expected.", "Use the Connector in a representative task to evaluate its real-world utility"], "a": 1, "sk": ["performed first"], "note": "Đáp án: {B}. Bẫy: {A} Viết tài liệu mục đích và cách dùng là việc nên làm, nhưng chỉ có ý nghĩa khi Connector đã được phép dùng; {C} Kết nối và kiểm tra xác thực trước khi xác nhận được duyệt là đã mở đường cho dữ liệu đi vào trước khi biết có được phép hay không; {D} Dùng thử trên task thật đòi hỏi Connector đã được duyệt và đã kết nối.", "ex": "Tại sao chọn đáp án đúng (“Confirm the Connector is approved and the data classification…”):\n\nTrước khi kết nối bất kỳ nguồn dữ liệu nào, cần qua cổng kiểm soát: Connector có được tổ chức phê duyệt không, và mức phân loại dữ liệu có phù hợp để đưa vào Claude không. Sau đó mới kết nối, kiểm tra xác thực, thử trên task thật, và ghi lại mục đích cùng cách dùng cho nhóm.\n\nConfirm the Connector is approved và data classification is appropriate là cổng kiểm soát bắt buộc. Nếu không qua được cổng này thì mọi bước sau (kết nối, thử nghiệm, viết tài liệu) đều vô nghĩa, thậm chí vi phạm chính sách ngay khi kết nối.\n\nMẹo nhớ: Dạng FIRST với dữ liệu: cổng Governance đi trước kỹ thuật: Approved? + Classification? → rồi mới Connect → Test → Document.\n\nTại sao các phương án khác sai\n“Document the Connector's purpose and the appropriate use cases…”: Viết tài liệu mục đích và cách dùng là việc nên làm, nhưng chỉ có ý nghĩa khi Connector đã được phép dùng.\n\n“Connect the data source and confirm the authentication is…”: Kết nối và kiểm tra xác thực trước khi xác nhận được duyệt là đã mở đường cho dữ liệu đi vào trước khi biết có được phép hay không.\n\n“Use the Connector in a representative task to evaluate…”: Dùng thử trên task thật đòi hỏi Connector đã được duyệt và đã kết nối."}, {"n": 138, "cat": "E", "topic": 3, "q": "Which SIAM process is responsible for restoring a service that has been degraded or interrupted?", "o": ["problem management", "event management", "incident management", "measuring and monitoring"], "a": 2, "sk": ["restoring a service that has been degraded or interrupted"], "note": "Đáp án: {C}. Bẫy: {A} Problem management tìm và xử lý nguyên nhân gốc để sự cố không tái diễn, không phải khôi phục dịch vụ ngay; {B} Event management phát hiện và phân loại các sự kiện trong hệ thống; {D} Đo lường và giám sát theo dõi hiệu năng dịch vụ, không phải quy trình khôi phục.", "ex": "Tại sao chọn đáp án đúng (“incident management”):\n\nTrong quản lý dịch vụ IT (ITIL/SIAM): incident management khôi phục dịch vụ về trạng thái bình thường nhanh nhất có thể; problem management tìm nguyên nhân gốc để ngăn sự cố lặp lại; event management theo dõi và phân loại các sự kiện trong hệ thống; measuring and monitoring đo lường hiệu năng dịch vụ.\n\nIncident management có mục tiêu chính là restore dịch vụ bị gián đoạn hoặc suy giảm càng nhanh càng tốt, giảm tác động tới người dùng.\n\nMẹo nhớ: Dạng ITIL/SIAM: Incident = chữa cháy (khôi phục nhanh) · Problem = tìm nguyên nhân (chống tái diễn) · Event = phát hiện (giám sát tín hiệu).\n\nTại sao các phương án khác sai\n“problem management”: Problem management tìm và xử lý nguyên nhân gốc để sự cố không tái diễn, không phải khôi phục dịch vụ ngay.\n\n“event management”: Event management phát hiện và phân loại các sự kiện trong hệ thống.\n\n“measuring and monitoring”: Đo lường và giám sát theo dõi hiệu năng dịch vụ, không phải quy trình khôi phục."}, {"n": 139, "cat": "E", "topic": 4, "q": "A knowledge worker is preparing to use the Gmail connector with Claude for the first time. Which statement most accurately describes the connector's behavior at the user level?", "o": ["Claude searches and reads emails the user has access to and drafts replies for the user to send manually, with each action requiring explicit user approval.", "Claude searches and reads emails the user has access to in a read-only mode, and the user must compose any reply manually outside the connector.", "Claude searches and reads emails the user has access to and sends replies on the user's behalf for low-risk messages, with higher-risk messages routed to the user for approval.", "Claude searches and reads emails the user has access to and labels them according to user-defined rules, with reply drafting handled in a separate workflow."], "a": 0, "sk": ["connector's behavior at the user level"], "note": "Đáp án: {A}. Bẫy: {B} Sai: connector không chỉ đọc; {C} Sai: Claude không tự gửi email thay người dùng, kể cả email rủi ro thấp; {D} Sai: mô tả gắn nhãn theo luật tự định nghĩa và tách việc soạn nháp sang quy trình khác không đúng với hành vi của connector.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Claude searches and reads emails the…”; B = “Claude searches and reads emails the…”; C = “Claude searches and reads emails the…”; D = “Claude searches and reads emails the…”.\n\nTại sao chọn đáp án đúng (“Claude searches and reads emails the user has access…”):\n\nGmail connector cho Claude tìm và đọc email người dùng có quyền truy cập, và soạn bản nháp trả lời. Claude không tự gửi: người dùng tự gửi thủ công, và mỗi hành động cần người dùng duyệt rõ ràng. Thiết kế này giữ con người kiểm soát mọi thứ đi ra từ hộp thư của mình.\n\nĐáp án A mô tả đủ ba điểm: Claude searches and reads email người dùng có quyền, drafts replies để người dùng send manually, và each action requiring explicit user approval.\n\nMẹo nhớ: Dạng hành vi connector: nhớ chuỗi Read → Draft → Human sends, kèm approval cho từng hành động. Claude không bao giờ tự gửi thay người dùng.\n\nTại sao các phương án khác sai\n“Claude searches and reads emails the user has access…”: Sai: connector không chỉ đọc.\n\n“Claude searches and reads emails the user has access…”: Sai: Claude không tự gửi email thay người dùng, kể cả email rủi ro thấp.\n\n“Claude searches and reads emails the user has access…”: Sai: mô tả gắn nhãn theo luật tự định nghĩa và tách việc soạn nháp sang quy trình khác không đúng với hành vi của connector."}, {"n": 140, "cat": "E", "topic": 3, "q": "You are a Claude associate troubleshooting a Claude response that introduces facts not present in the supplied source. Which root cause is most directly indicated?", "o": ["The prompt asks Claude to act as a researcher rather than a writer.", "The prompt's heading-based structure encourages Claude to generate placeholder content under each heading even when the source doesn't cover it.", "The prompt does not constrain Claude to use only facts present in the supplied source.", "The prompt asks for a comprehensive response, which leads Claude to fill perceived gaps with plausible-sounding but unverified detail."], "a": 2, "sk": ["introduces facts not present in the supplied source", "most directly indicated"], "note": "Đáp án: {C}. Bẫy: {A} Vai trò nhà nghiên cứu hay người viết ảnh hưởng cách tiếp cận, nhưng không trực tiếp giải thích việc thêm thông tin ngoài nguồn bằng việc thiếu ràng buộc; {B} Cấu trúc theo tiêu đề có thể góp phần, nhưng đây là giả thuyết gián tiếp; {D} Yêu cầu toàn diện có thể đẩy Claude lấp chỗ trống, nhưng vẫn là nguyên nhân gián tiếp.", "ex": "Tại sao chọn đáp án đúng (“The prompt does not constrain Claude to use only…”):\n\nNếu prompt không nói rõ chỉ được dùng tài liệu đã cung cấp, Claude có thể bổ sung từ kiến thức chung hoặc suy diễn cho câu trả lời trọn vẹn. Cách chặn trực tiếp là ràng buộc nguồn (grounding): chỉ dùng thông tin có trong tài liệu, và nói rõ khi tài liệu không đề cập.\n\nTriệu chứng là thông tin ngoài nguồn, và nguyên nhân trực tiếp nhất là prompt does not constrain Claude to use only facts present in the supplied source. Thiếu ràng buộc này, Claude không có lý do gì để dừng ở phạm vi tài liệu.\n\nMẹo nhớ: Dạng chẩn đoán nguyên nhân trực tiếp: ghép triệu chứng ↔ thành phần thiếu gần nhất. Thông tin ngoài nguồn ↔ thiếu ràng buộc nguồn (*use only facts present in the supplied source*).\n\nTại sao các phương án khác sai\n“The prompt asks Claude to act as a researcher…”: Vai trò nhà nghiên cứu hay người viết ảnh hưởng cách tiếp cận, nhưng không trực tiếp giải thích việc thêm thông tin ngoài nguồn bằng việc thiếu ràng buộc.\n\n“The prompt's heading-based structure encourages Claude to generate placeholder…”: Cấu trúc theo tiêu đề có thể góp phần, nhưng đây là giả thuyết gián tiếp.\n\n“The prompt asks for a comprehensive response, which leads…”: Yêu cầu toàn diện có thể đẩy Claude lấp chỗ trống, nhưng vẫn là nguyên nhân gián tiếp."}, {"n": 141, "cat": "T", "topic": 4, "q": "An analyst is working in a long Claude conversation. The conversation contains roughly 60 turns covering an initial requirements analysis, several rounds of data review, and a current drafting phase. Recent responses have started to drift from the agreed requirements. Which step most directly addresses the drift while preserving the analyst's progress?", "o": ["Move the source data and the requirements into a Project knowledge base, then continue the drafting work in a new chat inside that Project.", "Switch the conversation to a model with a larger context window so the accumulated history no longer causes drift and continue without restructuring the inputs.", "Open a new chat and paste only the current draft, then continue refining it there without the prior requirements and data-review context.", "Summarize the agreed requirements, the key data findings, and the current draft state, then continue in the same chat by reasserting the summary as the working context."], "a": 3, "sk": ["roughly 60 turns", "drift from the agreed requirements", "preserving the analyst's progress"], "note": "Đáp án: {D}. Bẫy: {A} Chuyển dữ liệu và yêu cầu vào Project rồi sang chat mới là tái cấu trúc lớn, và chat mới không mang theo phát hiện từ các vòng review cũng như trạng thái bản nháp; {B} Context window lớn hơn không chữa được việc lệch: vấn đề là yêu cầu bị chìm giữa lịch sử dài, không phải thiếu chỗ; {C} Chỉ dán bản nháp sang chat mới làm mất luôn yêu cầu và kết quả review dữ liệu, tức là mất chính thứ bị lệch khỏi.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Move the source data and the…”; B = “Switch the conversation to a model…”; C = “Open a new chat and paste…”; D = “Summarize the agreed requirements, the key…”.\n\nTại sao chọn đáp án đúng (“Summarize the agreed requirements, the key data findings, and…”):\n\nTrong hội thoại dài, các quyết định ban đầu bị chìm sau nhiều lượt trao đổi, nên output dễ lệch. Cách xử lý là tóm tắt các điểm then chốt (yêu cầu đã thống nhất, phát hiện chính từ dữ liệu, trạng thái bản nháp) rồi tái khẳng định bản tóm tắt làm bối cảnh làm việc. Như vậy các điểm quan trọng nổi lên lại mà không mất tiến độ.\n\nĐáp án D summarize đủ ba thứ cần giữ (agreed requirements, key data findings, current draft state) rồi reasserting the summary làm bối cảnh ngay trong chat. Yêu cầu được đưa lên lại đúng chỗ model chú ý, và không mất gì đã làm.\n\nMẹo nhớ: Dạng hội thoại dài bị lệch: chữa bằng Summarize + Reassert (tóm tắt rồi tái khẳng định), giữ đủ yêu cầu – phát hiện – trạng thái hiện tại.\n\nTại sao các phương án khác sai\n“Move the source data and the requirements into a…”: Chuyển dữ liệu và yêu cầu vào Project rồi sang chat mới là tái cấu trúc lớn, và chat mới không mang theo phát hiện từ các vòng review cũng như trạng thái bản nháp.\n\n“Switch the conversation to a model with a larger…”: Context window lớn hơn không chữa được việc lệch: vấn đề là yêu cầu bị chìm giữa lịch sử dài, không phải thiếu chỗ.\n\n“Open a new chat and paste only the current…”: Chỉ dán bản nháp sang chat mới làm mất luôn yêu cầu và kết quả review dữ liệu, tức là mất chính thứ bị lệch khỏi."}, {"n": 142, "cat": "T", "topic": 4, "q": "You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?", "o": ["Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.", "Increase the maximum context length so all 60 tool definitions fit within a single request without exceeding the limit.", "Group the 60 tools into five fixed categories and load one category per request based on a static mapping of task type to category.", "Use a separate model call to condense all 60 tool definitions into a compact index that is prepended to each user turn for tool selection."], "a": 0, "sk": ["60 internal tools", "without sacrificing capability breadth"], "note": "Đáp án: {A}. Bẫy: {B} Tăng độ dài context để nhét vừa 60 tool không giải quyết vấn đề token và độ trễ, chỉ cho phép nó tiếp tục; {C} Nạp một nhóm cố định theo ánh xạ tĩnh làm mất phạm vi năng lực: task cần tool ở nhóm khác sẽ không có, và ánh xạ tĩnh không thích nghi theo từng task; {D} Thêm một lần gọi model để nén danh sách tool, rồi gắn chỉ mục vào mỗi lượt, làm tăng độ trễ và chi phí, và chỉ mục rút gọn có thể làm mất chi tiết cần cho việc chọn tool.", "ex": "Tại sao chọn đáp án đúng (“Apply progressive tool discovery so a curated initial subset…”):\n\nMỗi định nghĩa tool chiếm token trong context. Với nhiều tool, cách hiệu quả là progressive tool discovery (nạp dần): chỉ đưa một tập tool khởi đầu được chọn lọc, và nạp thêm tool khác khi task cần. Context gọn mà vẫn truy cập được toàn bộ 60 tool. Nhóm cố định theo bảng ánh xạ tĩnh thì cứng nhắc, dễ thiếu tool khi task vượt qua nhiều mảng.\n\nProgressive tool discovery: đưa curated initial subset và loaded on demand based on the task. Context nhỏ (ít token, phản hồi nhanh) mà vẫn đủ 60 tool khi cần, nên không mất phạm vi năng lực.\n\nMẹo nhớ: Dạng nhiều tool: nhớ Load less, discover more: đưa một tập nhỏ trước, nạp thêm theo nhu cầu. Bẫy: nhét hết (B), chia cứng theo bảng tĩnh (C), thêm bước trung gian tốn kém (D).\n\nTại sao các phương án khác sai\n“Increase the maximum context length so all 60 tool…”: Tăng độ dài context để nhét vừa 60 tool không giải quyết vấn đề token và độ trễ, chỉ cho phép nó tiếp tục.\n\n“Group the 60 tools into five fixed categories and…”: Nạp một nhóm cố định theo ánh xạ tĩnh làm mất phạm vi năng lực: task cần tool ở nhóm khác sẽ không có, và ánh xạ tĩnh không thích nghi theo từng task.\n\n“Use a separate model call to condense all 60…”: Thêm một lần gọi model để nén danh sách tool, rồi gắn chỉ mục vào mỗi lượt, làm tăng độ trễ và chi phí, và chỉ mục rút gọn có thể làm mất chi tiết cần cho việc chọn tool."}, {"n": 143, "cat": "T", "topic": 5, "q": "You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by their role. Where should role-based access control be enforced in the pipeline?", "o": ["at the retrieval layer, but relying on a single organization-wide access token shared across all roles rather than per-role scoping", "at the retrieval layer, before any role-restricted content reaches the prompt construction step or the model", "inside the system prompt as a natural-language instruction that names the specific role-based access groups Claude should treat as unauthorized", "after the response is generated, by post-filtering content that should not have been retrieved"], "a": 1, "sk": ["only documents permitted by their role", "Where should role-based access control be enforced"], "note": "Đáp án: {B}. Bẫy: {A} Đúng tầng nhưng dùng một token chung cho cả tổ chức thì retrieval không phân biệt được vai trò, nên không có kiểm soát theo vai trò thật sự; {C} Dặn model bằng lời trong system prompt không phải cơ chế kiểm soát truy cập; {D} Lọc sau khi tạo câu trả lời là quá muộn: nội dung cấm đã được truy xuất và model đã dùng, có thể bị diễn đạt lại khiến bộ lọc không bắt được.", "ex": "Tại sao chọn đáp án đúng (“at the retrieval layer, before any role-restricted content reaches…”):\n\nDữ liệu đã vào prompt thì model có thể dùng hoặc làm lộ nó. Vì vậy kiểm soát truy cập phải áp trước khi dữ liệu tới model, tức là ở tầng retrieval, với quyền theo từng vai trò. Chỉ dẫn bằng lời trong system prompt hay lọc output sau khi tạo đều không phải cơ chế kiểm soát truy cập đáng tin cậy.\n\nÁp at the retrieval layer, before any role-restricted content reaches the prompt nghĩa là nội dung không được phép không bao giờ tới model. Model không thể làm lộ thứ nó không nhận được.\n\nMẹo nhớ: Dạng đặt kiểm soát truy cập: chặn ở cửa vào, không phải ở cửa ra. Áp ở retrieval, theo từng vai trò, trước khi tới model.\n\nTại sao các phương án khác sai\n“at the retrieval layer, but relying on a single…”: Đúng tầng nhưng dùng một token chung cho cả tổ chức thì retrieval không phân biệt được vai trò, nên không có kiểm soát theo vai trò thật sự.\n\n“inside the system prompt as a natural-language instruction that…”: Dặn model bằng lời trong system prompt không phải cơ chế kiểm soát truy cập.\n\n“after the response is generated, by post-filtering content that…”: Lọc sau khi tạo câu trả lời là quá muộn: nội dung cấm đã được truy xuất và model đã dùng, có thể bị diễn đạt lại khiến bộ lọc không bắt được."}, {"n": 144, "cat": "E", "topic": 6, "q": "You are selecting the documentation set that should accompany a Claude-based deployment at handoff. Which set is most complete?", "o": ["the original design proposal, its review comments, meeting notes from design sessions, and the approved requirements document", "user-facing release notes, a marketing one-pager describing the deployment, and a customer FAQ", "architecture overview, ADRs, component-level diagrams, runbooks for common operations, on-call playbook, and a list of known limitations", "a project retrospective document, a lessons-learned summary, and a list of contributors"], "a": 2, "sk": ["at handoff", "most complete"], "note": "Đáp án: {C}. Bẫy: {A} Đề xuất ban đầu, góp ý review và biên bản họp là lịch sử thiết kế, có thể đã lỗi thời so với hệ thống thực tế và không hướng dẫn vận hành; {B} Release notes, tài liệu marketing và FAQ khách hàng dành cho người dùng cuối, không giúp đội tiếp nhận vận hành hệ thống; {D} Retrospective, bài học kinh nghiệm và danh sách người đóng góp là tổng kết dự án, không phải tài liệu để vận hành.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “the original design proposal, its review…”; B = “user-facing release notes, a marketing one-pager…”; C = “architecture overview, ADRs, component-level diagrams, runbooks…”; D = “a project retrospective document, a lessons-learned…”.\n\nTại sao chọn đáp án đúng (“architecture overview, ADRs, component-level diagrams, runbooks for common operations,…”):\n\nTài liệu bàn giao phục vụ đội tiếp nhận vận hành: họ cần hiểu hệ thống được dựng thế nào (kiến trúc, sơ đồ thành phần), vì sao được dựng như vậy (ADR: hồ sơ quyết định kiến trúc), vận hành ra sao (runbook, playbook trực sự cố), và giới hạn đã biết. Tài liệu lịch sử thiết kế, marketing hay tổng kết dự án không giúp vận hành.\n\nĐáp án C bao trọn nhu cầu của đội tiếp nhận: architecture overview và component-level diagrams (dựng thế nào), ADRs (vì sao), runbooks và on-call playbook (vận hành và xử lý sự cố), known limitations (giới hạn để không kỳ vọng sai).\n\nMẹo nhớ: Dạng tài liệu bàn giao: hỏi người nhận cần làm gì → vận hành. Bộ đầy đủ trả lời bốn câu: Dựng thế nào (architecture, diagrams) · Vì sao (ADR) · Vận hành ra sao (runbook, on-call) · Giới hạn gì (known limitations).\n\nTại sao các phương án khác sai\n“the original design proposal, its review comments, meeting notes…”: Đề xuất ban đầu, góp ý review và biên bản họp là lịch sử thiết kế, có thể đã lỗi thời so với hệ thống thực tế và không hướng dẫn vận hành.\n\n“user-facing release notes, a marketing one-pager describing the deployment,…”: Release notes, tài liệu marketing và FAQ khách hàng dành cho người dùng cuối, không giúp đội tiếp nhận vận hành hệ thống.\n\n“a project retrospective document, a lessons-learned summary, and a…”: Retrospective, bài học kinh nghiệm và danh sách người đóng góp là tổng kết dự án, không phải tài liệu để vận hành."}, {"n": 145, "cat": "E", "topic": 2, "q": "When refining a Claude output that does not meet expectations. Which iterative refinement step should be performed first?", "o": ["Compare the new output against the original criteria.", "Submit the revised prompt and capture the new output.", "Modify the prompt to address each identified weakness.", "Identify the specific weaknesses in the current output."], "a": 3, "sk": ["performed first"], "note": "Đáp án: {D}. Bẫy: {A} So sánh output mới với tiêu chí là bước cuối vòng lặp, cần đã có output mới; {B} Gửi prompt đã sửa cần có prompt đã sửa, tức là phải biết điểm yếu và sửa xong trước; {C} Sửa prompt để xử lý *từng điểm yếu đã xác định* đòi hỏi điểm yếu đã được xác định trước.", "ex": "Tại sao chọn đáp án đúng (“Identify the specific weaknesses in the current output.”):\n\nVòng tinh chỉnh: xác định điểm yếu cụ thể của output hiện tại → sửa prompt nhắm vào từng điểm yếu → chạy lại và ghi nhận output mới → so sánh với tiêu chí ban đầu. Không biết output yếu ở đâu thì không biết sửa prompt thế nào.\n\nIdentify the specific weaknesses là đầu vào cho mọi bước sau: sửa prompt cần biết sửa cái gì, chạy lại cần có prompt đã sửa, so sánh cần có output mới.\n\nMẹo nhớ: Dạng FIRST trong vòng lặp: vòng tinh chỉnh Identify → Modify → Submit → Compare. Bước đầu luôn là Identify (chẩn đoán).\n\nTại sao các phương án khác sai\n“Compare the new output against the original criteria.”: So sánh output mới với tiêu chí là bước cuối vòng lặp, cần đã có output mới.\n\n“Submit the revised prompt and capture the new output.”: Gửi prompt đã sửa cần có prompt đã sửa, tức là phải biết điểm yếu và sửa xong trước.\n\n“Modify the prompt to address each identified weakness.”: Sửa prompt để xử lý *từng điểm yếu đã xác định* đòi hỏi điểm yếu đã được xác định trước."}, {"n": 146, "cat": "T", "topic": 3, "q": "A knowledge worker has noticed that the same prompt for a recurring weekly task produces inconsistent outputs across runs. Some weeks the output uses the right sections but the wrong tone, other weeks the tone is right but a section is missing. The source inputs change each week but follow the same structure. Which cause is most worth investigating first?", "o": ["The model is non-deterministic, so identical prompts naturally produce different outputs even when the prompt itself is well-written, and the team should accept the variation.", "The recurring prompt underspecifies the audience, tone, format, and required sections, so each run drifts depending on what the model emphasizes that turn.", "The team should split the prompt into separate prompts for tone and structure, since combining both in one prompt produces the mixed inconsistency the team is seeing.", "The source inputs vary too much from week to week, and the team should standardize the inputs before changing the prompt."], "a": 1, "sk": ["inconsistent outputs across runs", "follow the same structure", "most worth investigating first"], "note": "Đáp án: {B}. Bẫy: {A} Chấp nhận biến thiên vì model không xác định (non-deterministic) là bỏ qua nguyên nhân sửa được; {C} Tách thành hai prompt là giải pháp, không phải nguyên nhân cần điều tra, và cũng không đúng rằng gộp giọng văn với cấu trúc trong một prompt gây lỗi; {D} Đề đã nói đầu vào theo cùng cấu trúc mỗi tuần, nên đây không phải nguyên nhân đáng nghi nhất.", "ex": "Tại sao chọn đáp án đúng (“The recurring prompt underspecifies the audience, tone, format, and…”):\n\nKhi prompt không nêu rõ đối tượng, giọng văn, định dạng và các phần bắt buộc, mỗi lần chạy model phải tự chọn những thứ này, và chọn khác nhau giữa các lần. Biến thiên của model là có thật, nhưng prompt càng cụ thể thì biến thiên ở những điểm quan trọng càng nhỏ. Lỗi lệch lúc chỗ này lúc chỗ kia là dấu hiệu điển hình của prompt thiếu đặc tả (underspecified).\n\nTriệu chứng là các yếu tố quan trọng (giọng văn, các phần) lúc đúng lúc sai, trong khi đầu vào có cấu trúc ổn định. Nguyên nhân đáng nghi nhất là prompt underspecifies the audience, tone, format, and required sections, để mỗi lần chạy tự quyết những thứ đó.\n\nMẹo nhớ: Dạng output thất thường: lỗi lúc chỗ này lúc chỗ kia → nghi prompt thiếu đặc tả trước tiên. Đọc kỹ đề để loại các nguyên nhân đề đã loại sẵn (*same structure* loại đáp án D).\n\nTại sao các phương án khác sai\n“The model is non-deterministic, so identical prompts naturally produce…”: Chấp nhận biến thiên vì model không xác định (non-deterministic) là bỏ qua nguyên nhân sửa được.\n\n“The team should split the prompt into separate prompts…”: Tách thành hai prompt là giải pháp, không phải nguyên nhân cần điều tra, và cũng không đúng rằng gộp giọng văn với cấu trúc trong một prompt gây lỗi.\n\n“The source inputs vary too much from week to…”: Đề đã nói đầu vào theo cùng cấu trúc mỗi tuần, nên đây không phải nguyên nhân đáng nghi nhất."}, {"n": 147, "cat": "E", "topic": 3, "q": "A knowledge worker is defining what \"workflow optimization\" means at the Associate level for the team's recurring AI-supported workflows. Which description is most accurate?", "o": ["Reducing the number of steps in the workflow to the smallest possible count, since fewer steps mean faster cycle time and lower error rates.", "Replacing manual steps with Claude-supported steps wherever possible, since each replacement adds value by reducing the time the team spends on the workflow.", "Standardizing every step of the workflow to a fixed template so each run produces identical output, without adjusting for variation in the workflow's inputs.", "Reducing redundancy, removing low-value steps, and applying Claude where it adds measurable value, while keeping required reviews and quality gates."], "a": 3, "sk": ["workflow optimization"], "note": "Đáp án: {D}. Bẫy: {A} Giảm số bước tới mức tối thiểu có thể cắt luôn bước review cần thiết; {B} Thay mọi bước thủ công bằng Claude *wherever possible* bỏ qua việc có tạo giá trị thật hay không, và có thể bỏ những bước cần phán đoán của con người; {C} Chuẩn hóa cứng mọi bước, không điều chỉnh theo biến động đầu vào, làm workflow gãy khi đầu vào thay đổi.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Reducing the number of steps in…”; B = “Replacing manual steps with Claude-supported steps…”; C = “Standardizing every step of the workflow…”; D = “Reducing redundancy, removing low-value steps, and…”.\n\nTại sao chọn đáp án đúng (“Reducing redundancy, removing low-value steps, and applying Claude where…”):\n\nTối ưu workflow không phải chỉ cắt bớt bước hay thay mọi thứ bằng AI. Nó là giảm lặp thừa, bỏ các bước ít giá trị, dùng Claude ở chỗ tạo giá trị đo được, đồng thời giữ lại các bước review và cổng kiểm soát chất lượng bắt buộc. Nhanh hơn mà sai nhiều hơn thì không phải tối ưu.\n\nĐáp án D cân bằng cả hai mặt: reducing redundancy, removing low-value steps, applying Claude where it adds measurable value (hiệu quả) while keeping required reviews and quality gates (chất lượng và kiểm soát).\n\nMẹo nhớ: Dạng định nghĩa tối ưu: tối ưu = Bỏ thừa + Dùng AI có giá trị đo được + Giữ cổng kiểm soát. Bẫy là các mục tiêu cực đoan một chiều: *smallest possible count*, *wherever possible*, *identical output*.\n\nTại sao các phương án khác sai\n“Reducing the number of steps in the workflow to…”: Giảm số bước tới mức tối thiểu có thể cắt luôn bước review cần thiết.\n\n“Replacing manual steps with Claude-supported steps wherever possible, since…”: Thay mọi bước thủ công bằng Claude *wherever possible* bỏ qua việc có tạo giá trị thật hay không, và có thể bỏ những bước cần phán đoán của con người.\n\n“Standardizing every step of the workflow to a fixed…”: Chuẩn hóa cứng mọi bước, không điều chỉnh theo biến động đầu vào, làm workflow gãy khi đầu vào thay đổi."}, {"n": 148, "cat": "E", "topic": 1, "q": "A Claude associate is applying the AI Fluency Framework Diligence competency to ongoing Claude usage. Which practice best reflects Diligence in a governance context?", "o": ["Apply organizational AI policies consistently as a sustained professional habit, identify gaps between actual usage and the policies, and take corrective action to close those gaps over time.", "Defer all policy application to a centralized compliance team, treating individual usage as outside personal responsibility.", "Apply organizational AI policies only in high-visibility situations where usage is likely to be observed or reviewed by others.", "Apply organizational AI policies during onboarding as a foundational training step, document that each associate has reviewed them, and treat that record as evidence of ongoing compliance."], "a": 0, "sk": ["Diligence in a governance context"], "note": "Đáp án: {A}. Bẫy: {B} Đẩy toàn bộ việc
