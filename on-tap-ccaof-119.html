y cho biểu đồ khiến báo cáo thiếu hình ảnh cần thiết.\n\n“Request a narrative description of the data in the…”: Mô tả bằng lời mà không tính toán thì không tạo ra thống kê lẫn biểu đồ."}, {"n": 72, "cat": "E", "topic": 4, "q": "You are preparing system-level instructions for a Project that supports recurring writing tasks. Which action should be completed first when creating the system-level instructions?", "o": ["Refine the drafted instructions based on observed gaps from validation runs.", "Validate the drafted instructions against representative requests for the Project.", "Define the purpose of the Project and the boundaries the instructions must respect.", "Distribute the finalized instructions to collaborators on the Project."], "a": 2, "sk": ["should be completed first"], "note": "Đáp án: {C}. Bẫy: {A} Tinh chỉnh dựa trên lỗ hổng quan sát được cần có bản nháp và kết quả kiểm thử trước; {B} Kiểm thử với yêu cầu mẫu đòi hỏi instructions đã được soạn; {D} Phân phối cho cộng tác viên là bước cuối cùng.", "ex": "Tại sao chọn đáp án đúng (“Define the purpose of the Project and the boundaries…”):\n\nBước đầu tiên khi viết system-level instructions cho Project là xác định mục đích của Project và các ranh giới mà instructions phải tuân thủ. Nền tảng này quyết định instructions cần chỉ dẫn điều gì; việc soạn, kiểm thử, tinh chỉnh và phân phối chỉ diễn ra sau đó.\n\nTại sao các phương án khác sai\n“Refine the drafted instructions based on observed gaps from…”: Tinh chỉnh dựa trên lỗ hổng quan sát được cần có bản nháp và kết quả kiểm thử trước.\n\n“Validate the drafted instructions against representative requests for the…”: Kiểm thử với yêu cầu mẫu đòi hỏi instructions đã được soạn.\n\n“Distribute the finalized instructions to collaborators on the Project.”: Phân phối cho cộng tác viên là bước cuối cùng."}, {"n": 73, "cat": "T", "topic": 2, "q": "A business analyst is asked to use Claude to extract requirements from a recorded stakeholder-interview transcript. The transcript is about 90 minutes long and addresses multiple topics. Which approach is most likely to yield usable structured output?", "o": ["Provide the transcript along with a structured prompt that requests must-haves, nice-to-haves, open questions, and conflicts as separate sections.", "Provide the transcript and ask Claude to produce a single ranked list of requirements, since a single list is easier for stakeholders to review than separate sections.", "Provide the transcript and ask Claude to summarize it; extract requirements from the summary in a second pass since two passes catch more detail.", "Provide the transcript and ask Claude to produce a chronological list of every statement that contains a verb, then classify each statement as a requirement or not."], "a": 0, "sk": ["usable structured output"], "note": "Đáp án: {A}. Bẫy: {B} Một danh sách xếp hạng duy nhất làm mất phân biệt giữa yêu cầu bắt buộc, tùy chọn, câu hỏi mở và xung đột; {C} Tóm tắt trước rồi mới trích xuất có thể làm rơi chi tiết quan trọng; {D} Liệt kê mọi câu có động từ là cách máy móc, tạo nhiễu và không cho output có cấu trúc dùng được.", "ex": "Tại sao chọn đáp án đúng (“Provide the transcript along with a structured prompt that…”):\n\nVới transcript dài 90 phút nhiều chủ đề, cách hiệu quả nhất là dùng structured prompt yêu cầu tách thành các mục riêng: must-haves, nice-to-haves, open questions và conflicts. Cấu trúc output rõ ràng giữ được các phân biệt cần thiết cho phân tích yêu cầu và giúp kiểm soát định dạng câu trả lời.\n\nTại sao các phương án khác sai\n“Provide the transcript and ask Claude to produce a…”: Một danh sách xếp hạng duy nhất làm mất phân biệt giữa yêu cầu bắt buộc, tùy chọn, câu hỏi mở và xung đột.\n\n“Provide the transcript and ask Claude to summarize it;…”: Tóm tắt trước rồi mới trích xuất có thể làm rơi chi tiết quan trọng.\n\n“Provide the transcript and ask Claude to produce a…”: Liệt kê mọi câu có động từ là cách máy móc, tạo nhiễu và không cho output có cấu trúc dùng được."}, {"n": 74, "cat": "T", "topic": 2, "q": "You received an imprecise request to “look at our pricing.” After discovery, the objective is confirmed: create a structured competitor-pricing summary the team can act on, rather than develop new pricing ideas. Which strategy best suits the clarified task?", "o": ["Use a divergent brainstorming approach to generate a wide range of possible competitor-pricing observations, then narrow to the most likely ones.", "Use a comparative analysis strategy that contrasts the company’s pricing against a single named competitor, since pairwise comparison produces the clearest output.", "Use a research strategy that gathers structured information about competitor pricing, names sources, and notes confidence in each finding.", "Use an open conversational strategy that explores competitor pricing iteratively across several prompts, allowing the structure to emerge from the conversation."], "a": 2, "sk": ["rather than develop new pricing ideas"], "note": "Đáp án: {C}. Bẫy: {A} Brainstorm phân kỳ phù hợp tạo ý tưởng, không phải thu thập bằng chứng; {B} So sánh với một đối thủ duy nhất thu hẹp phạm vi quá mức; {D} Trò chuyện mở để cấu trúc tự hình thành đi ngược yêu cầu có output có cấu trúc.", "ex": "Tại sao chọn đáp án đúng (“Use a research strategy that gathers structured information about…”):\n\nSau khi làm rõ, mục tiêu là bản tóm tắt giá đối thủ có cấu trúc để hành động, không phải nghĩ ý tưởng giá mới. Vì vậy cần chiến lược nghiên cứu: thu thập thông tin giá có cấu trúc, ghi rõ nguồn và mức độ tin cậy của từng phát hiện, để nhóm đánh giá được mức độ có thể hành động.\n\nTại sao các phương án khác sai\n“Use a divergent brainstorming approach to generate a wide…”: Brainstorm phân kỳ phù hợp tạo ý tưởng, không phải thu thập bằng chứng.\n\n“Use a comparative analysis strategy that contrasts the company’s…”: So sánh với một đối thủ duy nhất thu hẹp phạm vi quá mức.\n\n“Use an open conversational strategy that explores competitor pricing…”: Trò chuyện mở để cấu trúc tự hình thành đi ngược yêu cầu có output có cấu trúc."}, {"n": 75, "cat": "T", "topic": 1, "q": "You are a customer-success manager deciding whether to escalate a Claude-generated response. Which factor most strongly increases the output’s impact and warrants escalation before it is used externally?", "o": ["The response is an internal draft summarizing the associate’s notes from a customer call for their own reference.", "The response is a casual rephrasing of an internal team status update.", "The response is a brief internal announcement about an upcoming team all-hands meeting.", "The response is an unchanged draft for a paying customer that includes a service-level commitment."], "a": 3, "sk": ["warrants escalation before it is used externally"], "note": "Đáp án: {D}. Bẫy: {A} Ghi chú cuộc gọi để tự tham khảo là dùng nội bộ, tác động thấp; {B} Diễn đạt lại cập nhật trạng thái nội bộ có rủi ro thấp; {C} Thông báo nội bộ về buổi họp toàn nhóm không gây hệ quả bên ngoài.", "ex": "Tại sao chọn đáp án đúng (“The response is an unchanged draft for a paying…”):\n\nYếu tố làm tăng tác động mạnh nhất là bản nháp chưa chỉnh sửa gửi khách hàng trả phí có chứa cam kết mức dịch vụ (service-level commitment). Nó tạo ra lời hứa với bên ngoài kèm hệ quả hợp đồng, vận hành và tài chính, nên cần human review và escalate trước khi dùng.\n\nTại sao các phương án khác sai\n“The response is an internal draft summarizing the associate’s…”: Ghi chú cuộc gọi để tự tham khảo là dùng nội bộ, tác động thấp.\n\n“The response is a casual rephrasing of an internal…”: Diễn đạt lại cập nhật trạng thái nội bộ có rủi ro thấp.\n\n“The response is a brief internal announcement about an…”: Thông báo nội bộ về buổi họp toàn nhóm không gây hệ quả bên ngoài."}, {"n": 76, "cat": "T", "topic": 5, "q": "An HR associate is getting ready to use Claude for a sensitive personnel matter. The organization’s AI policy expressly says that information concerning ongoing investigations must not be entered into AI tools. Which response most closely follows the policy?", "o": ["Enter the investigation-related information into Claude only after the investigation closes, since the policy applies during the investigation period.", "Refrain from entering investigation-related information into Claude and consult HR leadership for an approved alternative way to handle the matter.", "Enter the investigation-related information into Claude in an Incognito chat, since Incognito chats do not retain information and therefore fall outside the policy’s intent.", "Enter a paraphrased version of the investigation-related information that removes identifying details, since paraphrasing addresses the spirit of the policy."], "a": 1, "sk": ["must not be entered into AI tools"], "note": "Đáp án: {B}. Bẫy: {A} Tự diễn giải rằng sau khi điều tra kết thúc thì được nhập là vượt ngoài thẩm quyền, cần xin phê duyệt; {C} Incognito chat vẫn là nhập dữ liệu vào công cụ AI nên vẫn vi phạm chính sách; {D} Diễn giải lại thông tin vẫn là thông tin liên quan đến cuộc điều tra, chính sách không có ngoại lệ đó.", "ex": "Tại sao chọn đáp án đúng (“Refrain from entering investigation-related information into Claude and consult…”):\n\nChính sách AI của tổ chức cấm rõ ràng việc nhập thông tin về điều tra đang diễn ra vào công cụ AI. Cách tuân thủ là không nhập thông tin đó vào Claude và hỏi HR leadership về phương án thay thế được phê duyệt.\n\nTại sao các phương án khác sai\n“Enter the investigation-related information into Claude only after the…”: Tự diễn giải rằng sau khi điều tra kết thúc thì được nhập là vượt ngoài thẩm quyền, cần xin phê duyệt.\n\n“Enter the investigation-related information into Claude in an Incognito…”: Incognito chat vẫn là nhập dữ liệu vào công cụ AI nên vẫn vi phạm chính sách.\n\n“Enter a paraphrased version of the investigation-related information that…”: Diễn giải lại thông tin vẫn là thông tin liên quan đến cuộc điều tra, chính sách không có ngoại lệ đó."}, {"n": 77, "cat": "E", "topic": 3, "q": "A knowledge worker is refining a prompt that has generated a partially acceptable response. Which refinement practice yields the strongest learning across iterations?", "o": ["Change one identifiable element per iteration, capture the change and its effect, and adjust another element only after the first is settled.", "Restart from a fresh prompt each iteration so that prior wording does not bias the next attempt, and pick the strongest response at the end.", "Make several related changes in one iteration when they target the same weakness, and revert the whole set if the combined change makes the output worse.", "Address every weakness the response showed in a single revision, then compare the revised output against the prior version."], "a": 0, "sk": ["strongest learning across iterations"], "note": "Đáp án: {A}. Bẫy: {B} Bắt đầu lại từ đầu mỗi lần làm mất phần đã hiệu quả và không học được gì từ vòng trước; {C} Nhiều thay đổi cùng lúc khiến không biết thay đổi nào có tác dụng; {D} Sửa mọi điểm yếu trong một lần cũng không cô lập được nguyên nhân.", "ex": "Tại sao chọn đáp án đúng (“Change one identifiable element per iteration, capture the change…”):\n\nTinh chỉnh có kiểm soát là chỉ thay đổi một yếu tố mỗi lần, ghi lại thay đổi và tác động của nó, rồi mới chỉnh yếu tố khác khi yếu tố trước đã ổn định. Cách này cô lập được thay đổi nào gây cải thiện hay suy giảm, giúp học hỏi đáng tin cậy qua các vòng lặp.\n\nTại sao các phương án khác sai\n“Restart from a fresh prompt each iteration so that…”: Bắt đầu lại từ đầu mỗi lần làm mất phần đã hiệu quả và không học được gì từ vòng trước.\n\n“Make several related changes in one iteration when they…”: Nhiều thay đổi cùng lúc khiến không biết thay đổi nào có tác dụng.\n\n“Address every weakness the response showed in a single…”: Sửa mọi điểm yếu trong một lần cũng không cô lập được nguyên nhân."}, {"n": 78, "cat": "E", "topic": 5, "q": "You are assessing Connector configurations that colleagues have suggested for different tasks. Which two Connector configurations are safe and suitable uses? Each correct answer provides a complete solution.", "o": ["a Connector that links to the personnel-records system for team leads to support scheduling tasks", "a Connector that links to the team's project management workspace under approved scope", "a Connector that links to a personal cloud storage account where team member’s store working drafts alongside personal files", "a read-only Connector that links to the public knowledge base for reference content", "a Connector that links to the payroll system to allow team members to submit expense reports directly"], "a": [1, 3], "sk": ["safe and suitable uses"], "note": "Đáp án: {B} + {D}. Bẫy: {A} Hệ thống hồ sơ nhân sự chứa dữ liệu nhạy cảm vượt quá nhu cầu xếp lịch; {C} Kho lưu trữ cá nhân trộn lẫn file cá nhân và công việc, khó kiểm soát phạm vi. E Hệ thống payroll là năng lực tác động cao và dữ liệu nhạy cảm, vượt quá nhu cầu nộp chi phí.", "ex": "Tại sao chọn đáp án đúng (“a Connector that links to the team's project management…” / “a read-only Connector that links to the public knowledge…”):\n\nConnector an toàn tuân theo least privilege, quyền truy cập được phê duyệt theo vai trò và read-only khi không cần ghi. Connector tới workspace quản lý dự án của nhóm trong phạm vi được phê duyệt đáp ứng điều đó. Connector read-only tới knowledge base công khai cũng an toàn vì chỉ đọc nội dung tham khảo công khai.\n\nTại sao các phương án khác sai\n“a Connector that links to the personnel-records system for…”: Hệ thống hồ sơ nhân sự chứa dữ liệu nhạy cảm vượt quá nhu cầu xếp lịch.\n\n“a Connector that links to a personal cloud storage…”: Kho lưu trữ cá nhân trộn lẫn file cá nhân và công việc, khó kiểm soát phạm vi. E Hệ thống payroll là năng lực tác động cao và dữ liệu nhạy cảm, vượt quá nhu cầu nộp chi phí."}, {"n": 79, "cat": "T", "topic": 2, "q": "A communications manager is preparing a prompt for Claude to create a quarterly newsletter for store managers across three regions. The agreed key messages, regional information, and a previous newsletter the team liked are all available. Which prompt strategy is most likely to yield a usable first draft?", "o": ["Attach the prior newsletter, and ask Claude to match its tone and structure while incorporating the new key messages for the three named regions.", "Attach the prior newsletter and the agreed key messages, and ask Claude to produce a similar newsletter for this quarter.", "Provide the agreed key messages and the three regions, and ask Claude to choose an appropriate length and tone for store managers.", "Name the audience, the three regions, the length, the tone, and the agreed key messages, and reference the prior newsletter only as a tone example."], "a": 3, "sk": ["usable first draft"], "note": "Đáp án: {D}. Bẫy: {A} Thiếu đối tượng, độ dài và có thể sao chép cấu trúc cũ không phù hợp quý này; {B} Yêu cầu làm bản tương tự quá mơ hồ, thiếu chỉ dẫn về khu vực, độ dài và đối tượng; {C} Để Claude tự chọn độ dài và giọng văn trong khi đã có ví dụ tốt là bỏ phí ngữ cảnh.", "ex": "Tại sao chọn đáp án đúng (“Name the audience, the three regions, the length, the…”):\n\nBản nháp dùng được nhất đến từ prompt nêu rõ ràng các ràng buộc: đối tượng đọc, ba khu vực, độ dài, giọng văn và các thông điệp chính đã thống nhất. Bản newsletter cũ chỉ được dùng làm ví dụ về giọng văn, không thay thế yêu cầu nội dung hiện tại.\n\nTại sao các phương án khác sai\n“Attach the prior newsletter, and ask Claude to match…”: Thiếu đối tượng, độ dài và có thể sao chép cấu trúc cũ không phù hợp quý này.\n\n“Attach the prior newsletter and the agreed key messages,…”: Yêu cầu làm bản tương tự quá mơ hồ, thiếu chỉ dẫn về khu vực, độ dài và đối tượng.\n\n“Provide the agreed key messages and the three regions,…”: Để Claude tự chọn độ dài và giọng văn trong khi đã có ví dụ tốt là bỏ phí ngữ cảnh."}, {"n": 80, "cat": "T", "topic": 1, "q": "You are an HR specialist categorizing potential ethical risks in a Claude-supported workflow. Which two risks raise the greatest ethical concern in an HR-adjacent workflow? Each correct answer represents a complete solution.", "o": ["decisions that materially affect a person’s employment without human accountability", "a clerical typo in a routine internal calendar invitation", "inconsistent tone and formatting across internal HR communications sent to employees", "inconsistent use of the company’s preferred dash style across documents", "outputs that systematically disadvantage members of a protected group"], "a": [0, 4], "sk": ["greatest ethical concern"], "note": "Đáp án: {A} + {E}. Bẫy: {B} Lỗi đánh máy trong lịch họp là lỗi nhỏ, không có tính đạo đức; {C} Giọng văn và định dạng không nhất quán là vấn đề chất lượng giao tiếp; {D} Kiểu dấu gạch ngang không nhất quán chỉ là vấn đề văn phong.", "ex": "Tại sao chọn đáp án đúng (“decisions that materially affect a person’s employment without human…” / “outputs that systematically disadvantage members of a protected group”):\n\nHai rủi ro đạo đức nghiêm trọng nhất: thứ nhất, quyết định ảnh hưởng lớn đến việc làm của một người mà không có con người chịu trách nhiệm, vì có thể ảnh hưởng đến sinh kế. Thứ hai, output gây bất lợi có hệ thống cho nhóm được bảo vệ, tức là gây tổn hại phân biệt đối xử.\n\nTại sao các phương án khác sai\n“a clerical typo in a routine internal calendar invitation”: Lỗi đánh máy trong lịch họp là lỗi nhỏ, không có tính đạo đức.\n\n“inconsistent tone and formatting across internal HR communications sent…”: Giọng văn và định dạng không nhất quán là vấn đề chất lượng giao tiếp.\n\n“inconsistent use of the company’s preferred dash style across…”: Kiểu dấu gạch ngang không nhất quán chỉ là vấn đề văn phong."}, {"n": 81, "cat": "E", "topic": 2, "q": "You are an operations assistant asking Claude to summarize 200 weekly metric records across several regions. Which output format presents the data most clearly?", "o": ["a bulleted list of observations grouped by region without consistent metrics across entries", "a narrative summary organized by region, describing trends and notable records in prose", "a series of regional narrative briefs, each describing weekly performance in paragraph form", "a structured table with one record per row and one metric per column, sorted by region"], "a": 3, "sk": ["200 weekly metric records"], "note": "Đáp án: {D}. Bẫy: {A} Danh sách gạch đầu dòng mà chỉ số không thống nhất thì không so được giữa các mục; {B} Tóm tắt dạng văn xuôi khó quét và khó so sánh 200 bản ghi; {C} Nhiều đoạn văn theo vùng còn phân tán hơn, không cho cái nhìn đối chiếu.", "ex": "Tại sao chọn đáp án đúng (“a structured table with one record per row and…”):\n\nVới 200 bản ghi trải trên nhiều vùng, bảng có cấu trúc (mỗi dòng một bản ghi, mỗi cột một chỉ số, sắp theo vùng) là cách dễ đọc nhất. Các chỉ số nằm thẳng hàng nên người đọc quét, so sánh, sắp xếp và phân tích nhanh, điều mà văn xuôi không làm được với khối dữ liệu lớn.\n\nTại sao các phương án khác sai\n“a bulleted list of observations grouped by region without…”: Danh sách gạch đầu dòng mà chỉ số không thống nhất thì không so được giữa các mục.\n\n“a narrative summary organized by region, describing trends and…”: Tóm tắt dạng văn xuôi khó quét và khó so sánh 200 bản ghi.\n\n“a series of regional narrative briefs, each describing weekly…”: Nhiều đoạn văn theo vùng còn phân tán hơn, không cho cái nhìn đối chiếu."}, {"n": 82, "cat": "E", "topic": 2, "q": "You are an analyst reviewing a Claude response that answers two of three required questions but omits the third. Which prompt element most likely needs to be strengthened?", "o": ["The context provided to Claude should be expanded with additional background detail about the subject matter.", "The output format should be revised to allow Claude to determine the appropriate structure for each question’s answer.", "The role assigned to Claude should be changed to a more specialized expert persona to increase response depth.", "The task statement should explicitly enumerate the three required questions and require an answer to each."], "a": 3, "sk": ["omits the third"], "note": "Đáp án: {D}. Bẫy: {A} Thêm bối cảnh không giải quyết việc thiếu một câu trả lời; lỗi nằm ở cách nêu nhiệm vụ; {B} Để Claude tự chọn cấu trúc còn làm yêu cầu mơ hồ hơn; {C} Đổi persona chuyên sâu hơn có thể tăng độ sâu nhưng không đảm bảo trả lời đủ ba câu.", "ex": "Tại sao chọn đáp án đúng (“The task statement should explicitly enumerate the three required…”):\n\nClaude trả lời hai trên ba câu hỏi bắt buộc nghĩa là yêu cầu về độ đầy đủ chưa đủ rõ. Cần sửa phần task statement: liệt kê rõ ba câu hỏi và yêu cầu trả lời từng câu. Khi các mục bắt buộc được đánh số tường minh, Claude ít khi bỏ sót mục nào.\n\nTại sao các phương án khác sai\n“The context provided to Claude should be expanded with…”: Thêm bối cảnh không giải quyết việc thiếu một câu trả lời; lỗi nằm ở cách nêu nhiệm vụ.\n\n“The output format should be revised to allow Claude…”: Để Claude tự chọn cấu trúc còn làm yêu cầu mơ hồ hơn.\n\n“The role assigned to Claude should be changed to…”: Đổi persona chuyên sâu hơn có thể tăng độ sâu nhưng không đảm bảo trả lời đủ ba câu."}, {"n": 83, "cat": "T", "topic": 1, "q": "An HR team member is reviewing a Claude-generated set of interview questions meant to be used with every candidate for one role. The questions will be asked in the same sequence to each candidate. Which review practice best promotes fairness?", "o": ["Review the questions to ensure they apply equally to all candidates, avoid assumptions about candidate backgrounds, and focus on the role’s actual requirements.", "Review the questions for length and tone, since the questions Claude drafts are well-aligned to role requirements by default and need only stylistic adjustment.", "Review the questions and add follow-up questions tailored to each candidate’s resume so each interview can explore the candidate’s specific experience.", "Review the questions and rotate the order across candidates so no candidate is consistently asked the hardest questions first."], "a": 0, "sk": ["best promotes fairness"], "note": "Đáp án: {A}. Bẫy: {B} Không thể mặc định câu hỏi Claude soạn đã chuẩn; chỉ sửa độ dài và giọng là bỏ qua rủi ro thiên lệch; {C} Thêm câu hỏi riêng theo từng CV làm mất tính nhất quán giữa các ứng viên; {D} Đảo thứ tự trái với thiết kế hỏi cùng một trình tự và không xử lý nội dung câu hỏi.", "ex": "Tại sao chọn đáp án đúng (“Review the questions to ensure they apply equally to…”):\n\nBộ câu hỏi dùng cho mọi ứng viên, cùng một thứ tự, nên tính công bằng đến từ việc câu hỏi áp dụng như nhau cho tất cả, không giả định về xuất thân của ứng viên và bám vào yêu cầu thực của vị trí. Hỏi cùng câu hỏi và tập trung vào công việc là thực hành được EEOC nêu là hỗ trợ đối xử không phân biệt.\n\nTại sao các phương án khác sai\n“Review the questions for length and tone, since the…”: Không thể mặc định câu hỏi Claude soạn đã chuẩn; chỉ sửa độ dài và giọng là bỏ qua rủi ro thiên lệch.\n\n“Review the questions and add follow-up questions tailored to…”: Thêm câu hỏi riêng theo từng CV làm mất tính nhất quán giữa các ứng viên.\n\n“Review the questions and rotate the order across candidates…”: Đảo thứ tự trái với thiết kế hỏi cùng một trình tự và không xử lý nội dung câu hỏi."}, {"n": 84, "cat": "E", "topic": 6, "q": "You are a marketing manager using Claude to research a new market segment. Which research step should be completed first?", "o": ["Generate a final research report combining every Claude output produced.", "Submit a series of Claude prompts to gather information across the segment.", "Validate the gathered information against authoritative external sources.", "Define the specific research questions that must be answered for the segment."], "a": 3, "sk": ["should be completed first"], "note": "Đáp án: {D}. Bẫy: {A} Báo cáo cuối là bước sau cùng, không thể làm khi chưa có dữ liệu; {B} Gửi prompt khi chưa có câu hỏi rõ ràng thì thông tin thu về thiếu trọng tâm; {C} Kiểm chứng chỉ làm được sau khi đã thu thập thông tin.", "ex": "Tại sao chọn đáp án đúng (“Define the specific research questions that must be answered…”):\n\nBước đầu tiên của nghiên cứu là xác định các câu hỏi nghiên cứu cụ thể cần trả lời cho phân khúc. Các câu hỏi này đặt phạm vi cho việc thu thập thông tin bằng prompt, cho việc kiểm chứng nguồn và cho báo cáo cuối. Anthropic cũng nhấn mạnh việc định nghĩa mục tiêu cụ thể, đo được trước khi đánh giá.\n\nTại sao các phương án khác sai\n“Generate a final research report combining every Claude output…”: Báo cáo cuối là bước sau cùng, không thể làm khi chưa có dữ liệu.\n\n“Submit a series of Claude prompts to gather information…”: Gửi prompt khi chưa có câu hỏi rõ ràng thì thông tin thu về thiếu trọng tâm.\n\n“Validate the gathered information against authoritative external sources.”: Kiểm chứng chỉ làm được sau khi đã thu thập thông tin."}, {"n": 85, "cat": "E", "topic": 4, "q": "An HR business partner is setting up two separate Projects for two different client engagements. Which configuration most effectively prevents context bleed between the two engagements?", "o": ["Set up each Project with its own distinct memory context, knowledge sources, and instructions, and verify that information from one Project does not appear in the other Project’s responses.", "Use a single shared Project for both client engagements with combined memory, knowledge sources, and instructions, on the assumption that Claude will keep the two clients’ contexts separate without configuration.", "Configure both Projects to share the same memory context to reduce setup effort, even though shared memory between unrelated client engagements is precisely the configuration that produces context bleed.", "Skip Project configuration entirely and use general chats for both engagements, which provides no scoped memory contexts and offers no structural separation between the two clients’ work streams."], "a": 0, "sk": ["prevents context bleed"], "note": "Đáp án: {A}. Bẫy: {B} Gộp hai khách hàng vào một Project rồi tin Claude tự tách là chính cấu hình gây lẫn ngữ cảnh; {C} Dùng chung memory cho hai engagement không liên quan là nguồn gốc của context bleed; {D} Dùng chat thường thì không có phạm vi memory hay phân tách nào giữa hai luồng công việc.", "ex": "Tại sao chọn đáp án đúng (“Set up each Project with its own distinct memory…”):\n\nĐể tránh context bleed, mỗi engagement cần một Project riêng với memory, knowledge và instructions riêng. Project là không gian làm việc độc lập, nên thông tin khách hàng này không bị dùng cho khách hàng kia. Bước kiểm tra lại rằng thông tin của Project này không xuất hiện trong Project kia giúp xác nhận ranh giới thực sự hoạt động.\n\nTại sao các phương án khác sai\n“Use a single shared Project for both client engagements…”: Gộp hai khách hàng vào một Project rồi tin Claude tự tách là chính cấu hình gây lẫn ngữ cảnh.\n\n“Configure both Projects to share the same memory context…”: Dùng chung memory cho hai engagement không liên quan là nguồn gốc của context bleed.\n\n“Skip Project configuration entirely and use general chats for…”: Dùng chat thường thì không có phạm vi memory hay phân tách nào giữa hai luồng công việc."}, {"n": 86, "cat": "T", "topic": 4, "q": "You are an operations assistant choosing a model for a recurring meeting-summary task that needs no deep reasoning and operates at moderate volume. Which choice best balances cost, speed, and quality?", "o": ["Haiku, which is suitable only when the task requires the fastest possible turnaround.", "Opus, which prioritizes depth at higher latency and rate-limit consumption.", "Sonnet, which provides solid quality at moderate latency and rate-limit consumption for everyday work.", "A custom model, which the Associate-level user would need to build and train independently."], "a": 2, "sk": ["needs no deep reasoning and operates at moderate volume"], "note": "Đáp án: {C}. Bẫy: {A} Haiku hợp với việc đơn giản, khối lượng rất lớn; mô tả rằng nó chỉ hợp khi cần nhanh nhất cũng không khớp nhu cầu cân bằng ở đây; {B} Opus dành cho suy luận khó, chậm và tốn hơn mức cần; {D} Người dùng cấp Associate không tự xây và huấn luyện model riêng.", "ex": "Tại sao chọn đáp án đúng (“Sonnet, which provides solid quality at moderate latency and…”):\n\nTóm tắt cuộc họp định kỳ, không cần suy luận sâu và khối lượng vừa phải, là việc thường ngày điển hình. Sonnet là tầng model cân bằng: chất lượng tốt, độ trễ và mức tiêu thụ rate limit vừa phải, nên cân bằng chi phí, tốc độ và chất lượng tốt nhất cho trường hợp này.\n\nTại sao các phương án khác sai\n“Haiku, which is suitable only when the task requires…”: Haiku hợp với việc đơn giản, khối lượng rất lớn; mô tả rằng nó chỉ hợp khi cần nhanh nhất cũng không khớp nhu cầu cân bằng ở đây.\n\n“Opus, which prioritizes depth at higher latency and rate-limit…”: Opus dành cho suy luận khó, chậm và tốn hơn mức cần.\n\n“A custom model, which the Associate-level user would need…”: Người dùng cấp Associate không tự xây và huấn luyện model riêng."}, {"n": 87, "cat": "T", "topic": 1, "q": "You are a project manager assessing Claude usage methods that teammates have proposed for a project workflow. Which two workflow steps are appropriate for Claude support? Each correct answer provides a complete solution.", "o": ["approving a final external press release without any human review", "issuing legally binding contractual commitments on behalf of the company", "deciding promotion outcomes for staff based solely on the model’s judgment", "synthesizing a literature review across many uploaded research documents", "drafting a structured project status update from a set of meeting notes"], "a": [3, 4], "sk": ["appropriate for Claude support"], "note": "Đáp án: {D} + {E}. Bẫy: {A} Duyệt thông cáo báo chí ra ngoài mà không có người xem lại là bỏ trách nhiệm của con người; {B} Cam kết ràng buộc pháp lý thay công ty phải do người có thẩm quyền thực hiện; {C} Quyết định thăng chức chỉ dựa trên phán đoán của model là không phù hợp với quyết định nhân sự.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “approving a final external press release…”; B = “issuing legally binding contractual commitments on…”; C = “deciding promotion outcomes for staff based…”; D = “synthesizing a literature review across many…”; E = “drafting a structured project status update…”.\n\nTại sao chọn đáp án đúng (“synthesizing a literature review across many uploaded research documents” / “drafting a structured project status update from a set…”):\n\nHai bước phù hợp đều là việc hỗ trợ soạn thảo và tổng hợp, vẫn có người duyệt. Đáp án D: Claude có thể tổng hợp literature review từ nhiều tài liệu nghiên cứu đã tải lên. Đáp án E: Claude có thể biến ghi chú cuộc họp thành bản nháp cập nhật tiến độ có cấu trúc. Cả hai tận dụng thế mạnh ngôn ngữ của Claude mà không trao quyền quyết định cuối.\n\nTại sao các phương án khác sai\n“approving a final external press release without any human…”: Duyệt thông cáo báo chí ra ngoài mà không có người xem lại là bỏ trách nhiệm của con người.\n\n“issuing legally binding contractual commitments on behalf of the…”: Cam kết ràng buộc pháp lý thay công ty phải do người có thẩm quyền thực hiện.\n\n“deciding promotion outcomes for staff based solely on the…”: Quyết định thăng chức chỉ dựa trên phán đoán của model là không phù hợp với quyết định nhân sự."}, {"n": 88, "cat": "T", "topic": 1, "q": "You are an operations lead aligning production tasks with Claude’s model strengths to establish realistic expectations. Which two production tasks most clearly match Claude’s strengths? Each correct answer represents a complete solution.", "o": ["monitoring a live sensor data stream and flagging anomalies as they occur in real time", "issuing a binding legal determination based solely on Claude’s analysis of case documents", "drafting a tone-and-audience-aware customer-facing email under human review", "calculating the precise settlement value of a derivative contract using live market inputs", "synthesizing a single executive summary across many long source documents"], "a": [2, 4], "sk": ["match Claude’s strengths"], "note": "Đáp án: {C} + {E}. Bẫy: {A} Giám sát luồng cảm biến theo thời gian thực cần hệ thống chuyên dụng, mang tính tất định; {B} Phán quyết pháp lý ràng buộc cần quy trình có trách nhiệm giải trình của con người; {D} Tính chính xác giá trị phái sinh với dữ liệu thị trường trực tiếp cần công cụ tính toán và dữ liệu có thẩm quyền.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “monitoring a live sensor data stream…”; B = “issuing a binding legal determination based…”; C = “drafting a tone-and-audience-aware customer-facing email under…”; D = “calculating the precise settlement value of…”; E = “synthesizing a single executive summary across…”.\n\nTại sao chọn đáp án đúng (“drafting a tone-and-audience-aware customer-facing email under human review” / “synthesizing a single executive summary across many long source…”):\n\nClaude mạnh về ngôn ngữ và phân tích. Đáp án C: soạn email cho khách hàng theo đúng giọng và đối tượng, có người duyệt, là việc tạo văn bản điển hình. Đáp án E: context window lớn cho phép tổng hợp một executive summary từ nhiều tài liệu dài. Cả hai đều là đầu ra ngôn ngữ, có thể kiểm lại được.\n\nTại sao các phương án khác sai\n“monitoring a live sensor data stream and flagging anomalies…”: Giám sát luồng cảm biến theo thời gian thực cần hệ thống chuyên dụng, mang tính tất định.\n\n“issuing a binding legal determination based solely on Claude’s…”: Phán quyết pháp lý ràng buộc cần quy trình có trách nhiệm giải trình của con người.\n\n“calculating the precise settlement value of a derivative contract…”: Tính chính xác giá trị phái sinh với dữ liệu thị trường trực tiếp cần công cụ tính toán và dữ liệu có thẩm quyền."}, {"n": 89, "cat": "T", "topic": 4, "q": "A learning specialist is setting up a Project for course-design work. The organization has an internal instructional-design standard and a preferred format for lesson outlines. Which set of custom instructions best supports this use case?", "o": ["Name Claude’s role as a course designer; let each chat’s prompt specify the standards and output structure for that lesson, since lessons vary widely.", "Name Claude’s role as a course designer and require alignment to the organization’s instructional-design standards; leave output structure to Claude based on the topic of each lesson.", "Specify only the preferred output structure for lesson outlines, since the structure carries the standards implicitly and naming the role adds no value.", "Name Claude’s role as a course designer, require alignment to the organization’s instructional-design standards, and specify the preferred output structure for lesson outlines."], "a": 3, "sk": ["internal instructional-design standard and a preferred format"], "note": "Đáp án: {D}. Bẫy: {A} Để từng prompt tự nêu chuẩn và cấu trúc thì lặp việc và dễ thiếu nhất quán; {B} Thiếu cấu trúc đầu ra dù tổ chức đã có định dạng ưu tiên; {C} Chỉ có cấu trúc, thiếu vai trò và chuẩn thiết kế giảng dạy.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Name Claude’s role as a course…”; B = “Name Claude’s role as a course…”; C = “Specify only the preferred output structure…”; D = “Name Claude’s role as a course…”.\n\nTại sao chọn đáp án đúng (“Name Claude’s role as a course designer, require alignment…”):\n\nCustom instructions của Project áp dụng cho mọi chat trong Project, nên đây là chỗ đặt những gì lặp lại ở mọi bài. Đáp án D gồm đủ ba thành phần: vai trò course designer, yêu cầu tuân theo chuẩn thiết kế giảng dạy của tổ chức, và cấu trúc đầu ra ưu tiên cho lesson outline. Nhờ vậy mọi bài học đều nhất quán.\n\nTại sao các phương án khác sai\n“Name Claude’s role as a course designer; let each…”: Để từng prompt tự nêu chuẩn và cấu trúc thì lặp việc và dễ thiếu nhất quán.\n\n“Name Claude’s role as a course designer and require…”: Thiếu cấu trúc đầu ra dù tổ chức đã có định dạng ưu tiên.\n\n“Specify only the preferred output structure for lesson outlines,…”: Chỉ có cấu trúc, thiếu vai trò và chuẩn thiết kế giảng dạy."}, {"n": 90, "cat": "T", "topic": 1, "q": "You are a project manager evaluating stakeholder messages that teammates have drafted regarding Claude’s role in a workflow. Which two messages are appropriate for stakeholder communication about Claude? Each correct answer represents part of the solution.", "o": ["a claim that the model never makes errors and requires no quality review", "a vague reassurance that “the AI is taking care of it” without further detail", "a claim that Claude will handle every task without any human involvement", "a clear statement of the limits and known failure modes of the integration", "an honest description of where Claude assists and where humans retain decisions"], "a": [3, 4], "sk": ["appropriate for stakeholder communication about Claude"], "note": "Đáp án: {D} + {E}. Bẫy: {A} Nói model không bao giờ sai là sai sự thật và bỏ qua khâu review; {B} Trấn an mơ hồ không cho stakeholder thông tin để đánh giá; {C} Hứa Claude làm mọi việc không cần con người là thổi phồng và bỏ qua trách nhiệm giải trình.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “a claim that the model never…”; B = “a vague reassurance that “the AI…”; C = “a claim that Claude will handle…”; D = “a clear statement of the limits…”; E = “an honest description of where Claude…”.\n\nTại sao chọn đáp án đúng (“a clear statement of the limits and known failure…” / “an honest description of where Claude assists and where…”):\n\nTruyền thông với stakeholder cần trung thực. Đáp án D: nêu rõ giới hạn và các kiểu lỗi đã biết của tích hợp, vì Claude có thể đưa ra thông tin sai và thông tin quan trọng vẫn cần kiểm chứng. Đáp án E: mô tả trung thực chỗ Claude hỗ trợ và chỗ con người giữ quyền quyết định. Hai thông điệp này đặt kỳ vọng đúng.\n\nTại sao các phương án khác sai\n“a claim that the model never makes errors and…”: Nói model không bao giờ sai là sai sự thật và bỏ qua khâu review.\n\n“a vague reassurance that “the AI is taking care…”: Trấn an mơ hồ không cho stakeholder thông tin để đánh giá.\n\n“a claim that Claude will handle every task without…”: Hứa Claude làm mọi việc không cần con người là thổi phồng và bỏ qua trách nhiệm giải trình."}, {"n": 91, "cat": "E", "topic": 3, "q": "You are reviewing a competitor brief generated by Claude for unsupported claims. What is the correct sequence of review steps? 1. Cross-check each specific claim against the provided source material or reliable external references. 2. Determine whether to correct, re-prompt, or escalate based on the findings. 3. Record every unsupported or inconsistent claim with its location and severity. 4. Identify the specific factual claims, statistics, and citations in the brief. 5. Read the brief from start to finish and flag any claims that seem surprising.", "o": ["1, 4, 5, 3, 2", "4, 5, 1, 3, 2", "5, 1, 4, 3, 2", "5, 4, 1, 3, 2"], "a": 3, "sk": ["unsupported claims"], "note": "Đáp án: {D}. Bẫy: {A} Bắt đầu bằng đối chiếu khi chưa đọc và chưa xác định claim nào cần kiểm; {B} Xác định claim trước khi đọc tổng thể thì dễ sót chỗ đáng ngờ; {C} Đối chiếu trước khi liệt kê các claim cụ thể là đảo thứ tự.", "ex": "Tại sao chọn đáp án đúng (“5, 4, 1, 3, 2”):\n\nTrình tự đúng là 5, 4, 1, 3, 2. Bước 5: đọc toàn bộ brief để đánh dấu chỗ đáng ngờ. Bước 4: xác định các claim cụ thể, số liệu và trích dẫn cần kiểm. Bước 1: đối chiếu từng claim với tài liệu nguồn hoặc nguồn bên ngoài đáng tin. Bước 3: ghi lại mỗi claim không có căn cứ kèm vị trí và mức độ nghiêm trọng. Bước 2: quyết định sửa, prompt lại hay escalate.\n\nTại sao các phương án khác sai\n“1, 4, 5, 3, 2”: Bắt đầu bằng đối chiếu khi chưa đọc và chưa xác định claim nào cần kiểm.\n\n“4, 5, 1, 3, 2”: Xác định claim trước khi đọc tổng thể thì dễ sót chỗ đáng ngờ.\n\n“5, 1, 4, 3, 2”: Đối chiếu trước khi liệt kê các claim cụ thể là đảo thứ tự."}, {"n": 92, "cat": "T", "topic": 3, "q": "You are creating a checklist to evaluate Claude outputs and must finish the upstream steps before scoring an output. Which two steps must be completed BEFORE scoring a Claude output against the checklist? Each correct answer represents part of the solution.", "o": ["Define the evaluation criteria that matter for the task at hand.", "Promote the approved output into the downstream production process.", "Forward unacceptable outputs to a senior reviewer for second-pass review.", "Specify the threshold that distinguishes acceptable from unacceptable output.", "Document the final score and the reviewer comments for the audit trail."], "a": [0, 3], "sk": ["BEFORE scoring a Claude output"], "note": "Đáp án: {A} + {D}. Bẫy: {B} Đưa đầu ra vào quy trình sản xuất là việc sau khi chấm; {C} Chuyển đầu ra không đạt cho người duyệt cấp cao cần có kết quả chấm trước. E Ghi điểm và nhận xét cho audit trail diễn ra sau khi chấm.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Define the evaluation criteria that matter…”; B = “Promote the approved output into the…”; C = “Forward unacceptable outputs to a senior…”; D = “Specify the threshold that distinguishes acceptable…”; E = “Document the final score and the…”.\n\nTại sao chọn đáp án đúng (“Define the evaluation criteria that matter for the task…” / “Specify the threshold that distinguishes acceptable from unacceptable output.”):\n\nTrước khi chấm điểm phải có hai thứ. Đáp án A là tiêu chí đánh giá phù hợp với nhiệm vụ, quyết định chấm những khía cạnh chất lượng nào. Đáp án D là ngưỡng đạt phân biệt đầu ra chấp nhận được và không chấp nhận được. Thiếu một trong hai thì không thể chấm, hoặc chấm xong không biết đầu ra có đạt hay không.\n\nTại sao các phương án khác sai\n“Promote the approved output into the downstream production process.”: Đưa đầu ra vào quy trình sản xuất là việc sau khi chấm.\n\n“Forward unacceptable outputs to a senior reviewer for second-pass…”: Chuyển đầu ra không đạt cho người duyệt cấp cao cần có kết quả chấm trước. E Ghi điểm và nhận xét cho audit trail diễn ra sau khi chấm."}, {"n": 93, "cat": "T", "topic": 2, "q": "You are a business analyst determining which output-formatting and context-window practices to recommend to teammates. Which two practices constitute effective use of the context window? Each correct answer provides part of the solution.", "o": ["Reuse the same context block across multiple requests to avoid rebuilding it each time.", "Concatenate all source documents end-to-end with no separators between them.", "Paste full email threads related to the project into context so the model has complete conversational history.", "Trim irrelevant material before submitting the request to keep context focused.", "Use clear section headers to separate different parts of the input material."], "a": [3, 4], "sk": ["effective use of the context window"], "note": "Đáp án: {D} + {E}. Bẫy: {A} Dùng lại cùng một khối ngữ cảnh cho mọi yêu cầu có thể mang theo nội dung không liên quan đến yêu cầu mới; {B} Nối tài liệu liền nhau không phân tách khiến model khó biết đoạn nào thuộc tài liệu nào; {C} Dán toàn bộ chuỗi email làm đầy context bằng nội dung thừa.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Reuse the same context block across…”; B = “Concatenate all source documents end-to-end with…”; C = “Paste full email threads related to…”; D = “Trim irrelevant material before submitting the…”; E = “Use clear section headers to separate…”.\n\nTại sao chọn đáp án đúng (“Trim irrelevant material before submitting the request to keep…” / “Use clear section headers to separate different parts of…”):\n\nContext window có dung lượng hữu hạn. Đáp án D: cắt bỏ nội dung không liên quan trước khi gửi giúp dành token cho thông tin thực sự cần. Đáp án E: dùng section header rõ ràng để tách các phần đầu vào, giúp model hiểu mỗi tài liệu là gì và chúng liên quan thế nào. Hai cách này giữ ngữ cảnh gọn và dễ hiểu.\n\nTại sao các phương án khác sai\n“Reuse the same context block across multiple requests to…”: Dùng lại cùng một khối ngữ cảnh cho mọi yêu cầu có thể mang theo nội dung không liên quan đến yêu cầu mới.\n\n“Concatenate all source documents end-to-end with no separators between…”: Nối tài liệu liền nhau không phân tách khiến model khó biết đoạn nào thuộc tài liệu nào.\n\n“Paste full email threads related to the project into…”: Dán toàn bộ chuỗi email làm đầy context bằng nội dung thừa."}, {"n": 94, "cat": "E", "topic": 1, "q": "When preparing an AI-assisted work product for external delivery, a senior manager is applying the AI Fluency Framework’s Diligence competency. Which step most clearly reflects Diligence principles?", "o": ["Deliver the work product without independent verification on the basis that AI assistance shifts accountability away from the human, even though Diligence holds the human fully accountable for the output.", "Delegate accountability for the AI-assisted work product to Claude itself rather than retaining it as a human obligation, contrary to the Diligence principle that humans remain accountable for AI-assisted outputs.", "Skip verification of any element on the assumption that fluent output implies accuracy, even though Diligence requires the human to verify and correct AI-assisted outputs before they are acted upon.", "Identify the elements of the work product that must be independently verified or corrected before delivery, and take ownership of those verifications as a professional accountability obligation."], "a": 3, "sk": ["Diligence competency"], "note": "Đáp án: {D}. Bẫy: {A} Giao mà không kiểm chứng vì cho rằng AI gánh trách nhiệm là sai nguyên tắc; {B} Giao trách nhiệm cho Claude trái với việc con người luôn chịu trách nhiệm; {C} Văn phong trôi chảy không có nghĩa là chính xác, vẫn phải kiểm.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Deliver the work product without independent…”; B = “Delegate accountability for the AI-assisted work…”; C = “Skip verification of any element on…”; D = “Identify the elements of the work…”.\n\nTại sao chọn đáp án đúng (“Identify the elements of the work product that must…”):\n\nDiligence nghĩa là người dùng AI chịu trách nhiệm về đầu ra được dùng hoặc chia sẻ. Đáp án D thể hiện đúng điều đó: xác định phần nào cần kiểm chứng hoặc sửa độc lập trước khi giao cho bên ngoài, và tự nhận các bước kiểm chứng ấy là nghĩa vụ chuyên môn. Trách nhiệm không chuyển sang AI.\n\nTại sao các phương án khác sai\n“Deliver the work product without independent verification on the…”: Giao mà không kiểm chứng vì cho rằng AI gánh trách nhiệm là sai nguyên tắc.\n\n“Delegate accountability for the AI-assisted work product to Claude…”: Giao trách nhiệm cho Claude trái với việc con người luôn chịu trách nhiệm.\n\n“Skip verification of any element on the assumption that…”: Văn phong trôi chảy không có nghĩa là chính xác, vẫn phải kiểm."}, {"n": 95, "cat": "E", "topic": 3, "q": "You are reviewing colleagues’ claims from a recent training about prompt iteration. Which two claims about prompt iteration are accurate? Each correct answer provides a complete solution.", "o": ["Repeated resubmission of the same prompt is the most reliable way to improve output.", "Output comparison against original criteria validates whether iteration helped.", "Iteration is most productive when each change targets a specific diagnosed weakness.", "Iteration should stop only after every possible alternative phrasing has been tried.", "More iterations always produce a better output regardless of what was changed."], "a": [1, 2], "sk": ["about prompt iteration are accurate"], "note": "Đáp án: {B} + {C}. Bẫy: {A} Gửi lại nguyên prompt không sửa nguyên nhân gây ra đầu ra kém; {D} Thử mọi cách diễn đạt có thể là lãng phí; nên dừng khi đạt tiêu chí. E Lặp nhiều hơn không tự động tốt hơn nếu thay đổi không đúng chỗ.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Repeated resubmission of the same prompt…”; B = “Output comparison against original criteria validates…”; C = “Iteration is most productive when each…”; D = “Iteration should stop only after every…”; E = “More iterations always produce a better…”.\n\nTại sao chọn đáp án đúng (“Output comparison against original criteria validates whether iteration helped.” / “Iteration is most productive when each change targets a…”):\n\nLặp prompt hiệu quả cần có định hướng. Đáp án B: so sánh đầu ra với tiêu chí ban đầu cho biết thay đổi có thực sự giúp ích hay không. Đáp án C: mỗi lần sửa nên nhắm vào một điểm yếu cụ thể đã chẩn đoán, thay vì đổi ngẫu nhiên. Hai nguyên tắc này biến việc lặp thành quá trình có kiểm soát.\n\nTại sao các phương án khác sai\n“Repeated resubmission of the same prompt is the most…”: Gửi lại nguyên prompt không sửa nguyên nhân gây ra đầu ra kém.\n\n“Iteration should stop only after every possible alternative phrasing…”: Thử mọi cách diễn đạt có thể là lãng phí; nên dừng khi đạt tiêu chí. E Lặp nhiều hơn không tự động tốt hơn nếu thay đổi không đúng chỗ."}, {"n": 96, "cat": "T", "topic": 1, "q": "A Claude associate is examining Claude-generated customer-segment descriptions for an internal marketing brief. One description makes a generalization about a demographic group’s purchasing behavior that is not true for individual customers within that segment. Which response is most appropriate?", "o": ["Revise the description to focus on observed behaviors rather than generalizations about people, and validate the revision against actual customer data.", "Remove the entire customer-segment description from the brief, since any segmentation that involves demographic characteristics is likely to introduce similar issues.", "Keep the description as written for the internal brief, since internal use does not carry the same risk as external publication of demographic generalizations.", "Add a disclaimer to the description, noting that the generalization may not apply to all individuals in the segment, and keep the underlying description unchanged."], "a": 0, "sk": ["not true for individual customers"], "note": "Đáp án: {A}. Bẫy: {B} Xoá toàn bộ mô tả là quá tay; phân khúc vẫn hữu ích khi dựa trên hành vi; {C} Dùng nội bộ không làm cho khái quát sai trở nên đúng; {D} Thêm disclaimer mà giữ nguyên nội dung thì vẫn còn mô tả sai.", "ex": "Tại sao chọn đáp án đúng (“Revise the description to focus on observed behaviors rather…”):\n\nMô tả phân khúc nên dựa trên hành vi quan sát được chứ không khái quát hoá về một nhóm nhân khẩu học. Cách đúng là viết lại theo hành vi thực tế và kiểm chứng với dữ liệu khách hàng thực. Như vậy vừa sửa được điểm sai, vừa giữ lại giá trị của việc phân khúc.\n\nTại sao các phương án khác sai\n“Remove the entire customer-segment description from the brief, since…”: Xoá toàn bộ mô tả là quá tay; phân khúc vẫn hữu ích khi dựa trên hành vi.\n\n“Keep the description as written for the internal brief,…”: Dùng nội bộ không làm cho khái quát sai trở nên đúng.\n\n“Add a disclaimer to the description, noting that the…”: Thêm disclaimer mà giữ nguyên nội dung thì vẫn còn mô tả sai."}, {"n": 97, "cat": "E", "topic": 6, "q": "You are conducting an optimization pass on a recurring workflow. What is the correct sequence of optimization steps? 1. Apply targeted optimization to the bottleneck step 2. Roll out the optimized workflow to the wider team and document the change 3. Identify the bottleneck step by using measured time per step and queue length 4. Map the existing workflow steps, owners, and decision points 5. Pilot the change with a small group and measure its effect against the previous baseline", "o": ["4, 1, 3, 5, 2", "4, 3, 1, 5, 2", "3, 4, 1, 5, 2", "1, 4, 3, 5, 2"], "a": 1, "sk": ["optimization pass on a recurring workflow"], "note": "Đáp án: {B}. Bẫy: {A} Tối ưu trước khi xác định nút thắt là sửa mò; {C} Tìm nút thắt trước khi vẽ quy trình thì chưa có bức tranh để đo; {D} Tối ưu ngay từ đầu, khi chưa hiểu quy trình hay đo lường gì.", "ex": "Tại sao chọn đáp án đúng (“4, 3, 1, 5, 2”):\n\nTrình tự đúng là 4, 3, 1, 5, 2. Bước 4: vẽ lại quy trình hiện tại, người phụ trách và điểm quyết định. Bước 3: dùng số liệu thời gian mỗi bước và độ dài hàng chờ để tìm nút thắt. Bước 1: tối ưu có mục tiêu vào nút thắt đó. Bước 5: pilot với nhóm nhỏ và so với baseline. Bước 2: triển khai rộng và ghi lại thay đổi.\n\nTại sao các phương án khác sai\n“4, 1, 3, 5, 2”: Tối ưu trước khi xác định nút thắt là sửa mò.\n\n“3, 4, 1, 5, 2”: Tìm nút thắt trước khi vẽ quy trình thì chưa có bức tranh để đo.\n\n“1, 4, 3, 5, 2”: Tối ưu ngay từ đầu, khi chưa hiểu quy trình hay đo lường gì."}, {"n": 98, "cat": "T", "topic": 4, "q": "You are a customer-success lead operating an interactive workflow in which every turn must respond quickly and the reasoning required per turn is light. Which option best matches these requirements?", "o": ["Choose any model because latency does not vary by model.", "Choose Haiku to keep latency low and to handle a light reasoning load efficiently at scale.", "Choose Opus to maximize reasoning depth despite higher latency.", "Choose a model based on the alphabetical order of its name."], "a": 1, "sk": ["respond quickly", "reasoning required per turn is light"], "note": "Đáp án: {B}. Bẫy: {A} Độ trễ có khác nhau giữa các model, nên không thể chọn bừa; {C} Opus tăng độ sâu suy luận nhưng chậm hơn, không hợp với yêu cầu phản hồi nhanh; {D} Thứ tự chữ cái của tên model không liên quan đến việc chọn model.", "ex": "Tại sao chọn đáp án đúng (“Choose Haiku to keep latency low and to handle…”):\n\nYêu cầu là mỗi lượt phải phản hồi nhanh và suy luận nhẹ, ở quy mô lớn. Haiku là dòng model dành cho việc đơn giản, khối lượng lớn, nhạy với độ trễ, nên khớp nhất. Model mạnh hơn chỉ nên dành cho suy luận phức tạp.\n\nTại sao các phương án khác sai\n“Choose any model because latency does not vary by…”: Độ trễ có khác nhau giữa các model, nên không thể chọn bừa.\n\n“Choose Opus to maximize reasoning depth despite higher latency.”: Opus tăng độ sâu suy luận nhưng chậm hơn, không hợp với yêu cầu phản hồi nhanh.\n\n“Choose a model based on the alphabetical order of…”: Thứ tự chữ cái của tên model không liên quan đến việc chọn model."}, {"n": 99, "cat": "E", "topic": 1, "q": "As part of a workflow redesign, a process analyst is applying the AI Fluency Framework’s Delegation competency. Which two criteria most directly guide Delegation decisions?", "o": ["The reversibility of the task and the consequence of an error, which together indicate whether the step is safe to delegate to Claude or should be retained for human decision-making.", "The need for human creativity, empathy, or judgment in the step, which indicates whether the task is appropriate for AI delegation or requires the human capabilities Claude cannot provide.", "The visual complexity of the workflow diagram, since steps with more connections and dependencies are more likely to require human oversight.", "The seniority of the team member who currently performs the step, since more senior roles typically involve higher-stakes tasks that warrant human retention.", "The length of time the workflow has existed in its current form, since well-established processes have been sufficiently validated for AI delegation."], "a": [0, 1], "sk": ["Delegation competency"], "note": "Đáp án: {A} + {B}. Bẫy: {C} Độ phức tạp hình ảnh của sơ đồ không phản ánh rủi ro của từng bước; {D} Thâm niên của người đang làm không quyết định việc có nên giao cho AI. E Quy trình tồn tại lâu không có nghĩa là đã được kiểm chứng để giao cho AI.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “The reversibility of the task and…”; B = “The need for human creativity, empathy,…”; C = “The visual complexity of the workflow…”; D = “The seniority of the team member…”; E = “The length of time the workflow…”.\n\nTại sao chọn đáp án đúng (“The reversibility of the task and the consequence of…” / “The need for human creativity, empathy, or judgment in…”):\n\nDelegation là phân chia việc giữa người và AI theo bản chất và mức rủi ro của từng việc. Đáp án A: khả năng đảo ngược và hậu quả khi sai cho biết bước đó có an toàn để giao cho Claude không. Đáp án B: việc cần sáng tạo, thấu cảm hoặc phán đoán của con người nên do người dẫn dắt. Đây là hai tiêu chí cốt lõi của AI Fluency Framework.\n\nTại sao các phương án khác sai\n“The visual complexity of the workflow diagram, since steps…”: Độ phức tạp hình ảnh của sơ đồ không phản ánh rủi ro của từng bước.\n\n“The seniority of the team member who currently performs…”: Thâm niên của người đang làm không quyết định việc có nên giao cho AI. E Quy trình tồn tại lâu không có nghĩa là đã được kiểm chứng để giao cho AI."}, {"n": 100, "cat": "E", "topic": 5, "q": "A Claude associate is assessing whether to enable a Skill supplied by an unfamiliar third party. Which two checks best support a sound trust decision?", "o": ["Verify the source of the Skill against the organization’s approved-Skill list before enabling it within claude.ai or any Project the team uses for its work.", "Treat the Skill's appearance in a public listing as sufficient validation, without confirming the source, the requested permissions, or alignment with the organization’s approved-Skill list.", "Skip permission review on the assumption that the Skill cannot exceed the boundaries of the workflow, even though Skills can request access that the task does not require.", "Review the permissions and capabilities the Skill requests and confirm that the requested access is appropriate for the task the Skill is intended to perform.", "Enable the Skill immediately on the basis of strong external reviews, even though the source has not been validated against the organization’s approved-Skill list and the permissions remain unverified."], "a": [0, 3], "sk": ["unfamiliar third party"], "note": "Đáp án: {A} + {D}. Bẫy: {B} Xuất hiện trên danh sách công khai không chứng minh được nguồn gốc hay quyền truy cập; {C} Skill có thể xin quyền vượt quá nhu cầu, nên không được bỏ qua bước rà quyền. E Đánh giá tốt từ bên ngoài không thay thế việc xác minh nguồn và quyền.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Verify the source of the Skill…”; B = “Treat the Skill's appearance in a…”; C = “Skip permission review on the assumption…”; D = “Review the permissions and capabilities the…”; E = “Enable the Skill immediately on the…”.\n\nTại sao chọn đáp án đúng (“Verify the source of the Skill against the organization’s…” / “Review the permissions and capabilities the Skill requests and…”):\n\nVới Skill từ bên thứ ba lạ, cần hai kiểm tra. Đáp án A: xác minh nguồn so với danh sách Skill được tổ chức phê duyệt trước khi bật trong claude.ai hay Project. Đáp án D: rà soát quyền và khả năng Skill yêu cầu, bảo đảm chỉ ở mức cần thiết cho nhiệm vụ (nguyên tắc least privilege).\n\nTại sao các phương án khác sai\n“Treat the Skill's appearance in a public listing as…”: Xuất hiện trên danh sách công khai không chứng minh được nguồn gốc hay quyền truy cập.\n\n“Skip permission review on the assumption that the Skill…”: Skill có thể xin quyền vượt quá nhu cầu, nên không được bỏ qua bước rà quyền. E Đánh giá tốt từ bên ngoài không thay thế việc xác minh nguồn và quyền."}, {"n": 101, "cat": "T", "topic": 2, "q": "You are a research associate assembling inputs for a lengthy task that refers to two long regulatory documents, but only particular sections are relevant. Which approach best preserves context-window capacity?", "o": ["Skip the documents entirely and rely on Claude to invent the missing context.", "Split each document into one-character pieces and feed them one at a time.", "Extract only the relevant sections from each document and include those, omitting unrelated chapters.", "Paste the full text of both documents without trimming to maximize available material."], "a": 2, "sk": ["only particular sections are relevant"], "note": "Đáp án: {C}. Bẫy: {A} Bỏ tài liệu và để Claude tự bịa ngữ cảnh dẫn tới thông tin sai; {B} Cắt thành từng ký tự làm mất nghĩa và vô dụng; {D} Dán toàn văn lãng phí token cho các chương không cần.", "ex": "Tại sao chọn đáp án đúng (“Extract only the relevant sections from each document and…”):\n\nChỉ một số phần của hai tài liệu là liên quan, nên cách tiết kiệm context window nhất là trích đúng các phần liên quan và bỏ các chương không liên quan. Claude vẫn có đủ ngữ cảnh pháp quy cần thiết, còn dung lượng còn lại dành cho nhiệm vụ.\n\nTại sao các phương án khác sai\n“Skip the documents entirely and rely on Claude to…”: Bỏ tài liệu và để Claude tự bịa ngữ cảnh dẫn tới thông tin sai.\n\n“Split each document into one-character pieces and feed them…”: Cắt thành từng ký tự làm mất nghĩa và vô dụng.\n\n“Paste the full text of both documents without trimming…”: Dán toàn văn lãng phí token cho các chương không cần."}, {"n": 102, "cat": "E", "topic": 2, "q": "You are a project lead evaluating a teammate’s practice of using the same prompt template for every task, regardless of task type. Which feedback is most appropriate?", "o": ["The prompting strategy should be adapted to each task type because one template does not produce equally strong outputs across all tasks.", "The habit is ideal because a single template guarantees consistent quality across all task types.", "The prompting strategy should not change between tasks because adapting it wastes time and adds no value.", "Task type has no effect on the appropriate prompting strategy."], "a": 0, "sk": ["same prompt template for every task"], "note": "Đáp án: {A}. Bẫy: {B} Một template không đảm bảo chất lượng đồng đều cho mọi loại việc; {C} Điều chỉnh prompt theo việc là đầu tư có giá trị, không phải lãng phí; {D} Loại việc ảnh hưởng trực tiếp đến cách viết prompt.", "ex": "Tại sao chọn đáp án đúng (“The prompting strategy should be adapted to each task…”):\n\nMỗi loại việc cần chỉ dẫn, ngữ cảnh, định dạng đầu ra, ràng buộc và tiêu chí đánh giá khác nhau. Vì vậy phản hồi đúng là điều chỉnh chiến lược prompt theo từng loại việc; một template duy nhất không thể cho kết quả tốt như nhau ở mọi nhiệm vụ.\n\nTại sao các phương án khác sai\n“The habit is ideal because a single template guarantees…”: Một template không đảm bảo chất lượng đồng đều cho mọi loại việc.\n\n“The prompting strategy should not change between tasks because…”: Điều chỉnh prompt theo việc là đầu tư có giá trị, không phải lãng phí.\n\n“Task type has no effect on the appropriate prompting…”: Loại việc ảnh hưởng trực tiếp đến cách viết prompt."}, {"n": 103, "cat": "E", "topic": 2, "q": "You are a knowledge worker preparing a summary of common prompt-failure patterns for the team. Which pattern is most likely to result in vague or off-target output?", "o": ["a prompt that names a topic but does not state the task, audience, or required output structure", "a prompt that adds clear constraints on length and tone", "a prompt that explicitly names the role, task, audience, and required output format", "a prompt that includes a representative example of the desired output"], "a": 0, "sk": ["vague or off-target output"], "note": "Đáp án: {A}. Bẫy: {B} Thêm ràng buộc rõ về độ dài và giọng văn giúp đầu ra tốt hơn; {C} Nêu rõ vai trò, nhiệm vụ, đối tượng và định dạng là prompt tốt; {D} Kèm ví dụ mẫu giúp Claude hiểu chuẩn mong muốn.", "ex": "Tại sao chọn đáp án đúng (“a prompt that names a topic but does not…”):\n\nPrompt chỉ nêu chủ đề mà không nói nhiệm vụ, đối tượng đọc hay cấu trúc đầu ra buộc model tự đoán những yêu cầu cốt lõi, nên dễ cho ra kết quả chung chung hoặc lệch mục tiêu. Đây là kiểu lỗi prompt rõ nhất trong các lựa chọn.\n\nTại sao các phương án khác sai\n“a prompt that adds clear constraints on length and…”: Thêm ràng buộc rõ về độ dài và giọng văn giúp đầu ra tốt hơn.\n\n“a prompt that explicitly names the role, task, audience,…”: Nêu rõ vai trò, nhiệm vụ, đối tượng và định dạng là prompt tốt.\n\n“a prompt that includes a representative example of the…”: Kèm ví dụ mẫu giúp Claude hiểu chuẩn mong muốn."}, {"n": 104, "cat": "T", "topic": 5, "q": "You are an HR specialist assessing data items proposed for inclusion in a Claude prompt. Which two data items are suitable to include in a Claude prompt for a routine task? Each correct answer provides a complete solution.", "o": ["a redacted job description that the model will adapt for a posting", "accommodation request notes from an employee’s HR file needed to draft a role adjustment memo", "employee ID numbers and hire dates for the team roster included to help Claude personalize onboarding communications", "a compensation band summary that includes employee names and current salary figures for a specific team", "an anonymized summary of an HR policy that the model will rephrase"], "a": [0, 4], "sk": ["suitable to include in a Claude prompt for a routine task"], "note": "Đáp án: {A} + {E}. Bẫy: {B} Ghi chú yêu cầu điều chỉnh (accommodation) trong hồ sơ HR là dữ liệu nhạy cảm, bảo mật; {C} Mã nhân viên và ngày vào làm là thông tin nhận dạng, không cần cho việc này; {D} Tên nhân viên kèm mức lương hiện tại là dữ liệu lương bảo mật.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “a redacted job description that the…”; B = “accommodation request notes from an employee’s…”; C = “employee ID numbers and hire dates…”; D = “a compensation band summary that includes…”; E = “an anonymized summary of an HR…”.\n\nTại sao chọn đáp án đúng (“a redacted job description that the model will adapt…” / “an anonymized summary of an HR policy that the…”):\n\nDữ liệu đưa vào prompt cho việc thường lệ nên được tối thiểu hoá và không chứa thông tin nhận dạng hay nhạy cảm của nhân viên. Đáp án A: mô tả công việc đã được che (redacted). Đáp án E: tóm tắt chính sách HR đã ẩn danh. Cả hai đều an toàn để Claude chỉnh sửa hay diễn đạt lại.\n\nTại sao các phương án khác sai\n“accommodation request notes from an employee’s HR file needed…”: Ghi chú yêu cầu điều chỉnh (accommodation) trong hồ sơ HR là dữ liệu nhạy cảm, bảo mật.\n\n“employee ID numbers and hire dates for the team…”: Mã nhân viên và ngày vào làm là thông tin nhận dạng, không cần cho việc này.\n\n“a compensation band summary that includes employee names and…”: Tên nhân viên kèm mức lương hiện tại là dữ liệu lương bảo mật."}, {"n": 105, "cat": "E", "topic": 1, "q": "You are a Claude associate assessing a proposed Claude use case before approving it for your team. Which is the correct order of assessment steps? (1) Compare the use case against the organization's policies and the relevant regulatory considerations. (2) Document the assessment outcome and the rationale for traceability. (3) Identify the audience, decision impact, and reversibility of the outputs. (4) Decide whether the use case proceeds, requires modification, or is declined. (5) Identify the data types involved and whether sensitive data is implicated.", "o": ["1, 3, 5, 4, 2", "5, 3, 1, 4, 2", "3, 1, 5, 4, 2", "3, 5, 1, 4, 2"], "a": 3, "sk": ["before approving it for your team"], "note": "Đáp án: {D}. Bẫy: {A} Đối chiếu chính sách (bước 1) đầu tiên khi chưa biết use case có rủi ro gì và dùng dữ liệu gì, nên không biết chính sách nào áp dụng; {B} Xác định dữ liệu (bước 5) trước người nhận và tác động (bước 3) đảo thứ tự hiểu bối cảnh; {C} Đối chiếu chính sách (bước 1) trước khi xác định dữ liệu (bước 5).", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “1, 3, 5, 4, 2”; B = “5, 3, 1, 4, 2”; C = “3, 1, 5, 4, 2”; D = “3, 5, 1, 4, 2”.\n\nTại sao chọn đáp án đúng (“3, 5, 1, 4, 2”):\n\nĐánh giá use case đi từ bản chất rủi ro tới quyết định: xác định người nhận, mức ảnh hưởng của quyết định và khả năng đảo ngược → xác định loại dữ liệu liên quan, có dữ liệu nhạy cảm không → đối chiếu với chính sách và quy định (cần biết rủi ro và dữ liệu mới đối chiếu đúng được) → quyết định tiến hành, sửa đổi hay từ chối → ghi lại kết quả và lý do.\n\n(3) Identify audience, impact, reversibility trước để biết mức rủi ro. Rồi (5) identify the data types và dữ liệu nhạy cảm. Có hai thông tin đó mới (1) đối chiếu với chính sách và quy định, vì chính sách áp dụng tùy theo mức rủi ro và loại dữ liệu. Sau đó (4) quyết định và (2) ghi lại. Thứ tự 3, 5, 1, 4, 2 là đáp án D.\n\nMẹo nhớ: Dạng sắp xếp thứ tự: cả 4 đáp án đều kết thúc bằng 4, 2, nên chỉ cần xếp 3, 5, 1.\n\nTại sao các phương án khác sai\n“1, 3, 5, 4, 2”: Đối chiếu chính sách (bước 1) đầu tiên khi chưa biết use case có rủi ro gì và dùng dữ liệu gì, nên không biết chính sách nào áp dụng.\n\n“5, 3, 1, 4, 2”: Xác định dữ liệu (bước 5) trước người nhận và tác động (bước 3) đảo thứ tự hiểu bối cảnh.\n\n“3, 1, 5, 4, 2”: Đối chiếu chính sách (bước 1) trước khi xác định dữ liệu (bước 5)."}, {"n": 106, "cat": "T", "topic": 3, "q": "Claude’s first output is partly useful, but it has issues with tone and detail. Which two refinement actions are most likely to result in a meaningfully better output? Each correct answer provides a complete solution.", "o": ["Provide an example of an output that meets the desired standard.", "Append the phrase “please do better” to the end of the original prompt.", "Add a specific tone descriptor and a concrete audience to the prompt.", "Increase the temperature setting and resubmit the unchanged prompt.", "Resubmit the same prompt several times and select the best response."], "a": [0, 2], "sk": ["issues with tone and detail"], "note": "Đáp án: {A} + {C}. Bẫy: {B} Câu kiểu please do better không cho Claude biết cần sửa gì; {D} Tăng temperature với prompt cũ chỉ làm kết quả ngẫu nhiên hơn. E Gửi lại nhiều lần rồi chọn không sửa nguyên nhân gốc.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Provide an example of an output…”; B = “Append the phrase “please do better”…”; C = “Add a specific tone descriptor and…”; D = “Increase the temperature setting and resubmit…”; E = “Resubmit the same prompt several times…”.\n\nTại sao chọn đáp án đúng (“Provide an example of an output that meets the…” / “Add a specific tone descriptor and a concrete audience…”):\n\nĐầu ra có vấn đề về giọng và độ chi tiết thì cần ràng buộc cụ thể. Đáp án A: đưa ví dụ đầu ra đạt chuẩn cho Claude một mẫu rõ ràng về giọng và mức chi tiết. Đáp án C: thêm mô tả giọng văn cụ thể và đối tượng đọc rõ ràng để định hướng văn phong, từ ngữ và độ sâu. Anthropic khuyên dùng chỉ dẫn rõ ràng và ví dụ.\n\nTại sao các phương án khác sai\n“Append the phrase “please do better” to the end…”: Câu kiểu please do better không cho Claude biết cần sửa gì.\n\n“Increase the temperature setting and resubmit the unchanged prompt.”: Tăng temperature với prompt cũ chỉ làm kết quả ngẫu nhiên hơn. E Gửi lại nhiều lần rồi chọn không sửa nguyên nhân gốc."}, {"n": 107, "cat": "E", "topic": 3, "q": "You are reviewing colleagues’ replies to feedback received on communications drafted by Claude. Which two feedback responses are productive? Each correct answer represents a complete solution.", "o": ["declining to revise sections that were generated by Claude on the basis that the model’s output should be trusted as written", "incorporating all feedback received, including contradictory suggestions, into the next draft simultaneously", "deferring all feedback to a later revision cycle to avoid disrupting the current draft’s consistency", "asking clarifying questions when feedback is ambiguous before acting on it", "mapping each piece of feedback to the specific change made in the next draft"], "a": [3, 4], "sk": ["feedback responses are productive"], "note": "Đáp án: {D} + {E}. Bẫy: {A} Nội dung do Claude viết vẫn cần được review, không mặc định là đúng; {B} Gộp cả các góp ý mâu thuẫn cùng lúc làm bản nháp rối; {C} Hoãn toàn bộ feedback làm chậm cải thiện và bỏ lỡ chỗ cần sửa.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “declining to revise sections that were…”; B = “incorporating all feedback received, including contradictory…”; C = “deferring all feedback to a later…”; D = “asking clarifying questions when feedback is…”; E = “mapping each piece of feedback to…”.\n\nTại sao chọn đáp án đúng (“asking clarifying questions when feedback is ambiguous before acting…” / “mapping each piece of feedback to the specific change…”):\n\nPhản hồi hiệu quả cần rõ ràng và truy vết được. Đáp án D: hỏi lại khi feedback mơ hồ trước khi sửa, để bản sửa đúng ý người góp ý. Đáp án E: gắn từng feedback với thay đổi cụ thể trong bản nháp sau, tạo dấu vết sửa đổi kiểm tra được và xác nhận mọi góp ý đã được xử lý.\n\nTại sao các phương án khác sai\n“declining to revise sections that were generated by Claude…”: Nội dung do Claude viết vẫn cần được review, không mặc định là đúng.\n\n“incorporating all feedback received, including contradictory suggestions, into the…”: Gộp cả các góp ý mâu thuẫn cùng lúc làm bản nháp rối.\n\n“deferring all feedback to a later revision cycle to…”: Hoãn toàn bộ feedback làm chậm cải thiện và bỏ lỡ chỗ cần sửa."}, {"n": 108, "cat": "T", "topic": 6, "q": "A project manager is determining how Claude can assist with requirements analysis for an upcoming engagement. The team will conduct stakeholder interviews and review existing process documentation during discovery. Which activity fits this domain?", "o": ["Use Claude to generate a complete requirements list from the project name and a short description, since requirements for similar engagements are largely standard.", "Use Claude to prioritize the requirements the team has already gathered, leaving the gathering itself to manual analyst work since prioritization is more time-consuming.", "Use Claude to synthesize stakeholder inputs and existing process documentation into a structured list of requirements with traceability to each source.", "Use Claude to conduct the stakeholder interviews directly, with the analyst reviewing the recordings afterward to confirm the requirements Claude extracted."], "a": 2, "sk": ["stakeholder interviews and review existing process documentation"], "note": "Đáp án: {C}. Bẫy: {A} Sinh yêu cầu chỉ từ tên dự án sẽ thiếu căn cứ và bỏ qua dữ liệu thật từ discovery; {B} Bỏ phần tổng hợp, là chỗ Claude giúp được nhiều nhất; {D} Phỏng vấn stakeholder cần con người trực tiếp thực hiện.", "ex": "Tại sao chọn đáp án đúng (“Use Claude to synthesize stakeholder inputs and existing process…”):\n\nTrong phân tích yêu cầu, Claude phù hợp nhất ở việc tổng hợp đầu vào từ stakeholder và tài liệu quy trình thành danh sách yêu cầu có cấu trúc, kèm truy vết về từng nguồn. Traceability giúp analyst kiểm từng yêu cầu với nguồn gốc và giảm claim không có căn cứ.\n\nTại sao các phương án khác sai\n“Use Claude to generate a complete requirements list from…”: Sinh yêu cầu chỉ từ tên dự án sẽ thiếu căn cứ và bỏ qua dữ liệu thật từ discovery.\n\n“Use Claude to prioritize the requirements the team has…”: Bỏ phần tổng hợp, là chỗ Claude giúp được nhiều nhất.\n\n“Use Claude to conduct the stakeholder interviews directly, with…”: Phỏng vấn stakeholder cần con người trực tiếp thực hiện."}, {"n": 109, "cat": "T", "topic": 6, "q": "An account manager used Claude to extract requirements from stakeholder notes. Three requirements seem to be in conflict: two stakeholders specified mutually exclusive workflow steps, and a third requirement presumes an outcome that the first two would prevent. Which action is most appropriate?", "o": ["Present all three conflicting requirements as alternative options in the requirements document, leaving the resolution to the project’s decision-making process later.", "Apply Claude to propose a compromise wording for each conflict and submit the compromise to stakeholders as the proposed resolution.", "Select the requirement that has the strongest business justification in the source notes, set the conflicting requirements aside, and proceed with the selected one.", "Flag the conflicts in the requirements document, document the source for each side, and route the conflicts back to the originating stakeholders for resolution."], "a": 3, "sk": ["seem to be in conflict"], "note": "Đáp án: {D}. Bẫy: {A} Liệt kê như các phương án rồi gác lại thì mâu thuẫn chưa được giải quyết; {B} Claude đề xuất thoả hiệp rồi đưa như lời giải là quyết thay stakeholder; {C} Tự chọn yêu cầu mạnh nhất là gạt bỏ ý của các bên khác.", "ex": "Tại sao chọn đáp án đúng (“Flag the conflicts in the requirements document, document the…”):\n\nKhi các yêu cầu mâu thuẫn, người phân tích hay Claude không có quyền tự chọn. Cách đúng là đánh dấu mâu thuẫn, ghi rõ nguồn của từng bên, rồi chuyển lại cho stakeholder đã nêu yêu cầu để họ giải quyết. Điều này giữ trách nhiệm giải trình và tránh ra quyết định kinh doanh trái thẩm quyền.\n\nTại sao các phương án khác sai\n“Present all three conflicting requirements as alternative options in…”: Liệt kê như các phương án rồi gác lại thì mâu thuẫn chưa được giải quyết.\n\n“Apply Claude to propose a compromise wording for each…”: Claude đề xuất thoả hiệp rồi đưa như lời giải là quyết thay stakeholder.\n\n“Select the requirement that has the strongest business justification…”: Tự chọn yêu cầu mạnh nhất là gạt bỏ ý của các bên khác."}, {"n": 110, "cat": "E", "topic": 4, "q": "A knowledge worker is describing the cost, speed, and quality trade-offs among Claude models to a colleague. Which generalization accurately characterizes this trade-off?", "o": ["Speed and rate-limit consumption are independent of model capability; the difference between Haiku, Sonnet, and Opus is reasoning depth alone.", "More capable models generally consume more of the rate limit and run more slowly, while lighter models are faster and consume less of the rate limit.", "More capable models generally consume less of the rate limit because their reasoning is more efficient, even though they run more slowly than lighter models.", "Lighter models consume more of the rate limit per request than more capable models, since lighter models require multiple passes to match heavier-model quality."], "a": 1, "sk": ["cost, speed, and quality trade-offs"], "note": "Đáp án: {B}. Bẫy: {A} Tốc độ và mức tiêu thụ không độc lập với năng lực model; {C} Model mạnh không tiêu thụ ít rate limit hơn; {D} Model nhẹ không tốn nhiều rate limit hơn mỗi yêu cầu.", "ex": "Tại sao chọn đáp án đúng (“More capable models generally consume more of the rate…”):\n\nQuy luật chung: model càng mạnh thì thường chậm hơn và tốn rate limit hơn, còn model nhẹ như Haiku nhanh hơn và tốn ít hơn. Sonnet và Opus dùng cho suy luận phức tạp với chi phí token cao hơn, tức là đánh đổi hiệu quả lấy năng lực.\n\nTại sao các phương án khác sai\n“Speed and rate-limit consumption are independent of model capability;…”: Tốc độ và mức tiêu thụ không độc lập với năng lực model.\n\n“More capable models generally consume less of the rate…”: Model mạnh không tiêu thụ ít rate limit hơn.\n\n“Lighter models consume more of the rate limit per…”: Model nhẹ không tốn nhiều rate limit hơn mỗi yêu cầu."}, {"n": 111, "cat": "E", "topic": 4, "q": "A finance manager needs to choose a Claude feature for work requiring deterministic calculations across a multi-tab spreadsheet. Which option best meets this requirement?", "o": ["Use an Artifact alone for the calculations, which provides a stable editable surface for the result but does not perform the deterministic computation that Code Execution would run.", "Use Code Execution, which runs code in a sandbox to perform calculations on the uploaded file and produce verified outputs the associate can check.", "Use the Research feature for the calculations, which gathers and synthesizes external sources and is not the appropriate feature for deterministic computation on an uploaded spreadsheet.", "Use a standard chat prompt for the calculations, which generates text without running code and does not produce the verified deterministic output the multi-tab calculation task requires."], "a": 1, "sk": ["deterministic calculations across a multi-tab spreadsheet"], "note": "Đáp án: {B}. Bẫy: {A} Artifact chỉ là nơi hiển thị
