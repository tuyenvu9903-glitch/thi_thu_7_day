áp dụng chính sách cho đội compliance là chối bỏ trách nhiệm cá nhân, ngược với Diligence; {C} Chỉ tuân thủ khi có người nhìn là tuân thủ hình thức, không phải thói quen nghề nghiệp; {D} Học chính sách một lần lúc onboarding rồi coi bản ghi đó là bằng chứng tuân thủ liên tục là nhầm việc *đã đọc* với việc *đang làm đúng*.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Apply organizational AI policies consistently as…”; B = “Defer all policy application to a…”; C = “Apply organizational AI policies only in…”; D = “Apply organizational AI policies during onboarding…”.\n\nTại sao chọn đáp án đúng (“Apply organizational AI policies consistently as a sustained professional…”):\n\nDiligence là trách nhiệm cá nhân khi dùng AI, và trách nhiệm đó là liên tục, không phải một lần. Trong quản trị, nó nghĩa là áp dụng chính sách AI của tổ chức nhất quán như một thói quen nghề nghiệp, tự phát hiện khoảng cách giữa cách dùng thực tế và chính sách, rồi sửa dần những khoảng cách đó.\n\nĐáp án A thể hiện đủ ba ý: apply policies consistently as a sustained professional habit, identify gaps giữa thực tế và chính sách, và take corrective action theo thời gian. Trách nhiệm cá nhân, liên tục và có cải thiện.\n\nMẹo nhớ: Dạng Diligence: từ khóa sustained / consistently / over time / take ownership. Diligence là trách nhiệm cá nhân, liên tục.\n\nTại sao các phương án khác sai\n“Defer all policy application to a centralized compliance team,…”: Đẩy toàn bộ việc áp dụng chính sách cho đội compliance là chối bỏ trách nhiệm cá nhân, ngược với Diligence.\n\n“Apply organizational AI policies only in high-visibility situations where…”: Chỉ tuân thủ khi có người nhìn là tuân thủ hình thức, không phải thói quen nghề nghiệp.\n\n“Apply organizational AI policies during onboarding as a foundational…”: Học chính sách một lần lúc onboarding rồi coi bản ghi đó là bằng chứng tuân thủ liên tục là nhầm việc *đã đọc* với việc *đang làm đúng*."}, {"n": 149, "cat": "E", "topic": 4, "q": "After importing context from another AI platform into Claude's Memory, a knowledge worker notices that some imported details did not appear in subsequent responses. Which explanation is most accurate?", "o": ["Imported memories are stored separately from regular memories and cannot be referenced in any chat, so missing details reflect an architectural separation rather than imperfect import incorporation.", "Memory imports are experimental, and Claude might not successfully incorporate all imported content; missing details can be added manually through Settings > Capabilities as a fallback.", "The import transfers every detail as a rule, and any missing content reflects a deliberate choice by Claude to omit the information rather than the documented experimental nature of imports.", "Memory imports overwrite all prior memories on completion, so any details that appear missing must have been deleted by the import process rather than not incorporated during the import itself."], "a": 1, "sk": ["some imported details did not appear"], "note": "Đáp án: {B}. Bẫy: {A} Sai: nội dung import không bị lưu tách riêng đến mức không dùng được ở chat nào; {C} Sai: import không đảm bảo chuyển mọi chi tiết, và thiếu sót không phải do Claude cố ý bỏ qua; {D} Sai: import không ghi đè toàn bộ memory cũ.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Imported memories are stored separately from…”; B = “Memory imports are experimental, and Claude…”; C = “The import transfers every detail as…”; D = “Memory imports overwrite all prior memories…”.\n\nTại sao chọn đáp án đúng (“Memory imports are experimental, and Claude might not successfully…”):\n\nTính năng import Memory từ AI khác đang ở giai đoạn thử nghiệm: Claude có thể không ghi nhận được toàn bộ nội dung import. Chi tiết bị thiếu có thể bổ sung thủ công trong phần cài đặt Memory (Settings > Capabilities). Import không ghi đè memory cũ, và nội dung import không bị tách riêng khỏi các chat.\n\nĐáp án B giải thích đúng: import là experimental, Claude might not successfully incorporate all imported content, và có cách khắc phục là added manually through Settings > Capabilities.\n\nMẹo nhớ: Dạng hành vi tính năng: tính năng experimental → kết quả có thể không đầy đủ → có cách khắc phục thủ công. Loại các đáp án tuyệt đối: cannot be referenced in any chat, transfers every detail as a rule, overwrite all.\n\nTại sao các phương án khác sai\n“Imported memories are stored separately from regular memories and…”: Sai: nội dung import không bị lưu tách riêng đến mức không dùng được ở chat nào.\n\n“The import transfers every detail as a rule, and…”: Sai: import không đảm bảo chuyển mọi chi tiết, và thiếu sót không phải do Claude cố ý bỏ qua.\n\n“Memory imports overwrite all prior memories on completion, so…”: Sai: import không ghi đè toàn bộ memory cũ."}, {"n": 150, "cat": "T", "topic": 3, "q": "Production monitoring shows that follow-up queries like \"summarize what we learned about market trends\" consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research. What's the most effective way to improve response time for these follow-up summaries?", "o": ["Have the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis.", "Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand.", "Pre-generate and cache summaries at multiple granularities whenever new findings accumulate.", "Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings."], "a": 0, "sk": ["consistently take 40+ seconds", "The coordinator already has these findings in its context"], "note": "Đáp án: {A}. Bẫy: {B} Subagent context nhỏ rồi xin thêm kết quả từ coordinator thì thêm nhiều lượt qua lại, vẫn giữ nguyên chi phí tạo subagent không cần thiết; {C} Tạo sẵn và cache tóm tắt ở nhiều mức chi tiết mỗi khi có kết quả mới là tốn công cho những tóm tắt có thể không bao giờ được hỏi, và không khớp được mọi câu hỏi follow-up; {D} Prompt caching giảm chi phí xử lý phần lặp, nhưng không bỏ được việc tạo subagent và truyền context không cần thiết, là nguyên nhân gốc.", "ex": "Tại sao chọn đáp án đúng (“Have the coordinator handle straightforward summarization requests directly using…”):\n\nTrong hệ thống nhiều agent, tạo subagent có chi phí: khởi tạo, truyền context lớn, xử lý lại. Subagent đáng dùng khi việc phức tạp hoặc cần context riêng biệt. Nếu agent điều phối đã có sẵn thông tin và việc đơn giản (tóm tắt), nó nên tự làm trực tiếp, không chuyển tiếp.\n\nCoordinator đã có đủ kết quả trong context, và tóm tắt là việc đơn giản. Handle straightforward summarization directly using its existing context bỏ hẳn chi phí tạo subagent và truyền 80K token. Subagent được giữ lại cho complex analysis.\n\nMẹo nhớ: Dạng kiến trúc agent: đã có thông tin + việc đơn giản → tự làm, đừng chuyển tiếp. Subagent chỉ dành cho việc phức tạp hoặc cần context riêng.\n\nTại sao các phương án khác sai\n“Spawn the synthesis subagent with reduced context and have…”: Subagent context nhỏ rồi xin thêm kết quả từ coordinator thì thêm nhiều lượt qua lại, vẫn giữ nguyên chi phí tạo subagent không cần thiết.\n\n“Pre-generate and cache summaries at multiple granularities whenever new…”: Tạo sẵn và cache tóm tắt ở nhiều mức chi tiết mỗi khi có kết quả mới là tốn công cho những tóm tắt có thể không bao giờ được hỏi, và không khớp được mọi câu hỏi follow-up.\n\n“Enable prompt caching on the synthesis subagent to reduce…”: Prompt caching giảm chi phí xử lý phần lặp, nhưng không bỏ được việc tạo subagent và truyền context không cần thiết, là nguyên nhân gốc."}, {"n": 151, "cat": "E", "topic": 3, "q": "A customer sends: \"This is frustrating. I've explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.\" The agent has not yet called any tools to investigate their account. What should the agent do?", "o": ["Immediately call escalate_to_human with the conversation history.", "First call get_customer and lookup_order to gather account context, then escalate to a human agent.", "Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating.", "Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request."], "a": 0, "sk": ["I want to talk to a real person NOW"], "note": "Đáp án: {A}. Bẫy: {B} Gọi thêm tool tra cứu trước khi chuyển làm khách phải chờ thêm, trong khi họ đã yêu cầu người thật ngay; {C} Hỏi thêm một câu trước khi chuyển là bắt khách giải thích lần thứ ba, đúng điều khiến họ bực; {D} Thuyết phục khách để agent xử lý tiếp và chỉ chuyển khi khách nhắc lại là phớt lờ yêu cầu đã rất rõ ràng.", "ex": "Tại sao chọn đáp án đúng (“Immediately call escalate_to_human with the conversation history.”):\n\nMột trong các điều kiện kích hoạt chuyển cho con người (escalation) rõ ràng nhất là khi khách hàng yêu cầu thẳng. Tôn trọng yêu cầu đó ngay, kèm lịch sử hội thoại để người tiếp nhận không bắt khách giải thích lại, là cách xử lý đúng. Cố điều tra thêm, hỏi thêm hay thuyết phục khách ở lại với agent đều làm khách bực hơn và đi ngược yêu cầu.\n\nKhách đã yêu cầu rõ ràng được gặp người thật, sau hai lần giải thích không thành. Immediately call escalate_to_human with the conversation history tôn trọng đúng yêu cầu, và lịch sử hội thoại giúp người tiếp nhận nắm vấn đề mà không bắt khách kể lại lần thứ ba.\n\nMẹo nhớ: Dạng escalation: khách yêu cầu người thật rõ ràng → chuyển ngay, kèm lịch sử hội thoại. Không điều tra thêm, không hỏi thêm, không thuyết phục.\n\nTại sao các phương án khác sai\n“First call get_customer and lookup_order to gather account context,…”: Gọi thêm tool tra cứu trước khi chuyển làm khách phải chờ thêm, trong khi họ đã yêu cầu người thật ngay.\n\n“Acknowledge the frustration and ask one targeted question to…”: Hỏi thêm một câu trước khi chuyển là bắt khách giải thích lần thứ ba, đúng điều khiến họ bực.\n\n“Briefly explain what the agent can help with and…”: Thuyết phục khách để agent xử lý tiếp và chỉ chuyển khi khách nhắc lại là phớt lờ yêu cầu đã rất rõ ràng."}, {"n": 152, "cat": "T", "topic": 4, "q": "You are a knowledge worker evaluating which Claude feature matches each proposed use case. Which two feature-to-use-case matches are appropriate? (Select two.) Each correct answer presents a complete solution.", "o": ["Tool use to invoke a calculator for rephrasing a product description in simpler language.", "Long-context summarization for a quarterly report distilled from many sources.", "A calculator tool for complex, multi-step pricing.", "Long-context summarization for drafting a reply to a single short customer email.", "Web search invocation to retrieve the established formula for calculating compound interest."], "a": [1, 2], "sk": ["feature-to-use-case matches are appropriate"], "note": "Đáp án: {B} + {C}. Bẫy: {A} Diễn đạt lại mô tả sản phẩm là việc ngôn ngữ, không có gì để tính; {D} Trả lời một email ngắn không cần tóm tắt ngữ cảnh dài; {E} Công thức lãi kép là kiến thức ổn định, phổ biến.", "ex": "Tại sao chọn đáp án đúng (“Long-context summarization for a quarterly report distilled from many…” / “A calculator tool for complex, multi-step pricing.”):\n\nMỗi tính năng có chỗ dùng đúng: tóm tắt ngữ cảnh dài cho việc chắt lọc nhiều nguồn; công cụ tính toán cho phép tính phức tạp, nhiều bước cần chính xác; web search cho thông tin mới hoặc chưa biết. Dùng công cụ cho việc không cần nó (máy tính để diễn đạt lại, web search cho công thức ai cũng biết) là ghép sai.\n\nBáo cáo quý chắt lọc from many sources cần xử lý lượng lớn văn bản, đúng chỗ dùng long-context summarization.\n\nTính giá complex, multi-step cần độ chính xác, nên dùng calculator tool thay vì để model tự tính.\n\nMẹo nhớ: Dạng ghép tính năng – use case: hỏi use case có thật sự cần tính năng đó không? Nhiều nguồn dài → long-context; phép tính phức tạp → calculator; thông tin mới → web search.\n\nTại sao các phương án khác sai\n“Tool use to invoke a calculator for rephrasing a…”: Diễn đạt lại mô tả sản phẩm là việc ngôn ngữ, không có gì để tính.\n\n“Long-context summarization for drafting a reply to a single…”: Trả lời một email ngắn không cần tóm tắt ngữ cảnh dài.\n\n“Web search invocation to retrieve the established formula for…”: Công thức lãi kép là kiến thức ổn định, phổ biến."}, {"n": 153, "cat": "T", "topic": 2, "q": "A marketing manager is preparing a constrained brainstorming task: produce ten campaign ideas, each tied to a stated audience segment and each fitting one of three defined budget bands. Which prompting approach fits the task?", "o": ["Ask Claude for ten distinct ideas, stating the audience constraints in the prompt and leaving the budget unconstrained so creativity is not limited at the ideation stage.", "Ask Claude for ten distinct ideas with the audience and budget constraints stated in the prompt, and require each idea to name which audience and budget band it addresses.", "Ask Claude for ten distinct ideas without budget constraints, then filter the output afterward to keep only the ideas that fit the three budget bands.", "Ask Claude for thirty ideas with the audience and budget constraints stated in the prompt, then keep the strongest ten so a wider initial pool produces stronger finalists."], "a": 1, "sk": ["constrained brainstorming task"], "note": "Đáp án: {B}. Bẫy: {A} Bỏ ràng buộc ngân sách để không hạn chế sáng tạo thì có thể ra nhiều ý vượt ngân sách, không dùng được; {C} Không ràng buộc ngân sách rồi lọc sau thì có thể còn ít hơn mười ý phù hợp, phải chạy lại; {D} Tạo ba mươi ý rồi chọn mười thêm việc chọn lọc không cần thiết.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Ask Claude for ten distinct ideas,…”; B = “Ask Claude for ten distinct ideas…”; C = “Ask Claude for ten distinct ideas…”; D = “Ask Claude for thirty ideas with…”.\n\nTại sao chọn đáp án đúng (“Ask Claude for ten distinct ideas with the audience…”):\n\nKhi task có ràng buộc rõ, đưa mọi ràng buộc vào prompt để Claude sáng tạo trong khuôn khổ, và yêu cầu output ghi rõ mỗi ý đáp ứng ràng buộc nào để dễ kiểm. Bỏ ràng buộc rồi lọc sau làm phí phần lớn output; tạo dư rồi chọn lọc thêm việc mà không cần thiết.\n\nĐáp án B nêu cả hai ràng buộc (audience and budget constraints stated in the prompt) và require each idea to name which audience and budget band it addresses: mọi ý tưởng đều hợp lệ ngay, và kiểm tra rất nhanh.\n\nMẹo nhớ: Dạng brainstorm có ràng buộc: ràng buộc vào prompt + bắt output tự ghi nhãn ràng buộc đáp ứng. Bẫy: *leave unconstrained so creativity is not limited*, *filter afterward*, *generate more then pick*.\n\nTại sao các phương án khác sai\n“Ask Claude for ten distinct ideas, stating the audience…”: Bỏ ràng buộc ngân sách để không hạn chế sáng tạo thì có thể ra nhiều ý vượt ngân sách, không dùng được.\n\n“Ask Claude for ten distinct ideas without budget constraints,…”: Không ràng buộc ngân sách rồi lọc sau thì có thể còn ít hơn mười ý phù hợp, phải chạy lại.\n\n“Ask Claude for thirty ideas with the audience and…”: Tạo ba mươi ý rồi chọn mười thêm việc chọn lọc không cần thiết."}, {"n": 154, "cat": "T", "topic": 5, "q": "A knowledge worker notices that a Claude output may have repeated a confidential financial figure from an internal source that the user was told to treat as restricted. The output has not yet been shared outside the user. Which immediate action is most appropriate?", "o": ["Continue using the output for the intended internal purpose, since the figure has not left the user's possession and no external disclosure has occurred.", "Stop using the output and start a new chat with a more carefully scoped prompt, since the issue is resolved as long as the original output is not used.", "Edit the output to remove the figure, save the edited version for the intended use, and document the change in a personal log without involving the governance channel.", "Stop using the output, document the issue, including the prompt and the source, and report it through the documented governance or incident channel."], "a": 3, "sk": ["confidential financial figure", "treat as restricted"], "note": "Đáp án: {D}. Bẫy: {A} Tiếp tục dùng vì chưa lộ ra ngoài là bỏ qua việc dữ liệu hạn chế đã đi vào nơi không nên tới, và có thể lộ tiếp khi output được dùng; {B} Bỏ output và làm lại không giải quyết được nguyên nhân, và tổ chức không biết có sự cố; {C} Tự sửa rồi ghi vào sổ cá nhân mà không báo kênh governance là che sự cố: tổ chức không thể đánh giá và ngăn nó lặp lại.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Continue using the output for the…”; B = “Stop using the output and start…”; C = “Edit the output to remove the…”; D = “Stop using the output, document the…”.\n\nTại sao chọn đáp án đúng (“Stop using the output, document the issue, including the…”):\n\nKhi nghi có sự cố dữ liệu (dữ liệu hạn chế xuất hiện ở chỗ không nên), cần: dừng dùng output, ghi lại đầy đủ (prompt, nguồn), và báo qua kênh governance hoặc sự cố chính thức. Kể cả khi chưa lộ ra ngoài, sự cố cần được ghi nhận để tổ chức đánh giá nguyên nhân (vì sao dữ liệu hạn chế tới được output) và ngăn tái diễn.\n\nĐáp án D làm đủ ba việc: stop using the output, document the issue kèm prompt và nguồn, và report it through the documented governance or incident channel. Tổ chức biết sự cố và xử lý được tận gốc.\n\nMẹo nhớ: Dạng sự cố dữ liệu: Stop → Document → Report (qua kênh chính thức). Bẫy: dùng tiếp vì chưa lộ (A), làm lại im lặng (B), tự sửa không báo (C).\n\nTại sao các phương án khác sai\n“Continue using the output for the intended internal purpose,…”: Tiếp tục dùng vì chưa lộ ra ngoài là bỏ qua việc dữ liệu hạn chế đã đi vào nơi không nên tới, và có thể lộ tiếp khi output được dùng.\n\n“Stop using the output and start a new chat…”: Bỏ output và làm lại không giải quyết được nguyên nhân, và tổ chức không biết có sự cố.\n\n“Edit the output to remove the figure, save the…”: Tự sửa rồi ghi vào sổ cá nhân mà không báo kênh governance là che sự cố: tổ chức không thể đánh giá và ngăn nó lặp lại."}, {"n": 155, "cat": "T", "topic": 3, "q": "A procurement manager is evaluating a Claude-generated vendor proposal summary against the original RFP. The RFP lists twelve numbered requirements across pricing, security, and service levels. How should the summary be checked for completeness?", "o": ["Map each numbered requirement in the RFP to a section of the summary and confirm that every requirement is represented.", "Spot-check three random requirements from the RFP against the summary, since random sampling is the standard completeness check for summaries.", "Read the summary end to end and confirm that it forms a coherent response to the RFP, since coherent summaries typically reflect coverage of the source.", "Compare the section headings in the summary with the section headings in the RFP, since matching headings indicate matching content."], "a": 0, "sk": ["twelve numbered requirements", "checked for completeness"], "note": "Đáp án: {A}. Bẫy: {B} Kiểm ngẫu nhiên ba yêu cầu chỉ phủ một phần tư danh sách, và lấy mẫu không phải chuẩn để kiểm độ đầy đủ; {C} Đọc thấy mạch lạc không có nghĩa là đủ; {D} Tiêu đề khớp không có nghĩa là nội dung khớp.", "ex": "Tại sao chọn đáp án đúng (“Map each numbered requirement in the RFP to a…”):\n\nKiểm tra độ đầy đủ (completeness) với danh sách yêu cầu rõ ràng thì làm có hệ thống: ghép từng yêu cầu với phần tương ứng trong output và xác nhận không thiếu cái nào. Lấy mẫu ngẫu nhiên, đọc thấy mạch lạc hay so tiêu đề đều có thể bỏ sót yêu cầu.\n\nRFP có danh sách đánh số rõ ràng, nên cách chắc chắn nhất là map each numbered requirement vào phần tương ứng của bản tóm tắt và xác nhận every requirement is represented. Mười hai yêu cầu đều được kiểm, không bỏ sót.\n\nMẹo nhớ: Dạng kiểm completeness: có danh sách đánh số → map từng mục. Loại sampling, coherence, matching headings vì đều là kiểm gián tiếp.\n\nTại sao các phương án khác sai\n“Spot-check three random requirements from the RFP against the…”: Kiểm ngẫu nhiên ba yêu cầu chỉ phủ một phần tư danh sách, và lấy mẫu không phải chuẩn để kiểm độ đầy đủ.\n\n“Read the summary end to end and confirm that…”: Đọc thấy mạch lạc không có nghĩa là đủ.\n\n“Compare the section headings in the summary with the…”: Tiêu đề khớp không có nghĩa là nội dung khớp."}, {"n": 156, "cat": "T", "topic": 4, "q": "You are a product manager asking Claude to produce an interactive prototype of a small landing-page mockup that the team will iterate on and share. Which Claude feature is best suited to this output?", "o": ["A new Project containing only the team's prior meeting notes.", "An Artifact, which presents standalone editable content in a dedicated side panel for iteration.", "A short conversational reply embedded inline in the chat history.", "A Research run that produces a multipage external survey of competitor sites."], "a": 1, "sk": ["interactive prototype", "iterate on and share"], "note": "Đáp án: {B}. Bẫy: {A} Project chỉ chứa biên bản họp không tạo ra prototype nào; {C} Câu trả lời ngắn trong chat không phải nơi để dựng và lặp một prototype tương tác; {D} Research khảo sát trang của đối thủ là thu thập thông tin, không phải dựng prototype.", "ex": "Tại sao chọn đáp án đúng (“An Artifact, which presents standalone editable content in a…”):\n\nArtifact hiển thị nội dung độc lập, chỉnh sửa được, trong panel riêng: hợp cho prototype tương tác, có thể chỉnh lặp lại và chia sẻ. Project là workspace tài liệu; câu trả lời trong chat không hợp cho nội dung tương tác cần lặp; Research là thu thập thông tin.\n\nArtifact presents standalone editable content in a dedicated side panel for iteration: đúng với prototype tương tác cần chỉnh nhiều vòng và chia sẻ cho nhóm.\n\nMẹo nhớ: Dạng chọn tính năng: interactive / prototype / mockup / iterate / share → Artifact (giống câu 77).\n\nTại sao các phương án khác sai\n“A new Project containing only the team's prior meeting…”: Project chỉ chứa biên bản họp không tạo ra prototype nào.\n\n“A short conversational reply embedded inline in the chat…”: Câu trả lời ngắn trong chat không phải nơi để dựng và lặp một prototype tương tác.\n\n“A Research run that produces a multipage external survey…”: Research khảo sát trang của đối thủ là thu thập thông tin, không phải dựng prototype."}, {"n": 157, "cat": "E", "topic": 4, "q": "You are an operations lead choosing actions when a Claude conversation has degraded in quality. Which recovery action should be tried first when conversation quality degrades?", "o": ["Replace the model with a different vendor's model immediately.", "Discard the entire conversation and rebuild the work from the original prompt.", "Summarize the current state and continue with a focused follow-up prompt.", "Escalate to a senior architect for a manual review of the conversation history."], "a": 2, "sk": ["tried first when conversation quality degrades", "tried first"], "note": "Đáp án: {C}. Bẫy: {A} Đổi sang model của nhà cung cấp khác ngay lập tức là phản ứng quá mạnh, chưa thử cách đơn giản nào; {B} Bỏ cả cuộc trò chuyện và làm lại từ prompt gốc là mất toàn bộ tiến độ; {D} Nhờ kiến trúc sư cấp cao review thủ công lịch sử hội thoại là quá mức cho một vấn đề thường xử lý được bằng tóm tắt.", "ex": "Tại sao chọn đáp án đúng (“Summarize the current state and continue with a focused…”):\n\nKhi hội thoại xuống chất lượng (thường do dài và lẫn nhiều nội dung), cách phục hồi nhẹ nhất là tóm tắt trạng thái hiện tại rồi tiếp tục với prompt tập trung. Cách này giữ tiến độ, chi phí thấp. Bỏ hết làm lại, đổi nhà cung cấp hay escalate là các bước nặng hơn, chỉ dùng khi cách nhẹ không hiệu quả.\n\nSummarize the current state và continue with a focused follow-up prompt là cách ít xáo trộn nhất mà nhắm đúng nguyên nhân phổ biến (context lộn xộn), đồng thời giữ được những gì đã làm.\n\nMẹo nhớ: Dạng thử gì trước: ít xáo trộn nhất, giữ tiến độ: Summarize + Focused follow-up. Thang leo: Tóm tắt → Chat mới với tóm tắt → Đổi cách tiếp cận → Escalate.\n\nTại sao các phương án khác sai\n“Replace the model with a different vendor's model immediately.”: Đổi sang model của nhà cung cấp khác ngay lập tức là phản ứng quá mạnh, chưa thử cách đơn giản nào.\n\n“Discard the entire conversation and rebuild the work from…”: Bỏ cả cuộc trò chuyện và làm lại từ prompt gốc là mất toàn bộ tiến độ.\n\n“Escalate to a senior architect for a manual review…”: Nhờ kiến trúc sư cấp cao review thủ công lịch sử hội thoại là quá mức cho một vấn đề thường xử lý được bằng tóm tắt."}, {"n": 158, "cat": "E", "topic": 4, "q": "A knowledge worker is explaining context-window basics to a teammate. Which statement most accurately describes a context window?", "o": ["A bounded amount of text the model can consider at once, including the conversation history, attached documents, and the current input.", "An adjustable setting that determines how much of the conversation history the model includes in each response, configurable per chat.", "The complete conversation history retained across sessions, which the model can reference whenever it produces a response in any chat.", "The subset of the conversation that the model determines is most relevant to the current input, which can be smaller than the full conversation."], "a": 0, "sk": ["most accurately describes a context window", "context window"], "note": "Đáp án: {A}. Bẫy: {B} Sai: context window không phải thiết lập điều chỉnh theo từng chat; {C} Sai: đây là mô tả gần với Memory; {D} Sai: context window không phải phần model tự chọn là liên quan; nó là toàn bộ nội dung model xem xét, trong giới hạn.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “A bounded amount of text the…”; B = “An adjustable setting that determines how…”; C = “The complete conversation history retained across…”; D = “The subset of the conversation that…”.\n\nTại sao chọn đáp án đúng (“A bounded amount of text the model can consider…”):\n\nContext window là lượng văn bản có giới hạn mà model xem xét cùng một lúc khi tạo câu trả lời, gồm lịch sử hội thoại, tài liệu đính kèm và input hiện tại. Nó không phải thiết lập người dùng chỉnh được, không phải bộ nhớ qua các phiên (đó là Memory), và không phải phần model tự chọn lọc.\n\nĐáp án A đúng định nghĩa: bounded amount of text model xem xét at once, bao gồm conversation history, attached documents, and the current input.\n\nMẹo nhớ: Dạng định nghĩa context window: Bounded + At once + History + Attachments + Input. Phân biệt: Context window = trong một lần trả lời · Memory = qua các phiên.\n\nTại sao các phương án khác sai\n“An adjustable setting that determines how much of the…”: Sai: context window không phải thiết lập điều chỉnh theo từng chat.\n\n“The complete conversation history retained across sessions, which the…”: Sai: đây là mô tả gần với Memory.\n\n“The subset of the conversation that the model determines…”: Sai: context window không phải phần model tự chọn là liên quan; nó là toàn bộ nội dung model xem xét, trong giới hạn."}, {"n": 159, "cat": "T", "topic": 2, "q": "A product manager is using Claude to ideate options for a new self-service portal. The team needs breadth before narrowing and will evaluate trade-offs across the options in a separate session. Which prompting strategy fits this stage?", "o": ["Request multiple distinct options and ask Claude to recommend the strongest one with reasoning, so the team starts the trade-off discussion from a leading candidate.", "Request multiple distinct options with stated trade-offs, and avoid committing to a single recommendation in this round.", "Request multiple distinct options ordered by Claude's assessment of feasibility, so the team can focus its trade-off discussion on the most feasible options first.", "Request a single recommended option with strong reasoning, since well-reasoned single options give the team a clearer starting point than several weakly reasoned alternatives."], "a": 1, "sk": ["needs breadth before narrowing", "evaluate trade-offs across the options in a separate session"], "note": "Đáp án: {B}. Bẫy: {A} Yêu cầu Claude chọn phương án mạnh nhất tạo mỏ neo, nhóm dễ bị dẫn dắt trước buổi đánh giá; {C} Xếp thứ tự theo đánh giá khả thi của Claude cũng là thu hẹp sớm, đẩy nhóm vào vài phương án đầu; {D} Chỉ một phương án là bỏ hẳn độ rộng mà giai đoạn này cần.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Request multiple distinct options and ask…”; B = “Request multiple distinct options with stated…”; C = “Request multiple distinct options ordered by…”; D = “Request a single recommended option with…”.\n\nTại sao chọn đáp án đúng (“Request multiple distinct options with stated trade-offs, and avoid…”):\n\nGiai đoạn mở rộng (divergent) cần nhiều phương án khác nhau và thông tin để so sánh, nhưng chưa chốt. Khuyến nghị hay xếp hạng quá sớm tạo hiệu ứng mỏ neo (anchoring): nhóm bị kéo về phương án được gợi ý trước khi tự đánh giá.\n\nĐáp án B cho đúng thứ nhóm cần: multiple distinct options with stated trade-offs để có độ rộng và dữ liệu so sánh, và avoid committing to a single recommendation để việc thu hẹp diễn ra ở buổi đánh giá riêng như kế hoạch.\n\nMẹo nhớ: Dạng mở rộng vs thu hẹp: đề nói breadth before narrowing + evaluate later → chọn nhiều phương án + đánh đổi, không khuyến nghị. Bẫy: mọi đáp án recommend / ordered / single đều thu hẹp sớm.\n\nTại sao các phương án khác sai\n“Request multiple distinct options and ask Claude to recommend…”: Yêu cầu Claude chọn phương án mạnh nhất tạo mỏ neo, nhóm dễ bị dẫn dắt trước buổi đánh giá.\n\n“Request multiple distinct options ordered by Claude's assessment of…”: Xếp thứ tự theo đánh giá khả thi của Claude cũng là thu hẹp sớm, đẩy nhóm vào vài phương án đầu.\n\n“Request a single recommended option with strong reasoning, since…”: Chỉ một phương án là bỏ hẳn độ rộng mà giai đoạn này cần."}, {"n": 160, "cat": "T", "topic": 2, "q": "A prompt describes a multi-step setup process, such as configuring an environment and then running a script, but Claude sometimes performs the steps out of order. What change would make the required order unambiguous?", "o": ["Combine all of the steps into a single long sentence separated only by commas", "Remove the step numbers and rely only on paragraph breaks to imply the correct order", "Provide the instructions as a numbered list of steps in the exact order they must run", "Describe the steps in a random order and let Claude infer the correct sequence"], "a": 2, "sk": ["performs the steps out of order"], "note": "Đáp án: {C}. Bẫy: {A} Gộp mọi bước vào một câu dài nối bằng dấu phẩy làm ranh giới và thứ tự các bước càng mờ; {B} Bỏ số thứ tự, chỉ dựa vào ngắt đoạn là làm thứ tự kém rõ hơn; {D} Mô tả theo thứ tự ngẫu nhiên rồi bắt Claude tự suy ra thứ tự là tạo thêm lỗi.", "ex": "Tại sao chọn đáp án đúng (“Provide the instructions as a numbered list of steps…”):\n\nKhi thứ tự quan trọng, viết các bước thành danh sách đánh số theo đúng thứ tự phải chạy. Đánh số tách bạch từng bước và chỉ rõ trình tự, rõ hơn nhiều so với văn xuôi hay câu dài nối bằng dấu phẩy.\n\nNumbered list of steps in the exact order they must run biến thứ tự từ ngầm định thành tường minh: bước 1 trước bước 2, không còn gì để suy diễn.\n\nMẹo nhớ: Dạng thứ tự bước: thứ tự quan trọng → danh sách đánh số đúng thứ tự. Ba đáp án sai đều làm thứ tự mờ hơn (gộp câu, bỏ số, xáo trộn).\n\nTại sao các phương án khác sai\n“Combine all of the steps into a single long…”: Gộp mọi bước vào một câu dài nối bằng dấu phẩy làm ranh giới và thứ tự các bước càng mờ.\n\n“Remove the step numbers and rely only on paragraph…”: Bỏ số thứ tự, chỉ dựa vào ngắt đoạn là làm thứ tự kém rõ hơn.\n\n“Describe the steps in a random order and let…”: Mô tả theo thứ tự ngẫu nhiên rồi bắt Claude tự suy ra thứ tự là tạo thêm lỗi."}, {"n": 161, "cat": "T", "topic": 2, "q": "A marketing manager needs to draft a persuasive email campaign to launch a new product. The email should capture attention, highlight benefits, and include a call to action. Which prompting approach is best?", "o": ["Instruct Claude to write a thorough product description report covering all features, specifications, technical details, and pricing info, formatted as a formal document that is suitable for internal stakeholders rather than a marketing audience.", "Ask Claude to produce several email drafts with distinct tones (formal, casual, urgent), then assess each draft's persuasiveness, clarity, and brand alignment, and choose the best one for final edits, and then iterate if needed.", "Guide Claude to create a marketing email: first, write an attention-grabbing subject line; then, open with a hook; next, present three key benefits with persuasive language; and finally, include a clear call to action linked to the product page.", "Prompt Claude to draft an email announcing the new product, leaving the structure and content entirely to the model's discretion without providing any specific guidelines on audience, tone, or key product benefits to highlight."], "a": 2, "sk": ["capture attention, highlight benefits, and include a call to action"], "note": "Đáp án: {C}. Bẫy: {A} Báo cáo mô tả sản phẩm trang trọng cho stakeholder nội bộ là sai đối tượng và sai mục đích: không phải email marketing; {B} Tạo nhiều bản nháp theo giọng khác nhau rồi tự đánh giá có ích ở giai đoạn sau, nhưng không đảm bảo bản nào có đủ hook, lợi ích và CTA; {D} Để hoàn toàn cho model tự quyết, không nêu đối tượng, giọng văn hay lợi ích chính, là prompt mơ hồ.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Instruct Claude to write a thorough…”; B = “Ask Claude to produce several email…”; C = “Guide Claude to create a marketing…”; D = “Prompt Claude to draft an email…”.\n\nTại sao chọn đáp án đúng (“Guide Claude to create a marketing email: first, write…”):\n\nKhi output có cấu trúc đã biết (email marketing: subject line, hook, lợi ích, CTA), prompt hiệu quả dẫn dắt từng phần theo thứ tự, nêu rõ yêu cầu của mỗi phần. Cách này ánh xạ trực tiếp yêu cầu của đề vào output, thay vì để model tự đoán.\n\nĐáp án C dẫn dắt đúng ba yêu cầu: attention-grabbing subject line và hook (thu hút chú ý), three key benefits with persuasive language (nêu lợi ích), clear call to action (CTA). Mỗi yêu cầu có một phần tương ứng trong prompt.\n\nMẹo nhớ: Dạng output có cấu trúc đã biết: ánh xạ từng yêu cầu trong đề → từng phần trong prompt. Đề có ba yêu cầu (attention, benefits, CTA) → đáp án dẫn dắt đủ ba phần.\n\nTại sao các phương án khác sai\n“Instruct Claude to write a thorough product description report…”: Báo cáo mô tả sản phẩm trang trọng cho stakeholder nội bộ là sai đối tượng và sai mục đích: không phải email marketing.\n\n“Ask Claude to produce several email drafts with distinct…”: Tạo nhiều bản nháp theo giọng khác nhau rồi tự đánh giá có ích ở giai đoạn sau, nhưng không đảm bảo bản nào có đủ hook, lợi ích và CTA.\n\n“Prompt Claude to draft an email announcing the new…”: Để hoàn toàn cho model tự quyết, không nêu đối tượng, giọng văn hay lợi ích chính, là prompt mơ hồ."}, {"n": 162, "cat": "T", "topic": 2, "q": "A business analyst is deciding whether to send one large request or break it into stages. Which two features of a request are the strongest signals that it should be decomposed? Select two.", "o": ["Later parts are only worth producing if the earlier factual work is correct.", "It concerns a subject area the analyst has not personally worked in for several years.", "It runs to a long prompt because a good deal of background has been pasted in with it.", "It asks for the final answer to be presented as a table rather than as flowing paragraphs.", "It bundles several distinct deliverables that are meant for different audiences and uses."], "a": [0, 4], "sk": ["strongest signals that it should be decomposed"], "note": "Đáp án: {A} + {E}. Bẫy: {B} Analyst lâu không làm mảng đó là chuyện kinh nghiệm của người dùng, không phải đặc điểm của task cho thấy cần chia; {C} Prompt dài vì dán nhiều bối cảnh không có nghĩa là task gồm nhiều phần; {D} Trình bày dạng bảng là yêu cầu định dạng, làm được trong một request.", "ex": "Tại sao chọn đáp án đúng (“Later parts are only worth producing if the earlier…” / “It bundles several distinct deliverables that are meant for…”):\n\nNên chia task khi: các phần phụ thuộc nhau (phần sau chỉ có giá trị khi phần trước đúng, nên cần kiểm phần trước trước khi làm tiếp), hoặc yêu cầu gộp nhiều sản phẩm khác nhau cho các đối tượng và mục đích khác nhau. Độ dài prompt, độ lạ của chủ đề với người hỏi hay định dạng bảng không phải lý do để chia.\n\nPhần sau only worth producing if the earlier factual work is correct: chia giai đoạn để kiểm phần dữ kiện trước, tránh xây cả khối nội dung trên nền sai.\n\nYêu cầu bundles several distinct deliverables cho different audiences and uses: mỗi sản phẩm cần giọng văn, định dạng, tiêu chí riêng, nên tách ra sẽ tốt hơn.\n\nMẹo nhớ: Dạng khi nào chia task (giống câu 127): phụ thuộc (phần sau cần phần trước đúng) hoặc nhiều sản phẩm cho nhiều đối tượng. Loại các đặc điểm bề ngoài: prompt dài, chủ đề lạ với người dùng, định dạng bảng.\n\nTại sao các phương án khác sai\n“It concerns a subject area the analyst has not…”: Analyst lâu không làm mảng đó là chuyện kinh nghiệm của người dùng, không phải đặc điểm của task cho thấy cần chia.\n\n“It runs to a long prompt because a good…”: Prompt dài vì dán nhiều bối cảnh không có nghĩa là task gồm nhiều phần.\n\n“It asks for the final answer to be presented…”: Trình bày dạng bảng là yêu cầu định dạng, làm được trong một request."}, {"n": 163, "cat": "T", "topic": 3, "q": "A support lead finds a Claude-drafted troubleshooting article accurate but written at a reading level too advanced for the average customer. Which follow-up instruction best refines the draft without sacrificing accuracy?", "o": ["Convert the article into a formal specification format used by the engineering team", "Remove the least common troubleshooting steps so the article reads a bit shorter", "Add more technical detail so customers understand the underlying cause in full", "Rewrite the article with shorter sentences and everyday words, keeping every step accurate"], "a": 3, "sk": ["accurate but written at a reading level too advanced", "reading level too advanced"], "note": "Đáp án: {D}. Bẫy: {A} Chuyển sang định dạng đặc tả kỹ thuật của đội engineering làm bài càng khó đọc với khách hàng; {B} Bỏ các bước ít gặp làm bài ngắn hơn nhưng mất độ đầy đủ, và không xử lý độ khó của câu chữ; {C} Thêm chi tiết kỹ thuật làm bài càng khó hơn với khách hàng bình thường.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Convert the article into a formal…”; B = “Remove the least common troubleshooting steps…”; C = “Add more technical detail so customers…”; D = “Rewrite the article with shorter sentences…”.\n\nTại sao chọn đáp án đúng (“Rewrite the article with shorter sentences and everyday words,…”):\n\nTinh chỉnh output theo đối tượng nên nhắm đúng vấn đề (độ khó đọc) và giữ nguyên phần đã đúng (độ chính xác, đủ các bước). Với trình độ đọc: câu ngắn hơn, từ ngữ thông dụng hơn. Cắt bớt bước hay thêm chi tiết kỹ thuật đều làm hỏng phần đang đúng hoặc làm vấn đề tệ hơn.\n\nĐáp án D sửa đúng vấn đề (shorter sentences and everyday words) và keeping every step accurate, giữ nguyên phần đang đúng. Bài dễ đọc hơn mà không mất bước nào.\n\nMẹo nhớ: Dạng tinh chỉnh theo đối tượng: sửa đúng vấn đề + giữ phần đã đúng. Vấn đề là *reading level* → câu ngắn, từ thông dụng, kèm keeping every step accurate.\n\nTại sao các phương án khác sai\n“Convert the article into a formal specification format used…”: Chuyển sang định dạng đặc tả kỹ thuật của đội engineering làm bài càng khó đọc với khách hàng.\n\n“Remove the least common troubleshooting steps so the article…”: Bỏ các bước ít gặp làm bài ngắn hơn nhưng mất độ đầy đủ, và không xử lý độ khó của câu chữ.\n\n“Add more technical detail so customers understand the underlying…”: Thêm chi tiết kỹ thuật làm bài càng khó hơn với khách hàng bình thường."}, {"n": 164, "cat": "T", "topic": 3, "q": "A retention lead asked why cancellations rose sharply in the last quarter. The answer explains at length what cancellation rates are and how they are generally measured. How should she judge this output?", "o": ["As accurate but off target, because it explains the topic instead of addressing the rise she asked about.", "As evidence that the question cannot be answered, since the reply avoided the specific rise she was asking about.", "As a sound answer that simply needs shortening, since the explanation contains more detail than she required here.", "As adequate for now, because background on how the measure works is a reasonable place to begin the analysis."], "a": 0, "sk": ["why cancellations rose sharply in the last quarter", "why cancellations rose sharply"], "note": "Đáp án: {A}. Bẫy: {B} Câu trả lời lạc đề không chứng minh câu hỏi không trả lời được; {C} Vấn đề không phải độ dài; {D} Kiến thức nền về cách đo không trả lời câu hỏi vì sao tăng.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “As accurate but off target, because…”; B = “As evidence that the question cannot…”; C = “As a sound answer that simply…”; D = “As adequate for now, because background…”.\n\nTại sao chọn đáp án đúng (“As accurate but off target, because it explains the…”):\n\nĐánh giá output theo nhiều tiêu chí riêng: accuracy (đúng không) và relevance (có trả lời đúng câu hỏi không). Một câu trả lời có thể đúng về nội dung nhưng lạc mục tiêu: giải thích chủ đề chung thay vì phân tích điều được hỏi. Gọi đúng tên vấn đề giúp sửa đúng: prompt lại để tập trung vào nguyên nhân của mức tăng.\n\nĐáp án A đánh giá chính xác: nội dung accurate nhưng off target, vì giải thích chủ đề chung instead of addressing the rise she asked about.\n\nMẹo nhớ: Dạng accurate vs relevant: tách hai tiêu chí: đúng chưa chắc trúng. Hỏi *why X rose* mà trả lời *what X is* → accurate but off target.\n\nTại sao các phương án khác sai\n“As evidence that the question cannot be answered, since…”: Câu trả lời lạc đề không chứng minh câu hỏi không trả lời được.\n\n“As a sound answer that simply needs shortening, since…”: Vấn đề không phải độ dài.\n\n“As adequate for now, because background on how the…”: Kiến thức nền về cách đo không trả lời câu hỏi vì sao tăng."}, {"n": 165, "cat": "E", "topic": 3, "q": "A Claude draft attributes a sentence to a named industry report as a direct quotation. What is the appropriate validation step?", "o": ["Search for the sentence's key phrase and accept it if similar wording appears anywhere.", "Confirm that the report exists and was published, which establishes the quotation's origin.", "Ask Claude for the page number, and accept the quotation once a number has been supplied to her.", "Open the report and find that exact sentence, since a close paraphrase may not appear in it."], "a": 3, "sk": ["as a direct quotation"], "note": "Đáp án: {D}. Bẫy: {A} Thấy cụm từ tương tự ở đâu đó không xác nhận câu trích nằm trong báo cáo được nêu, càng không xác nhận đúng từng chữ; {B} Báo cáo có tồn tại không có nghĩa là câu trích có trong đó; {C} Số trang do Claude đưa ra cũng có thể là bịa.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Search for the sentence's key phrase…”; B = “Confirm that the report exists and…”; C = “Ask Claude for the page number,…”; D = “Open the report and find that…”.\n\nTại sao chọn đáp án đúng (“Open the report and find that exact sentence, since…”):\n\nLời trích nguyên văn là loại nội dung dễ bị bịa nhất: model có thể tạo câu nghe rất giống văn phong của nguồn, hoặc diễn đạt lại rồi đặt trong ngoặc kép. Kiểm chứng đúng là mở nguồn và tìm đúng câu đó. Báo cáo có tồn tại, có cụm từ giống ở đâu đó, hay có số trang do Claude đưa ra đều không chứng minh câu trích là thật.\n\nĐáp án D open the report and find that exact sentence. Trích dẫn nguyên văn phải khớp từng chữ, và một câu diễn đạt gần giống có thể không hề có trong báo cáo.\n\nMẹo nhớ: Dạng kiểm trích dẫn: trích nguyên văn → mở nguồn, tìm đúng câu. Không chấp nhận các bằng chứng gián tiếp: *similar wording*, *report exists*, *page number from Claude*.\n\nTại sao các phương án khác sai\n“Search for the sentence's key phrase and accept it…”: Thấy cụm từ tương tự ở đâu đó không xác nhận câu trích nằm trong báo cáo được nêu, càng không xác nhận đúng từng chữ.\n\n“Confirm that the report exists and was published, which…”: Báo cáo có tồn tại không có nghĩa là câu trích có trong đó.\n\n“Ask Claude for the page number, and accept the…”: Số trang do Claude đưa ra cũng có thể là bịa."}, {"n": 166, "cat": "E", "topic": 2, "q": "A manager needs a comparison of six suppliers across five criteria. The information is currently spread across several separate Claude answers. What should she do first?", "o": ["Ask Claude to combine all of the earlier answers into one long document she can read through.", "Ask Claude to rank the six suppliers straight away and work backwards from the ranking it gives.", "Agree which suppliers and which criteria belong in the comparison before asking for any output.", "Choose the output format now, so that every further answer can be produced in that same shape."], "a": 2, "sk": ["six suppliers across five criteria", "spread across several separate Claude answers"], "note": "Đáp án: {C}. Bẫy: {A} Gộp mọi câu trả lời cũ thành một tài liệu dài chỉ dồn thông tin lại, không tạo được bảng so sánh có cấu trúc; {B} Xếp hạng ngay rồi suy ngược lại là đảo ngược quy trình: chưa có tiêu chí và dữ liệu thống nhất thì xếp hạng dựa trên gì; {D} Chọn định dạng là việc nên làm, nhưng sau khi đã chốt phạm vi: chưa biết so sánh những gì thì định dạng chưa có nội dung để định hình.", "ex": "Tại sao chọn đáp án đúng (“Agree which suppliers and which criteria belong in the…”):\n\nTrước khi yêu cầu output tổng hợp, cần chốt phạm vi: những đối tượng nào và tiêu chí nào nằm trong so sánh. Có phạm vi rồi mới chọn định dạng, gom thông tin và xếp hạng. Gộp tất cả hay xếp hạng ngay khi chưa thống nhất phạm vi dễ cho ra kết quả lẫn lộn hoặc thiếu sót.\n\nAgree which suppliers and which criteria belong in the comparison là bước đặt khung: xác định chính xác bảng so sánh gồm những hàng và cột nào. Mọi output sau đó đều bám theo khung này.\n\nMẹo nhớ: Dạng FIRST: chốt phạm vi (đối tượng + tiêu chí) trước, rồi mới định dạng → gom dữ liệu → xếp hạng. Giống câu 132: tiêu chí đi trước mọi thứ.\n\nTại sao các phương án khác sai\n“Ask Claude to combine all of the earlier answers…”: Gộp mọi câu trả lời cũ thành một tài liệu dài chỉ dồn thông tin lại, không tạo được bảng so sánh có cấu trúc.\n\n“Ask Claude to rank the six suppliers straight away…”: Xếp hạng ngay rồi suy ngược lại là đảo ngược quy trình: chưa có tiêu chí và dữ liệu thống nhất thì xếp hạng dựa trên gì.\n\n“Choose the output format now, so that every further…”: Chọn định dạng là việc nên làm, nhưng sau khi đã chốt phạm vi: chưa biết so sánh những gì thì định dạng chưa có nội dung để định hình."}, {"n": 167, "cat": "T", "topic": 3, "q": "A communications officer must publish a Claude-drafted market briefing on the company blog within the hour. Claude used web search to produce it, and every figure in the draft carries a citation. What is the appropriate first step before she publishes?", "o": ["Regenerate the briefing in a fresh conversation, and publish if the two drafts report the same figures.", "Open the cited sources and confirm that each figure in the draft does appear in the page it points to.", "Add a line at the foot of the briefing noting that it was prepared with the help of an AI assistant.", "Ask Claude how confident it is in each figure, and revise the ones it rates as least confident."], "a": 1, "sk": ["every figure in the draft carries a citation", "first step before she publishes"], "note": "Đáp án: {B}. Bẫy: {A} Tạo lại briefing trong chat mới và so hai bản chỉ kiểm tính nhất quán, không kiểm độ chính xác; {C} Ghi chú có AI hỗ trợ là minh bạch tốt, nhưng không phải bước kiểm chứng và không làm con số sai thành đúng; {D} Hỏi Claude tự đánh giá độ tin cậy không phải kiểm chứng.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Regenerate the briefing in a fresh…”; B = “Open the cited sources and confirm…”; C = “Add a line at the foot…”; D = “Ask Claude how confident it is…”.\n\nTại sao chọn đáp án đúng (“Open the cited sources and confirm that each figure…”):\n\nCó trích dẫn không có nghĩa là đúng: con số có thể bị chép sai, lấy sai ngữ cảnh, hoặc trích dẫn trỏ tới trang không chứa con số đó. Với nội dung công khai, bước kiểm chứng cơ bản là mở nguồn được trích và xác nhận từng con số có thật trong trang đó. Áp lực thời gian không thay đổi yêu cầu này.\n\nĐáp án B open the cited sources và confirm that each figure có trong trang được trích. Đây là kiểm chứng trực tiếp, và trích dẫn đã có sẵn nên làm nhanh được.\n\nMẹo nhớ: Dạng citation ≠ verified: có trích dẫn → mở nguồn, đối chiếu từng con số. Bẫy: regenerate và so (nhất quán ≠ đúng), hỏi Claude tự tin không, chỉ ghi chú AI.\n\nTại sao các phương án khác sai\n“Regenerate the briefing in a fresh conversation, and publish…”: Tạo lại briefing trong chat mới và so hai bản chỉ kiểm tính nhất quán, không kiểm độ chính xác.\n\n“Add a line at the foot of the briefing…”: Ghi chú có AI hỗ trợ là minh bạch tốt, nhưng không phải bước kiểm chứng và không làm con số sai thành đúng.\n\n“Ask Claude how confident it is in each figure,…”: Hỏi Claude tự đánh giá độ tin cậy không phải kiểm chứng."}, {"n": 168, "cat": "T", "topic": 3, "q": "A communications assistant receives an answer containing a clearly incorrect statement about her organisation. She corrects her own draft in a follow-up message, and also wants the problem itself recorded rather than just worked around. What should she do?", "o": ["Rephrase her original prompt in more forceful language so that the incorrect statement is less likely to recur next time.", "Use the thumbs-down control on the response that contained the incorrect statement, in addition to fixing her own draft.", "Start the same task again in a new conversation, on the basis that a clean chat is less likely to repeat the mistake.", "Add a line to the conversation noting that the earlier statement was wrong, so the correction sits in the chat history."], "a": 1, "sk": ["wants the problem itself recorded rather than just worked around", "recorded rather than just worked around"], "note": "Đáp án: {B}. Bẫy: {A} Viết lại prompt mạnh tay hơn chỉ là né lỗi lần sau, không ghi nhận lỗi ở đâu cả; {C} Làm lại trong chat mới cũng là né lỗi, không ghi nhận; {D} Ghi chú trong chat chỉ nằm trong lịch sử cuộc trò chuyện của chính cô, không phải kênh phản hồi.", "ex": "Tại sao chọn đáp án đúng (“Use the thumbs-down control on the response that contained…”):\n\nSửa output là xử lý trường hợp của mình. Để lỗi được ghi nhận với Anthropic (phục vụ cải thiện model), dùng nút thumbs-down trên câu trả lời có lỗi, có thể kèm mô tả. Viết lại prompt, mở chat mới hay ghi chú trong chat chỉ là né lỗi trong phiên của mình, không ai khác biết tới.\n\nThumbs-down control trên đúng câu trả lời sai là kênh phản hồi chính thức, ghi nhận lỗi với Anthropic. Kết hợp in addition to fixing her own draft, cô vừa xử lý việc của mình vừa ghi nhận lỗi.\n\nMẹo nhớ: Dạng ghi nhận lỗi: recorded → thumbs-down (kênh phản hồi chính thức). Worked around = viết lại prompt, mở chat mới, ghi chú trong chat.\n\nTại sao các phương án khác sai\n“Rephrase her original prompt in more forceful language so…”: Viết lại prompt mạnh tay hơn chỉ là né lỗi lần sau, không ghi nhận lỗi ở đâu cả.\n\n“Start the same task again in a new conversation,…”: Làm lại trong chat mới cũng là né lỗi, không ghi nhận.\n\n“Add a line to the conversation noting that the…”: Ghi chú trong chat chỉ nằm trong lịch sử cuộc trò chuyện của chính cô, không phải kênh phản hồi."}, {"n": 169, "cat": "E", "topic": 4, "q": "A marketer is midway through a one-off brainstorm that will not be revisited, and the conversation is approaching its limit. What is the most appropriate action?", "o": ["Stop the brainstorm now and restart it in a new chat so the ideas come from a completely clean window.", "Let the conversation continue and condense itself, since nothing in it needs to outlive this session.", "Split the brainstorm across four separate chats so that no single conversation ever nears its limit.", "Build a Project and move the whole brainstorm into project knowledge before writing anything more."], "a": 1, "sk": ["one-off brainstorm that will not be revisited", "approaching its limit"], "note": "Đáp án: {B}. Bẫy: {A} Dừng và mở chat mới làm mất mạch ý tưởng đang có, trong khi không có lợi gì thêm; {C} Chia brainstorm ra bốn chat làm ý tưởng rời rạc và tốn công, chỉ để tránh một giới hạn đã có cơ chế tự xử lý; {D} Dựng Project và chuyển toàn bộ vào knowledge là quá mức cho một việc làm một lần, không quay lại.", "ex": "Tại sao chọn đáp án đúng (“Let the conversation continue and condense itself, since nothing…”):\n\nKhi hội thoại dài gần chạm giới hạn, Claude có thể tự nén (tóm tắt phần cũ) để cuộc trò chuyện tiếp tục. Với việc một lần, không cần giữ lâu dài, để hội thoại tự nén là đủ. Dựng Project hay chia nhiều chat chỉ đáng làm khi nội dung cần dùng lại hoặc kéo dài nhiều phiên.\n\nBrainstorm one-off, không cần tồn tại sau phiên này. Let the conversation continue and condense itself giữ mạch ý tưởng mà không tốn công thiết lập gì thêm.\n\nMẹo nhớ: Dạng tương xứng công sức: việc một lần → giải pháp nhẹ nhất (để tự nén). Việc lâu dài, dùng lại → Project, knowledge.\n\nTại sao các phương án khác sai\n“Stop the brainstorm now and restart it in a…”: Dừng và mở chat mới làm mất mạch ý tưởng đang có, trong khi không có lợi gì thêm.\n\n“Split the brainstorm across four separate chats so that…”: Chia brainstorm ra bốn chat làm ý tưởng rời rạc và tốn công, chỉ để tránh một giới hạn đã có cơ chế tự xử lý.\n\n“Build a Project and move the whole brainstorm into…”: Dựng Project và chuyển toàn bộ vào knowledge là quá mức cho một việc làm một lần, không quay lại."}, {"n": 170, "cat": "T", "topic": 4, "q": "A market analyst must produce a competitor briefing drawn from many public sources, and the team will keep editing that briefing for weeks afterwards. Which two Claude features fit this job? Select two.", "o": ["Ask for the briefing as an artifact, so the team can edit and reuse it outside the chat.", "Open a separate chat for each competitor so that no single conversation ever grows long.", "Turn on a mail connector first so that the competitor facts are drawn from the team inbox.", "Keep the briefing inline in the chat and re-paste the newest version whenever an edit lands.", "Use Research mode, so the briefing is built by multi-step searching and returns citations."], "a": [0, 4], "sk": ["drawn from many public sources", "keep editing that briefing for weeks afterwards"], "note": "Đáp án: {A} + {E}. Bẫy: {B} Mỗi đối thủ một chat làm thông tin rời rạc, khó tổng hợp thành một briefing; {C} Connector mail lấy từ hộp thư nội bộ, trong khi đề yêu cầu nguồn công khai; {D} Để briefing trong chat rồi dán lại bản mới mỗi lần sửa là thủ công, dễ lẫn phiên bản.", "ex": "Tại sao chọn đáp án đúng (“Ask for the briefing as an artifact, so the…” / “Use Research mode, so the briefing is built by…”):\n\nTách hai nhu cầu: thu thập từ nhiều nguồn công khai, có trích dẫn → Research (tìm kiếm nhiều bước, trả kèm citation). Nội dung để chỉnh và dùng lại lâu dài → Artifact (nội dung riêng, chỉnh sửa, dùng lại bên ngoài chat). Connector mail lấy dữ liệu nội bộ, không phải nguồn công khai.\n\nArtifact: briefing là nội dung riêng, edit and reuse outside the chat, hợp với việc nhóm chỉnh trong nhiều tuần.\n\nResearch mode: multi-step searching qua nhiều nguồn công khai và returns citations để kiểm chứng.\n\nMẹo nhớ: Dạng ghép tính năng: tách đề thành nhu cầu: nhiều nguồn công khai + citation → Research; chỉnh sửa lâu dài, dùng lại → Artifact (giống câu 73 nhưng ghép với Artifact).\n\nTại sao các phương án khác sai\n“Open a separate chat for each competitor so that…”: Mỗi đối thủ một chat làm thông tin rời rạc, khó tổng hợp thành một briefing.\n\n“Turn on a mail connector first so that the…”: Connector mail lấy từ hộp thư nội bộ, trong khi đề yêu cầu nguồn công khai.\n\n“Keep the briefing inline in the chat and re-paste…”: Để briefing trong chat rồi dán lại bản mới mỗi lần sửa là thủ công, dễ lẫn phiên bản."}, {"n": 171, "cat": "T", "topic": 4, "q": "A support operations lead must classify a large daily backlog of short inbound messages, and separately needs one deep analysis of a tangled contract dispute. Which two choices fit? Select two.", "o": ["Use the deepest-reasoning tier for the contract dispute, accepting the larger quota it uses.", "Use the fastest, cheapest tier for both jobs, since the tiers differ mainly in reply speed.", "Use the fastest, cheapest tier for the high-volume classification, where throughput matters.", "Use the deepest-reasoning tier for both of the jobs, since the strongest option is never bad.", "Use whichever tier the team already has open, since the tier rarely changes what comes back."], "a": [0, 2], "sk": ["large daily backlog of short inbound messages", "one deep analysis of a tangled contract dispute"], "note": "Đáp án: {A} + {C}. Bẫy: {B} Sai: các model khác nhau không chỉ ở tốc độ trả lời mà cả độ sâu suy luận; {D} Model mạnh nhất không phải lúc nào cũng tốt: dùng cho phân loại khối lượng lớn là tốn kém và chậm không cần thiết; {E} Sai: model được chọn có ảnh hưởng tới kết quả và chi phí.", "ex": "Tại sao chọn đáp án đúng (“Use the deepest-reasoning tier for the contract dispute, accepting…” / “Use the fastest, cheapest tier for the high-volume classification,…”):\n\nChọn model theo từng việc, không dùng một model cho mọi thứ. Việc khối lượng lớn, đơn giản (phân loại tin nhắn ngắn) cần thông lượng và chi phí thấp → model nhanh, rẻ. Việc phức tạp, làm một lần (phân tích tranh chấp) cần suy luận sâu → model mạnh nhất, chấp nhận tốn hạn mức hơn.\n\nTranh chấp hợp đồng phức tạp cần suy luận sâu, và chỉ một lần nên accepting the larger quota là xứng đáng.\n\nPhân loại khối lượng lớn tin nhắn ngắn cần throughput, nên dùng model nhanh, rẻ nhất.\n\nMẹo nhớ: Dạng chọn model theo từng việc: nhiều + đơn giản → nhanh/rẻ; ít + phức tạp → suy luận sâu. Bẫy: một model cho tất cả (B, D) và model nào cũng như nhau (E).\n\nTại sao các phương án khác sai\n“Use the fastest, cheapest tier for both jobs, since…”: Sai: các model khác nhau không chỉ ở tốc độ trả lời mà cả độ sâu suy luận.\n\n“Use the deepest-reasoning tier for both of the jobs,…”: Model mạnh nhất không phải lúc nào cũng tốt: dùng cho phân loại khối lượng lớn là tốn kém và chậm không cần thiết.\n\n“Use whichever tier the team already has open, since…”: Sai: model được chọn có ảnh hưởng tới kết quả và chi phí."}, {"n": 172, "cat": "E", "topic": 4, "q": "A new team member asks how the Claude model tiers actually differ from one another in everyday use. Which two statements are accurate? Select two.", "o": ["The tiers differ only in writing style, so any of them may be used for any task at any time.", "The deepest tier suits genuinely hard problems, and it consumes meaningfully more allowance.", "The mid tier is the fast, capable default, and it is the right pick for most everyday work.", "Moving up one tier is the standard fix whenever a prompt comes back with a vague or shallow answer.", "The lightest tier gives answers of the very same depth, only more slowly than the other two."], "a": [1, 2], "sk": ["in everyday use"], "note": "Đáp án: {B} + {C}. Bẫy: {A} Sai: các dòng khác nhau về độ sâu suy luận, tốc độ và chi phí, không chỉ về văn phong; {D} Sai: câu trả lời mơ hồ, nông thường do prompt thiếu bối cảnh hoặc chỉ dẫn; {E} Sai: dòng nhẹ nhất nhanh hơn, không chậm hơn, và độ sâu không bằng các dòng trên.", "ex": "Tại sao chọn đáp án đúng (“The deepest tier suits genuinely hard problems, and it…” / “The mid tier is the fast, capable default, and…”):\n\nDòng model mạnh nhất hợp với vấn đề thật sự khó và tốn hạn mức nhiều hơn rõ rệt. Dòng giữa là mặc định nhanh và đủ mạnh cho phần lớn công việc hằng ngày. Dòng nhẹ nhất nhanh hơn, không phải chậm hơn. Câu trả lời mơ hồ thường do prompt, nên lên dòng model cao hơn không phải cách sửa mặc định.\n\nDeepest tier dành cho genuinely hard problems và consumes meaningfully more allowance: đúng cả công dụng lẫn chi phí.\n\nMid tier là fast, capable default, hợp với most everyday work.\n\nMẹo nhớ: Dạng ba dòng model: Nhẹ = nhanh/rẻ · Giữa = mặc định hằng ngày · Sâu nhất = việc khó, tốn hạn mức. Bẫy: *only writing style*, *same depth only slower*, và *đổi model là cách sửa mặc định cho câu trả lời mơ hồ*.\n\nTại sao các phương án khác sai\n“The tiers differ only in writing style, so any…”: Sai: các dòng khác nhau về độ sâu suy luận, tốc độ và chi phí, không chỉ về văn phong.\n\n“Moving up one tier is the standard fix whenever…”: Sai: câu trả lời mơ hồ, nông thường do prompt thiếu bối cảnh hoặc chỉ dẫn.\n\n“The lightest tier gives answers of the very same…”: Sai: dòng nhẹ nhất nhanh hơn, không chậm hơn, và độ sâu không bằng các dòng trên."}, {"n": 173, "cat": "E", "topic": 4, "q": "A team is setting up a new recurring weekly task and has to decide how much reasoning depth it needs. Which sequence is correct?", "o": ["Write down what good output means, then run a real sample on the default tier, then compare that sample against the definition, then change tier only where it falls short.", "Run the task on several tiers at once, then write down what good output means, then compare the results against that definition, then keep the tier that did best.", "Pick a tier by how important the task feels, then run it for a month, then write down what good output means, then compare the month's results against that.", "Compare a sample of results with what colleagues produce by hand, then write down what good output means, then pick a tier on that basis, then run the task each week from then on."], "a": 0, "sk": ["how much reasoning depth it needs", "Which sequence is correct"], "note": "Đáp án: {A}. Bẫy: {B} Chạy nhiều model trước rồi mới định nghĩa output tốt thì định nghĩa dễ bị bẻ theo kết quả vừa thấy; {C} Chọn model theo cảm giác task quan trọng tới đâu, chạy cả tháng rồi mới định nghĩa chuẩn là chậm và thiếu căn cứ; {D} So với kết quả làm tay của đồng nghiệp trước khi có định nghĩa output tốt là so mà không có chuẩn.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Write down what good output means,…”; B = “Run the task on several tiers…”; C = “Pick a tier by how important…”; D = “Compare a sample of results with…”.\n\nTại sao chọn đáp án đúng (“Write down what good output means, then run a…”):\n\nChọn model nên dựa trên bằng chứng: định nghĩa output tốt là gì trước (tiêu chí) → chạy mẫu thật trên model mặc định → so với định nghĩa → chỉ đổi model ở chỗ còn thiếu. Định nghĩa phải có trước khi xem kết quả, nếu không dễ lấy kết quả đang có làm chuẩn.\n\nĐáp án A đúng trình tự: write down what good output means trước, run a real sample on the default tier, compare với định nghĩa, và change tier only where it falls short. Chuẩn có trước, quyết định dựa trên dữ liệu, và chỉ trả thêm chi phí khi cần.\n\nMẹo nhớ: Dạng thứ tự chọn model: Define good → Test on default → Compare → Change only if short. Luôn định nghĩa tiêu chí trước khi xem kết quả (giống câu 132, 165).\n\nTại sao các phương án khác sai\n“Run the task on several tiers at once, then…”: Chạy nhiều model trước rồi mới định nghĩa output tốt thì định nghĩa dễ bị bẻ theo kết quả vừa thấy.\n\n“Pick a tier by how important the task feels,…”: Chọn model theo cảm giác task quan trọng tới đâu, chạy cả tháng rồi mới định nghĩa chuẩn là chậm và thiếu căn cứ.\n\n“Compare a sample of results with what colleagues produce…”: So với kết quả làm tay của đồng nghiệp trước khi có định nghĩa output tốt là so mà không có chuẩn."}, {"n": 174, "cat": "T", "topic": 4, "q": "A team runs two workloads that are alike in volume and subject matter. One is edited line by line by a specialist before use; the other is published automatically with no human reading it. Which consideration should weigh most heavily when choosing a tier for each?", "o": ["The volume of the two workloads, since equal volumes imply equal throughput needs and therefore the same balance of speed and cost.", "How much a downstream human check would catch, since the unchecked workload has to carry its own quality with no safety net.", "The seniority of the people who own each workload, since the more senior owner is accountable for the more visible of the two.", "The subject matter the two workloads share, since comparable material should be handled the same way for consistency of output."], "a": 1, "sk": ["edited line by line by a specialist", "published automatically with no human reading it"], "note": "Đáp án: {B}. Bẫy: {A} Khối lượng giống nhau nên không phân biệt được hai workload; {C} Thâm niên người sở hữu không quyết định chất lượng output cần có; {D} Chủ đề giống nhau, nên cũng không phải yếu tố phân biệt.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “The volume of the two workloads,…”; B = “How much a downstream human check…”; C = “The seniority of the people who…”; D = “The subject matter the two workloads…”.\n\nTại sao chọn đáp án đúng (“How much a downstream human check would catch, since…”):\n\nKhi chọn model, cần tính tới lớp kiểm tra phía sau. Output có chuyên gia sửa từng dòng thì có lưới an toàn, model nhẹ hơn có thể chấp nhận được. Output tự đăng không qua ai phải tự đảm bảo chất lượng, nên cần model đủ mạnh (và tốt nhất là thêm kiểm tra tự động).\n\nHai workload giống nhau mọi mặt trừ lớp kiểm tra của con người. Đáp án B nhắm đúng điểm khác biệt duy nhất đó: workload unchecked phải carry its own quality with no safety net, nên đáng được đầu tư model mạnh hơn.\n\nMẹo nhớ: Dạng tìm yếu tố khác biệt: đề cho hai thứ giống nhau mọi mặt trừ một điểm → đáp án là điểm khác biệt đó. Ở đây: có hay không có human check. Không có lưới an toàn → cần chất lượng tự thân cao hơn.\n\nTại sao các phương án khác sai\n“The volume of the two workloads, since equal volumes…”: Khối lượng giống nhau nên không phân biệt được hai workload.\n\n“The seniority of the people who own each workload,…”: Thâm niên người sở hữu không quyết định chất lượng output cần có.\n\n“The subject matter the two workloads share, since comparable…”: Chủ đề giống nhau, nên cũng không phải yếu tố phân biệt."}, {"n": 175, "cat": "T", "topic": 6, "q": "Reviewing a backlog of intake forms, an analyst notices that most entries name a solution rather than a need, for example \"we need a dashboard.\" How can Claude best help with this backlog?", "o": ["Ask Claude to group the entries by the department that submitted them and report the totals to sponsors.", "Ask Claude to restate each entry as the outcome sought, then flag entries where that outcome is unclear.", "Ask Claude to reject entries that name a tool and ask the submitters to resubmit them in the right form.", "Ask Claude to design the dashboard described in each entry so submitters can confirm what they wanted."], "a": 1, "sk": ["name a solution rather than a need"], "note": "Đáp án: {B}. Bẫy: {A} Gom theo phòng ban và đếm tổng không xử lý việc yêu cầu đang nêu giải pháp thay vì nhu cầu; {C} Từ chối và bắt nộp lại là đẩy việc về người đề xuất, gây phiền mà không giúp làm rõ nhu cầu; {D} Thiết kế luôn dashboard theo từng yêu cầu là khóa chặt vào giải pháp mà chưa biết nhu cầu thật.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Ask Claude to group the entries…”; B = “Ask Claude to restate each entry…”; C = “Ask Claude to reject entries that…”; D = “Ask Claude to design the dashboard…”.\n\nTại sao chọn đáp án đúng (“Ask Claude to restate each entry as the outcome…”):\n\nTrong phân tích yêu cầu, người đề xuất thường nêu giải pháp họ nghĩ tới thay vì kết quả họ cần. Claude có thể giúp diễn đạt lại mỗi yêu cầu thành kết quả mong muốn, và đánh dấu những chỗ chưa rõ kết quả để analyst hỏi lại. Như vậy nhóm làm việc với nhu cầu thật, không bị khóa vào giải pháp sớm.\n\nĐáp án B nhắm đúng vấn đề: restate each entry as the outcome sought để chuyển từ giải pháp sang nhu cầu, rồi flag entries where that outcome is unclear để con người làm rõ. Claude xử lý khối lượng lớn, analyst tập trung vào chỗ cần hỏi.\n\nMẹo nhớ: Dạng giải pháp vs nhu cầu: chuyển solution → outcome sought, rồi flag chỗ chưa rõ cho con người. Bẫy: làm luôn giải pháp (D), từ chối (C), đếm cho có (A).\n\nTại sao các phương án khác sai\n“Ask Claude to group the entries by the department…”: Gom theo phòng ban và đếm tổng không xử lý việc yêu cầu đang nêu giải pháp thay vì nhu cầu.\n\n“Ask Claude to reject entries that name a tool…”: Từ chối và bắt nộp lại là đẩy việc về người đề xuất, gây phiền mà không giúp làm rõ nhu cầu.\n\n“Ask Claude to design the dashboard described in each…”: Thiết kế luôn dashboard theo từng yêu cầu là khóa chặt vào giải pháp mà chưa biết nhu cầu thật."}, {"n": 176, "cat": "T", "topic": 3, "q": "In a pilot of a new Claude-assisted briefing arrangement, three of eight testers report that the output is \"not quite right\" but say nothing more specific. What should the pilot's owner do first?", "o": ["Ask the three testers for specific examples, with what the output said and what it should have said.", "Ask the five satisfied testers what they did differently and circulate that as guidance to everyone.", "Pause the pilot until the owner can sit with each tester and watch a full briefing being produced.", "Rewrite the instructions to cover the areas the owner believes are most likely to be causing the trouble."], "a": 0, "sk": ["\"not quite right\" but say nothing more specific", "do first"], "note": "Đáp án: {A}. Bẫy: {B} Hỏi năm người hài lòng không làm rõ được ba người kia gặp vấn đề gì; {C} Dừng pilot để ngồi xem từng người làm là phản ứng quá nặng với feedback chưa rõ, trong khi chỉ cần hỏi ví dụ; {D} Viết lại instructions theo phỏng đoán là sửa mù, có thể làm hỏng phần đang tốt với năm người còn lại.", "ex": "Tại sao chọn đáp án đúng (“Ask the three testers for specific examples, with what…”):\n\nFeedback mơ hồ không chẩn đoán được. Bước đầu tiên là làm rõ feedback: xin ví dụ cụ thể, output đã nói gì và đáng ra nên nói gì. Có ví dụ cụ thể mới biết vấn đề nằm ở instructions, dữ liệu hay kỳ vọng. Sửa theo phỏng đoán hay dừng pilot đều không dựa trên bằng chứng.\n\nAsk the three testers for specific examples, kèm what the output said and what it should have said: biến feedback mơ hồ thành bằng chứng cụ thể để chẩn đoán. Đây là bước nhanh, rẻ và cần thiết trước mọi thay đổi.\n\nMẹo nhớ: Dạng feedback mơ hồ: bước đầu luôn là làm rõ (*specific examples: said vs should have said*), giống câu 101 (*ask clarifying questions*). Bẫy: đoán rồi sửa (D), hỏi nhầm người (B), dừng quá tay (C).\n\nTại sao các phương án khác sai\n“Ask the five satisfied testers what they did differently…”: Hỏi năm người hài lòng không làm rõ được ba người kia gặp vấn đề gì.\n\n“Pause the pilot until the owner can sit with…”: Dừng pilot để ngồi xem từng người làm là phản ứng quá nặng với feedback chưa rõ, trong khi chỉ cần hỏi ví dụ.\n\n“Rewrite the instructions to cover the areas the owner…”: Viết lại instructions theo phỏng đoán là sửa mù, có thể làm hỏng phần đang tốt với năm người còn lại."}, {"n": 177, "cat": "E", "topic": 1, "q": "A manager is about to tell her team that Claude will now produce the first draft of every incident report. What should the announcement make clear above all?", "o": ["What changes, what stays with each person, and where their review is still required.", "How much time the change is expected to save the team over the course of a full year.", "Which other departments have already adopted the same approach to their own reports.", "How the manager tested the new arrangement before deciding to introduce it to the team."], "a": 0, "sk": ["What should the announcement make clear above all", "make clear above all"], "note": "Đáp án: {A}. Bẫy: {B} Thời gian tiết kiệm trong năm là lợi ích, nhưng không cho nhóm biết họ phải làm gì khác đi; {C} Các phòng ban khác đã làm thế nào không giúp nhóm hiểu vai trò của mình; {D} Manager đã thử nghiệm ra sao có thể tạo niềm tin, nhưng không phải điều quan trọng nhất cho việc vận hành hằng ngày.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “What changes, what stays with each…”; B = “How much time the change is…”; C = “Which other departments have already adopted…”; D = “How the manager tested the new…”.\n\nTại sao chọn đáp án đúng (“What changes, what stays with each person, and where…”):\n\nKhi đưa AI vào quy trình, điều người trong nhóm cần biết nhất là vai trò của chính họ: cái gì thay đổi, việc gì vẫn thuộc về họ, và ở đâu họ vẫn phải review. Thiếu điều này, người ta dễ nghĩ không cần kiểm tra nữa, hoặc lo về vai trò của mình. Lợi ích tiết kiệm thời gian hay phòng ban khác làm gì là thông tin phụ.\n\nĐáp án A trả lời đúng những gì nhóm cần để làm việc đúng: what changes, what stays with each person, và where their review is still required. Trách nhiệm rõ ràng, review không bị bỏ sót.\n\nMẹo nhớ: Dạng truyền thông thay đổi: ưu tiên vai trò và trách nhiệm: What changes · What stays · Where review is required. Loại các thông tin thuyết phục (tiết kiệm, phòng khác dùng, đã thử) khi đề hỏi điều cần làm rõ above all.\n\nTại sao các phương án khác sai\n“How much time the change is expected to save…”: Thời gian tiết kiệm trong năm là lợi ích, nhưng không cho nhóm biết họ phải làm gì khác đi.\n\n“Which other departments have already adopted the same approach…”: Các phòng ban khác đã làm thế nào không giúp nhóm hiểu vai trò của mình.\n\n“How the manager tested the new arrangement before deciding…”: Manager đã thử nghiệm ra sao có thể tạo niềm tin, nhưng không phải điều quan trọng nhất cho việc vận hành hằng ngày."}, {"n": 178, "cat": "E", "topic": 6, "q": "A strategy lead is planning a market-entry study and wants Claude to help with the research phase of it. Which two approaches are sound? Select two.", "o": ["Ask Claude to draft the research plan and its open questions, then have the team refine it.", "Accept the market figures Claude gives as final, since the answer reads confident and full.", "Use Research mode and check the citations it returns back against the original sources.", "Ask for the finished conclusion in a single prompt and publish it with no intermediate step.", "Leave out the decision the study must support, so Claude is not steered toward an answer."], "a": [0, 2], "sk": ["research phase"], "note": "Đáp án: {A} + {C}. Bẫy: {B} Chấp nhận số liệu là kết quả cuối vì đọc thấy chắc chắn và đầy đủ là đúng cái bẫy trôi chảy ≠ chính xác; {D} Một prompt ra luôn kết luận rồi đăng, không có bước trung gian, là bỏ qua mọi kiểm chứng; {E} Giấu quyết định mà nghiên cứu cần hỗ trợ làm Claude thiếu bối cảnh, nghiên cứu lan man.", "ex": "Tại sao chọn đáp án đúng (“Ask Claude to draft the research plan and its…” / “Use Research mode and check the citations it returns…”):\n\nClaude hỗ trợ nghiên cứu tốt nhất khi con người vẫn định hướng và kiểm chứng: Claude soạn kế hoạch và câu hỏi mở, nhóm chỉnh lại; Claude dùng Research để thu thập, nhóm kiểm lại citation với nguồn gốc. Chấp nhận số liệu vì nghe chắc chắn, làm một prompt rồi đăng luôn, hay giấu mục đích quyết định đều làm kết quả kém tin cậy hoặc kém hữu ích.\n\nClaude draft the research plan and its open questions, rồi the team refine it: tận dụng tốc độ của Claude, con người giữ định hướng.\n\nResearch mode để thu thập nhiều nguồn, và check the citations với nguồn gốc: có nguồn mà vẫn được kiểm chứng.\n\nMẹo nhớ: Dạng Claude trong nghiên cứu: Claude soạn, người chỉnh + Research có citation, người kiểm. Bẫy: tin vì nghe chắc (B), một phát đăng luôn (D), giấu mục đích (E).\n\nTại sao các phương án khác sai\n“Accept the market figures Claude gives as final, since…”: Chấp nhận số liệu là kết quả cuối vì đọc thấy chắc chắn và đầy đủ là đúng cái bẫy trôi chảy ≠ chính xác.\n\n“Ask for the finished conclusion in a single prompt…”: Một prompt ra luôn kết luận rồi đăng, không có bước trung gian, là bỏ qua mọi kiểm chứng.\n\n“Leave out the decision the study must support, so…”: Giấu quyết định mà nghiên cứu cần hỗ trợ làm Claude thiếu bối cảnh, nghiên cứu lan man."}, {"n": 179, "cat": "E", "topic": 1, "q": "An analyst is presenting a Claude-assisted workflow to sceptical senior stakeholders next week. Which two things should the presentation include? Select two.", "o": ["A specific, measured example of what the workflow improved during the pilot it ran on.", "A claim that Claude will not make any factual errors once all its instructions are written well.", "Where a human still reviews the output, and why that review step has been kept in place.", "A promise that the workflow removes any need to check the output from this point onward.", "A comparison of technical benchmark scores across each of the underlying model tiers."], "a": [0, 2], "sk": ["sceptical senior stakeholders"], "note": "Đáp án: {A} + {C}. Bẫy: {B} Khẳng định Claude không bao giờ sai là không đúng sự thật, và người hoài nghi sẽ bác bỏ ngay; {D} Hứa bỏ hẳn việc kiểm tra output là hứa quá mức và tăng rủi ro; {E} So sánh điểm benchmark giữa các model là chi tiết kỹ thuật, không trả lời workflow mang lại gì cho tổ chức.", "ex": "Tại sao chọn đáp án đúng (“A specific, measured example of what the workflow improved…” / “Where a human still reviews the output, and why…”):\n\nVới người nghe hoài nghi, sức thuyết phục đến từ bằng chứng cụ thể và sự thẳng thắn về giới hạn: ví dụ cải thiện đo được từ pilot thật, và chỗ con người vẫn review cùng lý do. Hứa hẹn không bao giờ sai hay không cần kiểm tra làm mất uy tín ngay; điểm benchmark kỹ thuật không trả lời câu hỏi kinh doanh.\n\nSpecific, measured example từ pilot là bằng chứng thật, thuyết phục hơn mọi lời hứa.\n\nNêu rõ where a human still reviews và why cho thấy rủi ro đã được kiểm soát, đúng điều người hoài nghi muốn nghe.\n\nMẹo nhớ: Dạng thuyết phục người hoài nghi: Bằng chứng đo được + Thẳng thắn về giới hạn (human review và lý do). Loại mọi lời hứa tuyệt đối (*not make any errors*, *removes any need to check*) và chi tiết kỹ thuật lạc đề (*benchmark scores*).\n\nTại sao các phương án khác sai\n“A claim that Claude will not make any factual…”: Khẳng định Claude không bao giờ sai là không đúng sự thật, và người hoài nghi sẽ bác bỏ ngay.\n\n“A promise that the workflow removes any need to…”: Hứa bỏ hẳn việc kiểm tra output là hứa quá mức và tăng rủi ro.\n\n“A comparison of technical benchmark scores across each of…”: So sánh điểm benchmark giữa các model là chi tiết kỹ thuật, không trả lời workflow mang lại gì cho tổ chức."}, {"n": 180, "cat": "T", "topic": 4, "q": "An operations manager has two things to add to a project: the team's two-page approved abbreviation list, and the rule that answers must never use abbreviations outside that list. What is the best placement?", "o": ["Put both the reference list and the rule into the project instructions so that the two are always read together.", "Keep the reference list on the team wiki and paste the rule at the start of each chat that needs it.", "Upload the reference to project knowledge and put the rule about unapproved abbreviations in the instructions.", "Upload both the reference list and the rule as documents in the project knowledge base, for consistency."], "a": 2, "sk": ["two-page approved abbreviation list", "must never use abbreviations outside that list", "approved abbreviation list"], "note": "Đáp án: {C}. Bẫy: {A} Nhét danh sách hai tr
