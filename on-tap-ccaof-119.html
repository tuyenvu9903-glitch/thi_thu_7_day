ang vào instructions làm instructions dài và nặng; {B} Để danh sách trên wiki và dán quy tắc vào từng chat là thủ công, dễ quên, và Claude không truy cập được danh sách; {D} Để quy tắc trong knowledge như một tài liệu thì nó không được áp như chỉ dẫn luôn bật, dễ bị bỏ qua.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Put both the reference list and…”; B = “Keep the reference list on the…”; C = “Upload the reference to project knowledge…”; D = “Upload both the reference list and…”.\n\nTại sao chọn đáp án đúng (“Upload the reference to project knowledge and put the…”):\n\nKnowledge chứa tài liệu tham chiếu (danh sách, sổ tay, dữ liệu). Instructions chứa quy tắc hành vi ngắn áp dụng cho mọi câu trả lời. Danh sách dài hai trang là tài liệu → knowledge. Quy tắc *không dùng viết tắt ngoài danh sách* là chỉ dẫn hành vi → instructions, để luôn được áp dụng.\n\nĐáp án C đặt mỗi thứ đúng chỗ: upload the reference to project knowledge (tài liệu tra cứu) và put the rule in the instructions (quy tắc luôn áp dụng). Instructions trỏ tới danh sách trong knowledge, hai phần phối hợp với nhau.\n\nMẹo nhớ: Dạng knowledge vs instructions: Tài liệu tra cứu → Knowledge; Quy tắc hành vi → Instructions (giống câu 145). Nhớ: Knowledge = cái gì · Instructions = làm thế nào.\n\nTại sao các phương án khác sai\n“Put both the reference list and the rule into…”: Nhét danh sách hai trang vào instructions làm instructions dài và nặng.\n\n“Keep the reference list on the team wiki and…”: Để danh sách trên wiki và dán quy tắc vào từng chat là thủ công, dễ quên, và Claude không truy cập được danh sách.\n\n“Upload both the reference list and the rule as…”: Để quy tắc trong knowledge như một tài liệu thì nó không được áp như chỉ dẫn luôn bật, dễ bị bỏ qua."}, {"n": 181, "cat": "E", "topic": 4, "q": "A project shared with a Team plan workspace has just had its escalation matrix replaced with a new version. What else should the project owner do?", "o": ["Ask each member to create their own copy of the project so everyone controls their own knowledge base.", "Leave a note in the project title, since members are prompted to read the title before each new chat.", "Delete the project's chat history, because past conversations would otherwise override the new material.", "Tell the members who use the project what changed, so they know earlier answers may no longer hold."], "a": 3, "sk": ["escalation matrix replaced with a new version"], "note": "Đáp án: {D}. Bẫy: {A} Mỗi người tự tạo bản sao Project làm phân mảnh, ai cũng giữ một bản riêng, càng khó cập nhật về sau; {B} Thành viên không được nhắc đọc tên Project trước mỗi chat; {C} Xóa lịch sử chat không cần thiết: các chat mới dùng tài liệu mới.", "ex": "Tại sao chọn đáp án đúng (“Tell the members who use the project what changed,…”):\n\nCập nhật tài liệu trong Project dùng chung xong vẫn cần truyền thông thay đổi: các thành viên có thể đang dựa vào câu trả lời cũ (từ chat trước, ghi chú, quy trình đã quen). Báo cho họ biết cái gì đã đổi để họ biết câu trả lời cũ có thể không còn đúng.\n\nTell the members who use the project what changed: các thành viên biết các câu trả lời trước đây có thể không còn đúng, và kiểm lại những gì đã dựa vào ma trận cũ.\n\nMẹo nhớ: Dạng bảo trì Project dùng chung: cập nhật tài liệu xong → báo cho người dùng biết đã đổi gì. Bẫy: phân mảnh (A), kênh không hiệu quả (B), hiểu sai cơ chế (C).\n\nTại sao các phương án khác sai\n“Ask each member to create their own copy of…”: Mỗi người tự tạo bản sao Project làm phân mảnh, ai cũng giữ một bản riêng, càng khó cập nhật về sau.\n\n“Leave a note in the project title, since members…”: Thành viên không được nhắc đọc tên Project trước mỗi chat.\n\n“Delete the project's chat history, because past conversations would…”: Xóa lịch sử chat không cần thiết: các chat mới dùng tài liệu mới."}, {"n": 182, "cat": "E", "topic": 4, "q": "A policy team keeps a handbook in a Drive folder that changes weekly, and also has one annual report that never changes. Which two set-ups fit best? Select two.", "o": ["Connect the Drive folder, so the weekly handbook changes are picked up from the source.", "Upload the fixed annual report into Project knowledge, since its content will not change.", "Paste the whole handbook into every new chat, so the newest version is always present.", "Upload a copy of the handbook just once and then rely on that copy for the rest of this year.", "Connect the annual report and delete it from Drive, so that only one copy ever exists."], "a": [0, 1], "sk": ["changes weekly", "never changes"], "note": "Đáp án: {A} + {B}. Bẫy: {C} Dán cả sổ tay vào mỗi chat mới là thủ công, tốn context, và dễ dán nhầm bản cũ; {D} Upload sổ tay một lần rồi dùng cả năm thì sau một tuần đã lỗi thời; {E} Kết nối báo cáo năm rồi xóa khỏi Drive là vô lý: kết nối cần nguồn còn tồn tại, và xóa tài liệu gốc là mất dữ liệu.", "ex": "Tại sao chọn đáp án đúng (“Connect the Drive folder, so the weekly handbook changes…” / “Upload the fixed annual report into Project knowledge, since…”):\n\nChọn cách đưa tài liệu vào theo tần suất thay đổi. Tài liệu thay đổi thường xuyên → kết nối tới nguồn (Connector Drive) để luôn lấy bản mới nhất. Tài liệu cố định → upload vào Project knowledge, đơn giản và ổn định. Upload một bản tài liệu hay đổi thì nhanh chóng lỗi thời; dán vào từng chat thì thủ công và dễ quên.\n\nConnect the Drive folder: sổ tay đổi hằng tuần được lấy từ nguồn, luôn là bản mới nhất.\n\nUpload the fixed annual report into Project knowledge: nội dung không đổi nên upload một lần là đủ.\n\nMẹo nhớ: Dạng chọn cách đưa tài liệu: hay đổi → Connect (lấy từ nguồn) · cố định → Upload (Project knowledge). Bẫy: upload thứ hay đổi (D), dán từng chat (C).\n\nTại sao các phương án khác sai\n“Paste the whole handbook into every new chat, so…”: Dán cả sổ tay vào mỗi chat mới là thủ công, tốn context, và dễ dán nhầm bản cũ.\n\n“Upload a copy of the handbook just once and…”: Upload sổ tay một lần rồi dùng cả năm thì sau một tuần đã lỗi thời.\n\n“Connect the annual report and delete it from Drive,…”: Kết nối báo cáo năm rồi xóa khỏi Drive là vô lý: kết nối cần nguồn còn tồn tại, và xóa tài liệu gốc là mất dữ liệu."}, {"n": 183, "cat": "T", "topic": 5, "q": "An operations lead creates a project on an Enterprise plan and shares it with the whole organisation. To save time she uploads a complete team folder into the project knowledge, and that folder includes a spreadsheet of individual salary bands. What is the greatest risk?", "o": ["The salary spreadsheet can no longer be removed once other members have opened the project.", "Claude will decline every request in the project while a salary document remains uploaded.", "The extra documents will slow down every answer in the project until the folder has been trimmed back.", "Anyone who opens the shared project can draw the salary details out through ordinary questions."], "a": 3, "sk": ["shares it with the whole organisation", "spreadsheet of individual salary bands"], "note": "Đáp án: {D}. Bẫy: {A} Sai: tài liệu vẫn xóa được khỏi Project sau khi người khác đã mở; {B} Sai: Claude không tự từ chối mọi yêu cầu chỉ vì có tài liệu lương trong Project; {C} Tài liệu thừa có thể làm loãng, nhưng tốc độ không phải rủi ro lớn nhất so với việc lộ lương cá nhân.", "ex": "Tại sao chọn đáp án đúng (“Anyone who opens the shared project can draw the…”):\n\nTài liệu trong knowledge của một Project chia sẻ thì mọi người có quyền vào Project đều truy cập được thông qua Claude, chỉ bằng những câu hỏi bình thường. Vì vậy trước khi upload vào Project dùng chung, phải rà nội dung và loại dữ liệu nhạy cảm (lương, dữ liệu cá nhân). Upload nguyên thư mục cho nhanh là cách dữ liệu bị lộ ngoài ý muốn.\n\nRủi ro lớn nhất là lộ dữ liệu: anyone who opens the shared project có thể hỏi ra salary details bằng ordinary questions. Project được chia sẻ cho cả tổ chức, nên dữ liệu lương cá nhân thực tế đã được công khai nội bộ.\n\nMẹo nhớ: Dạng Project chia sẻ: Shared project = mọi thành viên hỏi ra được mọi thứ trong knowledge. Rủi ro lớn nhất luôn là lộ dữ liệu nhạy cảm. Bài học: rà trước khi upload, không upload cả thư mục cho nhanh.\n\nTại sao các phương án khác sai\n“The salary spreadsheet can no longer be removed once…”: Sai: tài liệu vẫn xóa được khỏi Project sau khi người khác đã mở.\n\n“Claude will decline every request in the project while…”: Sai: Claude không tự từ chối mọi yêu cầu chỉ vì có tài liệu lương trong Project.\n\n“The extra documents will slow down every answer in…”: Tài liệu thừa có thể làm loãng, nhưng tốc độ không phải rủi ro lớn nhất so với việc lộ lương cá nhân."}, {"n": 184, "cat": "T", "topic": 5, "q": "A developer integrating Claude into an internal analytics agent wants to give it broad, unsupervised authority to automatically send emails and modify production database records without any human approval step. What ethical concern does this design most directly raise?", "o": ["It is acceptable because agentic use is encouraged without oversight requirements in the policy", "None, as long as the agent uses the Claude API rather than the consumer chat product", "It removes human oversight from hard-to-reverse actions, risking harm before anyone can intervene", "None, unless the agent is built using a third-party framework instead of Anthropic's own official tools"], "a": 2, "sk": ["without any human approval step"], "note": "Đáp án: {C}. Bẫy: {A} Sai: chính sách không khuyến khích dùng agent không có giám sát, đặc biệt với hành động có hậu quả; {B} Sai: dùng API hay sản phẩm chat không thay đổi rủi ro của hành động không được giám sát; {D} Sai: framework do ai làm không quyết định rủi ro.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “It is acceptable because agentic use…”; B = “None, as long as the agent…”; C = “It removes human oversight from hard-to-reverse…”; D = “None, unless the agent is built…”.\n\nTại sao chọn đáp án đúng (“It removes human oversight from hard-to-reverse actions, risking harm…”):\n\nHành động khó hoặc không thể đảo ngược (gửi email ra ngoài, sửa dữ liệu production) cần con người duyệt trước khi thực hiện. Agent có toàn quyền mà không có điểm duyệt có thể gây hại (gửi sai, sửa sai dữ liệu) trước khi ai kịp can thiệp. Dùng API hay framework nào không thay đổi yêu cầu này.\n\nĐáp án C nêu đúng vấn đề: thiết kế removes human oversight from hard-to-reverse actions, nên có thể harm before anyone can intervene. Email đã gửi không thu hồi được, dữ liệu production bị sửa có thể lan ra hệ thống khác.\n\nMẹo nhớ: Dạng agent tự động: hard-to-reverse actions (gửi, xóa, sửa production, thanh toán) → cần human approval. Loại mọi đáp án nói *không sao* vì lý do kỹ thuật (*API*, *framework*) hoặc chính sách (*encouraged without oversight*).\n\nTại sao các phương án khác sai\n“It is acceptable because agentic use is encouraged without…”: Sai: chính sách không khuyến khích dùng agent không có giám sát, đặc biệt với hành động có hậu quả.\n\n“None, as long as the agent uses the Claude…”: Sai: dùng API hay sản phẩm chat không thay đổi rủi ro của hành động không được giám sát.\n\n“None, unless the agent is built using a third-party…”: Sai: framework do ai làm không quyết định rủi ro."}, {"n": 185, "cat": "E", "topic": 5, "q": "A Team-plan owner is uneasy about conversation content leaving the organisation when members rate Claude's answers. What control is available to them?", "o": ["Owners can require that every rating is approved by a manager before it is finally sent.", "Owners can set ratings to be stored only inside the organisation's own private workspace.", "Owners can have conversations redacted automatically before any rating is submitted.", "Owners can switch off the chat rating feature for the whole organisation in its settings."], "a": 3, "sk": ["conversation content leaving the organisation when members rate Claude's answers", "when members rate Claude's answers"], "note": "Đáp án: {D}. Bẫy: {A} Không có cơ chế bắt manager duyệt từng lần đánh giá trước khi gửi; {B} Không có tùy chọn chỉ lưu đánh giá trong workspace riêng của tổ chức; {C} Không có tính năng tự động che nội dung hội thoại trước khi gửi đánh giá.", "ex": "Tại sao chọn đáp án đúng (“Owners can switch off the chat rating feature for…”):\n\nKhi người dùng đánh giá (thumbs up/down) một câu trả lời, nội dung cuộc trò chuyện liên quan có thể được gửi kèm phản hồi cho Anthropic. Với gói Team/Enterprise, Owner có thể tắt tính năng đánh giá chat cho cả tổ chức trong phần cài đặt, nếu chính sách dữ liệu yêu cầu.\n\nCông cụ có sẵn là switch off the chat rating feature for the whole organisation in its settings. Tắt đánh giá thì không có nội dung nào được gửi đi qua kênh phản hồi này.\n\nMẹo nhớ: Dạng công cụ quản trị của Owner: lo rating gửi nội dung ra ngoài → tắt chat rating cho cả tổ chức. Ba đáp án còn lại mô tả các tính năng không tồn tại (manager duyệt, lưu nội bộ, tự che).\n\nTại sao các phương án khác sai\n“Owners can require that every rating is approved by…”: Không có cơ chế bắt manager duyệt từng lần đánh giá trước khi gửi.\n\n“Owners can set ratings to be stored only inside…”: Không có tùy chọn chỉ lưu đánh giá trong workspace riêng của tổ chức.\n\n“Owners can have conversations redacted automatically before any rating…”: Không có tính năng tự động che nội dung hội thoại trước khi gửi đánh giá."}, {"n": 186, "cat": "E", "topic": 5, "q": "A team lead asks whether using incognito chats on his personal plan makes it acceptable to paste regulated customer records into Claude. What is the best response?", "o": ["Incognito chats satisfy the policy, because nothing from the conversation is retained anywhere after it ends.", "Incognito chats are never used to improve Claude, but the policy's rules for regulated data still apply.", "Incognito chats are acceptable for regulated data provided customer names are replaced with reference codes.", "Incognito chats are equivalent to the company's managed workspace, so no separate approval would be required."], "a": 1, "sk": ["incognito chats on his personal plan", "regulated customer records"], "note": "Đáp án: {B}. Bẫy: {A} Sai: incognito không có nghĩa là không có gì được lưu ở bất cứ đâu, và chính sách dữ liệu bị quản lý không chỉ nói về việc lưu giữ; {C} Thay tên bằng mã tham chiếu không biến hồ sơ bị quản lý thành dữ liệu được phép; {D} Sai: gói cá nhân dù dùng incognito vẫn không phải workspace do công ty quản lý, và không thay được bước phê duyệt.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Incognito chats satisfy the policy, because…”; B = “Incognito chats are never used to…”; C = “Incognito chats are acceptable for regulated…”; D = “Incognito chats are equivalent to the…”.\n\nTại sao chọn đáp án đúng (“Incognito chats are never used to improve Claude, but…”):\n\nIncognito nghĩa là cuộc trò chuyện không được dùng để cải thiện Claude và không lưu vào lịch sử hay Memory. Nhưng nó không thay đổi việc dữ liệu đã được đưa vào một công cụ AI, càng không biến gói cá nhân thành workspace được tổ chức quản lý. Quy định về dữ liệu bị quản lý của chính sách vẫn áp dụng đầy đủ.\n\nĐáp án B tách bạch đúng hai việc: incognito never used to improve Claude (đúng), nhưng the policy's rules for regulated data still apply. Incognito không phải ngoại lệ của chính sách dữ liệu.\n\nMẹo nhớ: Dạng Incognito ≠ miễn chính sách (giống câu 9): Incognito = không dùng để train, không lưu lịch sử, nhưng chính sách dữ liệu vẫn áp dụng. Bẫy: *nothing retained anywhere*, *replace names*, *equivalent to managed workspace*.\n\nTại sao các phương án khác sai\n“Incognito chats satisfy the policy, because nothing from the…”: Sai: incognito không có nghĩa là không có gì được lưu ở bất cứ đâu, và chính sách dữ liệu bị quản lý không chỉ nói về việc lưu giữ.\n\n“Incognito chats are acceptable for regulated data provided customer…”: Thay tên bằng mã tham chiếu không biến hồ sơ bị quản lý thành dữ liệu được phép.\n\n“Incognito chats are equivalent to the company's managed workspace,…”: Sai: gói cá nhân dù dùng incognito vẫn không phải workspace do công ty quản lý, và không thay được bước phê duyệt."}, {"n": 187, "cat": "T", "topic": 5, "q": "A consultant is about to send a client a report she drafted with Claude. Her firm's AI policy sets out several requirements for client-facing work produced with AI, and she is unsure which of them apply to a report of this kind. What should she do first?", "o": ["Ask her engagement manager to sign the report off, so responsibility for it rests with him instead.", "Add a short line stating the report was drafted with AI assistance, and send it to the client.", "Ask the client whether they have any objection to AI assistance having been used on the report.", "Establish what the policy requires for a deliverable of this kind, before the report goes out."], "a": 3, "sk": ["unsure which of them apply to a report of this kind", "unsure which of them apply"], "note": "Đáp án: {D}. Bẫy: {A} Nhờ manager ký để chuyển trách nhiệm là né trách nhiệm, và vẫn chưa biết chính sách yêu cầu gì; {B} Thêm một dòng ghi chú AI có thể chỉ là một trong nhiều yêu cầu; {C} Hỏi khách hàng có phản đối không không thay được việc tuân thủ chính sách của chính công ty mình.", "ex": "Tại sao chọn đáp án đúng (“Establish what the policy requires for a deliverable of…”):\n\nKhi không chắc chính sách yêu cầu gì, bước đầu tiên là tìm hiểu cho rõ (đọc chính sách, hỏi người phụ trách) trước khi gửi. Làm một yêu cầu đoán được (thêm dòng ghi chú AI), đẩy trách nhiệm cho người khác ký, hay hỏi khách hàng đều không đảm bảo đã đáp ứng đúng chính sách.\n\nEstablish what the policy requires for a deliverable of this kind, before the report goes out: biết đủ các yêu cầu áp dụng (có thể gồm review, công bố, kiểm chứng...) rồi mới đáp ứng được đúng và đủ.\n\nMẹo nhớ: Dạng không chắc chính sách: tìm hiểu trước, làm sau. Bẫy: đoán một yêu cầu rồi gửi (B), đẩy trách nhiệm (A), hỏi nhầm người (C).\n\nTại sao các phương án khác sai\n“Ask her engagement manager to sign the report off,…”: Nhờ manager ký để chuyển trách nhiệm là né trách nhiệm, và vẫn chưa biết chính sách yêu cầu gì.\n\n“Add a short line stating the report was drafted…”: Thêm một dòng ghi chú AI có thể chỉ là một trong nhiều yêu cầu.\n\n“Ask the client whether they have any objection to…”: Hỏi khách hàng có phản đối không không thay được việc tuân thủ chính sách của chính công ty mình."}, {"n": 188, "cat": "T", "topic": 1, "q": "A school district's operations team wants Claude to work through the admissions criteria and produce the letters telling families whether their child has a place at an oversubscribed school. What should the team do first?", "o": ["Run the letters for one school first and see whether any family complains about the wording.", "Add an instruction telling Claude to apply the admissions criteria exactly as they are written.", "Separate deciding who gets a place from writing the letters, and keep the decision with staff.", "Ask Claude to restate the district's admissions criteria so the team can confirm it has them right."], "a": 2, "sk": ["whether their child has a place at an oversubscribed school", "oversubscribed school"], "note": "Đáp án: {C}. Bẫy: {A} Chạy thử cho một trường rồi đợi khiếu nại là thử trên gia đình thật, và chỉ quan tâm câu chữ, bỏ qua việc ai đang ra quyết định; {B} Dặn Claude áp tiêu chí đúng như văn bản vẫn để Claude ra quyết định tuyển sinh; {D} Nhờ Claude nhắc lại tiêu chí để xác nhận nó hiểu đúng vẫn ngầm định Claude sẽ là người quyết định.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Run the letters for one school…”; B = “Add an instruction telling Claude to…”; C = “Separate deciding who gets a place…”; D = “Ask Claude to restate the district's…”.\n\nTại sao chọn đáp án đúng (“Separate deciding who gets a place from writing the…”):\n\nQuyết định ai được nhận vào trường quá tải là quyết định có hậu quả lớn với trẻ em và gia đình, và cần người chịu trách nhiệm giải trình. Cách thiết kế đúng là tách hai việc: quyết định (do nhân viên giữ) và viết thư thông báo (Claude hỗ trợ tốt). Viết thư là việc ngôn ngữ; quyết định là việc trách nhiệm.\n\nĐáp án C separate deciding who gets a place from writing the letters và keep the decision with staff: Claude giúp phần soạn thư, còn quyết định có hậu quả lớn vẫn do con người đưa ra và chịu trách nhiệm.\n\nMẹo nhớ: Dạng tách quyết định và soạn thảo: việc có quyết định hậu quả lớn + phần viết → tách ra: người quyết định, Claude viết. Giống câu 32 (tín dụng) và câu 117 (tuyển dụng).\n\nTại sao các phương án khác sai\n“Run the letters for one school first and see…”: Chạy thử cho một trường rồi đợi khiếu nại là thử trên gia đình thật, và chỉ quan tâm câu chữ, bỏ qua việc ai đang ra quyết định.\n\n“Add an instruction telling Claude to apply the admissions…”: Dặn Claude áp tiêu chí đúng như văn bản vẫn để Claude ra quyết định tuyển sinh.\n\n“Ask Claude to restate the district's admissions criteria so…”: Nhờ Claude nhắc lại tiêu chí để xác nhận nó hiểu đúng vẫn ngầm định Claude sẽ là người quyết định."}, {"n": 189, "cat": "T", "topic": 5, "q": "A market research manager has been asked to summarise survey free-text responses that include respondents' names and employers, using the company's Claude for Work plan. In which order should these steps be taken?", "o": ["Remove the names and employers that the summary does not need; check what the participant consent and company policy allow; run the summary and review it before it is circulated; note what was removed so the result can be interpreted properly.", "Check what the participant consent and company policy allow; remove the names and employers that the summary does not need; run the summary and review it before it is circulated; note what was removed so the result can be interpreted properly.", "Run the summary and review it before it is circulated; check what the participant consent and company policy allow; remove the names and employers that the summary does not need; note what was removed so the result can be interpreted properly.", "Check what the participant consent and company policy allow; run the summary and review it before it is circulated; remove the names and employers that the summary does not need; note what was removed so the result can be interpreted properly."], "a": 1, "sk": ["include respondents' names and employers", "In which order should these steps be taken"], "note": "Đáp án: {B}. Bẫy: {A} Loại bỏ dữ liệu trước khi kiểm chính sách thì có thể loại thiếu (chính sách yêu cầu nhiều hơn) hoặc thừa; {C} Chạy tóm tắt đầu tiên là gửi tên và công ty vào Claude trước khi kiểm chính sách và trước khi che; {D} Chạy tóm tắt trước khi loại bỏ tên và công ty là gửi dữ liệu cá nhân không cần thiết vào Claude, rồi mới che thì đã muộn.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Remove the names and employers that…”; B = “Check what the participant consent and…”; C = “Run the summary and review it…”; D = “Check what the participant consent and…”.\n\nTại sao chọn đáp án đúng (“Check what the participant consent and company policy allow;…”):\n\nXử lý dữ liệu cá nhân trong nghiên cứu: kiểm tra trước sự đồng ý của người tham gia và chính sách công ty cho phép gì → loại bỏ tên và công ty mà bản tóm tắt không cần → chạy tóm tắt và review trước khi lưu hành → ghi chú những gì đã loại bỏ để người đọc hiểu đúng kết quả.\n\nĐáp án B đúng thứ tự: check consent and policy trước (biết được phép làm gì), rồi remove dữ liệu không cần (trước khi gửi vào Claude), run and review bản tóm tắt, cuối cùng note what was removed.\n\nMẹo nhớ: Dạng thứ tự xử lý dữ liệu cá nhân: Policy → Remove → Run & review → Note. Hai nguyên tắc: biết quy tắc trước khi hành động, và che trước khi gửi.\n\nTại sao các phương án khác sai\n“Remove the names and employers that the summary does…”: Loại bỏ dữ liệu trước khi kiểm chính sách thì có thể loại thiếu (chính sách yêu cầu nhiều hơn) hoặc thừa.\n\n“Run the summary and review it before it is…”: Chạy tóm tắt đầu tiên là gửi tên và công ty vào Claude trước khi kiểm chính sách và trước khi che.\n\n“Check what the participant consent and company policy allow;…”: Chạy tóm tắt trước khi loại bỏ tên và công ty là gửi dữ liệu cá nhân không cần thiết vào Claude, rồi mới che thì đã muộn."}, {"n": 190, "cat": "T", "topic": 3, "q": "A support-ticket triage prompt gives Claude a single sentence: \"Categorize this ticket.\" Categories come back inconsistent between runs, and the team wants a fix that addresses the root cause rather than adding post-processing. What should they change first?", "o": ["Route every ticket to a larger model on the assumption that added model capacity will infer the missing category definitions.", "Rewrite the prompt to list the exact categories, the desired output format, and the criteria for choosing between them.", "Have a reviewer manually relabel any ticket that looks miscategorized before the ticket reaches a customer-facing queue.", "Lower the temperature parameter to zero so sampling becomes deterministic and the same ticket always returns the same category."], "a": 1, "sk": ["\"Categorize this ticket.\"", "addresses the root cause"], "note": "Đáp án: {B}. Bẫy: {A} Model lớn hơn vẫn phải đoán danh mục khi prompt không định nghĩa; {C} Review và gắn nhãn lại thủ công chính là hậu xử lý mà nhóm muốn tránh, không sửa nguyên nhân; {D} Temperature 0 có thể làm cùng một ticket ra cùng một kết quả, nhưng danh mục vẫn do model tự nghĩ ra, có thể không khớp với danh mục nhóm cần.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Route every ticket to a larger…”; B = “Rewrite the prompt to list the…”; C = “Have a reviewer manually relabel any…”; D = “Lower the temperature parameter to zero…”.\n\nTại sao chọn đáp án đúng (“Rewrite the prompt to list the exact categories, the…”):\n\nPrompt không định nghĩa danh mục, định dạng output và tiêu chí phân loại buộc model tự nghĩ ra danh mục mỗi lần, nên kết quả thất thường. Nguyên nhân gốc là prompt thiếu đặc tả. Model lớn hơn hay temperature 0 không sửa được việc thiếu định nghĩa; review thủ công là hậu xử lý.\n\nĐáp án B sửa thẳng nguyên nhân gốc: list the exact categories, desired output format, và criteria for choosing between them. Model không còn phải tự đoán danh mục, nên kết quả nhất quán.\n\nMẹo nhớ: Dạng nguyên nhân gốc: output thất thường với prompt quá ngắn → thiếu đặc tả → định nghĩa rõ danh mục, định dạng, tiêu chí (giống câu 92). Bẫy: model lớn hơn, temperature 0, sửa tay sau.\n\nTại sao các phương án khác sai\n“Route every ticket to a larger model on the…”: Model lớn hơn vẫn phải đoán danh mục khi prompt không định nghĩa.\n\n“Have a reviewer manually relabel any ticket that looks…”: Review và gắn nhãn lại thủ công chính là hậu xử lý mà nhóm muốn tránh, không sửa nguyên nhân.\n\n“Lower the temperature parameter to zero so sampling becomes…”: Temperature 0 có thể làm cùng một ticket ra cùng một kết quả, nhưng danh mục vẫn do model tự nghĩ ra, có thể không khớp với danh mục nhóm cần."}, {"n": 191, "cat": "E", "topic": 4, "q": "An analyst wants to get more done inside her weekly allowance without the quality of her work dropping. Which sequence of working habits is correct?", "o": ["Decide what she needs before starting; put the request and the relevant material in the opening message; work through follow-ups that refer back to it; open a new chat for the next unrelated task.", "Open a new chat for the next unrelated task; decide what she needs before starting; work through follow-ups that refer back to it; put the request and the relevant material in the opening message.", "Work through follow-ups that refer back to it; open a new chat for the next unrelated task; decide what she needs before starting; put the request and the relevant material in the opening message.", "Put the request and the relevant material in the opening message; work through follow-ups that refer back to it; open a new chat for the next unrelated task; decide what she needs before starting."], "a": 0, "sk": ["get more done inside her weekly allowance without the quality of her work dropping", "weekly allowance"], "note": "Đáp án: {A}. Bẫy: {B} Bắt đầu bằng việc mở chat mới cho việc tiếp theo và kết thúc bằng tin nhắn mở đầu là đảo lộn trình tự của một task; {C} Hỏi tiếp trước khi có tin nhắn mở đầu và trước khi nghĩ rõ mình cần gì là vô lý; {D} Gửi tin nhắn mở đầu trước khi nghĩ rõ mình cần gì thì dễ phải bổ sung nhiều lượt, tốn hạn mức.", "ex": "Chữ cái trong giải thích theo thứ tự gốc: A = “Decide what she needs before starting;…”; B = “Open a new chat for the…”; C = “Work through follow-ups that refer back…”; D = “Put the request and the relevant…”.\n\nTại sao chọn đáp án đúng (“Decide what she needs before starting; put the request…”):\n\nDùng hạn mức hiệu quả: nghĩ rõ mình cần gì trước khi bắt đầu → đưa yêu cầu và tài liệu liên quan ngay trong tin nhắn đầu (tránh nhiều lượt bổ sung) → hỏi tiếp dựa trên nội dung đã có (không dán lại) → mở chat mới cho việc không liên quan (để context không phình to, vì mỗi lượt trong chat dài tốn hạn mức nhiều hơn).\n\nĐáp án A đúng trình tự tự nhiên của một task: decide what she needs → request and relevant material in the opening message → follow-ups that refer back → new chat for the next unrelated task. Mỗi bước giảm lượt thừa và context thừa.\n\nMẹo nhớ: Dạng thói quen tiết kiệm hạn mức: Plan → Front-load (yêu cầu + tài liệu trong tin đầu) → Follow up → New chat cho việc mới. Nghĩ trước khi hỏi, hỏi đủ ngay từ đầu, không để một chat ôm nhiều việc không liên quan.\n\nTại sao các phương án khác sai\n“Open a new chat for the next unrelated task;…”: Bắt đầu bằng việc mở chat mới cho việc tiếp theo và kết thúc bằng tin nhắn mở đầu là đảo lộn trình tự của một task.\n\n“Work through follow-ups that refer back to it; open…”: Hỏi tiếp trước khi có tin nhắn mở đầu và trước khi nghĩ rõ mình cần gì là vô lý.\n\n“Put the request and the relevant material in the…”: Gửi tin nhắn mở đầu trước khi nghĩ rõ mình cần gì thì dễ phải bổ sung nhiều lượt, tốn hạn mức."}, {"n": 192, "cat": "T", "topic": 4, "q": "A researcher is doing straightforward drafting work while several connectors and tools she does not need for it remain switched on. What is a reasonable step to make routine work leaner?", "o": ["Ask Claude in each message to avoid using any connector while she works on the drafting.", "Do the drafting inside a separate project that has no documents in its knowledge at all.", "Turn off the connectors and tools this task does not need, and switch them back on later.", "Remove the connectors from her account permanently, so nothing can call on them by mistake."], "a": 2, "sk": ["connectors and tools she does not need for it remain switched on", "connectors and tools she does not need"], "note": "Đáp án: {C}. Bẫy: {A} Dặn Claude trong mỗi tin nhắn đừng dùng connector vẫn để định nghĩa tool nằm trong context, và tốn công lặp lại; {B} Dùng Project không có tài liệu không liên quan tới connector và tool đang bật; {D} Gỡ vĩnh viễn khỏi tài khoản là quá tay: lần sau cần lại phải thiết lập lại từ đầu.", "ex": "Tại sao chọn đáp án đúng (“Turn off the connectors and tools this task does…”):\n\nMỗi connector và tool đang bật đều thêm định nghĩa vào context, tốn token và có thể khiến Claude gọi tool không cần thiết. Cách gọn nhẹ là tắt những gì task không cần và bật lại khi cần. Dặn Claude trong từng tin nhắn là thủ công; gỡ vĩnh viễn là quá tay.\n\nTurn off the connectors and tools this task does not need, rồi switch them back on later: context gọn hơn cho việc soạn thảo, mà vẫn dùng lại được khi cần, không mất cấu hình.\n\nMẹo nhớ: Dạng làm gọn context: tắt cái không cần, bật lại khi cần (giống câu 88: nạp tool theo nhu cầu). Bẫy: dặn bằng lời (A), lạc đề (B), gỡ vĩnh viễn (D).\n\nTại sao các phương án khác sai\n“Ask Claude in each message to avoid using any…”: Dặn Claude trong mỗi tin nhắn đừng dùng connector vẫn để định nghĩa tool nằm trong context, và tốn công lặp lại.\n\n“Do the drafting inside a separate project that has…”: Dùng Project không có tài liệu không liên quan tới connector và tool đang bật.\n\n“Remove the connectors from her account permanently, so nothing…”: Gỡ vĩnh viễn khỏi tài khoản là quá tay: lần sau cần lại phải thiết lập lại từ đầu."}, {"n": 193, "cat": "T", "topic": 3, "q": "Several engineers tell a site coordinator that Claude's shift-handover digests 'skip the open risks', but nobody says which risks or which shifts. Which two steps should the coordinator take first? Select two.", "o": ["Ask for two digests where an open risk was missed, with the missing risk actually named.", "Ask everyone to score every future digest out of ten so that a trend can be tracked over time.", "Compare those digests against the shift logs to see exactly what was left out of them.", "Switch the digests into a table format, since open risks may then be easier to spot in a table.", "Rewrite the shared project instructions straight away to stress that open risks matter most of all."], "a": [0, 2], "sk": ["nobody says which risks or which shifts"], "note": "Đáp án: {A} + {C}. Bẫy: {B} Chấm điểm mọi bản tóm tắt trong tương lai chỉ theo dõi xu hướng, không cho biết rủi ro nào bị sót và vì sao; {D} Đổi sang dạng bảng là đoán giải pháp khi chưa biết nguyên nhân; {E} Sửa instructions ngay để nhấn mạnh rủi ro là sửa mù: có thể nguyên nhân nằm ở dữ liệu đầu vào, không phải ở instructions.", "ex": "Tại sao chọn đáp án đúng (“Ask for two digests where an open risk was…” / “Compare those digests against the shift logs to see…”):\n\nFeedback mơ hồ cần được làm rõ trước khi sửa: xin ví dụ cụ thể (bản tóm tắt nào, rủi ro nào bị sót), và đối chiếu output với nguồn (nhật ký ca) để thấy chính xác thiếu gì. Có bằng chứng cụ thể mới chẩn đoán được: instructions, dữ liệu đầu vào hay định dạng. Sửa ngay theo cảm giác là sửa mù.\n\nXin two digests where an open risk was missed, có the missing risk actually named: biến feedback chung chung thành trường hợp cụ thể để phân tích.\n\nCompare those digests against the shift logs để thấy chính xác cái gì bị bỏ: bằng chứng khách quan về khoảng cách giữa nguồn và output.\n\nMẹo nhớ: Dạng feedback mơ hồ (giống câu 175): bước đầu = Specific examples + Compare against source. Bẫy: sửa ngay (E), đổi định dạng (D), theo dõi chung chung (B).\n\nTại sao các phương án khác sai\n“Ask everyone to score every future digest out of…”: Chấm điểm mọi bản tóm tắt trong tương lai chỉ theo dõi xu hướng, không cho biết rủi ro nào bị sót và vì sao.\n\n“Switch the digests into a table format, since open…”: Đổi sang dạng bảng là đoán giải pháp khi chưa biết nguyên nhân.\n\n“Rewrite the shared project instructions straight away to stress…”: Sửa instructions ngay để nhấn mạnh rủi ro là sửa mù: có thể nguyên nhân nằm ở dữ liệu đầu vào, không phải ở instructions."}];
const COURSE_CH = [{"id": 1, "title": "Giao việc cho AI, đạo đức & truyền thông", "rules": ["Quyết định <b>tác động lớn đến con người</b> (tuyển dụng, thăng chức, tín dụng, chẩn đoán, pháp lý gửi khách) → <b>không giao toàn quyền</b> cho Claude; Claude chỉ hỗ trợ, <b>con người giữ quyền quyết định</b> và trách nhiệm.", "Claude mạnh ở <b>soạn nháp, tổng hợp nhiều nguồn, viết theo giọng/đối tượng</b> cho người duyệt phía sau. Không hợp: tính toán chính xác thời gian thực, giám sát luồng dữ liệu live, cam kết ràng buộc pháp lý.", "Delegation dựa vào <b>khả năng đảo ngược</b>, <b>hậu quả khi sai</b>, và mức cần <b>phán đoán / sáng tạo / thấu cảm</b> của con người — không dựa vào độ dài quy trình hay chức danh người làm.", "Diligence: <b>con người vẫn chịu trách nhiệm</b> với sản phẩm có AI hỗ trợ → xác định phần phải tự kiểm/ sửa trước khi giao, minh bạch về việc dùng AI.", "Truyền thông với stakeholder: nói <b>trung thực</b> Claude làm được gì, <b>giới hạn / lỗi đã biết</b>, và <b>chỗ con người vẫn quyết định</b>. Bẫy: phóng đại (\"không bao giờ sai\", \"không cần người review\") hoặc nói mơ hồ.", "Đạo đức: tránh <b>khái quát hoá về nhóm người</b>, kiểm tra <b>công bằng</b> (câu hỏi áp dụng như nhau cho mọi ứng viên), rủi ro lớn nhất là <b>bất lợi có hệ thống cho nhóm được bảo vệ</b>.", "Thứ tự đánh giá use case / escalate: <b>đối tượng & tác động</b> trước → đánh giá output / đối chiếu chính sách → <b>quyết định</b> (dùng, sửa, escalate) → <b>ghi lại lý do</b> cuối cùng."]}, {"id": 2, "title": "Prompt & quản lý context", "rules": ["Prompt tốt (Description) = <b>nhiệm vụ rõ ràng</b> + <b>context</b> (đối tượng, mục tiêu) + <b>định dạng đầu ra</b> + <b>ràng buộc</b> (độ dài, giọng). Prompt chỉ nêu chủ đề mà thiếu task/audience/format → output mơ hồ.", "Có nhiều câu hỏi bắt buộc → <b>liệt kê rõ từng câu</b> trong task statement và yêu cầu trả lời đủ; đừng gộp trong một đoạn ngăn bằng dấu phẩy.", "Chọn chiến lược theo loại việc: việc <b>sáng tạo / brainstorm</b> → prompt mở; báo cáo theo <b>schema cố định</b> → template chặt; tổng hợp đối thủ → <b>research có nguồn</b>. Không dùng một template cho mọi việc.", "Context window: <b>chỉ đưa phần liên quan</b>, cắt bớt thứ thừa, <b>đánh dấu / tiêu đề tách từng nguồn</b>, đặt tài liệu quan trọng <b>ở đầu hoặc cuối</b>. Bẫy: dán toàn bộ, trộn nguồn không ranh giới.", "Hội thoại dài: <b>tóm tắt quyết định</b> định kỳ, <b>nhắc lại mục tiêu/ràng buộc</b> khi đổi chủ đề; chuyển sang chat mới thì tóm tắt → xác định tài liệu cần giữ → đưa vào Project → mở chat mới → kiểm tra đúng hướng.", "Dữ liệu nhiều bản ghi → <b>bảng</b> (mỗi dòng một bản ghi, mỗi cột một chỉ số). Đối tượng bận (nhà đầu tư) → <b>kết quả chính lên đầu</b>."]}, {"id": 3, "title": "Đánh giá, xác minh & lặp cải tiến", "rules": ["Discernment: giọng văn tự tin chỉ là <b>hợp lý</b>, chưa phải <b>đã xác minh</b> → kiểm tra <b>từng claim</b> với nguồn / tài liệu đầu vào một cách hệ thống, không chỉ đọc mở bài và kết luận.", "Claim không có nguồn / nhiều bài báo lặp lại một con số / hai nguồn mâu thuẫn → tìm <b>nguồn gốc (primary, authoritative)</b>; không lấy trung bình, không chọn số đẹp, không để người đọc tự chọn.", "Nghi hallucination → việc đầu tiên là <b>chỉ ra đúng claim không có căn cứ</b>. Output dùng nguồn chọn lọc (bỏ chi phí, rủi ro) → <b>re-prompt</b> để bổ sung, không phải loại bỏ cả bài.", "Tiêu chí đánh giá phải gắn với <b>mục đích</b>: độ chính xác so với nguồn, đầy đủ theo yêu cầu, đúng format/độ dài, phù hợp đối tượng. Bẫy: số chữ, văn phong, có executive summary hay không.", "Lặp prompt: <b>mỗi lần đổi một yếu tố</b>, ghi lại tác dụng, so với tiêu chí ban đầu. Output lệch dần → <b>quay về bản tốt nhất</b>. Chững lại sau nhiều lần → <b>lợi ích giảm dần</b>, chuyển người review / cách khác.", "Phản hồi: ghi <b>cụ thể</b> → biến thành 1–2 điều chỉnh có mục tiêu → chạy vòng sau và so sánh → ghi lại. Phản hồi mơ hồ → <b>hỏi lại</b> trước khi sửa; chỉ sửa đúng chỗ được góp ý.", "Thứ tự review: đọc toàn bộ để có ấn tượng → xác định claim / so với tiêu chí & nguồn → <b>ghi lại lỗi</b> → quyết định dùng, sửa hay escalate."]}, {"id": 4, "title": "Projects, Memory, Skills & chọn model", "rules": ["Tài liệu dùng chung qua <b>nhiều chat, nhiều người</b> → <b>Project</b> (knowledge base + custom instructions). Knowledge base chỉ chứa tài liệu <b>hiện hành, liên quan</b>; không nhồi email cũ, phiên bản cũ, hồ sơ của workflow khác.", "Custom instructions: mục đích, <b>giọng thương hiệu</b>, <b>cấu trúc & độ dài chuẩn</b>, ràng buộc chính sách cụ thể. Tạo Project: <b>xác định mục đích trước</b> → thêm tài liệu/hướng dẫn → test → mời cộng tác.", "Output trôi dần → <b>rà lại instructions & tài liệu</b> so với chuẩn hiện tại trước; cấu hình cần review <b>định kỳ</b>, không phải \"làm một lần dùng mãi\".", "Memory: dọn mục <b>cũ / sai / không còn liên quan</b>, sao lưu trước khi sửa; dữ liệu mật → <b>Incognito</b> hoặc tắt đóng góp Memory; hai khách hàng → <b>hai Project tách biệt</b> để tránh lẫn context.", "Tính toán chính xác, biểu đồ từ file → <b>Code Execution</b> (rồi vẫn kiểm kết quả). Skill + tài liệu + instructions bổ trợ nhau trong Project.", "Model: <b>Haiku</b> nhanh, nhẹ, độ trễ thấp; <b>Sonnet</b> cân bằng cho việc hằng ngày; <b>Opus</b> mạnh nhất cho suy luận phức tạp. Model mạnh hơn → chậm hơn và tốn rate limit hơn. Chọn theo yêu cầu chất lượng/độ trễ/khối lượng, không theo giá hay tên."]}, {"id": 5, "title": "Dữ liệu nhạy cảm, quyền riêng tư & governance", "rules": ["Trước khi đưa tài liệu vào Claude: <b>phân loại & xác định trường nhạy cảm</b> trước → rồi mới redact → gửi → kiểm lại.", "Chỉ đưa <b>phần cần cho nhiệm vụ</b>; <b>redact / ẩn danh</b> định danh chính phủ, số thẻ, địa chỉ, lương gắn tên, hồ sơ nhân sự. Bẫy: gửi nguyên file kèm lời dặn \"đừng nhắc tới\", thay định danh này bằng định danh khác.", "Chính sách cấm nhập một loại thông tin → <b>không nhập</b> (kể cả Incognito hay bản diễn đạt lại) và <b>hỏi kênh được duyệt</b>.", "Sandbox của Code Execution <b>không thay<         ${last ? `<button class="btn primary" ${cAttr({ v: "q", l: last.id, i: Math.min(CS.last.i, cOrder[last.id].length - 1) })}>Học tiếp: Chương ${last.ch.id} · ${esc(last.name)}</button>` : `<button class="btn primary" ${cAttr({ v: "ch", c: 1 })}>Bắt đầu Chương 1</button>`}
        <button class="btn" id="cshuffle">Đảo lại câu và đáp án</button>
        ${cHlBtn()}
        <button class="btn" id="coursehome">Về trang thi thử</button>
      </div>
    </div></div>
    <main class="wrap start">
      <section><h2>Chọn chương</h2><div class="setgrid">${COURSE_CH.map(c => { const st = cSumStatus(c.lessons, cChapterNs(c.id).length); return `<button class="setcard" ${cAttr({ v: "ch", c: c.id })}><b>Chương ${c.id}</b><span class="setstat ${st.cls}">${st.text}</span><span class="setscen">${esc(c.title)}</span></button>`; }).join("")}</div></section>
      ${cEdgeCard()}
      <div class="note"><b>Cách học.</b> Đọc quy tắc của chương, làm bài câu dễ rồi tới câu khó. Sau khi trả lời, chỉ tô đáp án đúng, một cụm <b>khoảng 4–6 chữ có nghĩa</b>: nếu phần đầu đáp án đúng <b>không trùng với bất kỳ đáp án nào khác trong cả khóa</b> (khoảng ${COURSE_Q.reduce((s, q) => s + q.o.length, 0)} đáp án) thì nhớ cụm đầu (dòng "Nhớ đầu:", ví dụ "Define the purpose of the Project"); nếu không thì nhớ cụm đuôi (dòng "Nhớ đuôi:", ví dụ "verify the figure in the primary source"). Phương án sai không được tô, không bôi vàng cụm đầu chung. Mỗi lần vào một bài, bài đó được làm lại từ đầu (đảo câu và đáp án); kết quả lần gần nhất của từng bài được lưu trong trình duyệt này. Nút "Học tiếp" quay lại đúng chỗ đang làm dở.</div>
    </main>`;
}
function courseChapter(id) {
  const c = COURSE_CH.find(x => x.id === id) || COURSE_CH[0], ns = cChapterNs(c.id), st = cSumStatus(c.lessons, ns.length);
  const prev = COURSE_CH.find(x => x.id === c.id - 1), next = COURSE_CH.find(x => x.id === c.id + 1);
  return `<div class="hero"><div class="wrap">
      <div class="eyebrow">Khóa ôn · Chương ${c.id}/${COURSE_CH.length}</div>
      <h1>${esc(c.title)}</h1>
      <ul class="herofacts"><li><b>${ns.length}</b>câu</li><li><b>${c.lessons.length}</b>bài</li><li><b>${cSum(c.lessons).k}/${c.lessons.length}</b>bài đã học</li><li><b>${cSum(c.lessons).R}</b>câu đúng</li></ul>
      <div class="actions">
        <button class="btn primary" ${cAttr({ v: "q", l: c.lessons[0].id, i: 0, fresh: 1 })}>Vào bài đầu tiên</button>
        <button class="btn" ${cAttr({ v: "home" })}>Về khóa ôn</button>
      </div>
    </div></div>
    <main class="wrap start">
      <section><h2>Bài học</h2><div class="setgrid">${c.lessons.map(l => { const s = cLessonStatus(l); return `<button class="setcard" ${cAttr({ v: "q", l: l.id, i: 0, fresh: 1 })}><b>${esc(l.name)}</b><span class="setstat ${s.cls}">${s.text}</span><span class="setscen">${l.cat === "E" ? "Câu dễ — đề hoặc đáp ngắn, ít nhiễu" : "Câu khó — nhớ đầu hoặc đuôi đáp án đúng"}</span></button>`; }).join("")}</div></section>
      <h2 class="rulehead">Quy tắc cần nhớ</h2>
      <section class="card sigcard drop"><h2>🚫 Thấy là loại</h2><p class="sub">Chưa từng là đáp án đúng trong ${COURSE_Q.length} câu — gặp là gạch luôn. Số nhỏ = số lần đúng / tổng số lần xuất hiện.</p>${cSigTable((C_SIG[c.id] || {}).drop, "drop")}</section>
      <section class="card sigcard pick"><h2>✅ Thấy là chọn</h2><p class="sub">Chưa từng nằm ở phương án sai trong ${COURSE_Q.length} câu.</p>${cSigTable((C_SIG[c.id] || {}).pick, "pick")}</section>
      <section class="card sigcard both"><h2>⚖️ Hai mặt</h2><p class="sub">Đã từng là đáp án đúng và cũng từng là bẫy (dù chỉ 1 lần) — phải đọc tình huống, xem ở câu khó.</p>${cSigTable((C_SIG[c.id] || {}).both, "both")}</section>
      <details class="card rulesmore"><summary>Từ khóa trong đề → đáp án (bấm để mở)</summary><ol class="crules">${c.rules.map(r => `<li>${r}</li>`).join("")}</ol></details>
      <div class="actions">${prev ? `<button class="btn" ${cAttr({ v: "ch", c: prev.id })}>← Chương ${prev.id}</button>` : ""}${next ? `<button class="btn" ${cAttr({ v: "ch", c: next.id })}>Chương ${next.id} →</button>` : ""}</div>
    </main>`;
}
function cNote(q) {
  const p = cPerm[q.n];
  return fmt(q.note).replace(/\{([A-E])\}/g, (m, k) => { const i = p.indexOf(C_LET.indexOf(k)); return i >= 0 ? `<b>${LETTERS[i]}</b>` : k; });
}
function cReview(q, mine) {
  const p = cPerm[q.n];
  const ro = p.map((orig, shown) => {
    const is = cIsA(q, orig), picked = cPicked(mine, orig);
    const why = is && picked ? "Đúng · bạn chọn" : is ? "Đáp án đúng" : picked ? "Bạn chọn" : "";
    return `<div class="${is ? "is" : picked ? "wrongpick" : ""}"><span class="ltr">${LETTERS[shown]}</span><span>${cOpt(q.o[orig], is, true, q, orig)}</span><span class="why">${why}</span></div>`;
  }).join("");
  return `<div class="ro">${ro}</div>${cAns(q).map(o => { const c = cCueOf(q, o); return `<p class="tailhint"><b>${esc(c.title)}:</b> ${esc(c.text)}</p>`; }).join("")}<p class="exp">${cNote(q)}</p><details class="cdet"><summary>Giải thích chi tiết</summary><p>${fmt(FINAL_E[q.n] || q.ex)}</p></details>`;
}
function courseQuestion(l, i) {
  const ord = cOrder[l.id], n = ord[i], q = CQ_BY[n], mine = A(l)[n], done = mine != null;
  const showKw = CS.hl;
  const d = cDone(ord, l);
  const opts = done ? cReview(q, mine) : `<div class="opts">${cPerm[n].map((orig, shown) => `<label class="opt${Array.isArray(q.a) ? " multi" : ""}${(cPend[n] || []).includes(orig) ? " sel" : ""}" for="co${orig}"><input type="${Array.isArray(q.a) ? "checkbox" : "radio"}" name="cans" id="co${orig}" data-copt="${orig}" ${(cPend[n] || []).includes(orig) ? "checked" : ""}><span class="ltr">${LETTERS[shown]}</span><span>${cOpt(q.o[orig], orig === q.a, false, q, orig)}</span></label>`).join("")}</div>`;
  const cells = ord.map((m, j) => { const a = A(l)[m]; return `<button class="cell ${a == null ? "" : cOk(CQ_BY[m], a) ? "cok" : "cno"} ${j === i ? "cur" : ""}" ${cAttr({ v: "q", l: l.id, i: j })} aria-label="Câu ${j + 1}">${j + 1}</button>`; }).join("");
  const last = i === ord.length - 1;
  return `<div class="bar"><div class="wrap">
      <span class="code">Khóa ôn · Chương ${l.ch.id}</span><span class="prog">Câu ${i + 1}/${ord.length} · đã làm ${d}</span><span class="spacer"></span>
      ${cHlBtn()}
      <button class="btn maptoggle" id="maptoggle">Danh sách câu</button>
      <button class="btn" ${cAttr({ v: "ch", c: l.ch.id })}>Về chương</button>
    </div><div class="pbar" role="progressbar" aria-label="Tiến độ bài" aria-valuemin="0" aria-valuemax="${ord.length}" aria-valuenow="${d}"><span style="width:${d / ord.length * 100}%"></span></div></div>
    <main class="wrap exam">
      <div>
        <div class="scen"><b>${cRound[l.id] ? `Vòng ôn câu sai ${cRound[l.id]} · ` : ""}${esc(l.name)} · Chương ${l.ch.id}: ${esc(l.ch.title)}</b>${l.cat === "E" ? "Câu dễ: nhớ đầu hoặc đuôi ngắn của đáp án đúng." : "Câu khó: nhớ đầu hoặc đuôi ngắn của đáp án đúng."}</div>
        <section class="sheet">
          <div class="qhead"><span class="eyebrow">Câu ${i + 1} · câu gốc #${q.n}</span><span class="mark ${l.cat === "E" ? "ok" : "blank"}">${l.cat === "P" ? "Cặp bẫy" : l.cat === "E" ? "Dễ" : "Khó"}</span></div>
          <p class="stem">${showKw ? cMark(q.q, q.sk) : fmt(q.q)}</p>
          ${done ? `<p class="instr"><span class="mark ${cOk(q, mine) ? "ok" : "no"}">${cOk(q, mine) ? "Đúng" : "Sai"}</span>${l.label ? ` <span class="clabel">Đáp án câu này: <b>${esc(l.label[n])}</b></span>` : ""}</p>` : `<p class="instr">${Array.isArray(q.a) ? `Select ${COUNT[q.a.length] || q.a.length}. <span class="clabel">(đã chọn ${(cPend[n] || []).length}/${q.a.length})</span>` : "Select ONE."}</p>`}
          ${opts}
          <div class="navrow">
            <button class="btn" ${cAttr({ v: "q", l: l.id, i: i - 1 })} ${i === 0 ? "disabled" : ""}>Câu trước</button>
            <span class="spacer"></span>
            ${last ? `<button class="btn primary" ${cAttr({ v: "sum", l: l.id })}>Xem kết quả bài</button>` : `<button class="btn primary" ${cAttr({ v: "q", l: l.id, i: i + 1 })}>Câu tiếp</button>`}
          </div>
        </section>
      </div>
      <aside class="map ${mapOpen ? "open" : ""}" aria-label="Danh sách câu"><h2>Danh sách câu</h2><div><h3>${esc(l.name)}<span>${d}/${ord.length}</span></h3><div class="cells">${cells}</div></div>
        <div class="legend"><span><i class="cok"></i>Đúng (${cRight(ord, l)})</span><span><i class="cno"></i>Sai (${d - cRight(ord, l)})</span></div>
        <p class="ckeys">Phím tắt: 1–5 hoặc A–E để chọn, ← → để chuyển câu.</p></aside>
    </main>`;
}
function courseSummary(l) {
  const ord = cOrder[l.id], round = cRound[l.id] || 0;
  const d = cDone(ord, l), r = cRight(ord, l), wrongRound = ord.filter(n => A(l)[n] != null && !cOk(CQ_BY[n], A(l)[n]));
  const left = ord.findIndex(n => A(l)[n] == null);
  const wrongAll = l.ns.filter(n => !cOk(CQ_BY[n], A(l)[n])), mastered = !wrongAll.length;
  const known = l.ns.length - wrongAll.length, first = (CS.res || {})[l.id];
  const idx = C_LESSONS.indexOf(l), nx = C_LESSONS[idx + 1];
  const shown = ord.filter(n => cFilter === "all" ? A(l)[n] != null : cFilter === "wrong" ? wrongRound.includes(n) : cOk(CQ_BY[n], A(l)[n]));
  const cards = shown.map(n => { const q = CQ_BY[n], ok = cOk(q, A(l)[n]); return `<article class="rev"><div class="top"><span class="mark ${ok ? "ok" : "no"}">${ok ? "Đúng" : "Sai"}</span><b>Câu ${ord.indexOf(n) + 1}</b><span>Câu gốc #${n}</span><span>${l.label ? esc(l.label[n]) : l.cat === "E" ? "Dễ" : "Khó"}</span></div><p class="stem">${CS.hl ? cMark(q.q, q.sk) : fmt(q.q)}</p>${cReview(q, A(l)[n])}</article>`; }).join("");
  const nextBtn = nx ? (nx.ch !== l.ch ? `<button class="btn primary" ${cAttr({ v: "ch", c: nx.ch.id })}>Sang Chương ${nx.ch.id}</button>` : `<button class="btn primary" ${cAttr({ v: "q", l: nx.id, i: 0, fresh: 1 })}>Bài tiếp: ${esc(nx.name)}</button>`) : `<button class="btn primary" ${cAttr({ v: "home" })}>Hoàn thành khóa ôn</button>`;
  const main = left >= 0 ? `<button class="btn primary" ${cAttr({ v: "q", l: l.id, i: left })}>Làm tiếp (còn ${ord.length - d} câu)</button>`
    : !mastered ? `<button class="btn primary" id="cloop">Ôn lại ${wrongAll.length} câu sai (vòng ${round + 1})</button>`
    : nextBtn;
  const tag = left >= 0 ? ["", "CHƯA XONG"] : mastered ? ["pass", "ĐÃ THUỘC HẾT"] : ["fail", `CÒN ${wrongAll.length} CÂU SAI`];
  return `<div class="hero"><div class="wrap">
      <div class="eyebrow">Kết quả ${round ? `vòng ôn câu sai ${round}` : "bài"} · Chương ${l.ch.id} · ${esc(l.ch.title)}</div>
      <div class="verdict">
        <div class="score">${r}<small> /${ord.length}</small></div>
        <div><span class="tag ${tag[0]}">${tag[1]}</span>
          <p class="facts">${esc(l.name)} · ${round ? `vòng ${round}: ` : ""}đã làm ${d}/${ord.length} · sai ${wrongRound.length} · đã thuộc ${known}/${l.ns.length} câu của bài</p>
          <p class="facts">${mastered ? "Bạn đã trả lời đúng mọi câu của bài, có thể sang bài tiếp." : "Phải ôn lại đến khi đúng hết các câu sai mới được sang bài tiếp."}${first ? ` Lần làm đầu: đúng ${first.r}/${first.n}.` : ""}</p></div>
      </div>
      <div class="actions">${main}<button class="btn" ${cAttr({ v: "ch", c: l.ch.id })}>Về chương</button></div>
    </div></div>
    <main class="wrap result">
      <section><h2>Xem lại và giải thích</h2>
        <div class="filters">${[["all", "Tất cả", d], ["wrong", "Sai", wrongRound.length], ["right", "Đúng", r]].map(([k, t, c]) => `<button class="chip" data-cf="${k}" aria-pressed="${cFilter === k}">${t} (${c})</button>`).join("")}</div>
        <div class="reviews">${cards || `<p class="empty">Không có câu nào khớp bộ lọc này.</p>`}</div>
      </section>
    </main>`;
}
function courseView() {
  if (cpos.v === "ch") return courseChapter(cpos.c);
  if (cpos.v === "q" && C_LB[cpos.l]) return courseQuestion(C_LB[cpos.l], Math.max(0, Math.min(cpos.i, cOrder[cpos.l].length - 1)));
  if (cpos.v === "sum" && C_LB[cpos.l]) return courseSummary(C_LB[cpos.l]);
  return courseHome();
}
function cAnswer(orig) {
  const l = C_LB[cpos.l]; if (!l) return;
  const n = cOrder[l.id][cpos.i];
  if (A(l)[n] != null) return;
  const q = CQ_BY[n];
  if (Array.isArray(q.a)) {
    const p = cPend[n] = cPend[n] || [], j = p.indexOf(orig);
    if (j >= 0) p.splice(j, 1); else p.push(orig);
    if (p.length < q.a.length) { render("co" + orig); return; }
    A(l)[n] = p.slice().sort((x, y) => x - y); delete cPend[n];
  } else A(l)[n] = orig;
  if (!cRound[l.id] && cDone(l.ns, l) === l.ns.length) { CS.res = CS.res || {}; CS.res[l.id] = { r: cRight(l.ns, l), n: l.ns.length, at: Date.now() }; }
  cSave(); render();
}
function cLoop() {
  const l = C_LB[cpos.l]; if (!l) return;
  const redo = l.ns.filter(n => !cOk(CQ_BY[n], A(l)[n]));
  if (!redo.length) return;
  redo.forEach(n => { delete A(l)[n]; cPerm[n] = shuffled(CQ_BY[n].o.length, Math.random); });
  cOrder[l.id] = shuffled(redo.length, Math.random).map(i => redo[i]);
  cRound[l.id] = (cRound[l.id] || 0) + 1;
  cSave(); cGo({ v: "q", l: l.id, i: 0 });
}
function courseClick(t) {
  if (t.dataset.cgo !== undefined) { cGo(JSON.parse(t.dataset.cgo)); return true; }
  if (t.dataset.cf) { cFilter = t.dataset.cf; render(); return true; }
  switch (t.id) {
    case "opencourse": openCourse(); return true;
    case "coursehome": closeCourse(); return true;
    case "cshuffle": cShuffle(); render(); return true;
    case "chl": CS.hl = !CS.hl; cSave(); render("chl"); return true;
    case "cloop": cLoop(); return true;
    case "maptoggle": if (courseOpen) { mapOpen = !mapOpen; render(); return true; } return false;
  }
  return false;
}
function courseKey(e) {
  if (!courseOpen || cpos.v !== "q" || modal || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== "radio") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const l = C_LB[cpos.l]; if (!l) return;
  const k = e.key.toUpperCase(), idx = "12345".includes(k) && k.length === 1 ? "12345".indexOf(k) : k.length === 1 ? C_LET.indexOf(k) : -1;
  const n = cOrder[l.id][cpos.i];
  if (idx >= 0 && A(l)[n] == null && cPerm[n][idx] != null) { e.preventDefault(); cAnswer(cPerm[n][idx]); }
  else if (e.key === "ArrowRight") { e.preventDefault(); cGo(cpos.i < cOrder[l.id].length - 1 ? { v: "q", l: l.id, i: cpos.i + 1 } : { v: "sum", l: l.id }); }
  else if (e.key === "ArrowLeft" && cpos.i > 0) { e.preventDefault(); cGo({ v: "q", l: l.id, i: cpos.i - 1 }); }
}

function render(focusId) {
  app.innerHTML = courseView();
  if (focusId) document.getElementById(focusId)?.focus();
}
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  courseClick(t);
});
app.addEventListener("change", e => {
  if (e.target.dataset.copt !== undefined) return cAnswer(+e.target.dataset.copt);
});
document.addEventListener("keydown", e => { courseKey(e); });
courseOpen = true;
cSave();
render();
</script>
