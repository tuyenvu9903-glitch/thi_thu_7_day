2, 4”: đối chiếu chi tiết trước khi đọc tổng thể để hiểu bối cảnh.\n\n“1, 3, 5, 2, 4”: so sánh với nguồn trước khi xác nhận tiêu chí đánh giá.\n\n“5, 3, 1, 2, 4”: đọc và hình thành ấn tượng trước khi có tiêu chí, dễ bị thiên lệch."}, {"n": 31, "cat": "T", "topic": 3, "q": "A project manager is turning a Claude-generated draft into a polished board memo. The board reviews the memo before the meeting and expects it to be scannable, factually verified, and consistent with the organization’s standard terminology. Which set of refinements is most suitable?", "o": ["Apply consistent headings, tighten wording for executive scanability, align terminology with the organization’s standards, and verify each fact against source data.", "Apply consistent headings, expand each section to give the board full context, and align terminology with the organization's standards.", "Tighten wording for executive scanability and verify each fact against source data; leave heading structure and terminology as written to preserve the draft’s voice.", "Apply consistent headings and align terminology with the organization’s standards; rely on Claude’s verification of facts, since the draft was generated from the source data."], "a": 0, "sk": ["scannable, factually verified, and consistent"], "note": "Đáp án: {A}. Bẫy: {B} mở rộng từng phần đi ngược yêu cầu scannable và bỏ qua xác minh dữ kiện; {C} giữ nguyên tiêu đề và thuật ngữ vi phạm yêu cầu về thuật ngữ chuẩn; {D} dựa vào việc Claude tự xác minh là bỏ qua bước fact-check độc lập.", "ex": "Tại sao chọn đáp án đúng (“Apply consistent headings, tighten wording for executive scanability, align…”):\n\nBoard cần memo dễ đọc lướt (scannable), dữ kiện đã được xác minh và thuật ngữ chuẩn của tổ chức. Chỉ phương án đúng đáp ứng đủ cả ba: tiêu đề nhất quán, câu chữ gọn cho lãnh đạo đọc nhanh, thuật ngữ đúng chuẩn, và kiểm tra từng dữ kiện với dữ liệu nguồn. Nội dung do AI tạo không loại bỏ được nhu cầu fact-check độc lập.\n\nTại sao các phương án khác sai\n“Apply consistent headings, expand each section to give the…”: mở rộng từng phần đi ngược yêu cầu scannable và bỏ qua xác minh dữ kiện.\n\n“Tighten wording for executive scanability and verify each fact…”: giữ nguyên tiêu đề và thuật ngữ vi phạm yêu cầu về thuật ngữ chuẩn.\n\n“Apply consistent headings and align terminology with the organization’s…”: dựa vào việc Claude tự xác minh là bỏ qua bước fact-check độc lập."}, {"n": 32, "cat": "T", "topic": 2, "q": "You are an operations lead assessing prompting strategies proposed by teammates for different task types. Which two strategies are suitable matches between the strategy and task type? Each correct answer provides part of the solution.", "o": ["rigid templated prompting for early-stage creative naming and tagline ideation", "open exploratory prompting for legal contract redlining against a clause library", "open exploratory prompting for early-stage strategic brainstorming on a new market", "rigid templated prompting for casual customer-feedback summarization with no schema", "rigid templated prompting for monthly compliance reports against a fixed schema"], "a": [2, 4], "sk": ["different task types"], "note": "Đáp án: {C} + {E}. Bẫy: {A} ý tưởng tên và tagline cần sáng tạo tự do, template cứng sẽ kìm hãm; {B} redline hợp đồng theo thư viện điều khoản cần độ chính xác và cấu trúc, không hợp với prompt mở; {D} tóm tắt phản hồi không có schema thì không cần template cứng.", "ex": "Tại sao chọn đáp án đúng (“open exploratory prompting for early-stage strategic brainstorming on a…” / “rigid templated prompting for monthly compliance reports against a…”):\n\nChiến lược prompt phải khớp với bản chất task. Prompt mở, khám phá (open exploratory) phù hợp với brainstorming chiến lược giai đoạn đầu cho thị trường mới, vì cần tư duy phân kỳ. Prompt theo template cứng (rigid templated) phù hợp với báo cáo compliance hằng tháng theo schema cố định, vì cần lặp lại và đúng cấu trúc.\n\nTại sao các phương án khác sai\n“rigid templated prompting for early-stage creative naming and tagline…”: ý tưởng tên và tagline cần sáng tạo tự do, template cứng sẽ kìm hãm.\n\n“open exploratory prompting for legal contract redlining against a…”: redline hợp đồng theo thư viện điều khoản cần độ chính xác và cấu trúc, không hợp với prompt mở.\n\n“rigid templated prompting for casual customer-feedback summarization with no…”: tóm tắt phản hồi không có schema thì không cần template cứng."}, {"n": 33, "cat": "E", "topic": 4, "q": "A learning specialist is setting up a Claude Project for a recurring course-design workflow. Which configuration approach makes the best use of a Skill together with other Project elements?", "o": ["Configure the Project with custom instructions that contradict the Skill’s documented purpose, creating ambiguity about which guidance Claude should follow within the recurring course-design workflow.", "Add the relevant Skill to the Project, upload the supporting knowledge sources, and write custom instructions that reference both the Skill and the knowledge.", "Upload the supporting knowledge sources but disable the relevant Skill, eliminating the packaged capability the workflow needs and forcing each chat to reconstruct the procedure manually.", "Add the Skill to the Project but omit the supporting knowledge sources and any custom instructions, so the Project lacks the reference content and persistent guidance the workflow requires."], "a": 1, "sk": ["Skill together with other Project elements"], "note": "Đáp án: {B}. Bẫy: {A} instructions mâu thuẫn với Skill gây mơ hồ cho Claude; {C} tắt Skill khiến mỗi chat phải tự dựng lại quy trình; {D} chỉ có Skill mà thiếu tài liệu và instructions thì Project thiếu context và định hướng.", "ex": "Tại sao chọn đáp án đúng (“Add the relevant Skill to the Project, upload the…”):\n\nMỗi thành phần đóng vai trò bổ trợ: Skill cung cấp quy trình chuyên biệt, lặp lại được; knowledge base của Project cung cấp context tham chiếu bền vững; custom instructions định hướng các chat. Cấu hình tốt nhất là thêm Skill phù hợp, upload tài liệu hỗ trợ và viết custom instructions tham chiếu tới cả Skill lẫn knowledge, để ba thành phần hoạt động thống nhất.\n\nTại sao các phương án khác sai\n“Configure the Project with custom instructions that contradict the…”: instructions mâu thuẫn với Skill gây mơ hồ cho Claude.\n\n“Upload the supporting knowledge sources but disable the relevant…”: tắt Skill khiến mỗi chat phải tự dựng lại quy trình.\n\n“Add the Skill to the Project but omit the…”: chỉ có Skill mà thiếu tài liệu và instructions thì Project thiếu context và định hướng."}, {"n": 34, "cat": "T", "topic": 6, "q": "An operations assistant is using Claude to help optimize an existing intake workflow. The assistant can access the current process documentation and recent cycle-time data. Which activity makes the best use of Claude to support this process-optimization task?", "o": ["Generate an optimized version of the intake process based on industry benchmarks, then compare it to the current process to identify gaps.", "Apply Claude to predict the cycle-time impact of each proposed change and rank them so the team can implement improvements in priority order.", "Map the current intake process, identify likely bottlenecks based on the cycle-time data, and propose optimization options for human review.", "Use Claude to interview each team member who works on the intake process and synthesize the interview output into a redesigned workflow."], "a": 2, "sk": ["current process documentation and recent cycle-time data"], "note": "Đáp án: {C}. Bẫy: {A} dựa vào benchmark ngành chung chung thay vì dữ liệu thực của quy trình; {B} dự đoán chính xác tác động và xếp hạng để triển khai ngay vượt quá căn cứ dữ liệu, thiếu bước review; {D} Claude không thể tự đi phỏng vấn từng thành viên.", "ex": "Tại sao chọn đáp án đúng (“Map the current intake process, identify likely bottlenecks based…”):\n\nClaude làm tốt nhất khi phân tích dữ liệu được cung cấp: tài liệu quy trình hiện tại và dữ liệu cycle time. Vì vậy hoạt động phù hợp nhất là map quy trình intake hiện tại, xác định các bottleneck có khả năng dựa trên cycle time, rồi đề xuất phương án tối ưu để con người review. Kết quả có căn cứ từ bằng chứng thực tế và vẫn được con người kiểm chứng trước khi ra quyết định.\n\nTại sao các phương án khác sai\n“Generate an optimized version of the intake process based…”: dựa vào benchmark ngành chung chung thay vì dữ liệu thực của quy trình.\n\n“Apply Claude to predict the cycle-time impact of each…”: dự đoán chính xác tác động và xếp hạng để triển khai ngay vượt quá căn cứ dữ liệu, thiếu bước review.\n\n“Use Claude to interview each team member who works…”: Claude không thể tự đi phỏng vấn từng thành viên."}, {"n": 35, "cat": "T", "topic": 1, "q": "An associate is responding to an executive who asserts that Claude will remove the need for any human review of customer-facing content. The executive approves the team’s AI-tools budget. Which response is most appropriate?", "o": ["Escalate the executive’s claim to a senior leader outside the team before responding directly, since the issue affects more than just the associate’s team.", "Pilot the executive’s proposal on a low-risk subset of customer-facing content first, and use the pilot results to make the case for retaining human review on higher-risk content.", "Defer to the executive’s authority and remove the human review step from customer-facing content, monitoring the results closely for the first several weeks.", "Acknowledge the productivity gains, then explain that human review remains essential on customer-facing content because of accuracy and brand risk, with specific examples."], "a": 3, "sk": ["remove the need for any human review"], "note": "Đáp án: {D}. Bẫy: {A} escalate vượt cấp trước khi trao đổi trực tiếp là không cần thiết và làm căng thẳng; {B} pilot bỏ review trên nội dung khách hàng vẫn chấp nhận rủi ro không cần thiết; {C} bỏ bước review vì nể quyền hạn là đặt rủi ro lên khách hàng.", "ex": "Tại sao chọn đáp án đúng (“Acknowledge the productivity gains, then explain that human review…”):\n\nCách phản hồi phù hợp là ghi nhận lợi ích năng suất, đồng thời giải thích rằng human review vẫn thiết yếu với nội dung gửi khách hàng do rủi ro về độ chính xác và thương hiệu, kèm ví dụ cụ thể. Output của model vẫn có thể sai dữ kiện, vi phạm chính sách hoặc lệch chuẩn thương hiệu; hướng dẫn của Anthropic cũng khuyến nghị guardrail và fact-check.\n\nTại sao các phương án khác sai\n“Escalate the executive’s claim to a senior leader outside…”: escalate vượt cấp trước khi trao đổi trực tiếp là không cần thiết và làm căng thẳng.\n\n“Pilot the executive’s proposal on a low-risk subset of…”: pilot bỏ review trên nội dung khách hàng vẫn chấp nhận rủi ro không cần thiết.\n\n“Defer to the executive’s authority and remove the human…”: bỏ bước review vì nể quyền hạn là đặt rủi ro lên khách hàng."}, {"n": 36, "cat": "T", "topic": 4, "q": "A support representative is setting up a Project to draft customer-facing apology emails following service outages. The current custom instructions tell Claude to “be empathetic and casual, keep it short, and offer a goodwill credit.” The customer-service team has reported that recent drafts are too brief, offer goodwill credits when policy does not permit them, and use contractions prohibited by the brand voice guide. Which change best aligns the configuration with the use case?", "o": ["Replace “be empathetic and casual” with “match the brand voice guide,” remove the instruction to offer goodwill credits, and let each draft determine its own length based on the incident.", "Move the brand voice guide and the goodwill-credit policy into the Project knowledge base and rely on the documents alone to govern tone, length, and credit decisions, without changing the custom instructions.", "Specify the brand voice attributes (empathetic, formal, no contractions), set a minimum length, and instruct Claude to recommend a goodwill credit only when the attached eligibility policy permits one.", "Keep the existing instructions and add a sentence telling Claude to consult the brand voice guide and the goodwill-credit policy that are attached to the Project knowledge base."], "a": 2, "sk": ["too brief", "use contractions prohibited by the brand voice guide"], "note": "Đáp án: {C}. Bẫy: {A} để từng bản nháp tự quyết độ dài không sửa được lỗi quá ngắn; {B} chỉ dựa vào tài liệu mà giữ instructions cũ thì chỉ dẫn mâu thuẫn vẫn còn; {D} giữ \"casual\" và \"offer a goodwill credit\" vẫn mâu thuẫn với chính sách.", "ex": "Tại sao chọn đáp án đúng (“Specify the brand voice attributes (empathetic, formal, no contractions),…”):\n\nBa vấn đề được báo cáo (quá ngắn, đưa credit trái chính sách, dùng từ viết tắt bị cấm) đều bắt nguồn từ instructions mơ hồ hoặc sai. Cách sửa tốt nhất là nêu rõ thuộc tính brand voice (đồng cảm, trang trọng, không dùng contraction), đặt độ dài tối thiểu, và chỉ đề xuất goodwill credit khi chính sách điều kiện đính kèm cho phép. Instructions cụ thể, tường minh xử lý trực tiếp từng lỗi.\n\nTại sao các phương án khác sai\n“Replace “be empathetic and casual” with “match the brand…”: để từng bản nháp tự quyết độ dài không sửa được lỗi quá ngắn.\n\n“Move the brand voice guide and the goodwill-credit policy…”: chỉ dựa vào tài liệu mà giữ instructions cũ thì chỉ dẫn mâu thuẫn vẫn còn.\n\n“Keep the existing instructions and add a sentence telling…”: giữ \"casual\" và \"offer a goodwill credit\" vẫn mâu thuẫn với chính sách."}, {"n": 37, "cat": "T", "topic": 4, "q": "You are an HR specialist assessing model selections made by colleagues for different tasks. Which two model choices are appropriate matches between the model and the task? Each correct answer provides a complete solution.", "o": ["a higher-capability model selected solely because it is the most expensive option", "a higher-capability model for one-line keyword extraction at high request volume", "a higher-capability model for complex multi-step legal reasoning under review", "a lighter, faster model for nuanced multi-document strategic synthesis", "a lighter, faster model for routine FAQ-style replies under tight latency budgets"], "a": [2, 4], "sk": ["appropriate matches between the model and the task"], "note": "Đáp án: {C} + {E}. Bẫy: {A} chọn model chỉ vì đắt nhất không phải tiêu chí hợp lý; {B} trích xuất keyword một dòng với khối lượng lớn nên dùng model nhẹ, rẻ; {D} tổng hợp chiến lược đa tài liệu tinh tế cần model năng lực cao hơn.", "ex": "Tại sao chọn đáp án đúng (“a higher-capability model for complex multi-step legal reasoning under…” / “a lighter, faster model for routine FAQ-style replies under…”):\n\nChọn model theo độ phức tạp, yêu cầu chất lượng, chi phí và độ trễ, không theo giá. Model năng lực cao phù hợp với suy luận pháp lý phức tạp nhiều bước có người review. Model nhẹ, nhanh phù hợp với trả lời FAQ thường quy dưới ngân sách độ trễ chặt.\n\nTại sao các phương án khác sai\n“a higher-capability model selected solely because it is the…”: chọn model chỉ vì đắt nhất không phải tiêu chí hợp lý.\n\n“a higher-capability model for one-line keyword extraction at high…”: trích xuất keyword một dòng với khối lượng lớn nên dùng model nhẹ, rẻ.\n\n“a lighter, faster model for nuanced multi-document strategic synthesis”: tổng hợp chiến lược đa tài liệu tinh tế cần model năng lực cao hơn."}, {"n": 38, "cat": "T", "topic": 4, "q": "You are a project manager at Orinexa, Inc. You are selecting a Claude model for a new production workload and must finish the requirements steps before testing candidates. Which two steps must be completed BEFORE testing candidate models on a representative sample? Each correct answer represents part of the solution.", "o": ["Define the quality bar, the latency tolerance, and the expected request volume.", "Retest the selected model whenever a new model version is released.", "Choose a candidate model based on the requirements profile and known capabilities.", "Promote the selected model to production traffic for the workload.", "Sign off on the production rollout plan with the platform and security teams."], "a": [0, 2], "sk": ["BEFORE testing candidate models"], "note": "Đáp án: {A} + {C}. Bẫy: {B} retest khi có phiên bản mới là việc sau khi đã chọn và vận hành; {D} đưa model lên production là bước sau khi test xong. E ký duyệt kế hoạch rollout cũng thuộc giai đoạn sau đánh giá.", "ex": "Tại sao chọn đáp án đúng (“Define the quality bar, the latency tolerance, and the…” / “Choose a candidate model based on the requirements profile…”):\n\nTrước khi test các model ứng viên phải có: định nghĩa chuẩn chất lượng, ngưỡng độ trễ và lưu lượng request dự kiến, tức tiêu chí thành công đo được; và chọn model ứng viên dựa trên hồ sơ yêu cầu và năng lực đã biết. Có tiêu chí và danh sách ứng viên thì kết quả test trên mẫu đại diện mới đánh giá được.\n\nTại sao các phương án khác sai\n“Retest the selected model whenever a new model version…”: retest khi có phiên bản mới là việc sau khi đã chọn và vận hành.\n\n“Promote the selected model to production traffic for the…”: đưa model lên production là bước sau khi test xong. E ký duyệt kế hoạch rollout cũng thuộc giai đoạn sau đánh giá."}, {"n": 39, "cat": "T", "topic": 1, "q": "You are a communications specialist who is preparing to explain Claude’s role in a workflow to several stakeholder groups and must finish the preparation activities before drafting messages. Which two preparation activities must be completed BEFORE drafting the stakeholder messages? Each correct answer represents part of the solution.", "o": ["Archive the drafted messages in the corporate communications repository.", "Identify the stakeholder groups and what each group needs to understand", "Define the key facts about Claude’s role and the boundaries that apply.", "Send the drafted messages out and gather feedback for revision.", "Schedule a follow-up forum to handle questions raised by the messages."], "a": [1, 2], "sk": ["BEFORE drafting the stakeholder messages"], "note": "Đáp án: {B} + {C}. Bẫy: {A} lưu trữ thông điệp là việc sau khi đã soạn; {D} gửi đi và thu phản hồi diễn ra sau khi soạn. E lên lịch buổi hỏi đáp tiếp theo là hoạt động sau khi gửi thông điệp.", "ex": "Tại sao chọn đáp án đúng (“Identify the stakeholder groups and what each group needs…” / “Define the key facts about Claude’s role and the…”):\n\nTrước khi soạn thông điệp cần hai đầu vào: xác định các nhóm stakeholder và điều mỗi nhóm cần hiểu, và xác định các dữ kiện chính về vai trò của Claude cùng các ranh giới áp dụng. Hai bước này quyết định nội dung và cách đóng khung thông điệp cho từng đối tượng.\n\nTại sao các phương án khác sai\n“Archive the drafted messages in the corporate communications repository.”: lưu trữ thông điệp là việc sau khi đã soạn.\n\n“Send the drafted messages out and gather feedback for…”: gửi đi và thu phản hồi diễn ra sau khi soạn. E lên lịch buổi hỏi đáp tiếp theo là hoạt động sau khi gửi thông điệp."}, {"n": 40, "cat": "E", "topic": 4, "q": "You are an operations manager creating a quick-reference card for a team. Which description accurately characterizes the three Claude model tiers in general terms?", "o": ["Haiku is the most capable model for the deepest reasoning, while Opus is the lightweight model for quick replies.", "All three models offer the same reasoning depth and differ only in response speed and cost.", "Haiku is fast and lightweight, Sonnet is the balanced default for most everyday work, and Opus is the most capable for complex reasoning at higher latency and cost.", "Sonnet is the fastest of the three models because its architecture is optimized for speed rather than reasoning depth."], "a": 2, "sk": ["three Claude model tiers"], "note": "Đáp án: {C}. Bẫy: {A} đảo ngược vai trò của Haiku và Opus; {B} các model khác nhau về độ sâu suy luận, không chỉ tốc độ và chi phí; {D} Haiku mới là model nhanh nhất, Sonnet là tầng cân bằng.", "ex": "Tại sao chọn đáp án đúng (“Haiku is fast and lightweight, Sonnet is the balanced…”):\n\nBa tầng model Claude nói chung: Haiku nhanh, nhẹ và chi phí thấp; Sonnet cân bằng, là lựa chọn mặc định cho phần lớn công việc hằng ngày; Opus năng lực cao nhất cho suy luận phức tạp, đổi lại chi phí cao hơn và độ trễ thường lớn hơn.\n\nTại sao các phương án khác sai\n“Haiku is the most capable model for the deepest…”: đảo ngược vai trò của Haiku và Opus.\n\n“All three models offer the same reasoning depth and…”: các model khác nhau về độ sâu suy luận, không chỉ tốc độ và chi phí.\n\n“Sonnet is the fastest of the three models because…”: Haiku mới là model nhanh nhất, Sonnet là tầng cân bằng."}, {"n": 41, "cat": "T", "topic": 2, "q": "You are a project manager having an extended planning conversation with Claude and need to keep it productive as it expands. Which two practices help keep a long planning conversation productive? Each correct answer provides a complete solution.", "o": ["Open a new thread for every minor follow-up question to keep threads short.", "Restate constraints and goals when the focus shifts to a new subtopic.", "Periodically summarize decisions made so far to compress the working state.", "Switch context aggressively between unrelated planning topics within one thread", "Avoid summarizing so the model retains every original word it has produced."], "a": [1, 2], "sk": ["keep it productive as it expands"], "note": "Đáp án: {B} + {C}. Bẫy: {A} Mở thread mới cho mọi câu hỏi nhỏ làm mất ngữ cảnh đã xây dựng và phân mảnh công việc; {D} Nhảy qua lại giữa các chủ đề không liên quan trong một thread gây nhiễu và giảm mạch lạc. E Không tóm tắt khiến ngữ cảnh phình to, thông tin quan trọng dễ bị chìm khi gần giới hạn context window.", "ex": "Tại sao chọn đáp án đúng (“Restate constraints and goals when the focus shifts to…” / “Periodically summarize decisions made so far to compress the…”):\n\nKhi cuộc trò chuyện lập kế hoạch kéo dài, có hai thói quen giữ nó hiệu quả. Thứ nhất, nhắc lại mục tiêu và ràng buộc mỗi khi chuyển sang chủ đề con mới để Claude luôn bám đúng yêu cầu dự án. Thứ hai, định kỳ tóm tắt các quyết định đã chốt, giúp nén trạng thái làm việc quan trọng thành dạng gọn, nhờ đó Claude giữ được mạch lạc khi hội thoại tiến gần giới hạn context window.\n\nTại sao các phương án khác sai\n“Open a new thread for every minor follow-up question…”: Mở thread mới cho mọi câu hỏi nhỏ làm mất ngữ cảnh đã xây dựng và phân mảnh công việc.\n\n“Switch context aggressively between unrelated planning topics within one…”: Nhảy qua lại giữa các chủ đề không liên quan trong một thread gây nhiễu và giảm mạch lạc. E Không tóm tắt khiến ngữ cảnh phình to, thông tin quan trọng dễ bị chìm khi gần giới hạn context window."}, {"n": 42, "cat": "E", "topic": 5, "q": "A finance manager is preparing to discuss a confidential pre-announcement figure with Claude. Which two settings most closely follow sound privacy practices for this discussion?", "o": ["Skip the privacy setting decision and proceed with default behavior, since the conversation will not explicitly instruct Claude to remember the figure.", "Disable Memory contribution for the conversation if Incognito mode is not used, so the confidential figure is not retained as persistent context that could surface in later unrelated sessions.", "Treat the conversation as appropriate for default Memory settings, since the figure will only be discussed briefly and is unlikely to be retained.", "Enable Memory contribution for the conversation so the context carries forward to support follow-up analysis in future sessions.", "Open the conversation in Incognito mode, which prevents the conversation from contributing to Memory and avoids persistent retention of the confidential pre-announcement figure across sessions."], "a": [1, 4], "sk": ["confidential pre-announcement figure"], "note": "Đáp án: {B} + {E}. Bẫy: {A} Bỏ qua quyết định về quyền riêng tư và dùng mặc định là thiếu thận trọng với dữ liệu mật; {C} Giả định thảo luận ngắn thì khó bị lưu lại là suy đoán, không phải biện pháp kiểm soát; {D} Bật Memory để mang ngữ cảnh sang phiên sau chính là làm tăng rủi ro lộ con số mật.", "ex": "Tại sao chọn đáp án đúng (“Disable Memory contribution for the conversation if Incognito mode…” / “Open the conversation in Incognito mode, which prevents the…”):\n\nCon số tài chính bảo mật trước công bố không được trở thành ngữ cảnh lưu lâu dài có thể xuất hiện lại ở phiên khác. Vì vậy, nếu dùng cuộc trò chuyện thường thì nên tắt đóng góp vào Memory cho cuộc trò chuyện đó. Cách thứ hai là mở cuộc trò chuyện trong Incognito mode, vốn không đóng góp vào Memory, nên con số không bị lưu giữ qua các phiên. Cả hai đều là quyết định chủ động về quyền riêng tư trước khi chia sẻ thông tin nhạy cảm.\n\nTại sao các phương án khác sai\n“Skip the privacy setting decision and proceed with default…”: Bỏ qua quyết định về quyền riêng tư và dùng mặc định là thiếu thận trọng với dữ liệu mật.\n\n“Treat the conversation as appropriate for default Memory settings,…”: Giả định thảo luận ngắn thì khó bị lưu lại là suy đoán, không phải biện pháp kiểm soát.\n\n“Enable Memory contribution for the conversation so the context…”: Bật Memory để mang ngữ cảnh sang phiên sau chính là làm tăng rủi ro lộ con số mật."}, {"n": 43, "cat": "E", "topic": 3, "q": "A knowledge worker is explaining how feedback can be used to improve Claude-supported work over time. Which description is the most accurate?", "o": ["Capture specific feedback after each run, translate it into targeted prompt or workflow changes, and observe whether subsequent runs improve.", "Capture feedback only after several runs so patterns emerge from the volume of observations, then apply changes based on the patterns rather than any single run.", "Capture feedback as an aggregate quality score per run, since aggregate scores show whether quality is improving without requiring detail on individual issues.", "Capture general impressions after each run and apply them as broad prompt rewrites, since broad rewrites cover more potential issues than targeted changes."], "a": 0, "sk": ["improve Claude-supported work over time"], "note": "Đáp án: {A}. Bẫy: {B} Chờ nhiều lần chạy mới thu phản hồi làm chậm vòng lặp và khó truy ra nguyên nhân từng vấn đề; {C} Điểm chất lượng tổng hợp cho biết xu hướng nhưng không chỉ ra cần sửa gì; {D} Ấn tượng chung kèm viết lại prompt diện rộng khiến không biết thay đổi nào thực sự có tác dụng.", "ex": "Tại sao chọn đáp án đúng (“Capture specific feedback after each run, translate it into…”):\n\nVòng cải tiến hiệu quả gồm ba bước: ghi lại phản hồi cụ thể sau mỗi lần chạy, chuyển phản hồi đó thành điều chỉnh có mục tiêu cho prompt hoặc workflow, rồi quan sát xem các lần chạy sau có tốt hơn không. Phản hồi cụ thể và kịp thời giúp thấy rõ thay đổi nào gây ra hiệu quả nào, từ đó đánh giá được chất lượng output.\n\nTại sao các phương án khác sai\n“Capture feedback only after several runs so patterns emerge…”: Chờ nhiều lần chạy mới thu phản hồi làm chậm vòng lặp và khó truy ra nguyên nhân từng vấn đề.\n\n“Capture feedback as an aggregate quality score per run,…”: Điểm chất lượng tổng hợp cho biết xu hướng nhưng không chỉ ra cần sửa gì.\n\n“Capture general impressions after each run and apply them…”: Ấn tượng chung kèm viết lại prompt diện rộng khiến không biết thay đổi nào thực sự có tác dụng."}, {"n": 44, "cat": "E", "topic": 3, "q": "You are a Claude associate investigating a recurring instance of poor output. Which diagnostic-step sequence is correct? 1. Develop a hypothesis about the prompt element most likely responsible for the deficiency. 2. Make one targeted change and observe its effect on the output. 3. Read the output from beginning to end and identify the specific deficiency. 4. Compare the deficient output with the prompt to find mismatches between the input and output. 5. Record the root cause and resolution for future reference.", "o": ["1, 3, 4, 2, 5", "4, 3, 1, 2, 5", "3, 1, 4, 2, 5", "3, 4, 1, 2, 5"], "a": 3, "sk": ["recurring instance of poor output"], "note": "Đáp án: {D}. Bẫy: {A} Đặt giả thuyết trước khi đọc output là đoán mò, chưa có bằng chứng; {B} So sánh với prompt trước khi biết rõ khiếm khuyết là gì thì không biết cần tìm điểm lệch nào; {C} Đặt giả thuyết trước bước so sánh output với prompt nên giả thuyết thiếu căn cứ.", "ex": "Tại sao chọn đáp án đúng (“3, 4, 1, 2, 5”):\n\nTrình tự đúng là 3, 4, 1, 2, 5. Đầu tiên (3) đọc toàn bộ output để xác định chính xác khiếm khuyết. Sau đó (4) so sánh output với prompt để tìm chỗ không khớp giữa đầu vào và đầu ra. Từ bằng chứng đó (1) đưa ra giả thuyết về thành phần prompt gây lỗi. Tiếp theo (2) chỉ thay đổi một điểm và quan sát hiệu quả. Cuối cùng (5) ghi lại nguyên nhân gốc và cách khắc phục để tái sử dụng.\n\nTại sao các phương án khác sai\n“1, 3, 4, 2, 5”: Đặt giả thuyết trước khi đọc output là đoán mò, chưa có bằng chứng.\n\n“4, 3, 1, 2, 5”: So sánh với prompt trước khi biết rõ khiếm khuyết là gì thì không biết cần tìm điểm lệch nào.\n\n“3, 1, 4, 2, 5”: Đặt giả thuyết trước bước so sánh output với prompt nên giả thuyết thiếu căn cứ."}, {"n": 45, "cat": "E", "topic": 3, "q": "You have revised a Claude prompt eight times, and output quality has plateaued during the last four attempts. Which conclusion is most appropriate?", "o": ["Iteration should stop and the current output should be accepted as-is regardless of remaining issues.", "Iteration should stop and the task should be abandoned without communicating to stakeholders.", "Iteration has reached diminishing returns and the next step is human review or a different approach.", "Iteration should continue indefinitely because more attempts always improve quality."], "a": 2, "sk": ["quality has plateaued"], "note": "Đáp án: {C}. Bẫy: {A} Chấp nhận output hiện tại bất chấp lỗi còn tồn tại là bỏ qua vấn đề chất lượng; {B} Bỏ dở nhiệm vụ mà không báo cho stakeholder là thiếu minh bạch và trách nhiệm; {D} Lặp vô hạn là lãng phí vì dữ liệu đã cho thấy thêm lần sửa không cải thiện kết quả.", "ex": "Tại sao chọn đáp án đúng (“Iteration has reached diminishing returns and the next step…”):\n\nSau tám lần sửa mà bốn lần gần nhất chất lượng chững lại, việc tiếp tục chỉnh prompt đang cho lợi ích giảm dần (diminishing returns). Bước hợp lý là chuyển sang human review hoặc thử một cách tiếp cận khác, thay vì cứ lặp lại cùng kiểu chỉnh sửa.\n\nTại sao các phương án khác sai\n“Iteration should stop and the current output should be…”: Chấp nhận output hiện tại bất chấp lỗi còn tồn tại là bỏ qua vấn đề chất lượng.\n\n“Iteration should stop and the task should be abandoned…”: Bỏ dở nhiệm vụ mà không báo cho stakeholder là thiếu minh bạch và trách nhiệm.\n\n“Iteration should continue indefinitely because more attempts always improve…”: Lặp vô hạn là lãng phí vì dữ liệu đã cho thấy thêm lần sửa không cải thiện kết quả."}, {"n": 46, "cat": "E", "topic": 1, "q": "You are a project manager assessing workflow steps by the amount of leverage Claude integration provides. Which workflow step generally delivers the greatest Claude leverage for a knowledge-work team?", "o": ["approving final deliverables for external publication without further review", "negotiating contractual terms with external parties on behalf of the company", "drafting and synthesizing across many sources for a downstream reviewer", "making final personnel decisions about hiring, promotion, or termination"], "a": 2, "sk": ["greatest Claude leverage"], "note": "Đáp án: {C}. Bẫy: {A} Phê duyệt sản phẩm cuối để phát hành ra ngoài mà không review là quyết định cần con người chịu trách nhiệm; {B} Đàm phán hợp đồng thay mặt công ty đòi hỏi thẩm quyền và phán đoán của con người; {D} Quyết định nhân sự cuối cùng về tuyển dụng, thăng chức, sa thải phải do con người nắm giữ.", "ex": "Tại sao chọn đáp án đúng (“drafting and synthesizing across many sources for a downstream…”):\n\nClaude tạo đòn bẩy lớn nhất ở khâu soạn thảo và tổng hợp từ nhiều nguồn, nơi nó giúp tăng tốc chuẩn bị tài liệu, trong khi người review phía sau vẫn giữ trách nhiệm kiểm chứng và phán quyết cuối cùng. Đây là sự phân công hợp lý giữa tốc độ của AI và trách nhiệm của con người.\n\nTại sao các phương án khác sai\n“approving final deliverables for external publication without further review”: Phê duyệt sản phẩm cuối để phát hành ra ngoài mà không review là quyết định cần con người chịu trách nhiệm.\n\n“negotiating contractual terms with external parties on behalf of…”: Đàm phán hợp đồng thay mặt công ty đòi hỏi thẩm quyền và phán đoán của con người.\n\n“making final personnel decisions about hiring, promotion, or termination”: Quyết định nhân sự cuối cùng về tuyển dụng, thăng chức, sa thải phải do con người nắm giữ."}, {"n": 47, "cat": "E", "topic": 3, "q": "You are conducting a weekly feedback-and-adjustment cycle. What is the correct sequence of cycle steps? 1. Turn feedback into one or two focused adjustments for the next cycle. 2. Run the following cycle and compare its results with the previous cycle. 3. Record the specific feedback received during the review. 4. Document what changed, the effect it created, and any unresolved issues. 5. Determine whether to keep iterating, change approaches, or escalate.", "o": ["2, 3, 1, 4, 5", "1, 3, 2, 4, 5", "3, 1, 2, 4, 5", "3, 2, 1, 4, 5"], "a": 2, "sk": ["weekly feedback-and-adjustment cycle"], "note": "Đáp án: {C}. Bẫy: {A} Chạy chu kỳ mới trước khi ghi phản hồi và điều chỉnh thì không có gì mới để so sánh; {B} Điều chỉnh trước khi ghi lại phản hồi nghĩa là thay đổi không dựa trên dữ liệu; {D} Chạy chu kỳ trước khi chọn điều chỉnh khiến chu kỳ đó không kiểm chứng được thay đổi nào.", "ex": "Tại sao chọn đáp án đúng (“3, 1, 2, 4, 5”):\n\nTrình tự đúng là 3, 1, 2, 4, 5. Trước hết (3) ghi lại phản hồi cụ thể nhận được khi review. Sau đó (1) chuyển phản hồi thành một hoặc hai điều chỉnh tập trung. Tiếp theo (2) chạy chu kỳ kế tiếp và so sánh với chu kỳ trước. Rồi (4) ghi lại thay đổi, tác động và vấn đề còn tồn tại. Cuối cùng (5) quyết định tiếp tục lặp, đổi hướng hay escalate dựa trên bằng chứng đã ghi.\n\nTại sao các phương án khác sai\n“2, 3, 1, 4, 5”: Chạy chu kỳ mới trước khi ghi phản hồi và điều chỉnh thì không có gì mới để so sánh.\n\n“1, 3, 2, 4, 5”: Điều chỉnh trước khi ghi lại phản hồi nghĩa là thay đổi không dựa trên dữ liệu.\n\n“3, 2, 1, 4, 5”: Chạy chu kỳ trước khi chọn điều chỉnh khiến chu kỳ đó không kiểm chứng được thay đổi nào."}, {"n": 48, "cat": "T", "topic": 3, "q": "You are a content creator. Claude’s initial response is accurate but uses inconsistent terminology that does not align with your organization’s glossary. Which iterative revision addresses this issue most directly?", "o": ["Increase the requested length so the inconsistent terminology appears more often.", "Ask Claude to invent additional terms unrelated to the glossary.", "Remove the topic from the prompt to avoid the terminology issue entirely.", "Provide the organization's glossary and instruct Claude to use only those terms throughout the response."], "a": 3, "sk": ["inconsistent terminology"], "note": "Đáp án: {D}. Bẫy: {A} Tăng độ dài chỉ làm thuật ngữ sai xuất hiện nhiều hơn; {B} Bảo Claude tự chế thêm thuật ngữ ngoài glossary làm vấn đề tệ hơn; {C} Bỏ chủ đề khỏi prompt là né tránh vấn đề và làm mất nội dung cần viết.", "ex": "Tại sao chọn đáp án đúng (“Provide the organization's glossary and instruct Claude to use…”):\n\nVấn đề là thuật ngữ không khớp với chuẩn của tổ chức, nên cách sửa trực tiếp nhất là cung cấp glossary của tổ chức và yêu cầu Claude chỉ dùng các thuật ngữ đó xuyên suốt câu trả lời. Claude vừa có từ vựng chuẩn, vừa có ràng buộc rõ ràng để áp dụng nhất quán.\n\nTại sao các phương án khác sai\n“Increase the requested length so the inconsistent terminology appears…”: Tăng độ dài chỉ làm thuật ngữ sai xuất hiện nhiều hơn.\n\n“Ask Claude to invent additional terms unrelated to the…”: Bảo Claude tự chế thêm thuật ngữ ngoài glossary làm vấn đề tệ hơn.\n\n“Remove the topic from the prompt to avoid the…”: Bỏ chủ đề khỏi prompt là né tránh vấn đề và làm mất nội dung cần viết."}, {"n": 49, "cat": "T", "topic": 2, "q": "You are a knowledge manager organizing source material within the context window for a lengthy Claude evaluation task. Which two practices result in more effective use of the context window? Each correct answer provides a complete solution.", "o": ["Paste every available document into context regardless of relevance to the task.", "Mark each source clearly with delimiters so the model can attribute claims correctly.", "Repeat the same instruction at the start, middle, and end to reinforce it.", "Mix sources together in a single block so the model can synthesize them freely.", "Place the most reference-critical material near the beginning or end of context."], "a": [1, 4], "sk": ["effective use of the context window"], "note": "Đáp án: {B} + {E}. Bẫy: {A} Dán mọi tài liệu bất kể liên quan làm loãng ngữ cảnh và tốn context window; {C} Lặp cùng một chỉ dẫn ở nhiều chỗ không giải quyết việc tổ chức nguồn và gây dư thừa; {D} Trộn các nguồn vào một khối khiến Claude khó quy trách nhiệm từng nhận định cho đúng nguồn.", "ex": "Tại sao chọn đáp án đúng (“Mark each source clearly with delimiters so the model…” / “Place the most reference-critical material near the beginning or…”):\n\nHai cách dùng context window hiệu quả: thứ nhất, đánh dấu từng nguồn bằng delimiter (ví dụ XML tag) để tách biệt tài liệu, metadata, chỉ dẫn và đầu vào, giúp Claude trích dẫn đúng nguồn. Thứ hai, với tác vụ ngữ cảnh dài, đặt tài liệu tham chiếu quan trọng ở đầu hoặc cuối context (tài liệu dài ở trên, câu hỏi ở cuối) thay vì vùi giữa.\n\nTại sao các phương án khác sai\n“Paste every available document into context regardless of relevance…”: Dán mọi tài liệu bất kể liên quan làm loãng ngữ cảnh và tốn context window.\n\n“Repeat the same instruction at the start, middle, and…”: Lặp cùng một chỉ dẫn ở nhiều chỗ không giải quyết việc tổ chức nguồn và gây dư thừa.\n\n“Mix sources together in a single block so the…”: Trộn các nguồn vào một khối khiến Claude khó quy trách nhiệm từng nhận định cho đúng nguồn."}, {"n": 50, "cat": "E", "topic": 4, "q": "A knowledge worker regularly switches between Claude and another AI service while working on a long-running project. Which Claude feature most directly minimizes repetitive context-setting across sessions?", "o": ["Enable Memory and use the import capability to bring relevant context from the other AI service into Claude as a starting point for the project’s work.", "Rely on a single static Artifact pasted into each chat as the only continuity mechanism, ignoring the Memory feature that is purpose-built for retaining work-relevant context across sessions.", "Open every Claude session in Incognito mode, which prevents the conversation from contributing to Memory and therefore eliminates the cross-session continuity the project would benefit from.", "Disable Memory entirely and re-paste the same context paragraphs at the start of every Claude session, even though Memory is designed to retain that context across conversations automatically."], "a": 0, "sk": ["switches between Claude and another AI service"], "note": "Đáp án: {A}. Bẫy: {B} Dán một Artifact tĩnh vào mỗi chat là thủ công và bỏ qua tính năng được thiết kế cho việc này; {C} Incognito mode ngăn đóng góp vào Memory nên triệt tiêu tính liên tục cần có; {D} Tắt Memory rồi dán lại cùng đoạn ngữ cảnh mỗi phiên chính là sự lặp lại cần tránh.", "ex": "Tại sao chọn đáp án đúng (“Enable Memory and use the import capability to bring…”):\n\nMemory của Claude lưu giữ ngữ cảnh công việc để dùng trong các cuộc trò chuyện mới, và có luồng import tích hợp để mang ngữ cảnh liên quan từ dịch vụ AI khác vào Claude. Nhờ vậy người dùng giảm được việc lặp lại thiết lập ngữ cảnh mỗi phiên khi làm dự án dài hạn.\n\nTại sao các phương án khác sai\n“Rely on a single static Artifact pasted into each…”: Dán một Artifact tĩnh vào mỗi chat là thủ công và bỏ qua tính năng được thiết kế cho việc này.\n\n“Open every Claude session in Incognito mode, which prevents…”: Incognito mode ngăn đóng góp vào Memory nên triệt tiêu tính liên tục cần có.\n\n“Disable Memory entirely and re-paste the same context paragraphs…”: Tắt Memory rồi dán lại cùng đoạn ngữ cảnh mỗi phiên chính là sự lặp lại cần tránh."}, {"n": 51, "cat": "T", "topic": 4, "q": "An HR business partner is setting up a new Project for recurring policy questions from managers. The Project will be used across many chats by several HR team members. Which content should belong in the Project knowledge base?", "o": ["the current employee handbook plus prior versions of the handbook going back five years, so Claude can answer questions about how policies have changed", "the current employee handbook, the leveling guide, the policies-FAQ, and every email the HR team has sent about policy in the past year, for additional context", "the current employee handbook only, with the leveling guide and the policies-FAQ attached at the start of each chat as needed for that chat’s topic", "the current employee handbook, the leveling guide, and the policies-FAQ document referenced across the Project’s chats"], "a": 3, "sk": ["Project knowledge base"], "note": "Đáp án: {D}. Bẫy: {A} Handbook cũ năm năm trước là chính sách đã bị thay thế, dễ khiến Claude trả lời theo thông tin lỗi thời; {B} Toàn bộ email chính sách trong năm là ngữ cảnh rời rạc, có thể mâu thuẫn và không cần thiết; {C} Đính kèm leveling guide và FAQ thủ công từng chat là lặp việc, trong khi chúng là tài liệu dùng chung.", "ex": "Tại sao chọn đáp án đúng (“the current employee handbook, the leveling guide, and the…”):\n\nKnowledge base của Project cung cấp ngữ cảnh cho mọi chat trong Project, nên chỉ nên chứa tài liệu tham chiếu hiện hành, dùng lặp lại: employee handbook hiện tại, leveling guide và policies-FAQ. Đây đúng là những tài liệu các câu hỏi chính sách của quản lý cần thường xuyên.\n\nTại sao các phương án khác sai\n“the current employee handbook plus prior versions of the…”: Handbook cũ năm năm trước là chính sách đã bị thay thế, dễ khiến Claude trả lời theo thông tin lỗi thời.\n\n“the current employee handbook, the leveling guide, the policies-FAQ,…”: Toàn bộ email chính sách trong năm là ngữ cảnh rời rạc, có thể mâu thuẫn và không cần thiết.\n\n“the current employee handbook only, with the leveling guide…”: Đính kèm leveling guide và FAQ thủ công từng chat là lặp việc, trong khi chúng là tài liệu dùng chung."}, {"n": 52, "cat": "T", "topic": 1, "q": "A knowledge worker is briefing a stakeholder group about Claude’s limitations. The stakeholders will use Claude for customer-facing work, where confident-sounding output containing errors could cause real harm. Which limitation is most important to communicate clearly?", "o": ["Claude’s responses vary across runs of the same prompt, so stakeholders should run each prompt several times and compare outputs before using any single response.", "Claude can produce confident-sounding output that contains unsupported claims, so human review remains essential for high-impact work.", "Claude can produce long, detailed responses that take time to read, so stakeholders should request shorter outputs when working under tight deadlines.", "Claude’s knowledge has a training cutoff, so stakeholders must verify any time-sensitive claims against current sources before using them."], "a": 1, "sk": ["confident-sounding output containing errors could cause real harm"], "note": "Đáp án: {B}. Bẫy: {A} Chạy nhiều lần rồi so sánh không đảm bảo phát hiện lỗi nếu các lần đều sai giống nhau; {C} Độ dài câu trả lời là vấn đề tiện lợi, không phải rủi ro gây hại; {D} Training cutoff có thật nhưng chỉ là một phần, còn rủi ro trọng tâm là nội dung sai mà nghe đáng tin.", "ex": "Tại sao chọn đáp án đúng (“Claude can produce confident-sounding output that contains unsupported claims,…”):\n\nVới công việc hướng tới khách hàng, rủi ro lớn nhất là Claude có thể tạo ra output nghe rất tự tin nhưng chứa nhận định không có căn cứ (hallucination). Các biện pháp giảm thiểu không loại bỏ hoàn toàn rủi ro này, nên human review vẫn bắt buộc cho công việc tác động cao.\n\nTại sao các phương án khác sai\n“Claude’s responses vary across runs of the same prompt,…”: Chạy nhiều lần rồi so sánh không đảm bảo phát hiện lỗi nếu các lần đều sai giống nhau.\n\n“Claude can produce long, detailed responses that take time…”: Độ dài câu trả lời là vấn đề tiện lợi, không phải rủi ro gây hại.\n\n“Claude’s knowledge has a training cutoff, so stakeholders must…”: Training cutoff có thật nhưng chỉ là một phần, còn rủi ro trọng tâm là nội dung sai mà nghe đáng tin."}, {"n": 53, "cat": "T", "topic": 5, "q": "You are a knowledge worker preparing material for a Claude prompt. Which data type most clearly needs additional handling, such as redaction or anonymization, before it is included in the prompt?", "o": ["public press releases the company has already published", "customer government identifiers and full payment-card numbers tied to named individuals", "job titles taken from the company’s public organizational chart", "generic product descriptions available on the company’s marketing site"], "a": 1, "sk": ["redaction or anonymization"], "note": "Đáp án: {B}. Bẫy: {A} Thông cáo báo chí đã công bố là thông tin công khai; {C} Chức danh từ sơ đồ tổ chức công khai không tạo rủi ro riêng tư đáng kể; {D} Mô tả sản phẩm chung trên website marketing vốn đã công khai.", "ex": "Tại sao chọn đáp án đúng (“customer government identifiers and full payment-card numbers tied to…”):\n\nSố định danh do chính phủ cấp và số thẻ thanh toán đầy đủ gắn với cá nhân có danh tính là dữ liệu cá nhân và tài chính nhạy cảm. Cần redact hoặc ẩn danh trước khi đưa vào prompt để giảm phơi nhiễm thông tin định danh cá nhân không cần thiết.\n\nTại sao các phương án khác sai\n“public press releases the company has already published”: Thông cáo báo chí đã công bố là thông tin công khai.\n\n“job titles taken from the company’s public organizational chart”: Chức danh từ sơ đồ tổ chức công khai không tạo rủi ro riêng tư đáng kể.\n\n“generic product descriptions available on the company’s marketing site”: Mô tả sản phẩm chung trên website marketing vốn đã công khai."}, {"n": 54, "cat": "E", "topic": 6, "q": "You are an operations lead who is integrating Claude into a workflow used by multiple people. Which integration step should be completed first?", "o": ["Identify where Claude adds value and where each handoff to a human occurs.", "Pilot the integrated workflow with a small group on representative work.", "Iterate the integrated workflow based on the findings from the pilot.", "Document the integrated workflow and onboard the rest of the team to it."], "a": 0, "sk": ["should be completed first"], "note": "Đáp án: {A}. Bẫy: {B} Pilot cần có workflow đã được định nghĩa trước; {C} Lặp cải tiến chỉ thực hiện được sau khi có kết quả pilot; {D} Viết tài liệu và onboard cả nhóm là bước cuối, sau khi workflow đã được kiểm chứng.", "ex": "Tại sao chọn đáp án đúng (“Identify where Claude adds value and where each handoff…”):\n\nBước đầu tiên khi tích hợp Claude vào workflow nhiều người dùng là xác định nơi Claude tạo giá trị và từng điểm bàn giao cho con người. Ranh giới này định hình workflow, sau đó mới có thể pilot, cải tiến theo kết quả pilot, viết tài liệu và triển khai rộng, đồng thời giữ con người trong vòng kiểm soát.\n\nTại sao các phương án khác sai\n“Pilot the integrated workflow with a small group on…”: Pilot cần có workflow đã được định nghĩa trước.\n\n“Iterate the integrated workflow based on the findings from…”: Lặp cải tiến chỉ thực hiện được sau khi có kết quả pilot.\n\n“Document the integrated workflow and onboard the rest of…”: Viết tài liệu và onboard cả nhóm là bước cuối, sau khi workflow đã được kiểm chứng."}, {"n": 55, "cat": "T", "topic": 1, "q": "A Claude associate is assessing a proposed use case in which Claude would make final hiring decisions without any human review, using the AI Fluency Framework’s Delegation competency. Which classification most accurately reflects Delegation principles?", "o": ["Inappropriate for full AI delegation, because hiring decisions involve human judgment, accountability, and consequences that Delegation criteria reserve for human ownership rather than autonomous AI execution.", "Appropriate with light human review applied only to a sample of decisions, even though Delegation criteria reserve final hiring decisions for human ownership rather than sample-based oversight after the fact.", "Appropriate for full AI delegation, on the basis that processing speed outweighs the human judgment, accountability, and consequence considerations that Delegation criteria require for final hiring decisions.", "Inappropriate only because of system reliability concerns rather than accountability, even though Delegation criteria classify final hiring decisions as requiring human ownership regardless of system performance."], "a": 0, "sk": ["final hiring decisions without any human review"], "note": "Đáp án: {A}. Bẫy: {B} Review mẫu một phần sau khi đã quyết định vẫn không giữ quyền sở hữu quyết định ở con người; {C} Tốc độ xử lý không thể bù cho yêu cầu về phán đoán và trách nhiệm giải trình; {D} Lý do cốt lõi là trách nhiệm giải trình, không chỉ độ tin cậy của hệ thống.", "ex": "Tại sao chọn đáp án đúng (“Inappropriate for full AI delegation, because hiring decisions involve…”):\n\nTheo năng lực Delegation trong AI Fluency Framework, việc phân công giữa người và AI dựa trên bản chất nhiệm vụ, năng lực của hệ thống và nhu cầu về phán đoán con người. Quyết định tuyển dụng cuối cùng liên quan đến phán đoán, trách nhiệm giải trình và hậu quả lớn với con người, nên phải do con người sở hữu, không giao hoàn toàn cho AI.\n\nTại sao các phương án khác sai\n“Appropriate with light human review applied only to a…”: Review mẫu một phần sau khi đã quyết định vẫn không giữ quyền sở hữu quyết định ở con người.\n\n“Appropriate for full AI delegation, on the basis that…”: Tốc độ xử lý không thể bù cho yêu cầu về phán đoán và trách nhiệm giải trình.\n\n“Inappropriate only because of system reliability concerns rather than…”: Lý do cốt lõi là trách nhiệm giải trình, không chỉ độ tin cậy của hệ thống."}, {"n": 56, "cat": "E", "topic": 3, "q": "You are assessing a Claude output that seems to include hallucinated content. Which response step should be taken first when a hallucination is suspected?", "o": ["Discard the entire output and regenerate the output with a fresh prompt.", "Document the hallucination pattern in the team’s risk register for future reference.", "Notify the user community that the output contains a hallucinated claim.", "Pinpoint the specific claim that appears to be unsupported by available evidence."], "a": 3, "sk": ["hallucination is suspected"], "note": "Đáp án: {D}. Bẫy: {A} Bỏ toàn bộ và tạo lại khi chưa biết lỗi nằm đâu có thể lặp lại cùng lỗi và bỏ cả phần đúng; {B} Ghi vào risk register là bước sau, khi đã xác định rõ lỗi; {C} Thông báo cho cộng đồng người dùng trước khi xác minh là quá sớm và có thể sai.", "ex": "Tại sao chọn đáp án đúng (“Pinpoint the specific claim that appears to be unsupported…”):\n\nKhi nghi ngờ hallucination, bước đầu tiên là xác định chính xác nhận định cụ thể nào không có bằng chứng hỗ trợ. Có điểm cụ thể rồi mới biết cần kiểm chứng, sửa, rút lại hay escalate gì. Nên đối chiếu nhận định với trích dẫn và nguồn, và rút lại nhận định nếu không tìm được nguồn hỗ trợ.\n\nTại sao các phương án khác sai\n“Discard the entire output and regenerate the output with…”: Bỏ toàn bộ và tạo lại khi chưa biết lỗi nằm đâu có thể lặp lại cùng lỗi và bỏ cả phần đúng.\n\n“Document the hallucination pattern in the team’s risk register…”: Ghi vào risk register là bước sau, khi đã xác định rõ lỗi.\n\n“Notify the user community that the output contains a…”: Thông báo cho cộng đồng người dùng trước khi xác minh là quá sớm và có thể sai."}, {"n": 57, "cat": "T", "topic": 6, "q": "You are optimizing a recurring Claude workflow and must finish the diagnostic steps before modifying the workflow. Which two diagnostic steps must be completed BEFORE changing the recurring workflow? Each correct answer represents part of the solution.", "o": ["Notify executive leadership of the projected savings from the optimization.", "Identify the steps that contribute most to time, cost, or quality issues.", "Deploy the updated workflow across the team and monitor for adoption issues.", "Measure the current workflow's quality, time, and cost across recent runs.", "Document the revised workflow steps and update the team’s standard operating procedures."], "a": [1, 3], "sk": ["BEFORE changing the recurring workflow"], "note": "Đáp án: {B} + {D}. Bẫy: {A} Báo lãnh đạo về khoản tiết kiệm dự kiến khi chưa đo đạc là thiếu căn cứ; {C} Triển khai workflow mới cho cả nhóm là bước sau khi đã thay đổi. E Viết lại tài liệu và SOP cũng thuộc giai đoạn sau khi thay đổi.", "ex": "Tại sao chọn đáp án đúng (“Identify the steps that contribute most to time, cost,…” / “Measure the current workflow's quality, time, and cost across…”):\n\nTrước khi thay đổi workflow, cần hai bước chẩn đoán: đo baseline hiện tại về chất lượng, thời gian và chi phí qua các lần chạy gần đây, và xác định các bước gây vấn đề nhiều nhất. Hai bước này cho biết cần sửa gì và tạo cơ sở so sánh xem workflow mới có thực sự tốt hơn không.\n\nTại sao các phương án khác sai\n“Notify executive leadership of the projected savings from the…”: Báo lãnh đạo về khoản tiết kiệm dự kiến khi chưa đo đạc là thiếu căn cứ.\n\n“Deploy the updated workflow across the team and monitor…”: Triển khai workflow mới cho cả nhóm là bước sau khi đã thay đổi. E Viết lại tài liệu và SOP cũng thuộc giai đoạn sau khi thay đổi."}, {"n": 58, "cat": "E", "topic": 3, "q": "Before sharing a Claude-generated brief, an analyst applies the AI Fluency Framework’s Discernment competency to assess it. Which review most accurately reflects Discernment principles?", "o": ["Accept the brief on the basis that it reads fluently and the subject matter aligns with the analyst’s professional knowledge of the topic.", "Skip the source material check during review and rely on overall tone and logical flow as proxies for factual accuracy.", "Review the opening paragraph and the conclusion of the brief, since these sections typically reflect the quality of the full document.", "Conduct a systematic check of the brief against the task requirements, source material, and professional standards before sharing it."], "a": 3, "sk": ["Discernment competency"], "note": "Đáp án: {D}. Bẫy: {A} Văn phong trôi chảy và chủ đề quen thuộc không chứng minh nội dung chính xác; {B} Bỏ qua kiểm tra nguồn và dựa vào giọng văn là đánh giá theo bề ngoài; {C} Chỉ đọc mở đầu và kết luận sẽ bỏ sót lỗi ở phần thân.", "ex": "Tại sao chọn đáp án đúng (“Conduct a systematic check of the brief against the…”):\n\nNăng lực Discernment là đánh giá output của AI một cách có phê phán về độ chính xác, liên quan, mạch lạc và phù hợp. Vì vậy cần kiểm tra có hệ thống toàn bộ brief đối chiếu với yêu cầu nhiệm vụ, tài liệu nguồn và chuẩn mực chuyên môn trước khi chia sẻ.\n\nTại sao các phương án khác sai\n“Accept the brief on the basis that it reads…”: Văn phong trôi chảy và chủ đề quen thuộc không chứng minh nội dung chính xác.\n\n“Skip the source material check during review and rely…”: Bỏ qua kiểm tra nguồn và dựa vào giọng văn là đánh giá theo bề ngoài.\n\n“Review the opening paragraph and the conclusion of the…”: Chỉ đọc mở đầu và kết luận sẽ bỏ sót lỗi ở phần thân."}, {"n": 59, "cat": "E", "topic": 6, "q": "You are using Claude to redesign an employee onboarding workflow and must finish the high-level decomposition steps before defining detailed artifacts. Which two decomposition steps must be completed before specifying the exact email content and schedule? Each correct answer represents part of the solution.", "o": ["Pilot the onboarding workflow with a small cohort of new hires.", "Identify the major phases of the onboarding experience.", "Negotiate the onboarding budget with the finance department.", "Define the overall objective of the onboarding experience.", "Roll out the onboarding workflow to every new hire across the company."], "a": [1, 3], "sk": ["before specifying the exact email content and schedule"], "note": "Đáp án: {B} + {D}. Bẫy: {A} Pilot với nhóm nhỏ là bước sau khi đã thiết kế xong chi tiết; {C} Đàm phán ngân sách với phòng tài chính không phải bước phân rã thiết kế workflow. E Triển khai cho mọi nhân viên mới là bước cuối cùng.", "ex": "Tại sao chọn đáp án đúng (“Identify the major phases of the onboarding experience.” / “Define the overall objective of the onboarding experience.”):\n\nPhân rã cấp cao bắt đầu bằng việc xác định mục tiêu tổng thể của trải nghiệm onboarding và xác định các giai đoạn chính. Hai quyết định này tạo ra khung và mục đích mà các chi tiết như nội dung email và lịch gửi phải tuân theo.\n\nTại sao các phương án khác sai\n“Pilot the onboarding workflow with a small cohort of…”: Pilot với nhóm nhỏ là bước sau khi đã thiết kế xong chi tiết.\n\n“Negotiate the onboarding budget with the finance department.”: Đàm phán ngân sách với phòng tài chính không phải bước phân rã thiết kế workflow. E Triển khai cho mọi nhân viên mới là bước cuối cùng."}, {"n": 60, "cat": "E", "topic": 3, "q": "You are refining a prompt across several iterations. With every change, the output drifts farther from the requested template. Which step is most appropriate?", "o": ["Discard all prior versions and start with no record of what worked.", "Continue making large simultaneous changes until the output happens to align.", "Revert to the version of the prompt that produced the closest match and adjust from that baseline.", "Stop iterating and accept the most off-target version."], "a": 2, "sk": ["drifts farther from the requested template"], "note": "Đáp án: {C}. Bẫy: {A} Bỏ mọi phiên bản cũ làm mất bằng chứng về điều gì đã hiệu quả; {B} Thay đổi lớn nhiều thứ cùng lúc khiến không biết yếu tố nào gây lệch; {D} Chấp nhận phiên bản lệch nhất là đi ngược mục tiêu.", "ex": "Tại sao chọn đáp án đúng (“Revert to the version of the prompt that produced…”):\n\nKhi mỗi lần sửa lại khiến output lệch xa template hơn, nên quay về phiên bản prompt gần đúng nhất và điều chỉnh nhỏ từ baseline đó. Cách này giữ lại phần đã hoạt động và cho phép thay đổi có kiểm soát thay vì để độ lệch tích tụ.\n\nTại sao các phương án khác sai\n“Discard all prior versions and start with no record…”: Bỏ mọi phiên bản cũ làm mất bằng chứng về điều gì đã hiệu quả.\n\n“Continue making large simultaneous changes until the output happens…”: Thay đổi lớn nhiều thứ cùng lúc khiến không biết yếu tố nào gây lệch.\n\n“Stop iterating and accept the most off-target version.”: Chấp nhận phiên bản lệch nhất là đi ngược mục tiêu."}, {"n": 61, "cat": "T", "topic": 4, "q": "You are assessing items proposed for inclusion in a Project that supports policy summaries. Which two items are suitable to include in the Project? Each correct answer represents part of the solution.", "o": ["the summary format and the audience expectations the summaries must meet", "the current policy library that the summaries are drawn from", "presentation slides from a recent team training session on internal communication standards", "active client case files maintained by a separate legal team for a different workstream", "employee onboarding records used in a separate HR workflow managed by the same team"], "a": [0, 1], "sk": ["supports policy summaries"], "note": "Đáp án: {A} + {B}. Bẫy: {C} Slide đào tạo về chuẩn giao tiếp nội bộ không phục vụ trực tiếp workflow tóm tắt chính sách; {D} Hồ sơ vụ việc khách hàng của nhóm pháp lý khác là dữ liệu nhạy cảm thuộc workstream khác. E Hồ sơ onboarding nhân viên thuộc workflow HR riêng, không liên quan.", "ex": "Tại sao chọn đáp án đúng (“the summary format and the audience expectations the summaries…” / “the current policy library that the summaries are drawn…”):\n\nProject hỗ trợ tóm tắt chính sách nên chứa hai loại nội dung. Thứ nhất, định dạng tóm tắt và kỳ vọng của người đọc, phù hợp đưa vào project instructions để định hướng cách Claude trả lời. Thứ hai, thư viện chính sách hiện hành, là tài liệu tham chiếu mà các bản tóm tắt được rút ra từ đó.\n\nTại sao các phương án khác sai\n“presentation slides from a recent team training session on…”: Slide đào tạo về chuẩn giao tiếp nội bộ không phục vụ trực tiếp workflow tóm tắt chính sách.\n\n“active client case files maintained by a separate legal…”: Hồ sơ vụ việc khách hàng của nhóm pháp lý khác là dữ liệu nhạy cảm thuộc workstream khác. E Hồ sơ onboarding nhân viên thuộc workflow HR riêng, không liên quan."}, {"n": 62, "cat": "E", "topic": 3, "q": "You are categorizing structural defects in Claude output by how much they undermine clarity. Which structural defect most seriously impairs the output’s clarity?", "o": ["A single subheading is shorter than the other subheadings in the document.", "Two adjacent paragraphs present the same information using inconsistent terminology.", "Typographic inconsistencies appear throughout multiple sections of the document.", "The main conclusion contradicts the evidence presented in the body."], "a": 3, "sk": ["most seriously impairs the output’s clarity"], "note": "Đáp án: {D}. Bẫy: {A} Một tiêu đề phụ ngắn hơn là khác biệt hình thức nhỏ; {B} Thuật ngữ không nhất quán giữa hai đoạn gây khó chịu nhưng chỉ cục bộ; {C} Lỗi typography là vấn đề trình bày, không phá vỡ logic nội dung.", "ex": "Tại sao chọn đáp án đúng (“The main conclusion contradicts the evidence presented in the…”):\n\nLỗi nghiêm trọng nhất là kết luận chính mâu thuẫn với bằng chứng trong phần thân. Đây là mâu thuẫn logic cơ bản: người đọc không biết nên tin nhận định nào, làm hỏng độ rõ ràng và độ tin cậy của thông điệp trung tâm.\n\nTại sao các phương án khác sai\n“A single subheading is shorter than the other subheadings…”: Một tiêu đề phụ ngắn hơn là khác biệt hình thức nhỏ.\n\n“Two adjacent paragraphs present the same information using inconsistent…”: Thuật ngữ không nhất quán giữa hai đoạn gây khó chịu nhưng chỉ cục bộ.\n\n“Typographic inconsistencies appear throughout multiple sections of the document.”: Lỗi typography là vấn đề trình bày, không phá vỡ logic nội dung."}, {"n": 63, "cat": "T", "topic": 3, "q": "As a communications manager, you are validating a Claude-generated newsletter that contains a specific industry-growth figure. The figure is reported in three trade-press articles, but none links to the underlying study. Which validation step is appropriate?", "o": ["Accept the figure because three trade-press articles repeat it.", "Remove the source attribution and present the figure as common knowledge.", "Locate the original study referenced by the trade-press articles and verify the figure in the primary source.", "Use the highest figure across the three articles to make the newsletter more compelling."], "a": 2, "sk": ["none links to the underlying study"], "note": "Đáp án: {C}. Bẫy: {A} Số lượng nguồn thứ cấp lặp lại không thay thế cho việc kiểm chứng nguồn gốc; {B} Xóa trích dẫn và coi là kiến thức phổ thông làm giảm tính minh bạch; {D} Chọn con số cao nhất cho hấp dẫn là thiên lệch và có thể gây hiểu lầm.", "ex": "Tại sao chọn đáp án đúng (“Locate the original study referenced by the trade-press articles…”):\n\nMột con số được nhiều bài báo thương mại lặp lại vẫn có thể bắt nguồn từ cùng một nhận định chưa kiểm chứng. Cần tìm nghiên cứu gốc và xác minh trong nguồn sơ cấp, bao gồm cả phương pháp, phạm vi và bối cảnh của con số.\n\nTại sao các phương án khác sai\n“Accept the figure because three trade-press articles repeat it.”: Số lượng nguồn thứ cấp lặp lại không thay thế cho việc kiểm chứng nguồn gốc.\n\n“Remove the source attribution and present the figure as…”: Xóa trích dẫn và coi là kiến thức phổ thông làm giảm tính minh bạch.\n\n“Use the highest figure across the three articles to…”: Chọn con số cao nhất cho hấp dẫn là thiên lệch và có thể gây hiểu lầm."}, {"n": 64, "cat": "E", "topic": 5, "q": "You are preparing a document with mixed-sensitivity content for use with Claude. Which data-handling action should be completed first?", "o": ["Redact sensitive fields and replace them with appropriate placeholders.", "Classify the content of the document and identify which fields are sensitive.", "Submit the redacted document to Claude for the intended task.", "Review the redacted document with a peer to confirm the redaction is complete."], "a": 1, "sk": ["should be completed first"], "note": "Đáp án: {B}. Bẫy: {A} Redact trước khi phân loại thì không biết cần che trường nào; {C} Gửi tài liệu cho Claude là bước sau khi đã redact và kiểm tra; {D} Peer review việc redact chỉ làm được sau khi đã redact.", "ex": "Tại sao chọn đáp án đúng (“Classify the content of the document and identify which…”):\n\nBước đầu tiên là phân loại nội dung tài liệu và xác định trường nào nhạy cảm. Chỉ khi biết trường nào nhạy cảm mới có thể redact hoặc thay bằng placeholder một cách an toàn. Điều này cũng phù hợp nguyên tắc least privilege: Claude không nên nhận thông tin nhạy cảm mà nó không cần.\n\nTại sao các phương án khác sai\n“Redact sensitive fields and replace them with appropriate placeholders.”: Redact trước khi phân loại thì không biết cần che trường nào.\n\n“Submit the redacted document to Claude for the intended…”: Gửi tài liệu cho Claude là bước sau khi đã redact và kiểm tra.\n\n“Review the redacted document with a peer to confirm…”: Peer review việc redact chỉ làm được sau khi đã redact."}, {"n": 65, "cat": "T", "topic": 2, "q": "A finance consultant is revising a Claude-generated narrative for a quarterly investor update. Investors have a fixed time window for the call and expect the headline result and forward outlook to be made clear early. Which adaptation is most suitable for this audience?", "o": ["Lead with the quarter’s operational highlights, present the financial result in the middle for context, and close with the forward outlook.", "Lead with the forward outlook, since investors are most interested in what comes next, and present the headline result and drivers afterward.", "Lead with the headline result, present the key drivers concisely, and close with the forward outlook.", "Lead with a chronological recap of the quarter’s events, present the headline result at the natural end of the recap, and conclude with the forward outlook."], "a": 2, "sk": ["headline result and forward outlook to be made clear early"], "note": "Đáp án: {C}. Bẫy: {A} Đặt kết quả tài chính ở giữa khiến thông tin quan trọng nhất đến muộn; {B} Mở đầu bằng triển vọng khi chưa nêu kết quả làm thiếu nền tảng để hiểu triển vọng; {D} Tóm tắt theo trình tự thời gian đẩy kết quả chính xuống cuối, lãng phí thời lượng.", "ex": "Tại sao chọn đáp án đúng (“Lead with the headline result, present the key drivers…”):\n\nNhà đầu tư có thời lượng cố định và muốn nắm kết quả chính cùng triển vọng sớm, nên cấu trúc phù hợp là mở đầu bằng kết quả chính (headline result), tiếp theo trình bày ngắn gọn các động lực chính, rồi kết thúc bằng triển vọng (forward outlook). Thông tin quan trọng nhất cho quyết định được đưa lên đầu.\n\nTại sao các phương án khác sai\n“Lead with the quarter’s operational highlights, present the financial…”: Đặt kết quả tài chính ở giữa khiến thông tin quan trọng nhất đến muộn.\n\n“Lead with the forward outlook, since investors are most…”: Mở đầu bằng triển vọng khi chưa nêu kết quả làm thiếu nền tảng để hiểu triển vọng.\n\n“Lead with a chronological recap of the quarter’s events,…”: Tóm tắt theo trình tự thời gian đẩy kết quả chính xuống cuối, lãng phí thời lượng."}, {"n": 66, "cat": "E", "topic": 5, "q": "A knowledge worker is describing the purpose of an organizational AI governance framework to a colleague. Which description is the most accurate?", "o": ["A governance framework defines approved tools, allowed data, required reviews, and reporting paths so AI is used consistently and accountably.", "A governance framework lists the AI tools the organization licenses and the cost of each, so users can pick the most cost-effective tool for each task.", "A governance framework defines the training every employee must complete before using AI tools, with separate requirements for each tool the organization licenses.", "A governance framework documents the AI policies the organization is legally required to adopt, focusing on regulatory compliance rather than day-to-day use."], "a": 0, "sk": ["AI governance framework"], "note": "Đáp án: {A}. Bẫy: {B} Danh sách công cụ và chi phí chỉ là quản lý giấy phép, không phải governance; {C} Yêu cầu đào tạo chỉ là một phần nhỏ của governance; {D} Governance không chỉ là tuân thủ pháp lý mà còn điều chỉnh việc sử dụng hằng ngày.", "ex": "Tại sao chọn đáp án đúng (“A governance framework defines approved tools, allowed data, required…”):\n\nKhung AI governance thiết lập chính sách, quy trình, kiểm soát, vai trò và trách nhiệm cho việc dùng AI. Cụ thể, nó xác định công cụ được phê duyệt, dữ liệu được phép, yêu cầu review và kênh báo cáo để AI được sử dụng nhất quán và có trách nhiệm giải trình.\n\nTại sao các phương án khác sai\n“A governance framework lists the AI tools the organization…”: Danh sách công cụ và chi phí chỉ là quản lý giấy phép, không phải governance.\n\n“A governance framework defines the training every employee must…”: Yêu cầu đào tạo chỉ là một phần nhỏ của governance.\n\n“A governance framework documents the AI policies the organization…”: Governance không chỉ là tuân thủ pháp lý mà còn điều chỉnh việc sử dụng hằng ngày."}, {"n": 67, "cat": "T", "topic": 6, "q": "A senior project coordinator has been asked to use Claude to create an end-of-year report covering finance, operations, and customer outcomes. The three areas have distinct data owners and separate source documents. Which decomposition approach is most likely to result in a strong report?", "o": ["Define the report goals, gather inputs per section, draft each section in its own prompt, then synthesize the executive summary from the drafted sections.", "Draft the executive summary first to anchor the report's narrative, then draft each section so it supports the summary already written.", "Draft the three sections in parallel, each using a section-specific prompt, then concatenate and lightly edit the outputs into the final report.", "Prompt Claude once with all source documents and request the full report, including the executive summary, in a single pass."], "a": 0, "sk": ["distinct data owners and separate source documents"], "note": "Đáp án: {A}. Bẫy: {B} Viết executive summary trước buộc các phần phải phục vụ một câu chuyện có sẵn thay vì phản ánh dữ liệu; {C} Ghép nối các phần rồi sửa nhẹ thiếu bước tổng hợp và thiếu mục tiêu chung; {D} Một prompt duy nhất cho mọi tài liệu làm giảm độ tập trung và khó truy vết nguồn.", "ex": "Tại sao chọn đáp án đúng (“Define the report goals, gather inputs per section, draft…”):\n\nBáo cáo liên phòng ban mạnh được xây dựng theo trình tự: xác định mục tiêu báo cáo, thu thập đầu vào theo từng phần, soạn mỗi phần bằng prompt riêng, rồi tổng hợp executive summary từ các phần đã soạn. Cách này giữ được truy vết về nguồn của từng mảng và đảm bảo bản tóm tắt phản ánh đúng phát hiện thực tế.\n\nTại sao các phương án khác sai\n“Draft the executive summary first to anchor the report's…”: Viết executive summary trước buộc các phần phải phục vụ một câu chuyện có sẵn thay vì phản ánh dữ liệu.\n\n“Draft the three sections in parallel, each using a…”: Ghép nối các phần rồi sửa nhẹ thiếu bước tổng hợp và thiếu mục tiêu chung.\n\n“Prompt Claude once with all source documents and request…”: Một prompt duy nhất cho mọi tài liệu làm giảm độ tập trung và khó truy vết nguồn."}, {"n": 68, "cat": "T", "topic": 5, "q": "A customer-success associate is preparing a prompt asking Claude to summarize a customer issue from a case file. The case file contains the customer’s full government identifier, home address, name, account number, and a description of the issue. The associate needs a summary focused on the issue. Which approach is most appropriate?", "o": ["Submit the full case file and include an instruction telling Claude not to reference the government identifier or the home address in the summary.", "Replace the government identifier with the customer’s name and the home address with the account number, since names and account numbers are less sensitive than identifiers and addresses.", "Remove or redact the government identifier and the home address before submitting the prompt, since neither is necessary for a summary of the issue.", "Submit only the description of the issue and add the customer’s name for context, since the description plus a name is sufficient to produce a summary."], "a": 2, "sk": ["needs a summary focused on the issue"], "note": "Đáp án: {C}. Bẫy: {A} Dữ liệu nhạy cảm vẫn bị gửi đi, chỉ dặn Claude không nhắc lại thì không ngăn được việc phơi nhiễm; {B} Thay bằng tên và số tài khoản vẫn là dữ liệu cá nhân và có thể làm sai lệch nội dung; {D} Chỉ gửi mô tả kèm tên có thể làm mất ngữ cảnh hữu ích khác mà không có lý do chính đáng.", "ex": "Tại sao chọn đáp án đúng (“Remove or redact the government identifier and the home…”):\n\nNguyên tắc data minimization yêu cầu chỉ cung cấp thông tin cần thiết cho nhiệm vụ. Vì bản tóm tắt chỉ tập trung vào vấn đề, nên số định danh chính phủ và địa chỉ nhà là dữ liệu nhạy cảm không cần thiết, phải được xóa hoặc redact trước khi gửi prompt.\n\nTại sao các phương án khác sai\n“Submit the full case file and include an instruction…”: Dữ liệu nhạy cảm vẫn bị gửi đi, chỉ dặn Claude không nhắc lại thì không ngăn được việc phơi nhiễm.\n\n“Replace the government identifier with the customer’s name and…”: Thay bằng tên và số tài khoản vẫn là dữ liệu cá nhân và có thể làm sai lệch nội dung.\n\n“Submit only the description of the issue and add…”: Chỉ gửi mô tả kèm tên có thể làm mất ngữ cảnh hữu ích khác mà không có lý do chính đáng."}, {"n": 69, "cat": "E", "topic": 6, "q": "You are a process consultant incorporating Claude into an existing weekly workflow. Which sequence of integration steps is correct? 1. Pilot the integrated workflow with a small group and collect feedback. 2. Document the current workflow’s steps, owners, and decision points. 3. Update the documented workflow and deploy it to the broader team. 4. Identify the steps where Claude can augment work and where humans must remain. 5. Define the inputs Claude requires, the outputs Claude provides, and the hand-offs around each step.", "o": ["2, 4, 5, 1, 3", "2, 5, 4, 1, 3", "4, 2, 5, 1, 3", "1, 2, 4, 5, 3"], "a": 0, "sk": ["incorporating Claude into an existing weekly workflow"], "note": "Đáp án: {A}. Bẫy: {B} Định nghĩa đầu vào và đầu ra trước khi biết bước nào giao cho Claude là thiếu cơ sở; {C} Phân bổ việc cho Claude trước khi hiểu workflow hiện tại là thiếu nền tảng; {D} Pilot trước khi thiết kế workflow tích hợp thì không có gì để thử nghiệm.", "ex": "Tại sao chọn đáp án đúng (“2, 4, 5, 1, 3”):\n\nTrình tự đúng là 2, 4, 5, 1, 3. Đầu tiên (2) ghi lại workflow hiện tại: các bước, người phụ trách và điểm ra quyết định. Sau đó (4) xác định bước nào Claude hỗ trợ và bước nào con người phải giữ. Tiếp theo (5) định nghĩa đầu vào, đầu ra và các điểm bàn giao. Rồi (1) pilot với nhóm nhỏ để thu phản hồi. Cuối cùng (3) cập nhật tài liệu và triển khai rộng.\n\nTại sao các phương án khác sai\n“2, 5, 4, 1, 3”: Định nghĩa đầu vào và đầu ra trước khi biết bước nào giao cho Claude là thiếu cơ sở.\n\n“4, 2, 5, 1, 3”: Phân bổ việc cho Claude trước khi hiểu workflow hiện tại là thiếu nền tảng.\n\n“1, 2, 4, 5, 3”: Pilot trước khi thiết kế workflow tích hợp thì không có gì để thử nghiệm."}, {"n": 70, "cat": "T", "topic": 3, "q": "A customer-success team member reviews a Claude-generated customer health-check report against the agreed deliverable list. The report addresses all five required topics, but its renewal-risk section identifies only one risk factor, whereas the deliverable specification requires renewal risk to be evaluated across pricing, product fit, and stakeholder change. Which conclusion is best supported?", "o": ["The report’s completeness cannot be assessed from the deliverable specification alone; the customer should review the output and confirm whether the renewal-risk depth is sufficient.", "The report does not meet the deliverable specification because a section that addresses only one of three required risk dimensions counts as a missing section.", "The report meets the deliverable specification because all five required topics appear and the renewal-risk section is present in the output.", "The report meets the topic-level requirements but the renewal-risk section is under-scoped against the specification and should be expanded before delivery."], "a": 3, "sk": ["across pricing, product fit, and stakeholder change"], "note": "Đáp án: {D}. Bẫy: {A} Đặc tả đã đủ rõ để đánh giá, không cần đẩy việc kiểm tra sang khách hàng; {B} Coi phần thiếu chiều sâu là phần bị thiếu hẳn là phân loại sai; {C} Chỉ có mặt chủ đề chưa đủ, vì đặc tả còn yêu cầu về chiều sâu nội dung.", "ex": "Tại sao chọn đáp án đúng (“The report meets the topic-level requirements but the renewal-risk…”):\n\nBáo cáo có đủ năm chủ đề nên đạt yêu cầu ở cấp chủ đề, nhưng phần renewal risk chỉ nêu một yếu tố trong khi đặc tả yêu cầu ba yếu tố (pricing, product fit, stakeholder change). Vì vậy phần này chưa đủ phạm vi (under-scoped) và cần mở rộng trước khi giao.\n\nTại sao các phương án khác sai\n“The report’s completeness cannot be assessed from the deliverable…”: Đặc tả đã đủ rõ để đánh giá, không cần đẩy việc kiểm tra sang khách hàng.\n\n“The report does not meet the deliverable specification because…”: Coi phần thiếu chiều sâu là phần bị thiếu hẳn là phân loại sai.\n\n“The report meets the deliverable specification because all five…”: Chỉ có mặt chủ đề chưa đủ, vì đặc tả còn yêu cầu về chiều sâu nội dung."}, {"n": 71, "cat": "T", "topic": 4, "q": "An analyst has been asked to calculate summary statistics from an uploaded sales-data file and create a chart for a weekly report. Which output approach is the best fit for this task?", "o": ["Ask Claude to estimate the summary statistics from a brief preview of the file, accepting unverified figures rather than running the calculations against the full uploaded dataset.", "Produce a written placeholder for the chart in the chat response without generating the actual visualization, leaving the weekly report without the visual output it requires.", "Request a narrative description of the data in the chat response without computing values, leaving the summary statistics and the chart unproduced and the weekly report incomplete.", "Use Code Execution to perform the calculations and generate the chart, then verify the computed results against the source data before sharing the output."], "a": 3, "sk": ["calculate summary statistics", "create a chart"], "note": "Đáp án: {D}. Bẫy: {A} Ước lượng từ bản xem trước cho ra số liệu chưa kiểm chứng; {B} Chỉ để placeholder thay cho biểu đồ khiến báo cáo thiếu hình ảnh cần thiết; {C} Mô tả bằng lời mà không tính toán thì không tạo ra thống kê lẫn biểu đồ.", "ex": "Tại sao chọn đáp án đúng (“Use Code Execution to perform the calculations and generate…”):\n\nNhiệm vụ cần tính thống kê và vẽ biểu đồ từ file dữ liệu, nên phù hợp nhất là dùng Code Execution để tính trên toàn bộ dataset và tạo biểu đồ, sau đó xác minh kết quả với dữ liệu gốc trước khi chia sẻ.\n\nTại sao các phương án khác sai\n“Ask Claude to estimate the summary statistics from a…”: Ước lượng từ bản xem trước cho ra số liệu chưa kiểm chứng.\n\n“Produce a written placeholder for the chart in the…”: Chỉ để placeholder tha
