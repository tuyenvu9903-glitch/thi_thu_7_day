<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khóa ôn CCAO-F</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: course player. Navy band on every view, white cards on a pale page, question outline as the side panel. Deliberately one light theme, like learning platforms. */
:root {
  color-scheme: light;
  --bg: #f4f6fa; --sheet: #ffffff; --sunken: #eef1f6; --ink: #1a2233; --muted: #4b5669; --line: #dde2ea; --line2: #b4bdcb;
  --head: #14233d; --head-ink: #ffffff; --head-muted: #c8d2e2; --head-line: #6f7f99; --head-hover: #24375a; --head-track: #33466a; --head-alert: #ffb4a8;
  --accent: #1557d0; --accent-ink: #ffffff; --accent-soft: #e9f0fd;
  --good: #11703f; --good-soft: #e2f5ea; --bad: #b3261e; --bad-soft: #fdeceb; --warn: #875100; --warn-soft: #fff1d6; --amber: #f2a93b;
  --elim: #f0f2f6;
  --display: "Lexend", "Segoe UI", Roboto, Arial, sans-serif;
  --sans: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 18px/1.6 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
code { font: 500 .84em var(--mono); background: var(--sunken); padding: .1em .36em; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero :focus-visible, .bar :focus-visible { outline-color: var(--head-ink); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 16px var(--sans); color: var(--muted); }

.btn { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 17px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #1048b0; border-color: #1048b0; color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.hero .btn, .bar .btn { background: transparent; border-color: var(--head-line); color: var(--head-ink); }
.hero .btn:hover, .bar .btn:hover { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }
.hero .btn.primary, .bar .btn.primary { background: var(--head-ink); border-color: var(--head-ink); color: var(--head); }
.hero .btn.primary:hover, .bar .btn.primary:hover { background: var(--accent-soft); color: var(--head); }
.hero .btn[aria-pressed="true"], .bar .btn[aria-pressed="true"] { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }

/* Navy band */
.hero { background: var(--head); color: var(--head-ink); }
.hero .wrap { padding-block: 40px 44px; display: grid; gap: 18px; }
.hero .eyebrow { color: var(--head-muted); }
.hero h1 { font-size: clamp(32px, 5vw, 46px); font-weight: 700; }
.hero .lead { max-width: 66ch; color: var(--head-muted); font-size: 19px; }
.herofacts { display: flex; flex-wrap: wrap; gap: 8px 32px; list-style: none; margin: 0; padding: 0; }
.herofacts b { font: 600 22px var(--display); margin-right: 6px; font-variant-numeric: tabular-nums; }
.herofacts li { color: var(--head-muted); }
.herofacts li b { color: var(--head-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .primary { padding: 11px 28px; font-size: 18px; }

.card, .cols > section, .sheetx { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.start { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cols > * { min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 17px; }
.tbl th, .tbl td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-weight: 400; }
.tbl tr:last-child th, .tbl tr:last-child td { border-bottom: 0; }
.tbl th { color: var(--muted); width: 38%; padding-right: 12px; }
.tbl .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.start h2, .cols h2 { font-size: 20px; margin-bottom: 10px; }
.note { background: var(--accent-soft); padding: 18px 22px; font-size: 17px; border-radius: 12px; }
.note ul { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }

.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.setcard { display: grid; gap: 4px; text-align: left; background: var(--sheet); color: var(--ink); border: 1px solid var(--line2); border-radius: 12px; padding: 14px 18px; }
.setcard:hover { border-color: var(--accent); }
.setcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.setcard b { font: 600 20px var(--display); }
.setstat { font-weight: 600; font-size: 16px; color: var(--muted); }
.setstat.pass { color: var(--good); } .setstat.fail { color: var(--bad); }
.setscen { font-size: 16px; color: var(--muted); }
.tblwrap { overflow-x: auto; }
.hist th, .hist td { width: auto; padding-right: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Exam */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-ink); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.bar .code { font: 600 18px var(--display); }
.bar .prog { color: var(--head-muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.bar .spacer { flex: 1; }
.bar .btn { padding: 6px 14px; font-size: 16px; }
.timer { font: 600 21px var(--display); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--head-alert); }
.pbar { height: 4px; background: var(--head-track); }
.pbar span { display: block; height: 100%; background: var(--amber); }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding-block: 24px 56px; align-items: start; }
.exam > * { min-width: 0; }
.scen { background: var(--accent-soft); padding: 16px 24px; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; font-size: 17px; }
.scen b { display: block; margin-bottom: 2px; font: 600 17px var(--display); }
.sheet { background: var(--sheet); padding: 22px 24px; border: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.qhead .btn { padding: 4px 12px; font-size: 16px; }
.stem { font-size: 20px; line-height: 1.5; font-weight: 600; max-width: 72ch; }
.instr { margin-top: 12px; font-size: 17px; font-weight: 600; color: var(--accent); }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 13px 16px; background: var(--sheet); border: 1px solid var(--line2); border-radius: 10px; cursor: pointer; }
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
.ltr { width: 30px; height: 30px; display: grid; place-items: center; border: 1.5px solid var(--line2); border-radius: 50%; font: 600 16px/1 var(--sans); background: var(--sheet); }
.opt.multi .ltr { border-radius: 7px; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.off { opacity: .6; cursor: not-allowed; }
.opt.off:hover { border-color: var(--line2); background: var(--sheet); }
.limit { margin-top: 10px; font-size: 16px; color: var(--warn); min-height: 24px; }
.navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.navrow .spacer { flex: 1; }

.map { position: sticky; top: 90px; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto; }
.map h2 { font-size: 18px; }
.map h3 { display: flex; justify-content: space-between; font: 600 16px var(--sans); margin-bottom: 6px; }
.map h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 7px; font: 500 15px var(--sans); padding: 0; }
.cell:hover { border-color: var(--accent); }
.cell.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.cur { outline: 2px solid var(--head); outline-offset: 1px; }
.cell.flag::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; background: var(--amber); border: 2px solid var(--sheet); border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .a { background: var(--accent); }
.legend .f { background: var(--amber); border-radius: 50%; }
.maptoggle { display: none; }

.veil { position: fixed; inset: 0; background: rgba(15, 25, 45, .55); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--sheet); max-width: 480px; width: 100%; padding: 26px; border-radius: 12px; display: grid; gap: 12px; }
.modal h2 { font-size: 22px; }
.modal .sub { color: var(--muted); }
.linklist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.linklist button { border: 1px solid var(--line2); background: none; color: var(--ink); border-radius: 6px; font-size: 15px; padding: 2px 9px; }

/* Result */
.result { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 36px; align-items: end; }
.score { font: 700 clamp(56px, 10vw, 84px)/1 var(--display); font-variant-numeric: tabular-nums; }
.score small { font-size: .28em; font-weight: 500; color: var(--head-muted); }
.tag { display: inline-block; padding: 3px 14px; border-radius: 999px; font: 700 16px var(--sans); }
.tag.pass, .mark.ok { background: var(--good-soft); color: var(--good); }
.tag.fail, .mark.no { background: var(--bad-soft); color: var(--bad); }
.verdict .facts { color: var(--head-muted); margin-top: 6px; }
.scale { position: relative; height: 40px; margin-top: 8px; grid-column: 1 / -1; }
.scale .track, .scale .fill { position: absolute; left: 0; top: 6px; height: 10px; border-radius: 5px; }
.scale .track { right: 0; background: var(--head-track); }
.scale .fill { background: var(--head-ink); }
.scale .tick { position: absolute; top: 0; width: 3px; height: 22px; background: var(--amber); }
.scale .lab { position: absolute; top: 23px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--head-muted); transform: translateX(-50%); }
.scale .lab.l { transform: none; } .scale .lab.r { transform: translateX(-100%); }
.rows { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 54px 60px; gap: 4px 10px; align-items: baseline; font-size: 17px; }
.row .pct, .row .frac { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .frac { color: var(--muted); font-weight: 400; }
.row .b { grid-column: 1 / -1; height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.row .b span { display: block; height: 100%; background: var(--bad); }
.row .b span.g { background: var(--good); } .row .b span.w { background: var(--amber); }
.result > section > h2 { font-size: 22px; margin-bottom: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 15px; font-size: 16px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: inherit; font-size: 16px; padding: 5px 10px; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 8px; max-width: 100%; }
.reviews { display: grid; gap: 14px; }
.rev { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: grid; gap: 12px; }
.rev .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; color: var(--muted); }
.mark { padding: 1px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.mark.blank { background: var(--warn-soft); color: var(--warn); }
.rev .stem { font-size: 19px; }
.ro { display: grid; gap: 6px; }
.ro div { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 12px; border: 1px solid transparent; border-radius: 8px; }
.ro .is { background: var(--good-soft); border-color: var(--good); }
.ro .is .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.ro .wrongpick { background: var(--bad-soft); border-color: var(--bad); }
.ro .wrongpick .ltr { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
.ro .why { font: 700 15px/1.9 var(--sans); white-space: nowrap; }
.ro .is .why { color: var(--good); } .ro .wrongpick .why { color: var(--bad); }
.exp { background: var(--sunken); padding: 14px 18px; border-radius: 8px; }
.exp::before { content: "Giải thích"; display: block; font: 600 16px var(--display); margin-bottom: 2px; }
.empty { color: var(--muted); padding: 16px 0; }

/* Options the hint rules out: grey and dashed, so they recede and the live options stand out */
.opt.elim { background: var(--elim); border-style: dashed; }
.opt.elim .ltr { background: var(--elim); }
.opt.elim.sel { background: var(--accent-soft); border-style: solid; }
.opt.elim.sel .ltr { background: var(--accent); }
.elim code { background: var(--line); }
.elimnote { grid-column: 2; font-size: 16px; line-height: 1.45; color: var(--muted); }
.ro .elim { background: var(--elim); border: 1px dashed var(--line2); }
.ro .wrongpick.elim { background: var(--bad-soft); border: 1px solid var(--bad); }
.ro .elimnote { grid-column: 2 / -1; }
.ro .wrongpick .elimnote { color: var(--bad); }
.opt.right:not(.sel) { background: var(--good-soft); border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.opt.right:not(.sel) .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.rightnote { grid-column: 2; font-size: 16px; line-height: 1.45; font-weight: 700; color: var(--good); }
.hintnote { background: var(--warn-soft); color: var(--warn); display: inline-block; padding: 3px 12px; border-radius: 6px; font-size: 16px; margin-top: 8px; font-weight: 600; }

.sheetx h2 { font-size: 22px; margin-bottom: 4px; }
.sheetx .sub { color: var(--muted); max-width: 72ch; margin-bottom: 18px; }
.egroup { margin-bottom: 20px; }
.egroup h3 { font-size: 17px; padding-bottom: 6px; border-bottom: 2px solid var(--line2); }
.erow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.5; }
.erow > * { min-width: 0; }
.erow .term { font-weight: 600; }
.erow .why { color: var(--muted); }
.ehead { font: 600 15px var(--sans); color: var(--muted); padding: 8px 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
details.sheetx > summary { cursor: pointer; font: 600 20px var(--display); }
details.sheetx[open] > summary { margin-bottom: 8px; }
.dlmsg { color: var(--muted); font-size: 16px; }
.sync .sub { color: var(--muted); max-width: 72ch; margin-bottom: 14px; }
.sync textarea { display: block; width: 100%; min-height: 84px; margin-top: 12px; padding: 10px 12px; font: 400 14px/1.4 var(--mono); color: var(--ink); background: var(--sunken); border: 1px solid var(--line2); border-radius: 8px; resize: vertical; word-break: break-all; }
.sync .syncmsg { margin-top: 10px; font-size: 16px; color: var(--muted); }
.sync .syncmsg.ok { color: var(--good); }
.sync .syncmsg.err { color: var(--bad); }

@media (max-width: 860px) {
  .erow { grid-template-columns: minmax(0, 1fr); }
  .ehead { display: none; }
  .bar .wrap { gap: 6px 8px; padding-block: 8px; }
  .bar .btn { padding: 3px 10px; font-size: 15px; }
  .bar .code { font-size: 16px; }
  .bar .prog { font-size: 15px; }
  .bar .timer { font-size: 18px; }
  .cols, .exam { grid-template-columns: minmax(0, 1fr); }
  .map { position: static; max-height: none; }
  .map:not(.open) { display: none; }
  .maptoggle { display: inline-block; }
  .cells { grid-template-columns: repeat(8, 1fr); }
  .sheet, .scen, .rev, .card, .cols > section, .sheetx { padding-inline: 16px; }
  .stem { font-size: 19px; }
  .opt { padding: 11px 12px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .ro div { grid-template-columns: 30px minmax(0, 1fr); }
  .ro .why { grid-column: 2; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .btn, .cell, .chip { transition: border-color .12s, background .12s, color .12s; } }

.flashwrap { display: grid; gap: 8px; }
.diffblock { margin: 8px 0 28px; scroll-margin-top: 64px; }
.domgroup { scroll-margin-top: 56px; }
.domhead { margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--line2); font: 650 16px var(--sans); color: var(--muted); letter-spacing: .02em; }
.domhead span { font-weight: 500; }
.domchips { margin-bottom: 18px; }
.diffblock h2 { margin: 0 0 10px; font: 650 22px/1.3 var(--display); }
.difftable { width: 100%; }
.difftable th, .difftable td { text-align: left; vertical-align: top; padding: 12px 16px; }
.difftable th { color: var(--muted); font-weight: 600; }
.difftable th:last-child, .difftable td:last-child { width: 42%; }
.difftable td:last-child { font-weight: 600; }
.diffnote { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
.flashwrap > .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 12px; }
.diffblock.diffhl { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 8px; background: var(--accent-soft); padding: 12px 14px; }
.rev .stem.hasdiff a { color: inherit; text-decoration: none; cursor: pointer; }
.rev .stem.hasdiff a:hover { color: var(--accent); }
.difflinks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0; }
.difflinks .lbl { color: var(--muted); font-size: 16px; font-weight: 600; }
a.diffjump { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 12px; font: 600 16px var(--sans); cursor: pointer; text-decoration: none; display: inline-block; }
a.diffjump:hover { background: var(--accent); color: var(--accent-ink); }
mark.kw { background: #ffe566; color: inherit; padding: 0 .12em; border-radius: 2px; font-weight: inherit; box-decoration-break: clone; -webkit-box-decoration-break: clone; }


@media (max-width: 860px) {
  .difftable th:last-child, .difftable td:last-child { width: auto; }
  .difftable, .difftable tbody, .difftable tr, .difftable th, .difftable td { display: block; }
  .difftable tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .difftable th { display: none; }
  .difftable td { padding: 4px 0; }
  .difftable td:last-child { font-weight: 650; color: var(--good); }
}
.crules { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; }
.cell.cok { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.cell.cno { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }

<script>

const COURSE_BANK = [{"n": 1, "cat": "T", "topic": 3, "q": "A strategy manager reviews a Claude-generated recommendation to merge the company’s two regional warehouses into a single location. The recommendation references three sources estimating cost savings and one source that confirms consolidation is operationally feasible. Two source documents also include estimates of one-time transition costs and a stakeholder concern about regional service levels, neither of which is included in the recommendation. Which concern is most justified?", "o": ["The recommendation is acceptable for an initial round, but the missing material should be added in a separate appendix rather than reprompting the original output.", "The recommendation reflects selective use of the source documents and should be re-prompted to address the transition costs and the service-level concern before it is used.", "The recommendation should be rejected because it relies on only four sources, which is insufficient for a decision of this size.", "The recommendation is sound because every source it cites supports the consolidation conclusion."], "a": 1, "sk": ["neither of which is included in the recommendation"], "note": "Đáp án: {B}. Bẫy: {A} đưa thông tin thiếu vào phụ lục riêng không sửa được lập luận chính vốn đã lệch; {C} vấn đề không nằm ở số lượng nguồn mà ở việc bỏ sót bằng chứng bất lợi; {D} mọi nguồn được trích đều ủng hộ chính là dấu hiệu chọn lọc, không phải bằng chứng cho thấy khuyến nghị đúng.", "ex": "Tại sao chọn đáp án đúng (“The recommendation reflects selective use of the source documents…”):\n\nBản khuyến nghị chỉ dùng các nguồn ủng hộ việc gộp kho, trong khi tài liệu nguồn còn có chi phí chuyển đổi một lần và lo ngại về mức độ dịch vụ khu vực. Đây là sử dụng nguồn có chọn lọc: chỉ trình bày bằng chứng thuận lợi cho kết luận. Một khuyến nghị ra quyết định phải tính đến mọi bằng chứng quan trọng có thể làm thay đổi kết quả, nên cần re-prompt để bổ sung chi phí chuyển đổi và mối lo về dịch vụ trước khi sử dụng.\n\nTại sao các phương án khác sai\n“The recommendation is acceptable for an initial round, but…”: đưa thông tin thiếu vào phụ lục riêng không sửa được lập luận chính vốn đã lệch.\n\n“The recommendation should be rejected because it relies on…”: vấn đề không nằm ở số lượng nguồn mà ở việc bỏ sót bằng chứng bất lợi.\n\n“The recommendation is sound because every source it cites…”: mọi nguồn được trích đều ủng hộ chính là dấu hiệu chọn lọc, không phải bằng chứng cho thấy khuyến nghị đúng."}, {"n": 2, "cat": "E", "topic": 1, "q": "You are an operations lead classifying proposed Claude use cases according to whether they are acceptable for your team to pursue. Which two proposed use cases are acceptable for the team to pursue with Claude? Each correct answer provides a complete solution.", "o": ["synthesizing themes across approved customer feedback under aggregation rules", "summarizing performance review notes across a team to support a manager’s promotion decisions", "drafting a preliminary symptom summary to support a clinician’s diagnostic review", "drafting a legal summary that an attorney will review and edit before sharing with a client", "drafting an internal training summary from approved internal documentation"], "a": [0, 4], "sk": ["acceptable for the team to pursue"], "note": "Đáp án: {A} + {E}. Bẫy: {B} tóm tắt đánh giá hiệu suất để quyết định thăng chức là quyết định nhân sự có tác động lớn đến cá nhân; {C} hỗ trợ chẩn đoán là lĩnh vực y tế cần kiểm soát đặc biệt; {D} tư vấn pháp lý gửi khách hàng là lĩnh vực nhạy cảm, không phải use case thường quy dù luật sư có chỉnh sửa.", "ex": "Tại sao chọn đáp án đúng (“synthesizing themes across approved customer feedback under aggregation rules” / “drafting an internal training summary from approved internal documentation”):\n\nHai use case được chấp nhận là tổng hợp chủ đề từ phản hồi khách hàng đã được phê duyệt theo quy tắc tổng hợp (aggregation rules) và soạn tóm tắt đào tạo nội bộ từ tài liệu nội bộ đã duyệt. Cả hai đều là tác vụ xử lý thông tin có phạm vi rõ ràng, dữ liệu đã được phép dùng và rủi ro thấp.\n\nNgược lại, quyết định thăng chức, hỗ trợ chẩn đoán y tế và soạn văn bản pháp lý gửi khách hàng đều thuộc lĩnh vực tác động cao (việc làm, y tế, pháp lý), cần biện pháp bảo vệ tăng cường; có người review không tự động biến chúng thành use case thường ngày của nhóm.\n\nTại sao các phương án khác sai\n“summarizing performance review notes across a team to support…”: tóm tắt đánh giá hiệu suất để quyết định thăng chức là quyết định nhân sự có tác động lớn đến cá nhân.\n\n“drafting a preliminary symptom summary to support a clinician’s…”: hỗ trợ chẩn đoán là lĩnh vực y tế cần kiểm soát đặc biệt.\n\n“drafting a legal summary that an attorney will review…”: tư vấn pháp lý gửi khách hàng là lĩnh vực nhạy cảm, không phải use case thường quy dù luật sư có chỉnh sửa."}, {"n": 3, "cat": "E", "topic": 4, "q": "You are an analyst tackling a one-off, complex problem that truly requires multi-step reasoning across an extended chain of thought. Which model is most appropriate for this work?", "o": ["A non-Anthropic model, because the Claude lineup has no option for complex reasoning.", "Opus, because it is positioned as the most capable for advanced reasoning on complex specialized tasks.", "Haiku, because lightweight models are always preferred regardless of complexity.", "Any model, because reasoning depth does not vary across the lineup."], "a": 1, "sk": ["truly requires multi-step reasoning"], "note": "Đáp án: {B}. Bẫy: {A} sai sự thật, dòng Claude có Opus dành cho suy luận phức tạp; {C} Haiku tối ưu cho tốc độ và chi phí, không phải cho suy luận sâu, và không có quy tắc luôn ưu tiên model nhẹ; {D} độ sâu suy luận khác nhau rõ rệt giữa các model trong dòng sản phẩm.", "ex": "Tại sao chọn đáp án đúng (“Opus, because it is positioned as the most capable…”):\n\nBài toán là một lần, phức tạp và cần suy luận nhiều bước qua chuỗi lập luận dài. Opus là dòng model có năng lực cao nhất của Anthropic, được định vị cho suy luận nâng cao và tác vụ chuyên sâu phức tạp, nên là lựa chọn phù hợp nhất. Vì đây là việc không lặp lại với khối lượng lớn, chi phí và độ trễ cao hơn của Opus là đánh đổi hợp lý.\n\nTại sao các phương án khác sai\n“A non-Anthropic model, because the Claude lineup has no…”: sai sự thật, dòng Claude có Opus dành cho suy luận phức tạp.\n\n“Haiku, because lightweight models are always preferred regardless of…”: Haiku tối ưu cho tốc độ và chi phí, không phải cho suy luận sâu, và không có quy tắc luôn ưu tiên model nhẹ.\n\n“Any model, because reasoning depth does not vary across…”: độ sâu suy luận khác nhau rõ rệt giữa các model trong dòng sản phẩm."}, {"n": 4, "cat": "T", "topic": 5, "q": "Before uploading a customer file for Code Execution analysis, a customer-success associate at Noventra, Ltd. is reviewing the planned task. Which two practices most closely align with sound data handling?", "o": ["Confirm that the planned Code Execution task aligns with the organization’s data classification policy and escalate to the appropriate contact if the data sensitivity exceeds approved use.", "Review the file for sensitive, confidential, or regulated fields before upload, and remove or redact any fields that are not required for the planned Code Execution analysis.", "Skip the upload review entirely on the basis of urgency, even though the file might contain regulated fields that organizational policy requires the user to redact before any code execution.", "Bypass the data classification policy because the task is internal, treating sandboxed processing as an exemption from the review the policy requires before sensitive data is uploaded.", "Upload the full unredacted customer file without review, on the assumption that a sandboxed execution environment removes the need to apply the organization’s data classification policy."], "a": [0, 1], "sk": ["sound data handling"], "note": "Đáp án: {A} + {B}. Bẫy: {C} sự gấp gáp không phải lý do bỏ qua bước rà soát mà chính sách yêu cầu; {D} tác vụ nội bộ hay sandbox đều không phải ngoại lệ của chính sách phân loại. E upload toàn bộ file chưa che dựa trên giả định sandbox là vi phạm nguyên tắc tối thiểu hóa dữ liệu.", "ex": "Tại sao chọn đáp án đúng (“Confirm that the planned Code Execution task aligns with…” / “Review the file for sensitive, confidential, or regulated fields…”):\n\nHai thực hành đúng: thứ nhất, đối chiếu tác vụ Code Execution với chính sách phân loại dữ liệu (data classification policy) của tổ chức và escalate cho đầu mối phù hợp nếu độ nhạy của dữ liệu vượt mức được phép. Thứ hai, rà soát file trước khi upload, xóa hoặc che (redact) các trường nhạy cảm, bảo mật hoặc chịu quy định mà phân tích không cần đến (tối thiểu hóa dữ liệu).\n\nMôi trường sandbox chỉ cô lập việc chạy code, không miễn trừ nghĩa vụ tuân thủ chính sách và tối thiểu hóa dữ liệu.\n\nTại sao các phương án khác sai\n“Skip the upload review entirely on the basis of…”: sự gấp gáp không phải lý do bỏ qua bước rà soát mà chính sách yêu cầu.\n\n“Bypass the data classification policy because the task is…”: tác vụ nội bộ hay sandbox đều không phải ngoại lệ của chính sách phân loại. E upload toàn bộ file chưa che dựa trên giả định sandbox là vi phạm nguyên tắc tối thiểu hóa dữ liệu."}, {"n": 5, "cat": "T", "topic": 6, "q": "You are assessing proposed workflow changes to determine whether they materially improve the workflow. Which two proposed changes meaningfully improve a recurring Claude workflow? Each correct answer provides a complete solution.", "o": ["updating the team’s shared workspace name to reflect the new workflow process", "labeling each workflow step with descriptive names to improve readability for new team members", "extracting the standard reference material into a Project to avoid repeating it", "reorganizing the workflow document’s section headings to improve navigation", "adding a quality check on outputs before they enter the downstream process"], "a": [2, 4], "sk": ["materially improve the workflow"], "note": "Đáp án: {C} + {E}. Bẫy: {A} đổi tên workspace chỉ mang tính tổ chức, không ảnh hưởng chất lượng hay hiệu suất; {B} đặt tên bước giúp dễ đọc nhưng không thêm context hay cơ chế kiểm soát; {D} sắp xếp lại tiêu đề chỉ cải thiện điều hướng tài liệu, không cải thiện workflow.", "ex": "Tại sao chọn đáp án đúng (“extracting the standard reference material into a Project to…” / “adding a quality check on outputs before they enter…”):\n\nHai thay đổi thực sự cải thiện workflow lặp lại: đưa tài liệu tham chiếu chuẩn vào một Project để Claude dùng làm context cho mọi chat trong Project, tránh phải dán lại mỗi lần; và thêm bước kiểm tra chất lượng đầu ra trước khi kết quả đi vào quy trình phía sau, ngăn lỗi lan truyền xuống downstream.\n\nCả hai đều thay đổi cách Claude nhận context hoặc cách kiểm soát output, tức là tác động trực tiếp đến hiệu quả và độ tin cậy.\n\nTại sao các phương án khác sai\n“updating the team’s shared workspace name to reflect the…”: đổi tên workspace chỉ mang tính tổ chức, không ảnh hưởng chất lượng hay hiệu suất.\n\n“labeling each workflow step with descriptive names to improve…”: đặt tên bước giúp dễ đọc nhưng không thêm context hay cơ chế kiểm soát.\n\n“reorganizing the workflow document’s section headings to improve navigation”: sắp xếp lại tiêu đề chỉ cải thiện điều hướng tài liệu, không cải thiện workflow."}, {"n": 6, "cat": "E", "topic": 3, "q": "You are evaluating a Claude-generated report that maintains a confident tone throughout. Which question most effectively distinguishes plausibility from verification?", "o": ["Can each specific claim be traced to a credible source or to the supplied input material?", "Does the response open with a clear, well-framed statement of the main finding?", "Does the response cover the topic comprehensively based on its length and section count?", "Does the response use varied sentence structure across sections?"], "a": 0, "sk": ["distinguishes plausibility from verification"], "note": "Đáp án: {A}. Bẫy: {B} mở đầu rõ ràng chỉ là cách trình bày, không chứng minh tính đúng; {C} độ dài và số phần không nói lên nội dung có căn cứ hay không; {D} câu văn đa dạng là yếu tố văn phong, hoàn toàn không liên quan đến xác minh.", "ex": "Tại sao chọn đáp án đúng (“Can each specific claim be traced to a credible…”):\n\nGiọng văn tự tin chỉ làm nội dung trông hợp lý (plausible), chưa chứng minh nó đã được xác minh (verified). Câu hỏi phân biệt được hai điều này là: từng nhận định cụ thể có truy được về nguồn đáng tin cậy hoặc tài liệu đầu vào hay không. Xác minh luôn diễn ra ở cấp độ từng claim, đối chiếu với nguồn.\n\nTại sao các phương án khác sai\n“Does the response open with a clear, well-framed statement…”: mở đầu rõ ràng chỉ là cách trình bày, không chứng minh tính đúng.\n\n“Does the response cover the topic comprehensively based on…”: độ dài và số phần không nói lên nội dung có căn cứ hay không.\n\n“Does the response use varied sentence structure across sections?”: câu văn đa dạng là yếu tố văn phong, hoàn toàn không liên quan đến xác minh."}, {"n": 7, "cat": "T", "topic": 4, "q": "You are a marketing manager determining what to put in custom instructions for a writing-focused Project. Which two items should be included in the custom instructions? Each correct answer provides a complete solution.", "o": ["the brand voice and the tonal expectations the writing must follow", "a representative sample of past writing that reflects the team’s preferred style and structure", "the prompt author’s preferred response length for internal messages unrelated to external deliverables", "the preferred writing style of the marketing manager who will review all final deliverables", "the standard structure and the length expectations for typical deliverables"], "a": [0, 4], "sk": ["custom instructions for a writing-focused Project"], "note": "Đáp án: {A} + {E}. Bẫy: {B} mẫu bài viết cũ là tài liệu tham khảo, phù hợp để đưa vào knowledge base hơn là custom instructions; {C} độ dài cho tin nhắn nội bộ không liên quan đến sản phẩm của Project; {D} sở thích cá nhân của người duyệt không thay thế được tiêu chuẩn thương hiệu chung.", "ex": "Tại sao chọn đáp án đúng (“the brand voice and the tonal expectations the writing…” / “the standard structure and the length expectations for typical…”):\n\nCustom instructions của một Project viết lách nên chứa các yêu cầu tái sử dụng áp dụng cho mọi output của Project: brand voice và kỳ vọng về giọng điệu, cùng cấu trúc chuẩn và độ dài mong đợi của các sản phẩm điển hình. Đây là những quy tắc ổn định, định hướng mọi bản nháp trong Project.\n\nTại sao các phương án khác sai\n“a representative sample of past writing that reflects the…”: mẫu bài viết cũ là tài liệu tham khảo, phù hợp để đưa vào knowledge base hơn là custom instructions.\n\n“the prompt author’s preferred response length for internal messages…”: độ dài cho tin nhắn nội bộ không liên quan đến sản phẩm của Project.\n\n“the preferred writing style of the marketing manager who…”: sở thích cá nhân của người duyệt không thay thế được tiêu chuẩn thương hiệu chung."}, {"n": 8, "cat": "T", "topic": 6, "q": "You are a knowledge worker who broke a “draft a board memo” request into fifteen small steps and noticed that the output now feels disjointed because related ideas were separated. Which adjustment is most appropriate?", "o": ["Combine the original request back into one unstructured sentence.", "Subdivide each tiny step into ten more tiny steps for additional precision.", "Remove all sequencing so the steps run in random order.", "Consolidate related steps into fewer cohesive sections that group naturally connected ideas."], "a": 3, "sk": ["related ideas were separated"], "note": "Đáp án: {D}. Bẫy: {A} quay về một câu không cấu trúc làm mất toàn bộ lợi ích của phân rã; {B} chia nhỏ thêm càng làm output rời rạc hơn; {C} bỏ thứ tự khiến logic memo hỗn loạn.", "ex": "Tại sao chọn đáp án đúng (“Consolidate related steps into fewer cohesive sections that group…”):\n\nChia nhỏ quá mức (15 bước) khiến các ý liên quan bị tách rời nên output rời rạc. Cách điều chỉnh đúng là gộp các bước liên quan thành ít phần mạch lạc hơn, mỗi phần nhóm các ý gắn kết tự nhiên với nhau. Như vậy vẫn giữ được cấu trúc hữu ích của việc phân rã nhưng khôi phục sự liền mạch cho bản memo.\n\nTại sao các phương án khác sai\n“Combine the original request back into one unstructured sentence.”: quay về một câu không cấu trúc làm mất toàn bộ lợi ích của phân rã.\n\n“Subdivide each tiny step into ten more tiny steps…”: chia nhỏ thêm càng làm output rời rạc hơn.\n\n“Remove all sequencing so the steps run in random…”: bỏ thứ tự khiến logic memo hỗn loạn."}, {"n": 9, "cat": "E", "topic": 3, "q": "You are a knowledge worker reviewing a Claude-generated brief that claims a “well-known industry standard” but does not identify any source. How should this claim be handled?", "o": ["Treat the assertion as unverified, and either source it from an authoritative reference or remove it.", "Accept the assertion because the phrase \"well-known\" is reassuring.", "Republish the brief unchanged because the claim sounds authoritative.", "Strengthen the assertion by adding more confident wording."], "a": 0, "sk": ["does not identify any source"], "note": "Đáp án: {A}. Bẫy: {B} chữ \"well-known\" không phải bằng chứng; {C} xuất bản nguyên trạng sẽ lan truyền một claim chưa kiểm chứng; {D} thêm từ ngữ tự tin chỉ làm claim nguy hiểm hơn chứ không đúng hơn.", "ex": "Tại sao chọn đáp án đúng (“Treat the assertion as unverified, and either source it…”):\n\nCụm \"well-known industry standard\" nghe có vẻ uy tín nhưng không nêu nguồn, nên vẫn là nhận định chưa được xác minh. Cách xử lý đúng: tìm nguồn có thẩm quyền để dẫn chứng, hoặc loại bỏ nhận định đó. Mức độ tự tin trong câu chữ không thay thế được nguồn có thể xác định.\n\nTại sao các phương án khác sai\n“Accept the assertion because the phrase \"well-known\" is reassuring.”: chữ \"well-known\" không phải bằng chứng.\n\n“Republish the brief unchanged because the claim sounds authoritative.”: xuất bản nguyên trạng sẽ lan truyền một claim chưa kiểm chứng.\n\n“Strengthen the assertion by adding more confident wording.”: thêm từ ngữ tự tin chỉ làm claim nguy hiểm hơn chứ không đúng hơn."}, {"n": 10, "cat": "E", "topic": 6, "q": "You are breaking down a “build a customer journey map” request. Which sequence of decomposed steps is correct? 1. Identify the touchpoints the customer experiences during each stage. 2. Define the persona and the journey scope that will be mapped. 3. Document pain points and opportunities at every touchpoint. 4. Synthesize the findings into the finished journey-map artifact. 5. Identify the primary stages the persona progresses through.", "o": ["2, 5, 1, 3, 4", "1, 2, 5, 3, 4", "5, 2, 1, 3, 4", "2, 1, 5, 3, 4"], "a": 0, "sk": ["build a customer journey map"], "note": "Đáp án: {A}. Bẫy: {B} bắt đầu bằng touchpoint khi chưa có persona và giai đoạn; {C} xác định giai đoạn trước khi biết persona là ai; {D} xác định touchpoint trước khi có các giai đoạn chứa chúng.", "ex": "Tại sao chọn đáp án đúng (“2, 5, 1, 3, 4”):\n\nTrình tự đúng là 2, 5, 1, 3, 4. Đầu tiên (2) xác định persona và phạm vi hành trình, vì mọi thứ khác dựa trên ai được map. Tiếp theo (5) xác định các giai đoạn chính persona trải qua, tạo khung cho bản đồ. Sau đó (1) xác định touchpoint trong từng giai đoạn. Rồi (3) ghi nhận pain point và cơ hội tại từng touchpoint. Cuối cùng (4) tổng hợp thành artifact journey map hoàn chỉnh.\n\nLogic là đi từ tổng quát (persona, giai đoạn) xuống chi tiết (touchpoint, pain point) rồi mới tổng hợp.\n\nTại sao các phương án khác sai\n“1, 2, 5, 3, 4”: bắt đầu bằng touchpoint khi chưa có persona và giai đoạn.\n\n“5, 2, 1, 3, 4”: xác định giai đoạn trước khi biết persona là ai.\n\n“2, 1, 5, 3, 4”: xác định touchpoint trước khi có các giai đoạn chứa chúng."}, {"n": 11, "cat": "E", "topic": 2, "q": "A knowledge worker is using the AI Fluency Framework’s Description competency to revise an underperforming prompt. Which revision most accurately reflects Description principles?", "o": ["Remove the existing context from the prompt and submit only the bare task statement, eliminating the audience, format, and constraint information that Description principles call for in a clear specification.", "Replace the specific instructions with generic phrasing that broadens the task scope, undoing the specification work that Description principles require for a reliable, useful output on the next run.", "Specify the task scope, the required output format, the audience, and the relevant constraints with sufficient clarity that the prompt produces a useful, reliable output on the next run.", "Add length to the prompt by inserting filler text that does not specify task scope, output format, audience, or constraints, leaving the original specification gaps in the underperforming prompt unaddressed."], "a": 2, "sk": ["Description competency"], "note": "Đáp án: {C}. Bẫy: {A} bỏ hết context chỉ còn câu lệnh trơn làm prompt kém hơn; {B} thay hướng dẫn cụ thể bằng câu chung chung làm mất phần đặc tả cần thiết; {D} thêm chữ thừa làm prompt dài hơn nhưng không lấp được khoảng trống đặc tả.", "ex": "Tại sao chọn đáp án đúng (“Specify the task scope, the required output format, the…”):\n\nNăng lực Description trong AI Fluency Framework là truyền đạt mục tiêu đủ rõ để AI tạo ra output hữu ích. Bản sửa đúng phải nêu rõ phạm vi task, định dạng output, đối tượng (audience) và các ràng buộc, nhờ đó prompt cho kết quả đáng tin cậy ở lần chạy sau.\n\nTại sao các phương án khác sai\n“Remove the existing context from the prompt and submit…”: bỏ hết context chỉ còn câu lệnh trơn làm prompt kém hơn.\n\n“Replace the specific instructions with generic phrasing that broadens…”: thay hướng dẫn cụ thể bằng câu chung chung làm mất phần đặc tả cần thiết.\n\n“Add length to the prompt by inserting filler text…”: thêm chữ thừa làm prompt dài hơn nhưng không lấp được khoảng trống đặc tả."}, {"n": 12, "cat": "E", "topic": 2, "q": "You are a knowledge worker moving from a long, drifting conversation to a fresh, focused session. What is the correct sequence of transition steps? 1. Start a new chat and paste the summary as its initial context. 2. Summarize the goals, key decisions, and open questions from the lengthy conversation. 3. Determine which references should remain available beyond the current chat. 4. Place persistent references in a Project’s knowledge base or attach them as needed. 5. Verify that the new chat is on-task before resuming the work.", "o": ["1, 2, 3, 4, 5", "2, 3, 4, 1, 5", "2, 4, 3, 1, 5", "3, 2, 4, 1, 5"], "a": 1, "sk": ["long, drifting conversation"], "note": "Đáp án: {B}. Bẫy: {A} mở chat mới trước khi có bản tóm tắt để dán vào; {C} đưa tài liệu vào Project trước khi xác định tài liệu nào cần lưu; {D} xác định tài liệu trước khi tóm tắt, trong khi bản tóm tắt mới cho biết điều gì còn quan trọng.", "ex": "Tại sao chọn đáp án đúng (“2, 3, 4, 1, 5”):\n\nTrình tự đúng là 2, 3, 4, 1, 5. Trước hết (2) tóm tắt mục tiêu, quyết định chính và câu hỏi còn mở từ cuộc hội thoại dài, vì chat mới cần bản tóm tắt này làm context. Tiếp theo (3) xác định tài liệu nào cần dùng lâu dài ngoài chat hiện tại, rồi (4) đưa chúng vào knowledge base của Project hoặc đính kèm khi cần. Sau đó (1) mở chat mới và dán bản tóm tắt làm context ban đầu. Cuối cùng (5) kiểm tra chat mới đã đúng hướng trước khi tiếp tục.\n\nTại sao các phương án khác sai\n“1, 2, 3, 4, 5”: mở chat mới trước khi có bản tóm tắt để dán vào.\n\n“2, 4, 3, 1, 5”: đưa tài liệu vào Project trước khi xác định tài liệu nào cần lưu.\n\n“3, 2, 4, 1, 5”: xác định tài liệu trước khi tóm tắt, trong khi bản tóm tắt mới cho biết điều gì còn quan trọng."}, {"n": 13, "cat": "E", "topic": 4, "q": "An operations assistant is redesigning a recurring data-processing workflow step to use Code Execution. Which two design decisions best promote reliable integration?", "o": ["Vary the input file format from run to run to accommodate the different source systems that supply the data each week.", "Define a brief output verification step in which the human reviewer confirms the computed result against an expected range or sanity check before the output advances to downstream consumers.", "Embed the Code Execution step inside the workflow without documenting the expected output format or the fields it produces.", "Standardize the input file format the step expects, so each run of the Code Execution step receives consistent input and produces comparable, verifiable output across recurring weekly cycles.", "Eliminate the human review step that follows Code Execution, since the sandboxed environment already verifies that the code ran without errors."], "a": [1, 3], "sk": ["reliable integration"], "note": "Đáp án: {B} + {D}. Bẫy: {A} thay đổi định dạng mỗi lần chạy làm kết quả không nhất quán, khó kiểm chứng; {C} không ghi lại định dạng output khiến bước sau không biết kỳ vọng gì. E sandbox chạy không lỗi không có nghĩa là kết quả hợp lệ nên vẫn cần người review.", "ex": "Tại sao chọn đáp án đúng (“Define a brief output verification step in which the…” / “Standardize the input file format the step expects, so…”):\n\nHai quyết định giúp tích hợp Code Execution đáng tin cậy: chuẩn hóa định dạng file đầu vào, để mỗi lần chạy nhận input nhất quán và output so sánh, kiểm chứng được qua các chu kỳ hằng tuần; và bước xác minh output bởi người review, đối chiếu kết quả với khoảng giá trị kỳ vọng hoặc sanity check trước khi chuyển xuống downstream.\n\nCode chạy thành công chỉ chứng tỏ code không lỗi, không chứng tỏ kết quả đúng về mặt nghiệp vụ.\n\nTại sao các phương án khác sai\n“Vary the input file format from run to run…”: thay đổi định dạng mỗi lần chạy làm kết quả không nhất quán, khó kiểm chứng.\n\n“Embed the Code Execution step inside the workflow without…”: không ghi lại định dạng output khiến bước sau không biết kỳ vọng gì. E sandbox chạy không lỗi không có nghĩa là kết quả hợp lệ nên vẫn cần người review."}, {"n": 14, "cat": "T", "topic": 3, "q": "You are assessing proposed evaluation criteria for a Claude-generated business brief. Which two criteria are valid for evaluating a brief produced by Claude? Each correct answer represents part of the solution.", "o": ["factual accuracy of the claims made against the supplied source material", "consistency of the writing style with the organization’s established tone guidelines", "total word count of the output relative to industry benchmarks for business briefs", "presence of an executive summary section as a structural completeness check", "alignment of the output with the requested format and length constraints"], "a": [0, 4], "sk": ["valid for evaluating a brief"], "note": "Đáp án: {A} + {E}. Bẫy: {B} giọng văn theo hướng dẫn là yếu tố trình bày, không kiểm tra độ đúng hay việc đáp ứng yêu cầu của task; {C} so số chữ với benchmark ngành không liên quan đến yêu cầu thực tế; {D} có mục executive summary chỉ là kiểm tra hình thức, trừ khi được yêu cầu cụ thể.", "ex": "Tại sao chọn đáp án đúng (“factual accuracy of the claims made against the supplied…” / “alignment of the output with the requested format and…”):\n\nĐánh giá một business brief do Claude tạo cần tiêu chí cụ thể, đo được và gắn với mục đích sử dụng: độ chính xác của các nhận định so với tài liệu nguồn được cung cấp (factual grounding) và mức độ tuân thủ định dạng và giới hạn độ dài đã yêu cầu (task fidelity). Hai tiêu chí này kiểm tra trực tiếp brief có đúng và có đáp ứng yêu cầu hay không.\n\nTại sao các phương án khác sai\n“consistency of the writing style with the organization’s established…”: giọng văn theo hướng dẫn là yếu tố trình bày, không kiểm tra độ đúng hay việc đáp ứng yêu cầu của task.\n\n“total word count of the output relative to industry…”: so số chữ với benchmark ngành không liên quan đến yêu cầu thực tế.\n\n“presence of an executive summary section as a structural…”: có mục executive summary chỉ là kiểm tra hình thức, trừ khi được yêu cầu cụ thể."}, {"n": 15, "cat": "E", "topic": 5, "q": "You are a member of an operations team preparing input to summarize customer feedback. The feedback file combines public quotations with personal contact information. Which preparation method is most appropriate?", "o": ["Extract only the feedback content needed for the summary, redact or anonymize personal contact details, and submit the trimmed input.", "Submit the entire file unchanged so Claude has complete context.", "Replace the feedback content with the personal contact details and ask Claude to invent the missing feedback.", "Strip out the feedback content and submit only the personal contact details."], "a": 0, "sk": ["personal contact information"], "note": "Đáp án: {A}. Bẫy: {B} gửi nguyên file làm lộ PII không cần thiết; {C} yêu cầu Claude bịa phản hồi là tạo dữ liệu giả; {D} bỏ phản hồi và chỉ gửi thông tin liên lạc vừa sai mục tiêu vừa tối đa hóa rủi ro.", "ex": "Tại sao chọn đáp án đúng (“Extract only the feedback content needed for the summary,…”):\n\nFile trộn lẫn trích dẫn phản hồi với thông tin liên lạc cá nhân. Cách chuẩn bị đúng là chỉ trích phần phản hồi cần cho bản tóm tắt và che (redact) hoặc ẩn danh hóa thông tin liên lạc cá nhân trước khi gửi. Như vậy vẫn đủ dữ liệu cho task mà giảm tối đa việc lộ thông tin định danh cá nhân (PII).\n\nTại sao các phương án khác sai\n“Submit the entire file unchanged so Claude has complete…”: gửi nguyên file làm lộ PII không cần thiết.\n\n“Replace the feedback content with the personal contact details…”: yêu cầu Claude bịa phản hồi là tạo dữ liệu giả.\n\n“Strip out the feedback content and submit only the…”: bỏ phản hồi và chỉ gửi thông tin liên lạc vừa sai mục tiêu vừa tối đa hóa rủi ro."}, {"n": 16, "cat": "E", "topic": 4, "q": "You are an operations lead and observe that a Project’s outputs have been drifting away from the team’s current expectations. Which maintenance action should be attempted first?", "o": ["Review the Project’s instructions and reference materials against current standards.", "Switch the Project to a different Claude model in the hope it behaves better.", "Continue using the Project and accept the drift as the new baseline of behavior.", "Retire the Project and rebuild a new one from scratch with fresh content."], "a": 0, "sk": ["drifting away from the team’s current expectations"], "note": "Đáp án: {A}. Bẫy: {B} đổi model chỉ là hy vọng, không xử lý nguyên nhân gốc; {C} chấp nhận drift làm chuẩn mới là bỏ mặc vấn đề; {D} xây lại từ đầu tốn kém, chỉ nên cân nhắc khi chỉnh sửa không hiệu quả.", "ex": "Tại sao chọn đáp án đúng (“Review the Project’s instructions and reference materials against current…”):\n\nCustom instructions định hướng cách Claude phản hồi trong mọi chat của Project, còn tài liệu knowledge cung cấp context chung. Khi output trôi lệch so với kỳ vọng hiện tại, nguyên nhân trực tiếp và dễ kiểm soát nhất thường là instructions hoặc tài liệu đã lỗi thời. Vì vậy bước đầu tiên là rà soát instructions và tài liệu tham chiếu của Project so với tiêu chuẩn hiện hành.\n\nTại sao các phương án khác sai\n“Switch the Project to a different Claude model in…”: đổi model chỉ là hy vọng, không xử lý nguyên nhân gốc.\n\n“Continue using the Project and accept the drift as…”: chấp nhận drift làm chuẩn mới là bỏ mặc vấn đề.\n\n“Retire the Project and rebuild a new one from…”: xây lại từ đầu tốn kém, chỉ nên cân nhắc khi chỉnh sửa không hiệu quả."}, {"n": 17, "cat": "E", "topic": 4, "q": "A manager is determining which changes to make during a memory-maintenance review for a long-running workflow. Which two actions most effectively support memory quality over time?", "o": ["Delete all memories as the maintenance action to ensure a clean slate, then allow Claude to rebuild context organically through subsequent workflow runs.", "Disable Memory entirely to eliminate the risk of stale entries surfacing in future workflow runs.", "Identify and edit or delete entries that are stale, inaccurate, or no longer relevant, and add context Claude has not automatically captured but the workflow continues to need.", "Leave all memories untouched on the basis that the workflow has been running consistently and no output quality issues have been reported.", "Export the current memories as a backup before making changes, so prior context can be restored if a maintenance edit unintentionally removes information the workflow still depends on."], "a": [2, 4], "sk": ["memory quality over time"], "note": "Đáp án: {C} + {E}. Bẫy: {A} xóa toàn bộ làm mất cả context chính xác đang hữu ích; {B} tắt Memory loại bỏ luôn lợi ích của nó thay vì quản lý chất lượng; {D} không có lỗi được báo cáo không có nghĩa là không có mục cũ hoặc sai.", "ex": "Tại sao chọn đáp án đúng (“Identify and edit or delete entries that are stale,…” / “Export the current memories as a backup before making…”):\n\nBảo trì Memory hiệu quả gồm: xác định và sửa hoặc xóa các mục cũ, sai, không còn liên quan, đồng thời bổ sung context mà Claude chưa tự ghi lại nhưng workflow vẫn cần. Bên cạnh đó, export Memory làm bản sao lưu trước khi chỉnh sửa tạo đường phục hồi nếu lỡ xóa thông tin workflow còn phụ thuộc.\n\nHướng dẫn của Anthropic khuyến nghị thường xuyên review và cập nhật Memory khi dự án thay đổi.\n\nTại sao các phương án khác sai\n“Delete all memories as the maintenance action to ensure…”: xóa toàn bộ làm mất cả context chính xác đang hữu ích.\n\n“Disable Memory entirely to eliminate the risk of stale…”: tắt Memory loại bỏ luôn lợi ích của nó thay vì quản lý chất lượng.\n\n“Leave all memories untouched on the basis that the…”: không có lỗi được báo cáo không có nghĩa là không có mục cũ hoặc sai."}, {"n": 18, "cat": "T", "topic": 4, "q": "An HR business partner is creating a long-running workspace in which a team handbook, a leveling guide, and a policies-FAQ document will be used across many separate chats by several team members. Which Claude feature is intended for this use case?", "o": ["Connect the team’s Google Drive folder where the three documents live, so the connector surfaces them inside each chat at the moment the chat needs them.", "Generate an Artifact containing the three documents, which gives the team an editable surface for the reference content that persists across chats.", "Create a Project, which provides a persistent workspace with its own knowledge base and custom instructions shared across chats and members.", "Attach all three documents to each chat as needed, since per-chat attachments give the chat direct access to the documents without additional setup."], "a": 2, "sk": ["across many separate chats by several team members"], "note": "Đáp án: {C}. Bẫy: {A} connector truy cập dữ liệu bên ngoài nhưng không tạo workspace có instructions dùng chung; {B} Artifact là sản phẩm đầu ra trong chat, không phải kho tài liệu tham chiếu dùng chung; {D} đính kèm vào từng chat phải lặp lại thủ công và không bền vững.", "ex": "Tại sao chọn đáp án đúng (“Create a Project, which provides a persistent workspace with…”):\n\nNhu cầu là một workspace dài hạn, có tài liệu dùng chung qua nhiều chat và nhiều thành viên. Đó chính là mục đích của Project: workspace bền vững với knowledge base riêng và custom instructions áp dụng cho mọi chat trong Project. Trên gói Team và Enterprise, Project còn có thể chia sẻ với thành viên khác trong tổ chức.\n\nTại sao các phương án khác sai\n“Connect the team’s Google Drive folder where the three…”: connector truy cập dữ liệu bên ngoài nhưng không tạo workspace có instructions dùng chung.\n\n“Generate an Artifact containing the three documents, which gives…”: Artifact là sản phẩm đầu ra trong chat, không phải kho tài liệu tham chiếu dùng chung.\n\n“Attach all three documents to each chat as needed,…”: đính kèm vào từng chat phải lặp lại thủ công và không bền vững."}, {"n": 19, "cat": "E", "topic": 3, "q": "You are an analyst verifying facts in a Claude-generated report. Two cited sources provide conflicting dates for the same event. Which approach is correct?", "o": ["Choose the more recent date on the basis that later sources typically reflect updated or corrected information.", "Average the two conflicting dates and use the average.", "Locate a primary or authoritative source for the event and use the date that source confirms.", "Publish both dates without resolving the conflict and let the reader choose."], "a": 2, "sk": ["conflicting dates"], "note": "Đáp án: {C}. Bẫy: {A} nguồn mới hơn không đồng nghĩa với chính xác hơn; {B} lấy trung bình hai ngày tạo ra một ngày vô nghĩa; {D} đăng cả hai mà không giải quyết là trình bày mâu thuẫn như thể đã xác minh.", "ex": "Tại sao chọn đáp án đúng (“Locate a primary or authoritative source for the event…”):\n\nKhi hai nguồn được trích dẫn đưa ra ngày khác nhau, cách đúng là tìm nguồn gốc (primary source) hoặc nguồn có thẩm quyền về sự kiện đó và dùng ngày mà nguồn này xác nhận. Đây là cơ sở mạnh nhất để giải quyết mâu thuẫn và đảm bảo thông tin đã được xác minh.\n\nTại sao các phương án khác sai\n“Choose the more recent date on the basis that…”: nguồn mới hơn không đồng nghĩa với chính xác hơn.\n\n“Average the two conflicting dates and use the average.”: lấy trung bình hai ngày tạo ra một ngày vô nghĩa.\n\n“Publish both dates without resolving the conflict and let…”: đăng cả hai mà không giải quyết là trình bày mâu thuẫn như thể đã xác minh."}, {"n": 20, "cat": "E", "topic": 2, "q": "A business analyst is transforming a stakeholder’s sticky-note request into a structured prompt for Claude. What is the correct sequence of conversion steps? 1. Confirm the audience and the decision that the response needs to support. 2. Submit the structured prompt to Claude. 3. Identify the underlying task concealed in the sticky-note language. 4. Specify the required length, tone, and output format. 5. Add the supporting facts and constraints that are relevant to the task.", "o": ["3, 5, 1, 4, 2", "1, 3, 5, 4, 2", "3, 1, 5, 4, 2", "2, 3, 1, 5, 4"], "a": 2, "sk": ["sticky-note request"], "note": "Đáp án: {C}. Bẫy: {A} thêm dữ kiện trước khi biết audience nên khó chọn lọc thông tin phù hợp; {B} xác định audience trước khi hiểu task thật là gì; {D} gửi prompt ngay từ đầu khi chưa có cấu trúc.", "ex": "Tại sao chọn đáp án đúng (“3, 1, 5, 4, 2”):\n\nTrình tự đúng là 3, 1, 5, 4, 2. Trước tiên (3) xác định task thực sự ẩn sau lời ghi chú trên giấy note. Tiếp theo (1) xác nhận audience và quyết định mà câu trả lời cần hỗ trợ. Sau đó (5) bổ sung dữ kiện và ràng buộc liên quan. Rồi (4) nêu rõ độ dài, giọng điệu và định dạng output. Cuối cùng (2) mới gửi prompt hoàn chỉnh cho Claude.\n\nLogic: task, audience, context, yêu cầu output, rồi mới submit; khớp với hướng dẫn của Anthropic về chỉ dẫn rõ ràng, context liên quan và output mong đợi.\n\nTại sao các phương án khác sai\n“3, 5, 1, 4, 2”: thêm dữ kiện trước khi biết audience nên khó chọn lọc thông tin phù hợp.\n\n“1, 3, 5, 4, 2”: xác định audience trước khi hiểu task thật là gì.\n\n“2, 3, 1, 5, 4”: gửi prompt ngay từ đầu khi chưa có cấu trúc."}, {"n": 21, "cat": "E", "topic": 1, "q": "You are a bank manager who receives a request to use Claude as the sole decision-maker for customer credit-line approvals. Which response is most appropriate?", "o": ["Accept the sole-decision-maker design because Claude can process applications faster than a human review team.", "Expand the design so Claude both evaluates applications and issues final approval notices to customers directly.", "Implement the design on a pilot basis and notify compliance only if issues arise during production use.", "Decline the sole-decision-maker design and propose Claude assisting analysts who retain decision authority."], "a": 3, "sk": ["sole decision-maker"], "note": "Đáp án: {D}. Bẫy: {A} tốc độ xử lý không bù được việc thiếu trách nhiệm giải trình của con người; {B} để Claude vừa đánh giá vừa gửi thông báo phê duyệt càng loại bỏ sự giám sát của con người; {C} pilot rồi chỉ báo compliance khi có sự cố là đảo ngược quy trình quản trị rủi ro.", "ex": "Tại sao chọn đáp án đúng (“Decline the sole-decision-maker design and propose Claude assisting analysts…”):\n\nPhê duyệt hạn mức tín dụng là quyết định tài chính có hệ quả lớn với khách hàng, đòi hỏi sự giám sát có ý nghĩa của con người và người chịu trách nhiệm quyết định. Vì vậy cần từ chối thiết kế để Claude làm người quyết định duy nhất, thay vào đó đề xuất Claude hỗ trợ chuyên viên phân tích, còn chuyên viên giữ quyền quyết định cuối cùng.\n\nTại sao các phương án khác sai\n“Accept the sole-decision-maker design because Claude can process applications…”: tốc độ xử lý không bù được việc thiếu trách nhiệm giải trình của con người.\n\n“Expand the design so Claude both evaluates applications and…”: để Claude vừa đánh giá vừa gửi thông báo phê duyệt càng loại bỏ sự giám sát của con người.\n\n“Implement the design on a pilot basis and notify…”: pilot rồi chỉ báo compliance khi có sự cố là đảo ngược quy trình quản trị rủi ro."}, {"n": 22, "cat": "T", "topic": 6, "q": "A Claude associate is determining the bottleneck in a content workflow that is taking too long to publish. The workflow includes five steps: research, drafting, internal review, legal review, and publication. Cycle-time data is available for each step from the past month. Which signal most directly identifies the bottleneck?", "o": ["the step where individual contributors report the highest workload based on their weekly status updates", "the step most recently added to the workflow, based on the assumption that process changes introduce the most friction", "the step with the longest queue or the largest backlog of items waiting to enter it", "the step with the highest average cycle time per item across the past month’s runs"], "a": 3, "sk": ["Cycle-time data is available for each step"], "note": "Đáp án: {D}. Bẫy: {A} khối lượng công việc tự báo cáo mang tính chủ quan, không đo trực tiếp tốc độ dòng chảy; {B} bước mới thêm vào không mặc nhiên là bước gây tắc; {C} hàng đợi dài chỉ là triệu chứng gián tiếp và có thể tạm thời, có thể dùng để bổ trợ nhưng không trực tiếp bằng cycle time.", "ex": "Tại sao chọn đáp án đúng (“the step with the highest average cycle time per…”):\n\nBottleneck là bước có năng lực giới hạn throughput của toàn bộ workflow. Đề bài cho sẵn dữ liệu cycle time từng bước trong tháng qua, nên tín hiệu trực tiếp nhất là bước có cycle time trung bình mỗi item cao nhất: đó là bước chậm nhất, quyết định tốc độ các item được publish.\n\nTại sao các phương án khác sai\n“the step where individual contributors report the highest workload…”: khối lượng công việc tự báo cáo mang tính chủ quan, không đo trực tiếp tốc độ dòng chảy.\n\n“the step most recently added to the workflow, based…”: bước mới thêm vào không mặc nhiên là bước gây tắc.\n\n“the step with the longest queue or the largest…”: hàng đợi dài chỉ là triệu chứng gián tiếp và có thể tạm thời, có thể dùng để bổ trợ nhưng không trực tiếp bằng cycle time."}, {"n": 23, "cat": "E", "topic": 4, "q": "You are setting up a new Claude Project for a particular recurring workload. Which Project-configuration step should be completed first?", "o": ["Define the purpose of the Project and the recurring tasks it must support.", "Invite collaborators to the Project and confirm the appropriate access levels.", "Add reference materials and instructions that the Project will rely on.", "Test the configured Project on a representative request from the workload."], "a": 0, "sk": ["should be completed first"], "note": "Đáp án: {A}. Bẫy: {B} mời cộng tác viên khi chưa rõ Project dùng để làm gì là quá sớm; {C} chọn tài liệu và instructions cần dựa trên mục đích đã xác định; {D} test chỉ có ý nghĩa sau khi Project đã được cấu hình.", "ex": "Tại sao chọn đáp án đúng (“Define the purpose of the Project and the recurring…”):\n\nBước đầu tiên khi tạo Project là xác định mục đích của Project và các tác vụ lặp lại mà nó phải hỗ trợ. Mục đích này là nền tảng để chọn tài liệu tham chiếu, viết instructions, cấp quyền cho cộng tác viên và thiết kế bài test; thiếu nó thì mọi cấu hình khác không có chuẩn để đối chiếu.\n\nTại sao các phương án khác sai\n“Invite collaborators to the Project and confirm the appropriate…”: mời cộng tác viên khi chưa rõ Project dùng để làm gì là quá sớm.\n\n“Add reference materials and instructions that the Project will…”: chọn tài liệu và instructions cần dựa trên mục đích đã xác định.\n\n“Test the configured Project on a representative request from…”: test chỉ có ý nghĩa sau khi Project đã được cấu hình."}, {"n": 24, "cat": "T", "topic": 2, "q": "You are a business analyst assessing prompt drafts prepared by teammates. Which two components should be included in a well-structured prompt for a business task? Each correct answer represents part of the solution.", "o": ["a friendly, conversational tone instruction to make responses feel more approachable", "a comprehensive list of company products and services to provide the model with business context", "a short personal anecdote to make the prompt feel more conversational", "a clear statement of the task that the model must perform", "relevant context such as the audience and the goal of the task"], "a": [3, 4], "sk": ["well-structured prompt"], "note": "Đáp án: {D} + {E}. Bẫy: {A} giọng thân thiện chỉ là tùy chọn văn phong, không phải thành phần cốt lõi của prompt công việc; {B} danh sách toàn bộ sản phẩm là thông tin thừa, chỉ nên đưa phần liên quan đến task; {C} giai thoại cá nhân gây nhiễu, không giúp model làm tốt hơn.", "ex": "Tại sao chọn đáp án đúng (“a clear statement of the task that the model…” / “relevant context such as the audience and the goal…”):\n\nMột prompt có cấu trúc tốt cho công việc cần hai thành phần cốt lõi: phát biểu rõ task mà model phải thực hiện và context liên quan như audience và mục tiêu của task. Nhờ đó câu trả lời đúng trọng tâm, phù hợp đối tượng và hữu ích.\n\nTại sao các phương án khác sai\n“a friendly, conversational tone instruction to make responses feel…”: giọng thân thiện chỉ là tùy chọn văn phong, không phải thành phần cốt lõi của prompt công việc.\n\n“a comprehensive list of company products and services to…”: danh sách toàn bộ sản phẩm là thông tin thừa, chỉ nên đưa phần liên quan đến task.\n\n“a short personal anecdote to make the prompt feel…”: giai thoại cá nhân gây nhiễu, không giúp model làm tốt hơn."}, {"n": 25, "cat": "T", "topic": 3, "q": "A project lead is assessing a Claude-generated status report against the project charter. The report will be presented to a steering committee that expects an accurate status update against committed milestones. Which group of criteria offers the strongest evaluation framework?", "o": ["length, formatting consistency, and tone appropriateness for a steering committee audience", "accuracy of facts against the charter, completeness against required reporting fields, and relevance to the audience receiving the report", "readability, narrative flow, and whether the report tells a coherent story about the project’s progress", "match to the prior status report’s structure, since the steering committee expects consistent reporting from period to period"], "a": 1, "sk": ["accurate status update against committed milestones"], "note": "Đáp án: {B}. Bẫy: {A} độ dài, định dạng, giọng điệu chỉ là trình bày, không kiểm tra độ đúng; {C} dễ đọc và mạch lạc không đảm bảo dữ kiện chính xác; {D} giống cấu trúc kỳ trước chỉ là nhất quán hình thức, có thể lặp lại cả lỗi cũ.", "ex": "Tại sao chọn đáp án đúng (“accuracy of facts against the charter, completeness against required…”):\n\nSteering committee cần cập nhật chính xác so với các milestone đã cam kết. Bộ tiêu chí mạnh nhất vì vậy là: độ chính xác của dữ kiện so với project charter, độ đầy đủ theo các trường báo cáo bắt buộc, và mức độ phù hợp với audience nhận báo cáo. Các tiêu chí này trực tiếp đảm bảo báo cáo đáng tin cậy.\n\nTại sao các phương án khác sai\n“length, formatting consistency, and tone appropriateness for a steering…”: độ dài, định dạng, giọng điệu chỉ là trình bày, không kiểm tra độ đúng.\n\n“readability, narrative flow, and whether the report tells a…”: dễ đọc và mạch lạc không đảm bảo dữ kiện chính xác.\n\n“match to the prior status report’s structure, since the…”: giống cấu trúc kỳ trước chỉ là nhất quán hình thức, có thể lặp lại cả lỗi cũ."}, {"n": 26, "cat": "E", "topic": 4, "q": "A senior manager is reviewing a colleague’s practice of never updating their team’s Project configurations because “if it works once, it works forever.” Which feedback is most appropriate?", "o": ["Configurations should be updated on a fixed schedule regardless of whether the underlying policies and source documents have changed, since regular maintenance prevents drift.", "Configurations should be updated only when output quality visibly degrades, since proactive updates risk introducing regressions in working configurations.", "Configurations should be reviewed and updated periodically because policies, terminology, and source documents change over time, even when output quality has not visibly degraded.", "Configurations should be left alone if the team is satisfied with current outputs, and any required updates should be handled at the chat level rather than the Project level."], "a": 2, "sk": ["if it works once, it works forever"], "note": "Đáp án: {C}. Bẫy: {A} cập nhật theo lịch cố định bất kể nguồn có thay đổi hay không là máy móc, không gắn với nguyên nhân thực sự; {B} chờ chất lượng giảm rõ mới sửa là quá muộn; {D} xử lý ở cấp chat không bền vững và bỏ qua cấu hình gốc của Project.", "ex": "Tại sao chọn đáp án đúng (“Configurations should be reviewed and updated periodically because policies,…”):\n\nCấu hình Project dựa trên chính sách, thuật ngữ và tài liệu nguồn, mà những thứ này thay đổi theo thời gian. Vì vậy cấu hình cần được review và cập nhật định kỳ, kể cả khi chất lượng output chưa giảm rõ rệt, vì tài liệu lỗi thời có thể khiến output sai trước khi ai đó nhận ra.\n\nTại sao các phương án khác sai\n“Configurations should be updated on a fixed schedule regardless…”: cập nhật theo lịch cố định bất kể nguồn có thay đổi hay không là máy móc, không gắn với nguyên nhân thực sự.\n\n“Configurations should be updated only when output quality visibly…”: chờ chất lượng giảm rõ mới sửa là quá muộn.\n\n“Configurations should be left alone if the team is…”: xử lý ở cấp chat không bền vững và bỏ qua cấu hình gốc của Project."}, {"n": 27, "cat": "T", "topic": 5, "q": "You are organizing connected data sources for a team and must finish the planning steps before authorizing a connection. Which two planning steps must be completed BEFORE authorizing a new Connector? Each correct answer represents part of the solution.", "o": ["Migrate every existing report off the prior data source onto the new Connector.", "Confirm the Connector is on the approved-vendor list maintained by IT.", "Confirm the data classification of the source and the team’s permission to use it.", "Train every team member on the new Connector through formal training sessions.", "Decommission any unused legacy connectors that may still be authorized."], "a": [1, 2], "sk": ["BEFORE authorizing a new Connector"], "note": "Đáp án: {B} + {C}. Bẫy: {A} chuyển toàn bộ báo cáo sang Connector mới là việc sau khi đã ủy quyền; {D} đào tạo toàn bộ thành viên có thể làm sau, không phải điều kiện bắt buộc trước khi ủy quyền. E dọn dẹp connector cũ là việc vệ sinh hệ thống, không phải điều kiện tiên quyết.", "ex": "Tại sao chọn đáp án đúng (“Confirm the Connector is on the approved-vendor list maintained…” / “Confirm the data classification of the source and the…”):\n\nỦy quyền một Connector là quyết định quản trị dữ liệu, nên trước khi kết nối phải: xác nhận Connector nằm trong danh sách vendor được IT phê duyệt, và xác nhận phân loại dữ liệu (data classification) của nguồn cùng quyền sử dụng của nhóm. Hai bước này đảm bảo tuân thủ về vendor và quyền truy cập dữ liệu.\n\nTại sao các phương án khác sai\n“Migrate every existing report off the prior data source…”: chuyển toàn bộ báo cáo sang Connector mới là việc sau khi đã ủy quyền.\n\n“Train every team member on the new Connector through…”: đào tạo toàn bộ thành viên có thể làm sau, không phải điều kiện bắt buộc trước khi ủy quyền. E dọn dẹp connector cũ là việc vệ sinh hệ thống, không phải điều kiện tiên quyết."}, {"n": 28, "cat": "T", "topic": 1, "q": "While preparing a stakeholder communication about a proposed Claude use case, a senior manager is applying the AI Fluency Framework Description competency. Which framing most closely reflects Description principles for stakeholder communication?", "o": ["Describe what Claude can reliably produce for the use case, the known limitations, and the human oversight that will remain in place, calibrated to the audience’s familiarity with AI.", "Overstate Claude’s capabilities to secure stakeholder support, even though Description principles require accurate framing of what Claude can and cannot reliably produce for the proposed use case.", "Omit the human oversight that will remain in place from the communication, even though Description principles require setting expectations that reflect the actual capability boundaries of the use case.", "Understate Claude’s capabilities to lower stakeholder expectations, even though Description principles require accuracy in both directions rather than systematic minimization of what Claude can produce."], "a": 0, "sk": ["Description competency", "stakeholder communication"], "note": "Đáp án: {A}. Bẫy: {B} phóng đại năng lực để được ủng hộ là thiếu trung thực, tạo kỳ vọng sai; {C} bỏ phần giám sát của con người làm stakeholder hiểu sai ranh giới năng lực; {D} cố tình đánh giá thấp năng lực cũng không chính xác, vì Description yêu cầu chính xác theo cả hai chiều.", "ex": "Tại sao chọn đáp án đúng (“Describe what Claude can reliably produce for the use…”):\n\nDescription hướng tới giao tiếp rõ ràng, có mục đích về output và hành vi mong đợi của AI. Khi trao đổi với stakeholder, cần mô tả chính xác những gì Claude có thể tạo ra một cách đáng tin cậy, các giới hạn đã biết và sự giám sát của con người vẫn được duy trì, đồng thời điều chỉnh theo mức độ hiểu biết về AI của audience.\n\nTại sao các phương án khác sai\n“Overstate Claude’s capabilities to secure stakeholder support, even though…”: phóng đại năng lực để được ủng hộ là thiếu trung thực, tạo kỳ vọng sai.\n\n“Omit the human oversight that will remain in place…”: bỏ phần giám sát của con người làm stakeholder hiểu sai ranh giới năng lực.\n\n“Understate Claude’s capabilities to lower stakeholder expectations, even though…”: cố tình đánh giá thấp năng lực cũng không chính xác, vì Description yêu cầu chính xác theo cả hai chiều."}, {"n": 29, "cat": "E", "topic": 1, "q": "You are a Claude associate conducting an ethics review of a Claude-assisted deliverable before it is published. What is the correct sequence of review steps? 1. Confirm that transparency requirements are satisfied for the audience that will receive the deliverable. 2. Record the review result and any modifications made. 3. Identify the audience and the deliverable’s potential impact on that audience. 4. Make focused revisions, or escalate when a concern needs greater authority to resolve. 5. Review the content for unsupported generalizations, fairness concerns, and accuracy issues.", "o": ["5, 3, 1, 4, 2", "3, 1, 5, 4, 2", "3, 5, 1, 4, 2", "1, 3, 5, 4, 2"], "a": 2, "sk": ["ethics review"], "note": "Đáp án: {C}. Bẫy: {A} rà soát nội dung trước khi biết audience nên thiếu thước đo tác động; {B} kiểm tra minh bạch trước khi rà soát nội dung, trong khi yêu cầu minh bạch phụ thuộc vào vấn đề tìm thấy; {D} kiểm tra minh bạch trước cả khi xác định audience.", "ex": "Tại sao chọn đáp án đúng (“3, 5, 1, 4, 2”):\n\nTrình tự đúng là 3, 5, 1, 4, 2. Đầu tiên (3) xác định audience và tác động của sản phẩm lên họ, để biết ai bị ảnh hưởng và như thế nào. Tiếp theo (5) rà soát nội dung về khái quát hóa thiếu căn cứ, công bằng và độ chính xác. Sau đó (1) xác nhận yêu cầu minh bạch (transparency) phù hợp với audience đó. Rồi (4) chỉnh sửa có trọng tâm hoặc escalate nếu cần thẩm quyền cao hơn. Cuối cùng (2) ghi lại kết quả review và các thay đổi.\n\nTại sao các phương án khác sai\n“5, 3, 1, 4, 2”: rà soát nội dung trước khi biết audience nên thiếu thước đo tác động.\n\n“3, 1, 5, 4, 2”: kiểm tra minh bạch trước khi rà soát nội dung, trong khi yêu cầu minh bạch phụ thuộc vào vấn đề tìm thấy.\n\n“1, 3, 5, 4, 2”: kiểm tra minh bạch trước cả khi xác định audience."}, {"n": 30, "cat": "E", "topic": 3, "q": "You are a business analyst assessing a Claude-generated business case against the agreed acceptance criteria. What is the correct sequence of evaluation steps? 1. Compare the business case against the source data and required topics. 2. Record gaps and inaccuracies for follow-up or correction. 3. Reconfirm the acceptance criteria for the business case. 4. Determine whether to use the business case, iterate, or escalate. 5. Read the business case from start to finish to form an initial impression.", "o": ["3, 1, 5, 2, 4", "1, 3, 5, 2, 4", "5, 3, 1, 2, 4", "3, 5, 1, 2, 4"], "a": 3, "sk": ["agreed acceptance criteria"], "note": "Đáp án: {D}. Bẫy: {A} đối chiếu chi tiết trước khi đọc tổng thể để hiểu bối cảnh; {B} so sánh với nguồn trước khi xác nhận tiêu chí đánh giá; {C} đọc và hình thành ấn tượng trước khi có tiêu chí, dễ bị thiên lệch.", "ex": "Tại sao chọn đáp án đúng (“3, 5, 1, 2, 4”):\n\nTrình tự đúng là 3, 5, 1, 2, 4. Trước hết (3) xác nhận lại acceptance criteria để có thước đo trước khi review. Tiếp theo (5) đọc toàn bộ business case để nắm bối cảnh. Sau đó (1) đối chiếu với dữ liệu nguồn và các chủ đề bắt buộc. Rồi (2) ghi lại thiếu sót và sai lệch. Cuối cùng (4) mới quyết định dùng, lặp lại (iterate) hay escalate.\n\nTại sao các phương án khác sai\n“3, 1, 5,
