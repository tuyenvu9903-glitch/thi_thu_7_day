 handling.\n\nTại sao các phương án khác chưa tối ưu\nA\nescalate ngay khi chưa giải thích gì làm giảm trải nghiệm, quá tải nhân viên thật không cần thiết.\nB\nauto-retry giữ conversation mở dễ treo giao diện, khách chờ lâu không rõ lý do.\nD\nhứa hẹn chắc chắn trong khi tool đã thất bại (timeout) là thiếu chính xác, dễ gây khiếu nại nghiêm trọng hơn.", "set": "Set 3", "topic": 6}, {"n": 172, "cat": "T", "stem": "A customer writes: \"I've been going back and forth on this return for days. I just want to speak to someone who can actually help me.\" The agent has confirmed via lookup_order that the return is straightforward—within policy and eligible for immediate processing. What should the agent do?", "opts": {"A": "Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate", "B": "Call escalate_to_human immediately to honor the customer's request", "C": "Process the refund via process_refund to resolve the underlying issue, then inform them it's complete", "D": "Ask what specifically hasn't worked in previous attempts before deciding whether to escalate or resolve automatically"}, "a": "A", "sk": ["return is straightforward"], "ak": ["Acknowledge frustration", "offer to complete it or escalate"], "note": "Giống câu 51 (cặp với 45).", "ex": "(Tương tự Q51) Empathetic & Customer-Centric Design: đồng cảm với bức xúc + minh bạch thông tin (đã xác nhận đủ điều kiện, xử lý được ngay) + tôn trọng lựa chọn khách hàng (hoàn tất ngay hoặc chuyển người).\n\nTại sao các phương án khác chưa tối ưu\nB\nescalate ngay bỏ lỡ cơ hội giải quyết nhanh khi agent hoàn toàn xử lý được.\nC\ntự ý process_refund không xác nhận trước khi khách muốn nói chuyện với người có thể làm tăng bức xúc.\nD\nhỏi vặn về lỗi lần trước tốn thời gian, tăng khó chịu không cần thiết khi đã xác nhận đủ điều kiện.", "set": "Set 3", "topic": 6}, {"n": 173, "cat": "E", "stem": "Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval—beyond the agent's authorization level. How should the workflow handle this mid-process escalation?", "opts": {"A": "Call escalate_to_human passing only the customer's original message.", "B": "Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human.", "C": "Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction.", "D": "Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID."}, "a": "B", "sk": ["beyond the agent's authorization level"], "ak": ["structured handoff"], "note": "Giống câu 47.", "ex": "(Tương tự Q47) Best practice cho human escalation: tổng hợp structured handoff (thông tin khách hàng, chi tiết đơn hàng, lịch sử kiểm tra, nguyên nhân cụ thể) trước khi gọi escalate_to_human — nhân viên nắm ngay ngữ cảnh, không cần đọc lại toàn bộ hội thoại.\n\nTại sao các phương án khác chưa tối ưu\nA\nchỉ gửi tin nhắn gốc mất toàn bộ ngữ cảnh đã thu thập từ get_customer/lookup_order.\nC\ntự ý process_refund vượt thẩm quyền có thể vi phạm kiểm soát tài chính.\nD\nlưu DB + reference ID bắt nhân viên tự tra cứu thủ công thêm, tăng thời gian xử lý.", "set": "Set 3", "topic": 6}, {"n": 174, "cat": "E", "stem": "After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you verify the server is healthy and tools appear in the tools/list response. However, you observe that the agent consistently uses Grep to search for import statements instead of calling analyze_dependencies—even when users explicitly ask about \"code dependencies.\" Examining tool definitions reveals: MCP: analyze_dependencies — \"Analyzes dependency graph\". Built-in: Grep — \"Search file contents for a pattern using regular expressions. Returns matching lines with line numbers and surrounding context.\" What's the most effective approach to improve the agent's selection of MCP tools?", "opts": {"A": "Remove Grep from available tools when the MCP server is connected to eliminate functional overlap.", "B": "Split analyze_dependencies into granular tools (list_imports, resolve_transitive_deps, detect_circular_deps) so each has a focused purpose less likely to overlap with Grep.", "C": "Add routing instructions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep.", "D": "Expand MCP tool descriptions to detail capabilities and outputs—e.g., \"Builds dependency graph showing direct imports, transitive dependencies, and cycles.\""}, "a": "D", "sk": ["\"Analyzes dependency graph\""], "ak": ["Expand MCP tool descriptions"], "note": "Giống câu 13: mô tả sơ sài → mở rộng description.", "ex": "(Tương tự Q13) Mô tả tool quá ngắn/mơ hồ (\"Analyzes dependency graph\") so với Grep mô tả chi tiết. Tool description là yếu tố quan trọng nhất để LLM quyết định gọi tool nào. Mở rộng mô tả (khả năng, input/output cụ thể: direct imports, transitive deps, cycles) giúp LLM hiểu rõ sức mạnh vượt trội so với Grep.\n\nTại sao các phương án khác chưa tối ưu\nA\nxóa Grep mất công cụ tìm kiếm văn bản tổng quát quan trọng cho tác vụ khác.\nB\nchia nhỏ tăng số lượng tool, không giải quyết vấn đề mô tả thiếu thông tin.\nC\nthêm routing rule vào system prompt là patchwork, tốn context, không tuân thủ nguyên tắc self-describing tools chuẩn MCP.", "set": "Set 3", "topic": 3}, {"n": 175, "cat": "T", "stem": "An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference \"typical rendering patterns\" rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier. What's the most effective approach?", "opts": {"A": "Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project's CLAUDE.md.", "B": "Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation.", "C": "Summarize key rendering findings, then spawn a sub-agent for physics exploration with that summary in its initial context.", "D": "Continue in the current context with more targeted prompts referencing the specific classes by name."}, "a": "C", "sk": ["\"typical rendering patterns\""], "ak": ["Summarize key rendering findings", "spawn a sub-agent for physics exploration with that summary"], "note": "Giống câu 5.", "ex": "(Tương tự Q5) Trả lời chung chung thay vì tên lớp cụ thể là dấu hiệu context degradation/attention drift. Tóm tắt phát hiện rendering quan trọng, spawn sub-agent physics mới với bản tóm tắt trong initial context — đủ ngữ cảnh mà không dính nhiễu lịch sử cũ.\n\nTại sao các phương án khác chưa tối ưu\nA /clear xóa sạch ngữ cảnh rendering đã khám phá, phải tìm hiểu lại từ đầu.\n\nB\nsub-agent độc lập không có tóm tắt sẽ không hiểu mối tương quan physics-rendering, tổng hợp thủ công sau tốn thời gian.\nD\ntiếp tục trong context đã suy giảm chỉ nhắc tên lớp không giải quyết được attention drift.", "set": "Set 3", "topic": 2}, {"n": 176, "cat": "E", "stem": "Your agent has analyzed a complex service module—reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?", "opts": {"A": "Export the analysis session's key findings to a file, then create two new sessions that reference this file.", "B": "Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy.", "C": "Start two fresh sessions, having each re-read the relevant source files before beginning.", "D": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}, "a": "B", "sk": ["independently develop both approaches"], "ak": ["fork_session enabled"], "note": "Giống câu 10.", "ex": "(Tương tự Q10) fork_session kế thừa toàn bộ ngữ cảnh đã phân tích (23 file, request flow, error pattern) sang 2 nhánh độc lập — phát triển 2 chiến lược test riêng biệt mà không phân tích lại từ đầu hay lẫn lộn ngữ cảnh.\n\nTại sao các phương án khác chưa tối ưu\nA\nxuất file rồi truyền vào session mới mất lịch sử ngữ cảnh chi tiết đã phân tích sâu.\nC\nbắt đọc lại 23 file từ đầu lãng phí token/thời gian.\nD\nphát triển tuần tự cùng session làm context bloated, dễ lẫn lộn giữa 2 chiến lược.", "set": "Set 3", "topic": 2}, {"n": 177, "cat": "T", "stem": "Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate's merge. What approach best balances efficiency and accuracy?", "opts": {"A": "Resume the session and immediately have the agent re-read all 12 previously analyzed files", "B": "Start a fresh session to ensure the agent works with current codebase state without stale assumptions", "C": "Resume the session and inform the agent which specific files changed for targeted re-analysis", "D": "Resume the session without informing the agent about the changed files"}, "a": "C", "sk": ["3 of the 12 files", "modified overnight"], "ak": ["inform the agent which specific files changed"], "note": "Bẫy: {A} (đọc lại cả 12) và {B} (bắt đầu mới) phí công. Resume + báo đúng file thay đổi. (Giống câu 4)", "ex": "Tận dụng 9/12 file không đổi (đã có ngữ cảnh từ hôm qua) — hiệu quả. Thông báo cụ thể 3 file thay đổi cho targeted re-analysis — AI cập nhật mental model chính xác, tránh stale assumptions.\n\nTại sao các phương án khác chưa tối ưu\nA\nđọc lại toàn bộ 12 file dư thừa, không cần thiết cho 9 file không đổi.\nB\nmất toàn bộ ngữ cảnh 1 giờ làm việc hôm qua, lãng phí thời gian.\nD\ndùng code cũ mà không biết đã đổi rất nguy hiểm, dễ dẫn sai sót logic nghiêm trọng.", "set": "Set 3", "topic": 2}, {"n": 178, "cat": "T", "stem": "During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent answers about code structure it discussed earlier. Engineers report having to repeat context about modules they've already explored. What's the most effective approach to address this?", "opts": {"A": "Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions.", "B": "Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data.", "C": "Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context.", "D": "Create summaries of all source files before exploration begins, loading only these compressed representations into context."}, "a": "A", "sk": ["extended exploration sessions (30+ minutes)"], "ak": ["scratchpad file that records key findings"], "note": "Bẫy nhóm với câu 8/58: phiên dài quên kiến thức → ghi scratchpad file.", "ex": "Context degradation/attention drift khi phiên kéo dài. Scratchpad file ghi lại key findings vào external memory — agent tham chiếu lại để trả lời nhất quán, không cần nhắc lại ngữ cảnh cũ hay phụ thuộc lịch sử chat dài.\n\nTại sao các phương án khác chưa tối ưu\nB\ncontext window lớn hơn không giải quyết \"lost in the middle\" — LLM vẫn nhiễu/quên thông tin giữa ngữ cảnh dài.\nC\nauto-clear mỗi 15 phút mất hoàn toàn lịch sử, phải tìm hiểu lại từ đầu.\nD\ntóm tắt tất cả file trước khi khám phá mất chi tiết quan trọng, tốn token ban đầu, không đáp ứng nhu cầu khám phá sâu.", "set": "Set 3", "topic": 2}, {"n": 179, "cat": "E", "stem": "An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth—having the agent propose specific code changes for each—before deciding which to implement. What's the most effective way to structure this exploration?", "opts": {"A": "Resume yesterday's session to explore the first approach, then start a new session for the second, manually recreating the original context.", "B": "Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context.", "C": "Resume yesterday's session and explore both approaches sequentially within the same conversation thread.", "D": "Use fork_session to create two branches from yesterday's analysis, exploring one approach in each fork."}, "a": "D", "sk": ["explore both approaches in depth"], "ak": ["fork_session to create two branches"], "note": "Giống câu 9.", "ex": "(Tương tự Q9) Fork từ session hôm qua cho mỗi hướng tiếp cận context độc lập, bắt đầu cùng baseline phân tích — sạch, song song, không nhiễu chéo.\n\nTại sao các phương án khác chưa tối ưu\nA\ntái tạo thủ công dễ lỗi, mất trạng thái chính xác của phân tích hôm qua.\nB\nlàm lại công việc đã có, 2 session dễ lệch khỏi cùng baseline.\nC\nkhám phá tuần tự cùng thread khiến 2 hướng nhiễu context lẫn nhau.", "set": "Set 3", "topic": 2}, {"n": 180, "cat": "E", "stem": "A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 errors. The codebase has 200+ files and the developer doesn't know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?", "opts": {"A": "Have the agent first create a comprehensive plan mapping all code paths through the endpoint before beginning any file exploration or code reading.", "B": "Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges.", "C": "Define a fixed sequence of investigation steps upfront—grep for error patterns, then read error handlers, then check database queries, then examine middleware—executing each step regardless of intermediate findings.", "D": "Run parallel worker agents that simultaneously investigate all four layers, then synthesize their findings to identify where the error originates."}, "a": "B", "sk": ["doesn't know which components are involved"], "ak": ["dynamically generate investigation subtasks"], "note": "Giống câu 1.", "ex": "(Tương tự Q1) Debug mang bản chất thích ứng (adaptive) — mỗi file đọc được thay đổi bước tiếp theo hữu ích nhất. Để agent bám theo bằng chứng (follow the evidence) thay vì kế hoạch/pipeline cố định.\n\nTại sao các phương án khác chưa tối ưu\nA\nlập kế hoạch mù quáng cho lỗi chưa biết lãng phí thời gian, dễ bỏ lỡ luồng lỗi thực sự.\nC\npipeline cố định lãng phí công sức vào layer không liên quan, có thể khóa khỏi nguyên nhân gốc rễ.\nD\nchạy song song 4 layer khi chưa có subtask rõ phạm vi — trả gấp 4 lần chi phí tìm ở 3 layer không phải vấn đề.", "set": "Set 3", "topic": 2}, {"n": 181, "cat": "E", "stem": "After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and healthy. Examining the configuration, you find each MCP tool has a minimal description like \"extract_function: extracts a function from code.\" What's the most effective way to improve adoption of the MCP refactoring tools?", "opts": {"A": "Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them.", "B": "Remove the Write tool from the agent's configuration for refactoring sessions so it must use the MCP tools for code modifications.", "C": "Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools.", "D": "Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs."}, "a": "D", "sk": ["minimal description"], "ak": ["Enhance the MCP tool descriptions"], "note": "Giống câu 7.", "ex": "(Tương tự Q7/Q174) Lựa chọn tool được dẫn dắt bởi description mà Claude nhìn thấy. MCP tool ghi quá sơ sài trong khi Write/sed có \"tài liệu\" phong phú (built-in, quen thuộc) → Claude chọn Write/sed. Tăng cường mô tả (khi nào ưu tiên dùng, input/output mong đợi) giải quyết đúng gốc rễ.\n\nTại sao các phương án khác chưa tối ưu\nA\npre-classifier là hệ thống riêng cần duy trì, có thể misroute — giải pháp rẻ hơn là mô tả tool đủ mạnh.\nB\nloại bỏ Write ép \"adoption by subtraction\", phá vỡ use case Write hợp lệ.\nC\nchấp nhận thực trạng đi ngược mục đích tích hợp — vấn đề nằm ở mô tả, không phải ở việc tích hợp.", "set": "Set 4", "topic": 3}, {"n": 182, "cat": "T", "stem": "Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match — the file has repetitive docstrings, variable names, and structural patterns. What's the most reliable way to complete this insertion?", "opts": {"A": "Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness", "B": "Use Edit's replace_all parameter to target a common pattern and embed the new function in the replacement text", "C": "Use Bash to append the function definition to the end of the file using heredoc syntax", "D": "Use Read to load the file, add the function at the appropriate location, then Write the updated file"}, "a": "D", "sk": ["old_string parameter cannot find unique text"], "ak": ["Read to load the file", "Write the updated file"], "note": "Giống câu 2. Bẫy: {A} old_string dài.", "ex": "(Tương tự Q2) File chỉ 150 dòng — Read toàn bộ, chèn nội dung ở vị trí chính xác trong context, Write lại toàn bộ. An toàn, không sợ match sai vị trí, tiết kiệm, nằm tốt trong giới hạn context window.\n\nTại sao các phương án khác chưa tối ưu\nA\nold_string 30+ dòng dễ thất bại nếu sai lệch 1 ký tự trắng/xuống dòng.\nB\nreplace_all khi pattern lặp lại sẽ chèn hàm ở nhiều vị trí không mong muốn.\nC\nappend cuối file không đáp ứng yêu cầu chèn vào GIỮA file.", "set": "Set 4", "topic": 2}, {"n": 183, "cat": "T", "stem": "Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting—prices as \"$12\" vs \"12.00\", dietary info as icons vs text. What's the most reliable approach?", "opts": {"A": "Use separate extraction calls for each field to ensure consistent handling of each type.", "B": "Extract data as-is and normalize formats in post-processing code after Claude returns.", "C": "Request multiple extraction attempts per document and select the most common format.", "D": "Define a strict output schema and include format normalization rules in your prompt."}, "a": "D", "sk": ["inconsistent formatting"], "ak": ["strict output schema", "format normalization rules in your prompt"], "note": "Giống câu 23. Bẫy: {B} chuẩn hoá bằng code sau.", "ex": "(Tương tự Q23) Kết hợp JSON Schema nghiêm ngặt (Tool Use) + quy tắc chuẩn hóa rõ ràng trong prompt (vd \"chuyển giá về số thực 12.00\", \"chuyển icon ăn kiêng thành nhãn chuẩn Vegan/Gluten-Free\"). Claude tuân thủ schema + chuẩn hóa ngữ nghĩa tốt trong 1 lượt xử lý.\n\nTại sao các phương án khác chưa tối ưu\nA\ngọi API riêng từng trường tăng độ trễ/chi phí, mất ngữ cảnh tổng thể trang menu.\nB\npost-processing code khó xử lý dữ liệu không đồng nhất (icon→text, giá phức tạp).\nC\nmultiple attempts + voting lãng phí lớn, không giải quyết nếu format gốc vốn đã không nhất quán.", "set": "Set 4", "topic": 5}, {"n": 184, "cat": "E", "stem": "Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article—for example, outputting \"500\" for attendee_count when the source contains no attendance information. What's the most effective way to reduce these false extractions?", "opts": {"A": "Add a post-processing step using a second LLM call to verify each extracted value exists in the source document.", "B": "Add prompt instructions to return null for any field where information is not directly stated in the source.", "C": "Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data.", "D": "Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies."}, "a": "B", "sk": ["all nullable fields", "no attendance information"], "ak": ["return null for any field where information is not directly stated"], "note": "Giống câu 20.", "ex": "(Tương tự Q20) Model \"bịa đặt\" giá trị hợp lý khi cố lấp đầy field dù tài liệu không nhắc tới. Field đã nullable — thêm hướng dẫn rõ trong prompt (\"nếu thông tin không được đề cập trực tiếp, bắt buộc trả về null\") là cách trực tiếp, hiệu quả nhất.\n\nTại sao các phương án khác chưa tối ưu\nA\nLLM thứ 2 kiểm tra tăng gấp đôi latency/chi phí không cần thiết.\nC\nrequired field phản tác dụng, ép model điền dù không có thông tin → tăng hallucination.\nD\nmodel lớn hơn giảm phần nào nhưng không giải quyết gốc rễ nếu prompt thiếu quy tắc xử lý dữ liệu thiếu.", "set": "Set 4", "topic": 5}, {"n": 185, "cat": "E", "stem": "After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats—inline citations vs. bibliographies, methodology sections vs. details embedded in introductions. What's the most effective way to address these failures?", "opts": {"A": "Implement retry logic that re-sends requests when validation detects empty required fields.", "B": "Build a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract.", "C": "Modify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation.", "D": "Add few-shot examples demonstrating extractions from documents with varied structures—showing how to identify citations in different formats and locate methodology details across section types."}, "a": "D", "sk": ["varied formats"], "ak": ["few-shot examples demonstrating extractions from documents with varied structures"], "note": "Giống câu 21.", "ex": "(Tương tự Q21) Nguyên nhân không phải lỗi cú pháp mà là đa dạng cấu trúc tài liệu (citation inline vs bibliography; methodology riêng vs lồng trong intro). Few-shot examples định hướng model xử lý biến thể cấu trúc — học được vị trí/cách tìm thông tin chính xác hơn.\n\nTại sao các phương án khác chưa tối ưu\nA\nretry không đổi prompt dễ lặp lại kết quả thất bại cũ.\nB\nregex cứng nhắc, thất bại trước đa dạng ngữ nghĩa văn bản khoa học.\nC\nbiến field thành optional + đẩy người review chỉ che đậy vấn đề, không giải quyết khả năng trích xuất gốc.", "set": "Set 4", "topic": 5}, {"n": 186, "cat": "T", "stem": "Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types—\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"—and new types continue appearing regularly. What's the most effective long-term solution?", "opts": {"A": "Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases.", "B": "Add an \"other\" value to your enum with a separate property_type_detail string field for specifics when \"other\" is selected.", "C": "Change property_type from an enum to a free-form string and implement a normalization step in post-processing.", "D": "Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value."}, "a": "B", "sk": ["new types continue appearing regularly"], "ak": ["\"other\" value", "property_type_detail"], "note": "Giống câu 24. Bẫy: {C} string tự do.", "ex": "(Tương tự Q24) Schema Design Pattern chuẩn cho open-ended categories: thêm \"other\" vào enum + trường tự do property_type_detail — đảm bảo schema validation không lỗi, vẫn phân loại nhanh loại phổ biến, bảo tồn chi tiết loại lạ.\n\nTại sao các phương án khác chưa tối ưu\nA\nmở rộng enum thủ công liên tục tốn công, không bền vững.\nC\nfree-form string mất lợi ích chuẩn hóa của enum, đẩy phức tạp sang post-processing.\nD\nép map loại khác biệt (tiny house, loft) vào enum có sẵn làm sai lệch dữ liệu gốc.", "set": "Set 4", "topic": 5}, {"n": 187, "cat": "E", "stem": "Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the \"materials\" field—sometimes returning \"cotton blend\", other times \"Cotton/Polyester mix\", and occasionally omitting the field when material information is clearly present in the source. What's the most effective way to improve extraction consistency?", "opts": {"A": "Make the \"materials\" field required instead of optional in the schema to force the model to always extract a value", "B": "Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability", "C": "Set temperature to 0 to eliminate randomness and ensure deterministic outputs", "D": "Add few-shot examples showing 2-3 complete input-output pairs with standardized material description formats"}, "a": "D", "sk": ["inconsistently extracts"], "ak": ["few-shot examples"], "note": "Giống câu 19.", "ex": "(Tương tự Q19) 2-3 ví dụ input-output cụ thể kèm định dạng chuẩn hóa mong muốn giúp model hiểu mẫu cần tuân thủ, nâng độ phủ trích xuất, tránh bỏ sót.\n\nTại sao các phương án khác chưa tối ưu\nA\nrequired field ép model bịa giá trị khi không có thông tin → hallucination.\nB\nmodel lớn hơn không giải quyết bất nhất định dạng nếu thiếu ví dụ mẫu.\nC\ntemperature=0 giảm ngẫu nhiên nhưng không dạy cách chuẩn hóa nếu chưa có ví dụ định hướng.", "set": "Set 4", "topic": 5}, {"n": 188, "cat": "E", "stem": "The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents didn't find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage. What change would most effectively improve research completeness?", "opts": {"A": "Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before invoking synthesis again.", "B": "Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information.", "C": "Have the report generation agent note which research questions couldn't be answered, so users understand the limitations of the final output.", "D": "Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator."}, "a": "A", "sk": ["three key research questions remain unanswered"], "ak": ["coordinator evaluate synthesis output for gaps", "re-delegate"], "note": "Giống câu 107.", "ex": "(Tương tự Q107) Evaluator-Optimizer/Feedback Loop Pattern chuẩn: Synthesis Agent phát hiện gap → trả quyền về Coordinator → đánh giá + re-delegate với targeted queries → tổng hợp lại.\n\nTại sao các phương án khác chưa tối ưu\nB\ntăng breadth mù quáng tăng chi phí/nhiễu, chưa chắc bao phủ đúng khía cạnh thiếu.\nC\nghi chú giới hạn chỉ chấp nhận thiếu sót, không cải thiện completeness.\nD\nsynthesis agent tự gọi web search vi phạm Separation of Concerns, mất kiểm soát trung tâm của coordinator.", "set": "Set 4", "topic": 4}, {"n": 189, "cat": "E", "stem": "Investigation monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, waits for its response, then invokes the document analysis subagent and waits again. These tasks are independent — neither requires the other's output. How should you modify the system to run these subagents concurrently?", "opts": {"A": "Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time.", "B": "Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator-subagent pair, then aggregates results.", "C": "Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution and requesting it invoke both subagents at the same time.", "D": "Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message rather than across separate conversation turns."}, "a": "D", "sk": ["tasks are independent"], "ak": ["emit both Task tool calls", "single response message"], "note": "Giống câu 102.", "ex": "(Tương tự Q102/Q160) Khi agent phát nhiều tool call trong CÙNG 1 response turn, runtime tự động thực thi song song. Coordinator xuất cả 2 Task tool call trong 1 turn — chạy đồng thời web search + document analysis, không cần đổi hạ tầng phức tạp.\n\nTại sao các phương án khác chưa tối ưu\nA\nHaiku giảm thời gian từng task nhưng không giải quyết thực thi tuần tự.\nB\ntạo async layer ngoài phức tạp không cần thiết khi tool use đã hỗ trợ song song tự nhiên.\nC\nchỉ hướng dẫn prompt không cấu trúc tool call generation, model dễ quay lại thói quen tuần tự.", "set": "Set 4", "topic": 4}, {"n": 190, "cat": "T", "stem": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent findings are synthesized into a single confident statement (losing nuance), while other times reports over-hedge with excessive qualifications (becoming unhelpful). When the web search agent returns \"industry analysts estimate $50B market size (methodology varies)\" and the document analysis agent returns \"peer-reviewed study estimates $35B (±7B, 95% CI),\" the coordinator either picks one arbitrarily or produces vague statements like \"the market may be $35B−$50B depending on factors.\" What systematic approach best addresses this?", "opts": {"A": "Configure subagents to only report findings meeting a high-confidence threshold, filtering uncertain information before it reaches the coordinator.", "B": "Add a verification subagent that cross-references findings across sources, only passing claims to synthesis that are corroborated by at least two independent sources.", "C": "Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context.", "D": "Implement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized probability scores (0.0-1.0), then weight-average findings by their calculated reliability scores to produce a statistically grounded synthesis."}, "a": "C", "sk": ["picks one arbitrarily or produces vague statements"], "ak": ["explicit sections distinguishing well-established findings from contested ones"], "note": "Giống câu 32/167. Bẫy: {D} quy đổi xác suất (phương án dài nhất).", "ex": "(Tương tự Q167) Xung đột giữa nguồn có phương pháp nghiên cứu khác nhau. Cấu trúc báo cáo với section rõ ràng phân biệt phát hiện đã xác minh vs còn tranh cãi, giữ nguyên phương pháp/ngữ cảnh từng nguồn — tránh gộp thành 1 câu mơ hồ hoặc chọn đại 1 nguồn.\n\nTại sao các phương án khác chưa tối ưu\nA\nlọc bỏ thông tin bất ổn làm mất góc nhìn quan trọng từ phân tích thị trường thực tế.\nB\nyêu cầu tối thiểu 2 nguồn bỏ sót nghiên cứu độc lập giá trị chỉ có 1 nguồn.\nD\nquy đổi xác suất 0.0-1.0 rồi trung bình trọng số khiên cưỡng, mất ý nghĩa phương pháp luận gốc.", "set": "Set 4", "topic": 4}, {"n": 191, "cat": "E", "stem": "In production, you observe that simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement signed?\") traverse all four subagents sequentially, consuming 40+ seconds. While this might be acceptable for complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications. What's the most effective approach to optimize for varying query complexity?", "opts": {"A": "Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination.", "B": "Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve.", "C": "Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements.", "D": "Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness."}, "a": "C", "sk": ["diverse and evolving"], "ak": ["dynamically decide which subagents to invoke"], "note": "Giống câu 60.", "ex": "(Tương tự Q40/Q60/Q163) Dynamic Orchestration: phân bố truy vấn đa dạng/evolving → LLM coordinator phân tích và quyết định ĐỘNG subagent nào cần thiết. Câu đơn giản chỉ kích hoạt tối thiểu (40s→vài giây), câu phức tạp vẫn đủ quy trình, không phụ thuộc rule cứng hay classifier tĩnh.\n\nTại sao các phương án khác chưa tối ưu\nA\npattern-based routing cứng nhắc nhanh lỗi thời khi truy vấn tiến hóa.\nB\nML classifier tốn chi phí dữ liệu nhãn/bảo trì/retrain, thiếu linh hoạt với truy vấn mới.\nD\nfast-path tĩnh chỉ giải quyết 1 nhóm nhỏ, không đáp ứng đa dạng truy vấn thực tế.", "set": "Set 4", "topic": 4}, {"n": 192, "cat": "E", "stem": "A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with margins and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology. The synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to lose narrative flow. What change would most improve briefing quality?", "opts": {"A": "Update the synthesis agent to render each content type appropriately—financial data as tables, news as prose, and technical lists as structured points.", "B": "Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation (such as Markdown) to facilitate more flexible rendering.", "C": "Standardize all subagent outputs to JSON with fields for every data type to ensure programmatic consistency across the pipeline.", "D": "Standardize all subagent outputs to prose summaries with a uniform character to maintain a consistent executive voice regardless of the source material."}, "a": "A", "sk": ["converts everything to bullet points"], "ak": ["render each content type appropriately"], "note": "Mỗi loại nội dung một định dạng phù hợp (bảng, văn xuôi, gạch đầu dòng).", "ex": "Mỗi loại dữ liệu có hình thức trình bày tối ưu khác nhau: tài chính (số liệu, margin, growth rate) → bảng; tin tức → văn xuôi giữ mạch; danh sách kỹ thuật/bằng sáng chế → structured points. Cập nhật Synthesis Agent linh hoạt định dạng theo bản chất dữ liệu giải quyết triệt để vấn đề mất tính so sánh bảng biểu và gãy mạch tin tức.\n\nTại sao các phương án khác chưa tối ưu\nB\nlớp chuyển đổi Markdown trung gian không tự dạy Agent cách chọn định dạng nếu prompt/logic chưa cập nhật.\nC\nJSON hóa toàn bộ giúp xử lý lập trình nhưng không giải quyết hiển thị cho người đọc (executive briefing).\nD\nép tất cả thành prose làm mất tính trực quan của số liệu tài chính và danh sách kỹ thuật.", "set": "Set 4", "topic": 4}, {"n": 193, "cat": "E", "stem": "The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate—it generates messages like \"I'll ask the web search agent to find sources on this topic\"—but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors. What is the most likely cause?", "opts": {"A": "Subagent context isolation means task descriptions from the coordinator don't automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions.", "B": "The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified.", "C": "The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation, it cannot invoke the tool required to spawn subagents.", "D": "The AgentDefinitions are configured correctly, but the coordinator's system prompt doesn't explicitly list the available subagent types, preventing the model from knowing they can be invoked."}, "a": "C", "sk": ["no subagent execution ever occurs"], "ak": ["allowedTools configuration doesn't include \"Task\""], "note": "Giống câu 59.", "ex": "(Tương tự Q30/Q59) Delegation qua tool đặc biệt \"Task\". Nếu allowedTools thiếu \"Task\", model hiểu ngữ nghĩa nên ủy quyền (xuất văn bản suy luận) nhưng không thể kích hoạt tool call thực tế để spawn subagent — không crash, tiếp tục chạy như đã hoàn thành.\n\nTại sao các phương án khác chưa tối ưu\nA\ntask description truyền qua tham số Task tool call trực tiếp, không cần context forwarding riêng.\nB\nmax_tokens thấp gây truncate thường ghi lỗi stop_reason/parse JSON trong logs, không \"sạch sẽ không lỗi\".\nD\nAgentDefinitions đã cấu hình đủ 4 subagent, SDK tự tạo danh sách khả dụng cho coordinator.", "set": "Set 4", "topic": 4}, {"n": 194, "cat": "T", "stem": "The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string array), cons (string array), and overall_sentiment (enum: positive, negative, mixed). Testing reveals two issues with brief or ambiguous reviews (~20% of the dataset): (1) for reviews like \"Great product!\", Claude fabricates specific pros and cons rather than indicating this information isn't explicitly stated, and (2) for sarcastic reviews like \"Well that was... interesting\", Claude picks sentiment arbitrarily since there's no option for ambiguous cases. What schema modification best addresses both issues?", "opts": {"A": "Make pros and cons optional fields, and add \"neutral\" and \"unclear\" to the sentiment enum.", "B": "Allow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum.", "C": "Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls below a threshold.", "D": "Allow null values for pros/cons, and add \"unclear\" to the sentiment enum."}, "a": "B", "sk": ["fabricates specific pros and cons", "no option for ambiguous cases"], "ak": ["empty arrays for pros/cons", "\"unclear\""], "note": "Giống câu 145. Bẫy chữ: mảng rỗng (đúng) vs null.", "ex": "(Tương tự Q145) Mảng rỗng [] cho string array báo hiệu \"không có thông tin nêu ra\" — tránh bịa đặt. Thêm \"unclear\" vào sentiment enum cho câu mỉa mai/mơ hồ không thể xếp tích cực/tiêu cực chắc chắn.\n\nTại sao các phương án khác chưa tối ưu\nA\noptional field không phân biệt rõ \"không đề cập\" vs \"thiếu output\".\nC\nconfidence field + threshold tăng phức tạp không cần thiết, LLM tự đánh giá confidence thường không chính xác.\nD\nnull thay vì [] cho kiểu array không phải best practice, dễ lỗi/không nhất quán ở backend.", "set": "Set 4", "topic": 5}, {"n": 195, "cat": "T", "stem": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent findings are synthesized into a single confident statement (losing nuance), while other times reports over-hedge with excessive qualifications (becoming unhelpful). When the web search agent returns \"industry analysts estimate $50B market size (methodology varies)\" and the document analysis agent returns \"peer-reviewed study estimates $35B (±$7B, 95% CI),\" the coordinator either picks one arbitrarily or produces vague statements like \"the market may be $35B-$50B depending on factors.\" What systematic approach best addresses this?", "opts": {"A": "Implement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized probability scores (0.0-1.0), then weight-average findings by their calibrated confidence.", "B": "Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context.", "C": "Configure subagents to only report findings meeting a high-confidence threshold, filtering uncertain information before it reaches the coordinator.", "D": "Add a verification subagent that cross-references findings across sources, only passing claims to synthesis that are corroborated by at least two independent sources."}, "a": "B", "sk": ["picks one arbitrarily or produces vague statements"], "ak": ["explicit sections distinguishing well-established findings from contested ones"], "note": "Giống câu 167.", "ex": "(Tương tự Q167/Q190) Bảo tồn sắc thái + bối cảnh: phân loại rõ nội dung đã đồng thuận vs đang tranh cãi, trích dẫn minh bạch phương pháp luận từng nguồn (giải thích vì sao $50B khác $35B) thay vì gộp ép hoặc mơ hồ hóa.\n\nTại sao các phương án khác chưa tối ưu\nA\nquy đổi xác suất rồi trung bình trọng số khiên cưỡng cho dữ liệu định tính, không thể \"trung bình\" 2 phương pháp luận khác nhau.\nC\nlọc bỏ thông tin chưa chắc chắn từ đầu bỏ sót phát hiện/cảnh báo quan trọng.\nD\nyêu cầu tối thiểu 2 nguồn loại bỏ thông tin độc quyền/phát hiện mới chỉ có 1 nguồn.", "set": "Set 4", "topic": 4}, {"n": 196, "cat": "T", "stem": "Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types—\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"—and new types continue appearing regularly. What's the most effective long-term solution?", "opts": {"A": "Add an \"other\" value to your enum with a separate property_type_detail string field for specifics when \"other\" is selected.", "B": "Change property_type from an enum to a free-form string and implement a normalization step in post-processing.", "C": "Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value.", "D": "Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases."}, "a": "A", "sk": ["new types continue appearing regularly"], "ak": ["\"other\" value", "property_type_detail"], "note": "Giống câu 24.", "ex": "(Trùng Q186/Q24) Giữ enum phổ biến cho 92% trường hợp + thêm \"other\" với property_type_detail — graceful fallback cho loại mới/hiếm, không cần cập nhật liên tục, scalable.\n\nTại sao các phương án khác chưa tối ưu\nB\nfree-form string mất khả năng validation, dữ liệu dễ không đồng nhất (\"apt\"/\"Apartment\"/\"appartment\").\nC\nép loại khác biệt về enum gần nhất làm mất thông tin gốc.\nD\ncập nhật enum liên tục tốn công bảo trì, vẫn tiếp tục lỗi 8% khi gặp loại mới.", "set": "Set 4", "topic": 5}, {"n": 197, "cat": "E", "stem": "Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article—for example, outputting \"500\" for attendee_count when the source contains no attendance information. What's the most effective way to reduce these false extractions?", "opts": {"A": "Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data.", "B": "Add prompt instructions to return null for any field where information is not directly stated in the source.", "C": "Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies.", "D": "Add a post-processing step using a second LLM call to verify each extracted value exists in the source document."}, "a": "B", "sk": ["all nullable fields", "no attendance information"], "ak": ["return null for any field where information is not directly stated"], "note": "Giống câu 20.", "ex": "(Trùng Q184/Q20) Schema đã nullable nhưng thiếu hướng dẫn xử lý dữ liệu thiếu → model tự bịa. Prompt instruction rõ ràng \"trả null khi thông tin không nêu trực tiếp\" đặt ranh giới ngăn suy đoán.\n\nTại sao các phương án khác chưa tối ưu\nA\nrequired field ép model bịa giá trị để thỏa schema khi tài liệu thiếu thông tin.\nC\nmodel lớn hơn vẫn hallucinate nếu prompt không hướng dẫn xử lý thiếu dữ liệu.\nD\nLLM thứ 2 verify tốn chi phí/latency không cần thiết cho vấn đề giải quyết được ngay ở bước prompt.", "set": "Set 4", "topic": 5}, {"n": 198, "cat": "T", "stem": "Your fitness coaching assistant uses a system prompt with detailed conditional logic: \"If the user mentions being a beginner, provide step-by-step form instructions. If they use terms like 'progressive overload' or 'superset', respond concisely. If they ask about injury history, always recommend consulting a physician.\" During evaluation, you find the assistant correctly adapts to explicit expertise declarations but struggles when users don't clearly state their level—often defaulting to overly detailed responses regardless of contextual cues like technical terminology. Which change to the system prompt would most directly address this failure to pick up on implicit expertise signals?", "opts": {"A": "Add an explicit instruction for the model to ask a clarifying question about experience level whenever the user's expertise isn't immediately clear from their first message.", "B": "Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise, mirroring their terminology.\" Keep only the safety-critical conditional about injury consultations.", "C": "Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses.", "D": "Add more conditional branches to cover additional expertise signals, such as \"If user mentions specific rep ranges or asks about periodization, treat as advanced.\""}, "a": "B", "sk": ["implicit expertise signals"], "ak": ["general principle", "Keep only the safety-critical conditional"], "note": "Giống câu 138. Bẫy: {D} thêm nhánh if.", "ex": "(Trùng Q138) Quá nhiều if/else khiến model khớp từ khóa cứng, bỏ qua suy luận ngữ cảnh tự nhiên. General principle phát huy khả năng NLU của LLM để nhận biết linh hoạt mức độ chuyên môn; giữ conditional cứng CHỈ cho vấn đề an toàn/pháp lý (tư vấn chấn thương).\n\nTại sao các phương án khác chưa tối ưu\nA\nhỏi lại ngay từ đầu tạo friction, không giải quyết tận gốc nhận biết tín hiệu ngầm.\nC\nthêm bước khảo sát đổi kiến trúc hệ thống, không phải điều chỉnh trực tiếp system prompt.\nD\nthêm nhánh if/else làm trầm trọng \"bẫy từ khóa\", prompt dài dòng vẫn thất bại với thuật ngữ mới.", "set": "Set 4", "topic": 7}, {"n": 199, "cat": "T", "stem": "A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific function. You haven't worked with this module before. What's the most effective approach?", "opts": {"A": "Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing any changes.", "B": "Use plan mode to analyze the error in context of the module's design, enumerate potential root causes, and prioritize fixes systematically.", "C": "Enter plan mode to explore the module's architecture and dependencies before attempting any fixes.", "D": "Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause."}, "a": "D", "sk": ["clear stack trace pointing to a specific function"], "ak": ["direct execution"], "note": "Giống câu 64. Bẫy: plan mode.", "ex": "⚠️ *Lưu ý: câu này cùng đáp án với Q64 (cùng bối cảnh lỗi production + module lạ + \"clear stack trace\" chỉ rõ vị trí → Direct execution). Khác với Q83 — Q83 là migration thư viện diện rộng qua 45 file, phạm vi lớn/mơ hồ nên mới dùng Plan mode. Ở đây đề nêu rõ \"clear stack trace pointing to a specific function\" — phạm vi đã khoanh vùng hẹp, có manh mối cụ thể → dùng Direct execution để xử lý nhanh sự cố khẩn cấp.*\n\nBug khẩn cấp ảnh hưởng production + đã có stack trace chỉ thẳng 1 hàm cụ thể → Direct execution phù hợp cho tác vụ phạm vi hẹp, đã có manh mối rõ ràng, cần phản ứng nhanh giảm downtime.\n\nTại sao các phương án khác chưa tối ưu\nA, B, C dùng Plan Mode phù hợp cho nhiệm vụ phức tạp/mơ hồ, thiết kế lại kiến trúc — ở đây stack trace đã rõ, việc nghiên cứu lại kiến trúc/phân tích nguyên nhân tiềm năng chỉ kéo dài thời gian xử lý sự cố khẩn cấp.", "set": "Set 4", "topic": 1}, {"n": 200, "cat": "T", "stem": "After deploying automated code review, developers report that approximately 35% of flagged findings are false positives falling into consistent patterns: style suggestions contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to catch genuine issues. Which approach best enables the model to generalize its judgment to novel code patterns it hasn't seen before?", "opts": {"A": "Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category.", "B": "Implement post-processing that uses keyword matching to filter out findings containing terms like \"convention,\" \"context-dependent,\" or \"trade-off.\"", "C": "Add instructions to your system prompt to \"be conservative,\" \"only flag definite issues,\" and \"consider that some patterns may be intentional.\"", "D": "Create a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt."}, "a": "A", "sk": ["generalize its judgment to novel code patterns"], "ak": ["few-shot examples", "annotated code snippets"], "note": "Giống câu 154.", "ex": "(Trùng Q154) Annotated few-shot examples (phân biệt acceptable pattern vs genuine issue kèm giải thích) giúp LLM hiểu tư duy/tiêu chuẩn đánh giá thay vì học thuộc quy tắc cứng — generalize tốt cho code pattern mới chưa từng gặp.\n\nTại sao các phương án khác chưa tối ưu\nB\nkeyword matching dễ lọc nhầm cảnh báo đúng chứa từ khóa đó, giảm độ nhạy.\nC\nchỉ dẫn mơ hồ (\"be conservative\") khiến model quá dè dặt, tăng false negatives.\nD\ntài liệu quy định toàn bộ pattern cứng nhắc, tốn token, thất bại với pattern mới ngoài tài liệu.", "set": "Set 4", "topic": 1}, {"n": 201, "cat": "E", "stem": "Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval—beyond the agent's authorization level. How should the workflow handle this mid-process escalation?", "opts": {"A": "Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID.", "B": "Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human.", "C": "Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction.", "D": "Call escalate_to_human passing only the customer's original message."}, "a": "B", "sk": ["beyond the agent's authorization level"], "ak": ["structured handoff"], "note": "Giống câu 47.", "ex": "(Trùng Q47/Q173) Structured handoff: đóng gói thông tin khách hàng, đơn hàng, nguyên nhân cụ thể trước khi escalate_to_human — nhân viên nắm ngay tình hình, không cần đọc lại hội thoại/bắt khách trình bày lại.\n\nTại sao các phương án khác chưa tối ưu\nA\nlưu DB + reference ID tốn thời gian tra cứu, thiếu tóm tắt trọng tâm.\nC\ncố thực hiện vượt thẩm quyền vi phạm chính sách an toàn.\nD\nchỉ gửi tin nhắn gốc mất toàn bộ thông tin đã tra cứu (order, customer).", "set": "Set 4", "topic": 6}, {"n": 202, "cat": "T", "stem": "The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like \"extract key financial metrics\" often return narrative summaries, while \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports analysis results require re-requests with clarified instructions. What's the most effective way to improve reliability?", "opts": {"A": "Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats.", "B": "Keep the single tool but add an analysis_type enum parameter requiring explicit selection between extraction, summarization, and verification.", "C": "Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent.", "D": "Split the generic tool into purpose-specific tools—extract_data_points, summarize_content, verify_claim_against_source—each with defined input/output contracts."}, "a": "D", "sk": ["free-text instruction parameter"], "ak": ["Split the generic tool into purpose-specific tools"], "note": "Giống câu 29. Bẫy: {B} thêm enum.", "ex": "(Trùng Q29) Single Responsibility Principle: chia tool đa năng thành tool chuyên biệt, mỗi tool có schema output riêng (extract→JSON/bảng, summarize→text) — loại bỏ hoàn toàn sai lệch định dạng đầu ra.\n\nTại sao các phương án khác chưa tối ưu\nA\nthêm ví dụ vào description vẫn mơ hồ khi 1 tool gánh quá nhiều tác vụ (tool overloading).\nB\nenum parameter nhưng vẫn dùng free-text instruction, kết quả vẫn không nhất quán cấu trúc.\nC\npre-classify ở coordinator tăng latency/chi phí/phức tạp không cần thiết.", "set": "Set 4", "topic": 3}, {"n": 203, "cat": "E", "stem": "Your agent has analyzed a complex service module—reading 23 source files, tracing request flows, and identifying error handling patterns. A developer needs to develop two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. The developer needs to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?", "opts": {"A": "Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy.", "B": "Export the analysis session's key findings to a file, then create two new sessions that reference this file.", "C": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.", "D": "Start two fresh sessions, having each re-read the relevant source files before beginning."}, "a": "A", "sk": ["independently develop both approaches"], "ak": ["fork_session enabled"], "note": "Giống câu 10.", "ex": "(Trùng Q10/Q56/Q176) fork_session tận dụng tối đa ngữ cảnh đã phân tích (23 file), tạo 2 nhánh độc lập không nhiễu chéo cho 2 chiến lược test.\n\nTại sao các phương án khác chưa tối ưu\nB\nxuất ra file mất chi tiết sâu (nuance) đã phân tích.\nC\ntuần tự cùng session kéo dài context, dễ nhiễu giữa 2 phương án. D 2 session mới tốn token/thời gian đọc lại 23 file từ đầu.", "set": "Set 4", "topic": 2}, {"n": 204, "cat": "T", "stem": "An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn't spent much time on the codebase, so they ask for help identifying which modules to prioritize. How should the agent decompose this open-ended task?", "opts": {"A": "Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered.", "B": "Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or importance.", "C": "Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for everything from the beginning.", "D": "Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically."}, "a": "A", "sk": ["ask for help identifying which modules to prioritize"], "ak": ["map codebase structure", "prioritized plan", "revise as dependencies are discovered"], "note": "Giống câu 105.", "ex": "(Trùng Q105) Glob/Grep lập bản đồ cấu trúc, xác định module heavily-coupled, ưu tiên high-impact areas, điều chỉnh linh hoạt khi phát hiện phụ thuộc mới — không cần đọc hết 200 file.\n\nTại sao các phương án khác chưa tối ưu\nB\nchia đều nỗ lực bất kể độ phức tạp lãng phí.\nC\nđọc hết 200 file trước gây tràn context, lãng phí token.\nD\nthứ tự alphabet ngẫu nhiên, bỏ qua kiến trúc/ưu tiên thực tế.", "set": "Set 4", "topic": 2}, {"n": 205, "cat": "T", "stem": "Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall for API design findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall improves to 41% but API design recall drops to 68%. How should you address this trade-off to improve detection across both categories?", "opts": {"A": "Split the review into separate focused prompts — one for security and API design, another for business logic — each with dedicated examples, then consolidate findings before posting.", "B": "Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculations and boundary conditions in grading thresholds.", "C": "Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off."}, "a": "A", "sk": ["API design recall drops to 68%"], "ak": ["Split the review into separate focused prompts"], "note": "Giống câu 124 (câu này chỉ có 3 phương án).", "ex": "(Trùng Q124) Prompt Overloading: 1 prompt gánh quá nhiều vai trò gây attention dilution — thêm ví dụ logic làm giảm recall API design. Chia 2 prompt riêng biệt (security+API design / business logic), mỗi bên few-shot chuyên biệt, hợp nhất kết quả sau.\n\nTại sao các phương án khác chưa tối ưu\nB\nchecklist cứng nhắc không giải quyết phân tán chú ý, khó bao quát hết edge case logic.\nC\nmodel mạnh hơn chưa chắc giải quyết tận gốc đánh đổi chú ý khi 1 prompt gánh nhiều tác vụ.", "set": "Set 4", "topic": 1}, {"n": 206, "cat": "E", "stem": "Compliance requires that refunds exceeding $500 must automatically escalate to a human agent—this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate). How should you achieve guaranteed compliance?", "opts": {"A": "Modify the refund tool to return an error with message \"Amount exceeds policy limit—please escalate\" when threshold is exceeded.", "B": "Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation.", "C": "Strengthen the system prompt with emphatic language: \"CRITICAL POLICY! Refunds over $500 MUST trigger human escalation. NEVER process these directly!\"", "D": "Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600)."}, "a": "B", "sk": ["cannot be left to model discretion", "guaranteed compliance"], "ak": ["hook to intercept tool calls"], "note": "Giống câu 52.", "ex": "(Trùng Q52/Q170) LLM vốn xác suất — chỉ prompting (C, D) không bao giờ đảm bảo 100% tuân thủ. Hook/interceptor ở tầng hạ tầng chặn tool call trước khi thực thi khi amount >$500 — deterministic control tuyệt đối.\n\nTại sao các phương án khác chưa tối ưu\nA\ntrả lỗi chỉ tác dụng SAU khi tool đã nhận yêu cầu, agent vẫn phải tự suy luận tiếp, vẫn có nguy cơ xử lý sai. C &\nD\nchỉ prompt/few-shot giảm tỷ lệ lỗi chứ không loại bỏ hoàn toàn rủi ro do bản chất xác suất LLM.", "set": "Set 4", "topic": 6}, {"n": 207, "cat": "E", "stem": "Production logs reveal inconsistent error handling. When looking up records, the agent sometimes retries 5+ times (even when the ID doesn't exist), sometimes escalates immediately (prematurely for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed.\"}]}. The agent cannot distinguish between error types. What's the most effective improvement?", "opts": {"A": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted.", "B": "Create an analyze_error MCP tool that the agent calls after any failure to determine the error category and recommended action.", "C": "Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each.", "D": "Return structured error metadata in MCP responses."}, "a": "D", "sk": ["uniform error responses", "cannot distinguish between error types"], "ak": ["structured error metadata"], "note": "Giống câu 61.", "ex": "(Tương tự Q49/Q89) Message lỗi đồng nhất khiến agent không phân biệt được not_found/transient/permission. Trả structured error metadata (error_code, category, mô tả rõ) trong MCP response — agent quyết định linh hoạt: tự retry lỗi tạm thời, báo permission cho user, dừng nếu ID không tồn tại.\n\nTại sao các phương án khác chưa tối ưu\nA\nauto-retry ở tầng MCP tăng độ trễ không cần thiết cho lỗi không thể sửa bằng retry (sai ID, permission).\nB\ntool analyze_error phụ tốn thêm 1 bước LLM/token/latency mỗi lần lỗi.\nC\nfew-shot không giải quyết cốt lõi vì chuỗi \"Operation failed.\" không chứa đủ thông tin để phân biệt loại lỗi.\n---", "set": "Set 4", "topic": 3}, {"n": 208, "cat": "E", "stem": "Your agentic loop calls the Messages API and branches on `stop_reason`. It handles `tool_use` by executing tools and treats every other value as \"the model is done.\" In production, some final answers to users end mid-sentence. What is the most likely cause and fix?", "opts": {"A": "The model is refusing the request; add a retry with a higher temperature.", "B": "Responses are stopping with `max_tokens`; handle that value explicitly by raising the limit or continuing the generation instead of treating it as a finished answer.", "C": "The tool results are too long; truncate every tool result to 500 characters.", "D": "The system prompt is too long; move instructions into the first user message."}, "a": "B", "sk": ["end mid-sentence"], "ak": ["`max_tokens`"], "note": "Câu bị cắt giữa chừng → stop_reason max_tokens chưa được xử lý.", "ex": "Nguồn chủ đề: xử lý `stop_reason` trong agentic loop (Messages API docs). `stop_reason` có nhiều giá trị: `end_turn`, `tool_use`, `max_tokens`, `stop_sequence`, `pause_turn`, `refusal`. Gộp tất cả giá trị khác `tool_use` thành \"đã xong\" khiến phản hồi bị cắt do `max_tokens` được trả nguyên cho người dùng. Cần nhánh riêng cho `max_tokens`: tăng giới hạn hoặc gửi tiếp để model hoàn thành.\n\nTại sao các phương án khác chưa tối ưu\nA\nrefusal có `stop_reason` riêng là `refusal`, và tăng temperature không giải quyết việc bị cắt.\nC\ncắt tool result có thể làm mất dữ liệu cần thiết, không liên quan đến câu trả lời cuối bị cụt.\nD\nvị trí instruction không ảnh hưởng tới giới hạn token đầu ra.", "set": "Set 5", "topic": 3}, {"n": 209, "cat": "E", "stem": "A team builds a two-stage pipeline: one call drafts a technical summary, then a second call critiques the draft against a written rubric and returns specific feedback. The draft is revised and re-critiqued until the rubric passes or three rounds elapse. Which workflow pattern is this?", "opts": {"A": "Routing", "B": "Parallelization (voting)", "C": "Evaluator-optimizer", "D": "Orchestrator-workers"}, "a": "C", "sk": ["critiques the draft against a written rubric", "revised and re-critiqued"], "ak": ["Evaluator-optimizer"], "note": "Viết → chấm → sửa lặp lại = evaluator-optimizer.", "ex": "Nguồn chủ đề: các workflow pattern trong \"Building effective agents\" (Anthropic). Evaluator-optimizer: một lời gọi tạo ra kết quả, một lời gọi khác đánh giá theo tiêu chí rõ ràng và trả feedback, lặp lại đến khi đạt. Pattern này hiệu quả khi có tiêu chí đánh giá rõ và vòng sửa đổi tạo ra cải thiện đo được. Giới hạn số vòng (3) tránh lặp vô hạn.\n\nTại sao các phương án khác chưa tối ưu\nA\nrouting phân loại input rồi chuyển đến prompt chuyên biệt, không có vòng phản hồi.\nB\nvoting chạy cùng một tác vụ nhiều lần rồi tổng hợp, không có bước sửa dựa trên critique.\nD\norchestrator-workers chia nhỏ tác vụ động cho nhiều worker rồi tổng hợp, không phải vòng draft–critique.", "set": "Set 5", "topic": 4}, {"n": 210, "cat": "E", "stem": "According to Anthropic's guidance, what distinguishes a \"workflow\" from an \"agent\"?", "opts": {"A": "Workflows use tools; agents do not.", "B": "Workflows orchestrate LLMs and tools through predefined code paths; agents dynamically direct their own process and tool usage.", "C": "Agents always run multiple models in parallel; workflows use a single model.", "D": "Workflows require fine-tuned models; agents use base models with prompts."}, "a": "B", "sk": ["\"workflow\" from an \"agent\""], "ak": ["predefined code paths", "dynamically direct their own process"], "note": "Workflow = đường đi định sẵn; agent = tự quyết định.", "ex": "Nguồn chủ đề: \"Building effective agents\" (Anthropic). Workflow: luồng điều khiển do code định sẵn (chaining, routing, parallelization...). Agent: LLM tự quyết định các bước và cách dùng tool trong vòng lặp. Khuyến nghị là bắt đầu bằng giải pháp đơn giản nhất và chỉ thêm tính tự chủ khi cần, vì agent đánh đổi chi phí và độ trễ lấy sự linh hoạt.\n\nTại sao các phương án khác chưa tối ưu\nA\ncả hai đều có thể dùng tool.\nC\nchạy song song là một pattern workflow, không phải định nghĩa của agent.\nD\nkhông liên quan đến fine-tuning.", "set": "Set 5", "topic": 4}, {"n": 211, "cat": "E", "stem": "Your support agent must always call `lookup_customer` as its very first action, then choose freely among the remaining tools for the rest of the conversation. How should you configure `tool_choice`?", "opts": {"A": "Set `tool_choice` to `{\"type\": \"any\"}` for every request.", "B": "Set `tool_choice` to `{\"type\": \"none\"}` on the first request and `auto` afterwards.", "C": "Remove all tools except `lookup_customer` for the whole session.", "D": "Set `tool_choice` to `{\"type\": \"tool\", \"name\": \"lookup_customer\"}` on the first request, then switch to `{\"type\": \"auto\"}` for subsequent requests."}, "a": "D", "sk": ["very first action, then choose freely"], "ak": ["\"name\": \"lookup_customer\"}", "on the first request", "{\"type\": \"auto\"}"], "note": "Lần đầu ép tool cụ thể, sau đó auto.", "ex": "Nguồn chủ đề: ép tool đầu tiên rồi chuyển sang auto (Tool use docs). `{\"type\": \"tool\", \"name\": ...}` buộc model gọi đúng tool đó ở lượt đầu, đảm bảo thứ tự mang tính xác định thay vì dựa vào prompt. Sau đó chuyển `auto` để model tự chọn tool hoặc trả lời bằng text.\n\nTại sao các phương án khác chưa tối ưu\nA `any` buộc gọi một tool nào đó ở mọi lượt nhưng không đảm bảo là `lookup_customer` và ngăn model trả lời bằng text. B `none` cấm gọi tool ở lượt đầu, ngược với yêu cầu. C bỏ các tool khác khiến agent không thể xử lý phần còn lại của cuộc hội thoại.", "set": "Set 5", "topic": 3}, {"n": 212, "cat": "T", "stem": "When you force a specific tool with `tool_choice: {\"type\": \"tool\", \"name\": \"extract_invoice\"}`, what happens to the text the model would normally write before the tool call?", "opts": {"A": "The model still writes a full chain-of-thought explanation before the tool_use block.", "B": "The request fails unless you also set `stream: true`.", "C": "The response goes straight to the tool_use block; the model does not emit natural-language text before it, even if asked to.", "D": "The model writes text first and calls the tool only in the next turn."}, "a": "C", "sk": ["what happens to the text the model would normally write"], "ak": ["goes straight to the tool_use block"], "note": "Bẫy kiến thức: ép tool thì model KHÔNG viết text trước tool_use, kể cả khi được yêu cầu.", "ex": "Nguồn chủ đề: ảnh hưởng của `tool_choice` cưỡng chế lên phần text mở đầu (Tool use docs). Khi dùng `any` hoặc `tool`, API prefill lượt assistant để buộc gọi tool, nên model không tạo text hoặc chain-of-thought trước tool_use block. Nếu cần lý giải kèm theo, dùng `auto` với hướng dẫn rõ trong prompt, hoặc thêm một trường lý giải vào schema của tool.\n\nTại sao các phương án khác chưa tối ưu\nA\nsai với hành vi đã mô tả trong docs.\nB\nstreaming không liên quan đến `tool_choice`.\nD\ntool được gọi ngay trong cùng response, không đợi lượt sau.", "set": "Set 5", "topic": 3}, {"n": 213, "cat": "E", "stem": "Your repository's `.mcp.json` registers a project MCP server that needs an API token. The file must be committed so the whole team gets the server, but the token must never enter version control. What is the correct approach?", "opts": {"A": "Reference the token with environment-variable expansion, e.g. `\"Authorization\": \"Bearer ${API_TOKEN}\"`, and have each developer set `API_TOKEN` locally.", "B": "Commit the token in `.mcp.json` and make the repository private.", "C": "Keep `.mcp.json` out of git and email the file to each new developer.", "D": "Hard-code the token into the MCP server's source code instead of the config file."}, "a": "A", "sk": ["token must never enter version control"], "ak": ["environment-variable expansion", "${API_TOKEN}"], "note": "Bí mật trong .mcp.json → dùng biến môi trường ${...}.", "ex": "Nguồn chủ đề: chia sẻ cấu hình MCP qua version control mà không lộ secret (Claude Code MCP docs). `.mcp.json` hỗ trợ mở rộng biến môi trường `${VAR}` (và `${VAR:-default}`) trong command, args, env, url và headers. File cấu hình được commit chung, còn giá trị bí mật nằm trong môi trường của từng người.\n\nTại sao các phương án khác chưa tối ưu\nB\nrepo private vẫn để secret trong lịch sử git, ai có quyền đọc repo đều thấy.\nC\nphá vỡ mục đích chia sẻ cấu hình và dễ lệch phiên bản.\nD\nchuyển secret vào source code còn tệ hơn, vẫn bị commit.", "set": "Set 5", "topic": 1}, {"n": 214, "cat": "E", "stem": "A CI job runs `claude -p` to review pull requests. For one pipeline you want Claude to be able to read and edit files but never run `Bash`, regardless of what the project settings allow. Which is the most direct, reliable control?", "opts": {"A": "Add \"Never use Bash\" to CLAUDE.md.", "B": "Pass `--disallowedTools \"Bash\"` on the command line for that job.", "C": "Put a PostToolUse hook that logs Bash usage after it happens.", "D": "Lower the model's temperature so it prefers safer tools."}, "a": "B", "sk": ["never run `Bash`"], "ak": ["--disallowedTools \"Bash\""], "note": "Chặn tool trực tiếp → --disallowedTools.", "ex": "Nguồn chủ đề: loại tool khỏi tập công cụ bằng disallowed tools (Claude Code CLI reference). `--disallowedTools` loại tool khỏi những gì Claude có thể dùng trong lần chạy đó. Đây là kiểm soát mang tính xác định ở tầng cấu hình, áp dụng riêng cho pipeline mà không cần sửa settings chung.\n\nTại sao các phương án khác chưa tối ưu\nA\ninstruction trong CLAUDE.md chỉ mang tính hướng dẫn, không đảm bảo.\nC\nPostToolUse chạy sau khi lệnh đã thực thi, quá muộn để chặn.\nD\ntemperature không kiểm soát quyền truy cập tool.", "set": "Set 5", "topic": 1}, {"n": 215, "cat": "E", "stem": "A CI script runs `claude -p \"...\" --output-format json` and must record how much each run cost and pass Claude's final answer to the next step. What should the script do?", "opts": {"A": "Parse the JSON result object and read its fields, such as the final `result` text and the run's cost (`total_cost_usd`).", "B": "Ask Claude in the prompt to print its own cost estimate at the end of the answer.", "C": "Scrape the human-readable terminal output with regular expressions.", "D": "Call the billing console API after every run to compute the cost."}, "a": "A", "sk": ["--output-format json"], "ak": ["Parse the JSON result object", "total_cost_usd"], "note": "Đã có JSON output → đọc trường result và total_cost_usd.", "ex": "Nguồn chủ đề: đọc kết quả và chi phí từ output JSON của CLI (Claude Code headless docs). Với `--output-format json`, chế độ non-interactive trả về một object JSON có câu trả lời cuối (`result`), session ID, số lượt và thông tin chi phí như `total_cost_usd`. Script chỉ cần parse JSON, ổn định hơn nhiều so với đọc text.\n\nTại sao các phương án khác chưa tối ưu\nB\nmodel không biết chính xác chi phí của chính nó, con số tự báo không đáng tin.\nC\noutput dạng text không có cấu trúc ổn định, regex dễ vỡ khi format thay đổi.\nD\nthêm phụ thuộc ngoài và độ trễ trong khi dữ liệu đã có sẵn trong output.", "set": "Set 5", "topic": 1}, {"n": 216, "cat": "T", "stem": "Your support agent must only ever call `refund_order` with the customer ID that was verified earlier in the session, even if the model passes a different ID. You want to correct the value automatically rather than block the call. Which Claude Code / Agent SDK mechanism fits best?", "opts": {"A": "A Stop hook that reviews the transcript after the session ends.", "B": "A system-prompt reminder repeated before every turn.", "C": "A PreToolUse hook that returns an updated tool input replacing the customer ID with the verified one before the tool runs.", "D": "A PostToolUse hook that reverses the refund if the ID was wrong."}, "a": "C", "sk": ["correct the value automatically rather than block the call"], "ak": ["PreToolUse hook that returns an updated tool input"], "note": "Bẫy: hook thường dùng để CHẶN; ở đây PreToolUse cũng có thể SỬA input trước khi chạy.", "ex": "Nguồn chủ đề: hook sửa tool input để ép dùng customer ID đã xác minh (Hooks docs). PreToolUse chạy trước khi tool thực thi và có thể allow, deny, hoặc trả `updatedInput` để thay đổi tham số. Đây là cách xác định để áp quy tắc nghiệp vụ, thay cho việc tin vào prompt.\n\nTại sao các phương án khác chưa tối ưu\nA\nStop hook chạy khi kết thúc, refund sai đã xảy ra.\nB\nprompt chỉ mang tính xác suất, không đảm bảo.\nD\nPostToolUse chạy sau khi hoàn tiền; đảo ngược giao dịch tài chính phức tạp và rủi ro hơn nhiều so với chặn từ đầu.", "set": "Set 5", "topic": 1}, {"n": 217, "cat": "E", "stem": "A developer is about to build a complex feature with many unknowns: edge cases, UX trade-offs, and integration constraints that they haven't thought through. What is an effective way to start with Claude Code before any code is written?", "opts": {"A": "Ask Claude to interview them with probing questions about requirements and edge cases, then write the agreed spec to a file.", "B": "Tell Claude to implement the feature immediately and fix problems afterwards.", "C": "Paste the entire codebase into the first prompt so Claude can infer the requirements.", "D": "Enable auto-accept edits so Claude can explore solutions quickly."}, "a": "A", "sk": ["many unknowns"], "ak": ["interview them with probing questions"], "note": "Nhiều ẩn số → để Claude phỏng vấn, rồi ghi spec ra file.", "ex": "Nguồn chủ đề: để Claude phỏng vấn người dùng nhằm làm rõ thiết kế (Claude Code best practices). Với tính năng lớn và mơ hồ, để Claude hỏi lại (cách triển khai, edge case, trade-off) giúp lộ ra những điều người dùng chưa cân nhắc. Spec đã thống nhất được ghi ra file, rồi có thể bắt đầu session mới sạch context để triển khai.\n\nTại sao các phương án khác chưa tối ưu\nB\ntriển khai ngay khi chưa rõ yêu cầu dẫn đến làm lại nhiều.\nC\nnhồi toàn bộ codebase lãng phí context và không cung cấp được yêu cầu nằm trong đầu người dùng.\nD\nauto-accept tăng tốc độ sửa file nhưng không giải quyết việc yêu cầu chưa rõ.", "set": "Set 5", "topic": 1}, {"n": 218, "cat": "E", "stem": "You send the same 40,000-token product manual as context on thousands of requests, each followed by a different customer question. You add a `cache_control` breakpoint after the manual, but cache hits are near zero. Inspecting the requests, you see the system prompt begins with the current timestamp. What is the fix?", "opts": {"A": "Lower `max_tokens` so the cached portion fits.", "B": "Move the variable timestamp after the cache breakpoint (or remove it) so the cached prefix is byte-identical across requests.", "C": "Add a second `cache_control` breakpoint after each question.", "D": "Switch to the Message Batches API, which caches automatically."}, "a": "B", "sk": ["system prompt begins with the current timestamp"], "ak": ["Move the variable timestamp after the cache breakpoint"], "note": "Cache cần prefix giống hệt byte → bỏ timestamp khỏi phần đầu.", "ex": "Nguồn chủ đề: prompt caching (Prompt caching docs). Cache khớp theo prefix: toàn bộ nội dung (tools, system, messages) trước breakpoint phải giống hệt nhau giữa các request. Một timestamp thay đổi ở đầu system prompt làm prefix khác nhau mỗi lần nên không bao giờ hit. Đưa phần thay đổi ra sau breakpoint để phần tĩnh được cache.\n\nTại sao các phương án khác chưa tối ưu\nA `max_tokens` giới hạn đầu ra, không ảnh hưởng tới việc khớp cache đầu vào.\n\nC\nbreakpoint sau câu hỏi cache nội dung không bao giờ lặp lại, và prefix vẫn khác do timestamp.\nD\nBatches API giảm chi phí cho xử lý bất đồng bộ nhưng không sửa đ
