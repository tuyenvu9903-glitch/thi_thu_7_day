ược prefix không ổn định.", "set": "Set 5", "topic": 3}, {"n": 219, "cat": "E", "stem": "Your agent uses extended thinking together with tools. After executing a tool, you send back only the tool_result and drop the assistant's previous content blocks to save tokens. Requests start failing or reasoning degrades. What is required?", "opts": {"A": "Disable extended thinking whenever tools are present.", "B": "Set `budget_tokens` higher than `max_tokens`.", "C": "Summarize the thinking yourself and send it as a user message.", "D": "Pass the assistant's thinking blocks back unchanged, together with the tool_use block, when you return the tool_result."}, "a": "D", "sk": ["drop the assistant's previous content blocks"], "ak": ["Pass the assistant's thinking blocks back unchanged"], "note": "Extended thinking + tool → phải gửi lại nguyên thinking block.", "ex": "Nguồn chủ đề: extended thinking kết hợp tool use (Extended thinking docs). Khi dùng tool với extended thinking, phải gửi lại nguyên vẹn các thinking block của lượt assistant cuối (kèm tool_use) trong lần gọi tiếp theo để model giữ được mạch suy luận. Thinking block có chữ ký nên không được sửa.\n\nTại sao các phương án khác chưa tối ưu\nA\ntắt thinking làm mất lợi ích suy luận mà không cần thiết. B `budget_tokens` phải nhỏ hơn `max_tokens`, không phải lớn hơn.\nC\nbản tóm tắt tự viết không thay thế được thinking block gốc có chữ ký.", "set": "Set 5", "topic": 3}, {"n": 220, "cat": "E", "stem": "A contract-review prompt contains three long documents plus instructions, and Claude sometimes confuses which clause came from which document. What prompt-structuring change most directly helps?", "opts": {"A": "Wrap each document in its own descriptive XML tags (e.g. `<contract_a>…<\/contract_a>`) and refer to those tags in the instructions.", "B": "Concatenate the documents without separators to save tokens.", "C": "Put the instructions in the middle, between the second and third documents.", "D": "Raise the temperature so Claude explores alternative readings."}, "a": "A", "sk": ["confuses which clause came from which document"], "ak": ["Wrap each document in its own descriptive XML tags"], "note": "Nhiều tài liệu dễ lẫn → mỗi tài liệu một thẻ XML.", "ex": "Nguồn chủ đề: dùng XML tag để cấu trúc prompt (Prompt engineering docs). Tag mô tả rõ ràng tách bạch từng tài liệu, giúp Claude phân biệt nguồn và cho phép instruction tham chiếu chính xác (\"trích điều khoản từ `<contract_b>`\"). Với tài liệu dài, nên đặt tài liệu lên đầu và câu hỏi/instruction ở cuối.\n\nTại sao các phương án khác chưa tối ưu\nB\nbỏ dấu phân cách làm tăng nhầm lẫn.\nC\nđặt instruction xen giữa tài liệu làm cấu trúc khó theo dõi hơn.\nD\ntemperature cao làm kết quả kém nhất quán, không giúp phân biệt nguồn.", "set": "Set 5", "topic": 7}, {"n": 221, "cat": "E", "stem": "A long Claude Code session has accumulated a lot of exploration output. You want to keep working on the same task with its key decisions preserved, but free up context. Which command fits best?", "opts": {"A": "`/clear`, because it keeps a summary of the conversation.", "B": "Start a new terminal and re-explain the task from memory.", "C": "`/compact`, optionally with instructions about what to keep, which replaces the history with a summary.", "D": "Delete CLAUDE.md so it no longer consumes context."}, "a": "C", "sk": ["key decisions preserved, but free up context"], "ak": ["`/compact`"], "note": "Giữ ý chính + giải phóng context → /compact (/clear xoá sạch).", "ex": "Nguồn chủ đề: quản lý context trong session dài (Claude Code docs). `/compact` tóm tắt lịch sử hội thoại để giải phóng context mà vẫn giữ các quyết định quan trọng; có thể thêm hướng dẫn, ví dụ `/compact giữ lại danh sách file đã sửa và các test đang fail`. `/clear` xoá hẳn lịch sử, phù hợp khi chuyển sang tác vụ không liên quan.\n\nTại sao các phương án khác chưa tối ưu\nA `/clear` không giữ tóm tắt nào.\n\nB\ngiải thích lại từ trí nhớ dễ thiếu sót và tốn công.\nD\nCLAUDE.md chứa quy ước dự án cần thiết; xoá nó không giải quyết lịch sử hội thoại phình to.", "set": "Set 5", "topic": 1}, {"n": 222, "cat": "E", "stem": "A developer wants personal Claude Code instructions (their local sandbox URL and preferred test command) that apply only to them in this project and are never committed. Where should these go?", "opts": {"A": "The project's root `CLAUDE.md`.", "B": "A `CLAUDE.local.md` file in the project root, which is meant for personal project-specific notes and kept out of git.", "C": "The project's `.mcp.json`.", "D": "A comment at the top of the main source file."}, "a": "B", "sk": ["apply only to them in this project and are never committed"], "ak": ["`CLAUDE.local.md`"], "note": "Cá nhân, theo project, không commit → CLAUDE.local.md.", "ex": "Nguồn chủ đề: phân cấp file memory của Claude Code (Memory docs). `CLAUDE.md` ở gốc dự án được commit để chia sẻ quy ước nhóm. `CLAUDE.local.md` dành cho ghi chú cá nhân theo từng dự án và được để ngoài version control. Ghi chú cá nhân dùng cho mọi dự án thì đặt ở `~/.claude/CLAUDE.md`.\n\nTại sao các phương án khác chưa tối ưu\nA\nfile chung được commit, sẽ lộ thiết lập cá nhân cho cả nhóm. C `.mcp.json` dùng để cấu hình MCP server, không phải instruction.\nD\ncomment trong source không phải cơ chế memory và sẽ bị commit.", "set": "Set 5", "topic": 1}, {"n": 223, "cat": "E", "stem": "An autonomous research agent occasionally gets stuck calling the same search tool over and over, running up cost. Which safeguard most directly bounds this in production?", "opts": {"A": "Set `max_tokens` to the model maximum on every call.", "B": "Remove the system prompt to reduce input tokens.", "C": "Disable tool use after the first call.", "D": "Enforce a maximum number of turns/iterations with an explicit stopping condition, and surface the stop reason to the caller."}, "a": "D", "sk": ["calling the same search tool over and over"], "ak": ["maximum number of turns/iterations"], "note": "Vòng lặp vô hạn → giới hạn số lượt + điều kiện dừng.", "ex": "Nguồn chủ đề: giới hạn vòng lặp agent (Agent SDK `max_turns`, \"Building effective agents\"). Giới hạn số lượt cùng điều kiện dừng rõ ràng là cách xác định để chặn vòng lặp chạy mãi và kiểm soát chi phí. Báo lý do dừng cho bên gọi giúp phân biệt \"hoàn thành\" với \"chạm giới hạn\" để xử lý tiếp (escalate, thử lại với hướng khác).\n\nTại sao các phương án khác chưa tối ưu\nA\ntăng `max_tokens` không giới hạn số lần gọi tool, thậm chí làm mỗi lượt đắt hơn.\nB\nbỏ system prompt làm mất hướng dẫn và không chặn được vòng lặp.\nC\ntắt tool sau lần đầu phá vỡ các tác vụ hợp lệ cần nhiều lần tìm kiếm.", "set": "Set 5", "topic": 4}, {"n": 224, "cat": "T", "stem": "You are integrating Claude Code into your CI/CD pipeline for automated code reviews. Your review jobs take 18 seconds to initialize before Claude begins analyzing code. Profiling shows the delay comes from automatically discovering hooks, MCP servers, plugins, skills, and multiple nested CLAUDE.md files throughout the monorepo. You need to reduce startup time while ensuring reviews still enforce the coding standards documented in the root-level CLAUDE.md file. What is the most effective approach?", "opts": {"A": "Replace the default prompt using --system-prompt-file ./CLAUDE.md, which bypasses default prompt assembly and loads only the project rules.", "B": "Run in --bare mode and pass --append-system-prompt-file ./CLAUDE.md to load the required project standards explicitly while skipping automatic discovery.", "C": "Run in --bare mode and repeat all review criteria directly in the -p prompt for every invocation.", "D": "Keep the default initialization and add --exclude-dynamic-system-prompt-sections to improve prompt-cache reuse across CI runners."}, "a": "B", "sk": ["18 seconds to initialize", "root-level CLAUDE.md"], "ak": ["--bare mode", "--append-system-prompt-file ./CLAUDE.md"], "note": "Bẫy: {C} cũng dùng --bare nhưng lặp tiêu chí mỗi lần; {A} --system-prompt-file ghi đè prompt mặc định. --bare + append file.", "ex": "Nguồn: CertyIQ CCA-F PDF, câu 149 (chỉ một nguồn). `--bare` bỏ qua bước tự động dò hooks, MCP servers, plugins, skills và các file CLAUDE.md lồng nhau, tức đúng nguyên nhân gây chậm 18 giây. `--append-system-prompt-file ./CLAUDE.md` nạp lại đúng bộ quy chuẩn cần thiết, đồng thời vẫn giữ system prompt mặc định của Claude Code.\n\nTại sao các phương án khác chưa tối ưu\nA `--system-prompt-file` thay thế toàn bộ system prompt mặc định, làm mất các hướng dẫn nền của Claude Code.\n\nC\nlặp lại tiêu chí trong từng prompt `-p` khó bảo trì và dễ lệch so với CLAUDE.md.\nD\ntối ưu cache không loại bỏ được bước dò tìm gây chậm.", "set": "Set 6", "topic": 1}, {"n": 225, "cat": "E", "stem": "Your CI pipeline includes a release-notes generation step that classifies and summarizes approximately 200 commits at the end of each weekly release cycle. Each commit is currently sent as a separate Messages API request using a Sonnet-tier Claude model. The release notes are not needed until the following morning, giving about 12 hours of acceptable latency. Your team must reduce the per-token API cost while keeping the same model, prompts, and output quality. Which approach satisfies all these constraints?", "opts": {"A": "Issue the 200 Messages API requests concurrently because parallel execution reduces the per-token price.", "B": "Submit the 200 requests through the Message Batches API with unique custom_id values and retrieve the results after the batch finishes.", "C": "Concatenate all 200 commit messages into one Messages API request because reducing the number of requests always reduces token costs.", "D": "Replace the Sonnet-tier model with a Haiku-tier model to obtain a lower per-token price."}, "a": "B", "sk": ["12 hours of acceptable latency", "keeping the same model"], "ak": ["Message Batches API"], "note": "Không gấp + giữ model → Batch API (giảm 50%).", "ex": "Nguồn: CertyIQ CCA-F PDF, câu 152 (câu 161 là bản trùng; chỉ một nguồn). Message Batches API giảm 50% giá token cho các request độc lập không cần kết quả ngay, phần lớn batch xong trong vòng 24 giờ, thường nhanh hơn nhiều. Với 12 giờ chờ chấp nhận được, đây là cách duy nhất giữ nguyên model, prompt và chất lượng. `custom_id` dùng để ghép kết quả với từng commit.\n\nTại sao các phương án khác chưa tối ưu\nA\nchạy song song chỉ giảm thời gian, không giảm giá mỗi token.\nC\ngộp 200 commit vào một request không giảm số token và dễ làm giảm chất lượng.\nD\nđổi sang Haiku vi phạm yêu cầu giữ nguyên model.", "set": "Set 6", "topic": 5}, {"n": 226, "cat": "T", "stem": "Your structured data extraction system validates output with JSON schemas. Testing reveals that when source documents are missing certain specifications, the model fabricates plausible-sounding values to satisfy the schema's required fields. For example, a document mentioning only dimensions receives a fabricated \"weight: 2.3 kg\" in the extraction output. What schema design change most effectively addresses this hallucination behavior?", "opts": {"A": "Add explicit instructions to the prompt stating \"only extract information explicitly stated in the document; use placeholder text for missing values.\"", "B": "Change fields that may not exist in source documents from required to optional, allowing the model to omit them.", "C": "Add a \"confidence\" field alongside each specification where the model self-reports its certainty, then filter out low-confidence extractions.", "D": "Implement semantic validation that verifies each extracted value appears in or can be inferred from the source document text."}, "a": "B", "sk": ["fabricates plausible-sounding values to satisfy the schema's required fields"], "ak": ["from required to optional"], "note": "Bẫy: khác câu 20 (ở đó trường đã nullable → thêm hướng dẫn null). Ở đây nguyên nhân là trường bắt buộc → chuyển sang optional.", "ex": "Nguồn: CertyIQ CCA-F PDF, câu 154 (chỉ một nguồn). Trường `required` buộc model phải điền giá trị kể cả khi tài liệu không có, đó là áp lực gây bịa dữ liệu. Chuyển các trường có thể vắng mặt sang optional (hoặc cho phép `null`) loại bỏ áp lực này ngay ở thiết kế schema, đúng như câu hỏi yêu cầu.\n\nTại sao các phương án khác chưa tối ưu\nA\nchỉ là hướng dẫn, schema vẫn bắt buộc điền, và placeholder text làm bẩn dữ liệu downstream.\nC\nđộ tin cậy do model tự báo không đáng tin cậy.\nD\nkiểm tra ngữ nghĩa chỉ phát hiện lỗi sau khi đã bịa, không sửa nguyên nhân ở schema, và tốn thêm chi phí.", "set": "Set 6", "topic": 5}, {"n": 227, "cat": "E", "stem": "Your extraction pipeline occasionally receives responses that cannot be parsed as valid JSON, causing downstream processing failures. The current implementation prompts Claude to return JSON in the response text and then parses it. What is the most reliable approach to ensure Claude returns valid, schema-compliant structured data?", "opts": {"A": "Add explicit formatting instructions to the prompt with JSON examples, emphasizing that Claude must return only valid JSON with no surrounding text.", "B": "Use regular expressions to locate and extract JSON from the response text, handling cases where Claude includes explanatory text around the JSON block.", "C": "Define a tool with a JSON schema specifying the expected structure, using tool use to constrain Claude's output to schema-compliant JSON.", "D": "Implement a retry loop that catches JSON parsing errors and re-prompts Claude with the error details, asking it to correct the malformed output."}, "a": "C", "sk": ["cannot be parsed as valid JSON"], "ak": ["Define a tool with a JSON schema"], "note": "JSON hỏng → dùng tool use với schema.", "ex": "Nguồn: CertyIQ CCA-F PDF, câu 155 (chỉ một nguồn). Khai báo một tool có `input_schema` (kèm `tool_choice` ép gọi tool đó) khiến output trả về dưới dạng tool_use input có cấu trúc, đã được parse sẵn theo schema. Đây là cách dựa trên cơ chế API, không phụ thuộc việc model nhớ định dạng.\n\nTại sao các phương án khác chưa tối ưu\nA\nhướng dẫn trong prompt cải thiện nhưng không đảm bảo.\nB\nregex dễ vỡ và không kiểm tra tuân thủ schema.\nD\nretry chỉ chữa triệu chứng, tăng độ trễ và chi phí cho mỗi lần lỗi.", "set": "Set 6", "topic": 5}, {"n": 228, "cat": "T", "stem": "Your organization has enabled Claude's managed Code Review through the Claude GitHub App, and reviews run automatically on every pull request. Reviews average 18 findings per pull request. Developer feedback reveals three categories of unwanted noise: (1) style and formatting issues already enforced by your CI linter, (2) findings on automatically generated template code under src/gen/*, and (3) rendering-helper patterns that are intentional project conventions but are flagged because they resemble common anti-patterns. Only about four findings per pull request are genuine logic bugs. What is the most effective way to reduce this noise while preserving the detection of real issues?", "opts": {"A": "Create a REVIEW.md file at the repository root containing skip rules for CI-enforced checks and generated files, together with a verification requirement that rendering-related findings cite a specific line demonstrating incorrect behavior.", "B": "Configure separate GitHub Actions workflow files for each code area: one for generated code with findings suppressed, one for rendering code with custom instructions, and one general workflow for everything else.", "C": "Add custom review instructions to a GitHub Actions workflow file, using the action's prompt parameter to suppress duplicate lint findings, ignore generated template code, and impose stricter evidence requirements on rendering-related issues.", "D": "Add detailed explanations to the project's CLAUDE.md describing intentional patterns, stating that CI handles linting, and identifying src/gen/ as automatically generated code."}, "a": "A", "sk": ["managed Code Review through the Claude GitHub App"], "ak": ["REVIEW.md file"], "note": "Bẫy: {D} CLAUDE.md và {C} workflow file prompt>`, do người dùng chủ động gọi và có thể truyền tham số sau tên lệnh. Ba primitive của MCP có cách dùng khác nhau: tools do model gọi, resources được tham chiếu bằng `@`, prompts là template do người dùng kích hoạt.\n\nTại sao các phương án khác chưa tối ưu\nA\nprompts không tự chèn vào mọi hội thoại.\nB\nđó là hành vi của MCP tools, không phải prompts.\nC\nđó là cách dùng MCP resources.", "set": "Set 6", "topic": 1}, {"n": 230, "cat": "E", "stem": "During testing, you find that when a customer says \"I need a refund for my recent purchase,\" the agent calls process_refund immediately, but populates the required order_id parameter with a plausible-looking but fabricated value instead of first calling lookup_order to retrieve the actual order ID. The refund call fails because the fabricated ID doesn't exist. Which change directly addresses the root cause of the agent fabricating the order_id value?", "opts": {"A": "Switch tool_choice from \"auto\" to \"any\" to force the agent to make a tool call on every turn.", "B": "Pre-parse incoming customer messages to extract any order IDs mentioned, and inject them into the conversation context before passing to Claude.", "C": "Update the process_refund tool description to explicitly state that order_id must be obtained from a prior lookup_order call and must never be assumed or invented.", "D": "Add server-side validation that checks whether the order_id exists in your database before executing, returning an error to the agent if not."}, "a": "C", "sk": ["fabricated value instead of first calling lookup_order"], "ak": ["order_id must be obtained from a prior lookup_order call"], "note": "Model bịa tham số → ghi rõ nguồn của tham số trong tool description.", "ex": "Nguồn: CertyIQ CCA-F PDF, câu 173 (chỉ một nguồn). Model chọn và điền tham số tool dựa trên description. Description hiện không nói `order_id` phải lấy từ đâu, nên model tự điền một giá trị trông hợp lý. Ghi rõ phụ thuộc \"phải lấy từ kết quả `lookup_order`,  "Còn khoảng trống → coordinator đánh giá và giao lại có mục tiêu.", "Giữ trích dẫn → output có cấu trúc claim–nguồn, có ngày. Bất định → tách phần đã xác nhận và phần còn tranh cãi.", "Mỗi agent 4–5 tool liên quan, không đưa hết 18 tool."]}, {"id": 5, "title": "Trích xuất dữ liệu có cấu trúc & Batch", "rules": ["JSON phải đúng schema → <b>tool use với input schema<\/b>.", "Không nhất quán định dạng / nguồn đa dạng → <b>few-shot<\/b>. Temperature 0 không sửa được.", "Thông tin không có trong nguồn → hướng dẫn trả <code>null<\/code> (trường nullable) / chuyển trường sang optional (nếu đang required). Mảng không có gì → mảng rỗng.", "Enum luôn có giá trị mới → thêm <code>\"other\"<\/code> + trường chi tiết.", "Tổng không khớp → <code>calculated_total<\/code> + <code>stated_total<\/code>, lệch thì gắn cờ người duyệt.", "Lỗi validation → gửi lại kèm lỗi cụ thể để model sửa; thông tin không có trong input thì retry vô ích.", "Batch API: giảm 50%, tối đa 24h. Gấp → real-time; không gấp → batch. Chỉ gửi lại phần lỗi.", "Tự động hoá theo confidence → kiểm tra theo từng loại tài liệu/trường, lấy mẫu phân tầng để đo lỗi."]}, {"id": 6, "title": "Agent chăm sóc khách hàng & escalation", "rules": ["Khách đòi gặp người và chưa có gì để giải quyết ngay → <b>chuyển ngay<\/b>. Vấn đề giải quyết được ngay → ghi nhận, đề nghị xử lý hoặc chuyển.", "3 trigger escalation: khách yêu cầu, ngoại lệ chính sách, không tiến triển. Không dùng sentiment.", "Chuyển người → <b>handoff có cấu trúc<\/b> (ID khách, nguyên nhân, số tiền, đề xuất).", "Quy định bắt buộc (hoàn tiền > $500) → <b>hook<\/b> chặn, không dựa vào prompt.", "Tool lỗi giữa chừng → làm hết phần làm được, nói rõ phần lỗi, đề nghị chuyển/thử lại.", "Khách quay lại sau vài giờ → phiên mới + tóm tắt có cấu trúc + gọi tool lấy dữ liệu mới.", "Bảo đảm mọi phiên kết thúc đúng → code ở tầng điều phối kiểm tra sau khi loop dừng."]}, {"id": 7, "title": "Hội thoại & quản lý context", "rules": ["API <b>stateless<\/b>: quên điều vừa nói → khô  const ord=qo[l.id], n=ord[i], q=byN[n], ol=oo[n], my=ans[n], dn=my!=null;
 const nl=k=>LET[ol.indexOf(k)];
 let h=`<div class="crumb">Chương ${l.ch.id} · ${esc(l.ch.title)}</div><h2>${l.ic} ${esc(l.name)}</h2><p class="sub">Câu ${i+1}/${ord.length}</p><div class="dots">`;
 ord.forEach((m,j)=>{const a=ans[m];h+=`<button class="dot ${j==i?'cur':''} ${a==null?'':a==byN[m].a?'ok':'bad'}" data-go='{"v":"q","l":"${l.id}","i":${j}}'>${j+1}</button>`});
 h+=`</div><div class="card ${(!hl||(q.cat=='T'&&!dn))?'hide-k':''}"><div class="qmeta"><span class="badge ${q.cat}">${q.cat=='T'?'⚠ Bẫy':'✓ Dễ'}</span><span>Câu gốc #${q.n}</span></div><div class="stem">${mark(q.stem,q.sk)}</div>`;
 ol.forEach((k,j)=>{const isA=k==q.a;let c='opt';if(dn&&isA)c+=' ok';if(my==k&&!isA)c+=' bad';
  h+=`<button class="${c}" data-k="${k}" ${dn?'disabled':''}><span class="L">${LET[j]}</span><span>${isA?mark(q.opts[k],q.ak):esc(q.opts[k])}</span>${dn?'<span class="og">gốc '+k+'</span>':''}</button>`});
 if(dn){const note=q.note.replace(/\{([A-D])\}/g,(m,k)=>nl(k)?'<b>'+nl(k)+'</b>':k);
  h+=my==q.a?'<div class="res ok">✓ Chính xác!</div>':`<div class="res bad">✗ Chưa đúng — đáp án là ${nl(q.a)}</div>`;
  h+=`<div class="note">💡 ${note}</div><details><summary>Giải thích chi tiết (chữ cái theo thứ tự gốc — xem nhãn "gốc" ở mỗi đáp án)</summary><pre>${esc(q.ex)}</pre></details>`}
 h+=`</div><div class="nav"><button class="btn" data-go='{"v":"q","l":"${l.id}","i":${i-1}}' ${i==0?'disabled':''}>← Câu trước</button>`;
 h+=i<ord.length-1?`<button class="btn pri" data-go='{"v":"q","l":"${l.id}","i":${i+1}}'>Câu tiếp →</button>`:`<button class="btn pri" data-go='{"v":"sum","l":"${l.id}"}'>Xem kết quả bài →</button>`;
 return h+`</div><div class="hint">Phím tắt: 1–4 hoặc A–D để chọn · ← → để chuyển câu</div>`}
function summary(l){
 const ns=qo[l.id], d=done(ns), r=right(ns), wrong=ns.filter(n=>ans[n]!=null&&ans[n]!=byN[n].a);
 const idx=L.indexOf(l), nx=L[idx+1];
 const nxGo=nx?(nx.ch!=l.ch?`{"v":"rules","c":${nx.ch.id}}`:`{"v":"q","l":"${nx.id}","i":0}`):null;
 let h=`<div class="crumb">Chương ${l.ch.id} · ${esc(l.ch.title)}</div><h2>Kết quả: ${esc(l.name)}</h2><div class="card"><div class="big">${r}/${ns.length}</div><div class="ptxt">Đã làm ${d}/${ns.length} câu · sai ${wrong.length}</div>`;
 if(wrong.length)h+=`<ul class="wl">${wrong.map(n=>`<li data-go='{"v":"q","l":"${l.id}","i":${ns.indexOf(n)}}'>✗ Câu gốc #${n}: ${esc(byN[n].stem.slice(0,90))}…</li>`).join('')}</ul>`;
 h+=`</div><div class="nav"><button class="btn" id="retry" ${wrong.length||d<ns.length?'':'disabled'}>↺ Làm lại câu sai</button>`;
 h+=nxGo?`<button class="btn pri" data-go='${nxGo}'>${nx.ch!=l.ch?'Chương tiếp theo':'Bài tiếp: '+esc(nx.name)} →</button>`:`<button class="btn pri" data-go='{"v":"home"}'>Hoàn thành khóa học 🎉</button>`;
 return h+'</div>'}
function render(){
 side();const v=document.getElementById('view');
 if(pos.v=='rules')v.innerHTML=rules(pos.c);
 else if(pos.v=='q'&&LB[pos.l])v.innerHTML=question(LB[pos.l],Math.max(0,Math.min(pos.i,LB[pos.l].ns.length-1)));
 else if(pos.v=='sum'&&LB[pos.l])v.innerHTML=summary(LB[pos.l]);
 else v.innerHTML=home();
 document.getElementById('hlBtn').style.opacity=hl?1:.5}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(JSON.parse(g.dataset.go));return}
 const o=e.target.closest('.opt');if(o&&!o.disabled&&pos.v=='q'){const n=qo[pos.l][pos.i];ans[n]=o.dataset.k;save();render();return}
 if(e.target.id=='retry'){const l=LB[pos.l];l.ns.forEach(n=>{if(ans[n]!=byN[n].a)delete ans[n]});qo[l.id]=shuffle(l.ns.filter(n=>ans[n]==null)).concat(l.ns.filter(n=>ans[n]!=null));l.ns.forEach(n=>oo[n]=shuffle(Object.keys(byN[n].opts)));go({v:'q',l:l.id,i:0})}
});
document.addEventListener('keydown',e=>{if(pos.v!='q'||e.target.tagName=='INPUT')return;const l=LB[pos.l];if(!l)return;
 const k=e.key.toUpperCase(), idx='1234'.indexOf(k)>=0?'1234'.indexOf(k):LET.indexOf(k);
 const n=qo[l.id][pos.i];
 if(idx>=0&&ans[n]==null){const key=oo[n][idx];if(key){ans[n]=key;save();render()}}
 else if(e.key=='ArrowRight'||e.key=='Enter'){go(pos.i<l.ns.length-1?{v:'q',l:l.id,i:pos.i+1}:{v:'sum',l:l.id})}
 else if(e.key=='ArrowLeft'&&pos.i>0)go({v:'q',l:l.id,i:pos.i-1})});
menuBtn.onclick=()=>document.body.classList.toggle('menu');scrim.onclick=()=>document.body.classList.remove('menu');
shuf.onclick=()=>{reshuffle();if(pos.v=='q')pos.i=0;render()};
hlBtn.onclick=()=>{hl=!hl;S.set('cc_hl',hl);render()};
reshuffle();render();
</script></body></html>
