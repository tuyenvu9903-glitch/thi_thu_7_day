arch agent to re-locate sources for claims in the final report.", "D": "Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator."}, "a": "B", "sk": ["metadata was lost during the summarization steps"], "ak": ["structured data separating content summaries from source metadata"], "note": "Bẫy: {A} (chèn trích dẫn inline) nghe được. Đáp án: dữ liệu có cấu trúc tách nội dung và metadata nguồn.", "ex": "Yêu cầu mỗi agent xuất structured data tách biệt content summary và source metadata (URL, tên tài liệu, số trang) — chuẩn hóa, bền vững, giúp report generator bóc tách và trích dẫn chính xác.\n\nTại sao các phương án khác chưa tối ưu\nA\nnhúng citation inline dễ bị LLM làm sai lệch/bỏ sót qua các bước tổng hợp.\nC\nreport generator gọi ngược web search agent tăng độ trễ, phức tạp không cần thiết.\nD\nbỏ qua tóm tắt, dùng raw data quá tải context window.", "set": "Set 1", "topic": 4}, {"n": 42, "cat": "E", "stem": "When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., \"Order not found\" or temporary database failures). What is the correct pattern for communicating these errors back to the agent?", "opts": {"A": "Return the error message in the tool result content with the isError flag set to true", "B": "Throw an exception from the tool handler so the agent framework can catch and log it", "C": "Log the error server-side and return an empty result to avoid confusing the model", "D": "Return a success response with a \"status\" field indicating the error type"}, "a": "A", "sk": ["communicating these errors"], "ak": ["isError flag set to true"], "note": "Lỗi MCP → trả trong tool result với isError: true.", "ex": "Chuẩn MCP: khi tool lỗi, trả về tool result content kèm cờ isError: true. Giúp LLM nhận biết tường minh lần gọi thất bại, tự phục hồi/điều chỉnh tham số thay vì hiểu nhầm là dữ liệu thành công trống.\n\nTại sao các phương án khác chưa tối ưu\nB\nthrow exception có thể làm sập/ngắt luồng framework nếu không bọc lỗi đúng cách.\nC\nẩn lỗi trả kết quả trống làm model mù thông tin.\nD\nsuccess kèm status lỗi gây mâu thuẫn logic cho bộ phân tích của agent.", "set": "Set 1", "topic": 3}, {"n": 43, "cat": "E", "stem": "After investigating a billing dispute over 25+ turns, you've identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call escalate_to_human, and the human agent won't have access to your conversation transcript. What context should you pass to enable effective resolution?", "opts": {"A": "The complete conversation transcript with all tool results.", "B": "The customer's original complaint verbatim plus the tool result excerpts showing duplicate transactions.", "C": "Your diagnosis and the refund amount only.", "D": "A structured summary: customer ID, root cause, refund amount, and recommended action."}, "a": "D", "sk": ["won't have access to your conversation transcript"], "ak": ["structured summary"], "note": "Người tiếp nhận không có transcript → tóm tắt có cấu trúc (ID, nguyên nhân, số tiền, đề xuất).", "ex": "Bản tóm tắt có cấu trúc (customer ID, root cause, refund amount, recommended action) cung cấp ngay dữ liệu cốt lõi giúp con người nắm bắt nhanh, ra quyết định phê duyệt vượt hạn mức mà không quá tải dữ liệu thô.\n\nTại sao các phương án khác chưa tối ưu\nA\ntoàn bộ transcript 25+ turns vượt giới hạn/mất thời gian đọc, ngược mục đích chắt lọc.\nB\nthiếu chẩn đoán nguyên nhân gốc rễ và đề xuất hành động cụ thể.\nC\nquá sơ sài, thiếu customer ID và nguyên nhân chi tiết.", "set": "Set 1", "topic": 6}, {"n": 44, "cat": "T", "stem": "Your agent has called lookup_order multiple times while investigating a customer's return requests. Each response includes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority of the conversation's context. The customer mentions two more orders they want to discuss. What's the most effective approach before making additional lookups?", "opts": {"A": "Proceed with additional lookups without modifying the existing tool output context", "B": "Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues", "C": "Extract only return-relevant fields (items, purchase date, return window, status) from each existing order response, removing verbose details", "D": "Have the model generate a natural language summary of each order's key details, replacing structured responses with prose descriptions"}, "a": "C", "sk": ["40+ fields"], "ak": ["Extract only return-relevant fields"], "note": "Bẫy: {D} (tóm tắt thành văn xuôi) mất cấu trúc. Chỉ giữ các trường liên quan.", "ex": "Trích xuất và giữ lại đúng các trường liên quan đến đổi trả (items, purchase date, return window, status), loại bỏ chi tiết rườm rà — tiết kiệm context mà vẫn giữ độ chính xác định lượng cần thiết.\n\nTại sao các phương án khác chưa tối ưu\nA\ntiếp tục lookup mà không dọn context sẽ tràn context window.\nB\nvector database gây phức tạp hạ tầng không cần thiết cho hội thoại trực tiếp.\nD\nthay bằng prose description dễ mơ hồ, mất số liệu cụ thể khi cần đối chiếu điều kiện đổi trả.", "set": "Set 1", "topic": 6}, {"n": 45, "cat": "T", "stem": "A customer sends: \"This is frustrating. I've explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.\" The agent has not yet called any tools to investigate their account. What should the agent do?", "opts": {"A": "Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating.", "B": "Immediately call escalate_to_human with the conversation history.", "C": "Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request.", "D": "First call get_customer and lookup_order to gather account context, then escalate to a human agent."}, "a": "B", "sk": ["I want to talk to a real person NOW"], "ak": ["Immediately call escalate_to_human"], "note": "Bẫy cặp với câu 51. Khách đòi gặp người và chưa có gì để giải quyết ngay → chuyển ngay. (Câu 51: vấn đề giải quyết được ngay → đề nghị xử lý hoặc chuyển.)", "ex": "Khách hàng đã bày tỏ rõ tức giận và yêu cầu trực tiếp gặp người thật (\"NOW\") — nguyên tắc \"human-in-the-loop\" tốt nhất là gọi ngay escalate_to_human kèm lịch sử hội thoại. Gặng hỏi thêm hay tra cứu trước chỉ làm khách hàng thêm bực vì yêu cầu bị phớt lờ.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nC\nkéo dài tương tác/thuyết phục tiếp tục với AI khi khách đã kiên quyết đòi người thật làm tệ thêm trải nghiệm.\nD\ngọi tool thu thập thông tin trước là dư thừa, làm chậm chuyển giao.", "set": "Set 1", "topic": 6}, {"n": 46, "cat": "E", "stem": "You're implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation. Which approach will most reliably identify cases that genuinely require human intervention?", "opts": {"A": "Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls.", "B": "Instruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress.", "C": "Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer's stated issue, ensuring a reasonable attempt before involving a human.", "D": "Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold."}, "a": "B", "sk": ["genuinely require human intervention"], "ak": ["customer requests a human", "policy exceptions", "cannot make meaningful progress"], "note": "3 trigger chuẩn: khách yêu cầu, ngoại lệ chính sách, không tiến triển. Sentiment là bẫy.", "ex": "Bao quát 3 tình huống cốt lõi: khách chủ động yêu cầu, vấn đề vượt quyền hạn AI (cần policy exception), hoặc agent bế tắc không tiến triển. Kết hợp tiêu chí định tính này cho độ nhạy/chính xác cao nhất.\n\nTại sao các phương án khác chưa tối ưu\nA\nrules engine cứng nhắc không bao quát hết biến thể ngôn ngữ/tình huống.\nC\ncon số cố định \"3 lần thất bại\" quá máy móc, không phù hợp mọi trường hợp.\nD\nsentiment analysis dựa từ khóa dễ dương tính giả (khách bức xúc kể chuyện nhưng vấn đề tự giải quyết được).", "set": "Set 1", "topic": 6}, {"n": 47, "cat": "E", "stem": "Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval–beyond the agent's authorization level. How should the workflow handle this mid-process escalation?", "opts": {"A": "Compile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human.", "B": "Persist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID.", "C": "Call escalate_to_human passing only the customer's original message.", "D": "Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction."}, "a": "A", "sk": ["beyond the agent's authorization level"], "ak": ["structured handoff"], "note": "Chuyển người giữa chừng → handoff có cấu trúc.", "ex": "Biên soạn structured handoff (thông tin khách hàng, đơn hàng, vấn đề đã xác định) trước khi gọi escalate_to_human — giúp nhân viên nắm bối cảnh ngay, không phải hỏi lại từ đầu.\n\nTại sao các phương án khác chưa tối ưu\nB\nlưu toàn bộ history + chỉ truyền reference ID tăng phức tạp hạ tầng, bắt nhân viên tra cứu ngoài luồng.\nC\nchỉ tin nhắn gốc mất hết ngữ cảnh đã thu thập từ get_customer/lookup_order.\nD\ncố gọi process_refund vượt quyền hạn vi phạm quy tắc an toàn hệ thống.", "set": "Set 1", "topic": 6}, {"n": 48, "cat": "T", "stem": "During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to process the refund via process_refund, the tool returns a timeout error. The agent has enough information to explain the billing, confirm the refund eligibility, and verify refund eligibility, but cannot actually process the refund due to the backend failure. What approach best balances first-contact resolution with appropriate error handling?", "opts": {"A": "Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later", "B": "Escalate immediately to a human agent since the refund action cannot be completed", "C": "Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed", "D": "Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically"}, "a": "A", "sk": ["first-contact resolution"], "ak": ["acknowledge the system issue preventing immediate processing", "offer escalation or retry later"], "note": "Bẫy: {B} (chuyển ngay) bỏ mất phần đã giải quyết được. Làm hết phần làm được, nói rõ phần lỗi.", "ex": "Giải thích rõ tình trạng, xác nhận quyền lợi khách hàng, thông báo sự cố hệ thống tạm thời, đưa lựa chọn tiếp theo (chuyển giao/thử lại sau) — minh bạch, giữ trải nghiệm tốt thay vì bỏ mặc hoặc ép chờ mơ hồ.\n\nTại sao các phương án khác chưa tối ưu\nB\nescalate ngay không thông báo bối cảnh lãng phí năng lực tự động hóa khi agent đã có đủ thông tin xác thực.\nC\nauto-retry bắt khách chờ timeout gây trải nghiệm tồi.\nD\nxác nhận sai lệch đã xử lý xong trong khi backend báo lỗi là hành vi sai dữ liệu, mất uy tín.", "set": "Set 1", "topic": 6}, {"n": 49, "cat": "E", "stem": "Production logs reveal inconsistent error responses when lookup_order fails. The agent sometimes retries (wasting 3-4 turns) before concluding on the error. Your MCP tool currently returns only a plain text error message to Claude. What's the most effective improvement?", "opts": {"A": "Implement retry logic with exponential backoff in your MCP server for all errors, returning only successful results to the agent.", "B": "Add few-shot examples to the system prompt showing how to distinguish retryable from non-retryable errors by parsing error message text.", "C": "Create an analyze_error MCP tool the agent calls to determine the error type before deciding how to handle it.", "D": "Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use."}, "a": "D", "sk": ["plain text error message"], "ak": ["structured error responses with retryable: false"], "note": "Lỗi chỉ là text → trả lỗi có cấu trúc với retryable. (Giống câu 55)", "ex": "Trả về structured error response với trường retryable: false cho lỗi nghiệp vụ + giải thích thân thiện — Claude xử lý ngay trong một lượt, không cần đoán mò từ plain text.\n\nTại sao các phương án khác chưa tối ưu\nA\nauto-retry ẩn trong MCP server cho mọi lỗi không giải quyết được lỗi nghiệp vụ cố định, có thể kéo dài phản hồi.\nB\nfew-shot phân tích text lỗi thủ công kém bền vững, dễ trôi ngữ cảnh.\nC\ntool riêng phân tích lỗi tăng round-trip không cần thiết.", "set": "Set 1", "topic": 3}, {"n": 50, "cat": "E", "stem": "When the agent calls lookup_order and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call process_refund or escalate_to_human next?", "opts": {"A": "The orchestration layer automatically routes to the next tool based on the order's status field.", "B": "The order details are added to the conversation and the model reasons about which action to take.", "C": "The agent follows a pre-configured decision tree mapping order attributes to specific tool calls.", "D": "The agent executes the remaining steps in a tool sequence planned at the start of the request."}, "a": "B", "sk": ["how does the agentic loop determine"], "ak": ["model reasons about which action to take"], "note": "Agentic loop: kết quả tool vào hội thoại, model tự suy luận bước tiếp.", "ex": "Vòng lặp agentic chuẩn: kết quả tool (lookup_order) đưa vào ngữ cảnh hội thoại, model tự phân tích (vd: 45 ngày vượt policy hoàn trả tự động) và suy luận bước tiếp theo — process_refund hay escalate_to_human.\n\nTại sao các phương án khác chưa tối ưu\nA\norchestration layer không định tuyến cứng nhắc theo status field đơn giản. C &\nD\nagent không chạy theo decision tree cố định hay chuỗi tool lập sẵn — hoạt động qua cơ chế phản hồi động từng vòng lặp.", "set": "Set 1", "topic": 6}, {"n": 51, "cat": "T", "stem": "A customer writes: \"I've been going back and forth on this return for days. I just want to speak to someone who can actually help me.\" The agent has confirmed via lookup_order that the return is straightforward–within policy and eligible for immediate processing. What should the agent do?", "opts": {"A": "Ask what specifically hasn't worked in previous attempts before deciding whether to escalate or resolve automatically", "B": "Process the refund via process_refund to resolve the underlying issue, then inform them it's complete", "C": "Call escalate_to_human immediately to honor the customer's request", "D": "Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate"}, "a": "D", "sk": ["return is straightforward"], "ak": ["Acknowledge frustration", "offer to complete it or escalate"], "note": "Bẫy cặp với câu 45. Ở đây giải quyết được ngay → ghi nhận, đề nghị xử lý hoặc chuyển, để khách chọn.", "ex": "Thừa nhận sự thất vọng, thông báo vấn đề có thể giải quyết ngay, tôn trọng quyền lựa chọn của khách (để AI hoàn tất hoặc chuyển người) — cân bằng giữa không ép leo thang khi có thể tự động hóa và không phớt lờ cảm xúc khách hàng.\n\nTại sao các phương án khác chưa tối ưu\nA\ngặng hỏi vòng vo làm khách thêm mệt mỏi.\nB\ntự ý xử lý ngầm không tôn trọng mong muốn khách, khiến họ cảm thấy không được lắng nghe.\nC\nescalate ngay khi vấn đề nằm trong tầm agent tự xử lý lãng phí năng lực hệ thống.", "set": "Set 1", "topic": 6}, {"n": 52, "cat": "E", "stem": "Compliance requires that refunds exceeding $500 must automatically escalate to a human agent–this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate). How should you achieve guaranteed compliance?", "opts": {"A": "Strengthen the system prompt with emphatic language: \"CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.\"", "B": "Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600).", "C": "Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation.", "D": "Modify the refund tool to return an error with message \"Amount exceeds policy limit–please escalate\" when threshold is exceeded."}, "a": "C", "sk": ["cannot be left to model discretion", "guaranteed compliance"], "ak": ["hook to intercept tool calls"], "note": "\"Đảm bảo/guaranteed\" → hook chặn ở code, không dựa vào prompt.", "ex": "Khi yêu cầu tuân thủ tuyệt đối (\"cannot be left to model discretion\"), chỉ có programmatic enforcement mới đảm bảo 100%. Hook chặn tool call khi refund > $500, block và invoke escalation — loại bỏ hoàn toàn khả năng sai sót do LLM quyết định.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nB\ntối ưu prompt vẫn chỉ mang tính xác suất (probabilistic), không đảm bảo tuân thủ tuyệt đối cho quy tắc chính sách cứng.\nD\ntrả lỗi vẫn phụ thuộc model đọc/hiểu/tự quyết định đúng cách — vẫn có rủi ro lách luật hoặc xử lý sai.", "set": "Set 1", "topic": 6}, {"n": 53, "cat": "T", "stem": "A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks \"What happened with my refund?\" The conversation is approaching context limits. What strategy best maintains the agent's ability to address all issues throughout the session?", "opts": {"A": "Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer.", "B": "Summarize earlier turns into a narrative description, preserving full message history only for the active issue.", "C": "Implement sliding window context that retains the most recent 30 turns.", "D": "Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues."}, "a": "B", "sk": ["approaching context limits"], "ak": ["Summarize earlier turns into a narrative description"], "note": "Bẫy: {A} (tách dữ liệu có cấu trúc) trông đúng hơn, nhưng đáp án đề cho là {B}. Học thuộc câu này.", "ex": "Tóm tắt các lượt trước thành mô tả tường thuật, giữ lại lịch sử thông điệp đầy đủ chỉ cho vấn đề đang hoạt động — cân bằng giữa việc bảo toàn ngữ cảnh nhiều vấn đề và tiết kiệm context khi gần đạt giới hạn.\n\nTại sao các phương án khác chưa tối ưu\nA\ntrích xuất dữ liệu cấu trúc riêng biệt không giữ được sắc thái đầy đủ như tóm tắt tường thuật.\nC\nsliding window 30 lượt có thể cắt mất vấn đề refund (turns 1-15) khi hỏi lại ở turn 48.\nD\nre-fetch qua MCP tools không tối ưu để bảo toàn liên tục ngữ cảnh nhiều vấn đề đã trao đổi.", "set": "Set 1", "topic": 6}, {"n": 54, "cat": "E", "stem": "The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened. What's the most likely cause of this behavior?", "opts": {"A": "The verification tool is clearing the agent's internal state after each successful validation step.", "B": "The prompt lacks instructions telling Claude to remember information across multiple exchanges.", "C": "The conversation history isn't being passed in subsequent API requests.", "D": "Claude's memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it."}, "a": "C", "sk": ["asks them to provide their name again"], "ak": ["conversation history isn't being passed"], "note": "API stateless → quên vì không gửi lại lịch sử.", "ex": "Mô hình hỏi lại như chưa từng hội thoại thường do ứng dụng không truyền lại mảng lịch sử trò chuyện (messages array) trong các request API tiếp theo — mỗi lượt bị coi là phiên hoàn toàn mới (stateless).\n\nTại sao các phương án khác chưa tối ưu\nA\nverification tool là hàm backend, không có khả năng xóa trạng thái nội bộ của LLM.\nB\nClaude tự động ghi nhớ toàn bộ ngữ cảnh trong messages array, không cần prompt nhắc riêng.\nD\nkhông có giới hạn ngầm 2 lượt — phụ thuộc context window thực tế (hàng trăm nghìn token) và việc app có truyền đủ lịch sử hay không.", "set": "Set 1", "topic": 7}, {"n": 55, "cat": "E", "stem": "Your process_refund tool returns two types of errors: technical errors (\"503 Service Unavailable\", \"Connection timeout\") that are transient (5% of calls), and business errors (\"Order exceeds 30-day return window\", \"Item already refunded\") that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude. What's the most effective way to reduce wasted retries while improving customer-facing response quality?", "opts": {"A": "Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries.", "B": "Add few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text.", "C": "Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use.", "D": "Add a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations."}, "a": "C", "sk": ["both error types return only a plain text message"], "ak": ["structured error responses with retryable: false"], "note": "Giống câu 49: lỗi có cấu trúc + retryable.", "ex": "Trả về structured error response với retryable: false cho lỗi nghiệp vụ + thông điệp thân thiện — model nhận diện ngay, không lãng phí lượt thử lại vô vọng.\n\nTại sao các phương án khác chưa tối ưu\nA\nauto-retry ở tầng tool cho lỗi kỹ thuật có thể che giấu vấn đề hệ thống cốt lõi, không giải quyết cách LLM hiểu lỗi nghiệp vụ.\nB\nfew-shot phân tích text lỗi thủ công kém bền vững.\nD\nthêm tool kiểm tra riêng trước mỗi lần chạy tăng round-trip không cần thiết.", "set": "Set 1", "topic": 3}, {"n": 56, "cat": "T", "stem": "A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains context: lookup_status_result messages containing \"Status: Pending Refund\" and significant tokens from prior lookup results. The agent needs to be prepared to answer the customer fully. What approach most reliably handles returning customers?", "opts": {"A": "Resume with the full conversation and add a system prompt instruction that instructs the agent to prioritize resolving the pending refund.", "B": "Resume with state and configure the agent to automatically re-call all previous tool_results messages to ensure data freshness.", "C": "Start a new session, inject a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed.", "D": "Create a new session with a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed."}, "a": "C", "sk": ["returns 4 hours after"], "ak": ["Start a new session, inject a structured summary"], "note": "Bẫy chữ: {C} và {D} gần như giống hệt (\"Start\" vs \"Create\"). Đáp án đề là {C}. Ý chính: phiên mới + tóm tắt + gọi tool mới (dữ liệu cũ có thể đã thay đổi).", "ex": "(C và D giống hệt nội dung — cùng ý \"phiên mới + tóm tắt cấu trúc + fresh tool calls\")\n\nSau 4 giờ gián đoạn, phiên cũ 32 lượt quá dài + nhiều token từ tool_results cũ. Bắt đầu phiên mới với bản tóm tắt cấu trúc (issue type, resolution steps, current status) giúp nắm ngữ cảnh quan trọng mà không quá tải bộ nhớ; sau đó gọi tool mới để lấy dữ liệu tươi (vd: kiểm tra \"Pending Refund\" đã xử lý xong chưa).\n\nTại sao các phương án khác chưa tối ưu\nA\ngiữ toàn bộ hội thoại dài vẫn quá tải token, dữ liệu cũ có thể không còn chính xác sau 4h.\nB\ntự động gọi lại tất cả tool_results cũ tốn kém, không giải quyết việc cô đọng ngữ cảnh.", "set": "Set 1", "topic": 6}, {"n": 57, "cat": "E", "stem": "Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn't match the extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals. What's the most effective approach to improve extraction reliability?", "opts": {"A": "Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct.", "B": "Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions.", "C": "Add a \"calculated_total\" field where the model sums extracted line items alongside a \"stated_total\" field. Flag records for human review when values differ.", "D": "Implement post-processing that automatically adjusts line item amounts proportionally when their sum doesn't match the stated total."}, "a": "C", "sk": ["doesn't match the extracted grand total"], "ak": ["\"calculated_total\" field", "\"stated_total\""], "note": "Giống câu 16: calculated_total + stated_total, lệch thì flag.", "ex": "Tách biệt calculated_total (model tự tính từ line items) và stated_total (ghi trên hóa đơn) giúp phát hiện chính xác lỗi (OCR hoặc model). Flag bản ghi không khớp để human review — chuẩn mực cho hệ thống tài chính đòi hỏi độ chính xác cao, ngăn dữ liệu sai vào downstream accounting.\n\nTại sao các phương án khác chưa tối ưu\nA\nmodel phụ riêng tốn kém, tăng latency, không giải quyết gốc rễ lỗi OCR/trích xuất.\nB\nfew-shot không khắc phục được lỗi OCR từ nguồn gốc đã sai.\nD\ntự động điều chỉnh tỷ lệ là \"bóp méo\" số liệu gốc, rủi ro cao trong kế toán/kiểm toán.", "set": "Set 1", "topic": 5}, {"n": 58, "cat": "T", "stem": "An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent's responses are becoming noticeably less accurate — it's forgetting previously discussed code patterns and hasn't yet located all test files or traced critical payment flows. What's the most effective approach to complete this investigation?", "opts": {"A": "Spawn subagents to investigate specific questions (e.g., \"find all test files for payment processing\", \"trace refund flow dependencies\") while the main agent coordinates findings and preserves high-level understanding.", "B": "Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets.", "C": "Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation.", "D": "Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration."}, "a": "A", "sk": ["spanning 45 files"], "ak": ["Spawn subagents to investigate specific questions", "main agent coordinates findings"], "note": "Bẫy cặp với câu 8. Ở đây 45 file + có các câu hỏi con rõ ràng → subagent, agent chính điều phối.", "ex": "Phân chia nhiệm vụ cho subagents phân tán tải trọng ngữ cảnh; main agent điều phối/tổng hợp kết quả mà không quá tải bộ nhớ hay trôi mất pattern đã thảo luận. Xử lý song song các câu hỏi cụ thể (tìm test files, trace refund flow) thay vì một agent đơn lẻ đọc tuần tự toàn bộ 45 file.\n\nTại sao các phương án khác chưa tối ưu\nB &\n\nC\nxóa hoàn toàn context (/clear) làm gián đoạn reasoning flow, dễ bỏ sót ngữ cảnh tổng quan ban đầu.\nD\nGrep chỉ tìm từ khóa tĩnh, không phân tích sâu được control flow hay code path chưa test trong luồng thanh toán phức tạp.", "set": "Set 1", "topic": 2}, {"n": 59, "cat": "E", "stem": "The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate — it generates messages like \"I'll ask the web search agent to find sources on this topic\" — but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors. What is the most likely cause?", "opts": {"A": "The AgentDefinitions are configured correctly, but the coordinator's system prompt doesn't explicitly list the available subagent types, preventing the model from knowing they can be invoked.", "B": "The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation, it cannot invoke the tool required to spawn subagents.", "C": "Subagent context isolation means task descriptions from the coordinator don't automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions.", "D": "The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified."}, "a": "B", "sk": ["no subagent execution ever occurs"], "ak": ["allowedTools configuration doesn't include \"Task\""], "note": "Giống câu 30: thiếu \"Task\" trong allowedTools.", "ex": "LLM có thể suy luận về việc giao việc nhưng chỉ THỰC SỰ gọi được tool nếu nó được khai báo trong allowedTools. Thiếu \"Task\" → agent chỉ \"nói\" về việc giao việc mà không thể thực thi, không subagent nào chạy, không lỗi nào ghi nhận ở tầng code.\n\nTại sao các phương án khác chưa tối ưu\nA\nkhông cần liệt kê thủ công từng loại subagent nếu đã cấu hình sẵn trong AgentDefinitions.\nC\nvấn đề là subagent không hề được spawn, không phải lỗi truyền ngữ cảnh.\nD\nmax_tokens thấp gây truncate/lỗi cú pháp giữa chừng — đề bài nêu rõ model hoàn thành suy luận bình thường, logs không lỗi.", "set": "Set 1", "topic": 4}, {"n": 60, "cat": "E", "stem": "In production, you observe that simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement signed?\") traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications. What's the most effective approach to optimize for varying query complexity?", "opts": {"A": "Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness.", "B": "Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve.", "C": "Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements.", "D": "Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination."}, "a": "C", "sk": ["diverse and evolving"], "ak": ["dynamically decide which subagents to invoke"], "note": "Giống câu 40: coordinator quyết định động.", "ex": "Phân phối truy vấn \"đa dạng và liên tục tiến hóa\" → để coordinator tự phân tích từng truy vấn và quyết định linh hoạt (dynamic routing) là tối ưu nhất: gọi vừa đủ subagent (1 cho câu đơn giản, toàn bộ pipeline cho câu phức tạp) mà không cần cấu hình cứng.\n\nTại sao các phương án khác chưa tối ưu\nA\nfast-path cho câu đơn giản nhưng ép mọi câu khác qua pipeline cố định không xử lý được tính đa dạng/tiến hóa liên tục.\nB\nclassifier huấn luyện + retraining định kỳ tạo overhead lớn, kém linh hoạt hơn coordinator dùng LLM sẵn có.\nD\nphân loại theo mẫu cố định (predefined combination) quá cứng nhắc, không xử lý tốt truy vấn mới evolving.", "set": "Set 1", "topic": 4}, {"n": 61, "cat": "E", "stem": "Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. The agent cannot distinguish between error types. What's the most effective improvement?", "opts": {"A": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted.", "B": "Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action.", "C": "Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure.", "D": "Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}, "a": "C", "sk": ["uniform error responses", "cannot distinguish between error types"], "ak": ["structured metadata", "errorCategory", "isRetryable"], "note": "Lỗi giống hệt nhau → thêm metadata có cấu trúc (loại lỗi, retry được không).", "ex": "MCP tool trả lỗi đồng nhất (\"Operation failed\") khiến agent không phân loại được để xử lý (retry/escalate/hỏi lại). Bổ sung structured metadata (errorCategory, isRetryable, mô tả chi tiết) trực tiếp vào response giúp agent quyết định chính xác ngay, không tốn thêm round-trip.\n\nTại sao các phương án khác chưa tối ưu\nA\nauto-retry ẩn bản chất lỗi (validation/permission) khỏi agent, retry vô ích.\nB\ntool analyze_error phụ tốn thêm latency/token mỗi lần lỗi.\nD\nfew-shot đoán mẫu lỗi không cấu trúc dễ sai lệch khi message backend thay đổi.", "set": "Set 2", "topic": 3}, {"n": 62, "cat": "T", "stem": "Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document analysis agent frequently identifies gaps—for instance, noting \"the retrieved sources discuss API authentication but lack details on token refresh patterns\"—but under the current strict pipeline, this insight isn't actionable since search has already completed. What's the most effective architectural change?", "opts": {"A": "Have the coordinator review analysis output for gap indicators and re-invoke search with gap-informed queries when gaps are detected.", "B": "Have the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage for manual review.", "C": "Add a research planning agent before the search phase that decomposes topics into specific sub-questions.", "D": "Have the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-invokes analysis until sufficient."}, "a": "D", "sk": ["this insight isn't actionable since search has already completed"], "ak": ["analysis agent report specific gaps to the coordinator", "re-invokes analysis until sufficient"], "note": "Bẫy giữa {A} và {D}: {A} để coordinator tự đoán khoảng trống; đáp án là agent phân tích báo khoảng trống cụ thể, coordinator lặp tìm kiếm.", "ex": "Vòng lặp phản hồi thông minh (feedback loop): analysis agent báo cáo trực tiếp gap cụ thể cho coordinator, coordinator kích hoạt targeted search bổ sung và lặp lại phân tích đến khi đủ độ sâu/độ phủ.\n\nTại sao các phương án khác chưa tối ưu\nA\ncoordinator tự xem lại output để tìm dấu hiệu thiếu hụt kém hiệu quả hơn, bỏ qua chuyên môn trực tiếp của analysis agent.\nB\ngắn confidence score + flag manual review mất tính tự động, không tự bổ sung thông tin thiếu.\nC\nplanning agent trước search chỉ giúp kế hoạch ban đầu, không giải quyết gap phát sinh khi phân tích thực tế.", "set": "Set 2", "topic": 4}, {"n": 63, "cat": "E", "stem": "This currently requires manually copy-pasting content into conversations. The team wants the agent to access this standard Jira ticket data directly. What's the most effective approach?", "opts": {"A": "Integrate an existing Jira MCP server that exposes tickets, comments, and metadata through discoverable tool interfaces.", "B": "Use the Bash tool with curl to call Jira's REST API, including authentication headers and parsing JSON responses inline.", "C": "Build a custom MCP server wrapping Jira's API with tools designed specifically for this team's code review workflow.", "D": "Export Jira tickets to markdown files in the repository that the agent accesses using the Read tool."}, "a": "A", "sk": ["standard Jira ticket data"], "ak": ["existing Jira MCP server"], "note": "Dữ liệu chuẩn → dùng MCP server có sẵn, không tự build.", "ex": "Dùng MCP server có sẵn cho Jira cung cấp giao diện công cụ chuẩn hóa, bảo mật, discoverable — agent dùng ngay không cần xây lại từ đầu, thay thế copy-paste thủ công.\n\nTại sao các phương án khác chưa tối ưu\nB\ncurl thủ công qua Bash kém an toàn, dễ lỗi cú pháp, không tận dụng cơ chế quản lý tool cấu trúc.\nC\ntự xây custom MCP server từ đầu lãng phí khi đã có server chuẩn hỗ trợ.\nD\nexport ra markdown tĩnh gây độ trễ dữ liệu, mất real-time access.", "set": "Set 2", "topic": 3}, {"n": 64, "cat": "T", "stem": "A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific area, but you haven't worked with this module before. What's the most effective approach?", "opts": {"A": "Use plan mode to analyze the error in context of the module's design, enumerate potential root causes, and prioritize fixes systematically.", "B": "Enter plan mode to explore the module's architecture and dependencies before attempting any fix.", "C": "Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause.", "D": "Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing."}, "a": "C", "sk": ["clear stack trace pointing to a specific area"], "ak": ["direct execution"], "note": "Bẫy: plan mode nghe cẩn thận. Stack trace đã chỉ rõ chỗ lỗi → làm trực tiếp. (So sánh câu 83: 45 file → plan mode)", "ex": "Đề bài đã nêu rõ \"clear stack trace pointing to a specific area\" — phạm vi đã được khoanh vùng hẹp, có manh mối cụ thể chỉ thẳng nơi phát sinh lỗi. Với sự cố production khẩn cấp cần giảm downtime nhanh, Direct execution là phù hợp: đọc thẳng stack trace, xem đoạn mã liên quan, xác định nguyên nhân gốc rồi sửa. Việc \"chưa từng làm với module này\" không lật ngược tín hiệu đó — stack trace rõ ràng chính là điểm vào để hiểu đúng chỗ cần đọc.\n\nTại sao các phương án khác chưa tối ưu\nA\nvà\nB\ndùng Plan mode để khám phá lại kiến trúc/dependencies hoặc liệt kê các nguyên nhân tiềm năng — phù hợp cho nhiệm vụ phức tạp/mơ hồ hoặc thay đổi diện rộng, nhưng ở đây phạm vi đã rõ nên chỉ kéo dài thời gian xử lý sự cố.\nD\nchuyển đổi qua lại giữa direct execution và plan mode là thao tác thừa cho một lỗi đã được khoanh vùng cụ thể.", "set": "Set 2", "topic": 1}, {"n": 65, "cat": "T", "stem": "After deploying the automated review, you notice high precision but low recall — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to \"only report high-confidence issues you are certain about\" and \"err on the side of not commenting.\" Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while keeping false positive rates manageable for your team. What is the most effective approach?", "opts": {"A": "Split the review into a finding stage where Claude's goal is coverage — flagging every potential issue with confidence and severity metadata — and a separate stage that thresholds those findings.", "B": "Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives.", "C": "Add detailed few-shot examples demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels.", "D": "Expand the context window by including related test files, recent git history, and the module's dependency graph alongside the diff, giving Claude richer signals to assess issue severity."}, "a": "A", "sk": ["high precision but low recall"], "ak": ["finding stage", "coverage", "separate stage that thresholds those findings"], "note": "Bẫy: {B} (báo hết rồi lọc theo loại) nghe giống. Đáp án: tách hai giai đoạn — tìm rộng có metadata confidence, rồi lọc ngưỡng.", "ex": "Tách 2 giai đoạn: (1) Finding stage — mục tiêu coverage cao, nêu mọi vấn đề tiềm ẩn kèm confidence + severity metadata, không bị kìm hãm bởi lọc sớm; (2) Thresholding stage — lọc/xử lý kết quả theo tiêu chí cụ thể, thay vì bắt một prompt duy nhất gánh cả việc đánh đổi precision/recall.\n\nTại sao các phương án khác chưa tối ưu\nB, C, D đều vẫn dựa vào một prompt duy nhất lọc trước (mất recall) hoặc chỉ thêm ví dụ/context mà không giải quyết bài toán tách luồng coverage vs. filtering.", "set": "Set 2", "topic": 1}, {"n": 66, "cat": "T", "stem": "Your remove_team_member tool uses a dry_run: boolean parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step in 15% of calls by calling with dry_run=false directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms. What is the most reliable approach?", "opts": {"A": "Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools.", "B": "Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with dry_run=true first and wait for user confirmation before calling with dry_run=false.", "C": "Add server-side validation that permits dry_run=false only when a dry_run=true call with identical parameters occurred within the past 60 seconds.", "D": "Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action."}, "a": "D", "sk": ["bypasses the preview step", "explicitly confirms"], "ak": ["confirmation token", "binding execution to the specific previewed action"], "note": "Bẫy: {C} (kiểm tra trong 60 giây) và {A} nghe ổn. Đáp án: hai tool + token dùng một lần ràng buộc chính hành động đã xem trước.", "ex": "Architectural Enforcement: thay vì phụ thuộc mô hình tuân thủ prompt (dễ bị bỏ qua), thiết kế lại tool để hành vi sai trở nên bất khả thi về kỹ thuật. Chia 2 tool: preview trả token dùng-một-lần, execute bắt buộc có token đó — agent buộc phải preview trước mới lấy được token để thực thi.\n\nTại sao các phương án khác chưa tối ưu\nA, B, C phụ thuộc cấu hình lớp điều phối hoặc prompting, kém tin cậy hơn, vẫn có xác suất bị agent lách qua trong tình huống phức tạp.", "set": "Set 2", "topic": 3}, {"n": 67, "cat": "T", "stem": "Your invoice extraction uses tool use with strict JSON schemas. JSON syntax errors never occur, but 12% of extractions fail semantic validation--for example, line item amounts don't match extracted total, or vendor IDs don't match valid formats. These failures currently route to manual review. What's the most effective approach to reduce manual review volume while maintaining accuracy?", "opts": {"A": "Retry the extraction up to 3 times when validation fails, accepting the first result that passes validation.", "B": "Add stricter schema constraints with detailed field descriptions to prevent the model from generating invalid values initially.", "C": "Implement post-processing logic that automatically corrects common errors, such as recalculating totals from line items when sums don't match.", "D": "When validation fails, make a follow-up request with the document, extraction, and validation errors for model correction."}, "a": "D", "sk": ["fail semantic validation"], "ak": ["follow-up request with the document, extraction, and validation errors"], "note": "Bẫy: {A} retry mù. Phải gửi lại kèm lỗi validation cụ thể để model tự sửa.", "ex": "Tận dụng self-correction của LLM: gửi lại tài liệu gốc + kết quả trích xuất lỗi + thông báo lỗi cụ thể trong lượt request tiếp theo, cho phép model nhìn rõ lỗi sai và tự điều chỉnh — pattern hiệu quả cho lỗi ngữ nghĩa phức tạp mà không cần ép model hoàn hảo ngay lần đầu.\n\nTại sao các phương án khác chưa tối ưu\nA\nretry mù quáng không cung cấp thông tin lỗi.\nB\nchỉ dựa schema trong khi lỗi ngữ nghĩa thường do độ phức tạp ngữ cảnh văn bản.\nC\ntự động sửa logic post-processing có thể làm mất dữ liệu thực tế, tiềm ẩn rủi ro nghiệp vụ nghiêm trọng.", "set": "Set 2", "topic": 5}, {"n": 68, "cat": "E", "stem": "Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non-conformant JSON. What approach provides the most reliable schema compliance?", "opts": {"A": "Define a tool with your target schema as input parameters and have Claude call it with the extracted data.", "B": "Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude's text response as JSON.", "C": "Pre-fill Claude's response with an opening brace to force JSON output, then complete and parse the response.", "D": "Append instructions like \"Output only valid JSON matching the schema exactly\" and implement retry logic to re-prompt when JSON parsing fails."}, "a": "A", "sk": ["strictly conforms to a schema"], "ak": ["Define a tool with your target schema"], "note": "JSON tuân thủ schema chắc chắn nhất → tool use với input schema.", "ex": "Tool Use (function calling): định nghĩa tool với input parameters theo schema mong muốn — model được tối ưu để sinh tool call arguments khớp chính xác cấu trúc, API ép buộc định dạng đầu vào, hạn chế tối đa JSON không hợp lệ so với chỉ dùng text prompt.\n\nTại sao các phương án khác chưa tối ưu\nB, C, D đều dựa trên prompt thuần túy/pre-fill/retry logic — rủi ro cao hơn vì model vẫn có thể sinh văn bản sai cấu trúc hoặc thiếu trường theo schema.", "set": "Set 2", "topic": 5}, {"n": 69, "cat": "T", "stem": "Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling approximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third consistently missed. The model's context window is 200K tokens. What is the most likely cause?", "opts": {"A": "The model distributes attention proportionally across input length, causing fields mentioned only once near the document's end to receive insufficient processing focus.", "B": "Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length.", "C": "Tool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing.", "D": "Very long documents exceed the model's effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions."}, "a": "C", "sk": ["2,500 tokens for the complete tool definition", "context window is 200K"], "ak": ["Tool definitions consume input context tokens"], "note": "Bẫy: {A}/{D} nói về \"attention\" nghe hàn lâm. Thật ra là cộng dồn token (tool + prompt + tài liệu) chạm giới hạn.", "ex": "Tổng tokens thực tế = tài liệu (190K) + tool definition (~2.5K) + system prompt tiệm cận sát giới hạn 200K. Khi chạm gần ngưỡng, khả năng xử lý/chú ý ở cuối văn bản suy giảm đáng kể (end-of-document processing degrades).\n\nTại sao phương án khác chưa tối ưu\nD \"Lost in the Middle\" có tồn tại nhưng nguyên nhân cốt lõi ở đây là tổng token tiêu thụ (tài liệu lớn + tool phức tạp) đẩy ngữ cảnh chạm sát giới hạn 200K, không đơn thuần là khoảng cách xa prompt.", "set": "Set 2", "topic": 5}, {"n": 70, "cat": "E", "stem": "The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some are receipts. You've defined separate extraction tools, each with its own schema tailored to the document type. During testing, you observe that with tool_choice: \"auto\", Claude sometimes returns conversational text instead of calling an extraction tool, causing downstream parsing failures. You need guaranteed structured output without knowing the document type in advance. What's the most effective approach?", "opts": {"A": "Set tool_choice: \"any\" with all extraction tools defined.", "B": "Keep tool_choice: \"auto\" with system prompt instructions requiring tool use.", "C": "Add a preliminary classification call, then make a second call with tool_choice forced to the identified extraction tool.", "D": "Consolidate all document types into a single unified-schema extraction tool and force that tool."}, "a": "A", "sk": ["without knowing the document type in advance", "guaranteed structured output"], "ak": ["tool_choice: \"any\""], "note": "Bắt buộc gọi tool nhưng chưa biết tool nào → \"any\". (Biết trước tool → type \"tool\")", "ex": "*(lưu ý: cộng đồng vote nghiêng về C, nhưng đáp án hệ thống chấm là A)*\n\ntool_choice: \"any\" ép model phải gọi ít nhất một trong các tool đã định nghĩa (khác với \"auto\" cho phép trả lời text tự do), loại bỏ hoàn toàn khả năng sinh văn bản hội thoại. Model tự chọn đúng tool phù hợp với tài liệu mà vẫn đảm bảo structured output.\n\nTại sao các phương án khác chưa tối ưu\nB\nvẫn \"auto\" nên không ngăn được việc trả text.\nC\ntách 2 bước (classify rồi force tool) tăng latency/chi phí/điểm gãy pipeline.\nD\ngộp chung 1 schema mất tính đặc thù đã tối ưu riêng cho từng loại tài liệu.", "set": "Set 2", "topic": 5}, {"n": 71, "cat": "E", "stem": "Monitoring shows 12% of extractions fail Pydantic validation with specific errors like \"expected float for quantity, got '2 to 3'\". Retrying these requests without modification produces failures. What's the most effective approach to recover from these validation failures?", "opts": {"A": "Pre-process source documents to standardize problematic formats before sending them for extraction", "B": "Send a follow-up request including the validation error, asking the model to correct its output", "C": "Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation", "D": "Set temperature to 0 to eliminate output variability and ensure consistent formatting"}, "a": "B", "sk": ["Retrying these requests without modification produces failures"], "ak": ["follow-up request including the validation error"], "note": "Retry y nguyên vô ích → gửi kèm lỗi validation để sửa.", "ex": "Error Feedback Loop: gửi lại thông báo lỗi Pydantic cụ thể kèm yêu cầu chỉnh sửa cho model — model thấy rõ output trước sai ở đâu, tự sửa trường đó. Trực tiếp, hiệu quả, ít chi phí nhất.\n\nTại sao các phương án khác chưa tối ưu\nA\ntiền xử lý toàn bộ tài liệu nguồn phức tạp.\nC\ndùng model lớn hơn đắt đỏ.\nD\nchỉnh temperature không giải quyết vấn đề ngữ nghĩa/định dạng cụ thể mà Pydantic đang bắt lỗi.", "set": "Set 2", "topic": 5}, {"n": 72, "cat": "T", "stem": "After three months of weekly sessions, your conversation history has grown to 85,000 tokens. When users ask \"What did we conclude about the theme of isolation?\", the assistant provides generic literary analysis rather than referencing the group's specific insights from earlier sessions. Discussions often build on previous meetings' conclusions, so maintaining narrative context is important. What's the most effective approach?", "opts": {"A": "Implement rolling window truncation to keep only the most recent 25,000 tokens.", "B": "Implement progressive summarization where older conversation blocks are replaced with concise summaries that explicitly extract key conclusions, decisions, and recurring themes, keeping recent exchanges verbatim.", "C": "Add structured XML tags to mark significant discussion conclusions throughout the conversation history.", "D": "Use semantic embedding to index the full conversation history and retrieve only relevant past exchanges for each user query, replacing the linear conversation format with retrieved segments."}, "a": "B", "sk": ["85,000 tokens", "specific insights from earlier sessions"], "ak": ["progressive summarization", "extract key conclusions"], "note": "Bẫy: {D} (semantic search) nghe hiện đại nhưng mất mạch. Tóm tắt dần, giữ kết luận, phần gần đây giữ nguyên văn.", "ex": "Progressive summarization: giữ nguyên verbatim các trao đổi gần đây (duy trì nhịp đối thoại), thay khối nội dung cũ bằng tóm tắt tinh gọn đặc tả kết luận cốt lõi/quyết định/chủ đề lặp lại — giữ narrative context xuyên suốt mà không mất insight quan trọng.\n\nTại sao các phương án khác chưa tối ưu\nA\nrolling window cắt bỏ hoàn toàn dữ liệu cũ, mất quyết định quan trọng từ các buổi họp trước.\nC\nthêm XML tag không giải quyết bài toán kích thước ngữ cảnh phình to.\nD\nsemantic embedding/RAG làm đứt gãy luồng thảo luận liên tục của các buổi họp định kỳ.", "set": "Set 2", "topic": 7}, {"n": 73, "cat": "E", "stem": "You're implementing a feature where users refine their playlist preferences through multiple conversation turns. After deploying, you notice Claude's responses don't reflect what was said earlier in the same conversation— for example, a user says they love jazz, but two messages later Claude asks what genres they enjoy. What is the most likely cause?", "opts": {"A": "The model's context window has been exceeded by the conversation length", "B": "Claude requires a vector database connection to maintain conversation memory", "C": "Your application isn't including prior messages in the messages array", "D": "The Claude API requires a session_id parameter that you haven't configured"}, "a": "C", "sk": ["two messages later Claude asks"], "ak": ["isn't including prior messages in the messages array"], "note": "API stateless: quên ngay trong 2 lượt → không gửi lại lịch sử.", "ex": "Claude API stateless: mỗi lần gọi phải gửi toàn bộ lịch sử hội thoại (messages array) trong payload. Nếu app quên đưa tin nhắn trước vào, model không có ngữ cảnh, \"quên\" ngay trong cùng phiên chat.\n\nTại sao các phương án khác chưa tối ưu\nA\nchỉ vài tin nhắn không thể vượt context window.\nB\nkhông cần vector database cho bộ nhớ ngắn hạn trong 1 phiên — messages array là đủ.\nD\nAPI không dùng session_id để tự quản lý lịch sử phía server theo cách đó.", "set": "Set 2", "topic": 7}, {"n": 74, "cat": "T", "stem": "Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific guidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline requirements. During testing, responses follow these guidelines for turns 1-4, but by turn 7, the assistant gives generic advice without asking about budget or timeline. The conversation totals only 2,500 tokens. What is the most likely cause?", "opts": {"A": "System prompts only establish initial behavior and don't persist across all turns.", "B": "The model's attention on system prompt instructions naturally weakens as turns accumulate.", "C": "The assistant's accumulated responses are diluting the system prompt's influence.", "D": "The system prompt is only sent with the first API request."}, "a": "C", "sk": ["only 2,500 tokens", "by turn 7"], "ak": ["accumulated responses are diluting"], "note": "Bẫy: {B} nghe gần giống. Đề hỏi NGUYÊN NHÂN: các phản hồi tích luỹ làm loãng ảnh hưởng system prompt (không phải hết context).", "ex": "Lịch sử hội thoại (cả user + assistant messages) gửi lại mỗi request mới. Khi lượt tăng, token từ câu trả lời tích lũy của assistant \"loãng\" tầm quan trọng của system prompt ban đầu — dù tổng token vẫn trong giới hạn.\n\nTại sao các phương án khác chưa tối ưu\nA\nsystem prompt duy trì ảnh hưởng xuyên suốt, gửi lại mỗi request, không chỉ ở lượt đầu.\nB\nattention drift thường liên quan context quá lớn/khoảng cách xa, nhưng nguyên nhân trực tiếp ở đây là tích lũy nội dung đối thoại (đặc biệt response của chính assistant) chiếm lĩnh context.\nD\nsystem prompt gửi kèm mọi request, không chỉ request đầu tiên.", "set": "Set 2", "topic": 7}, {"n": 75, "cat": "E", "stem": "Users report that during extended conversations, the AI loses track of specific topics, examples, and preferences they mentioned earlier in the session. Your current implementation uses a sliding window that keeps only the most recent 25 message pairs to stay within context limits. What's the most effective approach to maintain awareness of earlier conversation content while managing context size?", "opts": {"A": "Add a separate API call each turn to summarize messages being dropped, prepending this running summary to the conversation.", "B": "Replace the sliding window with a hybrid approach: summarize older messages while keeping recent messages verbatim.", "C": "Increase the window size to 50 message pairs to retain more conversation history before truncation.", "D": "Implement vector similarity search over the full conversation history, retrieving relevant past messages for each user query."}, "a": "B", "sk": ["sliding window that keeps only the most recent 25 message pairs"], "ak": ["hybrid approach: summarize older messages while keeping recent messages verbatim"], "note": "Hybrid: tóm tắt cũ + giữ nguyên văn gần đây.", "ex": "Hybrid approach tối ưu nhất: giữ verbatim tin nhắn gần đây (mạch lạc, tự nhiên) + tóm tắt tin nhắn cũ (giữ chủ đề/ví dụ/sở thích quan trọng, tiết kiệm token, tránh mất vết thông tin so với sliding window thuần túy).\n\nTại sao các phương án khác chưa tối ưu\nA\ngọi API riêng mỗi lượt chỉ để tóm tắt tăng latency/chi phí không cần thiết.\nC\ntăng window lên 50 chỉ trì hoãn vấn đề tạm thời, cuối cùng vẫn bị cắt khi hội thoại đủ dài.\nD\nvector similarity search toàn bộ lịch sử tốn tài nguyên, dễ bỏ sót ngữ cảnh tuần tự, quá phức tạp so với yêu cầu.", "set": "Set 2", "topic": 7}, {"n": 76, "cat": "T", "stem": "During QA testing, you notice that Claude follows your system prompt guidelines consistently in the first 10-15 turns, but by turn 25-30, responses begin deviating—using informal tone when formality was specified, occasionally skipping required formatting, or providing information types the guidelines restrict. Conversation length is well within context limits (typically 30,000 tokens out of 200,000 available). What's the most effective approach to maintain consistent behavior throughout extended conversations?", "opts": {"A": "Move behavioral guidelines from the system prompt into the first user message.", "B": "Automatically start a new conversation after 20 turns, passing a summary of the prior context to maintain continuity.", "C": "Implement post-response validation that regenerates each response until it conforms to the specified guidelines.", "D": "Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests."}, "a": "D", "sk": ["turn 25-30", "well within context limits"], "ak": ["user-role messages that reinforce critical guidelines"], "note": "Bẫy cặp với câu 80. Câu 76: lệch nhiều loại quy tắc → chèn nhắc nhở bằng user message ở điểm ngắt. Câu 80: quy tắc thích ứng trình độ dài dòng → few-shot.", "ex": "Phản hồi tích lũy làm loãng chú ý mô hình vào system prompt gốc. Chèn tin nhắn nhắc nhở (user-role) tại điểm ngắt tự nhiên hoặc trước yêu cầu phức tạp kéo sự chú ý quay lại quy tắc cốt lõi mà không cần reset toàn bộ phiên.\n\nTại sao các phương án khác chưa tối ưu\nA\nchuyển hướng dẫn sang tin nhắn đầu không giải quyết attention drift ở turn sau.\nB\ncắt ngang bắt đầu lại sau 20 turns gây gián đoạn không cần thiết khi context vẫn còn rộng (30K/200K).\nC\nliên tục regenerate tăng latency/chi phí lớn, không giải quyết gốc rễ.", "set": "Set 2", "topic": 7}, {"n": 77, "cat": "T", "stem": "During a conversation about order tracking, your external system receives a webhook indicating the user's package has shipped. The user is actively chatting and will likely send a follow-up message soon. You want the assistant to naturally incorporate this status change in its next response. What's the most effective approach?", "opts": {"A": "Add the current shipping status to the system prompt before the next API call.", "B": "Append the status update as a prefix to the next user message before calling the API.", "C": "Configure the assistant to call a get_order_status tool at the start of every response.", "D": "Immediately send an API request with the update as a synthetic user message, generating an unsolicited assistant response."}, "a": "A", "sk": ["webhook", "naturally incorporate"], "ak": ["current shipping status to the system prompt"], "note": "Bẫy: {B} (chèn vào tin nhắn user) giả mạo lời người dùng. Thông tin hệ thống → cập nhật system prompt trước lần gọi tiếp.", "ex": "Webhook là sự kiện bên ngoài (external event). Ở lần gọi API tiếp theo, bổ sung thông tin này vào system prompt/application context — AI coi đây là thông tin đáng tin cậy do hệ thống cung cấp, không cần sửa nội dung người dùng, không cần gọi API ngay, tự nhiên đề cập khi trả lời. Đây là cách Anthropic khuyến nghị xử lý external state changes.", "set": "Set 2", "topic": 7}, {"n": 78, "cat": "T", "stem": "Users report that responses feel repetitive across turns—each message begins with phrases like \"Certainly!\" or \"I'd be happy to help!\" even deep into conversations. You want responses to feel more natural, without these repetitive openers. What's the most effective approach?", "opts": {"A": "Lower the temperature parameter to make response openings more deterministic and less variable", "B": "Add system prompt instructions specifying phrases to avoid, such as \"Never begin responses with 'Certainly' or similar affirmations\"", "C": "Implement post-processing to detect and strip common greeting phrases from response beginnings", "D": "Append a partial assistant message with a direct response opening that the model will continue from"}, "a": "D", "sk": ["\"Certainly!\""], "ak": ["partial assistant message"], "note": "Bẫy: {B} (dặn trong system prompt) nghe đúng nhất. Đáp án là prefill — điền sẵn phần đầu câu trả lời.", "ex": "Prefill Assistant Response: bắt đầu sẵn nội dung câu trả lời (bỏ trống từ đệm \"Certainly!\") ép model tiếp tục sinh văn bản từ điểm đó — kiểm soát câu mở đầu ổn định nhất.\n\nTại sao các phương án khác chưa tối ưu\nA\ngiảm temperature chỉ giảm ngẫu nhiên, không ngăn thói quen mở đầu rập khuôn.\nB\nmodel đôi khi vẫn bỏ qua điều kiện phủ định dạng \"không được bắt đầu bằng...\" trong system prompt.\nC\npost-processing phức tạp hệ thống, có thể cắt nhầm nội dung, không giải quyết gốc rễ ở khâu sinh văn bản.", "set": "Set 2", "topic": 7}, {"n": 79, "cat": "T", "stem": "Users frequently send ambiguous requests like \"book a venue for the party\" without specifying date, guest count, or budget. Your evaluation shows the assistant asks an average of 4.2 clarifying questions before taking any action, causing 35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes receive recommendations that don't match their preferences. What's the most effective approach to improve this trade-off?", "opts": {"A": "Implement a structured intake form that collects all required parameters (date, guest count, budget, venue type) upfront before the assistant begins providing any recommendations.", "B": "Instruct the assistant to state explicit assumptions based on conversation history, proceed with recommendations while inviting corrections, and reserve clarifying questions only for irreversible actions like confirming bookings.", "C": "Configure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend, moderate budget) without explicitly stating these assumptions, allowing users to provide corrections if results don't match expectations.", "D": "Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., \"What date, guest count, and budget are you considering?\") to reduce the total number of conversational turns."}, "a": "B", "sk": ["4.2 clarifying questions", "35% of users to abandon"], "ak": ["state explicit assumptions", "reserve clarifying questions only for irreversible actions"], "note": "Bẫy: {C} dùng mặc định nhưng KHÔNG nói ra giả định. Phải nói rõ giả định + chỉ hỏi khi hành động không đảo ngược được.", "ex": "Nêu rõ giả định dựa trên lịch sử hội thoại + đưa recommendation ngay + mời chỉnh sửa, chỉ giữ câu hỏi làm rõ cho hành động không thể đảo ngược (xác nhận đặt chỗ) — giảm độ trễ/số lượt hội thoại mà vẫn minh bạch, dễ điều chỉnh.\n\nTại sao các phương án khác chưa tối ưu\nA\nintake form cứng nhắc giảm tính tự nhiên, dễ bỏ cuộc ngay từ đầu (tương tự vấn đề 35% hiện tại).\nC\nẩn giả định khiến người dùng bối rối, khó phản hồi chính xác.\nD\ngộp câu hỏi vẫn ép trả lời nhiều thông tin cùng lúc, chưa giảm gánh nặng đầu vào triệt để.", "set": "Set 2", "topic": 7}, {"n": 80, "cat": "T", "stem": "Your conversational AI tutor has a 2,800-token system prompt containing teaching methodology, persona guidelines, and detailed written instructions for adapting explanations to different proficiency levels. User testing reveals that in conversations exceeding 12 turns (approximately 4,000 tokens of conversation history), the assistant increasingly ignores the proficiency-adaptation guidelines, defaulting to intermediate-level explanations regardless of the learner's stated level. What's the most effective approach to ensure consistent adherence to these guidelines throughout extended conversations?", "opts": {"A": "After each assistant response, make a separate API call to evaluate whether the difficulty level matched the learner's profile, regenerating responses that don't align.", "B": "Inject a condensed reminder of the proficiency requirements into the conversation as a system message every 4-5 turns.", "C": "Restructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final section immediately before the conversation history begins.", "D": "Replace the verbose proficiency guidelines with few-shot examples demonstrating appropriate responses at each proficiency level, showing concrete differences in vocabulary, complexity, and explanation depth."}, "a": "D", "sk": ["2,800-token system prompt", "proficiency-adaptation guidelines"], "ak": ["few-shot examples demonstrating appropriate responses at each proficiency level"], "note": "Bẫy cặp với câu 76. Hướng dẫn chữ dài dòng về \"mức độ\" → thay bằng few-shot cho mỗi trình độ.", "ex": "\"Show, don't just tell\": few-shot examples cụ thể (vd Beginner/Intermediate/Advanced cùng giải thích quang hợp) hiệu quả hơn nhiều so với mô tả dài dòng (\"khi learner beginner, đơn giản hóa từ vựng...\"). LLM học theo mẫu rất mạnh, ví dụ cụ thể bền vững hơn qua hội thoại dài.", "set": "Set 2", "topic": 7}, {"n": 81, "cat": "T", "stem": "The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals that 12% of high-confidence extractions (>85%) also contain errors—cases where the model finds plausible-but-incorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to catch these high-confidence errors and measure whether improvements reduce the error rate over time. What approach is most effective?", "opts": {"A": "Implement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score.", "B": "Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection.", "C": "Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results.", "D": "Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review."}, "a": "B", "sk": ["12% of high-confidence extractions", "measure whether improvements reduce the error rate"], "ak": ["stratified random sampling"], "note": "Bẫy: {A} (luật heuristic) chỉ bắt lỗi đã biết. Cần đo tỷ lệ lỗi theo thời gian + phát hiện mẫu mới → lấy mẫu phân tầng.", "ex": "Stratified random sampling: kiểm soát định kỳ, đo chính xác error rate theo thời gian, phát hiện novel patterns để cải thiện hệ thống — chiến lược bền vững nhất cho lỗi ẩn ở nhóm confidence cao.\n\nTại sao các phương án khác chưa tối ưu\nA\nheuristic rules cứng nhắc có thể quá tải review thủ công, bỏ sót lỗi ngoài bảng so sánh/phụ lục.\nC\nre-extraction tốn kém, nếu model có xu hướng sai cố hữu thì 2 lần chạy vẫn trùng khớp sai.\nD\nhạ threshold tăng khối lượng review mà không giải quyết gốc rễ lỗi ở nhóm confidence cao.", "set": "Set 2", "topic": 5}, {"n": 82, "cat": "T", "stem": "Your research assistant helps users analyze academic papers over extended conversations. User testing reveals a recurring issue: after conversations exceed 60K tokens, users ask follow-up questions requiring precise numerical details from papers discussed earlier—sample sizes, exact p-values, specific inclusion criteria. Your current approach summarizes paper discussions after 8 turns to stay within context limits. Users report that responses to these precision-dependent questions are often hedged or inaccurate. What's the most effective architectural change?", "opts": {"A": "Keep source text from methodology and results sections in context permanently, while summarizing only the conversational discussion and interpretation portions.", "B": "Maintain a structured database of key facts extracted from each paper (sample sizes, statistics, methods) and retrieve relevant entries into context when precision-dependent questions are detected.", "C": "Implement retrieval that re-injects relevant paper sections when the user's question suggests they need specific numerical details.", "D": "Use a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve all numerical details and statistical values."}, "a": "B", "sk": ["precise numerical details"], "ak": ["structured database of key facts"], "note": "Bẫy: {C} (truy xuất lại đoạn văn) và {A} gần giống. Đáp án: kho dữ kiện có cấu trúc (cỡ mẫu, p-value...) truy xuất khi cần.", "ex": "Tóm tắt văn bản thuần túy làm mất chi tiết số liệu chính xác. Trích xuất và lưu trữ dữ liệu định lượng cốt lõi vào structured database, tra cứu chính xác entry khi cần — giải pháp chuyên nghiệp nhất cho câu hỏi đòi hỏi độ chính xác cao.\n\nTại sao các phương án khác chưa tối ưu\nA\ngiữ nguyên văn methodology/results cạn kiệt context nhanh khi số bài báo tăng.\nC\nre-inject toàn bộ section vẫn phải quét lại text dài thay vì dùng cấu trúc dữ liệu tường minh.\nD\ntóm tắt độ trung thực cao hơn vẫn là dạng text, không giải quyết triệt để mất mát số liệu qua nhiều vòng hội thoại.", "set": "Set 2", "topic": 7}, {"n": 83, "cat": "E", "stem": "A security audit requires updating your authentication library from v2 to v3. The migration guide documents breaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed. Grep shows the library is imported in 45 files across several modules. What's the most effective approach?", "opts": {"A": "Create a custom slash command encapsulating the migration transformations, then execute it against each file without prior codebase exploration.", "B": "Paste the migration guide's breaking changes into your prompt and use direct execution to update all usages across the 45 files.", "C": "Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears.", "D": "Enter plan mode to explore library usage across modules, map affected code paths, then create a migration strategy before implementing."}, "a": "D", "sk": ["45 files", "breaking changes"], "ak": ["Enter plan mode to explore library usage"], "note": "Thay đổi lớn, nhiều file → plan mode.", "ex": "Enter plan mode để khảo sát phạm vi sử dụng thư viện, lập bản đồ đường dẫn mã nguồn bị ảnh hưởng, xây chiến lược trước khi sửa hàng loạt — tránh thực thi mù quáng trên 45 file mà không hiểu tác động dây chuyền/ngữ cảnh từng module.\n\nTại sao các phương án khác chưa tối ưu\nA\ntạo slash command mà không khám phá trước dễ lỗi do khác biệt cách gọi hàm giữa các file.\nB\ndán toàn bộ breaking changes rồi thực thi trực tiếp dễ tràn ngữ cảnh, thiếu kiểm soát, sót lỗi logic phức tạp.\nC\ntrial-and-error dựa test suite là cách bị động, thiếu tính toán toàn cục cho thay đổi kiến trúc lớn (v2→v3).", "set": "Set 2", "topic": 1}, {"n": 84, "cat": "T", "stem": "You've asked Claude Code to build a PDF report generation feature. The initial implementation queries the database correctly, but the output has formatting issues: table columns are too narrow causing content truncation, dates display without proper formatting, and page break handling is incorrect. You've noticed these issues interact— changing column widths affects how dates render, and page breaks depend on content height. What's the most effective approach for iterating toward a working solution?", "opts": {"A": "Show Claude an example of a correctly formatted report and ask it to match that output, rather than listing the specific technical issues.", "B": "Start fresh with a detailed prompt specifying all formatting requirements upfront.", "C": "Provide all three issues in a single detailed message with exact specifications for each, allowing Claude to address them together in one update.", "D": "Address the column width issue first with specific measurements, verify it works, then fix date formatting within the corrected columns, then adjust page breaks— testing after each change."}, "a": "D", "sk": ["these issues interact"], "ak": ["Address the column width issue first", "testing after each change"], "note": "Bẫy: {C} (gửi cả 3 cùng lúc) nghe hiệu quả. Các vấn đề phụ thuộc nhau → sửa tuần tự, kiểm tra sau mỗi bước.", "ex": "Các vấn đề tương tác lẫn nhau (cột ảnh hưởng ngày, ngắt trang phụ thuộc chiều cao nội dung) → giải quyết tuần tự từng bước (chỉnh cột→test→chỉnh ngày→test→chỉnh ngắt trang→test) cô lập nguyên nhân lỗi, tránh chồng chất thay đổi phức tạp làm hỏng cấu trúc.\n\nTại sao các phương án khác chưa tối ưu\nA, B, C dồn tất cả yêu cầu cùng lúc hoặc chỉ đưa mẫu mà không xử lý tuần tự các yếu tố phụ thuộc lẫn nhau khiến AI dễ bỏ sót chi tiết hoặc tạo xung đột bố cục mới khi xử lý đồng thời.", "set": "Set 2", "topic": 1}, {"n": 85, "cat": "T", "stem": "You're implementing a new payment processing module that must follow your project's established patterns for database transactions, error handling, and audit logging. You've identified three existing modules that exemplify these patterns: db_utils.py, error_handlers.py, and audit_logger.py. This is a one-off integration task—these patterns are well-documented in your team wiki and don't need additional project-level documentation. What's the most effective approach?", "opts": {"A": "Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging patterns before generating the new module.", "B": "Describe the patterns from the three modules in natural language in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow.", "C": "Use @references to include the three modules directly in your prompt, giving Claude concrete code examples of the patterns to follow.", "D": "Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that Claude will apply automatically."}, "a": "C", "sk": ["one-off integration task"], "ak": ["@references to include the three modules"], "note": "Bẫy: {D} (ghi vào CLAUDE.md) — nhưng đề nói việc làm một lần. Dùng @ để đưa code mẫu trực tiếp.", "ex": "Tác vụ one-off, pattern đã có tài liệu rõ ràng (loại D). Dùng @references đính kèm trực tiếp 3 module mẫu vào prompt — cung cấp ngữ cảnh code cụ thể, Claude áp dụng chính xác quy ước sẵn có mà không làm ô nhiễm CLAUDE.md.\n\nTại sao các phương án khác chưa tối ưu\nA\nyêu cầu Claude tự dò tìm toàn bộ codebase tốn thời gian, kém chính xác hơn chỉ định trực tiếp file mẫu.\nB\ndiễn đạt tự nhiên dễ thiếu chi tiết kỹ thuật cốt lõi so với đọc trực tiếp mã nguồn.\nD\nthêm CLAUDE.md không phù hợp vì tác vụ dùng một lần, không cần duy trì như chuẩn mực toàn cục.", "set": "Set 2", "topic": 1}, {"n": 86, "cat": "T", "stem": "Your monorepo contains shared coding standards in /docs/standards/security-rules.md (for services handling user data), testing-patterns.md (for all packages), and api-conventions.md (for API-facing services). Your 15 packages are organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) without naming conventions indicating which handle user data or expose APIs. Package maintainers are expected to configure their own local development settings, as they understand their package's domain requirements. Currently, all package CLAUDE.md files duplicate all three standards, applying irrelevant guidance. What's the most effective approach?", "opts": {"A": "Use @imports in each package's CLAUDE.md to reference only the specific standard files relevant to that package, based on the maintainer's domain knowledge.", "B": "Create a shared-standards.md that uses @imports to combine all three standards, then have each package's CLAUDE.md import that combined file.", "C": "Put all standards in the
