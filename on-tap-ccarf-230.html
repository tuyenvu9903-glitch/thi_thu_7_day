 root CLAUDE.md with override instructions like \"ignore security-rules.md when working in packages that don't handle user data.\"", "D": "Create claude/rules/ files for each standard with YAML frontmatter paths listing every package directory where that standard should apply."}, "a": "A", "sk": ["without naming conventions", "maintainers are expected to configure"], "ak": ["@imports in each package's CLAUDE.md to reference only the specific standard"], "note": "Bẫy: {D} (rules theo path) cần quy ước tên — đề nói không có. Maintainer tự @import đúng chuẩn cần.", "ex": "Đề bài nhấn mạnh: package maintainer tự cấu hình vì hiểu rõ domain riêng. Dùng @imports chọn lọc chính xác file tiêu chuẩn liên quan đến domain của từng package — linh hoạt, đúng phân quyền và bối cảnh nhất.\n\nTại sao các phương án khác chưa tối ưu\nB\ngộp tất cả vào 1 file chung rồi bắt mọi package import lại gây trùng lặp quy chuẩn thừa thãi (như vấn đề ban đầu).\nC\ndùng override \"ignore...\" không đảm bảo chính xác khi LLM xử lý phạm vi ngữ cảnh chi tiết.\nD\ncấu trúc rules/ tập trung trái với yêu cầu trao quyền tự cấu hình cho maintainer.", "set": "Set 2", "topic": 1}, {"n": 87, "cat": "E", "stem": "The system needs to extract candidate information (name, contact details, skills, work experience, education) from uploaded resumes. The extracted data must strictly conform to a predefined JSON schema, as missing required fields or incorrect data types will cause downstream validation failures. What is the most reliable approach to ensure Claude's output consistently matches the schema?", "opts": {"A": "Include detailed JSON formatting instructions and a template example in the system prompt, asking Claude to output only valid JSON.", "B": "Parse Claude's text response with regex patterns to extract JSON objects, using retry logic for malformed responses.", "C": "Define a tool with an input schema matching your required JSON structure and extract the data from Claude's tool_use response.", "D": "Make two separate API calls—first extracting information as text, then asking Claude to format that text as JSON."}, "a": "C", "sk": ["strictly conform to a predefined JSON schema"], "ak": ["Define a tool with an input schema"], "note": "Giống câu 68: schema chắc chắn → tool use.", "ex": "Tool Use / input_schema ràng buộc cấu trúc dữ liệu trực tiếp ở cấp API, model trả dữ liệu qua tool_use arguments — loại bỏ hoàn toàn sai lệch kiểu dữ liệu/thiếu trường so với dùng văn bản rồi tự parse.\n\nTại sao các phương án khác chưa tối ưu\nA\nprompt + ví dụ mẫu không đảm bảo tuân thủ 100% cho schema phức tạp.\nB\nregex + retry rườm rà, tốn token, không giải quyết gốc rễ. D 2 lần gọi API tăng độ trễ/chi phí mà vẫn không đảm bảo chính xác bằng Tool Use chuẩn.", "set": "Set 2", "topic": 5}, {"n": 88, "cat": "E", "stem": "Anthropic's tool use documentation states: \"Write instructive error messages. Instead of generic errors like 'failed', include what went wrong and what Claude should try next.\" A billing dispute agent uses lookup_order, which catches all exceptions and returns a tool_result with is_error: true and the message \"execution failed\". Monitoring shows two failure modes: the agent retries the identical call until hitting the turn limit, or it immediately calls escalate_to_human without trying alternative tools. Which change follows the documented recommendation and gives Claude the information it needs to select the correct recovery action for each error type?", "opts": {"A": "Return error-type-specific messages with is_error: true, e.g., \"order not found-try get_customer to search by phone\" for data errors and \"Database timeout (transient)-retry should succeed\" for infrastructure errors.", "B": "Remove is_error: true and return the error details as normal tool content, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior.", "C": "Implement retry logic with exponential backoff inside each tool implementation so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop.", "D": "Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags each as \"retry\" \"try_alternative,\" or \"escalate,\" and adds that recommendation to the tool result."}, "a": "A", "sk": ["\"execution failed\""], "ak": ["error-type-specific messages", "try get_customer", "retry should succeed"], "note": "Đề trích tài liệu: thông báo lỗi phải nói lỗi gì + nên thử gì tiếp.", "ex": "Theo tài liệu Anthropic: instructive error messages kèm is_error: true, nêu rõ chuyện gì xảy ra + bước tiếp theo nên thử (vd chuyển sang get_customer cho lỗi dữ liệu, retry cho lỗi hạ tầng tạm thời). Khắc phục trực tiếp 2 hiện tượng: lặp vô ích hoặc escalate ngay lập tức.\n\nTại sao các phương án khác chưa tối ưu\nB\nbỏ is_error: true khiến Claude hiểu nhầm lỗi là dữ liệu thường.\nC\nẩn lỗi tạm thời trong tool ngăn agent tự thích ứng khi gặp vấn đề lớn hơn.\nD\nthêm bước phân loại ngoài loop thay đổi logic vòng lặp chuẩn thay vì để nội dung message hướng dẫn Claude tự quyết định.", "set": "Set 2", "topic": 3}, {"n": 89, "cat": "E", "stem": "Production logs reveal inconsistent error handling: when tool_code fails, the agent sometimes retries 5 times (even if the tool_id doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes adds user-friendly explanation (inappropriate when the issue is a backend permission error). Investigation shows the MCP tool returns uniform error responses: {\"status\": \"error\", \"content\": \"{\\\"type\\\": \\\"Error\\\", \\\"message\\\": \\\"Operation failed.\\\"}\"}. What's the most effective improvement?", "opts": {"A": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted.", "B": "Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action.", "C": "Enhance error responses with structured metadata. Include error_category (transient/retriable/permission), reason, and a description of what caused the failure.", "D": "Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}, "a": "C", "sk": ["uniform error responses"], "ak": ["structured metadata", "error_category"], "note": "Giống câu 61: lỗi có cấu trúc.", "ex": "Phản hồi lỗi đồng nhất khiến agent không phân biệt được lỗi cần retry (network tạm thời), lỗi không tự khắc phục được (permission), hay lỗi sai tham số (invalid tool_id). Metadata có cấu trúc (error_category, reason, mô tả chi tiết) giúp agent đọc đúng ngữ cảnh và tự quyết định hành động phù hợp.\n\nTại sao các phương án khác chưa tối ưu\nA\nauto-retry ngầm che giấu lỗi quyền hạn/sai tham số, agent không bao giờ nhận phản hồi để điều chỉnh.\nB\ntool analyze_error phụ lãng phí round-trip, tăng chi phí.\nD\nfew-shot không giải quyết việc message lỗi từ server quá nghèo nàn/đồng nhất.", "set": "Set 2", "topic": 3}, {"n": 90, "cat": "T", "stem": "Your code review prompts include both implementation changes and the corresponding test file, but the LLM's review comments fail to point out untested code paths. Analysis reveals the model correctly flags functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functions lack coverage. What's the most effective way to improve detection of branch-level coverage gaps without overcomplicating the pipeline?", "opts": {"A": "Implement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then cross-reference each against test assertions in a second pass.", "B": "Restructure the prompt to interleave implementation and tests, presenting each function followed immediately by its test cases", "C": "Include few-shot examples showing code with an uncovered branch paired with the review comment identifying the specific missing test case.", "D": "Add explicit instructions directing the model to enumerate each conditional branch and exception path, then verify each has a corresponding test assertion."}, "a": "D", "sk": ["without overcomplicating the pipeline", "branch-level coverage gaps"], "ak": ["explicit instructions directing the model to enumerate each conditional branch"], "note": "Bẫy: {C} few-shot thường là đáp án, nhưng ở đây hướng dẫn rõ \"liệt kê từng nhánh rồi đối chiếu\" là đủ và đơn giản.", "ex": "Lỗi ở đây là model bỏ sót có tính hệ thống — không rà soát đầy đủ từng nhánh rẽ bên trong các hàm đã có test. Cách trực tiếp và rẻ nhất (chỉ sửa prompt, không thêm bước pipeline) là hướng dẫn model liệt kê tường minh từng conditional branch và exception path, rồi kiểm tra từng nhánh có test assertion tương ứng — biến việc rà soát coverage thành một checklist bắt buộc, ép model đi hết mọi nhánh thay vì chỉ nhận diện theo cảm tính.\n\nTại sao các phương án khác chưa tối ưu\nA\nmulti-pass tách thành nhiều lần gọi LLM → tăng phức tạp/thời gian/chi phí, trái yêu cầu \"không overcomplicate pipeline\".\nB\ninterleave code và test giúp ngữ cảnh phần nào nhưng không ép model rà soát từng nhánh một cách hệ thống.\nC\nfew-shot examples dạy model nhận ra dạng lỗi qua vài ví dụ mẫu, nhưng không đảm bảo model duyệt hết mọi nhánh trong đoạn mã mới — vẫn dễ sót các nhánh không giống ví dụ.\n*(Lưu ý: nhiều câu khác trong bộ đề về \"model bỏ sót một dạng nuance\" chọn few-shot examples; câu này CertLab key Direct instruction/enumeration vì lỗi mang tính rà soát-hệ-thống, cần ép liệt kê đầy đủ từng nhánh chứ không chỉ nhận diện mẫu.)*", "set": "Set 2", "topic": 1}, {"n": 91, "cat": "T", "stem": "Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You've also defined lookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests like \"extract the metadata and tell me how cited it is,\" Claude sometimes calls lookup_citations first, which fails because it needs the DOI that extract_metadata would provide. What's the most effective way to ensure structured metadata extraction happens first?", "opts": {"A": "Set tool_choice to \"any\" so Claude must use a tool, combined with system prompt instructions prioritizing extract_metadata.", "B": "Set tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} and process the enrichment requests in subsequent turns after receiving the extracted metadata.", "C": "Set tool_choice to \"auto\" and reorder the tool definitions so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools.", "D": "Set tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur."}, "a": "B", "sk": ["lookup_citations first"], "ak": ["{\"type\": \"tool\", \"name\": \"extract_metadata\"} and process the enrichment requests in subsequent turns"], "note": "Bẫy chữ: {B} và {D} đều ép tool. {D} ép ở MỌI lần gọi → không làm được bước làm giàu. Chỉ ép lần đầu.", "ex": "tool_choice ép buộc {\"type\":\"tool\",\"name\":\"extract_metadata\"} đảm bảo model không gọi nhầm tool khác cần dữ liệu (DOI) chưa tồn tại. Sau khi nhận kết quả (có DOI), xử lý enrichment ở các lượt tiếp theo.\n\nTại sao các phương án khác chưa tối ưu\nA\n\"any\" chỉ bắt buộc chọn 1 tool bất kỳ, không chỉ định đích danh — vẫn có nguy cơ gọi nhầm lookup_citations.\nC\n\"auto\" + reorder chỉ là gợi ý yếu, không đảm bảo 100%.\nD\nép buộc extract_metadata cho MỌI API call trong pipeline gây lỗi ở các lượt sau khi đã có metadata và cần gọi enrichment khác — model bị kẹt lặp lại extract_metadata.", "set": "Set 2", "topic": 3}, {"n": 92, "cat": "T", "stem": "Your pipeline reviews every PR using a single API call with a static prompt containing the diff and full text of each changed file — unchanged files are not included. Reviews are posted asynchronously and don't block PR creation. Developers report that reviews consistently miss bugs involving cross-file interactions — for example, a PR renames a function's parameters but the review doesn't flag callers in unchanged files that still use the old argument order. Evaluation shows cross-file bugs account for 35% of production incidents from reviewed PRs. What is the most effective change to your review design?", "opts": {"A": "Add chain-of-thought instructions asking the model to list all external references in the diff, then reason step-by-step about how each change might affect callers in other files.", "B": "Run parallel review passes per changed file with direct dependents included in each pass, then aggregate and deduplicate findings using a final summarization call.", "C": "Redesign the review as a turn-limited agentic task where the model can read files and search the codebase via tools, following references to verify cross-file findings.", "D": "Use static analysis to build a dependency graph of changed code, then expand the prompt to include all files within two dependency hops of any changed file."}, "a": "C", "sk": ["cross-file interactions", "unchanged files"], "ak": ["turn-limited agentic task", "read files and search the codebase"], "note": "Bẫy: {D} (đồ thị 2 bước) và {B} trông kỹ. Đáp án: cho model tự đọc/tìm theo tham chiếu (agentic, giới hạn lượt).", "ex": "Vấn đề cốt lõi: pipeline chỉ truyền changed files, bỏ qua unchanged files → thiếu ngữ cảnh toàn cục cho cross-file interactions. Redesign thành agentic task (turn-limited) cho phép model chủ động dùng tool tìm kiếm/đọc mã nguồn để tự truy vết file liên quan — giải pháp chuẩn cho context rộng + phụ thuộc chéo mà không quá tải static prompt.\n\nTại sao các phương án khác chưa tối ưu\nA\nCoT trong static prompt vẫn bị giới hạn — model không thực sự thấy nội dung file không thay đổi ngoài prompt, suy luận thiếu dữ liệu.\nB\nparallel pass với direct dependents chỉ giải quyết một phần (cấp phụ thuộc trực tiếp), cứng nhắc, tốn tài nguyên hơn agent tự tìm kiếm.\nD\nnhét tất cả file trong 2 dependency hops vào prompt gây context bloat, giảm attention, tăng chi phí token không cần thiết.", "set": "Set 2", "topic": 1}, {"n": 93, "cat": "T", "stem": "Your searchFlights tool calls an external airline API that occasionally returns a 503 Service Unavailable error. What is the most effective way to handle this error in your tool implementation?", "opts": {"A": "Automatically retry the request up to five times with exponential backoff before returning results to the agent.", "B": "Return an error message in the tool result explaining the service is temporarily unavailable.", "C": "Log the error internally and return an empty response, letting the model continue without the flight data.", "D": "Return an empty flight list as if the search succeeded but found no matching flights."}, "a": "A", "sk": ["occasionally returns a 503"], "ak": ["Automatically retry the request up to five times with exponential backoff"], "note": "Bẫy: {B} (báo lỗi cho agent) cũng hợp lý. Lỗi tạm thời → tool tự retry có backoff.", "ex": "503 là lỗi tạm thời (transient error) — server bên ngoài quá tải/bảo trì chớp nhoáng, sớm hoạt động lại. Tự động retry + exponential backoff ở tầng tool che giấu lỗi chớp nhoáng khỏi LLM, đảm bảo trải nghiệm liền mạch.\n\nTại sao các phương án khác chưa tối ưu\nB\ntrả lỗi ngay làm gián đoạn trải nghiệm trong khi lỗi có thể tự phục hồi sau vài lần thử ngầm. C &\nD\ntrả kết quả rỗng đánh lừa model hiểu nhầm \"không có dữ liệu thực\" thay vì \"hệ thống đang gặp sự cố hạ tầng tạm thời\".", "set": "Set 2", "topic": 3}, {"n": 94, "cat": "E", "stem": "Your agent has a log_workout tool that accepts exercise_type (string), value (number), and measurement (string). Production monitoring shows the agent frequently passes mismatched combinations-using measurement: \"reps\" for cardio exercises like running, or measurement: \"miles\" for strength exercises like bench press. Your exercises naturally divide into two categories: cardio (measured in time or distance) and strength (measured in reps and sets). 23% of tool calls have invalid combinations. What approach would most effectively reduce these errors?", "opts": {"A": "Add explicit examples to the tool description showing valid combinations (e.g., \"For running: use minutes or miles. For push-ups: use reps\") with constraints for each exercise category.", "B": "Implement server-side validation returning descriptive errors for invalid combinations, allowing the agent to retry with corrections.", "C": "Split into log_cardio_workout (with duration_minutes or distance_miles parameters) and log_strength_workout (with reps and sets parameters).", "D": "Add enum constraints on measurement limiting values to \"minutes\", \"miles\", \"reps\", or \"sets\" to prevent arbitrary measurement strings."}, "a": "C", "sk": ["naturally divide into two categories"], "ak": ["Split into log_cardio_workout", "log_strength_workout"], "note": "Hai nhóm tham số khác nhau → tách thành hai tool.", "ex": "Một tool xử lý quá nhiều loại dữ liệu/phân nhánh logic phức tạp (cardio + strength với tham số đo lường khác nhau) khiến LLM dễ nhầm tham số. Tách thành log_cardio_workout và log_strength_workout — schema minh bạch tuyệt đối, loại bỏ hoàn toàn nhầm lẫn giữa các loại chỉ số.\n\nTại sao các phương án khác chưa tối ưu\nA\nví dụ văn bản chỉ cải thiện phần nhỏ, LLM vẫn bỏ sót khi context dài.\nB\nserver-side validation chỉ sửa lỗi SAU khi xảy ra, tốn thêm turns, không ngăn chặn tận gốc.\nD\nenum chung cho measurement không giải quyết việc gán nhầm loại bài tập (vẫn có thể chọn \"reps\" cho chạy bộ vì cùng chung enum pool của 1 tool).", "set": "Set 2", "topic": 3}, {"n": 95, "cat": "E", "stem": "During initial testing, you notice that Claude doesn't seem to remember vocabulary words from earlier in the conversation. When a student asks \"Can you quiz me on those words?\", responds as if no words have been discussed. What is the most likely explanation?", "opts": {"A": "You're not including prior messages in each API request—the stateless API doesn't retain conversation history.", "B": "Your system prompt needs explicit instructions telling Claude to remember information from earlier turns.", "C": "The model's context window has filled up, causing earlier conversation content to be dropped.", "D": "You need to enable conversation persistence by passing a session ID parameter with each API call."}, "a": "A", "sk": ["doesn't seem to remember vocabulary words"], "ak": ["not including prior messages in each API request"], "note": "API stateless → phải gửi lại lịch sử.", "ex": "Claude API là stateless — mỗi request xử lý độc lập, không tự nhớ lượt trước. Ứng dụng phải chủ động đính kèm toàn bộ lịch sử tin nhắn (prior messages) vào payload mỗi lần gọi API.\n\nTại sao các phương án khác chưa tối ưu\nB\nsystem prompt chỉ định hình persona/quy tắc, không thay thế mảng messages lịch sử.\nC\ncontext tràn gây lỗi độ dài/cắt dữ liệu cũ, không giải thích việc xử lý như phiên hoàn toàn mới.\nD\nAPI chuẩn của Claude không dùng session ID để tự lưu lịch sử phía server — quản lý trạng thái là trách nhiệm client-side qua messages array.", "set": "Set 2", "topic": 7}, {"n": 96, "cat": "T", "stem": "A new user's first message is \"Set up my focus music.\" This could mean configure preferences, create a playlist, or play music immediately. Your system supports all three actions. What's the effective approach?", "opts": {"A": "Create a new \"Focus\" playlist with curated tracks and notify the user it's ready.", "B": "Play popular focus tracks immediately and let the user redirect if needed", "C": "Ask one clarifying question about action type: play now or configure for later", "D": "Start preference configuration by asking about genres, tempos, and artists they prefer for focus."}, "a": "C", "sk": ["could mean configure preferences, create a playlist, or play music immediately"], "ak": ["Ask one clarifying question about action type"], "note": "Bẫy cặp với câu 97/79. Ở đây hành động khác nhau hẳn và người dùng mới → hỏi MỘT câu.", "ex": "Yêu cầu mơ hồ với 3 hành động hoàn toàn khác nhau (trái ngược) — đặt MỘT câu hỏi làm rõ duy nhất trước khi thực thi, thay vì đoán mò và tự ý làm sai.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nB\ntự động thực hiện mà không hỏi có thể đi ngược ý định thực (người dùng có thể chỉ muốn cấu hình trước).\nD\nlao ngay vào cấu hình chi tiết tạo friction lớn ngay từ lệnh đầu, trong khi người dùng có thể chỉ muốn phát nhạc ngay.", "set": "Set 2", "topic": 7}, {"n": 97, "cat": "T", "stem": "Your conversational assistant frequently generates multiple clarifying questions when users make ambiguous requests. When a user asks \"Can you help me with the report?\", the assistant responds: \"I'd be happy to help! Could you tell me: 1) Which report? 2) What kind of help—drafting, reviewing, or formatting? 3) What's your deadline?\" User analytics show a 40% conversation abandonment rate after these multi-question responses. What's the most effective way to reduce friction while appropriately handling ambiguity?", "opts": {"A": "Modify the system prompt to instruct the assistant to make reasonable assumptions from available context, state those assumptions explicitly, and offer to adjust if the interpretation is wrong.", "B": "Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant.", "C": "Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers over multiple exchanges rather than requesting everything upfront.", "D": "Create a lookup table of common request patterns with predefined default interpretations, having the assistant respond with those defaults without stating the assumptions made."}, "a": "A", "sk": ["40% conversation abandonment"], "ak": ["reasonable assumptions", "state those assumptions explicitly"], "note": "Bẫy cặp với câu 96. Hỏi nhiều làm bỏ đi → giả định hợp lý, nói rõ, đề nghị chỉnh. {C} (1 câu/lượt) vẫn kéo dài.", "ex": "Nguyên tắc thiết kế Claude: \"Đừng hỏi quá nhiều nếu có thể đưa ra giả định hợp lý — nói rõ giả định đó và sẵn sàng điều chỉnh nếu sai.\" Đưa giả định dựa trên ngữ cảnh + bắt tay hỗ trợ ngay + mở ngỏ điều chỉnh — giảm số lượt trao đổi, giảm tỷ lệ bỏ cuộc, vẫn minh bạch.\n\nTại sao các phương án khác chưa tối ưu\nB\nthêm bước phân loại bằng model nhỏ tăng phức tạp kiến trúc/độ trễ không cần thiết.\nC\nchỉ hỏi 1 câu/lượt vẫn tốt hơn hỏi dồn dập nhưng nhiều lượt hỏi lại vẫn gây mất thời gian/bỏ cuộc — chủ động đoán hợp lý tốt hơn.\nD\nlookup table với default cứng nhắc không nói rõ giả định khiến người dùng bối rối khi sai.", "set": "Set 2", "topic": 7}, {"n": 98, "cat": "E", "stem": "You need to add a date validation check ensuring event dates are in the future. This requires adding a conditional statement to one existing function in a single file. What is the most appropriate approach?", "opts": {"A": "Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic", "B": "Enter plan mode first to create a detailed implementation strategy before making the change", "C": "Use direct execution to make the change", "D": "Enter plan mode to analyze how the validation might impact other parts of the reservation flow"}, "a": "C", "sk": ["one existing function in a single file"], "ak": ["direct execution"], "note": "Thay đổi nhỏ, 1 file → làm trực tiếp.", "ex": "Chỉnh sửa đơn giản, cục bộ (thêm 1 conditional vào 1 hàm, 1 file) → direct execution hiệu quả nhất, tránh lãng phí thời gian/token cho lập kế hoạch không cần thiết.\n\nTại sao các phương án khác chưa tối ưu\nA, B, D bật extended thinking hay plan mode là overkill cho chỉnh sửa code đơn giản 1 file, tăng độ trễ/quy trình không cần thiết (plan mode/extended thinking dành cho tính năng lớn, đa file, kiến trúc cao).", "set": "Set 2", "topic": 1}, {"n": 99, "cat": "E", "stem": "Your team's CLAUDE.md includes a rule: \"Use 4-space indentation and always run Prettier formatting.\" Despite this, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting — sometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (\"IMPORTANT: You MUST use Prettier formatting\") reduces violations to about 15%, but doesn't eliminate them. What is the most effective way to ensure all generated code is consistently formatted?", "opts": {"A": "Split the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching file types.", "B": "Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations.", "C": "Configure a Post ToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file Claude modifies.", "D": "Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting."}, "a": "C", "sk": ["doesn't eliminate them"], "ak": ["ToolUse hook", "automatically runs Prettier"], "note": "Cần chắc chắn 100% → hook chạy Prettier sau Edit/Write.", "ex": "Hướng dẫn tĩnh trong prompt (CLAUDE.md, emphasis, skill) chỉ mang tính định hướng, vẫn có tỷ lệ sai (15%). Post ToolUse hook với matcher Edit|Write tự động chạy Prettier ngay trên mọi file vừa sửa — giải pháp kỹ thuật chắc chắn, tự động 100%.\n\nTại sao các phương án khác chưa tối ưu\nA, B, D đều dựa vào khả năng tuân thủ của LLM (có thể trôi/bỏ sót), trong khi format code là việc cơ học mà automation hook xử lý tuyệt đối ở tầng hạ tầng.", "set": "Set 2", "topic": 1}, {"n": 100, "cat": "E", "stem": "You're implementing a caching layer for API responses to speed up the /products endpoint. You have a rough idea—Redis with a 5-minute TTL—but you're new to production caching and aren't sure what other considerations a robust implementation requires. What's the most effective way to start your iterative workflow?", "opts": {"A": "Ask Claude to interview you about the caching requirements before implementing, surfacing considerations like invalidation strategies, cache layers, consistency guarantees, and failure modes.", "B": "Write a specification with your known requirements and \"TBD\" markers for uncertain areas, having Claude propose solutions for each TBD as it implements.", "C": "Start with a minimal request: \"Add Redis caching to /products with 5-minute TTL.\" Add features and fix issues through follow-up prompts as problems surface during testing.", "D": "Use plan mode to analyze the current /products endpoint implementation, then provide your caching requirements once Claude explains how the existing code is structured."}, "a": "A", "sk": ["aren't sure what other considerations"], "ak": ["interview you"], "note": "Chưa rõ yêu cầu → để Claude phỏng vấn bạn trước.", "ex": "Người mới với kiến thức caching production hạn chế → để Claude phỏng vấn (interview) chủ động đặt câu hỏi khai thác các khía cạnh dễ bỏ sót (invalidation, consistency, failure modes) trước khi viết code — khởi đầu iterative workflow hiệu quả nhất.\n\nTại sao các phương án khác chưa tối ưu\nB\n\"TBD\" markers khi thiếu kiến thức nền khiến spec thiếu sót ý trọng yếu.\nC\nbắt đầu tối thiểu rồi sửa dần là reactive, dễ phải cấu trúc lại khi phát sinh vấn đề nghiêm trọng về invalidation/failure handling.\nD\nplan mode chỉ phân tích code hiện tại, không giải quyết thiếu hụt kiến thức kiến trúc caching của chính người dùng.", "set": "Set 2", "topic": 1}, {"n": 101, "cat": "E", "stem": "You've asked Claude to write a data migration script, but the initial output doesn't correctly handle records with null values in required fields. What's the most effective way to iterate toward a working solution?", "opts": {"A": "Add \"think harder about edge cases\" to your prompt and request a complete rewrite of the migration logic.", "B": "Describe the null value problem in detail and ask Claude to regenerate the entire script with improved edge case handling.", "C": "Manually edit the generated code to fix the null handling, then continue working with Claude on other parts.", "D": "Provide a test case with example input containing null values and the expected output, then ask Claude to fix it."}, "a": "D", "sk": ["null values in required fields"], "ak": ["test case with example input containing null values and the expected output"], "note": "Lặp tốt nhất: đưa test case input/output cụ thể.", "ex": "Test case cụ thể (input có null + expected output) cho hướng dẫn trực quan, chính xác kỹ thuật cao nhất — model xác định ngay vị trí logic cần sửa mà không cần viết lại toàn bộ script.\n\nTại sao các phương án khác chưa tối ưu\nA\nlệnh định tính chung chung (\"think harder\") không hiệu quả cho lỗi logic dữ liệu cụ thể.\nB\nregenerate toàn bộ script cho lỗi nhỏ lãng phí token, có thể phát sinh lỗi mới ở phần đã ổn định.\nC\ntự sửa thủ công bỏ qua khả năng tương tác/tự động hóa của AI.", "set": "Set 2", "topic": 1}, {"n": 102, "cat": "E", "stem": "Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other's output. What is the most effective way to run these subagents concurrently?", "opts": {"A": "Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator.", "B": "Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution at the same time.", "C": "Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message.", "D": "Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time."}, "a": "C", "sk": ["tasks are independent"], "ak": ["emit both Task tool calls", "single response message"], "note": "Song song subagent → nhiều Task call trong cùng một response.", "ex": "LLM có khả năng gọi đồng thời nhiều tool trong CÙNG một response message (parallel tool calling) khi các tác vụ độc lập. Coordinator phát cả 2 Task tool call cùng lúc → runtime xử lý song song thay vì tuần tự, giảm tối đa độ trễ.\n\nTại sao các phương án khác chưa tối ưu\nA\nxây async layer ngoài agent là overkill khi API gốc đã hỗ trợ sẵn parallel tool calling.\nB\nchỉ thêm hướng dẫn văn bản không đủ tin cậy để ép model phát tool call đồng thời nếu prompt không định hướng cụ thể.\nD\nhạ cấp model xuống Haiku chỉ tăng tốc từng tác vụ đơn lẻ, không giải quyết gốc rễ là thực thi tuần tự của hệ thống điều phối.", "set": "Set 2", "topic": 4}, {"n": 103, "cat": "T", "stem": "Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline's parser to fail. What is the most effective way to handle this?", "opts": {"A": "Split the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays.", "B": "Switch from tool_use to prompting Claude to return findings as a markdown list.", "C": "Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings.", "D": "Increase max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50 words each."}, "a": "A", "sk": ["truncated mid-JSON"], "ak": ["Split the review into multiple API calls"], "note": "Bẫy: {D} (tăng max_tokens) chỉ tạm thời. PR lớn → chia nhỏ rồi gộp kết quả.", "ex": "Chia PR lớn (30+ file) thành tập con nhỏ hơn, phân tích qua các API call riêng biệt, rồi gộp mảng findings — đảm bảo không tràn token, giữ nguyên cấu trúc tool_use.\n\nTại sao các phương án khác chưa tối ưu\nB\nchuyển sang markdown mất tính cấu trúc chặt chẽ, vẫn có nguy cơ bị cắt nếu nội dung lớn.\nC\ngiảm mức độ nghiêm trọng là giải pháp chắp vá, bỏ sót lỗi trung bình/thấp quan trọng.\nD\nmax_tokens luôn có giới hạn phần cứng, ép mô tả ngắn không giải quyết gốc rễ khi số file quá lớn.", "set": "Set 2", "topic": 1}, {"n": 104, "cat": "E", "stem": "An engineer sees an unfamiliar error message \"SYNC_CONFLICT: entity version mismatch detected\" in production logs but doesn't know which of the 12 services in the codebase generates it. They ask the agent to help locate the source code. What exploration approach will most efficiently find the responsible code?", "opts": {"A": "Use Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity version mismatch\"), then Read the matching files to understand context.", "B": "Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across services, then Read each matching file.", "C": "Read the project's README and service configuration files to understand the architecture, then systematically Read source files in service directory.", "D": "Use Grep to find all files that import the project's error handling module, then Read those files to locate custom error definitions."}, "a": "A", "sk": ["\"SYNC_CONFLICT: entity version mismatch detected\""], "ak": ["Grep to search for distinctive text from the error message"], "note": "Có chuỗi lỗi độc nhất → Grep đúng chuỗi đó.", "ex": "Grep tìm chuỗi đặc trưng/mã lỗi cụ thể (\"SYNC_CONFLICT\", \"entity version mismatch\"), rồi Read các file khớp để hiểu ngữ cảnh — kỹ thuật cốt lõi điều hướng mã nguồn cho AI Agent, trực tiếp và hiệu quả nhất.\n\nTại sao các phương án khác chưa tối ưu\nB\nGlob tìm thư mục chung chung (errors/, exceptions/) có thể bỏ sót nếu lỗi nằm trong logic nghiệp vụ thông thường.\nC\nđọc README + quét tuần tự từng file là brute-force, tốn thời gian nhất.\nD\ntìm file import module xử lý lỗi không giúp tìm trực tiếp nơi phát sinh chuỗi lỗi cụ thể.", "set": "Set 2", "topic": 2}, {"n": 105, "cat": "T", "stem": "An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn't specified which modules to prioritize. How should the agent decompose this open-ended task?", "opts": {"A": "Start writing tests for the first module alphabetically, using test failures and imports to discover related files organically.", "B": "Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning.", "C": "Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered.", "D": "Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance."}, "a": "C", "sk": ["hasn't specified which modules to prioritize"], "ak": ["map codebase structure", "prioritized plan", "revise as dependencies are discovered"], "note": "Bẫy: {D} (lịch cố định) và {B} (đọc hết). Đáp án: lập bản đồ, ưu tiên, điều chỉnh dần.", "ex": "Dùng Glob/Grep lập bản đồ cấu trúc codebase, xác định module cốt lõi/phụ thuộc lẫn nhau (heavily-coupled), xây kế hoạch ưu tiên khu vực tác động lớn, linh hoạt điều chỉnh khi phát hiện thêm phụ thuộc — chiến lược thông minh, có cấu trúc nhất cho tác vụ mở trên codebase lớn.\n\nTại sao các phương án khác chưa tối ưu\nA\nviết test theo alphabet là tùy tiện, bỏ qua tầm quan trọng nghiệp vụ/cấu trúc phụ thuộc.\nB\nđọc toàn bộ 200 file trước khi viết test lãng phí context/token lớn, không khả thi.\nD\nlịch trình cố định theo thư mục với nỗ lực đều nhau không phản ánh đúng độ phức tạp/giá trị nghiệp vụ thực tế.", "set": "Set 2", "topic": 2}, {"n": 106, "cat": "T", "stem": "Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like \"What database tables are affected by the authentication refactor in PROJ-1234?\", monitoring shows the agent makes 8-10 sequential tool calls, frequently issues exploratory calls because it lacks visibility into what content each server contains, and exhausts context space before completing complex investigations. What architectural change best leverages MCP capabilities to address these issues?", "opts": {"A": "Consolidate all three servers into a unified MCP server with cross-referencing capabilities", "B": "Add an orchestrator that routes questions to a single server based on keywords", "C": "Expose each server's content catalog as MCP resources—issue summaries, documentation hierarchy, database schemas", "D": "Add a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries"}, "a": "C", "sk": ["lacks visibility into what content each server contains"], "ak": ["MCP resources"], "note": "Bẫy: {D} (tool prepare_investigation) nghe tiện. \"Không thấy nội dung có gì\" → expose catalog bằng MCP resources.", "ex": "MCP Resources cho phép model đọc/hiểu cấu trúc, danh mục dữ liệu server một cách chủ động (issue summaries, doc hierarchy, DB schemas) mà không cần tool call thăm dò — giảm round-trips, tiết kiệm context.\n\nTại sao các phương án khác chưa tối ưu\nA\ngom 3 server thành 1 mất tính module hóa/tách biệt dịch vụ độc lập của MCP.\nB\nrouter theo keyword không giải quyết câu hỏi cross-system vì thông tin nằm rải rác nhiều server.\nD\ntool prepare_investigation trả text tự do không tận dụng nguyên lý MCP chuẩn (Resources/Prompts), vẫn quá tải context.", "set": "Set 2", "topic": 3}, {"n": 107, "cat": "E", "stem": "The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents didn't find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage. What change would most effectively improve research completeness?", "opts": {"A": "Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information.", "B": "Have the report generation agent note which research questions couldn't be answered, so users understand the limitations of the final output.", "C": "Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator.", "D": "Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before invoking synthesis again."}, "a": "D", "sk": ["three key research questions remain unanswered"], "ak": ["coordinator evaluate synthesis output for gaps", "re-delegate"], "note": "Còn thiếu → coordinator đánh giá khoảng trống và giao lại có mục tiêu.", "ex": "Coordinator điều phối vòng lặp phản hồi (feedback loop): đánh giá gap từ synthesis, re-delegate với targeted queries cho web search/document analysis để bổ sung trước khi tổng hợp lại — mô hình chuẩn đảm bảo chất lượng hoàn thiện.\n\nTại sao các phương án khác chưa tối ưu\nA\ntăng độ rộng truy vấn ban đầu chỉ thêm nhiễu vào context, không đảm bảo trúng đích thông tin đặc thù.\nB\nghi chú giới hạn chỉ là khắc phục hậu quả, không cải thiện tính hoàn thiện.\nC\ntrao quyền web search trực tiếp cho synthesis agent phá vỡ separation of concerns, sai lệch luồng điều phối tập trung.", "set": "Set 2", "topic": 4}, {"n": 108, "cat": "E", "stem": "Your documents (query) tool returns results as \"Found 3 documents: Q2 Budget Proposal, Q2 Budget Forecast, Annual Review\". You want the agent to be able to chain follow-up operations (e.g., open/read a specific document, or run further multi-step workflows) on the returned results. What return format would best enable these multi-step workflows?", "opts": {"A": "A JSON array of document titles extracted from the search results.", "B": "Structured data containing document IDs and metadata for each result.", "C": "More detailed human-readable descriptions including the size and authors.", "D": "URLs that users can click to open the document in their browser."}, "a": "B", "sk": ["chain follow-up operations"], "ak": ["document IDs and metadata"], "note": "Muốn chain thao tác → trả ID + metadata có cấu trúc.", "ex": "Để agent thực hiện multi-step workflow (gọi tiếp tool trên tài liệu như document(id)), cần trả về dữ liệu có cấu trúc chứa ID định danh duy nhất + metadata từng kết quả — agent cần ID chính xác để truyền vào tham số bước tiếp theo, không thể chỉ dựa vào tiêu đề chuỗi thô.\n\nTại sao các phương án khác chưa tối ưu\nA\nmảng JSON chỉ chứa title không có ID, không xác định chính xác tài liệu nếu trùng tiêu đề.\nC\nmô tả chi tiết kiểu con người lãng phí context, thiếu machine-readable ID.\nD\nURL phục vụ UI người dùng, không phù hợp cho tool call tự động của agent.", "set": "Set 2", "topic": 3}, {"n": 109, "cat": "T", "stem": "Your agent has access to 50+ specialized API connectors for different external services. As the connector library grew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds matching connectors, but in testing agents frequently skip searching and call connectors directly (often incorrectly), or search select wrong connectors from the filtered results. How should you design the tool composition pattern to address both issues?", "opts": {"A": "Design a find_and_execute(description, params) composite tool that searches and immediately executes the best matching connector.", "B": "Design connectors with built-in compatibility validation that return descriptive errors for mismatched requests.", "C": "Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add few-shot examples showing the correct search-then-use workflow.", "D": "Design search_connectors to dynamically add matched connectors to the agent's available tools. Connectors start unavailable and persist once discovered."}, "a": "D", "sk": ["skip searching and call connectors directly"], "ak": ["dynamically add matched connectors to the agent's available tools"], "note": "Bẫy: {A} (tool gộp tìm+chạy) và {C} (few-shot). Đáp án: connector chỉ xuất hiện sau khi tìm thấy → không thể bỏ qua bước tìm.", "ex": "2 vấn đề: (1) agent bỏ qua search, gọi thẳng connector vì luôn sẵn có; (2) chọn sai connector từ kết quả. Thiết kế search_connectors thêm ĐỘNG connector vào danh sách tool sau khi tìm thấy (giữ nguyên từ đó) — connector chưa khám phá không khả dụng/không xuất hiện trong schema, ép agent phải qua bước tìm kiếm, loại bỏ lựa chọn sai do quá tải context ban đầu.\n\nTại sao các phương án khác chưa tối ưu\nA\ngộp search+execute mất kiểm soát bước trung gian, nếu chọn sai kết quả tìm kiếm thì thực thi cũng sai ngay không có cơ hội kiểm tra.\nB\nvalidation chỉ báo lỗi SAU khi gọi sai, không ngăn được việc bỏ qua search/chọn sai từ đầu.\nC\ncải thiện mô tả + few-shot không giải quyết triệt để quá tải khi 50+ connector, context vẫn loãng.", "set": "Set 2", "topic": 3}, {"n": 110, "cat": "E", "stem": "Your publish article tool calls an external CMS API that occasionally returns transient errors (network timeouts, 503s) and non-transient errors (403 permission denied, 422 validation failure). Currently, every error is returned directly to the agent, which leads to the agent retrying non-transient errors and wasting turns on failures that will never succeed. How should you partition error-handling responsibility between the tool implementation and the agent?", "opts": {"A": "Implement a universal error handler that catches all exceptions and returns a generic \"tool unavailable-try again later\" message, shielding the agent from error complexity.", "B": "Surface all errors to the agent immediately with detailed context, and let the agent decide which errors to retry and how many times-keeping the tool implementation stateless and simple.", "C": "Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation failures) to the agent with descriptive messages so it can take corrective action.", "D": "Handle all errors inside the tool: implement retries with exponential backoff for every error type, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted."}, "a": "C", "sk": ["transient errors", "non-transient errors"], "ak": ["Handle transient errors", "automatic retries inside the tool", "surface non-transient errors"], "note": "Lỗi tạm → tool tự retry; lỗi vĩnh viễn → báo agent kèm mô tả.", "ex": "Separation of concerns: lỗi tạm thời (timeout, 503) tự động retry ngầm trong tool — giảm tải vòng lặp agent, tiết kiệm token. Lỗi vĩnh viễn/logic (403, 422) trả về kèm message rõ ràng cho agent để thực hiện hành động khắc phục (sửa input, xin quyền).\n\nTại sao các phương án khác chưa tối ưu\nA\nbọc tất cả thành message chung mất thông tin chi tiết, agent không phân biệt lỗi nào cần sửa/chờ.\nB\nbắt agent tự retry cả lỗi mạng lãng phí turns, phức tạp hóa vòng lặp không cần thiết.\nD\nretry cả lỗi không bao giờ thành công (403, 422) là vô nghĩa, lãng phí tài nguyên.", "set": "Set 2", "topic": 3}, {"n": 111, "cat": "E", "stem": "Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then book_appointment(provider_id, slot_time, patient_id) to reserve a slot. Tickets show that 15% of booking attempts fail with \"slot no longer available\" because another user booked the slot between the availability check and the booking call. How should you refactor these tools?", "opts": {"A": "Combine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives.", "B": "Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the agent to call it between checking availability and booking.", "C": "Modify book_appointment to return detailed failure information including currently available alternative slots when the requested slot is unavailable, enabling the agent to retry with a different time.", "D": "Keep both tools but add retry logic to the agent's system prompt, instructing it to call get_available_slots again and select a different time if booking fails."}, "a": "A", "sk": ["another user booked the slot between"], "ak": ["atomically checks availability and books"], "note": "Race condition → gộp thành một thao tác atomic.", "ex": "Race condition do độ trễ giữa check availability và book. Gộp thành một thao tác nguyên tử (atomic) find_and_book_appointment — kiểm tra + khóa chốt trong cùng transaction, loại bỏ hoàn toàn khả năng bị chiếm chỗ giữa chừng.\n\nTại sao các phương án khác chưa tối ưu\nB\nhold_slot vẫn là bước rời rạc bổ sung, có thể gọi nhầm thứ tự hoặc tranh chấp ở chính bước tạm giữ khi traffic cao.\nC\nchỉ xử lý SAU khi lỗi đã xảy ra (reactive), không ngăn 15% tỷ lệ thất bại ban đầu.\nD\nretry thủ công qua system prompt tăng round-trips, không giải quyết atomicity ở cấp database.", "set": "Set 2", "topic": 3}, {"n": 112, "cat": "T", "stem": "Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that succeed when immediately retried, while 4% are query syntax errors from malformed user-provided filters that never succeed regardless of retry attempts. Currently, both error types are returned to the agent identically, causing it to waste turns retrying syntax errors and telling users to \"try again later\" for timeouts. How should you modify the tool's error handling?", "opts": {"A": "Return all errors with a retryable boolean flag and error type details.", "B": "Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details.", "C": "Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors and handle each case appropriately.", "D": "Apply exponential backoff retry logic to all errors uniformly, returning a generic \"service temporarily unavailable\" message after max retries are exhausted."}, "a": "B", "sk": ["8% are network timeouts", "4% are query syntax errors"], "ak": ["automatic retry with backoff for network timeouts inside the tool", "return syntax errors immediately"], "note": "Bẫy: {A} (retryable flag) giống đáp án câu 49/55. Ở đây phân rõ timeout → tool tự retry; lỗi cú pháp → trả ngay kèm chi tiết.", "ex": "Lỗi mạng (8%, transient) → tool tự retry/backoff bên trong, agent không tốn turn. Lỗi cú pháp (4%, non-transient, do user) → trả về ngay kèm validation details để agent thông báo chính xác cho người dùng sửa tham số.\n\nTại sao các phương án khác chưa tối ưu\nA\nép agent tự xử lý cờ retryable vẫn tốn turns, tăng phức tạp vòng lặp.\nC\nfew-shot không giải quyết triệt để lỗi mạng tự xử lý được, tốn thêm context token.\nD\nbackoff đồng nhất cho cả lỗi cú pháp sai nguyên tắc — lỗi cú pháp không bao giờ thành công dù retry, agent bị kẹt vòng lặp vô ích.", "set": "Set 2", "topic": 3}, {"n": 113, "cat": "T", "stem": "Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return confidence scores (0.0-1.0) for each extracted field. In production, you observe: (1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent requests unnecessary human review for 31% of extractions that were actually correct. How should you restructure the tool's output?", "opts": {"A": "Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review.", "B": "Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review.", "C": "Compute an aggregate extraction quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability.", "D": "Return fields organized into verified and needs_verification objects based on confidence thresholds."}, "a": "A", "sk": ["unnecessary human review"], "ak": ["requires_review boolean computed using your tested confidence thresholds", "review_reasons"], "note": "Bẫy: {D} chia hai nhóm nhưng thiếu lý do. Tool tự tính requires_review theo ngưỡng đã kiểm định + lý do.", "ex": "Tiền xử lý trong tool/backend: áp dụng threshold đã kiểm thử tính sẵn requires_review boolean + review_reasons array giải thích nguyên nhân. Giải phóng model khỏi việc tự suy luận toán học/ngưỡng từ điểm số thô — giảm sai sót đáng kể.\n\nTại sao các phương án khác chưa tối ưu\nB\nfew-shot vẫn bắt model tự xử lý số liệu thô, không loại bỏ thiếu nhất quán khi LLM đánh giá xác suất.\nC\naggregate score mất thông tin chi tiết từng trường, agent không xác định được trường nào lỗi.\nD\nchia cứng 2 object mất confidence score chi tiết cần thiết cho từng trường riêng lẻ.", "set": "Set 2", "topic": 3}, {"n": 114, "cat": "T", "stem": "Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and away_team (string) parameters. Production logs reveal recurring issues: the agent uses team nicknames instead of official names, applies inconsistent date formats, and selects the wrong game when teams have rematches in the same season. What tool interface change would effectively prevent these errors?", "opts": {"A": "Replace the three parameters with a single game_id parameter and a separate search_games lookup tool that returns matching game IDs.", "B": "Add enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing ISO 8601 format for the date parameter.", "C": "Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the resolved game details for the agent to verify before the score is committed.", "D": "Add detailed examples to the tool description showing the required date format and complete list of official team names."}, "a": "A", "sk": ["team nicknames", "rematches"], "ak": ["single game_id parameter", "search_games lookup tool"], "note": "Bẫy: {B} (enum + regex) sửa tên/ngày nhưng không giải quyết trận đấu lại. Dùng ID + tool tra cứu.", "ex": "Tách biệt search_games (tool tra cứu trả về game_id chính xác) và update_game_score (chỉ nhận game_id duy nhất) — ép agent phải search trước, loại bỏ hoàn toàn phỏng đoán thủ công về tên đội/ngày tháng/trận tái đấu.\n\nTại sao các phương án khác chưa tối ưu\nB\nenum + regex vẫn buộc agent tự quyết định giá trị từ ngữ cảnh tự do, không giải quyết chọn nhầm trận rematch cùng mùa.\nC\nconfirm flag không ngăn chọn nhầm từ đầu, chỉ thêm vòng lặp xác nhận tốn kém.\nD\nví dụ trong description chỉ là hướng dẫn mềm, không ngăn LLM sai lệch khi context dài/nhiều tên đội.", "set": "Set 2", "topic": 3}, {"n": 115, "cat": "E", "stem": "You've configured the system so that all four subagents have access to the complete set of 18 tools. During testing, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and the report generator tries to analyze documents. What is the primary cause of this poor tool selection behavior?", "opts": {"A": "The agents' role descriptions in their system prompts conflict with having access to tools outside that role.", "B": "The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks.", "C": "Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds.", "D": "The tool definitions consume too much context window space, leaving insufficient room for task content."}, "a": "C", "sk": ["complete set of 18 tools"], "ak": ["18 tools instead of 4-5 relevant ones"], "note": "Quá nhiều tool → chọn sai. Giới hạn 4-5 tool mỗi agent.", "ex": "Số lượng tool quá lớn (18 thay vì 4-5 chuyên biệt) tăng độ phức tạp lựa chọn vượt ngưỡng tin cậy của model (decision complexity/attention dilution) → dễ gọi nhầm tool ngoài chuyên môn. Giải pháp chuẩn: phân tách bộ tool phù hợp riêng cho từng agent.\n\nTại sao các phương án khác chưa tối ưu\nA\nxung đột system prompt không phải nguyên nhân chính.\nB\nvấn đề là subagent tự gọi sai tool, không phải coordinator định tuyến sai. D 18 tool thường không chiếm đủ context để gây nghẽn — vấn đề cốt lõi là decision space quá rộng, không phải context bloat.", "set": "Set 2", "topic": 4}, {"n": 116, "cat": "T", "stem": "You've documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes follows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency appears random across different coding sessions. What's the most efficient first diagnostic step?", "opts": {"A": "Create path-specific rules in .claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files.", "B": "Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types.", "C": "Run /memory to check which memory files are loaded and verify your CLAUDE.md is included.", "D": "Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions."}, "a": "C", "sk": ["most efficient first diagnostic step"], "ak": ["Run /memory"], "note": "Bẫy: các phương án khác là CÁCH SỬA, đề hỏi bước CHẨN ĐOÁN đầu tiên → /memory xem file nào được nạp.", "ex": "Hành vi không nhất quán ngẫu nhiên giữa các session → bước chẩn đoán nhanh nhất là kiểm tra xem hệ thống có thực sự nạp CLAUDE.md hay không. Lệnh /memory kiểm tra các memory file đang được tải vào context, xác định file có bị bỏ qua/lỗi cấu hình trước khi thử giải pháp phức tạp hơn.\n\nTại sao các phương án khác chưa tối ưu\nA\ntạo rules mới chỉ là tinh chỉnh nâng cao, không giải quyết gốc rễ vì sao CLAUDE.md hiện tại lúc tuân thủ lúc không.\nB\nthêm ví dụ không khắc phục tình trạng file không được load/đọc.\nD\ntìm kiếm config toàn cục (~/.claude/) là bước quá sâu, không phải chẩn đoán nhanh đầu tiên.", "set": "Set 2", "topic": 1}, {"n": 117, "cat": "E", "stem": "Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. Reviews are non-blocking—developers merge after tests pass and address findings in follow-up commits. You're evaluating the Message Batches API for its 50% cost reduction. What factor most determines whether batch processing is appropriate for this use case?", "opts": {"A": "Whether your result processing can handle reviews arriving in a different order than submitted.", "B": "Whether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow.", "C": "Whether review feedback arriving up to 24 hours after PR creation remains actionable.", "D": "Whether you can structure each review as a single request without multi-turn refinement."}, "a": "C", "sk": ["non-blocking"], "ak": ["up to 24 hours after PR creation remains actionable"], "note": "Batch có thể mất tới 24h → yếu tố quyết định là kết quả trễ có còn dùng được không.", "ex": "Đặc điểm cốt lõi của Batch API: xử lý bất đồng bộ, có thể mất tới 24h. Yếu tố quyết định là feedback đến chậm (vài giờ đến 24h sau khi PR tạo) có còn actionable với quy trình hay không (vd code đã merge/nhánh đã xóa thì feedback vô nghĩa).\n\nTại sao các phương án khác chưa tối ưu\nA\nBatch API trả kết quả kèm custom_id ánh xạ ngược, thứ tự không phải vấn đề cốt lõi.\nB\nBatch API vốn không bao giờ near-instant (tính bằng giờ) — câu hỏi là có chấp nhận độ trễ đó không, không phải kỳ vọng giảm xuống near-instant.\nD\nBatch request hỗ trợ payload đa dạng, không bắt buộc single request tuyệt đối.", "set": "Set 2", "topic": 1}, {"n": 118, "cat": "E", "stem": "After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history includes: (1) the user mentioning a guest has a severe shellfish allergy, (2) measurements for scaling recipes to 8 servings, (3) the user's clarification that \"room temperature butter\" means 68°F in their kitchen, and (4) general back-and-forth about meal timing and presentation. You need to implement context management before the window limit is reached. What approach best balances information preservation with token reduction?", "opts": {"A": "Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and retain recent exchanges verbatim.", "B": "Store the full conversation externally and use semantic search to retrieve relevant portions for each turn, loading only matching segments into context.", "C": "Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state important information when relevant.", "D": "Summarize the entire conversation history into a concise summary capturing main topics discussed, then append new messages going forward."}, "a": "A", "sk": ["severe shellfish allergy"], "ak": ["Extract critical structured data", "summarize general discussion", "retain recent exchanges verbatim"], "note": "Dữ kiện quan trọng (dị ứng, số người...) tách riêng có cấu trúc; phần chung tóm tắt.", "ex": "Kết hợp: trích xuất dữ liệu quan trọng có cấu trúc (dị ứng, số khẩu phần, thuật ngữ riêng) vào reference section, tóm tắt thảo luận chung, giữ nguyên trao đổi gần nhất — bảo toàn thông tin cốt lõi/nhạy cảm không mất qua tóm tắt cẩu thả, vẫn giảm token đáng kể.\n\nTại sao các phương án khác chưa tối ưu\nB\nlưu ngoài + semantic search mất tính liên tục ngữ cảnh, tốn chi phí/độ trễ tìm kiếm liên tục.\nC\nsliding window mất vĩnh viễn thông tin quan trọng đầu phiên (dị ứng, nhiệt độ bơ) nếu ngoài cửa sổ.\nD\ntóm tắt toàn bộ thành đoạn chung chung làm thất thoát chi tiết chính xác (số liệu, dị ứng nghiêm trọng) cần cho câu hỏi tiếp theo.", "set": "Set 2", "topic": 7}, {"n": 119, "cat": "E", "stem": "Your resource allocation tool returns a simple acknowledgment message after provisioning is requested. Users frequently approve allocations and immediately ask \"how much did that cost?\" or \"which project was that?\" - indicating they confirmed without understanding the request. What tool design change would most effectively address this?", "opts": {"A": "Return structured data including cost estimate, target project, resource specifications, and impact summary in the tool response", "B": "Add a detail_level parameter with options \"minimal\" or \"comprehensive\" that controls how much context the agent presents in confirmations", "C": "Implement a 60-second hold before execution completes, allowing users time to review pending allocations and cancel if needed", "D": "Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only set it after the user explicitly confirms they reviewed the details"}, "a": "A", "sk": ["confirmed without understanding"], "ak": ["structured data including cost estimate, target project"], "note": "Người dùng không hiểu mình xác nhận gì → trả đủ chi tiết (chi phí, dự án...).", "ex": "Vấn đề gốc: tool chỉ trả acknowledgment đơn giản, thiếu chi tiết. Trả về structured data đầy đủ (chi phí ước tính, dự án mục tiêu, thông số, tóm tắt tác động) ngay trong response — cung cấp đủ ngữ cảnh cho model hiển thị lại cho người dùng trước khi xác nhận.\n\nTại sao các phương án khác chưa tối ưu\nB\ndetail_level không giải quyết nếu tool vẫn chỉ trả message thành công đơn giản, thiếu dữ liệu thực tế.\nC\ntrì hoãn 60s gây bất tiện UX, không giải quyết thiếu thông tin hiển thị.\nD\nuser_acknowledged boolean không cung cấp dữ liệu định lượng (chi phí, tên dự án) — người dùng vẫn mù mờ khi xác nhận.", "set": "Set 2", "topic": 3}, {"n": 120, "cat": "E", "stem": "Your search products tool queries an external catalog API that returns paginated results (50 items per request). Production logs show queries frequently match 200+ products, and the design that auto-fetches all pages causes 15-20 second delays. How should you redesign the pagination handling?", "opts": {"A": "Add a max_pages parameter (default: 2) that controls how many pages are fetched internally.", "B": "Create separate search_products and fetch_more_results tools for pagination.", "C": "Return the first page with total match count and cursor for additional pages.", "D": "Implement server-side relevance ranking and return only the top 50 most relevant items."}, "a": "C", "sk": ["auto-fetches all pages causes 15-20 second delays"], "ak": ["first page with total match count and cursor"], "note": "Phân trang chuẩn: trang đầu + tổng số + cursor.", "ex": "Auto-fetch tất cả trang ngầm trong 1 lần gọi là anti-pattern, gây chậm (15-20s) + quá tải context. Trả về trang đầu kèm tổng số khớp + cursor phân trang — model/user tự quyết định gọi tiếp trang sau qua tham số điều hướng, tối ưu độ trễ phản hồi ban đầu.\n\nTại sao các phương án khác chưa tối ưu\nA\nmax_pages ngầm định vẫn ép tool tự fetch nhiều trang trước khi trả về, không giải quyết triệt để độ trễ khi cần nhiều trang.\nB\ntạo tool rời rạc không cần thiết so với cursor linh hoạt ngay trong tool tìm kiếm.\nD\ncắt còn 50 item theo ranking server có thể mất mục quan trọng ở trang sau mà người dùng thực sự cần.", "set": "Set 2", "topic": 3}, {"n": 121, "cat": "T", "stem": "Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a malformed request, missing the required user_email parameter (2) the calendar API returns a 404 because the specified user doesn't exist in the calendar system (3) the calendar API returns a 503 because the service is temporarily unavailable. How should each error be reported according to MCP's error handling design?", "opts": {"A": "Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true", "B": "Report all three as tool results with isError: true", "C": "Report all three as JSON-RPC protocol errors.", "D": "Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true"}, "a": "D", "sk": ["missing the required user_email parameter", "404", "503"], "ak": ["error 1 as a JSON-RPC protocol error", "errors 2 and 3 as tool results with isError: true"], "note": "Bẫy: {A} xếp lỗi 404 vào lỗi giao thức. Chỉ request sai định dạng mới là lỗi JSON-RPC; lỗi nghiệp vụ và lỗi dịch vụ đều là tool result isError.", "ex": "Lỗi 1 (thiếu tham số bắt buộc, request sai schema JSON-RPC) là lỗi cấp giao thức (protocol-level, vd Invalid params -32602) → trả trực tiếp JSON-RPC protocol error. Lỗi 2 & 3 (404, 503 từ calendar API) là lỗi thực thi tool (tool execution error) — request về mặt giao thức vẫn hợp lệ, chỉ là kết quả thực thi thất bại → trả về dưới dạng tool result kèm isError: true để LLM đọc và xử lý.", "set": "Set 3", "topic": 3}, {"n": 122, "cat": "E", "stem": "Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a recurring pattern: when recipes use informal measurements like \"a handful\" or \"a splash,\" the model either invents specific amounts or leaves fields empty—accounting for 23% of all corrections. How should you use this feedback to improve extraction accuracy?", "opts": {"A": "Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty.", "B": "Add few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them.", "C": "Update your JSON schema to add a \"measurement_type\" enum field (precise/informal).", "D": "Fine-tune the model on the 847 corrected extractions."}, "a": "B", "sk": ["informal measurements"], "ak": ["few-shot examples", "extracting them verbatim"], "note": "Mẫu lỗi lặp lại → few-shot, trích nguyên văn. Fine-tune là quá tay.", "ex": "Model chưa được hướng dẫn rõ cách xử lý đo lường ước chừng (\"a handful\", \"a splash\") nên tự suy đoán hoặc bỏ trống. Few-shot examples mô tả cách trích xuất nguyên văn (verbatim) là giải pháp nhanh, hiệu quả nhất để sửa hành vi mà không cần can thiệp hệ thống phức tạp.\n\nTại sao các phương án khác chưa tối ưu\nA\npattern matching bằng code rất giòn (brittle), khó bao quát đa dạng ngôn ngữ tự nhiên.\nC\nthêm enum chỉ làm rõ cấu trúc output, không dạy model nhận biết/trích xuất đúng nội dung.\nD\nfine-tune tốn kém, phức tạp, không cần thiết khi prompt engineering giải quyết được triệt để.", "set": "Set 3", "topic": 5}, {"n": 123, "cat": "E", "stem": "You're the Lead Data Scientist/Engineer on a critical project analyzing test coverage. You've identified two distinct testing strategies you want to develop independently: end-to-end tests and snapshot tests, building on the same analysis session's context. How do you manage this scenario?", "opts": {"A": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.", "B": "Export the analysis session's key findings to a file, then create two new sessions that reference this file.", "C": "Start two fresh sessions, having each re-read the relevant source files before beginning.", "D": "Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}, "a": "D", "sk": ["develop independently", "building on the same analysis session's context"], "ak": ["fork_session enabled"], "note": "Giống câu 10: fork_session.", "ex": "fork_session nhân bản phiên hiện tại từ baseline chung, tạo các nhánh độc lập nhưng vẫn giữ nguyên ngữ cảnh/dữ liệu phân tích/lịch sử trước đó — tiết kiệm token/thời gian, không phải đọc lại từ đầu, hai luồng testing không ảnh hưởng lẫn nhau.\n\nTại sao các phương án khác chưa tối ưu\nA\nthực hiện nối tiếp trong cùng phiên làm context dài, nhiễu thông tin giữa 2 phương pháp, tăng attention dilution. B &\nC\ntạo phiên mới hoàn toàn tốn kém thời gian/token, mất công thiết lập lại ngữ cảnh đã có.", "set": "Set 3", "topic": 2}, {"n": 124, "cat": "T", "stem": "Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall is 41% but API design recall drops to 68%. How should you address this trade-off to improve detection across both categories?", "opts": {"A": "Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off.", "B": "Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds.", "C": "Provide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic.", "D": "Split the review into separate focused prompts - one for security and API design, another for business logic - each with dedicated examples, then combine findings before posting."}, "a": "D", "sk": ["logic recall is 41% but API design recall drops to 68%"], "ak": ["Split the review into separate focused prompts"], "note": "Bẫy: {B} (checklist) vẫn trong một prompt nên vẫn đánh đổi. Tách prompt theo mối quan tâm rồi gộp kết quả.", "ex": "Prompt Congestion/Trade-off: nhồi quá nhiều nhiệm vụ + few-shot đa dạng vào 1 prompt gây attention dilution, thêm ví dụ cho logic làm suy giảm khả năng tập trung vào API design. Tách thành các prompt chuyên biệt (security+API design riêng, business logic riêng), mỗi luồng dùng few-shot tối ưu riêng, gộp kết quả trước khi đăng — best practice cho AI agent phân tích phức tạp.\n\nTại sao các phương án khác chưa tối ưu\nA\nnâng cấp model không giải quyết gốc rễ xung đột yêu cầu/ví dụ trong cùng 1 prompt.\nB\nchecklist thay few-shot không giải quyết việc giảm tập trung khi xử lý đồng thời nhiều tiêu chí.\nC\nnhồi toàn bộ repo tăng nhiễu/chi phí token, khó phát hiện lỗi logic hơn.", "set": "Set 3", "topic": 1}, {"n": 125, "cat": "T", "stem": "Your code review assistant needs to analyze pull requests and provide feedback on three aspects: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the same three-step workflow for every PR. Which task decomposition pattern is most appropriate for this workflow?", "opts": {"A": "Orchestrator-workers—have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask.", "B": "Single comprehensive prompt—include all instructions in one prompt and let the model handle all three aspects simultaneously.", "C": "Routing—classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category.", "D": "Prompt chaining—break the review into sequential steps where each aspect (style, security, documentation) is analyzed separately, with outputs combined in a final synthesis step."}, "a": "D", "sk": ["follows the same three-step workflow for every PR"], "ak": ["Prompt chaining"], "note": "Bẫy: {A} orchestrator-workers nghe mạnh, nhưng quy trình CỐ ĐỊNH giống nhau mỗi PR → prompt chaining.", "ex": "Quy trình đánh giá PR cố định, lặp lại giống hệt cho mọi PR (3 bước: style → security → documentation → tổng hợp). Prompt Chaining phù hợp nhất khi output bước này là input bước sau theo thứ tự tuyến tính/cố định — đơn giản, đáng tin cậy nhất cho quy trình lặp lại này.\n\nTại sao các phương án khác chưa tối ưu\nA\norchestrator-workers dùng khi subtask cần quyết định ĐỘNG tùy trường hợp, ở đây quy trình cố định cho mọi PR.\nB\nsingle prompt dễ quá tải ngữ cảnh, giảm chính xác khi xử lý đồng thời nhiều tiêu chí.\nC\nrouting chỉ phù hợp khi cần phân loại đầu vào để rẽ nhánh xử lý khác nhau — ở đây mọi PR đều qua đúng 3 bước như nhau.", "set": "Set 3", "topic": 1}, {"n": 126, "cat": "E", "stem": "After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the synthesis subagent to synthesize the findings. What is the correct approach for providing the synthesis subagent with the information it needs?", "opts": {"A": "Provide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks", "B": "Spawn the subagent with only a brief task description, relying on automatic context inheritance from the coordinator", "C": "Include the complete findings from both subagents directly in the synthesis subagent's prompt", "D": "Pass reference identifiers and configure the subagent with read access to a shared memory store where other subagents deposited their results"}, "a": "C", "sk": ["What is the correct approach for providing the synthesis subagent"], "ak": ["Include the complete findings from both subagents directly in the synthesis subagent's prompt"], "note": "Subagent không kế thừa context → nhét thẳng kết quả vào prompt.", "ex": "Trong kiến trúc đa agent tiêu chuẩn, các subagent chạy trong context window độc lập và không giao tiếp trực tiếp với nhau. Coordinator giữ vai trò trung tâm: thu thập kết quả các subagent trả về, rồi đưa các phát hiện liên quan trực tiếp vào prompt khi spawn synthesis subagent — đây là cách kiểm soát ngữ cảnh chuẩn của vòng lặp coordinator.\n\nTại sao các phương án khác chưa tối ưu\nA\nsubagent không đòi output lẫn nhau qua callback — luồng thông tin đi qua coordinator chứ không phải kết nối trực tiếp giữa các subagent.\nB\nsubagent không tự động kế thừa context từ coordinator; mỗi subagent luôn khởi tạo context mới độc lập nên chỉ \"mô tả nhiệm vụ ngắn\" sẽ thiếu dữ liệu cần thiết.\nD\nshared memory store + reference identifiers không phải mô hình luồng thông tin tiêu chuẩn của hệ thống agent LLM — kiểm soát ngữ cảnh nằm ở vòng lặp coordinator, không phải ở kho nhớ chung.", "set": "Set 3", "topic": 4}, {"n": 127, "cat": "E", "stem": "An engineer asks the agent to find all files in the monorepo that import the @company/auth package to understand how authentication is used across services. Which built-in tool is most appropriate for this task?", "opts": {"A": "Grep, to search for the import statement pattern across file contents", "B": "Read, starting with package.json files to trace dependency declarations", "C": "Glob, to find files with \"auth\" in their filename or path", "D": "Bash, to execute find . -type d -name \"*auth*\" and explore matching directories"}, "a": "A", "sk": ["import the @company/auth package"], "ak": ["Grep, to search for the import statement pattern"], "note": "Tìm theo NỘI DUNG file → Grep (Glob là tìm theo tên file).", "ex": "Tìm câu lệnh import '@company/auth' là bài toán tìm chuỗi/regex trong NỘI DUNG file — đúng chuyên môn của Grep.\n\nTại sao các phương án khác chưa tối ưu\nB\nRead chỉ đọc 1 file đã biết đường dẫn, không tìm đồng loạt; package.json chỉ biết dự án nào khai báo dependency, không biết file nào import trực tiếp.\nC\nGlob chỉ tìm theo tên file/đường dẫn, không tìm nội dung bên trong.\nD\nBash find chỉ tìm tên thư mục/file, không tìm nội dung; nên ưu tiên built-in tool chuyên dụng (Grep) thay vì gọi shell không cần thiết.", "set": "Set 3", "topic": 2}, {"n": 128, "cat": "E", "stem": "Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls delete_file when users ask to \"remove old backups,\" policy requires archiving backup files. Both tools currently have minimal descriptions: \"Archives a file\" and \"Deletes a file.\" Which change most directly improves tool selection?", "opts": {"A": "Expand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to delete_file.", "B": "Add a confirmation step that requires users to type \"CONFIRM DELETE\" before delete_file executes.", "C": "Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file.", "D": "Add few-shot examples to the system prompt demonstrating that requests involving \"backup\" or \"old\" should use archive_file."}, "a": "A", "sk": ["minimal descriptions"], "ak": ["Expand tool descriptions to clarify use cases"], "note": "Description sơ sài → mở rộng description (kèm \"không dùng cho backup\").", "ex": "LLM chọn tool chủ yếu dựa vào Tool Description. Mở rộng mô tả trực tiếp trong delete_file (\"Do not use for backup files\") là cách trực tiếp, chuẩn nhất theo nguyên tắc MCP để hướng dẫn model phân biệt đúng khi nào dùng archive_file.\n\nTại sao các phương án khác chưa tối ưu\nB\nconfirmation step là safety guardrail ngăn thao tác nguy hiểm, không giúp model học chọn đúng tool từ đầu.\nC\nserver-side validation là giải pháp reactive (xử lý sau khi lỗi xảy ra), tốn thêm vòng lặp retry.\nD\nfew-shot tốn token system prompt, kém linh hoạt hơn định nghĩa trực tiếp trong tool schema.", "set": "Set 3", "topic": 3}, {"n": 129, "cat": "T", "stem": "Your CRM agent's delete_contact tool handles requests like \"delete the duplicate entry for Acme Corp.\" The database contains similarly named records (e.g., \"Acme Corp,\" \"Acme Corporation,\" \"ACME Corp Inc.\"), and analytics show 8% of deletions are reversed within 24 hours due to misidentified records. Users have also complained that the current multi-step confirmation flow adds too much friction to routine cleanup tasks. Which approach most effectively reduces the error rate while maintaining workflow efficiency?", "opts": {"A": "Deploy automated duplicate detection that identifies and merges probable duplicates, removing the need for manual deletion requests.", "B": "Present matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion.", "C": "Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the deletion workflow.", "D": "Require users to supply the exact record ID from the CRM interface rather than using natural language references to contact names."}, "a": "B", "sk": ["similarly named records", "too much friction"], "ak": ["matched records with differentiating fields", "single-click confirmation"], "note": "Bẫy: {C} soft-delete không giảm lỗi chọn sai. Hiện các bản gh
