<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khóa ôn CCAR-F</title>
<style>
:root{--bg:#f4f5f7;--side:#fff;--card:#fff;--fg:#1b2130;--muted:#667085;--line:#e4e7ec;--acc:#4f46e5;--accbg:#eef0ff;--ok:#12805c;--okbg:#e3f6ed;--bad:#c0362c;--badbg:#fdecea;--trap:#b54708;--trapbg:#fff3e2;--easy:#175cd3;--easybg:#e9f1ff;--hl:#ffeb8a;--hlfg:#1b2130;--note:#f4f1ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121419;--side:#181b21;--card:#1d2027;--fg:#e8eaef;--muted:#98a2b3;--line:#2c313b;--acc:#8b87ff;--accbg:#25244a;--ok:#4ade80;--okbg:#13301f;--bad:#f87171;--badbg:#3a1b1b;--trap:#fdb022;--trapbg:#38280f;--easy:#84adff;--easybg:#152443;--hl:#5e4f10;--hlfg:#fff7cc;--note:#24223d}}
:root[data-theme="dark"]{--bg:#121419;--side:#181b21;--card:#1d2027;--fg:#e8eaef;--muted:#98a2b3;--line:#2c313b;--acc:#8b87ff;--accbg:#25244a;--ok:#4ade80;--okbg:#13301f;--bad:#f87171;--badbg:#3a1b1b;--trap:#fdb022;--trapbg:#38280f;--easy:#84adff;--easybg:#152443;--hl:#5e4f10;--hlfg:#fff7cc;--note:#24223d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--side);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;white-space:nowrap}
.top .grow{flex:1;min-width:0}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;max-width:320px}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.ptxt{font-size:12px;color:var(--muted);margin-top:2px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;white-space:nowrap}
#menuBtn{display:none}
.layout{display:flex;min-height:calc(100% - 56px)}
aside{width:300px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:12px 10px 40px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
.ch{margin-bottom:10px}
.chh{display:flex;align-items:center;gap:8px;padding:8px;font-weight:700;font-size:14px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-size:12px}
.chh .cnt{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted)}
.ls{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px 7px 40px;border-radius:8px;cursor:pointer;font-size:14px}
.ls:hover{background:var(--bg)}
.ls.on{background:var(--accbg);color:var(--acc);font-weight:600}
.ls .st{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.ls .ic{width:18px;flex:none;text-align:center}
.ls.full .st{color:var(--ok);font-weight:700}
main{flex:1;min-width:0;padding:24px 16px 80px}
.box{max-width:780px;margin:0 auto}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
h2{font-size:22px;margin:0 0 6px;line-height:1.3}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.dot{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-size:11.5px;cursor:pointer;display:grid;place-items:center;padding:0}
.dot.cur{outline:2px solid var(--acc);outline-offset:1px}
.dot.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.badge{font-weight:700;border-radius:99px;padding:1px 9px;font-size:12px}
.badge.T{background:var(--trapbg);color:var(--trap)}.badge.E{background:var(--easybg);color:var(--easy)}
.stem{font-size:16px;font-weight:500;margin:0 0 14px;overflow-wrap:anywhere}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;margin:8px 0;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt .L{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt .og{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;padding-top:3px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad .L{background:var(--bad);color:#fff}
mark.k{background:var(--hl);color:var(--hlfg);font-weight:800;padding:0 2px;border-radius:3px}
.hide-k mark.k{background:none;color:inherit;font-weight:inherit;padding:0}
.res{font-weight:700;margin:14px 0 8px}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.note{background:var(--note);border-radius:10px;padding:10px 12px;font-size:14.5px}
details{margin-top:10px;font-size:13.5px;color:var(--muted)}
details pre{white-space:pre-wrap;font:inherit;margin:6px 0 0}
summary{cursor:pointer}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.rules{margin:0;padding-left:20px}.rules li{margin:8px 0}
code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:.88em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left}
.cc:hover{border-color:var(--acc)}
.cc b{display:block;margin:6px 0 8px;line-height:1.35}
.cc .pbar{max-width:none;height:6px}
.big{font-size:40px;font-weight:800;margin:4px 0}
.wl{margin:10px 0 0;padding:0;list-style:none}.wl li{padding:6px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 16px}
.scrim{display:none}
@media (max-width:860px){
 #menuBtn{display:inline-block}
 .top h1{display:none}
 aside{position:fixed;left:0;top:56px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px #0004}
 body.menu aside{transform:none}
 body.menu .scrim{display:block;position:fixed;inset:56px 0 0;background:#0005;z-index:25}
 .card{padding:14px}
}
</style></head><body>

<script>
const D=[{"n": 1, "cat": "E", "stem": "A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 responses. The codebase has 200+ files and the developer doesn't know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers. What task decomposition approach would be most effective?", "opts": {"A": "Have the agent first create a comprehensive plan mapping all code paths through documented components before beginning any exploration or code reading.", "B": "Define a fixed sequence of investigation steps upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code.", "C": "Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges.", "D": "Run parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path."}, "a": "C", "sk": ["doesn't know which components are involved"], "ak": ["dynamically generate investigation subtasks", "adapting its exploration plan"], "note": "Không biết trước thành phần nào → kế hoạch thích ứng (dynamic), không lập plan cố định.", "ex": "Trong các bài toán xử lý sự cố (troubleshooting) với một hệ thống phức tạp hoặc cơ sở mã lớn (codebase 200+ file) mà không biết rõ các thành phần liên quan, phương pháp tiếp cận linh hoạt (dynamic/adaptive) luôn mang lại hiệu quả cao nhất:\n\nTại sao chọn C: Việc điều tra lỗi ngẫu nhiên (intermittent 500 errors) thường giống như một quá trình thám tử. Bạn không thể biết trước mọi bước cần thiết nếu chưa tìm ra manh mối đầu tiên. Phương pháp này cho phép agent thu thập thông tin, phân tích dữ liệu log hoặc dấu vết (trace) từ bước trước đó, rồi mới quyết định bước tiếp theo nên là gì (ví dụ: tập trung vào middleware hay database). Điều này giúp tối ưu hóa thời gian và tránh việc thực hiện các phân tích không cần thiết.\n\nTại sao các phương án khác chưa tối ưu\n-\n\nA\nViệc lập bản đồ toàn bộ hệ thống trước khi bắt đầu là quá tốn kém và thiếu thực tế đối với một lỗi cụ thể. Nó làm lãng phí nguồn lực vào các khu vực không liên quan đến lỗi. -\nB\nMột quy trình cứng nhắc (fixed sequence) rất dễ thất bại vì mỗi lỗi có đặc thù riêng. Nếu lỗi nằm ở một logic kinh doanh (business logic) ẩn, việc đi theo tuần tự cố định từ middleware xuống database có thể khiến agent bỏ lỡ nguyên nhân gốc rễ. -\nD\nViệc chạy song song (parallel) khi chưa xác định được phạm vi hoặc không có sự phối hợp chặt chẽ dễ dẫn đến việc làm quá tải hệ thống, tạo ra nhiều \"nhiễu\" và khó khăn trong việc kết nối các mảnh ghép thông tin lại với nhau để tìm ra một lỗi có tính chất liên tục/ngẫu nhiên.", "set": "Set 1", "topic": 2}, {"n": 2, "cat": "T", "stem": "Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match – the file has repetitive docstrings, variable names, and structural patterns. What's the most reliable way to complete this insertion?", "opts": {"A": "Use Read to load the file, add the function at the appropriate location, then Write the updated file", "B": "Use Bash to append the function definition to the end of the file using heredoc syntax", "C": "Use Edit's replace_all parameter to target a common pattern and embed the new function in the replacement text", "D": "Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness"}, "a": "A", "sk": ["old_string parameter cannot find unique text"], "ak": ["Read to load the file", "Write the updated file"], "note": "Bẫy: {D} (old_string thật dài) nghe hợp lý nhưng vẫn mong manh. Edit thất bại vì không unique → Read + Write cả file.", "ex": "Khi công cụ Edit không thể xác định vị trí chính xác do nội dung file quá lặp lại (repetitive), việc cố gắng ép buộc bằng cách tăng độ dài old_string (phương án D) thường không hiệu quả và dễ gây ra lỗi sai lệch ngữ cảnh. Các lý do tại sao A là phương pháp đáng tin cậy nhất:\n\nĐộ chính xác tuyệt đối: Khi bạn sử dụng Read để tải toàn bộ nội dung file, bạn có cái nhìn đầy đủ về cấu trúc file đó. Sau đó, việc sử dụng Write (ghi đè toàn bộ file với nội dung đã được chỉnh sửa) giúp bạn kiểm soát chính xác vị trí chèn hàm mới mà không cần dựa vào khả năng khớp mẫu (pattern matching) bị hạn chế của công cụ Edit.\n\nTránh rủi ro: - B (Bash/heredoc): Chỉ cho phép chèn vào cuối file (append), điều này có thể làm hỏng cấu trúc module nếu hàm mới cần nằm ở một vị trí cụ thể giữa các hàm khác. - C (Replace all): Rất nguy hiểm trong một file có nội dung lặp lại, vì nó có thể vô tình thay thế nhầm nhiều vị trí khác không mong muốn. - D (Long old_string): Tăng độ dài old_string lên 30+ dòng không đảm bảo tính duy nhất và làm tăng xác suất sai sót do các thay đổi nhỏ về định dạng hoặc khoảng trắng trong file gốc.\n\nVì vậy, trong các hệ thống AI agent, khi công cụ chỉnh sửa theo mẫu (Edit) gặp lỗi, \"Read toàn bộ - Chỉnh sửa - Write lại toàn bộ\" là quy trình tiêu chuẩn để đảm bảo tính toàn vẹn của mã nguồn.", "set": "Set 1", "topic": 2}, {"n": 3, "cat": "E", "stem": "An engineer used Claude Code yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to continue that specific investigation. She's worked on three other codebases since then and knows the session was named \"auth-deep-dive\". How should she resume?", "opts": {"A": "Use --continue to pick up where the most recent conversation left off", "B": "Use --resume auth-deep-dive to load that specific session by name", "C": "Use --session-id with the UUID from yesterday's session transcript file", "D": "Start fresh and re-read the same files"}, "a": "B", "sk": ["session was named \"auth-deep-dive\""], "ak": ["--resume auth-deep-dive"], "note": "Biết tên session → --resume <tên>. --continue chỉ lấy phiên gần nhất (đã làm 3 codebase khác).", "ex": "Trong Claude Code, việc quản lý và tiếp tục các phiên làm việc (sessions) được thiết kế để hỗ trợ hiệu quả cho các luồng công việc dài hơi:\n\nTại sao chọn B: Claude Code cho phép người dùng đặt tên cho các phiên làm việc hoặc tự động lưu trữ chúng. Lệnh --resume đi kèm với tên phiên (session name) là cách trực tiếp và chuẩn xác nhất để khôi phục đúng ngữ cảnh, lịch sử trò chuyện và trạng thái mà kỹ sư đã xây dựng trước đó, ngay cả khi họ đã làm việc trên các codebase khác.\n\nTại sao các phương án khác không phù hợp\n-\n\nA\n(--continue): Lệnh này thường chỉ dùng để tiếp tục phiên làm việc gần nhất (most recent). Vì kỹ sư đã làm việc trên 3 codebase khác kể từ hôm qua, lệnh này có khả năng cao sẽ tải nhầm phiên làm việc cuối cùng thay vì phiên \"auth-deep-dive\" mong muốn. -\nC\n(--session-id): Mặc dù về mặt kỹ thuật có thể truy xuất qua ID, nhưng cách dùng tên (name) thân thiện và dễ nhớ hơn nhiều so với việc phải lục tìm UUID từ file transcript. -\nD\n(Start fresh): Đây là cách làm thiếu hiệu quả vì nó làm mất đi toàn bộ ngữ cảnh (context) đã dày công xây dựng trong 2 giờ làm việc trước đó.", "set": "Set 1", "topic": 2}, {"n": 4, "cat": "E", "stem": "An engineer's exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer's connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration. What's the most effective approach?", "opts": {"A": "Resume the subagent from its previous transcript without mentioning the changes–the architecture understanding remains valid.", "B": "Launch a fresh subagent and include the prior transcript in the initial prompt for context.", "C": "Launch a fresh subagent with a summary of prior findings.", "D": "Resume the subagent from its previous transcript and inform it about the renamed functions."}, "a": "D", "sk": ["renamed two utility functions"], "ak": ["inform it about the renamed functions"], "note": "Resume giữ được 30 phút công sức; chỉ cần báo thêm phần đã thay đổi.", "ex": "Việc resume cho phép agent giữ lại toàn bộ mental model về luồng dữ liệu đã xây dựng trong 30 phút phân tích 47 file. Khi mã nguồn thay đổi (2 hàm đổi tên), cần chủ động thông báo cho agent — human-in-the-loop giúp agent điều chỉnh hiểu biết mà không cần phân tích lại từ đầu.\n\nTại sao các phương án khác chưa tối ưu\nA\nkhông cập nhật hàm đổi tên → lỗi \"symbol not found\". B &\nC\nkhởi động fresh subagent làm mất lợi thế 30 phút phân tích, tốn thêm thời gian xây lại mental map.", "set": "Set 1", "topic": 2}, {"n": 5, "cat": "T", "stem": "Your agent has spent 25 minutes exploring a game engine's rendering subsystem–reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference \"typical rendering patterns\" rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier. What's the most effective approach?", "opts": {"A": "Continue in the current context with more targeted prompts referencing the specific classes by name.", "B": "Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project's CLAUDE.md.", "C": "Spawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation.", "D": "Summarize key rendering findings, then spawn a sub-agent for physics exploration with that summary in its initial context."}, "a": "D", "sk": ["\"typical rendering patterns\""], "ak": ["Summarize key rendering findings", "spawn a sub-agent for physics exploration with that summary"], "note": "Bẫy giữa {C} và {D}: {C} để subagent đi mà không mang theo phát hiện cũ. Context đã loãng → tóm tắt rồi giao subagent kèm tóm tắt.", "ex": "Agent bắt đầu trả lời chung chung (\"typical rendering patterns\") cho thấy context drift. Tóm tắt các điểm quan trọng (VulkanPipeline, FrameGraph) thành bản ghi nhớ ngắn gọn cho sub-agent physics giúp giữ liên kết cốt lõi mà không nhiễu.\n\nTại sao các phương án khác chưa tối ưu\nA\ntăng nguy cơ nhầm lẫn do giới hạn context window.\nB\n(/clear) xóa sạch 25 phút nghiên cứu quý giá.\nC\ntự tổng hợp thủ công tốn công người, đi ngược mục tiêu tự động hóa.", "set": "Set 1", "topic": 2}, {"n": 6, "cat": "E", "stem": "An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module). What exploration strategy will most reliably identify all callers?", "opts": {"A": "Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points.", "B": "Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function.", "C": "Read the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase.", "D": "Use Grep to search for the function's original name across the codebase."}, "a": "C", "sk": ["wrapper modules that rename the function"], "ak": ["identify all exposed names for the function", "Grep for each name"], "note": "Hàm bị đổi tên qua wrapper → tìm hết các tên rồi Grep từng tên.", "ex": "Đọc code trước để nắm toàn bộ các \"bí danh\" của hàm qua wrapper, rồi Grep từng tên trên toàn codebase để không bỏ sót caller nào.\n\nTại sao các phương án khác chưa tối ưu\nA\ntài liệu thường lạc hậu, thiếu thực tế.\nB\nchỉ tìm theo tên module import, dễ bỏ sót caller nội bộ.\nD\nchỉ tìm tên gốc, bỏ lỡ mọi caller gọi qua tên rename, dễ gây lỗi khi xóa hàm.", "set": "Set 1", "topic": 2}, {"n": 7, "cat": "E", "stem": "After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and working. Examining the configuration, you find each MCP tool has a minimal description like \"extract_function: extracts a function from code.\" What's the most effective way to improve adoption of the MCP refactoring tools?", "opts": {"A": "Remove the Write tool from the agent's configuration for refactoring sessions so it must use the MCP tools for code modifications.", "B": "Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them.", "C": "Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools.", "D": "Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs."}, "a": "D", "sk": ["minimal description"], "ak": ["Enhance the MCP tool descriptions"], "note": "Quy tắc: tool không được chọn → sửa description của tool.", "ex": "LLM chọn công cụ dựa trên mô tả. Mô tả sơ sài khiến LLM thiếu thông tin so với sed/Write. Cải thiện mô tả (khi nào nên dùng, input/output mong đợi) giúp AI tự tin chọn công cụ chuyên dụng.\n\nTại sao các phương án khác chưa tối ưu\nA\nxóa bỏ Write quá cực đoan.\nB\nxây classifier ngoài luồng làm hệ thống phức tạp, không tận dụng khả năng tự suy luận LLM.\nC\nkhông phải hành vi mong đợi — dấu hiệu mô tả/metadata chưa đủ tốt.", "set": "Set 1", "topic": 3}, {"n": 8, "cat": "T", "stem": "An engineer asks the agent to investigate error handling in a legacy payment processing module spanning 15 files. After reading the first 8 files, the agent's responses are becoming noticeably less accurate—it's forgetting previously discovered code patterns and hasn't yet located all test files or traced the complete data flow. What's the most effective approach to complete this investigation?", "opts": {"A": "Spawn a subagent to explore the remaining files, providing a summary of discovered patterns as its initial context.", "B": "Document a summary of findings so far in a file, then start fresh with a new context using that summary as reference.", "C": "Close the current context with /clear and start fresh, re-reading only the most critical files.", "D": "Use Grep to search for specific function names across remaining files, reducing the content loaded into context."}, "a": "B", "sk": ["spanning 15 files", "less accurate"], "ak": ["Document a summary of findings so far in a file", "start fresh with a new context"], "note": "Bẫy cặp với câu 58 (đề gần như y hệt). Câu 8 (15 file): ghi tóm tắt ra file rồi mở context mới. Câu 58 (45 file, có câu hỏi con rõ ràng): dùng subagent.", "ex": "Kỹ thuật \"Checkpointing\": ghi các patterns/test files/luồng dữ liệu đã biết vào file tạo \"bộ nhớ ngoài\". Context mới nạp file này giúp AI nắm ngay lịch sử, không lặp lại hay quên chi tiết.\n\nTại sao các phương án khác chưa tối ưu\nA\nsubagent vẫn bị giới hạn cùng model nền, không giải quyết mất ngữ cảnh. C /clear cần thiết nhưng chỉ re-read file quan trọng vẫn thiếu bức tranh tổng thể.\nD\nGrep chỉ tìm từ khóa, không giúp hiểu logic nghiệp vụ phức tạp.", "set": "Set 1", "topic": 2}, {"n": 9, "cat": "E", "stem": "An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth–having the agent propose specific code changes for each–before deciding which to implement. What's the most effective way to structure this exploration?", "opts": {"A": "Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context.", "B": "Resume yesterday's session to explore the first approach, then start a new session for the second, manually recreating the original context.", "C": "Resume yesterday's session and explore both approaches sequentially within the same conversation thread.", "D": "Use fork_session to create two branches from yesterday's analysis, exploring one approach in each fork."}, "a": "D", "sk": ["explore both approaches in depth"], "ak": ["fork_session to create two branches"], "note": "Hai hướng khám phá song song từ cùng một phân tích → fork_session.", "ex": "fork_session cho cả hai nhánh thừa hưởng toàn bộ lịch sử phân tích hôm trước, tách biệt logic giữa hai phương án đối nghịch, tránh nhiễu lẫn nhau, so sánh kết quả để quyết định chính xác hơn.\n\nTại sao các phương án khác chưa tối ưu\nA\nfresh sessions tốn công nạp lại context, dễ thiếu sót.\nB\ntạo phiên mới cho phương án 2 mất thời gian, dễ ô nhiễm ngữ cảnh.\nC\nkhám phá cả hai phương án đối nghịch cùng thread gây xung đột logic.", "set": "Set 1", "topic": 2}, {"n": 10, "cat": "E", "stem": "Your agent has analyzed a complex service module–reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?", "opts": {"A": "Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy.", "B": "Export the analysis session's key findings to a file, then create two new sessions that reference this file.", "C": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.", "D": "Start two fresh sessions, having each re-read the relevant source files before beginning."}, "a": "A", "sk": ["independently develop both approaches"], "ak": ["fork_session enabled, creating a separate branch"], "note": "Hai chiến lược độc lập từ cùng phân tích → fork_session.", "ex": "fork_session thừa hưởng toàn bộ ngữ cảnh (patterns, kiến trúc đã phân tích từ 23 file) và tách biệt logic giữa hai nhánh thử nghiệm, giúp so sánh kết quả chính xác hơn.\n\nTại sao các phương án khác chưa tối ưu\nB\nxuất/nhập file thủ công dễ mất chi tiết ngữ cảnh tinh vi.\nC\nphát triển tuần tự không đánh giá song song tốt, dễ ô nhiễm phương án sau.\nD\nbắt đầu lại từ đầu lãng phí thời gian, dễ bỏ sót chi tiết do thiếu tiếp nối ngữ cảnh.", "set": "Set 1", "topic": 2}, {"n": 11, "cat": "T", "stem": "An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total). What's the most effective next step for building understanding while managing context constraints?", "opts": {"A": "Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the interface, then trace specific invalidation implementations.", "B": "Use Grep to search for \"invalidate\" and \"expire\" patterns across all files, then Read only those specific line ranges with minimal surrounding context.", "C": "Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation.", "D": "Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps."}, "a": "A", "sk": ["~8,000 lines total"], "ak": ["identify the base cache class", "trace specific invalidation implementations"], "note": "Bẫy: {B} (Grep \"invalidate\") nghe tiết kiệm nhưng mất bối cảnh. Đi từ lớp gốc/interface rồi lần theo triển khai.", "ex": "Phương pháp \"Top-down\": xác định base class/interface qua imports và cấu trúc lớp, hiểu interface trước, rồi truy vết có mục tiêu các phần liên quan đến invalidation — tiết kiệm ngữ cảnh, chỉ nạp phần thực sự cần thiết.\n\nTại sao các phương án khác chưa tối ưu\nB\nchỉ tìm từ khóa dễ bỏ sót logic phụ thuộc trạng thái, không hiểu kiến trúc tổng thể.\nC\nđọc tuần tự 15 file gây \"context saturation\".\nD\nưu tiên theo dung lượng file không phản ánh đúng vai trò kiến trúc (file nhỏ như interface/decorator có thể quan trọng hơn file lớn).", "set": "Set 1", "topic": 2}, {"n": 12, "cat": "T", "stem": "An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services. What exploration strategy will most effectively build understanding, given Claude built-in tools and context limits?", "opts": {"A": "Use Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally.", "B": "Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview.", "C": "Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system.", "D": "Read all files containing \"auth\", \"login\", \"permission\", or \"token\" in their content or filename."}, "a": "A", "sk": ["800+ files"], "ak": ["Grep to find authentication entry points", "follow imports and function calls"], "note": "Bẫy: {B} (subagent song song) nghe \"xịn\". Đáp án: tìm entry point rồi lần dần theo import.", "ex": "Chiến lược \"Traceability\": bắt đầu từ entry points (middleware/decorator/controller login) qua Grep, rồi lần theo imports/function calls xây dựng bản đồ kiến trúc từng bước — tập trung file thực sự liên quan, tiết kiệm ngữ cảnh.\n\nTại sao các phương án khác chưa tối ưu\nB\nparallel subagents cho phân tích kiến trúc ban đầu dễ gây nhiễu, thiếu thống nhất data flow.\nC\nphụ thuộc quá mức vào con người chỉ định file — đi ngược vai trò tự suy luận của agent.\nD\nbrute-force đọc mọi file chứa \"auth\" làm đầy context window ngay lập tức, mất khả năng tư duy sâu.", "set": "Set 1", "topic": 2}, {"n": 13, "cat": "E", "stem": "After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you notice the agent continues to use Grep to inspect dependencies even when users explicitly ask about \"code dependencies\". Tool definitions reveal: analyze_dependencies returns a dependency graph by analyzing imports. What's the most effective approach to improve the agent's selection of MCP tools?", "opts": {"A": "Expand MCP tool descriptions and outputs–e.g., \"Builds dependency graph with list_imports, direct_circular_deps\"–to clearly distinguish dependencies and cycle analysis from Grep.", "B": "Split analyze_dependencies into granular tools: list_imports, detect_transitive_deps, identify_circular_deps to avoid overlap with Grep.", "C": "Add routing questions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep.", "D": "Remove Grep from the available tools to eliminate functional overlap."}, "a": "A", "sk": ["continues to use Grep"], "ak": ["Expand MCP tool descriptions"], "note": "Quy tắc: model không chọn MCP tool → mở rộng description, không xoá Grep hay viết router.", "ex": "LLM chọn công cụ dựa trên mô tả. Cập nhật mô tả của analyze_dependencies để giải thích rõ nó tạo dependency graph và phân tích sâu hơn (cycle detection) cho AI lý do logic mạnh hơn để ưu tiên dùng nó thay vì Grep (chỉ tìm text đơn thuần).\n\nTại sao các phương án khác chưa tối ưu\nB\nchia nhỏ quá mức làm hệ thống cồng kềnh, khó quyết định dùng tool nào cho yêu cầu rộng.\nC\nhard-code system prompt là giải pháp tạm, tạo gánh nặng bảo trì khi thêm tool mới.\nD\nxóa Grep quá cực đoan, Grep vẫn có giá trị cho tìm kiếm text đơn giản.", "set": "Set 1", "topic": 3}, {"n": 14, "cat": "T", "stem": "Your extraction pipeline processes contracts that frequently include amendments. When a contract contains both original terms and later amendments (e.g., original clause specifies \"30-day payment terms\" while Amendment 1 changes this to \"45 days\"), the model inconsistently extracts one value or the other with no indication of which applies. What's the most effective approach to improve extraction accuracy for documents with amendments?", "opts": {"A": "Redesign the schema so amended fields capture multiple values, each with source location and effective date.", "B": "Implement post-extraction validation using pattern matching to detect amendments and flag those extractions for manual review.", "C": "Preprocess documents with a classifier that identifies and removes superseded sections before the main extraction step.", "D": "Add prompt instructions to always extract the most recent amendment value and ignore superseded original terms."}, "a": "A", "sk": ["original terms and later amendments"], "ak": ["capture multiple values, each with source location and effective date"], "note": "Bẫy: {D} (\"luôn lấy bản sửa mới nhất\") nghe đúng nhưng mất thông tin. Schema chứa nhiều giá trị kèm nguồn và ngày hiệu lực.", "ex": "\"Structured Data Integrity\": thiết kế lại schema lưu tất cả phiên bản (kèm nguồn gốc + ngày hiệu lực) cho traceability và tách biệt nhiệm vụ extraction khỏi reasoning — downstream logic mới quyết định giá trị \"cuối cùng\" có hiệu lực.\n\nTại sao các phương án khác chưa tối ưu\nB\npattern matching hậu kiểm là giải pháp chắp vá, không bao phủ hết văn bản pháp lý đa dạng.\nC\nxóa phần superseded rất nguy hiểm vì điều khoản cũ có thể quan trọng cho tranh chấp.\nD\nchỉ dựa prompt instructions không đủ khi tài liệu có nhiều tầng sửa đổi phức tạp, model vẫn có thể hallucinate.", "set": "Set 1", "topic": 5}, {"n": 15, "cat": "T", "stem": "After deployment, you find that 12% of extractions contain semantic errors that pass JSON schema validation (e.g., a duration like \"30 minutes\" incorrectly placed in an ingredient quantity field). Human reviewers have capacity to check only 20% of extractions. Which approach most effectively allocates reviewer attention?", "opts": {"A": "Prioritize review of all extractions where required fields are empty or explicitly marked as not found.", "B": "Have the model output field-level confidence scores, then calibrate review thresholds using a labeled validation set.", "C": "Review all extractions from documents with formatting anomalies such as unusual layouts or mixed content types.", "D": "Randomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns."}, "a": "B", "sk": ["capacity to check only 20%"], "ak": ["field-level confidence scores", "calibrate review thresholds using a labeled validation set"], "note": "Bẫy: D lấy mẫu ngẫu nhiên nghe khoa học nhưng không ưu tiên đúng chỗ. Confidence + hiệu chỉnh ngưỡng bằng tập có nhãn.", "ex": "Yêu cầu model xuất confidence score từng trường, kết hợp labeled validation set để tìm ngưỡng (threshold) — tập trung 20% công sức người review vào các trường có xác suất lỗi cao nhất thay vì lãng phí vào dữ liệu đã đúng.\n\nTại sao các phương án khác chưa tối ưu\nA\nưu tiên trường \"trống\" không giải quyết lỗi ngữ nghĩa (dữ liệu có nhưng sai nội dung).\nC\nđịnh dạng bất thường không phải nguyên nhân duy nhất — nhiều lỗi xảy ra trên tài liệu chuẩn.\nD\nrandom sampling thụ động, chỉ cho thống kê chung chứ không giúp ngăn chặn lỗi có hệ thống.", "set": "Set 1", "topic": 5}, {"n": 16, "cat": "E", "stem": "Your extraction pipeline processes invoices and extracts line items, tax amounts, and grand totals. You discover that 8% of documents have extracted line item amounts that don't sum to the extracted grand total—the downstream accounting system has been detecting mismatches. What's the most effective improvement?", "opts": {"A": "Add a calculated_total field where the model extracts line items independently, then validate totals alongside a is_total_consistent boolean flag for human review when values differ.", "B": "Extract line items and totals independently, then use a separate validation model to reconcile discrepancies.", "C": "Implement post-processing that automatically adjusts line item amounts when the extracted total doesn't match the sum.", "D": "Add few-shot examples to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior."}, "a": "A", "sk": ["don't sum to the extracted grand total"], "ak": ["calculated_total", "is_total_consistent"], "note": "Quy tắc: tổng không khớp → thêm calculated_total + cờ kiểm tra, đưa người duyệt khi lệch.", "ex": "Không bắt AI tự \"sửa\" (dễ ảo giác) mà để nó trích xuất thực tế, hệ thống tính calculated_total để đối chiếu grand total. Cờ is_total_consistent lọc tự động: false → đưa vào hàng đợi human review. Đảm bảo dữ liệu kế toán chính xác, tiết kiệm thời gian vì người chỉ xem case lệch.\n\nTại sao các phương án khác chưa tối ưu\nB\nvalidation model riêng tăng chi phí, không chắc giải quyết tận gốc nếu model đầu đọc sai.\nC\ntự động điều chỉnh số liệu rất nguy hiểm, có thể sai lệch tài chính mà không ai biết.\nD\nfew-shot cải thiện nhưng không đảm bảo tuyệt đối, nghiệp vụ tài chính cần lớp validation logic như A.", "set": "Set 1", "topic": 5}, {"n": 17, "cat": "E", "stem": "Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. During testing, the agent sometimes fails to call extract_metadata because it wants to provide direct answers. What's the most reliable way to ensure metadata extraction always happens first?", "opts": {"A": "Set tool_choice to \"auto\" and reorder the tool definitions placing extract_metadata first since Claude prioritizes earlier-listed tools.", "B": "Set tool_choice to type \"tool\", name \"extract_metadata\" and process the enrichment requests in subsequent turns after receiving the extracted metadata.", "C": "Set tool_choice to \"auto\" in the API call, combined with tools so that Claude always prioritizes metadata before any other tool calls.", "D": "Set tool_choice to type \"any\" so Claude must use a tool, combined with system prompt instructions to call extract_metadata first."}, "a": "B", "sk": ["always happen", "fails to call extract_metadata"], "ak": ["type \"tool\", name \"extract_metadata\""], "note": "Bắt buộc một tool cụ thể → tool_choice type \"tool\" + name. \"any\" chỉ bắt gọi tool bất kỳ.", "ex": "tool_choice {\"type\":\"tool\",\"name\":\"extract_metadata\"} bắt buộc Claude gọi đúng công cụ này ngay turn đầu, không thể tự trả lời trực tiếp. Sau khi có kết quả, đưa ngược vào conversation history để xử lý tiếp — tránh hallucinate trước khi có dữ liệu.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nC\n\"auto\" không bao giờ đảm bảo 100% mô hình chọn công cụ dù đặt thứ tự đầu.\nD\ntype \"any\" bắt buộc dùng tool nhưng không chỉ định cụ thể tool nào — có thể chọn sai nếu nhiều tool; system prompt chỉ mang tính hướng dẫn, không cưỡng ép kỹ thuật.", "set": "Set 1", "topic": 3}, {"n": 18, "cat": "E", "stem": "After your daily batch of 10,000 documents completes, 300 documents (3%) failed with \"context_length_exceeded\" errors. The results file identifies each failure by custom_id. What's the most cost-effective approach to process these failures?", "opts": {"A": "Resubmit the entire 10,000 document batch using a model tier with a larger context window", "B": "Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with identical system prompts", "C": "Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch", "D": "Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial extractions"}, "a": "D", "sk": ["300 documents (3%) failed", "context_length_exceeded"], "ak": ["Resubmit only the 300 failed documents after chunking"], "note": "Chỉ chạy lại phần lỗi, cắt nhỏ. Bẫy C: max_tokens là output, không liên quan context.", "ex": "Chỉ xử lý lại đúng 300 tài liệu lỗi (tiết kiệm chi phí so với chạy lại cả 10.000), chunking đưa nội dung về trong giới hạn context window rồi combine kết quả — giải quyết tận gốc nguyên nhân context_length_exceeded.\n\nTại sao các phương án khác chưa tối ưu\nA\nchạy lại cả 10.000 tài liệu lãng phí cực lớn.\nB\nprompt caching giảm chi phí prompt chung nhưng xử lý lại 9.700 tài liệu đã thành công là không cần thiết.\nC\ntăng max_tokens (output) không liên quan lỗi input context_length_exceeded.", "set": "Set 1", "topic": 5}, {"n": 19, "cat": "E", "stem": "Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the \"materials\" field–sometimes returning \"cotton blend\", other times \"Cotton/Polyester mix\", and occasionally omitting the field when material information is clearly present in the source. What's the most effective way to improve extraction consistency?", "opts": {"A": "Set temperature to 0 to eliminate randomness and ensure deterministic outputs", "B": "Make the \"materials\" field required instead of optional in the schema to force the model to always extract a value", "C": "Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability", "D": "Add few-shot examples showing 2-3 complete input-output pairs with standardized material description formats"}, "a": "D", "sk": ["inconsistently extracts"], "ak": ["few-shot examples"], "note": "Định dạng không nhất quán → few-shot. Temperature 0 không sửa được.", "ex": "Few-shot prompting thiết lập \"tiêu chuẩn\" chuẩn hóa: 2-3 ví dụ input+output đúng hướng dẫn mô hình normalize thuật ngữ vật liệu và trích xuất nhất quán theo format mong muốn, khắc phục việc thỉnh thoảng bỏ sót trường.\n\nTại sao các phương án khác chưa tối ưu\nA\ntemperature=0 giảm ngẫu nhiên nhưng không dạy cách chuẩn hóa — sẽ lặp lại lỗi sai một cách \"xác định\".\nB\nrequired ép điền giá trị nhưng không đảm bảo định dạng nhất quán nếu thiếu hướng dẫn.\nC\nđây là vấn đề prompting chứ không phải năng lực model.", "set": "Set 1", "topic": 5}, {"n": 20, "cat": "E", "stem": "Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article–for example, outputting \"500\" for attendee_count when the source contains no attendance information. What's the most effective way to reduce these false extractions?", "opts": {"A": "Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies.", "B": "Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data.", "C": "Add prompt instructions to return null for any field where information is not directly stated in the source.", "D": "Add a post-processing step using a second LLM call to verify each extracted value exists in the source document."}, "a": "C", "sk": ["all nullable fields", "no attendance information"], "ak": ["return null for any field where information is not directly stated"], "note": "Trường không có trong nguồn → hướng dẫn trả null.", "ex": "Chỉ dẫn rõ ràng \"nếu thông tin không có, trả về null\" thiết lập bộ lọc hành vi tại inference time, buộc model dựa vào dữ liệu đầu vào thực tế thay vì suy diễn. Chi phí thấp, không cần đổi hạ tầng/schema phức tạp.\n\nTại sao các phương án khác chưa tối ưu\nA\nmodel mạnh hơn vẫn có xu hướng suy diễn nếu prompt không yêu cầu nghiêm ngặt.\nB\nrequired field khiến model \"bế tắc\" hoặc bịa dữ liệu để thỏa schema — làm trầm trọng thêm vấn đề.\nD\nLLM thứ hai tốn chi phí/latency và vẫn có thể tự hallucinate; prompt engineering luôn là bước ưu tiên đầu tiên.", "set": "Set 1", "topic": 5}, {"n": 21, "cat": "E", "stem": "After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats–inline citations vs. bibliographies, methodology sections vs. details embedded in introductions. What's the most effective way to address these failures?", "opts": {"A": "Modify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation.", "B": "Build a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract.", "C": "Implement retry logic that re-sends requests when validation detects empty required fields.", "D": "Add few-shot examples demonstrating extractions from documents with varied structures–showing how to identify citations in different formats and locate methodology details across section types."}, "a": "D", "sk": ["varied formats"], "ak": ["few-shot examples demonstrating extractions from documents with varied structures"], "note": "Nguồn đa dạng định dạng → few-shot với cấu trúc đa dạng.", "ex": "Few-shot prompting giải quyết sự không nhất quán cấu trúc tài liệu: ví dụ cụ thể cho thấy cách trích xuất citations/methodology từ nhiều cấu trúc khác nhau (inline, bibliography, intro...) dạy model nhận diện nội dung tương ứng bất kể trình bày ra sao.\n\nTại sao các phương án khác chưa tối ưu\nA\noptional field giảm chất lượng output, không giải quyết việc model \"bỏ lỡ\" thông tin.\nB\nregex cứng nhắc, khó duy trì khi tài liệu đổi cấu trúc.\nC\nretry không đổi prompt/context chỉ lãng phí tài nguyên, model vẫn gặp cùng khó khăn.", "set": "Set 1", "topic": 5}, {"n": 22, "cat": "E", "stem": "Your extraction system implements automatic retries when validation fails. On each retry, the specific validation error is appended to the prompt. This retry-with-error-feedback approach resolves most failures within 2-3 attempts For which failure pattern would additional retries be LEAST effective?", "opts": {"A": "The model extracts \"et al.\" for co-authors when the full list exists only in an external document not in the input", "B": "The model extracts dates as ISO 8601 datetime strings (\"2023-03-15T00:00:00Z\") when the schema requires only the date portion (YYYY-MM-DD)", "C": "The model extracts citation counts as locale-formatted strings (\"1,234\") when the schema requires integers", "D": "The model extracts keywords as a nested object organized by category when the schema requires a flat array of strings"}, "a": "A", "sk": ["LEAST effective"], "ak": ["exists only in an external document not in the input"], "note": "Thông tin không có trong input thì retry bao nhiêu cũng vô ích.", "ex": "retry-with-error-feedback giả định model đã có đủ thông tin trong context nhưng hiểu sai format. A là lỗi thiếu dữ liệu (missing information) — danh sách tác giả đầy đủ không tồn tại trong input, dù retry bao nhiêu lần model cũng không thể \"phát minh\" ra thông tin không có. Đây là giới hạn dữ liệu nguồn, không phải lỗi kỹ năng.\n\nTại sao các phương án khác retry vẫn hiệu quả\nB, C, D là lỗi định dạng (formatting/schema mismatch) — model đã có thông tin, chỉ nhầm format (ISO 8601 vs Date, string vs integer, nested vs flat array); phản hồi lỗi giúp model điều chỉnh cách trình bày ở lần thử sau.", "set": "Set 1", "topic": 5}, {"n": 23, "cat": "T", "stem": "Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting–prices as \"$12\" vs \"12.00\", dietary info as icons vs text. What's the most reliable approach?", "opts": {"A": "Extract data as-is and normalize formats in post-processing code after Claude returns.", "B": "Use separate extraction calls for each field to ensure consistent handling of each type.", "C": "Request multiple extraction attempts per document and select the most common format.", "D": "Define a strict output schema and include format normalization rules in your prompt."}, "a": "D", "sk": ["inconsistent formatting"], "ak": ["strict output schema", "format normalization rules in your prompt"], "note": "Bẫy: {A} (normalize sau bằng code) nghe hợp lý. Đáp án: schema chặt + luật chuẩn hoá ngay trong prompt.", "ex": "Strict schema ép model trả đúng cấu trúc mong đợi; format normalization rules trong prompt (vd: \"luôn định dạng giá thành số thập phân 2 chữ số, bỏ ký tự $\", \"chuyển icon ăn kiêng thành nhãn chuẩn\") xử lý ngay tại inference time, tận dụng khả năng ngôn ngữ của Claude.\n\nTại sao các phương án khác chưa tối ưu\nA\npost-processing thụ động, phải đối mặt hàng loạt edge case nếu output không ổn định từ đầu.\nB\nnhiều lời gọi tăng chi phí/latency, mất ngữ cảnh liên kết (giá phải đi kèm mô tả món).\nC\nmajority vote tốn kém, không sửa lỗi hệ thống nếu model hiểu sai quy tắc định dạng.", "set": "Set 1", "topic": 5}, {"n": 24, "cat": "T", "stem": "Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types –\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"–and new types continue appearing regularly. What's the most effective long-term solution?", "opts": {"A": "Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases.", "B": "Change property_type from an enum to a free-form string and implement a normalization step in post-processing.", "C": "Add an \"other\" value to your enum with a separate property_type_detail string field for specifics when \"other\" is selected.", "D": "Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value."}, "a": "C", "sk": ["new types continue appearing regularly"], "ak": ["\"other\" value", "property_type_detail"], "note": "Bẫy: {B} (string tự do) phá vỡ cấu trúc; {A} phải sửa mãi. Enum + \"other\" + trường chi tiết.", "ex": "Giữ enum chuẩn cho thống kê cốt lõi, thêm property_type_detail (trường tự do) để không bao giờ lỗi schema khi có loại BĐS mới. Sau này lọc \"other\" + property_type_detail để quyết định có thêm giá trị chính thức vào enum không.\n\nTại sao các phương án khác chưa tối ưu\nA\ncách làm \"chạy theo sự vụ\", liên tục cập nhật enum + re-deploy, gánh nặng bảo trì lớn.\nB\nfree-form string mất tính toàn vẹn, dữ liệu phân mảnh (\"House\", \"house \", \"house.\"...).\nD\nép model ánh xạ kiểu lạ vào enum có sẵn là sai lệch thông tin nghiêm trọng.", "set": "Set 1", "topic": 5}, {"n": 25, "cat": "E", "stem": "Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence >90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions Before deploying, what validation step is most critical?", "opts": {"A": "Analyze accuracy by document type and field to verify high-confidence extractions perform consistently across all segments, not just in aggregate.", "B": "Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports.", "C": "Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors.", "D": "Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data."}, "a": "A", "sk": ["97% accuracy overall"], "ak": ["by document type and field", "not just in aggregate"], "note": "\"Overall\" che giấu phân khúc yếu → phân tích theo loại tài liệu và trường.", "ex": "Tránh thiên vị gộp (aggregate bias/Simpson's Paradox): 97% accuracy tổng thể có thể giấu phân đoạn rủi ro lớn (vd 99% ở trường đơn giản nhưng chỉ 60% ở trường critical như số tiền/điều khoản). Phân tích theo document type + field đảm bảo không phân đoạn nào suy giảm nghiêm trọng trước khi bỏ qua review thủ công.\n\nTại sao các phương án khác chưa tối ưu\nB/C là bước tối ưu hóa SAU KHI đã xác nhận độ ổn định theo phân đoạn — làm trước sẽ vô tình đẩy dữ liệu sai nghiêm trọng vào downstream. D xác nhận yêu cầu downstream cần thiết nhưng không phải bước validation cho model extraction.", "set": "Set 1", "topic": 5}, {"n": 26, "cat": "T", "stem": "Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs, you want to use the Message Batches API (50% discount, up-to-24-hour processing window). Your SLA specifies that extraction results must be available within 30 hours of document arrival with 99.9% reliability. Which batching strategy is most appropriate?", "opts": {"A": "Submit batches every 4 hours containing documents from that window", "B": "Submit batches every 6 hours containing documents from that window", "C": "Submit a single batch at end of day containing all documents from that day", "D": "Use the real-time API for all documents instead of batch processing"}, "a": "A", "sk": ["within 30 hours", "up-to-24-hour"], "ak": ["every 4 hours"], "note": "Bẫy tính toán: 6h + 24h = 30h, sát giới hạn, không đủ an toàn; 4h + 24h = 28h còn dư.", "ex": "Gửi batch mỗi 4 giờ: tài liệu đến cuối cửa sổ 4h + tối đa 24h xử lý = 28h tổng cộng. Với SLA 30h, còn 2h buffer an toàn cho sự cố hệ thống, đảm bảo độ tin cậy 99.9%.\n\nTại sao các phương án khác chưa tối ưu\nB\n(6h) tổng có thể lên 30h, sát nút SLA, không còn buffer.\nC\n(cuối ngày) tài liệu đến đầu giờ có thể chờ 8-10h + 24h xử lý = 32-34h, vi phạm SLA.\nD\nreal-time API mất ưu đãi giảm giá 50% mà đề bài yêu cầu tiết kiệm chi phí.", "set": "Set 1", "topic": 5}, {"n": 27, "cat": "T", "stem": "Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like \"Python and SQL\" are sometimes kept as one entry, sometimes split; (2) implied but unstated skills occasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+ entries). Your prompt currently says \"Extract all skills mentioned.\" What's the most effective improvement?", "opts": {"A": "Enrich the schema to {skill: string, confidence: float, source_quote: string[]} to capture extraction metadata.", "B": "Add constraints: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\"", "C": "Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity.", "D": "Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries."}, "a": "C", "sk": ["\"Extract all skills mentioned.\""], "ak": ["few-shot examples demonstrating compound phrase handling"], "note": "Bẫy: {B} (giới hạn 10-20 skill) chỉ chữa triệu chứng. Ba vấn đề về cách diễn giải → few-shot.", "ex": "Few-shot giải quyết cả 3 vấn đề: ví dụ về compound phrases thiết lập tiêu chuẩn \"tính hạt\" (granularity); ví dụ làm rõ chỉ trích xuất thông tin có trong text (loại bỏ implied skills); ví dụ về tài liệu độ dài khác nhau ổn định số lượng output.\n\nTại sao các phương án khác chưa tối ưu\nA\nlàm giàu schema giúp monitoring nhưng không dạy model trích xuất đúng từ đầu.\nB\nhard constraint \"10-20 skills\" nguy hiểm — model có thể hallucinate để lấp đầy hoặc cắt bỏ thông tin quan trọng.\nD\nchuẩn hóa hậu kỳ không giải quyết gốc rễ việc trích xuất sai/không nhất quán.", "set": "Set 1", "topic": 5}, {"n": 28, "cat": "E", "stem": "Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements. How should you architect the processing pipeline?", "opts": {"A": "Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return.", "B": "Route standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the real-time Messages API.", "C": "Submit all documents to the real-time Messages API to ensure consistent processing latency across document types.", "D": "Submit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions."}, "a": "B", "sk": ["urgent exception reports", "minimize API costs"], "ak": ["Batch API for 50% cost savings", "real-time Messages API"], "note": "Gấp → API thời gian thực; không gấp → Batch. Tách luồng.", "ex": "Kiến trúc hybrid chuẩn mực: standard reports (không cần xử lý ngay) → Batch API tiết kiệm 50% chi phí; urgent reports (SLA <30 phút) → Real-time Messages API vì Batch API có thể mất tới 24h, không đáp ứng được.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nD\nđưa tài liệu khẩn cấp vào batch queue sẽ vi phạm SLA 30 phút.\nC\nđưa tất cả vào real-time API lãng phí chi phí lớn cho tài liệu không cần xử lý gấp.", "set": "Set 1", "topic": 5}, {"n": 29, "cat": "T", "stem": "The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like \"extract the key financial metrics\" often return narrative summaries, while \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions. What's the most effective way to improve reliability?", "opts": {"A": "Keep the single tool but add an analysis_type enum parameter requiring explicit selection between extraction, summarization, and verification modes.", "B": "Split the generic tool into purpose-specific tools– extract_data_points, summarize_content, verify_claim_against_source –each with defined input/output contracts.", "C": "Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats.", "D": "Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent."}, "a": "B", "sk": ["free-text instruction parameter"], "ak": ["Split the generic tool into purpose-specific tools"], "note": "Bẫy: {A} (thêm enum) nghe gọn. Đáp án: tách thành nhiều tool chuyên biệt có hợp đồng input/output rõ.", "ex": "Tách công cụ đa năng thành các tool chuyên biệt, mỗi tool có input/output contract cố định (extract_data_points luôn trả JSON có cấu trúc, summarize_content tập trung văn bản) — loại bỏ việc model phải \"đoán\" mục đích, giảm lỗi logic vì giới hạn không gian giải pháp.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nC\nchỉ là \"băng dán\" tạm thời, không ngăn model nhầm lẫn định dạng đầu ra khi vẫn dùng chung logic thực thi.\nD\ncoordinator phân loại là bước trung gian tốn kém, tăng latency, vẫn phụ thuộc độ chính xác phân loại — trong khi tách tool (B) giải quyết ở tầng kiến trúc, ổn định hơn.", "set": "Set 1", "topic": 3}, {"n": 30, "cat": "E", "stem": "The coordinator agent has AgentFunctions configured for all four specialized subagents, each with appropriate descriptions and restrictions. During testing, you find the coordinator sometimes fails to delegate—it writes \"I'll ask the web search agent to find sources\" without actually invoking it. What is the most likely cause?", "opts": {"A": "The AgentFunctions are configured correctly, but the coordinator's system prompt includes a statement that prevents it from knowing the available subagent types.", "B": "Subagent context limit descriptions from the coordinator don't provide enough context; you need to configure explicit context content between coordinator and tool descriptions.", "C": "The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent parameter can be specified.", "D": "The coordinator's allowed Tools configuration doesn't include \"Task\", so while it can describe delegation, it cannot actually invoke the tool required to spawn subagents."}, "a": "D", "sk": ["without actually invoking it"], "ak": ["doesn't include \"Task\""], "note": "Nói sẽ giao việc mà không gọi được → thiếu \"Task\" trong allowed tools. (Giống câu 59)", "ex": "Khi coordinator nhận biết cần ủy quyền nhưng chỉ viết tường thuật mà không gọi tool, nguyên nhân phổ biến nhất là quyền hạn (permissions) chưa cho phép dùng tool \"Task\" — LLM hiểu ý định, mô tả bằng văn bản, nhưng hệ thống chặn/không có công cụ để sinh subagent.\n\nTại sao các phương án khác chưa tối ưu\nA\nAgentFunctions đã cấu hình đúng, vấn đề ở lớp thực thi công cụ chứ không phải system prompt.\nB\nkhông liên quan giới hạn ngữ cảnh subagent.\nC\nviệc gọi tool chưa từng diễn ra, không phải bị truncate do max_tokens thấp.", "set": "Set 1", "topic": 4}, {"n": 31, "cat": "T", "stem": "Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?", "opts": {"A": "Persist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming.", "B": "Have each agent maintain its own persistent state file and reload it independently at the start of each session.", "C": "Have each agent persist a structured report to a known location. On resume, the coordinator loads the reports and injects relevant state into agent prompts.", "D": "Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings."}, "a": "C", "sk": ["without repeating work or losing fidelity"], "ak": ["persist a structured report to a known location", "coordinator loads the reports and injects"], "note": "Bẫy: {B} (mỗi agent tự đọc state) bỏ qua coordinator. Báo cáo có cấu trúc + coordinator nạp lại.", "ex": "Mỗi agent persist báo cáo cấu trúc vào vị trí xác định giữ toàn vẹn dữ liệu (fidelity) phần việc đã hoàn thành. Khi resume, coordinator tải các báo cáo và inject đúng phần trạng thái liên quan vào prompt từng agent — cân bằng fidelity và context efficiency, không nhồi nhét toàn bộ lịch sử thô.\n\nTại sao các phương án khác chưa tối ưu\nA\nlưu conversation log thô gây context window explosion khi văn bản lớn.\nB\nmỗi agent tự quản file riêng rời rạc khiến coordinator khó điều phối đồng bộ.\nD\nvector store semantic search có nguy cơ bỏ sót/mất chi tiết chính xác so với nạp trực tiếp báo cáo cấu trúc.", "set": "Set 1", "topic": 4}, {"n": 32, "cat": "T", "stem": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other times results produce vague estimates without clear methodology. Which system-level improvement best addresses this inconsistency?", "opts": {"A": "Add a verification subagent that cross-references findings across sources, only accepting synthesis corroborated by at least two independent sources.", "B": "Configure subagents to only report findings with sufficient coverage breadth, source diversity, and quality criteria before passing results to the synthesis agent.", "C": "Implement a confidence calibration layer where synthesis agent normalizes uncertainty expressions into standardized probability representations (0.0-1.0), then weights their calibrated confidence.", "D": "Instruct the synthesis agent to use explicit sections separating confirmed findings from contested analysis, preserving original source characterizations."}, "a": "D", "sk": ["inconsistent handling of uncertainty"], "ak": ["explicit sections separating confirmed findings from contested analysis"], "note": "Bẫy: {C} (quy đổi xác suất 0-1) nghe kỹ thuật. Đáp án: tách rõ phần đã xác nhận và phần còn tranh cãi.", "ex": "Vấn đề cốt lõi là sự không nhất quán trong xử lý uncertainty. Giải pháp tốt nhất ở cấp kiến trúc là tách rõ confirmed findings vs contested analysis, giữ nguyên bản chất nguồn dữ liệu gốc thay vì ép vào định dạng chuẩn hóa gượng ép (vốn chính là nguyên nhân gây mâu thuẫn).\n\nTại sao các phương án khác chưa tối ưu\nA, B, C đều áp thêm lớp chuẩn hóa/lọc cứng nhắc (chuẩn hóa 0.0-1.0, lọc theo số nguồn) — không giải quyết gốc rễ việc nguồn dữ liệu gốc vốn đã mơ hồ.", "set": "Set 1", "topic": 4}, {"n": 33, "cat": "E", "stem": "The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source quality criteria (coverage breadth, source diversity), and content type classifications. The coordinator sometimes encounters challenges where instructions fail when the subagent encounters unexpected situations. What's the most effective way to improve subagent adaptability?", "opts": {"A": "Remove procedural detail entirely, delegating with simple goals like \"research it thoroughly\" and relying on the subagent's general capabilities.", "B": "Add explicit fallback directives to the detailed instructions: \"if specified searches fail, attempt alternative queries before reporting failure.\"", "C": "Implement a task classification step where the coordinator categorizes requests as \"analytical\" vs \"exploratory\" and uses different instruction sets for each category.", "D": "Specify research goals and quality criteria (coverage breadth, source diversity, content type) rather than procedural instructions, letting the subagent determine execution."}, "a": "D", "sk": ["unexpected situations"], "ak": ["research goals and quality criteria", "rather than procedural instructions"], "note": "Giao mục tiêu + tiêu chí chất lượng, không giao thủ tục từng bước.", "ex": "Hướng dẫn thủ tục quá chi tiết (procedural) dễ khiến subagent bế tắc khi tình huống bất ngờ. Chuyển sang giao quyền dựa trên mục tiêu + tiêu chuẩn chất lượng (goals & quality criteria) trao quyền tự chủ, subagent tự quyết cách thực thi tối ưu — cải thiện khả năng thích ứng.\n\nTại sao các phương án khác chưa tối ưu\nA\ngiao việc quá mơ hồ thiếu tiêu chí kiểm soát chất lượng, dễ lan man.\nB\nthêm fallback thủ công vẫn giữ bản chất cứng nhắc procedural.\nC\nphân loại analytical/exploratory không giải quyết trực tiếp việc xử lý tình huống bất ngờ giữa chừng.", "set": "Set 1", "topic": 4}, {"n": 34, "cat": "E", "stem": "The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources. How does information typically flow between these two specialized subagents?", "opts": {"A": "Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them.", "B": "The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters.", "C": "The coordinator agent receives the web search agent's output and includes relevant findings in the prompt when invoking the document analysis agent.", "D": "The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events."}, "a": "C", "sk": ["How does information typically flow"], "ak": ["coordinator agent receives the web search agent's output"], "note": "Hub-and-spoke: mọi thông tin đi qua coordinator.", "ex": "Trong kiến trúc đa agent tiêu chuẩn, subagent không giao tiếp trực tiếp với nhau. Coordinator đóng vai trò trung tâm: nhận output từ web search agent, xử lý/tổng hợp, rồi truyền các phát hiện liên quan vào prompt khi gọi document analysis agent.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nD\nshared memory store / event-driven queue không phải mô hình luồng thông tin tiêu chuẩn của hệ thống agent LLM — kiểm soát ngữ cảnh nằm ở vòng lặp coordinator.\nB\nsubagent không gọi trực tiếp lẫn nhau qua tham số hàm.", "set": "Set 1", "topic": 4}, {"n": 35, "cat": "E", "stem": "After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided. What is the most likely cause of this issue?", "opts": {"A": "The subagents need to share a single API connection to enable automatic context sharing between invocations.", "B": "The coordinator did not include the outputs from the previous agents in the synthesis agent's prompt.", "C": "The synthesis agent's context window is not large enough to hold the combined outputs from both previous agents.", "D": "The synthesis agent needs tools that can fetch results directly from the other agents' conversation histories."}, "a": "B", "sk": ["no research findings were provided"], "ak": ["did not include the outputs from the previous agents"], "note": "Subagent không tự có context → coordinator phải truyền vào prompt.", "ex": "Subagent độc lập, không tự động truyền ngữ cảnh cho nhau qua các lượt gọi. Coordinator phải chủ động inject/đính kèm output của agent trước vào prompt khi gọi synthesis agent — nếu quên, synthesis agent báo thiếu dữ liệu.\n\nTại sao các phương án khác chưa tối ưu\nA\nkhông cần chung API connection để chia sẻ ngữ cảnh tự động.\nC\nvượt context window thường gây lỗi token/cắt cụt chứ không phải báo \"không có thông tin\" trong khi output vốn nhỏ gọn.\nD\nsubagent không cần công cụ gọi trực tiếp lịch sử của nhau — truyền qua coordinator là mô hình chuẩn.", "set": "Set 1", "topic": 4}, {"n": 36, "cat": "E", "stem": "In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings. What's the most effective architectural change?", "opts": {"A": "Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents.", "B": "Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation.", "C": "Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations.", "D": "Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources."}, "a": "D", "sk": ["loses track of which sources support which conclusions"], "ak": ["structured claim-source mappings"], "note": "Mất nguồn trích dẫn → bắt subagent xuất cặp claim-nguồn có cấu trúc.", "ex": "Bắt buộc subagent xuất ra ánh xạ cấu trúc claim-source (thay vì văn bản thường thiếu ràng buộc). Synthesis agent bảo toàn/kế thừa/gộp các ánh xạ này xuyên suốt — giải quyết từ gốc kiến trúc truyền dữ liệu.\n\nTại sao các phương án khác chưa tối ưu\nA\nsemantic matching hậu kiểm chỉ vá víu sau khi lỗi đã xảy ra, dễ sai sót.\nB\nduy trì log toàn bộ + agent phân tích riêng rườm rà, tốn context.\nC\ntiền tố thủ công dễ lỗi parser, kém bền vững hơn cấu trúc dữ liệu tường minh.", "set": "Set 1", "topic": 4}, {"n": 37, "cat": "E", "stem": "Production monitoring shows that follow-up queries like \"summarize what we learned about market trends\" consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research. What's the most effective way to improve response time for these follow-up summaries?", "opts": {"A": "Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings.", "B": "Pre-generate and cache summaries at multiple granularities whenever new findings accumulate.", "C": "Have the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis.", "D": "Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand."}, "a": "C", "sk": ["already has these findings in its context"], "ak": ["handle straightforward summarization requests directly using its existing context"], "note": "Đã có sẵn trong context → tự làm, không spawn subagent.", "ex": "Coordinator đã có sẵn 80K+ tokens kết quả trong context từ quá trình điều phối. Yêu cầu tóm tắt tiếp theo là truy vấn đơn giản dựa trên thông tin có sẵn — để coordinator tự xử lý trực tiếp thay vì tốn thời gian/tài nguyên spawn subagent mới.\n\nTại sao các phương án khác chưa tối ưu\nA\nprompt caching giảm một phần chi phí nhưng vẫn tốn overhead gọi hàm/quản lý agent không cần thiết.\nB\ntiền tạo cache nhiều mức độ tăng phức tạp quản lý trạng thái khi dữ liệu động.\nD\nsubagent gọi ngược lại xin thông tin on-demand tăng round-trips, tăng latency.", "set": "Set 1", "topic": 4}, {"n": 38, "cat": "T", "stem": "After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations. What context-passing strategy provides the best balance of completeness and efficiency?", "opts": {"A": "Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated.", "B": "Pass the full accumulated context from all prior agents.", "C": "Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts.", "D": "Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only."}, "a": "C", "sk": ["proper source citations"], "ak": ["structured source index that maps key claims to their source URLs"], "note": "Bẫy: {D} (chỉ ghi tên nguồn) thiếu chi tiết; B quá nặng. Bản nháp + chỉ mục nguồn có cấu trúc.", "ex": "Truyền synthesis draft kèm structured source index (map claim → URL + excerpt) cho phép report agent lập bản đồ chính xác tuyên bố-nguồn mà không cần nhồi lại toàn bộ hàng nghìn token nội dung thô — cân bằng tối ưu completeness và efficiency.\n\nTại sao các phương án khác chưa tối ưu\nA\npost-processing so khớp thủ công sau khi report đã sinh dễ sai sót/chèn nhầm trích dẫn.\nB\ntruyền lại toàn bộ 138K+ tokens lãng phí, tăng latency, loãng ngữ cảnh.\nD\nchỉ định danh nguồn theo tên (không có index/excerpt) giảm độ chính xác, khó kiểm chứng.", "set": "Set 1", "topic": 4}, {"n": 39, "cat": "E", "stem": "When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely. What's the most effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the system?", "opts": {"A": "Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents.", "B": "Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity.", "C": "Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis.", "D": "Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations."}, "a": "C", "sk": ["preserving the coordinator's ability to monitor"], "ak": ["coordinator spawn parallel document analysis subagents"], "note": "Muốn song song mà coordinator vẫn kiểm soát → coordinator tự spawn song song.", "ex": "Coordinator chia nhỏ công việc, giao nhiều subagent chạy song song (mỗi agent xử lý tập con precedents), rồi gom kết quả — giảm latency đáng kể đồng thời coordinator vẫn giữ quyền kiểm soát trực tiếp để monitor/debug.\n\nTại sao các phương án khác chưa tối ưu\nA\nmessage queue/worker pool tăng phức tạp hạ tầng, giảm khả năng theo dõi trực tiếp của coordinator.\nB\nphân cấp đệ quy quá sâu không cần thiết, phức tạp hóa debug.\nD\nnested spawning làm mất kiểm soát tập trung, khó giám sát.", "set": "Set 1", "topic": 4}, {"n": 40, "cat": "E", "stem": "In production, you're distributing complex queries to specialized subagents. The query distribution is uneven and evolving as users discover new applications. What's the most effective approach to optimize for query complexity?", "opts": {"A": "Train a query complexity classifier based on labeled historical data to predict optimal subagent combination.", "B": "Have the coordinator analyze each query dynamically and selectively route subagents based on the query's complexity and routing characteristics.", "C": "Implement pattern-based routing that categorizes queries based on factual vs analytical patterns and maps each to a predefined subagent combination.", "D": "Create a fast-track path for factual questions that bypasses subagents entirely, routing only analytical queries through the complete pipeline."}, "a": "B", "sk": ["uneven and evolving"], "ak": ["analyze each query dynamically"], "note": "Truy vấn \"evolving\" → coordinator quyết định động, không classifier/luật cố định. (Giống câu 60)", "ex": "Phân phối truy vấn không đồng đều và liên tục tiến hóa → cần coordinator phân tích động (dynamically) từng truy vấn và định tuyến linh hoạt dựa trên đặc trưng phức tạp tại thời điểm thực thi, thay vì phương pháp tĩnh.\n\nTại sao các phương án khác chưa tối ưu\nA\nclassifier huấn luyện trên dữ liệu lịch sử tĩnh nhanh lỗi thời khi phân phối truy vấn thay đổi.\nC\npattern-based routing cứng nhắc, không xử lý biến thể mới.\nD\nfast-track bỏ qua hoàn toàn subagent cho câu hỏi thường làm giảm tính đồng nhất/khả năng xử lý chuyên sâu.", "set": "Set 1", "topic": 4}, {"n": 41, "cat": "T", "stem": "The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations–the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps. What's the most effective approach to ensure proper source attribution in the final reports?", "opts": {"A": "Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format.", "B": "Have each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers).", "C": "Have the report generator query the web se
