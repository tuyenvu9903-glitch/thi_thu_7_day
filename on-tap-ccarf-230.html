i khớp + trường phân biệt + xác nhận một chạm.", "ex": "Hiển thị các bản ghi khớp kèm trường phân biệt (email, ID, ngày tạo) giúp người dùng nhận diện chính xác + single-click confirmation thay luồng nhiều bước — vừa giảm xóa nhầm vừa giữ trải nghiệm nhanh gọn.\n\nTại sao các phương án khác chưa tối ưu\nA\ntự động gộp/xóa không qua xác nhận rất nguy hiểm, dễ mất dữ liệu nếu AI dự đoán sai.\nC\nsoft-delete chỉ là safety net bổ trợ, không ngăn việc xóa nhầm ban đầu hay giải quyết phân biệt tên tương tự.\nD\nbắt nhập ID thủ công tăng ma sát lớn cho quy trình ngôn ngữ tự nhiên.", "set": "Set 3", "topic": 3}, {"n": 130, "cat": "T", "stem": "Your team is extracting structured data from 50,000 legacy legal contracts under a two-week deadline. Initial testing with 500 sample documents shows 82% pass JSON schema first attempt, while the remaining 18% fail due to diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail typically need refinements targeting their specific failure modes before extraction succeeds. Which batch processing strategy is the most cost-efficient while still meeting the deadline?", "opts": {"A": "Use the real-time API for all 50,000 documents since the batch API's 24-hour processing window creates unacceptable deadline risk.", "B": "Split documents into 10 sequential batches of 5,000 each, analysing results and refining prompts between batches to improve extraction quality progressively.", "C": "Submit all 50,000 documents via batch API, then submit failed extractions in successive batches—refining prompts between each batch—until all documents pass validation.", "D": "Process 2,000 sample documents via real time API to identify failure patterns and refine prompts, then batch process all 50,000 with the optimized prompts."}, "a": "C", "sk": ["50,000", "two-week deadline"], "ak": ["Submit all 50,000 documents via batch API", "successive batches"], "note": "Bẫy: {D} và {B} nghe tối ưu. Thời hạn 2 tuần dư cho batch 24h → gửi tất cả bằng batch, phần lỗi chỉnh prompt rồi gửi lại.", "ex": "Batch API tiết kiệm 50% chi phí, xử lý trong 24h — thoải mái cho deadline 2 tuần. Gửi toàn bộ 50.000 tài liệu 1 lần (82% qua ngay), 18% lỗi tinh chỉnh prompt gửi lại các đợt batch tiếp theo đến khi đạt chuẩn.\n\nTại sao các phương án khác chưa tối ưu\nA\ndùng real-time cho tất cả tốn gấp đôi chi phí không cần thiết vì batch 24h đã đủ đáp ứng deadline.\nB\nchia 10 đợt NỐI TIẾP (mỗi đợt tối đa 24h) có thể kéo dài tới 10 ngày chỉ để đợi batch, rủi ro trễ hạn.\nD\nthử nghiệm 2.000 mẫu bằng real-time tốn thêm chi phí/thời gian thủ công trong khi batch đầu đã tự trích xuất thành công 82% với giá rẻ hơn.", "set": "Set 3", "topic": 5}, {"n": 131, "cat": "E", "stem": "After deploying an updated system prompt that improves response quality, users with multi-session conversations spanning several weeks report that the assistant now contradicts its earlier statements and has a noticeably different communication style. New users don't experience these issues. What's the best approach to resolve this?", "opts": {"A": "Add instructions to the new system prompt directing the assistant to maintain consistency with any prior statements in the conversation history.", "B": "Add a transition message when sessions resume explaining that the assistant has been updated and behavior may differ.", "C": "Version system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations.", "D": "Regenerate summaries of existing conversations using the new prompt and replace the stored histories to align past context with current behavior."}, "a": "C", "sk": ["multi-session conversations spanning several weeks", "New users don't experience"], "ak": ["Version system prompts", "applying updates only to new conversations"], "note": "Chỉ hội thoại cũ bị lỗi → gắn phiên bản prompt cho từng hội thoại.", "ex": "Prompt Versioning (best practice AI lifecycle management): mỗi hội thoại cũ tiếp tục dùng phiên bản prompt ban đầu khởi tạo; bản cập nhật mới chỉ áp dụng cho hội thoại mới — đảm bảo nhất quán tuyệt đối xuyên suốt vòng đời từng conversation.\n\nTại sao các phương án khác chưa tối ưu\nA\nthêm hướng dẫn tự nhất quán vào prompt mới vẫn có thể xung đột trực tiếp với lịch sử cũ, gây confusion.\nB\nchỉ là thông báo tình thế, không giải quyết mâu thuẫn logic/phong cách kỹ thuật.\nD\ntạo lại tóm tắt cũ bằng prompt mới tốn token, nguy cơ mất/biến dạng thông tin quá khứ quan trọng.", "set": "Set 3", "topic": 7}, {"n": 132, "cat": "T", "stem": "Evaluation shows 94% extraction accuracy on short meeting transcripts (<30 minutes) but only 68% on longer transcripts (>60 minutes) where discussions meander and key information is scattered throughout. Transcripts of both lengths fit within the model's context window. What pattern most effectively improves accuracy on complex, lengthy documents?", "opts": {"A": "Upgrade to a more capable model tier for the extraction task", "B": "Add a pre-extraction step where the model summarizes key discussions and conclusions before performing structured extraction.", "C": "Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered information.", "D": "Split lengthy transcripts into chunks, extract from each chunk separately, then merge and deduplicate the results."}, "a": "D", "sk": ["key information is scattered", "Transcripts of both lengths fit within the model's context window"], "ak": ["Split lengthy transcripts into chunks"], "note": "Bẫy: đề nói vừa context, dễ nghĩ không cần chia. Nhưng thông tin rải rác → chia chunk, trích từng phần rồi gộp.", "ex": "\"Lost in the Middle\": dù transcript dài vẫn vừa context window, nhưng attention bị pha loãng khi thông tin phân tán → giảm chính xác 94%→68%. Áp dụng MapReduce: chunking (mỗi đoạn nhỏ giữ 100% attention) → extract độc lập từng đoạn → merge & deduplicate kết quả cuối.\n\nTại sao các phương án khác chưa tối ưu\nA\nupgrade model tốn chi phí nhưng không giải quyết bản chất pha loãng attention trên ngữ cảnh dài phân tán.\nB\npre-extraction summarization vẫn bắt model đọc hết ngữ cảnh bị pha loãng ngay bước 1, nguy cơ bỏ sót ngay trong tóm tắt.\nC\nfew-shot tốn token, không giúp nhiều vì cấu trúc mỗi cuộc họp dài khác nhau hoàn toàn.", "set": "Set 3", "topic": 5}, {"n": 133, "cat": "E", "stem": "You're implementing a complex graph traversal algorithm with specific performance requirements and edge cases to handle (disconnected nodes, cycles, weighted edges). You want to structure your workflow for efficient iterative refinement with Claude. What approach will most effectively enable progressive improvement across multiple iterations?", "opts": {"A": "Provide Claude with a detailed natural language specification of the algorithm, including all requirements and edge cases. Review each output manually and provide descriptive feedback on what behavior needs to change.", "B": "Write a test suite covering expected behavior, edge cases, and performance requirements before implementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with each refinement request.", "C": "Have Claude extensively research the algorithm and create a detailed implementation plan using extended thinking, then implement the complete solution based on that plan.", "D": "Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, comparing outputs against the reference."}, "a": "B", "sk": ["iterative refinement"], "ak": ["Write a test suite", "sharing test failures"], "note": "Lặp cải tiến tốt nhất → test trước, đưa lỗi test để sửa.", "ex": "TDD với AI: viết test suite trước (bao phủ behavior, edge case, performance) tạo tiêu chí thành công khách quan/tự động. Vòng lặp Code → Test → Share Failure → Refine dùng chính test failures làm input chính xác nhất để Claude điều chỉnh — nhanh, chính xác, đo lường được.\n\nTại sao các phương án khác chưa tối ưu\nA\nđánh giá thủ công thuật toán đồ thị phức tạp tốn thời gian, dễ sót bug, kém chính xác hơn kết quả test thực tế.\nC\nplan tốt đến đâu vẫn phát sinh bug/edge case khi triển khai thực tế, không thay thế được kiểm thử/tinh chỉnh.\nD\nchỉ áp dụng khi có sẵn reference code tương đồng, so sánh thủ công không đảm bảo bao phủ hết performance/edge case đặc thù.", "set": "Set 3", "topic": 1}, {"n": 134, "cat": "E", "stem": "Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests (/kubernetes/), and CI/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root CLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load into context unnecessarily, consuming tokens. What is the best approach to reorganize so only relevant guidance loads when editing specific file types?", "opts": {"A": "Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads directory-specific guidance.", "B": "Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents.", "C": "Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading rules only when editing matching files.", "D": "Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., \"## Terraform Conventions\"), improving organization and readability."}, "a": "C", "sk": ["only relevant guidance loads when editing specific file types"], "ak": [".claude/rules/", "YAML frontmatter path-scoping"], "note": "Nạp theo loại file → .claude/rules/ với paths.", "ex": ".claude/rules/ với YAML frontmatter path-scoping (paths: [\"terraform/**/*\"]) — Claude Code chỉ tải rule vào context khi thao tác trên file khớp đường dẫn đó, giải quyết đúng vấn đề tốn token không cần thiết.\n\nTại sao các phương án khác chưa tối ưu\nA\nClaude Code chỉ tự động tải CLAUDE.md ở root/thư mục dự án hiện tại, không tự phân vùng theo loại file linh hoạt như rules path-scoping. B @import vẫn nạp tất cả quy tắc đồng loạt vào context, không giải quyết tốn token.\nD\nchia section bằng header chỉ dễ đọc hơn, toàn bộ 500+ dòng vẫn bị tải đầy đủ mỗi lần chạy.", "set": "Set 3", "topic": 1}, {"n": 135, "cat": "T", "stem": "After expanding the agent's MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools- calling issue_credit when process_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data. Which approach structurally eliminates the semantic overlaps that are being logged as the error source?", "opts": {"A": "Split the tools across two sub-agents - a \"financial resolution\" agent with process_refund, issue_credit, and apply_promo_code, and a \"delivery\" agent with the remaining delivery tools - with a coordinator routing between them.", "B": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate.", "C": "Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation tool with an optional include_tracking flag.", "D": "Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed."}, "a": "C", "sk": ["structurally eliminates the semantic overlaps"], "ak": ["Consolidate semantically overlapping tools"], "note": "Bẫy: {A} chia sub-agent vẫn giữ trùng lặp. \"Structurally eliminates overlap\" → gộp các tool trùng nghĩa. (Giống câu 136)", "ex": "Lỗi cốt lõi là chồng chéo ngữ nghĩa (semantic overlap) giữa các tool. Giải pháp cấu trúc tận gốc: hợp nhất (consolidate) tool trùng chức năng thành 1 tool duy nhất với tham số linh hoạt xử lý các trường hợp.\n\nTại sao các phương án khác chưa tối ưu\nA\nchia sub-agent chỉ chuyển bớt số lượng tool, nhưng process_refund và issue_credit vẫn cùng nằm trong 1 sub-agent — chồng chéo chưa mất.\nB\nfew-shot chỉ là mẹo prompt engineering, không sửa gốc rễ thiết kế.\nD\ntool search/defer loading giải quyết vấn đề số lượng tool lớn (token overhead), không giải quyết xung đột giữa 2 tool ý nghĩa giống nhau.", "set": "Set 3", "topic": 3}, {"n": 136, "cat": "T", "stem": "After expanding the agent's MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when lookup_order already returns the needed data. Which approach structurally eliminates the semantic overlap identified in the error source?", "opts": {"A": "Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag.", "B": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate.", "C": "Split the tools across two sub-agents — a 'financial resolution' agent with issue_credit, process_refund, return_order, and apply_promo_code and a 'delivery operations' agent with the remaining delivery tools — with a coordinating routing between them.", "D": "Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed."}, "a": "A", "sk": ["structurally eliminates the semantic overlap"], "ak": ["Consolidate semantically overlapping tools"], "note": "Giống câu 135: gộp tool trùng nghĩa. Các phương án chia agent/defer_loading không xoá trùng lặp.", "ex": "(Gần trùng Q135) Hợp nhất tool chồng chéo chức năng thành 1 tool duy nhất kèm tham số phân loại (gộp issue_credit+process_refund; gộp check_delivery_status vào lookup_order với cờ include_tracking) — loại bỏ hoàn toàn từ cấu trúc, model không còn phân vân giữa 2 tool tương tự.\n\nTại sao các phương án khác chưa tối ưu\nB\nfew-shot chỉ hỗ trợ prompt, không sửa cấu trúc thiết kế.\nC\nchia sub-agent vẫn giữ nguyên tool chồng chéo bên trong cùng 1 sub-agent.\nD\ntool search/defer loading chỉ quản lý số lượng tool lớn để tiết kiệm token, không giải quyết xung đột ngữ nghĩa giữa 2 tool giống nhau.", "set": "Set 3", "topic": 3}, {"n": 137, "cat": "E", "stem": "Your order management system requires tools for three distinct operations: issuing refunds (requires amount and reason), canceling orders (requires reason), and reshipping orders (requires shipping address). Each operation shares an order_id parameter but has different additional requirements. You notice during testing that with your current unified tool, the agent frequently omits required parameters or includes irrelevant ones. What design change will most effectively improve parameter accuracy?", "opts": {"A": "Keep one unified tool with all parameters marked optional, but add few-shot examples in the system prompt showing correct parameter combinations for each operation.", "B": "Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount are required only when the operation type is \"refund\".", "C": "Split into three separate tools, each defining only the parameters required for that specific operation.", "D": "Keep one unified tool with a nested operation object parameter whose internal structure varies by operation type, documented in the tool description."}, "a": "C", "sk": ["different additional requirements", "omits required parameters"], "ak": ["Split into three separate tools"], "note": "Mỗi thao tác cần tham số khác nhau → tách tool.", "ex": "Single Responsibility Principle for Tools: chia 3 tool riêng biệt (issue_refund, cancel_order, reship_order) với JSON Schema rõ ràng cho từng thao tác — model dễ xác định chính xác tham số bắt buộc. Best practice: nhiều tool nhỏ schema rõ ràng tốt hơn 1 tool đa năng schema phức tạp.\n\nTại sao các phương án khác chưa tối ưu\nA\nfew-shot không đảm bảo 100% vì schema vẫn optional, vẫn có xác suất điền sai.\nB\nif-then-else JSON Schema — hầu hết LLM (kể cả Claude) xử lý cú pháp logic điều kiện phức tạp trong schema rất kém.\nD\nnested object tăng độ khó tạo JSON payload, dễ lỗi định dạng.", "set": "Set 3", "topic": 3}, {"n": 138, "cat": "T", "stem": "Your fitness coaching assistant uses a system prompt with detailed conditional logic: \"If the user mentions being a beginner, provide step-by-step form instructions. If they use terms 'progressive overload' or 'superset', respond concisely. If they ask about injury history, always recommend consulting a physician.\" During evaluation, you find the assistant handles explicit expertise declarations correctly but struggles when users don't clearly state their level—often defaulting to overly detailed responses regardless of contextual cues like technical terms. Which change to the system prompt would most directly address this failure to pick up on implicit expertise signals?", "opts": {"A": "Add more conditional branches to cover additional expertise signals, such as \"If user mentions specific rep ranges or asks about periodization, treat as advanced.\"", "B": "Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise, mirroring their terminology.\" Keep only the safety-critical conditional about consultations.", "C": "Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses.", "D": "Add an explicit instruction for the model to ask a clarifying question about experience level whenever the user's expertise isn't immediately clear from their first message."}, "a": "B", "sk": ["implicit expertise signals"], "ak": ["general principle", "Keep only the safety-critical conditional"], "note": "Bẫy: {A} thêm nhánh if nghe hợp lý nhưng không bao giờ đủ. Dùng nguyên tắc chung, chỉ giữ luật an toàn.", "ex": "Over-specifying Conditional Logic: quá nhiều điều kiện cứng khiến model máy móc, rơi vào default khi user không dùng đúng từ khóa. LLM hiện đại (Claude) mạnh trong hiểu ngữ cảnh tự nhiên — dùng general principle (\"Adapt explanation depth... mirroring terminology\") để model tự nhận tín hiệu ngầm, chỉ giữ conditional cứng cho an toàn quan trọng (tư vấn y tế).\n\nTại sao các phương án khác chưa tối ưu\nA\nthêm nhiều nhánh if-else càng cồng kềnh, xung đột logic, không bao giờ phủ hết thực tế.\nC\nintake form thay đổi UX, không tối ưu khả năng đọc tín hiệu ngầm của LLM trong prompt.\nD\nhỏi lại gây gián đoạn trải nghiệm khi model hoàn toàn có thể tự suy luận từ ngữ cảnh.", "set": "Set 3", "topic": 7}, {"n": 139, "cat": "E", "stem": "You're building a security scanning workflow. When engineers need to locate all occurrences of a dangerous function like eval() across a large codebase, which tool should your agent use for content search?", "opts": {"A": "Use Bash to run ls -R | grep eval to recursively list files containing eval.", "B": "Read the project's main entry file and follow import statements to trace where eval might be used.", "C": "Use Grep to search for the pattern \"eval(\" across all files in the codebase.", "D": "Use Glob with a pattern like *eval* to find files, then Read each matching file."}, "a": "C", "sk": ["locate all occurrences of a dangerous function like eval()"], "ak": ["Grep to search for the pattern \"eval(\""], "note": "Tìm nội dung → Grep.", "ex": "Grep là công cụ chuyên dụng cho content search/pattern matching bên trong nội dung file. Tìm \"eval(\" bằng Grep tìm chính xác các dòng mã chứa chuỗi này nhanh và tối ưu nhất trên toàn codebase.\n\nTại sao các phương án khác chưa tối ưu\nA `ls -R | grep` chỉ liệt kê tên file, không đọc nội dung bên trong — bỏ sót nếu file tên khác (vd auth.js) chứa eval().\n\nB\nđọc thủ công + trace import tốn token/thời gian, dễ bỏ sót file không import trực tiếp.\nD\nGlob chỉ tìm theo TÊN file/đường dẫn, không tìm nội dung — file main.js chứa eval() bên trong nhưng tên không khớp pattern sẽ bị bỏ sót.", "set": "Set 3", "topic": 2}, {"n": 140, "cat": "E", "stem": "Your test generation produces unit tests for new code, but reviews show 55% are low-value: trivial assertions that only verify functions don't throw exceptions, tests duplicating existing coverage, or tests ignoring your team's fixture conventions. How do you reduce the rate of low-value tests being generated in the first place?", "opts": {"A": "Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.", "B": "Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers.", "C": "Add post-generation coverage analysis that automatically filters out any generated test that doesn't increase line coverage beyond what existing tests provide.", "D": "Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}, "a": "D", "sk": ["in the first place"], "ak": ["Document testing standards in CLAUDE.md"], "note": "\"Ngay từ đầu\" → chuẩn hoá trong CLAUDE.md, không lọc sau. (Giống câu 156)", "ex": "Nguyên nhân test kém chất lượng: AI thiếu ngữ cảnh/tiêu chuẩn đặc thù dự án. Ghi tiêu chuẩn test, danh sách fixture, ví dụ phân biệt behavioral test vs trivial assertion trực tiếp trong CLAUDE.md — Claude hiểu đúng kỳ vọng ngay từ bước khởi tạo prompt context (giải quyết TỪ ĐẦU, đúng yêu cầu đề bài).\n\nTại sao các phương án khác chưa tối ưu\nA\ngiới hạn thư mục là né tránh, không giải quyết, khiến vùng code mới không dùng được tự động hóa.\nB\ngọi Claude lần 2 chấm điểm tốn gấp đôi token/thời gian, không giải quyết gốc rễ (bước 1 vẫn thiếu thông tin).\nC\nline coverage không phản ánh giá trị hành vi — trivial assertion vẫn có thể đạt coverage cao.", "set": "Set 3", "topic": 1}, {"n": 141, "cat": "T", "stem": "Your expense reimbursement agent processes employee requests using a process_reimbursement tool. Company policy requires that reimbursements above $500 must be approved before funds are disbursed. The agent handles hundreds of requests daily, and you need the threshold enforcement to be tamper-proof regardless of how the agent is prompted. What ensures the $500 approval threshold cannot be bypassed?", "opts": {"A": "The process_reimbursement tool accepts an approved_by_manager parameter. The system prompt instructs the agent to only set this to true after confirming that a manager approved the request. A nightly audit script reviews all reimbursements where approved_by_manager was set to true.", "B": "The process_reimbursement tool accepts amount and details, and internally enforces the threshold; amounts <$500 are auto-disbursed and the tool returns a success confirmation. Amounts >$500 cause the tool to create a pending approval request and return a status indicating manager review is pending.", "C": "Provide two tools: auto_reimburse (hard-coded limit of $500) and manager_approval. Include detailed system prompt instructions telling the agent to check the amount and use the appropriate tool. Add a PostToolUse hook that logs which tool was called for auditing.", "D": "Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process_reimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires_approval: true flag, which the tool checks before disbursing."}, "a": "B", "sk": ["tamper-proof regardless of how the agent is prompted"], "ak": ["internally enforces the threshold"], "note": "Bẫy: {D} (PreToolUse hook gắn cờ) nghe chắc. Đáp án: chính tool tự chặn ngưỡng trong code — không thể lách.", "ex": "Defense in Depth: System Prompt/LLM logic KHÔNG BAO GIỜ là security boundary duy nhất cho quy tắc nghiệp vụ quan trọng (LLM có thể hallucinate/bị prompt injection). Đưa logic kiểm tra $500 vào chính CODE BACKEND của tool — dù agent gửi tham số gì, backend vẫn thực thi đúng chính sách, không thể bị qua mặt.\n\nTại sao các phương án khác chưa tối ưu\nA\ndựa vào tham số agent tự set (approved_by_manager) — có thể bị jailbreak/prompt injection; audit chỉ phát hiện SAU KHI tiền đã chi.\nC\ndựa hoàn toàn vào Agent tự chọn đúng tool qua system prompt — agent có thể chọn nhầm/cố tình chọn sai tool.\nD\nhook sửa context vẫn phụ thuộc tool đọc cờ do AI quản lý trong context, kém an toàn hơn hardcode logic trong backend.", "set": "Set 3", "topic": 3}, {"n": 142, "cat": "E", "stem": "Your portfolio value tool returns the total value of a user's investment portfolio. You're deciding between returning a structured JSON object with explicit fields versus returning information as a formatted text string. What is the primary advantage of using structured output with defined fields?", "opts": {"A": "Structured JSON is processed deterministically by the model, significantly improving accuracy when extracting values.", "B": "Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs.", "C": "JSON schemas automatically validate that the underlying API returned correct data before the agent processes it.", "D": "The agent can reliably extract specific values without parsing free-form text, reducing errors in subsequent operations."}, "a": "D", "sk": ["primary advantage of using structured output"], "ak": ["reliably extract specific values without parsing free-form text"], "note": "Lợi ích chính của JSON: lấy giá trị chắc chắn, không phải parse text.", "ex": "Structured output với field rõ ràng (portfolio_value, currency, holdings...) cho phép agent đọc/trích xuất trực tiếp giá trị mong muốn mà không cần parse text tự do — giảm nguy cơ hiểu sai/trích nhầm số liệu ở các thao tác tiếp theo.\n\nTại sao các phương án khác chưa tối ưu\nA\nLLM vẫn là mô hình xác suất, JSON giúp trích xuất dễ hơn nhưng không biến xử lý thành deterministic tuyệt đối.\nB\nJSON thường tốn NHIỀU token hơn text tự nhiên đơn giản (do cú pháp ngoặc, key name).\nC\nJSON schema chỉ định nghĩa cấu trúc trả về, không tự động xác thực dữ liệu nghiệp vụ backend có đúng logic hay không.", "set": "Set 3", "topic": 3}, {"n": 143, "cat": "T", "stem": "Performance analysis reveals your context is composed of accumulated RAG results from all previous queries, which is crowding out conversation history and causing coherence degradation after 15+ turns. Which approach best addresses this issue?", "opts": {"A": "Compress all RAG results into a consolidated summary document that updates incrementally after each retrieval", "B": "Implement a sliding window for RAG results from the last 2-3 queries while preserving conversation history", "C": "Implement semantic deduplication to identify and remove redundant information across the accumulated RAG results and conversation turns", "D": "Shift context budget to favor RAG results while reducing conversation history allocation"}, "a": "B", "sk": ["accumulated RAG results", "crowding out conversation history"], "ak": ["sliding window for RAG results from the last 2-3 queries while preserving conversation history"], "note": "Bẫy: nhiều câu khác coi sliding window là sai, nhưng ở đây áp cho kết quả RAG (không phải lịch sử hội thoại) là đúng.", "ex": "Tích lũy kết quả RAG không dọn dẹp chiếm hết context, chèn ép lịch sử hội thoại. Sliding window chỉ giữ RAG của 2-3 lượt gần nhất + bảo tồn lịch sử hội thoại — cân bằng tốt nhất giữa tra cứu ngắn hạn và tính liên tục hội thoại.\n\nTại sao các phương án khác chưa tối ưu\nA\nnén liên tục sau mỗi lượt tốn chi phí tính toán/latency, dễ mất chi tiết tra cứu chính xác.\nC\ndedup không giải quyết vấn đề khối lượng RAG MỚI vẫn tích lũy tăng theo thời gian.\nD\ngiảm lịch sử hội thoại càng làm tệ hơn tình trạng mất mạch lạc.", "set": "Set 3", "topic": 7}, {"n": 144, "cat": "E", "stem": "Your team frequently migrates React components to Vue. You've written a step-by-step workflow for Claude Code to follow during each migration, and you want every developer on the team to invoke it by typing /migrate-component. The workflow should stay in sync as the team iterates on it. Where should you place the skill file?", "opts": {"A": "As a detailed instruction block in the project's root CLAUDE.md file", "B": "In the project's .claude/settings.json using a skillOverrides entry to register and define the workflow", "C": "In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control", "D": "In ~/.claude/skills/migrate-component/SKILL.md on each developer's machine"}, "a": "C", "sk": ["every developer on the team", "stay in sync"], "ak": [".claude/skills/migrate-component/SKILL.md at the project root, committed to version control"], "note": "Cả team dùng + đồng bộ → skill trong project, commit vào git.", "ex": "Custom slash command trong Claude Code định nghĩa qua file .claude/skills/<skill-name>/SKILL.md ở project root. Commit vào version control đảm bảo mọi thành viên team nhận bản cập nhật mới nhất khi pull code — đúng yêu cầu \"stay in sync\".\n\nTại sao các phương án khác chưa tối ưu\nA\nCLAUDE.md chứa quy chuẩn chung, không tạo thành slash command riêng gọi được.\nB\nskillOverrides trong settings.json không phải cấu trúc chính thức để đăng ký custom skill.\nD\nđặt ở ~/.claude/skills/ cấp user-level trên máy cá nhân, không tự động chia sẻ/đồng bộ qua Git cho cả team.", "set": "Set 3", "topic": 1}, {"n": 145, "cat": "T", "stem": "The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string array), cons (string array), and overall_sentiment (enum: positive, negative, mixed). Testing reveals two issues with brief or ambiguous reviews (~20% of the dataset): (1) for reviews like \"Great product!\", Claude fabricates specific pros and cons rather than indicating this information isn't explicitly stated, and (2) for sarcastic reviews like \"Well that was... interesting\", Claude picks sentiment arbitrarily since there's no option for ambiguous cases. What schema modification best addresses both issues?", "opts": {"A": "Make pros and cons optional fields, and add \"neutral\" and \"unclear\" to the sentiment enum.", "B": "Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls below a threshold.", "C": "Allow null values for pros/cons, and add \"unclear\" to the sentiment enum.", "D": "Allow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum."}, "a": "D", "sk": ["fabricates specific pros and cons", "no option for ambiguous cases"], "ak": ["empty arrays for pros/cons", "\"unclear\""], "note": "Bẫy chữ: {C} (null) vs {D} (mảng rỗng). Với kiểu mảng, \"không có\" = mảng rỗng. Cả hai đều thêm \"unclear\".", "ex": "(1) pros/cons là string array — cho phép mảng rỗng [] khi không có thông tin, model không phải \"bịa\" để lấp đầy, giữ nguyên kiểu dữ liệu array nhất quán. (2) thêm \"unclear\" vào enum overall_sentiment cho phép model chọn chính xác khi gặp câu mỉa mai/mơ hồ thay vì đoán ngẫu nhiên giữa positive/negative/mixed.\n\nTại sao các phương án khác chưa tối ưu\nA\noptional field làm schema thiếu ràng buộc chặt chẽ; \"neutral\" không đúng bản chất câu mỉa mai (cần \"unclear\").\nB\nconfidence score dễ sai do LLM overconfidence bias, tăng phức tạp không cần thiết.\nC\nnull value dễ gây type error ở backend nếu code đang chờ array — [] chuẩn hóa hơn null.", "set": "Set 3", "topic": 5}, {"n": 146, "cat": "T", "stem": "Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes exhausts its max_turns limit after gathering data and before completing resolution or escalating. The team's goal is to guarantee that every customer interaction ends with either a completed resolution or a human escalation, regardless of how the agent loop terminates. Which approach achieves this guarantee?", "opts": {"A": "Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute.", "B": "Add orchestration-layer code that checks the agent's outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results.", "C": "Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions.", "D": "Split the workflow into two sequential agent invocations — a first agent gathers information via get_customer and lookup_order, then the second agent uses that data and handles process_refund or escalate_to_human, each with separate turn budgets."}, "a": "B", "sk": ["guarantee", "regardless of how the agent loop terminates"], "ak": ["orchestration-layer code that checks the agent's outcome after each loop termination"], "note": "Bẫy: {C} (hook đếm 80%) nghe kỹ thuật. \"Guarantee dù loop kết thúc thế nào\" → code ở tầng điều phối kiểm tra sau khi loop dừng.", "ex": "Khi chạm max_turns, vòng lặp bị ngắt đột ngột từ hạ tầng — model không còn cơ hội tự gọi tool nào nữa. Để đảm bảo 100% (guarantee) bất kể agent loop kết thúc thế nào, orchestration layer (code hệ thống bên ngoài) phải trực tiếp bắt sự kiện kết thúc, kiểm tra nếu chưa resolution/escalation thì CHỦ ĐỘNG gọi escalate_to_human kèm toàn bộ context đã thu thập.\n\nTại sao các phương án khác chưa tối ưu\nA\nsystem prompt vô hiệu hoàn toàn một khi vượt max_turns vì model không được kích hoạt chạy tiếp.\nC\nhook ở 80% chỉ là phỏng đoán thời điểm, không cam kết tuyệt đối.\nD\nchia 2 agent giảm khả năng chạm trần nhưng không đảm bảo 100% nếu agent thứ 2 vẫn hết ngân sách turns của nó.", "set": "Set 3", "topic": 6}, {"n": 147, "cat": "E", "stem": "A developer uses Claude Code to refactor a function during their development session. Before committing, they ask the same Claude session to review the code for issues. Later, a separate automated CI review catches several bugs that the same-session review missed. What best explains this discrepancy?", "opts": {"A": "The CI environment has access to the full codebase context while the local session only sees the current file", "B": "The CI review uses a more specific prompt tailored for catching bugs, while the developer's request was too general", "C": "Claude retains context about its prior reasoning in the session, making it less likely to question its own decisions", "D": "The extended session length caused the context window to fill with conversation history, leaving less room for thorough analysis"}, "a": "C", "sk": ["same Claude session to review"], "ak": ["retains context about its prior reasoning"], "note": "Tự review trong cùng phiên → thiên vị lập luận cũ. Nên review bằng phiên độc lập.", "ex": "Confirmation bias/self-consistency issue: review trong cùng session vừa refactor, Claude vẫn giữ toàn bộ ngữ cảnh/lập luận cũ — có xu hướng tự đồng ý với quyết định trước đó thay vì kiểm tra khách quan, độc lập.\n\nTại sao các phương án khác chưa tối ưu\nA\nClaude Code local session vẫn truy cập được toàn bộ codebase qua tool tìm kiếm/đọc file, không giới hạn 1 file.\nB\nprompt cụ thể hơn có thể giúp ích nhưng vấn đề cốt lõi là context bias, không chỉ do câu lệnh chung chung.\nD\nđộ dài session có ảnh hưởng nhưng lý do chính là giữ lại lịch sử lý luận làm giảm khả năng tự phản biện.", "set": "Set 3", "topic": 1}, {"n": 148, "cat": "E", "stem": "You've configured your Claude agent with three MCP servers: one for git operations, one for Jira ticket management, and one for documentation search. When a user asks the agent to \"create a branch for JIRA-123 and add documentation links to the ticket,\" how does the agent access tools across these servers?", "opts": {"A": "The agent automatically selects the most relevant server based on the request and loads only that server's tools.", "B": "Tools from all configured MCP servers are discovered at connection time and available simultaneously to the agent.", "C": "The agent queries each server sequentially to determine which handles each tool, routing calls based on tool name prefixes.", "D": "You must specify which MCP server to use for each turn, and the agent can only access one server's tools at a time."}, "a": "B", "sk": ["how does the agent access tools across these servers"], "ak": ["discovered at connection time and available simultaneously"], "note": "MCP: mọi tool từ mọi server có sẵn cùng lúc.", "ex": "MCP protocol: client gửi tools/list tới TẤT CẢ server đã cấu hình tại thời điểm kết nối (connection time). Tool từ mọi server (Git, Jira, Docs) được hợp nhất, cung cấp đồng thời — agent có thể phối hợp tool từ nhiều server trong cùng 1 lượt xử lý.\n\nTại sao các phương án khác chưa tối ưu\nA\nagent không tải linh hoạt theo nhu cầu mà tải tất cả tool ngay lúc khởi tạo.\nC\nkhông có cơ chế truy vấn tuần tự theo prefix — danh sách tool đã tổng hợp sẵn trước khi thực thi prompt.\nD\nngười dùng không cần chỉ định thủ công server, agent truy cập nhiều server cùng lúc.", "set": "Set 3", "topic": 3}, {"n": 149, "cat": "E", "stem": "An engineer submits two requests: Request A: \"Rename the getUserData function to fetchUserProfile everywhere it's used.\" Request B: \"Improve error handling throughout the data processing module—add try/catch blocks, meaningful error messages, and ensure failures don't silently corrupt data.\" For which request does specifying an explicit multi-phase workflow (such as analyze → propose → implement → review) most improve outcome quality?", "opts": {"A": "Both requests benefit equally", "B": "Neither request benefits significantly", "C": "Request A, the function rename task", "D": "Request B, the error handling task"}, "a": "D", "sk": ["Improve error handling throughout"], "ak": ["Request B, the error handling task"], "note": "Việc mở, phức tạp → cần workflow nhiều pha; đổi tên thì không.", "ex": "Request A là refactoring cơ học, ít rủi ro logic/thiết kế — thực hiện trực tiếp không cần quy trình phức tạp. Request B là nhiệm vụ mở (open-ended), thiết kế lại error handling toàn module — multi-phase workflow (analyze → propose → implement → review) giúp xác định điểm rủi ro, đề xuất chiến lược try/catch trước khi triển khai, rà soát đảm bảo không phá vỡ luồng chính.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nB\nlợi ích giữa 2 tác vụ chênh lệch hoàn toàn —\nB\n(thiết kế phức tạp) hưởng lợi vượt trội hơn\nA\n(cơ học).\nC\nRequest\nA\nkhông cần giai đoạn đề xuất/phân tích kiến trúc phức tạp.", "set": "Set 3", "topic": 1}, {"n": 150, "cat": "E", "stem": "During initial testing of the automated review pipeline, you notice that reviews on large PRs (50+ changed files) sometimes take over 20 minutes and cost $8-12 per run due to extensive agentic loops — Claude reads files, runs analysis tools, and iterates many times. Your team needs each invocation to abort once it reaches a fixed iteration count and a fixed dollar amount, enforced by Claude Code itself rather than the surrounding job runner. Which configuration change directly enforces both of those per-invocation caps?", "opts": {"A": "Set timeout-minutes: 5 on the GitHub Actions job step and monitor per-run costs via the Anthropic Console usage dashboard.", "B": "Switch the --model flag to a smaller, cheaper model so each iteration uses fewer tokens and lower per-call cost.", "C": "Set --permission-mode dontAsk to auto-deny any tool permission requests not in the explicitly allowed set.", "D": "Add --max-turns 10 --max-budget-usd 2.00 to the claude -p invocation to cap iterations and spend."}, "a": "D", "sk": ["enforced by Claude Code itself"], "ak": ["--max-turns 10 --max-budget-usd 2.00"], "note": "Giới hạn lượt + tiền trong CLI → --max-turns và --max-budget-usd.", "ex": "Claude Code CLI có sẵn 2 flag đáp ứng đúng yêu cầu: --max-turns (giới hạn số lượt lặp) và --max-budget-usd (giới hạn chi phí USD, tự động dừng khi chạm ngưỡng) — do chính Claude Code quản lý, không phải runner ngoài.\n\nTại sao các phương án khác chưa tối ưu\nA\ntimeout-minutes cấu hình trên GitHub Actions (runner ngoài), không phải Claude Code tự quản; Console dashboard chỉ xem báo cáo sau, không chủ động chặn.\nB\nmodel nhỏ hơn chỉ giảm chi phí/lượt, không đặt hard cap về số lượt/tổng ngân sách. C --permission-mode dontAsk quản lý quyền tool, không giới hạn iteration/chi phí.", "set": "Set 3", "topic": 1}, {"n": 151, "cat": "T", "stem": "Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing, Claude frequently omits user_id or passes incorrectly structured data. What is most critical for helping Claude understand what parameter values to provide?", "opts": {"A": "Strict JSON Schema type constraints marking user_id as required and defining fields_to_update as an object type", "B": "Clear parameter descriptions explaining expected format, such as \"user_id: UUID of the user to update (required)\"", "C": "Verbose parameter names encoding format hints, such as user_id_string_uuid_format", "D": "Detailed error responses explaining why invalid parameter values were rejected"}, "a": "B", "sk": ["What is most critical for helping Claude understand"], "ak": ["Clear parameter descriptions"], "note": "Bẫy: {A} (schema chặt) nghe đúng. Nhưng để HIỂU nên điền gì → mô tả tham số rõ ràng.", "ex": "Parameter descriptions rõ ràng là yếu tố quan trọng nhất giúp Claude hiểu ngữ cảnh/ý nghĩa/định dạng dữ liệu kỳ vọng (vd UUID) và thời điểm cần cung cấp. JSON Schema chỉ định nghĩa kiểu dữ liệu cú pháp, Claude cần mô tả ngữ nghĩa chi tiết để đưa giá trị chính xác.\n\nTại sao các phương án khác chưa tối ưu\nA\nràng buộc schema chỉ kiểm tra cấu trúc, không giúp hiểu định dạng cụ thể nếu thiếu mô tả.\nC\ntên tham số dài dòng tốn token, không phải giải pháp chuẩn để giải thích định dạng.\nD\nerror response chỉ sửa sai SAU khi đã thất bại (reactive), mô tả rõ ràng ngăn lỗi ngay từ đầu (proactive).", "set": "Set 3", "topic": 3}, {"n": 152, "cat": "E", "stem": "Your conversation history includes two types of content: persistent story elements (character backgrounds, plot structure, world rules) that must remain consistent throughout, and extensive brainstorming discussion that's mostly ephemeral. After 40+ turns, you're hitting context limits and users report the assistant \"forgets\" established character traits, breaking narrative consistency. Which approach best ensures persistent story elements remain available to the model while reclaiming context space?", "opts": {"A": "Store all history in a vector database and retrieve semantically similar passages for each new message, replacing conversation history with retrieved chunks.", "B": "Separate persistent story elements into a retained \"story bible\" section at context start, applying trimming or summarization only to brainstorming discussion.", "C": "Summarize the entire conversation history into a condensed synopsis every 20 turns, replacing the full history to free up tokens.", "D": "Apply a sliding-window approach keeping only the most recent 25 turns, relying on the model to infer earlier context from recent discussion flow."}, "a": "B", "sk": ["persistent story elements", "mostly ephemeral"], "ak": ["\"story bible\"", "applying trimming or summarization only to brainstorming"], "note": "Phần cố định giữ riêng (\"story bible\"); chỉ cắt phần brainstorm.", "ex": "Tách yếu tố cố định (nhân vật, cốt truyện, quy tắc thế giới) thành \"story bible\" ở đầu context (system prompt) — luôn được ghi nhớ chính xác. Chỉ trim/summarize phần brainstorming (ephemeral) phía sau.\n\nTại sao các phương án khác chưa tối ưu\nA\nRAG dựa semantic similarity có thể bỏ sót thuộc tính nhân vật không trùng từ khóa với câu hỏi hiện tại.\nC\ntóm tắt toàn bộ (kể cả phần cố định) làm mất chi tiết tính cách nhân vật qua nhiều lần nén.\nD\nsliding window 25 lượt khiến quên hoàn toàn thông tin thiết lập ở các lượt đầu.", "set": "Set 3", "topic": 7}, {"n": 153, "cat": "T", "stem": "Users frequently refine their search criteria mid-conversation. You notice a pattern: when users say things like \"Actually, let's raise the budget to $650K\" or \"I'd prefer a condo now instead of a house,\" the assistant sometimes continues referencing the original preferences in later responses—even though the updates are clearly present in the conversation history. Context usage is only at 35% capacity. Which solution most reliably ensures the model uses the current preferences?", "opts": {"A": "Add system prompt instructions emphasizing that the model should always prioritize the most recently stated preferences over earlier ones.", "B": "Include few-shot examples showing the assistant correctly acknowledging and applying preference changes in responses.", "C": "Maintain a structured state object with current preferences, update it on changes, and include it in each request.", "D": "Implement conversation pruning to remove turns containing outdated preferences, ensuring only current ones remain in context."}, "a": "C", "sk": ["Context usage is only at 35% capacity"], "ak": ["structured state object with current preferences"], "note": "Bẫy: {A} (dặn ưu tiên câu mới nhất) nghe đúng. Đáp án: object trạng thái có cấu trúc, cập nhật và gửi kèm mỗi lần.", "ex": "State Management chuẩn: duy trì structured state object (JSON) chứa ưu tiên hiện tại, cập nhật mỗi khi thay đổi — Single Source of Truth. Đưa vào mỗi request (system prompt/context), model luôn truy cập chính xác tùy chọn mới nhất, không lẫn lộn thông tin cũ.\n\nTại sao các phương án khác chưa tối ưu\nA &\n\nB\nchỉ là gợi ý mang tính xác suất (probabilistic prompt engineering) — hội thoại dài vẫn có xác suất cao model bị ảnh hưởng bởi thông tin cũ.\nD\npruning xóa lượt cũ có thể mất ngữ cảnh tự nhiên, tốn logic phức tạp để phát hiện/xóa chính xác câu chứa thông tin lỗi thời.", "set": "Set 3", "topic": 7}, {"n": 154, "cat": "T", "stem": "After deploying automated code review, developers report that approximately 35% of flagged findings are false positives falling into consistent patterns: style suggestions contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to catch genuine issues. Which approach best enables the model to generalize its judgment to novel code patterns it hasn't seen before?", "opts": {"A": "Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category.", "B": "Create a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt.", "C": "Add instructions to your system prompt to \"be conservative,\" \"only flag definite issues,\" and \"consider that some patterns may be intentional.\"", "D": "Implement post-processing that uses keyword matching to filter out findings containing terms like \"convention,\" \"context-dependent,\" or \"trade-off.\""}, "a": "A", "sk": ["generalize its judgment to novel code patterns"], "ak": ["few-shot examples", "annotated code snippets"], "note": "Bẫy: {B} (spec viết đầy đủ) không giúp tổng quát hoá. \"Generalize\" → few-shot có chú thích.", "ex": "Few-shot examples có chú thích phân biệt \"acceptable pattern\" vs \"genuine issue\" giúp LLM generalize/phán đoán chính xác cho mẫu code MỚI chưa từng gặp — thấy cặp ví dụ Đúng/Sai kèm lập luận giúp model nắm tư duy đánh giá của team thay vì áp dụng máy móc quy tắc.\n\nTại sao các phương án khác chưa tối ưu\nB\nliệt kê toàn bộ pattern bất khả thi, quá tải context, khó generalize cho mã nguồn mới.\nC\nhướng dẫn chung chung (\"be conservative\") dễ khiến model bỏ sót lỗi nghiêm trọng thực sự (false negatives) do quá mơ hồ.\nD\nlọc từ khóa hậu xử lý thô sơ, dễ mất cảnh báo quan trọng, không cải thiện khả năng suy luận cốt lõi.", "set": "Set 3", "topic": 1}, {"n": 155, "cat": "T", "stem": "You are setting up a non-interactive automated code review pipeline using Claude Code. You want Claude to analyze a pulled Git diff (git diff) against the main branch and apply a custom set of code review instructions. However, you notice that when you run the pipeline, Claude only looks at the raw diff text itself and completely stops using its file-reading or code navigation tools. As a result, it fails to inspect the broader codebase repository context, which is critical because the diff modifies a core function called by many other external modules. Which change to the CLI invocation will cause Claude to read related files in the repository while still successfully applying your custom review instructions?", "opts": {"A": "Keep --system-prompt and add --allowedTools \"Read, Glob, Grep\" so that the non-interactive mode permits file system tools that it otherwise disables.", "B": "Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root, since --system-prompt is incompatible with tool use under -p.", "C": "Stop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one.", "D": "Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code's default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools."}, "a": "D", "sk": ["completely stops using its file-reading"], "ak": ["--append-system-prompt"], "note": "Bẫy: {A} thêm allowedTools nghe hợp lý. Thật ra --system-prompt GHI ĐÈ prompt mặc định; dùng --append-system-prompt.", "ex": "--system-prompt GHI ĐÈ hoàn toàn system prompt mặc định của Claude Code, vốn chứa hướng dẫn thiết yếu về dùng tool (Read, Glob, Grep). --append-system-prompt bổ sung hướng dẫn review tùy chỉnh SAU system prompt mặc định thay vì ghi đè — Claude Code giữ nguyên khả năng điều hướng/đọc file để kiểm tra toàn bộ codebase.\n\nTại sao các phương án khác chưa tối ưu\nA --allowedTools không khôi phục lại hướng dẫn dùng tool đã bị --system-prompt ghi đè mất. B --system-prompt hoàn toàn tương thích với tool use; vấn đề chỉ là nó ghi đè mất hướng dẫn mặc định. C cách truyền diff (stdin hay prompt string) không quyết định việc dùng tool — nguyên nhân chính là prompt mặc định bị mất.", "set": "Set 3", "topic": 1}, {"n": 156, "cat": "E", "stem": "Your development team is using Claude Code to automate test generation across a large codebase. However, developers are frequently rejecting the generated test suites because Claude creates a high volume of trivial assertions or tests that merely maximize line coverage without validating meaningful behavioral logic or edge cases. You want to guide Claude to generate high-quality, production-ready tests directly without introducing high latency or modifying the core pipeline script. Which strategy best ensures that high-quality, meaningful tests are generated in the first place?", "opts": {"A": "Add post-generation coverage analysis that automatically filters out any generated test that doesn't increase line coverage beyond what existing tests provide.", "B": "Restrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing.", "C": "Implement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers.", "D": "Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}, "a": "D", "sk": ["in the first place"], "ak": ["Document testing standards in CLAUDE.md"], "note": "Giống câu 140.", "ex": "(Tương tự Q140) CLAUDE.md là nơi lưu tiêu chuẩn ngữ cảnh tốt nhất. Định nghĩa tiêu chuẩn test/fixtures/ví dụ phân biệt behavioral test vs trivial assertion trực tiếp trong CLAUDE.md — Claude hiểu đúng NGAY TỪ ĐẦU, không tăng latency, không sửa pipeline script.\n\nTại sao các phương án khác chưa tối ưu\nA\nline coverage không đảm bảo chất lượng/logic test, vẫn giữ được trivial assertion.\nB\nhạn chế thư mục giảm phạm vi tự động hóa thay vì giải quyết bản chất vấn đề. C 2 lần gọi Claude tăng đáng kể latency/chi phí, vi phạm trực tiếp yêu cầu \"without high latency\".", "set": "Set 3", "topic": 1}, {"n": 157, "cat": "E", "stem": "Your music discovery assistant should consistently maintain an enthusiastic tone, explain its reasoning for each recommendation, and ask clarifying questions to better understand user preferences. You want this behavior to persist reliably across all user interactions. Where should you define these behavioral guidelines?", "opts": {"A": "In the first assistant message, instructing Claude to follow these guidelines going forward", "B": "In environmental variables that your application passes to the API client", "C": "In the system prompt", "D": "Prepended to each user message before sending to the API"}, "a": "C", "sk": ["persist reliably across all user interactions"], "ak": ["In the system prompt"], "note": "Hành vi lâu dài → system prompt.", "ex": "System prompt là nơi lý tưởng thiết lập persona, tone, quy tắc hành vi cố định — có hiệu lực nhất quán, bền vững xuyên suốt hội thoại, không bị trôi như tin nhắn thông thường.\n\nTại sao các phương án khác chưa tối ưu\nA\nđặt trong assistant message đầu tiên dễ bị \"quên\" dần khi hội thoại kéo dài.\nB\nenv variables chỉ cấu hình mã nguồn app (API key, endpoint), Claude không đọc trực tiếp được.\nD\nghép vào đầu mỗi user message tốn token không cần thiết, gây nhiễu ngữ cảnh câu hỏi thực sự.", "set": "Set 3", "topic": 7}, {"n": 158, "cat": "T", "stem": "Your team is configuring MCP servers in Claude Code. You want to add a shared venue lookup server that all team members should have access to, and you personally want to add an experimental music playlist server that only you are testing. Which configuration approach correctly applies MCP server scopes?", "opts": {"A": "Add venue server to ~/.claude.json and playlist server to .mcp.json", "B": "Add both servers to your local ~/.claude.json", "C": "Add venue server to .mcp.json and playlist server to ~/.claude.json", "D": "Add both servers to the project-level .mcp.json file"}, "a": "C", "sk": ["shared", "only you are testing"], "ak": ["venue server to .mcp.json", "playlist server to ~/.claude.json"], "note": "Bẫy đảo vị trí: {A} là phương án ngược lại. Chia sẻ → .mcp.json (project); riêng tư → ~/.claude.json.", "ex": ".mcp.json (project-level, commit vào Git): toàn bộ team chia sẻ → dùng cho venue lookup server (shared). ~/.claude.json (user home, không commit): chỉ áp dụng riêng máy bạn → dùng cho playlist server thử nghiệm cá nhân.\n\nTại sao các phương án khác chưa tối ưu\nA\nngược vị trí — server dùng chung vào file cá nhân thì team không dùng được, server thử nghiệm vào .mcp.json thì ảnh hưởng cả team.\nB\ncả 2 vào ~/.claude.json khiến team không truy cập được venue server.\nD\ncả 2 vào .mcp.json khiến server thử nghiệm cá nhân bị chia sẻ cho toàn nhóm.", "set": "Set 3", "topic": 1}, {"n": 159, "cat": "T", "stem": "Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analyzer had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?", "opts": {"A": "Have each agent maintain its own persistent state file and reload it independently at the start of each session.", "B": "Persist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming.", "C": "Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings.", "D": "Have each agent persist a structured export to a known location. On resume, the coordinator loads the manifest and injects relevant state into agent prompts."}, "a": "D", "sk": ["without repeating work or losing fidelity"], "ak": ["persist a structured export to a known location", "coordinator loads the manifest"], "note": "Giống câu 31: xuất có cấu trúc + coordinator nạp lại. Bẫy: {A} mỗi agent tự đọc.", "ex": "(Tương tự Q31) Mỗi agent lưu structured export/checkpoint ra vị trí xác định. Coordinator đọc manifest, biết chính xác tiến độ từng agent, chỉ inject đúng ngữ cảnh cần thiết khi resume — cân bằng fidelity và context efficiency.\n\nTại sao các phương án khác chưa tối ưu\nA\nmỗi agent tự đọc độc lập thiếu đồng bộ toàn cục, khó điều phối nối tiếp (Synthesizer cần biết thông tin từ Document Analyzer).\nB\nlưu toàn bộ conversation log của coordinator chứa nhiều dư thừa, phình context.\nC\nvector store semantic search không đảm bảo truy xuất đầy đủ 100% dữ liệu cần thiết để phục hồi chính xác tại điểm ngắt.", "set": "Set 3", "topic": 4}, {"n": 160, "cat": "E", "stem": "Analysis reveals the coordinator invokes the web search subagent, waits for its response, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other's output. How should you modify the system to run these subagents concurrently?", "opts": {"A": "Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time.", "B": "Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator-subagent pair, then aggregates results.", "C": "Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message rather than across separate conversation turns.", "D": "Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution and requesting it invoke both subagents at the same time."}, "a": "C", "sk": ["tasks are independent"], "ak": ["emit both Task tool calls", "single response message"], "note": "Giống câu 102.", "ex": "(Tương tự Q102) Claude API hỗ trợ Parallel Tool Calling: coordinator trả về 1 response chứa đồng thời nhiều tool_use block cho cả 2 tác vụ — runtime thực thi song song, tối ưu thời gian xử lý.\n\nTại sao các phương án khác chưa tối ưu\nA\nHaiku chỉ giảm thời gian từng task riêng lẻ, không giải quyết bản chất tuần tự→song song.\nB\ntạo tầng async ngoài với 2 cặp coordinator-subagent phức tạp hóa không cần thiết.\nD\nchỉ hướng dẫn suông không cấu hình đầu ra gửi 2 tool call cùng lượt — model vẫn có thể quay lại thói quen tuần tự.", "set": "Set 3", "topic": 4}, {"n": 161, "cat": "E", "stem": "A landmark case citing 12 precedents takes over 3 minutes to analyze completely. What's the most effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the system?", "opts": {"A": "Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis", "B": "Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations", "C": "Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity", "D": "Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents"}, "a": "A", "sk": ["preserving the coordinator's ability to monitor"], "ak": ["coordinator spawn parallel document analysis subagents"], "note": "Giống câu 39.", "ex": "(Tương tự Q39) Chia 12 precedent cho subagent xử lý song song — giảm latency từ tuần tự (>3 phút) xuống đáng kể. Coordinator-Subagent tập trung giữ toàn quyền kiểm soát, dễ giám sát/log/debug từng bước.\n\nTại sao các phương án khác chưa tối ưu\nB &\n\nC\ncho subagent tự sinh subagent con/phân cấp đệ quy làm kiến trúc phức tạp, mất visibility, khó debug.\nD\nmessage queue/async phù hợp background jobs hơn tương tác đồng bộ của AI agent, mất kiểm soát tập trung.", "set": "Set 3", "topic": 4}, {"n": 162, "cat": "E", "stem": "Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings. What's the most effective architectural change?", "opts": {"A": "Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations.", "B": "Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation.", "C": "Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources.", "D": "Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents."}, "a": "C", "sk": ["loses track of which sources support which conclusions"], "ak": ["structured claim-source mappings"], "note": "Giống câu 36.", "ex": "(Tương tự Q36) Bắt buộc subagent xuất structured claim-source mapping (data contract rõ ràng). Synthesis agent bảo toàn/hợp nhất các ánh xạ này xuyên suốt — trích dẫn không bị thất lạc/nhầm lẫn.\n\nTại sao các phương án khác chưa tối ưu\nA\nchèn prefix thủ công vào text dễ suy giảm/nhiễu khi LLM xử lý lại văn bản tự do.\nB\ngiữ toàn bộ transcript + agent phân tích log riêng phình context, tăng latency/chi phí.\nD\nsemantic similarity matching là phỏng đoán, dễ sai (false match) nếu tài liệu có nội dung tương tự.", "set": "Set 3", "topic": 4}, {"n": 163, "cat": "E", "stem": "Simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement signed?\") traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications. What's the most effective approach to optimize for varying query complexity?", "opts": {"A": "Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness.", "B": "Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination.", "C": "Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve.", "D": "Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements."}, "a": "D", "sk": ["diverse and evolving"], "ak": ["dynamically decide which subagents to invoke"], "note": "Giống câu 60.", "ex": "(Tương tự Q40/Q60) Coordinator phân tích từng truy vấn, định tuyến ĐỘNG (dynamic) — linh hoạt gọi đúng subagent cần thiết, không cần chạy hết pipeline 4 bước cho câu đơn giản. Xử lý tốt phân bố truy vấn đa dạng/evolving mà không cần hardcode rule hay retrain classifier.\n\nTại sao các phương án khác chưa tối ưu\nA\nchỉ 2 luồng cố định, không tối ưu cho mức độ phức tạp trung bình (cần 2-3 subagent).\nB\nrule-based theo pattern cứng nhắc, dễ lỗi với cách đặt câu tự nhiên/bất thường.\nC\nclassifier cần nhiều dữ liệu dán nhãn, tốn công bảo trì/retrain liên tục.", "set": "Set 3", "topic": 4}, {"n": 164, "cat": "T", "stem": "The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source priorities, and date filters. Production monitoring reveals three issues: (1) the subagent reports \"insufficient results\" rather than trying alternative approaches when pre-specified searches fail, (2) research quality drops for emerging topics that don't match expected patterns, and (3) the subagent rarely surfaces valuable tangential sources. What's the most effective way to improve subagent adaptability?", "opts": {"A": "Specify research goals and quality criteria (coverage breadth, source diversity, recency) rather than procedural steps, letting the subagent determine its search strategy.", "B": "Remove procedural details entirely, delegating with simple goals like \"research X thoroughly\" and relying on the subagent's general capabilities.", "C": "Add explicit fallback directives to the detailed instructions: \"If specified searches yield fewer than N results, attempt alternative query formulations before reporting failure.\"", "D": "Implement a topic classification step where the coordinator categorizes requests as \"well-defined\" or \"exploratory\" and uses different instruction styles for each category."}, "a": "A", "sk": ["rarely surfaces valuable tangential sources"], "ak": ["research goals and quality criteria", "rather than procedural steps"], "note": "Giống câu 33. Bẫy: {B} bỏ hết chi tiết (quá đà) và {C} fallback (vẫn thủ tục).", "ex": "(Tương tự Q33) Goal-oriented guidance thay vì procedural steps: cung cấp tiêu chí chất lượng (coverage breadth, source diversity, recency) cho subagent tự do điều chỉnh chiến lược tìm kiếm, thử cách tiếp cận khác khi bế tắc, khám phá nguồn tangential mà coordinator chưa lường trước.\n\nTại sao các phương án khác chưa tối ưu\nB\nbỏ hết chỉ dẫn, mục tiêu quá chung chung thiếu tiêu chuẩn đánh giá, dễ lan man.\nC\nfallback cứng nhắc chỉ là patchwork tạm thời, không giải quyết gốc rễ tính linh hoạt cho chủ đề mới.\nD\nphân loại 2 nhóm cố định ở coordinator tăng phức tạp, không phản ánh hết đa dạng truy vấn thực tế.", "set": "Set 3", "topic": 4}, {"n": 165, "cat": "T", "stem": "The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations—the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps. What's the most effective approach to ensure proper source attribution in the final reports?", "opts": {"A": "Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format.", "B": "Have the report generator query the web search agent to re-locate sources for claims in the final report.", "C": "Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator.", "D": "Have each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers)."}, "a": "D", "sk": ["metadata was lost during the summarization steps"], "ak": ["structured data separating content summaries from source metadata"], "note": "Giống câu 41. Bẫy: {A} trích dẫn inline.", "ex": "(Tương tự Q41) Mỗi agent xuất structured output tách biệt content summary và source metadata (URL, tên tài liệu, số trang) — thông tin nguồn bảo toàn nguyên vẹn qua mọi bước (search/analysis → synthesis → report), không bị mất khi tóm tắt văn bản tự do.\n\nTại sao các phương án khác chưa tối ưu\nA\nchèn inline citation trong text dễ bị LLM làm trôi/mất qua nhiều bước xử lý.\nB\nreport generator quay lại query web search gây lãng phí token/tăng latency, không đảm bảo tìm đúng nguồn gốc.\nC\nbỏ tóm tắt, gửi raw output đầy đủ làm quá tải context window.", "set": "Set 3", "topic": 4}, {"n": 166, "cat": "T", "stem": "When researching \"renewable energy adoption,\" the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time. What change would best enable the synthesis agent to correctly interpret such temporal differences?", "opts": {"A": "Require subagents to include publication or data collection dates in their structured outputs.", "B": "Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric.", "C": "Configure the web search agent to only return results from the past 6 months.", "D": "Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix."}, "a": "A", "sk": ["temporal differences"], "ak": ["publication or data collection dates"], "note": "Bẫy: {D} (lấy dữ liệu mới nhất) làm mất xu hướng. Thêm ngày vào output có cấu trúc.", "ex": "Để synthesis agent nhận biết xu hướng thời gian (tăng trưởng) thay vì coi là mâu thuẫn, cần ngữ cảnh thời gian rõ ràng. Bắt buộc subagent đính kèm ngày xuất bản/thu thập dữ liệu trong structured output — cung cấp đúng thông tin để kết luận chính xác (18%→35%, 2022→2024).\n\nTại sao các phương án khác chưa tối ưu\nB\ntự động loại bỏ dữ liệu cũ mất thông tin lịch sử, không phân tích được xu hướng.\nC\ngiới hạn 6 tháng bỏ qua hoàn toàn báo cáo nội bộ/dữ liệu quá khứ cần so sánh.\nD\nđẩy dữ liệu cũ vào phụ lục máy móc không giúp hiểu mối quan hệ tăng trưởng logic giữa 2 điểm dữ liệu.", "set": "Set 3", "topic": 4}, {"n": 167, "cat": "T", "stem": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent findings are synthesized into a single confident statement (losing nuance), while other times reports over-hedge with excessive qualifications (becoming unhelpful). When the web search agent returns \"industry analysts estimate $50B market size (methodology varies)\" and the document analysis agent returns \"peer-reviewed study estimates $35B (±7B, 95% CI),\" the coordinator either picks one arbitrarily or produces vague statements like \"the market may be $35B−$50B depending on factors.\" What systematic approach best addresses this?", "opts": {"A": "Configure subagents to only report findings meeting a high-confidence threshold, filtering uncertain information before it reaches the coordinator.", "B": "Implement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized probability scores (0.0-1.0), then weight-average findings by their calibrated confidence.", "C": "Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context.", "D": "Add a verification subagent that cross-references findings across sources, only passing claims to synthesis that are corroborated by at least two independent sources."}, "a": "C", "sk": ["picks one arbitrarily or produces vague statements"], "ak": ["explicit sections distinguishing well-established findings from contested ones"], "note": "Giống câu 32. Bẫy: {B} quy đổi xác suất.", "ex": "(Tương tự Q32) Cấu trúc báo cáo giữ nguyên bối cảnh phương pháp luận, tách biệt phát hiện đã xác lập vững chắc với phát hiện còn tranh cãi — đạt sự tinh tế (nuance) mà không rơi vào over-hedging.\n\nTại sao các phương án khác chưa tối ưu\nA\nlọc bỏ mất bằng chứng chưa chắc chắn nhưng vẫn hữu ích, chỉ che giấu mâu thuẫn thay vì xử lý.\nB\ngộp CI/ước tính khác phương pháp luận thành 1 số trung bình xóa bỏ chính sự khác biệt là trọng tâm vấn đề.\nD\nyêu cầu tối thiểu 2 nguồn loại bỏ phát hiện hợp lệ chỉ từ 1 nguồn, không giải quyết ước tính mâu thuẫn do khác phương pháp luận.", "set": "Set 3", "topic": 4}, {"n": 168, "cat": "E", "stem": "During testing, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and the report generator tries to analyze documents. What is the primary cause of this poor tool selection behavior?", "opts": {"A": "Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds.", "B": "The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks.", "C": "The agents' role descriptions in their system prompts conflict with having access to tools outside that role.", "D": "The tool definitions consume too much context window space, leaving insufficient room for task content."}, "a": "A", "sk": ["call tools outside their specialization"], "ak": ["18 tools instead of 4-5 relevant ones"], "note": "Giống câu 115.", "ex": "(Tương tự Q115) Quá nhiều tool không giới hạn theo chuyên môn (18 tools) gây quá tải quyết định (decision complexity), tăng xác suất chọn sai/gọi tool ngoài phạm vi. Nguyên tắc chuẩn: Principle of Least Privilege — chỉ cấp 4-5 tool thực sự cần thiết cho từng subagent (scope-limited).\n\nTại sao các phương án khác chưa tối ưu\nB\nkhông phải lỗi coordinator, mà chính subagent chọn sai khi được trao quá nhiều tool ngoài vai trò.\nC\nmô tả vai trò không trực tiếp xung đột — số lượng tool quá nhiều mới là nguồn gây nhiễu quyết định.\nD\ncontext window bị chiếm dụng có ảnh hưởng nhưng nguyên nhân chính là độ phức tạp lựa chọn giữa quá nhiều option.", "set": "Set 3", "topic": 4}, {"n": 169, "cat": "T", "stem": "A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains lookup_order results showing \"Status: PENDING, Expected resolution: 24-48 hours.\" In testing, you observe that when resuming sessions with stale tool results, the agent often references the outdated data in responses (e.g., \"I see your refund is still being processed\") even after subsequent fresh tool calls return different information. What approach most reliably handles returning customers?", "opts": {"A": "Resume with full history but filter out previous tool_result messages before resuming, keeping only the human/assistant turns so the agent must re-fetch needed data.", "B": "Start a new session, inject a structured summary of the previous interaction (issue type, actions taken, resolution status), then make fresh tool calls before engaging.", "C": "Resume with full history and add a system prompt instruction telling the agent to always prefer the most recent tool results when multiple calls to the same tool exist in context.", "D": "Resume with full history and configure the agent to automatically re-call all previously-used tools at session start to ensure data freshness."}, "a": "B", "sk": ["stale tool results"], "ak": ["Start a new session, inject a structured summary", "fresh tool calls"], "note": "Bẫy: {A} lọc tool_result nghe khéo. Đáp án: phiên mới + tóm tắt có cấu trúc + gọi tool mới.", "ex": "(Tương tự Q56) Phiên mới + bản tóm tắt cấu trúc (issue type, actions taken, resolution status) giữ mạch truyện liên tục, đảm bảo agent không suy luận dựa trên tool result đã lỗi thời (stale).\n\nTại sao các phương án khác chưa tối ưu\nA\nloại bỏ tool_result giữa hội thoại khiến assistant message tham chiếu kết quả không còn tồn tại — transcript mâu thuẫn nội tại.\nC\ninstruction trong prompt chỉ mang tính gợi ý, đã quan sát thấy lỗi này chính xác khi test (model vẫn tham chiếu kết quả cũ).\nD\ngọi lại toàn bộ tool dàn trải lãng phí/chậm, kết quả cũ vẫn nằm trong context gây nhiễu.", "set": "Set 3", "topic": 6}, {"n": 170, "cat": "E", "stem": "Compliance requires that refunds exceeding $500 must automatically escalate to a human agent—this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate). How should you achieve guaranteed compliance?", "opts": {"A": "Modify the refund tool to return an error with message \"Amount exceeds policy limit—please escalate\" when threshold is exceeded.", "B": "Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600).", "C": "Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation.", "D": "Strengthen the system prompt with emphatic language: \"CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.\""}, "a": "C", "sk": ["cannot be left to model discretion", "guaranteed compliance"], "ak": ["hook to intercept tool calls"], "note": "Giống câu 52.", "ex": "(Tương tự Q52) Quy tắc compliance-grade phải nằm NGOÀI phạm vi model — hook deterministic gắn vào tool call đảm bảo luôn kích hoạt mỗi lần, độc lập hành vi model.\n\nTại sao các phương án khác chưa tối ưu\nA\nvẫn phụ thuộc agent diễn giải đúng lỗi và tự escalate — vẫn là discretion của model.\nB\nfew-shot chỉ dịch chuyển phân bố hành vi, không loại bỏ hoàn toàn lỗi 3%.\nD\nemphatic prompt chỉ giảm chứ không loại bỏ hoàn toàn sai sót — yêu cầu compliance đã loại trừ mọi giải pháp chỉ dựa prompt.", "set": "Set 3", "topic": 6}, {"n": 171, "cat": "T", "stem": "During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to call process_refund, the tool returns a timeout error. The agent has enough information to explain the charges and verify refund eligibility, but cannot actually process the refund due to the backend failure. What approach best balances first-contact resolution with appropriate error handling?", "opts": {"A": "Escalate immediately to a human agent since the refund action cannot be completed", "B": "Implement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed", "C": "Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later", "D": "Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically"}, "a": "C", "sk": ["first-contact resolution"], "ak": ["acknowledge the system issue preventing immediate processing"], "note": "Giống câu 48.", "ex": "(Tương tự Q48/Q110) Đã có đủ thông tin giải thích phí + xác nhận đủ điều kiện hoàn tiền. Khi backend lỗi (timeout), minh bạch thông báo sự cố + đưa lựa chọn tiếp theo (escalate hoặc thử lại sau) — cân bằng tốt nhất giữa first-contact resolution và error
