  const rows = R.items.map(x => {
    const i = x.index, q = QUESTIONS[i];
    const opts = [...LETTERS].map((_, n) => S.perm[i][n] === undefined ? "" : q.o[S.perm[i][n]]);
    return [i + 1, statusOf(x), lettersOf(i, x.sel), lettersOf(i, q.a), `${q.d}. ${DOMAINS[q.d].name}`, q.t, SCENARIOS[q.s].name, q.a.length > 1 ? `Select ${COUNT[q.a.length]}` : "Select ONE", S.flags[i] ? "Có" : "", q.q, ...opts, q.e];
  });
  return "﻿" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
function buildReport(R) {
  const wrong = R.items.filter(x => !x.ok && !x.blank).length, blank = R.items.filter(x => x.blank).length;
  const table = (map, names) => `<table>${Object.keys(names).filter(k => map[k]).map(k => `<tr><td>${esc(names[k])}</td><td class="n">${Math.round(map[k].correct / map[k].total * 100)}%</td><td class="n">${map[k].correct}/${map[k].total}</td></tr>`).join("")}</table>`;
  const domNames = Object.fromEntries(Object.entries(DOMAINS).map(([k, d]) => [k, `${k}. ${d.name}`]));
  const scNames = Object.fromEntries(Object.entries(SCENARIOS).map(([k, d]) => [k, d.name]));
  const cards = R.items.map(x => {
    const q = QUESTIONS[x.index];
    const opts = S.perm[x.index].map((orig, n) => {
      const is = q.a.includes(orig), picked = x.sel.includes(orig), tag = elimOf(x.index, orig);
      const note = is && picked ? "Đúng · bạn chọn" : is ? "Đáp án đúng" : picked ? "Bạn chọn" : "";
      return `<li class="${is ? "ok" : picked ? "no" : ""}"><b>${LETTERS[n]}.</b> ${fmt(q.o[orig])}${note ? ` <em>${note}</em>` : ""}${tag ? `<small>Loại: ${fmt(tag.t)}. ${fmt(tag.why)}</small>` : ""}</li>`;
    }).join("");
    return `<article class="${x.ok ? "right" : "bad"}"><h3>Câu ${x.index + 1} · ${statusOf(x)}</h3><p class="meta">Task ${q.t} · ${esc(SCENARIOS[q.s].name)}${q.a.length > 1 ? ` · Select ${COUNT[q.a.length]}` : ""}${S.flags[x.index] ? " · Đã đánh dấu" : ""}</p><p>${fmt(q.q)}</p><ul>${opts}</ul><p class="exp">${fmt(q.e)}</p></article>`;
  }).join("");
  return `<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kết quả thi thử CCAR-F</title><style>
body{font:16px/1.55 "Segoe UI",system-ui,sans-serif;color:#16222f;background:#fff;max-width:800px;margin:0 auto;padding:24px 16px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:28px 0 8px}h3{font-size:16px;margin:0}
code{font:.9em Menlo,Consolas,monospace;background:#eef2f6;padding:0 .3em;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid #d5dde5}.n{text-align:right;white-space:nowrap;padding-left:12px}
.score{font-size:48px;font-weight:700;margin:12px 0 0}.meta{color:#566676;font-size:14px;margin:2px 0 8px}article{border-top:2px solid #d5dde5;padding:14px 0;break-inside:avoid}article.bad{border-top-color:#b42323}
ul{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}li{padding:6px 10px}li.ok{background:#dff3e7}li.no{background:#fbe5e3}em{font-style:normal;font-weight:600;font-size:13px}small{display:block;color:#5c4800;margin-top:2px}.exp{border-left:3px solid #0b5cad;padding-left:10px;margin:8px 0 0}
</style></head><body><h1>Kết quả thi thử CCAR-F · Đề ${setId}</h1><p class="meta">Đề luyện tập không chính thức · ${new Date(S.endedAt).toLocaleString("vi-VN")}</p>
<p class="score">${R.scaled}/1000 · ${R.passed ? "Đạt" : "Chưa đạt"}</p><p>Đúng ${R.correct}/60 · sai ${wrong} · bỏ trống ${blank} · thời gian ${clock(S.endedAt - S.startedAt)}${S.hintUsed ? " · có bật gợi ý loại" : ""}. Điểm ước lượng theo công thức tuyến tính.</p>
<h2>Theo domain</h2>${table(R.byDomain, domNames)}<h2>Theo tình huống</h2>${table(R.byScenario, scNames)}<h2>Chi tiết 60 câu</h2>${cards}</body></html>`;
}
async function exportFile(kind) {
  const R = grade(QUESTIONS, S.answers), filename = exportName(R, kind), msg = document.getElementById("dlmsg");
  try {
    await dl.save({ filename, data: kind === "csv" ? buildCsv(R) : buildReport(R) });
    msg.textContent = `Đã lưu ${filename}.`;
  } catch (e) {
    msg.textContent = e && e.code === "declined" ? "Bạn đã hủy lưu file."
      : e && e.code === "rate_limited" ? "Hộp thoại lưu file đang mở. Hãy xử lý hộp thoại đó rồi thử lại."
      : "Không xuất được file trong cửa sổ này. Hãy mở trang trên claude.ai rồi thử lại.";
  }
}

function render(focusId) {
  clearInterval(timerId);
  if (flashOpen) {
    app.innerHTML = flashView();
    if (focusId) document.getElementById(focusId)?.focus();
    return;
  }
  if (S.phase === "exam" && Date.now() >= S.deadline) { finish(); return; }
  const onExam = S.phase === "exam" && !app.dataset.home;
  app.innerHTML = app.dataset.home || S.phase === "start" ? startView() : S.phase === "result" ? resultView() : examView();
  if (onExam) timerId = setInterval(tick, 1000);
  if (onExam && hints && !S.hintUsed) { S.hintUsed = true; save(); }
  if (focusId) document.getElementById(focusId)?.focus();
  if (modal) document.getElementById("submit")?.focus();
}
function tick() {
  const left = S.deadline - Date.now();
  if (left <= 0) { finish(); return; }
  const el = document.getElementById("timer");
  if (el) { el.textContent = clock(left); el.classList.toggle("low", left < 600000); }
}

app.addEventListener("click", e => {
  const jumpOne = e.target.closest("[data-openflash]");
  if (jumpOne) {
    const all = jumpOne.closest(".rev")?.querySelector("[data-openflash-all]")?.dataset.openflashAll;
    return openFlashFromResult((all || jumpOne.dataset.openflash).split(",").filter(Boolean), jumpOne.dataset.openflash);
  }
  const jumpAll = e.target.closest("[data-openflash-all]");
  if (jumpAll) return openFlashFromResult(jumpAll.dataset.openflashAll.split(",").filter(Boolean));
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go !== undefined) return go(+t.dataset.go);
  if (t.dataset.diff !== undefined) {
    document.getElementById("diff-" + t.dataset.diff)?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (t.dataset.f) { reviewFilter = t.dataset.f; return render(); }
  if (t.dataset.set) return selectSet(+t.dataset.set);
  switch (t.id) {
    case "openflash": return openFlash();
    case "flashhome": return closeFlash();
    case "begin": delete app.dataset.home; return begin();
    case "resume": case "viewresult": delete app.dataset.home; render(); window.scrollTo(0, 0); return;
    case "home": case "home2": app.dataset.home = "1"; render(); window.scrollTo(0, 0); return;
    case "askdiscard": confirmDiscard = true; return render();
    case "keep": confirmDiscard = false; return render();
    case "discard": confirmDiscard = false; delete app.dataset.home; return begin();
    case "hl": setHints(!hints); return render("hl");
    case "prev": return go(S.cur - 1);
    case "next": return go(S.cur + 1);
    case "flag": S.flags[S.cur] = !S.flags[S.cur]; save(); return render("flag");
    case "clear": S.answers[S.cur] = []; save(); return render();
    case "ask": modal = true; return render();
    case "cancel": modal = false; return render();
    case "submit": return finish();
    case "maptoggle": mapOpen = !mapOpen; return render();
    case "xhtml": return exportFile("html");
    case "xcsv": return exportFile("csv");
    case "synclink": return makeLink();
    case "syncsave": return saveProgressFile();
    case "syncopen": document.getElementById("syncfile")?.click(); return;
    case "syncpaste": pasteOpen = !pasteOpen; syncOut = ""; render(); document.getElementById("syncin")?.focus(); return;
    case "synccancel": pasteOpen = false; return render();
    case "syncdo": return importCode(document.getElementById("syncin")?.value);
    case "again": delete app.dataset.home; S = fresh(); applyOrder(); save(); app.dataset.home = "1"; render(); window.scrollTo(0, 0); return;
  }
});
app.addEventListener("change", e => {
  if (e.target.dataset.opt !== undefined) return toggle(+e.target.dataset.opt);
  if (e.target.id === "dom") { reviewDomain = e.target.value; render(); }
  if (e.target.id === "syncfile" && e.target.files[0]) { e.target.files[0].text().then(importCode, () => importCode("")); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal) { modal = false; render(); return; }
});

if (S.phase !== "start") app.dataset.home = "1";
(function bootFlashHash() {
  const m = location.hash.match(/^#(?:flashcards|drill|flash(?:\/([\w-]+))?)$/);
  if (!m || !canOpenFlash()) return;
  flashOpen = true;
  if (m[1] && FLASH_TABLES.some(t => t.id === m[1])) { flashFocus = m[1]; flashHighlight = [m[1]]; }
})();
render();
if (flashOpen) scrollFlash();
if (location.hash.startsWith("#sync=")) {
  const code = location.hash.slice(6);
  /* window.history is shadowed by the page's history() function, so clear the hash with location.replace (no reload). */
  try { location.replace("#"); } catch (e) {}
  importCode(code).then(() => document.querySelector(".sync")?.scrollIntoView({ block: "center" }));
}
(async () => {
  try { dl = await window.claude?.use("downloads"); } catch (e) { dl = null; }
  if (dl && S.phase === "result") render();
})();
</script>
