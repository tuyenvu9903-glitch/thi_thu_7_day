     "Add the tool output to the system prompt only on those iterations in which it contains some delay notice.",
     "Instruct Claude to call `lookup_order` a second time so that it can see the information in its own output.",
     "Store the output in a database and have Claude query it later through a separate retrieval tool it can call."],
  a:[0],
  e:"Kết quả tool phải nằm trong lịch sử hội thoại dưới dạng `tool_result` để model suy luận ở vòng tiếp theo." },
{ s:1,d:1,t:"1.1",
  q:"A design review proposes a hard-coded decision tree: always call `get_customer`, then `lookup_order`, then `process_refund` if eligible. Your conversations vary widely, from billing disputes to account changes. What is the main drawback compared with a model-driven loop?",
  o:["It cannot adapt which tool comes next based on what each conversation and tool result reveal.",
     "It cannot apply any programmatic checks, because decision trees run outside of the Agent SDK.",
     "It costs more per conversation, because decision trees increase prompt-caching overhead a great deal.",
     "It prevents Claude from returning tool calls, because the SDK disables `tool_use` in such a design."],
  a:[0], x:{3:"cacheState"},
  e:"Vòng lặp do model quyết định chọn bước tiếp theo theo ngữ cảnh; cây quyết định cứng không thích ứng được với yêu cầu mơ hồ." },
{ s:1,d:1,t:"1.4",
  q:"A prerequisite gate on `process_refund` works, but engineers notice that when it blocks a call the agent just apologizes and ends the conversation. What should the gate return so that the agent can recover?",
  o:["An error result explaining that verification is required first, so the agent can call `get_customer` next.",
     "A success result with a zero refund amount, so that the agent has something valid to tell the customer.",
     "An exception that ends the agent process, so that the operations team is alerted to the blocked call.",
     "A plain `Operation failed` message, so that the customer is not exposed to details of internal processes."],
  a:[0], x:{1:"fakeOk",2:"abort",3:"generic"},
  e:"Cổng chặn cần trả lỗi mô tả rõ để agent biết bước phải làm tiếp, thay vì giả thành công hoặc kết thúc." },
{ s:1,d:1,t:"1.4",multi:true,
  q:"Which TWO requirements in a customer support agent should be enforced programmatically and not only through instructions?",
  o:["A customer's identity must be verified before any refund can be issued to their account.",
     "Refunds above the amount approved by policy must always be routed to a human reviewer.",
     "The agent should use a warm tone when it apologizes to a customer for a delayed parcel.",
     "The agent should prefer short paragraphs in replies that are read on a mobile device.",
     "The agent should mention the loyalty program when it is natural in the conversation."],
  a:[0,1],
  e:"Yêu cầu tài chính/tuân thủ cần cơ chế xác định như hook hoặc cổng chặn. Giọng văn, định dạng có thể dùng prompt." },
{ s:1,d:1,t:"1.4",
  q:"The agent needs to escalate a billing dispute after finding a duplicate charge of $89.99 and confirming that the customer's plan was changed in error. Which handoff best serves a human agent who has no transcript access?",
  o:["Customer ID, the $89.99 duplicate charge, the plan-change root cause, and a recommended refund action.",

     "A copy of the entire tool output history, ordered by time, with no summary added by the agent itself.",

  a:[0], x:{1:"generic",2:"transcript",3:"askRepeat"},
  e:"Bàn giao phải có đủ ID, nguyên nhân, số tiền chính xác và đề xuất hành động." },
{ s:1,d:1,t:"1.5",
  q:"An engineer implements refund limits inside a `PostToolUse` hook, reasoning that it runs on every tool call. In testing, a $900 refund is reported to the supervisor, but the customer has already been paid. What is wrong?",
  o:["`PostToolUse` runs after the tool has executed, so a limit must be enforced by intercepting the outgoing call.",

     "The hook needs the refund amount in its output, because the tool's response currently omits that field.",
     "The hook should raise an error instead of reporting it, which makes the payment automatically reverse."],
  a:[0], x:{3:"postBlock"},
  e:"`PostToolUse` chạy sau khi tool đã thực thi nên không chặn được hành động. Cần chặn trước khi tool chạy." },
{ s:1,d:1,t:"1.5",multi:true,
  q:"You are reviewing the hook design for the support agent. Which TWO uses of hooks are correct?",
  o:["Using a `PostToolUse` hook to convert mixed date formats and status codes before the model reads them.",

  a:[0,1], x:{2:"postBlock",4:"prompt"},

{ s:1,d:1,t:"1.7",
  q:"A support case paused for two days is resumed. Since then, the warehouse has updated the order's status, but the resumed conversation still contains the old `lookup_order` result, and the agent keeps quoting it. Which approach is most reliable?",

     "Fork the conversation with `fork_session`, because a fork automatically re-executes earlier tool calls.",

  a:[0], x:{1:"staleResume",2:"staleResume",3:"askRepeat"},
  e:"Kết quả tool cũ có thể gây sai lệch. Cần báo dữ liệu mới hoặc khởi tạo lại bằng bản tóm tắt có cấu trúc." },
{ s:1,d:2,t:"2.1",
  q:"Agents sometimes call `escalate_to_human` for ordinary refund questions. Its description reads `Use for customer issues.` What should you add to the tool's description?",
  o:["Specific conditions for use, what information to pass, and when to resolve the case with other tools instead.",

  a:[0], x:{1:"loud",3:"vague"},
  e:"Mô tả tool cần điều kiện sử dụng, đầu vào và ranh giới với các tool khác." },
{ s:1,d:2,t:"2.2",multi:true,
  q:"`get_customer` is called with an email in an invalid format, and in a separate case the caller lacks permission for a restricted VIP record. Which TWO behaviors should the tool's error responses enable?",

  a:[0,1], x:{2:"retryPolicy",3:"fakeOk",4:"generic"},
  e:"Lỗi validation cần sửa đầu vào; lỗi permission không retry mà chuyển sang đường xử lý phù hợp." },
{ s:1,d:2,t:"2.3",
  q:"The first turn must always verify the customer by calling `get_customer`. After that, the agent should choose freely, including responding in plain text. What `tool_choice` sequence should you use?",
  o:["Forced `get_customer` on the first turn, then `auto` on later turns.",

     "Forced `get_customer` on all turns, so that verification is never skipped.",

  a:[0], x:{1:"anyPick",2:"forceAll",3:"toolOrder"},
  e:"Ép tool ở lượt đầu rồi chuyển sang `auto` để agent có thể chọn tool khác hoặc trả lời bằng text." },
{ s:1,d:5,t:"5.1",
  q:"Conversations are getting long, so a developer trims each request to the last four messages. Agents now forget what they already investigated and repeat lookups. Which approach preserves coherence while still managing size?",
  o:["Keep sending the conversation with trimmed tool outputs, plus a case facts block carrying key transactional data.",

{ s:1,d:5,t:"5.1",
  q:"A customer's single session covers three separate orders with different refund amounts, and the agent mixes them up after a summary. What is the best structure for this context?",

  a:[0], x:{2:"askRepeat"},
  e:"Dữ liệu có cấu trúc theo từng vấn đề, tách khỏi phần tóm tắt, giúp không lẫn thông tin trong phiên nhiều vấn đề." },
{ s:1,d:5,t:"5.2",
  q:"A customer says, `I don't want a bot. Get me a person right now.` The agent can see that the issue is probably a simple address update. What should it do?",

  a:[0], x:{1:"tryFirst",2:"tryFirst",3:"sentiment"},
  e:"Yêu cầu gặp người rõ ràng phải được thực hiện ngay, kể cả khi vấn đề đơn giản." },
{ s:1,d:5,t:"5.2",
  q:"`get_customer` returns two people named Minh Tran in the same city, and one has a recent order that seems to match the complaint. What should the agent do?",

  a:[0], x:{1:"guess",2:"escalateMore"},
  e:"Nhiều kết quả khớp thì cần hỏi thêm định danh, không chọn theo phỏng đoán và cũng không cần escalate." }
]});

     "An `@import` reference copies the imported text permanently into the file at the moment that it is saved."],
  a:[0,1],
  e:"User-level chỉ áp dụng cho người đó; `CLAUDE.md` thư mục con dùng cho quy ước của phần đó." },
{ s:5,d:3,t:"3.1",
  q:"An engineer says a rule in `packages/web/CLAUDE.md` is not being followed. Before editing the wording of the rule, they want to confirm the file is actually in effect for the session. What should they use?",
  o:["The `/memory` command, to see which memory files are loaded.",
     "The `/compact` command, to reload all of the memory files.",
     "The `--resume` flag, to apply the latest version of the rule.",
     "The `allowed-tools` frontmatter, to enable the file for loading."],
  a:[0], x:{1:"clear"},
  e:"`/memory` dùng để kiểm tra các file bộ nhớ đã nạp và chẩn đoán hành vi không nhất quán." },
{ s:5,d:3,t:"3.1",
  q:"The team's test conventions need to be reused in two packages, but the API conventions only apply in one. The conventions already exist as separate Markdown files. What is the most maintainable arrangement?",
  o:["Reference the appropriate convention files through `@import` from each package's `CLAUDE.md`.",
     "Copy all convention text into both of the packages, and synchronize them in each release.",
     "Create one combined conventions file and load it with no conditions in the root configuration.",
     "Ask each engineer to paste the needed convention into the conversation at the start of work."],
  a:[0], x:{1:"copyMd"},
  e:"`@import` giúp `CLAUDE.md` mô-đun hóa và dùng lại đúng tiêu chuẩn cần thiết cho từng package." },
{ s:5,d:3,t:"3.2",multi:true,
  q:"You are creating `/analyze-architecture`, a project skill that scans the repository and produces a long report. It should be read-only and must prompt for a module when invoked without one. Which THREE frontmatter fields should be set?",
  o:["`context: fork`, to isolate the verbose analysis from the main conversation.",
     "`allowed-tools`, set to read-only tools so that it cannot modify any files.",
     "`argument-hint`, to tell the developer that a module name is expected.",
     "`paths`, listing every directory the analysis should be allowed to read.",
     "`temperature`, to keep the analysis more deterministic between each run.",
     "`max_tokens`, to keep the report from filling the main conversation."],
  a:[0,1,2], x:{5:"big"},
  e:"`context: fork` cô lập đầu ra, `allowed-tools` giới hạn tool, `argument-hint` nhắc tham số." },
{ s:5,d:3,t:"3.2",
  q:"Developers want a `/fix-lint` command in this repository, while one engineer also wants a private `/my-standup` command that nobody else should see. Where should these be placed?",
  o:["`.claude/commands/` for `/fix-lint`, and `~/.claude/commands/` for `/my-standup`.",
     "`~/.claude/commands/` for `/fix-lint`, and `.claude/commands/` for `/my-standup`.",
     "`.claude/commands/` for both, with the private one listed in `.gitignore` for the team.",
     "`CLAUDE.md` for `/fix-lint`, and `.mcp.json` for the private `/my-standup` command."],
  a:[0], x:{1:"userLevel"},
  e:"Lệnh team nằm ở `.claude/commands/`, lệnh cá nhân nằm ở `~/.claude/commands/`." },
{ s:5,d:3,t:"3.3",
  q:"Test files follow a single convention but are scattered throughout the codebase, including `src/**/__tests__/` and files ending in `.test.tsx`. A colleague suggests a `CLAUDE.md` in every test directory. Why is a path-scoped rule better here?",
  o:["One glob-based rule covers files by type regardless of location, with no duplicated configuration.",
     "A path-scoped rule is the only kind of configuration that Claude Code will reliably load in tests.",
     "A directory-level `CLAUDE.md` cannot be read while Claude Code is editing any test file at all.",
     "A path-scoped rule also runs the tests automatically whenever a matching test file gets changed."],
  a:[0], x:{1:"copyMd"},
  e:"Rule theo glob phù hợp cho quy ước trải khắp codebase và không cần nhân bản file." },
{ s:5,d:3,t:"3.3",
  q:"You want Next.js page conventions to be active when editing `app/**/page.tsx`, but not during backend work. Which is the correct file and field?",
  o:["A file in `.claude/rules/` with `paths: [\"app/**/page.tsx\"]` in its YAML frontmatter.",
     "A file in `.claude/skills/` with `context: fork` and the glob in the file's description.",
     "A file in `.claude/commands/` with an `argument-hint` set to `app/**/page.tsx`.",
     "A section in `.mcp.json` that maps the glob to the conventions file in the repository."],
  a:[0],
  e:"`.claude/rules/` với trường `paths` trong YAML frontmatter dùng để nạp quy ước theo đường dẫn." },
{ s:5,d:3,t:"3.4",multi:true,
  q:"Which TWO statements about plan mode and direct execution are accurate?",
  o:["Plan mode enables safe exploration and design before changes are made, preventing costly rework.",
     "A task may combine plan mode for investigation with direct execution for implementation afterward.",
     "Direct execution is appropriate for any task as long as version control is available for rollback.",
     "Plan mode should be used for all changes, regardless of size, in order to keep the process consistent.",
     "Plan mode automatically isolates verbose output from the main session by running in a forked context."],
  a:[0,1], x:{3:"planSmall"},
  e:"Plan mode dùng để khám phá và thiết kế an toàn trước khi thay đổi, và có thể kết hợp với thực thi trực tiếp." },
{ s:5,d:3,t:"3.4",
  q:"A developer must add a date-range check to a single, well-understood API handler. The acceptance criteria are clear, and existing tests already exercise the route. A teammate insists on plan mode for everything touching an API. What is the best approach?",
  o:["Use direct execution, since the change is simple and well scoped despite being in API code.",
     "Use plan mode, because every change that touches any API has architectural implications.",
     "Use the Explore subagent to examine the entire API layer before adding the date-range check.",
     "Write a skill for adding date-range checks, then invoke the skill for this one single change."],
  a:[0], x:{1:"planSmall"},
  e:"Việc nhỏ, phạm vi rõ thì thực thi trực tiếp. Nằm ở phần API không tự làm nó trở thành quyết định kiến trúc." },
{ s:5,d:3,t:"3.5",multi:true,
  q:"A refactored parser has a formatting bug that is independent of a separate logging bug, and neither fix affects the other. You also need Claude to match an unusual output format. Which TWO iteration strategies are most appropriate?",
  o:["Fix the two independent bugs sequentially, verifying each of the changes before moving on.",
     "Give two or three input and output examples to establish the unusual output format exactly.",
     "Combine both independent bugs into one long message, because they should always be sent together.",
     "Describe the format in several paragraphs of prose, so that examples will not bias the model.",
     "Ask Claude to find its own way to the right format, without giving it any feedback at all."],
  a:[0,1], x:{4:"vague"},
  e:"Lỗi độc lập có thể sửa tuần tự; định dạng khó mô tả nên dùng 2–3 ví dụ đầu vào/đầu ra." },
{ s:5,d:3,t:"3.5",
  q:"You are about to ask Claude to design an offline sync feature. Your team has limited experience with conflict resolution, and requirements are still vague. What is the best first move?",
  o:["Ask Claude to interview you with questions that surface conflict and failure considerations.",
     "Ask Claude to implement a complete solution now, and treat any surprises as bugs later on.",
     "Ask Claude to write the tests for the feature first, without clarifying any of the behavior.",
     "Ask Claude to pick an approach by itself, and then document that approach in `CLAUDE.md`."],
  a:[0],
  e:"Interview pattern giúp làm rõ yêu cầu và các cân nhắc trước khi triển khai trong lĩnh vực chưa quen." },
{ s:5,d:3,t:"3.6",
  q:"An engineer scripts a nightly documentation job with `claude \"update the docs\"`. The script works when run by hand but hangs under cron. What is the most likely fix?",
  o:["Add `-p` so that Claude Code runs in non-interactive mode.",
     "Add `--resume` so that the job continues from the last run.",
     "Add `--output-format json` so that no prompts can be shown.",
     "Add a note in `CLAUDE.md` saying the job is non-interactive."],
  a:[0], x:{3:"prompt"},
  e:"Cờ `-p` chạy Claude Code ở chế độ không tương tác, tránh treo chờ nhập trong tác vụ tự động." },
{ s:5,d:1,t:"1.6",
  q:"A refactor request says `modernize the logging across the service`. Claude immediately starts editing files in alphabetical order and soon finds that two subsystems use incompatible logging contexts. Which way of breaking down the work would have been better?",
  o:["Map how logging is used, identify the riskiest dependencies, then plan changes and adapt as issues appear.",
     "Keep the alphabetical order, but split the work so that each file is handled in a separate full session.",
     "Keep the alphabetical order, and add a final pass which reverts any file that causes a failing test.",
     "Give the entire task to a single prompt, with an instruction to preserve all existing logging behavior."],
  a:[0], x:{1:"fixedOpen",2:"fixedOpen"},
  e:"Việc mở cần lập bản đồ trước, xác định phụ thuộc rủi ro, rồi có kế hoạch thích ứng." },
{ s:5,d:1,t:"1.7",
  q:"A long analysis session established how a payments library works. You now want to try a strategy-pattern refactor and an event-driven refactor, then compare them. The analysis is still accurate. What should you do?",
  o:["Create a fork from the analysis session for each refactor, using `fork_session`.",
     "Run both refactors one after the other in the analysis session and compare them.",
     "Discard the analysis and begin one fresh, unrelated session for each of the refactors.",
     "Resume the analysis in two terminals with `--resume`, so both append to one history."],
  a:[0], x:{2:"redo"},
  e:"`fork_session` tạo các nhánh độc lập từ một baseline phân tích dùng chung." },
{ s:5,d:5,t:"5.4",
  q:"Several hours into a refactor, the session fills up with verbose search output, but the work is still ongoing and the conclusions so far are important. Which action is most suitable right now?",
  o:["Use `/compact` to reduce context usage while keeping the work going.",
     "Use `/clear` to remove the context, then continue working on the refactor.",
     "Raise `max_tokens` so that the additional search output can fit in context.",
     "Use `--resume` so that a new session begins with an empty context window."],
  a:[0], x:{1:"clear",2:"big"},
  e:"`/compact` giảm mức dùng context trong phiên dài mà vẫn giữ nội dung tóm tắt; `/clear` bỏ mất công việc đang có." },
/* ===== Multi-Agent Research (D1×7, D2×4, D4×2, D5×2) ===== */
{ s:2,d:1,t:"1.1",
  q:"After a tool result arrives, the coordinator's next request omits the earlier assistant message to `reduce payload`, and the API returns an error about an unmatched tool result. What is the correct principle?",
  o:["A `tool_result` must correspond to the preceding assistant `tool_use`, so that turn must remain in the history.",
     "Tool results are best delivered only through the system prompt, where the API does not perform any pairing checks.",
     "Tool results must be placed in a completely new conversation, because the API forbids reusing any previous turns.",
     "Tool results require prompt caching to be enabled, which keeps the assistant turn stored on the server for later."],
  a:[0], x:{1:"latestOnly",3:"cacheState"},
  e:"`tool_result` phải đi cùng `tool_use` tương ứng trong lịch sử gửi lại. API không giữ trạng thái." },
{ s:2,d:1,t:"1.2",multi:true,
  q:"Your coordinator's reports have duplicated sections and uneven depth. Which TWO coordinator changes are most likely to help?",
  o:["Give each subagent a distinct subtopic or source type, so that their work overlaps as little as possible.",
     "Evaluate each synthesis draft for gaps, and re-delegate targeted follow-up queries to fill those gaps.",
     "Let the subagents share a common scratch channel so they can decide together who researches what.",
     "Give each subagent the entire research question, so that every one of them covers the full topic.",
     "Skip reviewing the synthesis output, so that the coordinator's context remains available for planning."],
  a:[0,1], x:{2:"peer"},
  e:"Phân chia phạm vi giảm trùng lặp; vòng tinh chỉnh có mục tiêu xử lý độ sâu không đồng đều." },
{ s:2,d:1,t:"1.2",
  q:"A one-sentence fact-check request goes through search, document analysis, synthesis, and report generation, taking several minutes. Which capability is missing from the coordinator?",
  o:["Analyzing query requirements to decide which of the subagents, if any, should be invoked.",
     "Running all of the four subagents at once so that the pipeline completes more quickly.",
     "Storing its conversation in a shared memory that all of the subagents are able to read.",
     "Retrying each of the subagents several times so that the final report is more reliable."],
  a:[0], x:{3:"retryMore"},
  e:"Coordinator cần chọn subagent động theo yêu cầu thay vì luôn chạy đầy đủ pipeline." },
{ s:2,d:1,t:"1.3",multi:true,
  q:"A coordinator with `allowedTools` of `[\"WebSearch\", \"Read\"]` is unable to delegate. After you fix that, you want its delegated research to run concurrently. Which TWO changes are needed?",
  o:["Add `Task` to the coordinator's `allowedTools` so that it is able to spawn subagents.",
     "Have the coordinator emit several `Task` calls within the same response.",
     "Add `WebSearch` to every subagent, because tool access enables subagent concurrency.",
     "Enable `fork_session` for every subagent, so that they are able to run in parallel.",
     "Submit the coordinator's tasks with the Message Batches API for parallel processing."],
  a:[0,1], x:{3:"forkTools",4:"batchMisuse"},
  e:"`Task` phải có trong `allowedTools`; song song đạt được bằng nhiều lệnh `Task` trong một phản hồi." },
{ s:2,d:1,t:"1.3",
  q:"The report-writing subagent receives only conclusions from synthesis and cannot include the citations users require. What is the best change to the handoff?",
  o:["Pass the structured findings, including each claim's source metadata, in the report writer's prompt.",
     "Ask the report writer to search the web again and find a suitable citation for each of the claims.",
     "Instruct the report writer to cite sources in a general way, such as `according to recent studies`.",
     "Have the report writer access the synthesis session's memory, where the citations can still be found."],
  a:[0], x:{1:"overTool",3:"inherit"},
  e:"Metadata nguồn phải được truyền rõ ràng trong cấu trúc dữ liệu giữa các subagent." },
{ s:2,d:1,t:"1.6",
  q:"Research on a well-defined template of ten standard company metrics is predictable, and each metric uses the same sources. Your current planner spends substantial time deciding what to do. What should you do?",
  o:["Replace the planner with a fixed prompt chain for this predictable, repeatable workflow.",
     "Keep the planner, and give it additional instructions to think about each metric at length.",
     "Replace the planner with a free-form agent that has access to every tool that is available.",
     "Keep the planner, and retry it three times so that it converges on the ideal research plan."],
  a:[0], x:{1:"adaptiveFixed",3:"runTwice"},
  e:"Quy trình cố định, dự đoán được thì nên dùng prompt chaining." },
{ s:2,d:1,t:"1.7",
  q:"A long-running research session must be continued tomorrow. Because new sources are published daily, you worry about its saved search results. The analysis of older sources remains valid, but the current news section is outdated. What is the best approach?",
  o:["Start fresh with a structured summary of valid findings, then run new searches for the current news.",
     "Resume the session and assume its most recent search results are still the most complete available.",
     "Fork the session and rely on the forked branch to refresh the search results automatically.",
     "Discard all prior findings and rerun the complete research project from the original question."],
  a:[0], x:{1:"staleResume",2:"staleResume",3:"redo"},
  e:"Khi một phần kết quả đã cũ, phiên mới với tóm tắt có cấu trúc và tìm kiếm có mục tiêu đáng tin hơn resume nguyên trạng." },
{ s:2,d:2,t:"2.1",
  q:"A research agent confuses `search_news` and `search_academic`, whose descriptions differ by only one word. Which description update will help most?",
  o:["State what each searches, expected query forms, sample queries, and when to use it instead of the other.",
     "Add `IMPORTANT` and a warning to both of the descriptions, reminding the agent to choose very carefully.",
     "Make each description shorter, so that the one word that differs between them is easier to notice.",
     "Move both descriptions into the system prompt, and leave the tool definitions without any description."],
  a:[0], x:{1:"loud"},
  e:"Mô tả cần phân biệt rõ mục đích, đầu vào và thời điểm dùng tool." },
{ s:2,d:2,t:"2.2",
  q:"A search subagent retries a 429 response locally and eventually succeeds. Another search keeps failing after all of its retries. What should reach the coordinator?",
  o:["Only the unresolved failure, along with the query, the attempts made, and partial results.",
     "Every intermediate error, so the coordinator can personally manage each transient failure.",
     "Neither failure, because reporting anything to the coordinator would add unnecessary latency.",
     "A single generic failure status covering all of the searches run by that subagent today."],
  a:[0], x:{2:"fakeOk",3:"generic"},
  e:"Subagent xử lý cục bộ lỗi tạm thời, chỉ báo lên lỗi không giải quyết được kèm ngữ cảnh." },
{ s:2,d:2,t:"2.3",multi:true,
  q:"The team is reviewing its tool allocation. Which TWO choices follow good practice?",
  o:["Give the web search subagent only the search-related tools that its role requires.",
     "Give the synthesis subagent a limited fact-check tool for frequent, simple verifications.",
     "Give every subagent all of the system's tools so that each can handle any unexpected need.",
     "Give the report subagent web search so that it can improve the report as it writes it.",
     "Give the coordinator every specialized tool so that it can skip delegating entirely."],
  a:[0,1], x:{2:"overTool",3:"overTool"},
  e:"Mỗi subagent chỉ có tool theo vai trò, kèm tool hẹp cho nhu cầu thường gặp." },
{ s:2,d:2,t:"2.4",
  q:"Analysts ask the agent which internal datasets exist, and the agent responds by issuing many exploratory queries. How should the MCP server present this information?",
  o:["As an MCP resource that exposes the dataset catalog.",
     "As a tool that returns one random dataset per call.",
     "As a line in the coordinator's system prompt only.",
     "As a shell script the agent can run through Bash."],
  a:[0],
  e:"MCP resources phơi bày danh mục dữ liệu để giảm các lời gọi thăm dò." },
{ s:2,d:4,t:"4.2",
  q:"Some papers embed the method within a paragraph, while others have a formal methods section. Analysis output often says `method not stated` for the first type. What is the most effective improvement?",
  o:["Add examples demonstrating extraction of method details both from sections and from embedded text.",
     "Tell the analysis subagent to read the document more carefully before deciding on the method field.",
     "Require the method field, so that the subagent must provide a value for it in every single paper.",
     "Retry papers that have no method value until the subagent eventually identifies a method for them."],
  a:[0], x:{1:"searchMore",2:"requiredMissing",3:"retryMore"},
  e:"Few-shot với các cấu trúc tài liệu khác nhau giúp xử lý thông tin nằm rải rác." },
{ s:2,d:4,t:"4.5",
  q:"An organization wants 5,000 literature abstracts classified over the weekend, and it has no urgency. An analyst separately needs one interactive answer within seconds. Which approach is best?",
  o:["Use the Message Batches API for the abstracts, and the synchronous API for the interactive answer.",
     "Use the Message Batches API for both, because of the 50% saving on each of the requests.",
     "Use the synchronous API for both, because batches cannot process classification-type prompts.",
     "Use the synchronous API for the abstracts, and the Message Batches API for the analyst's answer."],
  a:[0], x:{1:"batchMisuse",3:"batchMisuse"},
  e:"Batch phù hợp việc không gấp; câu trả lời tương tác cần API đồng bộ." },
{ s:2,d:5,t:"5.3",
  q:"A subagent returned `no results` for a legal database. Later, you discover that the database was down, and the report wrongly stated that no legal precedent exists. Which change prevents this?",
  o:["Distinguish access failures from valid empty results in what the subagent reports.",
     "Require that every search return at least one result before it is regarded as complete.",
     "Instruct the synthesis subagent to be cautious when stating that something does not exist.",
     "Remove the statements about absence from every report, regardless of what searches found."],
  a:[0], x:{2:"vague"},
  e:"Phân biệt lỗi truy cập với kết quả rỗng hợp lệ để tránh kết luận sai rằng thông tin không tồn tại." },
{ s:2,d:5,t:"5.6",
  q:"Analysts want to see how solid each statement in a report is. Findings from several sources agree on some topics and conflict on others. How should the report be structured?",
  o:["Separate well-established findings from contested ones, while preserving each source's characterization.",
     "Present everything in a single confident voice, so that readers do not lose trust in the report itself.",
     "Include only the findings on which all the sources agree, and remove any of the contested material.",
     "Score each finding from one to ten using the model's opinion and drop those scoring below five."],
  a:[0], x:{3:"confidence"},
  e:"Báo cáo nên phân biệt phát hiện đã được xác lập và đang tranh cãi, giữ nguyên ngữ cảnh nguồn." },
/* ===== Data Extraction (D2×2, D4×10, D5×3) ===== */
{ s:4,d:2,t:"2.1",
  q:"An extraction agent uses both `parse_table` and `parse_form`. Both descriptions say `Parses document content`. For invoices with both layouts, it often chooses the wrong one. What should you do?",
  o:["Update the descriptions with each tool's expected layout, inputs, outputs, and when to use it versus the other.",
     "Add a third tool named `parse_anything`, which decides internally which one of the other tools it should call.",
     "List `parse_form` before `parse_table`, because forms appear more often in the documents that you receive.",
     "Retry with the second tool each time that the first produces invalid data according to the downstream schema."],
  a:[0], x:{2:"toolOrder"},
  e:"Mô tả tool cần phân biệt rõ để model chọn đúng. Đổi thứ tự không xử lý gốc vấn đề." },
{ s:4,d:2,t:"2.3",
  q:"Your pipeline must first identify the document type with `classify_document` and then choose the matching extraction tool. How should `tool_choice` be used?",
  o:["Force `classify_document` on the first request, then use `any` so that an extraction tool must follow.",
     "Use `auto` on every request, so that the model can skip classification when the type seems obvious.",
     "Force `classify_document` on every request, so that the order of operations is always maintained.",
     "Use `any` on the first request, because that guarantees `classify_document` will be chosen first."],
  a:[0], x:{1:"autoForce",2:"forceAll",3:"anyPick"},
  e:"Ép tool phân loại ở lượt đầu, rồi dùng `any` để buộc gọi một trong các tool trích xuất." },
{ s:4,d:4,t:"4.1",
  q:"The prompt says `extract only clearly stated obligations.` Legal reviewers find that some real obligations are missing and that some general statements are captured. What is the best revision?",
  o:["Define what counts as an obligation and what does not, with concrete wording and exclusions for each case.",
     "Replace `clearly stated` with `very clearly stated`, so that the model applies a stricter threshold.",
     "Ask the model to report a confidence score for each obligation, and show reviewers only the high ones.",
     "Tell the model that legal reviewers will check the output, so that it takes the task more seriously."],
  a:[0], x:{1:"loud",2:"confidence",3:"vague"},
  e:"Tiêu chí cụ thể về cái gì được tính và không được tính giúp tăng độ chính xác." },
{ s:4,d:4,t:"4.1",
  q:"A prompt asks for `important contract risks`, but finance and legal teams disagree with the labels. Which change gives the most consistent classification?",
  o:["Define the risk categories and severity levels, each with concrete clause examples.",
     "Ask the model to use its experience in deciding which risks seem most important.",
     "Collect the labels from three runs and keep whichever label appears most often.",
     "Ask the model to be conservative, and to prefer lower severity levels when unsure."],
  a:[0], x:{1:"vague",2:"runTwice",3:"vague"},
  e:"Định nghĩa nhóm và mức nghiêm trọng kèm ví dụ cụ thể giúp phân loại nhất quán." },
{ s:4,d:4,t:"4.2",
  q:"For supplier statements, the extractor sometimes treats a discount as a charge when formatting is unusual. Rule-based wording has not fixed this. Which addition is most likely to help?",
  o:["A few examples of unusual statement layouts, with the correct field assignments and the reasoning for them.",
     "A statement in capital letters telling the model that a discount must never be recorded as if it were a charge.",
     "A longer list of synonyms for the word `discount`, with no examples of how they appear within documents.",
     "A requirement that the model produce the same extraction twice, so that any differences get highlighted."],
  a:[0], x:{1:"loud",3:"runTwice"},
  e:"Few-shot với bố cục khác thường kèm lý do giúp model xử lý trường hợp mơ hồ." },
{ s:4,d:4,t:"4.3",multi:true,

  a:[0], x:{1:"dropValidation",2:"dropValidation",3:"confidence"},

  q:"An invoice states a subtotal, tax, and total, but the numbers on the page do not reconcile. Retries return the same printed values. What is the correct behavior?",

  q:"You run monthly extraction on 50,000 documents through the Message Batches API. Which TWO practices are correct?",

  o:["Run in non-interactive mode using `-p`.",
     "Use `--output-format json` together with `--json-schema`.",
     "Parse the terminal output using a set of regular expressions.",
     "Ask for Markdown and rely on its headings to separate fields.",
     "Run with `--resume` to preserve the output format across runs."],
  a:[0,1], x:{2:"regexMd",3:"regexMd"},
  e:"`-p` tránh treo chờ nhập; `--output-format json` và `--json-schema` tạo đầu ra máy đọc được." },
{ s:3,d:3,t:"3.6",
  q:"The test-generation step keeps proposing tests that already exist, even though `CLAUDE.md` describes the team's testing conventions in detail. What should be added to the context?",
  o:["The existing test files for the code under change.",
     "A larger output token limit for the generation step.",
     "A longer description of testing philosophy in general.",
     "The complete commit history of the entire repository."],
  a:[0], x:{1:"big",2:"vague"},
  e:"Cung cấp test hiện có để tránh đề xuất kịch bản đã được bao phủ." },
{ s:3,d:4,t:"4.1",multi:true,
  q:"Your review bot is generating too many false positives. Which TWO changes are most likely to improve its precision?",
  o:["Specify exactly which issue categories to report, and which to skip, with concrete triggers.",
     "Temporarily disable the worst false-positive category while you improve its criteria.",
     "Tell the bot to report only those findings that it is highly confident about.",
     "Tell the bot to be conservative and to only flag what truly matters to developers.",
     "Cap the number of comments per pull request to reduce how much noise developers see."],
  a:[0,1], x:{2:"vague",3:"vague",4:"limitN"},
  e:"Tiêu chí theo loại cụ thể và tạm tắt nhóm báo sai nhiều sẽ cải thiện độ chính xác. Lời dặn chung và giới hạn số lượng thì không." },
{ s:3,d:4,t:"4.2",
  q:"Developers want each finding to be directly actionable. Detailed instructions already exist, yet some findings lack a suggested fix or a precise location. What should you do?",
  o:["Add two to four examples of findings that show location, issue, severity, and suggested fix.",
     "Rewrite the instructions to be longer, and repeat each required field at least three times.",
     "Add a post-processing step that deletes all of the findings that lack a suggested fix.",
     "Ask developers to request more details from the bot whenever a finding is incomplete."],
  a:[0], x:{1:"loud"},
  e:"Few-shot là cách hiệu quả nhất để có đầu ra nhất quán, dễ hành động." },
{ s:3,d:4,t:"4.4",
  q:"You want structured findings to help you learn which detection rules developers routinely reject. Which addition most directly enables this analysis?",
  o:["Record a `detected_pattern` value for each finding, and join it with the dismissal outcome.",
     "Ask the bot to add a summary sentence on how useful it thinks each of its findings is.",
     "Ask developers to write a paragraph explaining why they dismissed each individual finding.",
     "Increase the bot's output limit so that it can explain each of its findings more fully."],
  a:[0], x:{3:"big"},
  e:"`detected_pattern` cho phép phân tích hệ thống các mẫu bị bác bỏ." },
{ s:3,d:4,t:"4.6",
  q:"A team asks whether extended thinking can replace its independent review instance, which adds some cost. What is the best recommendation?",
  o:["Keep the independent instance, as it lacks the generator's reasoning context and catches more subtle issues.",
     "Replace it with extended thinking, because more reasoning in one session is equivalent to a separate review.",
     "Replace it with a self-review prompt, because the generating session knows the code better than any other.",
     "Remove review altogether, because the generated code has already passed the automated test suite in CI."],
  a:[0], x:{1:"selfReview",2:"selfReview"},
  e:"Instance review độc lập hiệu quả hơn tự review hoặc extended thinking trong cùng ngữ cảnh." },
/* ===== Multi-Agent Research (D1×9, D2×3, D5×3) ===== */
{ s:2,d:1,t:"1.1",
  q:"A developer's research loop ends when the model's response contains the words `final report`. Occasionally a subagent's interim message mentions `the final report`, and research ends early. What is the correct design?",
  o:["Continue while `stop_reason` is `tool_use`, and treat `end_turn` as the signal that the turn has ended.",
     "Replace the phrase with a rarer token, such as `<<DONE>>`, that the model is instructed to output at the end.",
     "Check that the phrase occurs in the last sentence only, which greatly reduces the chance of an early exit.",
     "Add a maximum of twenty iterations, and remove the phrase check, so the loop always finishes at that point."],
  a:[0], x:{1:"parseText",2:"parseText",3:"iterCap"},
  e:"Dựa vào `stop_reason`, không dò ngôn ngữ tự nhiên hay token tự đặt, và không dùng số vòng làm điều kiện dừng chính." },
{ s:2,d:1,t:"1.2",multi:true,
  q:"Reports on broad topics such as `climate adaptation in cities` have gaps. Which TWO coordinator behaviors best address this?",
  o:["Decompose the topic broadly across subtopics such as infrastructure, financing, and health.",
     "Review the synthesized draft for gaps, then send targeted queries back to the research subagents.",
     "Assign the entire topic to one search subagent and raise its token budget substantially.",
     "Have the synthesis subagent fill the gaps by drawing on what it knows about the topic.",
     "Add stronger wording to the coordinator's instructions, requiring that reports be complete."],
  a:[0,1], x:{2:"big",3:"guess",4:"vague"},
  e:"Phân rã đủ rộng và vòng tinh chỉnh có mục tiêu là trách nhiệm của coordinator." },
{ s:2,d:1,t:"1.2",
  q:"After a subagent failure, three different engineers each propose how the system should recover. Which architecture principle gives one consistent place to implement that recovery logic?",
  o:["A coordinator that manages all inter-subagent communication, error handling, and information routing.",
     "A mesh in which any of the subagents may notify any other subagent directly about a failure.",
     "A shared log that each subagent watches, so that each can decide independently how to recover.",
     "A retry loop inside every subagent, so that the coordinator never becomes aware of any failure."],
  a:[0], x:{1:"peer",2:"peer",3:"retryMore"},
  e:"Coordinator là nơi tập trung xử lý lỗi và điều phối, giúp hệ thống nhất quán và dễ quan sát." },
{ s:2,d:1,t:"1.3",
  q:"The document-analysis subagent returns strong summaries, but the coordinator tells it exactly which pages to open and in what order. It cannot adapt when a PDF has an unexpected structure. What should the coordinator's prompt specify?",
  o:["The research goal and the quality criteria for the analysis, leaving the method to the subagent.",
     "A longer sequence of page numbers, covering every format that could reasonably be encountered.",
     "A request to return an error whenever the sequence of pages does not match the actual document.",
     "A complete copy of the coordinator's prior reasoning, so that the subagent can infer the method."],
  a:[0], x:{1:"stepProc",2:"abort",3:"transcript"},
  e:"Nêu mục tiêu và tiêu chí chất lượng thay vì thủ tục từng bước để subagent thích ứng." },
{ s:2,d:1,t:"1.3",
  q:"You want to examine two different framings of a research question, starting from the same completed literature analysis, without either one's reasoning leaking into the other. What should you use?",
  o:["Fork-based sessions, branching from the shared analysis baseline.",
     "One continued session, asking about each framing one after the other.",
     "Two subagents that exchange notes throughout their investigations.",
     "A single prompt that asks for both framings in a single response."],
  a:[0], x:{2:"peer",3:"oneTask"},
  e:"Fork tạo các nhánh độc lập từ một baseline phân tích chung để khám phá các hướng khác nhau." },
{ s:2,d:1,t:"1.4",multi:true,
  q:"Before a research report can be sent to clients, legal sign-off must be recorded. If the agent can't proceed, a human editor who has no access to the agent's history must take over. Which TWO designs are right?",
  o:["Block the send tool programmatically until the legal sign-off has been recorded.",
     "Provide the editor a structured summary of the status, open issues, and recommended next steps.",
     "State the sign-off requirement in the coordinator prompt and rely on it being followed.",
     "Send the editor the raw transcript of all agents without any accompanying summary.",
     "Add a `PostToolUse` hook on the send tool that records whether the sign-off was missing."],
  a:[0,1], x:{2:"prompt",3:"transcript",4:"postBlock"},
  e:"Yêu cầu bắt buộc cần cổng chặn; người tiếp nhận không có lịch sử cần bản bàn giao có cấu trúc." },
{ s:2,d:1,t:"1.5",
  q:"Different source tools return publication dates as `2024-03-01`, `March 2024`, and Unix timestamps. Synthesis sometimes orders events incorrectly. Which solution is deterministic?",
  o:["A `PostToolUse` hook normalizing every date before the model processes the tool result.",
     "A paragraph in the synthesis prompt explaining how each date format should be read.",
     "A second synthesis pass that is asked to check that the order of events looks sensible.",
     "A larger context window, so that all of the date formats can be compared side by side."],
  a:[0], x:{1:"prompt",2:"selfReview",3:"big"},
  e:"`PostToolUse` chuẩn hóa dữ liệu một cách xác định trước khi model xử lý." },
{ s:2,d:1,t:"1.6",
  q:"The research team runs two workflows: a monthly fixed-format market update, and ad hoc questions in which each answer shapes the next query. Which assignment is best?",
  o:["Sequential prompt chaining for the monthly update, and dynamic decomposition for the ad hoc questions.",
     "Dynamic decomposition for the monthly update, and sequential prompt chaining for the ad hoc questions.",
     "Sequential prompt chaining for both, so that one single pipeline design can be maintained by the team.",
     "Dynamic decomposition for both, because a planner is never a disadvantage regardless of the workflow."],
  a:[0], x:{2:"fixedOpen",3:"adaptiveFixed"},
  e:"Quy trình cố định dùng chuỗi tuần tự; câu hỏi mở dùng phân rã động." },
{ s:2,d:1,t:"1.7",
  q:"A named research session has analyzed 80 sources. Three of them were retracted yesterday; the remaining analysis stands. Which continuation is best?",
  o:["Resume the session, tell it which three sources were retracted, and have it re-evaluate affected claims.",
     "Start over from the original question, and repeat the analysis of all 80 sources from the beginning.",
     "Resume the session with no comment, because the retractions will be picked up during synthesis.",
     "Fork the session three times, one for each retraction, and combine the three resulting reports."],
  a:[0], x:{1:"redo",2:"staleResume"},
  e:"Khi phần lớn context còn hợp lệ, resume và thông báo cụ thể thay đổi để phân tích lại có mục tiêu." },
{ s:2,d:2,t:"2.1",
  q:"The coordinator's prompt says `always verify facts by searching the web`, and the synthesis subagent's well-described `check_internal_kb` tool goes unused, even for internal data. What should you examine first?",
  o:["The wording in the prompt that steers the agent toward web searches for all verification.",
     "The `check_internal_kb` tool's position within the agent's list of available tools.",
     "The maximum token limit configured for the synthesis subagent's request to the API.",
     "The number of web search results that are returned per call to the search tool."],
  a:[0], x:{1:"toolOrder",2:"big"},
  e:"Chỉ dẫn theo từ khóa trong prompt có thể lấn át mô tả tool. Cần xem lại prompt trước." },
{ s:2,d:2,t:"2.2",
  q:"A subagent's `search_patents` call fails because the query syntax is invalid. The error says `isRetryable: false, category: validation`. What should the subagent do?",
  o:["Correct the query syntax and make a new call, since only the identical request should not be repeated.",
     "Abandon the topic and report to the coordinator that patent information is not available anywhere.",
     "Repeat the identical call with exponential backoff, in case the patent service recovers on its own.",
     "Return an empty result as a success, so that the coordinator continues on with the other topics."],
  a:[0], x:{1:"abort",2:"retryPolicy",3:"fakeOk"},
  e:"Không thử lại nghĩa là không lặp y nguyên; lỗi validation cần sửa đầu vào rồi gọi lại." },
{ s:2,d:2,t:"2.4",
  q:"Your research agents can use several MCP servers, and many agent turns are spent discovering which internal reports exist. What is the most suitable use of MCP here?",
  o:["Expose the report catalog as a resource, giving agents visibility without exploratory tool calls.",
     "Add one tool per report, so that the name of each tool tells the agent that the report exists.",
     "Hardcode the current report list into each subagent's prompt, then update the prompts each week.",
     "Remove the other MCP servers, so that the agent has less to explore while looking for the reports."],
  a:[0], x:{3:"disable"},
  e:"MCP resources giúp phơi bày danh mục nội dung và giảm các lệnh gọi thăm dò." },
{ s:2,d:5,t:"5.1",
  q:"The synthesis subagent gets accurate numbers but cannot tell how or when they were measured, which leads to misleading comparisons. What should you require upstream?",
  o:["Subagents include metadata such as dates, source locations, and method context in structured outputs.",
     "Subagents write out longer narrative paragraphs that discuss the background for each of their numbers.",
     "Subagents remove all context from each number, so that the synthesis step remains free of any bias.",
     "Subagents forward complete source documents, leaving the synthesis step to recover the metadata itself."],
  a:[0], x:{3:"transcript"},
  e:"Yêu cầu subagent đưa metadata vào đầu ra có cấu trúc để bước tổng hợp diễn giải đúng." },
{ s:2,d:5,t:"5.3",
  q:"A coordinator receives `search failed` from a subagent and cannot decide whether to retry, switch sources, or proceed. Which change gives it what it needs?",
  o:["Report failure type, query attempted, partial results, and possible alternatives.",
     "Report the same message, but increase the severity level attached to the failure.",
     "Report nothing, and let the coordinator infer the failure from the missing findings.",
     "Report the failure and end the whole research workflow to avoid unreliable output."],
  a:[0], x:{1:"generic",2:"fakeOk",3:"abort"},
  e:"Ngữ cảnh lỗi có cấu trúc cho phép coordinator quyết định khôi phục phù hợp." },
{ s:2,d:5,t:"5.6",multi:true,
  q:"A synthesis step compresses many findings, and end users need to trace every claim. Which TWO requirements are most effective?",
  o:["Subagents output claim-source mappings with URLs, document names, and relevant excerpts.",
     "The synthesis agent preserves and merges those mappings when combining findings.",
     "The synthesis agent writes a general bibliography without linking sources to claims.",
     "The report rewrites each source's characterization so that the tone is uniform throughout.",
     "The report cites only the most frequently referenced source for each of its sections."],
  a:[0,1], x:{4:"pickOne"},
  e:"Ánh xạ nhận định - nguồn có cấu trúc phải được giữ và gộp qua bước tổng hợp." },
/* ===== Data Extraction (D2×1, D4×8, D5×6) ===== */
{ s:4,d:2,t:"2.2",
  q:"A subagent's OCR tool fails on one page. It retries twice locally, then succeeds. Later a different document fails permanently because it is password protected. What should reach the coordinator?",
  o:["Only the permanent failure, with a non-retryable permission category and what was attempted.",
     "Both events, each represented with the same generic status for the sake of consistency.",
     "Neither event, with an empty document returned as a successful result for the second file.",
     "Only the first event, because it demonstrates that the subagent's retry logic is working."],
  a:[0], x:{1:"generic",2:"fakeOk"},
  e:"Lỗi tạm thời đã xử lý cục bộ thì không cần báo; lỗi không xử lý được cần được báo kèm ngữ cảnh." },
{ s:4,d:4,t:"4.1",
  q:"The prompt tells the model to `flag any unusual contract terms`, and output varies widely. Business wants only auto-renewals longer than 12 months and liability caps below $1 million. How should the prompt be written?",
  o:["State those two conditions explicitly as the flagging criteria, with examples of qualifying clauses.",
     "Ask the model to think like an experienced lawyer when deciding which terms are truly unusual.",
     "Keep the existing wording, and sort the output so that the most unusual items appear at the top.",
     "Ask the model to be conservative, and to flag only those terms that would surprise a business user."],
  a:[0], x:{1:"vague",3:"vague"},
  e:"Tiêu chí cụ thể rõ ràng thay cho lời dặn chung." },
{ s:4,d:4,t:"4.2",
  q:"Extraction of `delivery_terms` is accurate on documents like your examples, but your three examples all use the same layout. Accuracy is poor on other layouts. What is the best change?",
  o:["Replace some of the examples so they demonstrate the range of document structures encountered.",
     "Add ten more examples that use the same layout, to reinforce the extraction pattern it should use.",
     "Remove all of the examples, because few-shot prompts always cause a model to overfit one format.",
     "Add a sentence to the prompt saying that the layouts of real-world documents can differ somewhat."],
  a:[0],
  e:"Few-shot nên minh họa nhiều cấu trúc tài liệu khác nhau để model khái quát tốt." },
{ s:4,d:4,t:"4.3",
  q:"A team stores `currency` as free text and receives `USD`, `US$`, `dollars`, and `$`. Which schema change, combined with prompting, best resolves this while allowing for unusual currencies?",
  o:["An enum of supported codes plus `other` and a detail field, with normalization rules in the prompt.",
     "A required free-text field, with an instruction telling the model to be consistent in its wording.",
     "An enum of the supported codes only, instructing the model to choose the closest available value.",
     "A numeric field holding an internal currency ID, with no list of valid IDs supplied to the model."],
  a:[0], x:{1:"freeText",2:"guess"},
  e:"Enum với `other` kèm chi tiết và quy tắc chuẩn hóa trong prompt giúp đầu ra nhất quán mà vẫn mở rộng được." },
{ s:4,d:4,t:"4.3",multi:true,
  q:"Which TWO statements about `tool_use` with JSON schemas for extraction are correct?",
  o:["Structured data is read from the `tool_use` block's input in the API response.",
     "Required fields can push a model to invent values when the source lacks them.",
     "Strict schemas ensure that the values extracted match what the document says.",
     "Using `tool_choice: auto` guarantees that one of the extraction tools is called.",
     "A schema makes format normalization instructions in the prompt unnecessary."],
  a:[0,1], x:{3:"autoForce"},
  e:"Dữ liệu nằm trong input của khối `tool_use`; trường bắt buộc có thể khiến model bịa giá trị khi nguồn không có." },
{ s:4,d:4,t:"4.3",
  q:"Multiple extraction tools are defined, and a document must always be processed by exactly the `extract_invoice` tool because an upstream classifier has already confirmed the type. Which setting is the most precise?",
  o:["`tool_choice: {\"type\": \"tool\", \"name\": \"extract_invoice\"}`",
     "`tool_choice: {\"type\": \"any\"}`",
     "`tool_choice: {\"type\": \"auto\"}`",
     "No `tool_choice`, and a stronger prompt"],
  a:[0], x:{1:"anyPick",2:"autoForce",3:"loud"},
  e:"Khi đã biết chắc tool cần gọi, forced selection là cách chính xác nhất." },
{ s:4,d:4,t:"4.4",
  q:"Failed extractions are categorized. Which group of failures is most likely to be fixed by retrying with specific error feedback?",
  o:["Wrong date format, values in the wrong field, and a malformed structure in the output.",
     "A price found only in an unattached annex, and a signature on a page that was never scanned.",
     "A field that the source document never mentions, and a value that is held only in another system.",
     "A policy number that is illegible in the scan, and a purchase order that does not exist at all."],
  a:[0],
  e:"Lỗi định dạng và cấu trúc có thể sửa bằng retry kèm phản hồi; thông tin không có trong nguồn thì không." },
{ s:4,d:4,t:"4.5",
  q:"A nightly batch finished, and each result needs matching to its source document in your database. The output order differs from the input order. What should you rely on?",
  o:["The `custom_id` assigned to each request.",
     "The position of each line in the results.",
     "The timestamp of each batch result entry.",
     "The total token usage of each of the results."],
  a:[0], x:{1:"byOrder"},
  e:"`custom_id` dùng để đối chiếu cặp request/response trong Batch API." },
{ s:4,d:4,t:"4.6",
  q:"A 200-page contract is extracted in one pass, and clauses that interact across sections are often handled inconsistently. Which architecture is most appropriate?",
  o:["Extract section by section in local passes, then run a cross-section pass for interacting clauses.",
     "Extract the whole contract in a single pass, with an instruction to be consistent across sections.",
     "Extract only the first and last 50 pages, where the most important clauses are usually located.",
     "Extract the contract twice in a single session, and let that session reconcile its two outputs."],
  a:[0], x:{1:"vague",3:"selfReview"},
  e:"Chia lượt cục bộ và lượt tích hợp tránh loãng chú ý và không nhất quán." },
{ s:4,d:5,t:"5.1",
  q:"A long extraction conversation accumulates large OCR tool outputs, though later steps need only the identified line items. Context usage is growing fast. What should you do?",
  o:["Trim each OCR result to the relevant fields before it accumulates in the context.",
     "Send only the most recent message to the model, and discard the earlier conversation.",
     "Enable prompt caching so that the OCR outputs no longer consume any context window.",
     "Tell the model to ignore the OCR text that is not relevant to the current line item."],
  a:[0], x:{1:"latestOnly",2:"cacheState"},
  e:"Cắt bớt kết quả tool xuống các trường liên quan trước khi tích lũy. Prompt caching không giảm kích thước context." },
{ s:4,d:5,t:"5.2",
  q:"While matching extracted suppliers, the lookup tool returns three records named `Acme Ltd`. The document has no tax ID, but it has an address and a contact email. What should the system do?",
  o:["Use additional identifiers to disambiguate, and route to review if a unique match remains impossible.",
     "Select the record with the most recent transaction, because it is the most likely to be the supplier.",
     "Select the first record returned, because the lookup tool ranks its results by their relevance.",
     "Create a fourth supplier record, which guarantees that the invoice is attached to a unique entity."],
  a:[0], x:{1:"guess",2:"guess"},
  e:"Nhiều kết quả khớp cần thêm định danh, không chọn theo phỏng đoán; nếu không xác định được thì chuyển người duyệt." },
{ s:4,d:5,t:"5.3",
  q:"A subagent cannot parse an attachment, and it returns `{\"items\": []}` with success status. Downstream, finance records a zero-value invoice. Which change is needed?",
  o:["Report the parse failure with context, distinct from a valid document that has no items.",
     "Add a check that replaces all empty lists with the average invoice value for that supplier.",
     "Keep the empty success result, and tell finance to review all invoices that have zero value.",
     "Stop the whole pipeline whenever any attachment fails, until an engineer can investigate it."],
  a:[0], x:{1:"average",2:"fakeOk",3:"abort"},
  e:"Không được giấu lỗi thành kết quả rỗng; cần phân biệt lỗi với tài liệu hợp lệ không có mục nào." },
{ s:4,d:5,t:"5.5",multi:true,
  q:"You plan to reduce human review for a document pipeline. Which TWO are the most important preconditions?",
  o:["Accuracy is validated by document type and field, not only in aggregate.",
     "Confidence thresholds have been calibrated on a labeled validation set.",
     "Overall accuracy on the most recent batch has reached at least 95%.",
     "The model reports that it feels confident about most of its extractions.",
     "The review team has reported that its workload has become too high."],
  a:[0,1], x:{2:"aggregate",3:"confidence"},
  e:"Cần xác thực theo từng phân khúc và hiệu chỉnh ngưỡng trên dữ liệu có nhãn trước khi giảm duyệt." },
{ s:4,d:5,t:"5.5",
  q:"You want an ongoing measure of the error rate among auto-approved extractions, including across rare document types. Which sampling approach is best?",
  o:["Stratified random sampling across document types and confidence bands.",
     "Reviewing the most recent hundred auto-approved extractions each week.",
     "Reviewing only those documents that are submitted by the largest supplier.",
     "Reviewing only those extractions that have the lowest confidence values."],
  a:[0],
  e:"Lấy mẫu ngẫu nhiên phân tầng giúp đo lỗi trên mọi phân khúc và phát hiện mẫu lỗi mới." },
{ s:4,d:5,t:"5.6",
  q:"Two contracts specify different penalty rates for the same supplier. An extraction subagent must pass results to a coordinator for reconciliation. What is the right approach?",
  o:["Complete the extraction with both values included and explicitly annotated with their sources.",
     "Select the value from whichever contract was the first to be processed by the subagent.",
     "Omit the penalty rate entirely, because a conflicting value is worse than no value at all.",
     "Calculate a blended rate from the two values and report it as the supplier's penalty rate."],
  a:[0], x:{1:"pickOne",3:"average"},
  e:"Giữ cả hai giá trị kèm nguồn và để coordinator quyết định cách đối chiếu." }
]});

const ELIM_GROUPS = [
  "Thêm tài nguyên thay vì sửa gốc",
  "Dặn thêm trong prompt khi cần bảo đảm",
  "Retry và thiếu dữ liệu",

function isCorrect(q, sel) {
  if (!sel || sel.length !== q.a.length) return false;
  const want = [...q.a].sort((x, y) => x - y);

}

    for (const [map, key] of [[byDomain, q.d], [byScenario, q.s]]) {
      map[key] = map[key] || { correct: 0, total: 0 };
      map[key].total++;
      if (ok) map[key].correct++;
    }
    return { index: i, sel, ok, blank: sel.length === 0 };
  });
  const correct = items.filter(x => x.ok).length;

  return a;
}

  S.phase = "exam";
  S.order = makeOrder(SET_BY_ID[setId].Q);
  applyOrder();
  S.perm = QUESTIONS.map(q => shuffled(q.o.length, Math.random));
  S.startedAt = Date.now();
  S.deadline = S.startedAt + LIMIT_MIN * 60000;
  save(); render(); window.scrollTo(0, 0);
}
function finish() {
  S.phase = "result"; S.endedAt = Math.min(Date.now(), S.deadline); modal = false;
  reviewFilter = "all"; reviewDomain = "0"; delete app.dataset.home;
  const G = grade(QUESTIONS, S.answers);
  try { localStorage.setItem("ccarf-history", JSON.stringify([...history(), { set: setId, scaled: G.scaled, correct: G.correct, ms: S.endedAt - S.startedAt, hint: !!S.hintUsed, at: S.endedAt }].slice(-40))); } catch (e) {}
  save(); render(); window.scrollTo(0, 0);
}
function go(i) { S.cur = Math.max(0, Math.min(QUESTIONS.length - 1, i)); modal = false; mapOpen = false; save(); render(); window.scrollTo(0, 0); }
function toggle(optIdx) {
  const q = QUESTIONS[S.cur], want = q.a.length;
  let sel = [...(S.answers[S.cur] || [])];
  if (want === 1) sel = [optIdx];
  else if (sel.includes(optIdx)) sel = sel.filter(x => x !== optIdx);
  else if (sel.length < want) sel.push(optIdx);
  S.answers[S.cur] = sel; save(); render(`o${optIdx}`);
}

function tablesFor(q) {
  const stem = String(q.q).toLowerCase();
  const ans = q.a.map(i => String(q.o[i])).join("\n").toLowerCase();
  const t = stem + "\n" + ans;
  const has = (s, re) => re.test(s);
  const ids = [];
  const add = id => { if (!ids.includes(id)) ids.push(id); };

  if (has(t, /argument-hint|allowed-tools|context:\s*fork/) ||
      (has(stem, /frontmatter/) && has(t, /\bpaths\b/)) ||
      has(ans, /`paths`|paths:\s*\[/))
    add("skill-frontmatter");

  if (has(stem, /tool_choice/) || has(ans, /tool_choice/) ||
      has(ans, /forced [^\n]{0,40}on the first turn/) ||
      has(ans, /`any`, so (that )?the model must call/) ||
      has(ans, /force(?:d)? (?:\w+ )?on the first/))
    add("tool-choice");

  if (has(t, /\/compact|\/clear|\/memory|--resume\b/) ||
      has(ans, /start a new session and (?:inject|pass) a structured summary/))
    add("session-commands");

  if ((has(t, /\bgrep\b/) && has(t, /\bglob\b/)) ||
      has(ans, /read selectively/) ||
      has(stem, /read every file|read all (of )?(the )?(repository|files)|reading all \d+ files/))
    add("grep-glob-read");

  if (has(stem, /which two .{0,100}enforced programmatically/) ||
      has(stem, /\bmust never\b|\bguaranteed\b|must not be allowed to run|forbidden command/) ||
      has(ans, /pretooluse|prerequisite gate|programmatic(?:ally)? (?:gate|enforc)|block (?:it|the (?:behavior|command)) in code/) ||
      (has(stem, /posttooluse/) && has(ans, /pretooluse/)) ||
      (has(stem, /system prompt requires|even though the (?:system )?prompt/) && has(ans, /\bhook\b/)))
    add("guarantees");

  const ciHang = has(stem, /stalls until the runner|hangs under cron|waiting for a confirmation|works when run by hand but hangs|works on a developer's laptop, but in ci/);
  if (has(t, /`--?p`|non-interactive|--output-format json|--json-schema/) || ciHang || has(ans, /`-p`/))
    add("ci");

  if (!ciHang && (
      has(t, /isretryable|iserror:\s*true/) ||
      has(ans, /structured error|bounded retries|keep the original value/) ||
      has(stem, /retries both|identical empty response|empty list both when|returns an empty|items": \[\]|database (?:connection )?times out|order not found|not in the (source )?documents|policy.{0,40}error|business-rule/)
    ))
    add("errors-retry");

  if (has(ans, /keep both|annotate both, with sources|with sources and dates/) ||
      has(stem, /two sources|industry report says|government dataset|two contracts specify different|disagrees? on a (?:figure|number|rate)|average (?:them|two)/) ||
      (has(stem, /returns (?:three|two) (?:accounts|people|records)/) && has(ans, /both|annotat|additional identifier|do not pick|not (?:select|pick) one/)))
    add("sources");

  if (has(stem, /asked to speak to a person|talk to someone|i want to talk to someone|has not asked/) ||
      has(ans, /escalate immediately|raw transcript/) ||
      (has(ans, /structured summary/) && has(stem, /escalat|handoff|handing (?:the )?case|human/)) ||
      has(stem, /which two .{0,80}escalat/) ||
      has(stem, /escalat(?:e|ion)/) && has(ans, /escalat|human/))
    add("escalate");

  if (has(ans, /several `task` calls|does not inherit|hub-and-spoke|allowedtools[`' ]+includes `task`/) ||
      (has(stem, /subagent/) && has(t, /inherit|shared memory|hub-and-spoke|send (?:its )?results straight|numbered procedures|peer messages/)))
    add("subagents");

  if (has(t, /message batches|batches api|custom_id|batch submissions|batch processing can take/) ||
      (has(stem, /\bsla\b|\b26 hours\b|\b30 hours\b/) && has(t, /\bbatch/)))
    add("batches");

  if (has(t, /~\/\.claude|\.mcp\.json|\$\{var\}|\.claude\/rules\/|@import/) ||
      has(stem, /personal skill|must not affect anyone else|copied `?claude\.md|team-wide convention|whole team should follow|after cloning the repository/))
    add("team-config");

  if (has(stem, /in the same session.{0,40}review|asks that session to review|review (?:its|your|the) (?:work|implementation|code it just|change)|same session reviews|independent review(?:er| instance)|extended thinking can replace/) ||
      has(ans, /independent reviewer|separate session|prior findings|full change, and include|report-or-skip|not a cap of n/) ||
      has(stem, /ignoring all (?:review|flags|comments)|false positives?|style findings are wrong|only the latest commit/))
    add("review");

  if (has(t, /plan mode|direct execution|explore subagent/))
    add("plan-explore");

  if (has(stem, /nullable|required field|free-text|free text|placeholder such as|validation rule|enum value|n\/a/) ||
      has(ans, /nullable or optional|`null`, not|not a placeholder|enum, with `other`|do not drop the (validation )?rule|make (?:it|the field) nullable/))
    add("schema");

  if (has(stem, /confus(?:es|ing) two tools|tool selection (?:accuracy )?has dropped|reorder the tool list|disable (?:the )?(?:built-in|grep)|keyword-style system prompt|keyword-driven system prompt|always grep before|18 tools|22 tools|wrong mode|wrong scope|full web search/) ||
      has(ans, /clearer descriptions; do not merge|fix the (?:tool )?description|do not disable the built-in|keyword-style wording is overriding|revise the system prompt|specialized (?:sub)?agents|narrow `verify_fact`/))
    add("wrong-tool");

  if (has(ans, /mcp resource|calibrat(?:e|ed) on (?:a )?labeled|break accuracy down by type|stratified (?:random )?sampl/) ||
      has(stem, /overall accuracy|97% accuracy|98% accuracy|eliminating human review|reduce human review|self-reported confidence|high-confidence extractions|stratified|not only in aggregate/) ||
      has(t, /stop_reason` is `max_tokens/) ||
      has(stem, /what exists without exploratory|wasted (?:exploratory )?calls|which internal (?:datasets|reports) exist/))
    add("reliability");

  return ids;
}

everal `Task` calls in one response"], ["The coordinator never spawns subagents and tries the work itself", "check that its `allowedTools` includes `Task`"]]}, {"id": "batches", "title": "Message Batches API", "rows": [["Matching batch results after the order changes", "`custom_id`"], ["An SLA of about 26–30 hours, and a batch can take 24 hours", "submit every few hours, not once a day"], ["Some items succeeded and others failed", "resume and resubmit only the failures"], ["Urgent work, mid-request tools, or parallel subagents", "the synchronous API, not the Batches API"]]}, {"id": "team-config", "title": "Cấu hình team và secret", "rows": [["A convention the whole team should follow", "project-level config, committed to the repo"], ["A personal skill that must not affect anyone else", "`~/.claude/skills/`, under a different name"], ["The same guidance across packages, without copied `CLAUDE.md` files", "`.claude/rules/`, `@import`, or a `paths` glob"], ["An MCP server needs a credential", "`${VAR}` in `.mcp.json`, not a real token in the repo"]]}, {"id": "ci", "title": "CI và job tự động", "rows": [["The job hangs in CI or cron, waiting for a confirmation", "`-p` (non-interactive)"], ["Output must be parsed reliably", "`--output-format json` with `--json-schema`"], ["Parse prose with a regex or with Markdown headings", "not reliable"], ["A `CLAUDE.md` line saying not to ask for confirmation", "not the first fix for a hang"]]}, {"id": "review", "title": "Review", "rows": [["The code just written needs a review", "an independent reviewer in a separate session"], ["A CI review is too noisy", "report-or-skip criteria, or disable a noisy category; not a cap of N"], ["Later reviews should not repeat comments that are already fixed", "prior findings in context; not exact-string deduping"], ["A pull request has several commits", "review the full change, not only the latest commit"]]}, {"id": "plan-explore", "title": "Plan mode và khám phá", "rows": [["A small, already well let flashOpen = false;
let flashFromResult = false;
let flashHighlight = [];

function canOpenFlash() {
  return S.phase !== "exam" || !!app.dataset.home;
}
function openFlash(focusId) {
  if (!canOpenFlash()) return;
  flashFromResult = false;
  flashHighlight = [];
  flashFocus = focusId || "";
  flashOpen = true;
  try { location.replace(flashFocus ? "#flash/" + flashFocus : "#flash"); } catch (e) { location.hash = flashFocus ? "flash/" + flashFocus : "flash"; }
  render();
  scrollFlash();
}
function openFlashFromResult(ids, focusId) {
  if (!canOpenFlash()) return;
  const list = (ids || []).filter(id => FLASH_TABLES.some(t => t.id === id));
  if (!list.length) return;
  flashFromResult = S.phase === "result" && !app.dataset.home;
  flashHighlight = list;
  flashFocus = focusId && list.includes(focusId) ? focusId : list[0];
  flashOpen = true;
  try { location.replace("#flash/" + flashFocus); } catch (e) { location.hash = "flash/" + flashFocus; }
  render();
  scrollFlash();
}
function scrollFlash() {
  const id = flashFocus || flashHighlight[0];
  if (!id) return;
  requestAnimationFrame(() => {
    document.getElementById("diff-" + id)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}
function closeFlash() {
  const backToResult = flashFromResult && S.phase === "result";
  flashOpen = false;
  flashFromResult = false;
  flashHighlight = [];
  flashFocus = "";
  try { location.replace("#"); } catch (e) { location.hash = ""; }
  if (backToResult) delete app.dataset.home;
  render();
  window.scrollTo(0, 0);
}

/* Progress lives only in this browser's localStorage, so another device starts empty. These helpers move it between devices: a link (data in the #hash, never sent to the server), a pasted code, or a .json file. Importing merges: per set the newer attempt wins, score history is united. */
let syncMsg = { cls: "", text: "" }, syncOut = "", pasteOpen = false;
const SYNC_PREFIX = "ccarf-", SET_KEY_RE = /^ccarf-mock-v1(-s\d+)?$/;
function syncSnapshot() {
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(SYNC_PREFIX)) data[k] = localStorage.getItem(k); } } catch (e) {}
  return { app: "ccar-f-mock", v: 1, at: Date.now(), data };
}
function b64u(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function unb64u(str) { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4)); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
async function streamThrough(bytes, ts) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ts)).arrayBuffer()); }
async function packCode() {
  const bytes = new TextEncoder().encode(JSON.stringify(syncSnapshot()));
  if (window.CompressionStream) { try { return "z" + b64u(await streamThrough(bytes, new CompressionStream("deflate-raw"))); } catch (e) {} }
  return "j" + b64u(bytes);
}
async function unpackCode(raw) {
  let s = String(raw || "").trim();
  if (s.startsWith("{")) return JSON.parse(s);
  const at = s.indexOf("#sync="); if (at >= 0) s = s.slice(at + 6);
  s = s.replace(/\s+/g, "");
  if (!s) throw new Error("empty");
  const kind = s[0], bytes = unb64u(s.slice(1));
  if (kind === "z") return JSON.parse(new TextDecoder().decode(await streamThrough(bytes, new DecompressionStream("deflate-raw"))));
  if (kind === "j") return JSON.parse(new TextDecoder().decode(bytes));
  throw new Error("format");
}
function parseJson(s) { try { return JSON.parse(s); } catch (e) { return null; } }
function attemptRank(s) { return [s.startedAt || 0, s.phase === "result" ? 2 : s.phase === "exam" ? 1 : 0, s.endedAt || 0, Object.values(s.answers || {}).filter(x => x && x.length).length]; }
function newerAttempt(a, b) { /* true when b should replace a */
  if (!b || !b.phase) return false; if (!a || !a.phase) return true;
  const ra = attemptRank(a), rb = attemptRank(b);
  for (let i = 0; i < ra.length; i++) if (ra[i] !== rb[i]) return rb[i] > ra[i];
  return false;
}
function mergeSnapshot(snap) {
  if (!snap || typeof snap.data !== "object" || !snap.data) throw new Error("format");
  const inc = snap.data; let sets = 0, added = 0;
  for (const [k, v] of Object.entries(inc)) {
    if (!k.startsWith(SYNC_PREFIX) || typeof v !== "string") continue;
    const cur = localStorage.getItem(k);
    if (SET_KEY_RE.test(k)) {
      if (newerAttempt(parseJson(cur), parseJson(v))) { localStorage.setItem(k, v); sets++; }
    } else if (k === "ccarf-history") {
      const all = [...(parseJson(cur) || []), ...(parseJson(v) || [])].filter(h => h && h.at);
      const seen = new Set(), merged = all.sort((x, y) => x.at - y.at).filter(h => { const id = `${h.set}|${h.at}`; if (seen.has(id)) return false; seen.add(id); return true; }).slice(-40);
      added = merged.length - (parseJson(cur) || []).length;
      localStorage.setItem(k, JSON.stringify(merged));

}
function reloadState() {
  try { const v = +localStorage.getItem("ccarf-current-set"); if (SET_BY_ID[v]) setId = v; } catch (e) {}
  try { hints = localStorage.getItem("ccarf-hints") === "1"; } catch (e) {}
  S = load() || fresh(); applyOrder();
  modal = false; mapOpen = false; confirmDiscard = false; reviewFilter = "all"; reviewDomain = "0";
  if (S.phase !== "start") app.dataset.home = "1"; else delete app.dataset.home;
}
async function importCode(raw) {
  try {
    const r = mergeSnapshot(await unpackCode(raw));
    reloadState(); pasteOpen = false; syncOut = "";
    syncMsg = { cls: "ok", text: r.sets || r.added
      ? `Đã nhập tiến độ: cập nhật ${r.sets} đề, thêm ${r.added} lượt vào lịch sử điểm.`
      : "Đã nhập. Máy này đã có tiến độ mới bằng hoặc hơn nên không có gì thay đổi." };
  } catch (e) {
    syncMsg = { cls: "err", text: "Không đọc được link, mã hoặc file tiến độ. Hãy kiểm tra đã sao chép đủ chưa rồi thử lại." };
  }
  render();
}
async function makeLink() {
  try {
    const code = await packCode();
    syncOut = `${location.origin}${location.pathname}#sync=${code}`;
    let copied = false;
    try { await navigator.clipboard.writeText(syncOut); copied = true; } catch (e) {}
    syncMsg = { cls: "ok", text: copied
      ? "Đã sao chép link. Gửi link cho chính bạn (Zalo, email…) rồi mở trên máy kia là tiến độ được nạp vào."
      : "Hãy sao chép link bên dưới, gửi cho chính bạn rồi mở trên máy kia." };
  } catch (e) { syncMsg = { cls: "err", text: "Không tạo được link trên trình duyệt này. Hãy dùng Tải file tiến độ." }; }
  render(); const el = document.getElementById("syncout"); if (el) { el.focus(); el.select(); }
}
async function saveProgressFile() {
  const filename = `ccar-f-tien-do-${new Date().toLocaleDateString("sv")}.json`, data = JSON.stringify(syncSnapshot());
  try {
    if (dl) await dl.save({ filename, data });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
    syncMsg = { cls: "ok", text: `Đã tải ${filename}. Trên máy kia, bấm Nhập file tiến độ và chọn file này.` };
  } catch (e) { syncMsg = { cls: "err", text: "Không tải được file tiến độ. Hãy dùng Tạo link chuyển tiến độ." }; }
  render();
}
function syncView() {
  return `<section class="card sync"><h2>Chuyển tiến độ sang máy khác</h2>
    <p class="sub">Tiến độ (bài đang làm, kết quả các đề, lịch sử điểm) chỉ lưu trong trình duyệt này, nên máy khác mở trang sẽ không thấy. Tạo link chuyển rồi mở link đó trên máy kia, hoặc tải file tiến độ rồi nhập trên máy kia. Khi nhập, với mỗi đề bài mới hơn được giữ lại và lịch sử điểm được gộp, nên không mất dữ liệu ở máy nhận.</p>
    <div class="actions"><button class="btn" id="synclink">Tạo link chuyển tiến độ</button><button class="btn" id="syncsave">Tải file tiến độ</button><button class="btn" id="syncopen">Nhập file tiến độ</button><button class="btn ghost" id="syncpaste">Dán link hoặc mã</button></div>

    <p class="syncmsg ${syncMsg.cls}" role="status">${esc(syncMsg.text)}</p></section>`;
}

let dl = null;
function statusOf(x) { return x.ok ? "Đúng" : x.blank ? "Bỏ trống" : "Sai"; }
function lettersOf(i, origs) { return origs.map(o => LETTERS[S.perm[i].indexOf(o)]).sort().join(", "); }
function exportName(R, ext) { return `ccar-f-de${setId}-ket-qua-${R.scaled}d-${new Date(S.endedAt).toLocaleDateString("sv")}.${ext}`; }
function csvCell(v) {

}
function buildCsv(R) {
