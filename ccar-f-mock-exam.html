<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đề thi thử CCAR-F</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: course player. Navy band on every view, white cards on a pale page, question outline as the side panel. Deliberately one light theme, like learning platforms. */
:root {
  color-scheme: light;
  --bg: #f4f6fa; --sheet: #ffffff; --sunken: #eef1f6; --ink: #1a2233; --muted: #4b5669; --line: #dde2ea; --line2: #b4bdcb;
  --head: #14233d; --head-ink: #ffffff; --head-muted: #c8d2e2; --head-line: #6f7f99; --head-hover: #24375a; --head-track: #33466a; --head-alert: #ffb4a8;
  --accent: #1557d0; --accent-ink: #ffffff; --accent-soft: #e9f0fd;
  --good: #11703f; --good-soft: #e2f5ea; --bad: #b3261e; --bad-soft: #fdeceb; --warn: #875100; --warn-soft: #fff1d6; --amber: #f2a93b;
  --elim: #f0f2f6;
  --display: "Lexend", "Segoe UI", Roboto, Arial, sans-serif;
  --sans: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 18px/1.6 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
code { font: 500 .84em var(--mono); background: var(--sunken); padding: .1em .36em; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero :focus-visible, .bar :focus-visible { outline-color: var(--head-ink); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 16px var(--sans); color: var(--muted); }

.btn { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 17px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #1048b0; border-color: #1048b0; color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.hero .btn, .bar .btn { background: transparent; border-color: var(--head-line); color: var(--head-ink); }
.hero .btn:hover, .bar .btn:hover { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }
.hero .btn.primary, .bar .btn.primary { background: var(--head-ink); border-color: var(--head-ink); color: var(--head); }
.hero .btn.primary:hover, .bar .btn.primary:hover { background: var(--accent-soft); color: var(--head); }
.hero .btn[aria-pressed="true"], .bar .btn[aria-pressed="true"] { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }

/* Navy band */
.hero { background: var(--head); color: var(--head-ink); }
.hero .wrap { padding-block: 40px 44px; display: grid; gap: 18px; }
.hero .eyebrow { color: var(--head-muted); }
.hero h1 { font-size: clamp(32px, 5vw, 46px); font-weight: 700; }
.hero .lead { max-width: 66ch; color: var(--head-muted); font-size: 19px; }
.herofacts { display: flex; flex-wrap: wrap; gap: 8px 32px; list-style: none; margin: 0; padding: 0; }
.herofacts b { font: 600 22px var(--display); margin-right: 6px; font-variant-numeric: tabular-nums; }
.herofacts li { color: var(--head-muted); }
.herofacts li b { color: var(--head-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .primary { padding: 11px 28px; font-size: 18px; }

.card, .cols > section, .sheetx { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.start { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cols > * { min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 17px; }
.tbl th, .tbl td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-weight: 400; }
.tbl tr:last-child th, .tbl tr:last-child td { border-bottom: 0; }
.tbl th { color: var(--muted); width: 38%; padding-right: 12px; }
.tbl .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.start h2, .cols h2 { font-size: 20px; margin-bottom: 10px; }
.note { background: var(--accent-soft); padding: 18px 22px; font-size: 17px; border-radius: 12px; }
.note ul { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }

.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.setcard { display: grid; gap: 4px; text-align: left; background: var(--sheet); color: var(--ink); border: 1px solid var(--line2); border-radius: 12px; padding: 14px 18px; }
.setcard:hover { border-color: var(--accent); }
.setcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.setcard b { font: 600 20px var(--display); }
.setstat { font-weight: 600; font-size: 16px; color: var(--muted); }
.setstat.pass { color: var(--good); } .setstat.fail { color: var(--bad); }
.setscen { font-size: 16px; color: var(--muted); }
.tblwrap { overflow-x: auto; }
.hist th, .hist td { width: auto; padding-right: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Exam */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-ink); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.bar .code { font: 600 18px var(--display); }
.bar .prog { color: var(--head-muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.bar .spacer { flex: 1; }
.bar .btn { padding: 6px 14px; font-size: 16px; }
.timer { font: 600 21px var(--display); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--head-alert); }
.pbar { height: 4px; background: var(--head-track); }
.pbar span { display: block; height: 100%; background: var(--amber); }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding-block: 24px 56px; align-items: start; }
.exam > * { min-width: 0; }
.scen { background: var(--accent-soft); padding: 16px 24px; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; font-size: 17px; }
.scen b { display: block; margin-bottom: 2px; font: 600 17px var(--display); }
.sheet { background: var(--sheet); padding: 22px 24px; border: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.qhead .btn { padding: 4px 12px; font-size: 16px; }
.stem { font-size: 20px; line-height: 1.5; font-weight: 600; max-width: 72ch; }
.instr { margin-top: 12px; font-size: 17px; font-weight: 600; color: var(--accent); }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 13px 16px; background: var(--sheet); border: 1px solid var(--line2); border-radius: 10px; cursor: pointer; }
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
.ltr { width: 30px; height: 30px; display: grid; place-items: center; border: 1.5px solid var(--line2); border-radius: 50%; font: 600 16px/1 var(--sans); background: var(--sheet); }
.opt.multi .ltr { border-radius: 7px; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.off { opacity: .6; cursor: not-allowed; }
.opt.off:hover { border-color: var(--line2); background: var(--sheet); }
.limit { margin-top: 10px; font-size: 16px; color: var(--warn); min-height: 24px; }
.navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.navrow .spacer { flex: 1; }

.map { position: sticky; top: 90px; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto; }
.map h2 { font-size: 18px; }
.map h3 { display: flex; justify-content: space-between; font: 600 16px var(--sans); margin-bottom: 6px; }
.map h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 7px; font: 500 15px var(--sans); padding: 0; }
.cell:hover { border-color: var(--accent); }
.cell.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.cur { outline: 2px solid var(--head); outline-offset: 1px; }
.cell.flag::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; background: var(--amber); border: 2px solid var(--sheet); border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .a { background: var(--accent); }
.legend .f { background: var(--amber); border-radius: 50%; }
.maptoggle { display: none; }

.veil { position: fixed; inset: 0; background: rgba(15, 25, 45, .55); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--sheet); max-width: 480px; width: 100%; padding: 26px; border-radius: 12px; display: grid; gap: 12px; }
.modal h2 { font-size: 22px; }
.modal .sub { color: var(--muted); }
.linklist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.linklist button { border: 1px solid var(--line2); background: none; color: var(--ink); border-radius: 6px; font-size: 15px; padding: 2px 9px; }

/* Result */
.result { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 36px; align-items: end; }
.score { font: 700 clamp(56px, 10vw, 84px)/1 var(--display); font-variant-numeric: tabular-nums; }
.score small { font-size: .28em; font-weight: 500; color: var(--head-muted); }
.tag { display: inline-block; padding: 3px 14px; border-radius: 999px; font: 700 16px var(--sans); }
.tag.pass, .mark.ok { background: var(--good-soft); color: var(--good); }
.tag.fail, .mark.no { background: var(--bad-soft); color: var(--bad); }
.verdict .facts { color: var(--head-muted); margin-top: 6px; }
.scale { position: relative; height: 40px; margin-top: 8px; grid-column: 1 / -1; }
.scale .track, .scale .fill { position: absolute; left: 0; top: 6px; height: 10px; border-radius: 5px; }
.scale .track { right: 0; background: var(--head-track); }
.scale .fill { background: var(--head-ink); }
.scale .tick { position: absolute; top: 0; width: 3px; height: 22px; background: var(--amber); }
.scale .lab { position: absolute; top: 23px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--head-muted); transform: translateX(-50%); }
.scale .lab.l { transform: none; } .scale .lab.r { transform: translateX(-100%); }
.rows { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 54px 60px; gap: 4px 10px; align-items: baseline; font-size: 17px; }
.row .pct, .row .frac { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .frac { color: var(--muted); font-weight: 400; }
.row .b { grid-column: 1 / -1; height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.row .b span { display: block; height: 100%; background: var(--bad); }
.row .b span.g { background: var(--good); } .row .b span.w { background: var(--amber); }
.result > section > h2 { font-size: 22px; margin-bottom: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 15px; font-size: 16px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: inherit; font-size: 16px; padding: 5px 10px; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 8px; max-width: 100%; }
.reviews { display: grid; gap: 14px; }
.rev { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: grid; gap: 12px; }
.rev .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; color: var(--muted); }
.mark { padding: 1px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.mark.blank { background: var(--warn-soft); color: var(--warn); }
.rev .stem { font-size: 19px; }
.ro { display: grid; gap: 6px; }
.ro div { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 12px; border: 1px solid transparent; border-radius: 8px; }
.ro .is { background: var(--good-soft); border-color: var(--good); }
.ro .is .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.ro .wrongpick { background: var(--bad-soft); border-color: var(--bad); }
.ro .wrongpick .ltr { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
.ro .why { font: 700 15px/1.9 var(--sans); white-space: nowrap; }
.ro .is .why { color: var(--good); } .ro .wrongpick .why { color: var(--bad); }
.exp { background: var(--sunken); padding: 14px 18px; border-radius: 8px; }
.exp::before { content: "Giải thích"; display: block; font: 600 16px var(--display); margin-bottom: 2px; }
.empty { color: var(--muted); padding: 16px 0; }

/* Options the hint rules out: grey and dashed, so they recede and the live options stand out */
.opt.elim { background: var(--elim); border-style: dashed; }
.opt.elim .ltr { background: var(--elim); }
.opt.elim.sel { background: var(--accent-soft); border-style: solid; }
.opt.elim.sel .ltr { background: var(--accent); }
.elim code { background: var(--line); }
.elimnote { grid-column: 2; font-size: 16px; line-height: 1.45; color: var(--muted); }
.ro .elim { background: var(--elim); border: 1px dashed var(--line2); }
.ro .wrongpick.elim { background: var(--bad-soft); border: 1px solid var(--bad); }
.ro .elimnote { grid-column: 2 / -1; }
.ro .wrongpick .elimnote { color: var(--bad); }
.opt.right:not(.sel) { background: var(--good-soft); border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.opt.right:not(.sel) .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.rightnote { grid-column: 2; font-size: 16px; line-height: 1.45; font-weight: 700; color: var(--good); }
.hintnote { background: var(--warn-soft); color: var(--warn); display: inline-block; padding: 3px 12px; border-radius: 6px; font-size: 16px; margin-top: 8px; font-weight: 600; }

.sheetx h2 { font-size: 22px; margin-bottom: 4px; }
.sheetx .sub { color: var(--muted); max-width: 72ch; margin-bottom: 18px; }
.egroup { margin-bottom: 20px; }
.egroup h3 { font-size: 17px; padding-bottom: 6px; border-bottom: 2px solid var(--line2); }
.erow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.5; }
.erow > * { min-width: 0; }
.erow .term { font-weight: 600; }
.erow .why { color: var(--muted); }
.ehead { font: 600 15px var(--sans); color: var(--muted); padding: 8px 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
details.sheetx > summary { cursor: pointer; font: 600 20px var(--display); }
details.sheetx[open] > summary { margin-bottom: 8px; }
.dlmsg { color: var(--muted); font-size: 16px; }
.sync .sub { color: var(--muted); max-width: 72ch; margin-bottom: 14px; }
.sync textarea { display: block; width: 100%; min-height: 84px; margin-top: 12px; padding: 10px 12px; font: 400 14px/1.4 var(--mono); color: var(--ink); background: var(--sunken); border: 1px solid var(--line2); border-radius: 8px; resize: vertical; word-break: break-all; }
.sync .syncmsg { margin-top: 10px; font-size: 16px; color: var(--muted); }
.sync .syncmsg.ok { color: var(--good); }
.sync .syncmsg.err { color: var(--bad); }

@media (max-width: 860px) {
  .erow { grid-template-columns: minmax(0, 1fr); }
  .ehead { display: none; }
  .bar .wrap { gap: 6px 8px; padding-block: 8px; }
  .bar .btn { padding: 3px 10px; font-size: 15px; }
  .bar .code { font-size: 16px; }
  .bar .prog { font-size: 15px; }
  .bar .timer { font-size: 18px; }
  .cols, .exam { grid-template-columns: minmax(0, 1fr); }
  .map { position: static; max-height: none; }
  .map:not(.open) { display: none; }
  .maptoggle { display: inline-block; }
  .cells { grid-template-columns: repeat(8, 1fr); }
  .sheet, .scen, .rev, .card, .cols > section, .sheetx { padding-inline: 16px; }
  .stem { font-size: 19px; }
  .opt { padding: 11px 12px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .ro div { grid-template-columns: 30px minmax(0, 1fr); }
  .ro .why { grid-column: 2; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .btn, .cell, .chip { transition: border-color .12s, background .12s, color .12s; } }

.flashwrap { display: grid; gap: 8px; }
.diffblock { margin: 8px 0 28px; }
.diffblock h2 { margin: 0 0 10px; font: 650 22px/1.3 var(--display); }
.difftable { width: 100%; }
.difftable th, .difftable td { text-align: left; vertical-align: top; padding: 12px 16px; }
.difftable th { color: var(--muted); font-weight: 600; }
.difftable th:last-child, .difftable td:last-child { width: 42%; }
.difftable td:last-child { font-weight: 600; }
.diffnote { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
.flashwrap .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 12px; }
.diffblock.diffhl { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 8px; background: var(--accent-soft); padding: 12px 14px; }
.rev .stem.hasdiff { cursor: pointer; }
.rev .stem.hasdiff:hover { color: var(--accent); }
.difflinks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0; }
.difflinks .lbl { color: var(--muted); font-size: 16px; font-weight: 600; }
button.diffjump { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 12px; font: 600 16px var(--sans); cursor: pointer; }
button.diffjump:hover { background: var(--accent); color: var(--accent-ink); }

@media (max-width: 860px) {
  .difftable th:last-child, .difftable td:last-child { width: auto; }
  .difftable, .difftable tbody, .difftable tr, .difftable th, .difftable td { display: block; }
  .difftable tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .difftable th { display: none; }
  .difftable td { padding: 4px 0; }
  .difftable td:last-child { font-weight: 650; color: var(--good); }
}
</style>

<div id="app"></div>

<script>
const SCENARIOS = {
  1: { name: "Customer Support Resolution Agent", ctx: "You are building a support agent with the Claude Agent SDK that handles returns, billing disputes, and account problems. It reaches backend systems through custom MCP tools: `get_customer`, `lookup_order`, `process_refund`, and `escalate_to_human`. The business target is at least 80% first-contact resolution without escalating cases the agent should have solved, and without keeping cases it should have handed over." },
  2: { name: "Multi-Agent Research System", ctx: "You are building a research system with the Claude Agent SDK. A coordinator delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one writes the report. The output is a comprehensive report in which every claim can be traced to a source." },
  3: { name: "Claude Code for Continuous Integration", ctx: "Your platform team is rolling Claude Code out across a monorepo. It runs in the CI/CD pipeline to review pull requests and generate tests, and developers use it interactively to prepare changes. Feedback must be actionable, and false positives must stay low enough that developers keep reading it." },
  4: { name: "Structured Data Extraction", ctx: "You are building a pipeline that extracts structured data from invoices, contracts, and supplier statements. Output is validated against JSON schemas before it reaches downstream finance systems. Document formats vary widely, accuracy requirements are high, and a small review team handles exceptions." },
  5: { name: "Code Generation with Claude Code", ctx: "Your engineering team uses Claude Code every day for code generation, refactoring, debugging, and documentation. You are standardizing how it is used across the team, including custom slash commands, `CLAUDE.md` configuration, and when to use plan mode instead of direct execution." },
  6: { name: "Developer Productivity with Claude", ctx: "You are building an internal developer tool with the Claude Agent SDK. The agent helps engineers explore unfamiliar codebases, understand legacy systems, generate boilerplate, and automate repetitive tasks. It uses the built-in tools (Read, Write, Bash, Grep, Glob) and connects to Model Context Protocol (MCP) servers." }
};
