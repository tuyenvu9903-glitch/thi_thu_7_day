     "A second generic tool, `fetch_url_v2`, so that the subagent has an alternative whenever the first one fails."],
  a:[0],
  e:"Thay tool chung bằng tool ràng buộc có kiểm tra đầu vào. Mô tả dài hơn chỉ là hướng dẫn và không ngăn được việc gọi URL bất kỳ." },
{ s:2,d:5,t:"5.3",multi:true,
  q:"The web search subagent fails on one topic because of a timeout, and another topic returns no matching documents. Which TWO statements about reporting these outcomes are correct?",
  o:["The timeout is an access failure and should include the query attempted, partial results, and possible alternatives.",
     "The no-match outcome is a valid empty result and should not be reported to the coordinator as a failure.",
     "Both should be reported as `search unavailable` so that the coordinator can apply a single recovery policy.",
     "Both should be reported as empty lists so that the synthesis subagent is not distracted by operational details.",
     "Either outcome should end the workflow, because a report with a gap cannot be considered to be trustworthy."],
  a:[0,1], x:{2:"generic",3:"fakeOk",4:"abort"},
  e:"Lỗi truy cập cần ngữ cảnh để khôi phục; kết quả rỗng hợp lệ là truy vấn thành công. Gộp chung hay giấu lỗi đều khiến coordinator quyết định sai." },
{ s:2,d:5,t:"5.3",
  q:"One regional database stays unavailable after retries, and the coordinator proceeds with the remaining sources. How should the final report handle this?",
  o:["Include coverage annotations showing which findings are well supported and which areas have gaps from unavailable sources.",
     "Present the findings as a complete analysis, because an unavailable source is an operational issue that readers do not need.",
     "Fill the regional section using the model's general knowledge so that the report keeps a consistent level of detail.",
     "Withhold the whole report until the database returns, because partial coverage is worse than having no report at all."],
  a:[0], x:{1:"fakeOk",2:"guess",3:"abort"},
  e:"Báo cáo cần ghi chú độ phủ để người đọc biết phần nào có khoảng trống. Giấu khoảng trống hoặc lấp bằng kiến thức chung làm mất độ tin cậy." },
{ s:2,d:5,t:"5.6",
  q:"Two credible studies give 34% and 41% for the same adoption rate, measured with different methods. The analysis subagent found both. What should happen?",
  o:["Keep both figures with their sources and method notes, annotated as a conflict for the coordinator to reconcile.",
     "Report the mean of 37.5%, noting that the figure combines the two studies so readers get a single estimate.",
     "Report the figure from the journal with the highest reputation, and place the other in a footnote without its method.",
     "Retry the search until a third study is found that agrees with one of them, then report that as the true value."],
  a:[0], x:{1:"average",2:"pickOne",3:"retryMore"},
  e:"Không tự chọn hoặc lấy trung bình số liệu mâu thuẫn; giữ cả hai kèm nguồn và phương pháp, ghi rõ xung đột." },
{ s:2,d:5,t:"5.1",
  q:"The coordinator receives long subagent outputs in sequence, and its final plan repeatedly omits findings from the middle of the aggregated input. What restructuring best mitigates this?",
  o:["Place a key findings summary at the beginning, and organize the detailed results under explicit section headers.",
     "Add an instruction asking the coordinator to read the aggregated input closely and to give every part equal weight.",
     "Reverse the order of the subagent outputs so that a different set of findings appears at the end of the input.",
     "Merge the outputs into one continuous block of prose so the model reads them as a single unified document."],
  a:[0], x:{1:"vague"},
  e:"Hiệu ứng lost in the middle giảm được bằng cách đặt tóm tắt chính ở đầu và chia section rõ ràng. Lời nhắc đọc kỹ không thay đổi vị trí thông tin." },
/* ===== Code Generation ===== */
{ s:5,d:3,t:"3.1",
  q:"A developer's root `CLAUDE.md` has grown to 900 lines covering testing, API design, and deployment. It is hard to maintain, and nobody knows which sections are current. Which change best improves its organization?",
  o:["Split it into focused files in `.claude/rules/`, such as `testing.md`, `api-conventions.md`, and `deployment.md`.",
     "Keep one file but add a table of contents so that readers and Claude can find sections more quickly.",
     "Move the 900 lines to `~/.claude/CLAUDE.md` so that the repository no longer carries that large file.",
     "Compress each section into shorter sentences so that the single file stays under a fixed size limit."],
  a:[0], x:{2:"userLevel"},
  e:"`.claude/rules/` cho phép chia hướng dẫn theo chủ đề thay vì một `CLAUDE.md` khổng lồ. Chuyển sang cấu hình user-level thì team không dùng chung được." },
{ s:5,d:3,t:"3.2",
  q:"A team skill called `/audit-deps` reads hundreds of files and prints a long report. After running it, developers find that their main session has lost room for its current task. Which frontmatter option addresses this?",
  o:["`context: fork`, which runs the skill in an isolated sub-agent context.",
     "`allowed-tools`, limiting the skill to the Read and Grep tools only.",
     "`argument-hint`, asking the developer which dependency to audit first.",
     "`paths`, limiting the skill to dependency manifests in the repository."],
  a:[0],
  e:"`context: fork` cô lập đầu ra dài của skill khỏi phiên chính. `allowed-tools` chỉ giới hạn tool chứ không tách ngữ cảnh." },
{ s:5,d:3,t:"3.2",
  q:"Your team uses the shared `/review-pr` skill, but you personally want a variant with a stricter checklist, without affecting anyone else. What should you do?",
  o:["Create a personal skill under a different name in `~/.claude/skills/`.",
     "Edit the shared skill and add a condition checking for your user name.",
     "Add your stricter checklist to the shared skill's `SKILL.md` as optional text.",
     "Create a skill with the same name in `.claude/skills/` on a personal branch."],
  a:[0],
  e:"Biến thể cá nhân nên đặt ở `~/.claude/skills/` với tên khác để không ảnh hưởng đồng đội." },
{ s:5,d:3,t:"3.2",multi:true,
  q:"The team must decide where to put two things: `every function needs a docstring`, and a rarely used 12-step data-backfill procedure. Which TWO decisions are correct?",
  o:["Put the docstring standard in `CLAUDE.md`, because it should be loaded and applied in all sessions.",
     "Package the backfill procedure as a skill, because it is a task-specific workflow invoked on demand.",
     "Put the backfill procedure in `CLAUDE.md`, so that it will be available if somebody needs it someday.",
     "Package the docstring standard as a skill, so that developers can invoke it only when writing functions.",
     "Put both of them in `~/.claude/CLAUDE.md`, because each engineer should own their working practices."],
  a:[0,1], x:{4:"userLevel"},
  e:"`CLAUDE.md` dành cho tiêu chuẩn luôn áp dụng, skill dành cho quy trình theo yêu cầu." },
{ s:5,d:3,t:"3.3",
  q:"`src/api/CLAUDE.md` holds API conventions. Now the same conventions must also apply to route files scattered through `packages/*/routes/`. What should you do?",
  o:["Move the conventions to a `.claude/rules/` file whose `paths` globs match all of those locations.",
     "Copy `src/api/CLAUDE.md` into each `packages/*/routes/` directory, and keep them in sync by hand.",
     "Move the conventions to the root `CLAUDE.md` so that all directories in the repository can see them.",
     "Create symbolic links for every directory, so that all of the copies point at one `CLAUDE.md` file."],
  a:[0], x:{1:"copyMd"},
  e:"Quy ước trải trên nhiều thư mục nên dùng rule với glob. `CLAUDE.md` theo thư mục phù hợp với phạm vi một thư mục." },
{ s:5,d:3,t:"3.4",
  q:"You need to split a monolith's billing logic into a separate service. Several boundaries are possible, and the wrong choice would be costly. After a design is agreed, implementation is straightforward. What is the best workflow?",
  o:["Use plan mode to investigate and agree on the design, then use direct execution to implement the plan.",
     "Use direct execution throughout, and rely on version control to undo any decisions that turn out badly.",
     "Use plan mode for the entire effort, including every file edit, so nothing happens without a fresh plan.",
     "Use an Explore subagent to make the boundary decision, then ask it to implement the change by itself."],
  a:[0],
  e:"Kết hợp plan mode cho điều tra/thiết kế và thực thi trực tiếp khi đã có kế hoạch. Thực thi ngay với quyết định kiến trúc dễ gây làm lại tốn kém." },
{ s:5,d:3,t:"3.4",
  q:"A bug report includes a stack trace pointing to one null dereference in `parseHeader`. The fix is a one-line guard, and existing tests cover the function. How should you proceed?",
  o:["Use direct execution, because the change is small, its scope is clear, and tests can verify it.",
     "Use plan mode, because any production bug deserves a written plan before code is modified.",
     "Spawn an Explore subagent to map the whole repository before touching the single function.",
     "Start a forked session so that the one-line guard can be compared against other approaches."],
  a:[0], x:{1:"planSmall"},
  e:"Thay đổi đơn giản, phạm vi rõ thì thực thi trực tiếp; plan mode ở đây chỉ thêm chi phí." },
{ s:5,d:3,t:"3.5",
  q:"You are adding caching to a service in an area of the stack that your team has not used before. You suspect that there are failure modes you have not considered. What should you do before implementation?",
  o:["Use the interview pattern and have Claude ask questions that surface considerations such as invalidation and failure modes.",
     "Give Claude a detailed specification based on your best guess, and correct anything that seems wrong after it is built.",
     "Ask Claude to implement three caching designs in parallel and then choose whichever one seems to perform the best.",
     "Enable extended thinking, and instruct Claude to implement the most robust design that it is able to come up with."],
  a:[0], x:{3:"vague"},
  e:"Interview pattern giúp phát hiện những vấn đề chưa nghĩ tới trước khi triển khai, đặc biệt ở lĩnh vực chưa quen." },
{ s:5,d:1,t:"1.7",
  q:"You return after a long weekend to a session that analyzed a service. Since then, a large refactor has moved most of the files, so its earlier tool results no longer describe the code. What is the most reliable way to continue?",
  o:["Start a new session and inject a structured summary of still-valid conclusions from the earlier work.",
     "Resume the session with `--resume`, and tell it to ignore anything that no longer looks correct.",
     "Use `fork_session` so that the outdated tool results are removed from the branch that is created.",
     "Resume the session and run `/compact`, which removes outdated tool results from the conversation."],
  a:[0], x:{1:"staleResume",2:"staleResume",3:"staleResume"},
  e:"Khi kết quả tool đã cũ phần lớn, phiên mới với tóm tắt có cấu trúc đáng tin hơn resume. Fork cũng thừa hưởng kết quả cũ." },
{ s:5,d:5,t:"5.4",multi:true,
  q:"A long investigation is approaching context limits, and it must also survive a crash of the coordinating process. Which TWO techniques are appropriate?",
  o:["Run `/compact` to reduce context usage once verbose discovery output has filled the session.",
     "Have each agent export structured state to a known location, with a manifest the coordinator loads on resume.",
     "Delete the older tool results from the conversation history manually after each major phase has finished.",
     "Rely on the coordinator restarting and re-exploring the codebase, because exploration is fast enough to repeat.",
     "Increase `max_tokens` on the coordinator, which raises the amount of history it is able to retain in context."],
  a:[0,1], x:{3:"redo",4:"big"},
  e:"`/compact` giảm mức dùng context; manifest trạng thái có cấu trúc giúp khôi phục sau crash." },
{ s:5,d:5,t:"5.4",
  q:"The main session needs to know whether anything still calls a deprecated payments client. A search would return thousands of lines. How should this be handled?",
  o:["Spawn a subagent to investigate that specific question and return a concise answer to the main session.",
     "Run the search in the main session, then ask Claude to forget the raw output once it has been read.",
     "Read every source file into the main session first, so that the question can be answered with certainty.",
     "Ask the main session to answer based on typical usage of payment clients in codebases of this kind."],
  a:[0], x:{2:"readAll",3:"guess"},
  e:"Subagent cô lập đầu ra dài dòng trong khi phiên chính giữ vai trò điều phối." },
{ s:5,d:1,t:"1.6",multi:true,
  q:"Your team maintains a list of Claude Code jobs and wants to standardize how each is broken down. Which TWO jobs are the best fit for a fixed sequential prompt chain?",
  o:["Generating reference documentation for each module, followed by a pass that builds a single index page.",
     "Reviewing each changed file for local defects, followed by one integration pass over cross-file behavior.",
     "Tracking down an intermittent memory leak whose cause and affected components are still entirely unknown.",
     "Adding meaningful tests to an undocumented legacy service where risk areas have not yet been identified.",
     "Investigating why deploys slow down on some days, where each finding determines what to examine next."],
  a:[0,1], x:{2:"fixedOpen",3:"fixedOpen",4:"fixedOpen"},
  e:"Prompt chaining phù hợp với các bước biết trước. Điều tra nguyên nhân chưa rõ cần phân rã động vì mỗi phát hiện thay đổi việc cần làm tiếp." },
{ s:5,d:1,t:"1.7",
  q:"On Friday you investigated a flaky checkout test in a session you named `checkout-flake`. Nothing in that part of the code has changed since. On Monday you want to continue exactly where you left off. What should you do?",
  o:["Run Claude Code with `--resume checkout-flake` to continue that specific conversation.",
     "Start a new session and ask Claude to recall what you investigated on Friday afternoon.",
     "Create a new branch from Friday's session with `fork_session` before asking any question.",
     "Open a new session and re-run the entire investigation so its findings are fully current."],
  a:[0], x:{3:"redo"},
  e:"`--resume <tên phiên>` tiếp tục đúng cuộc hội thoại đã đặt tên khi context vẫn còn hợp lệ. Không cần fork vì chỉ có một hướng làm việc." },
{ s:5,d:2,t:"2.5",
  q:"A legacy module `api/client.ts` re-exports `send` under the aliases `post` and `dispatch`, and other wrappers rename them again. You need to find every real caller before changing its signature. What is the most reliable approach?",
  o:["Identify all exported names across the wrapper modules first, then Grep the codebase for each of those names.",
     "Grep only for `send`, because every alias eventually resolves to that function when the code is finally compiled.",
     "Use Glob on `**/*client*`, because any file that calls the function will contain the word `client` in its path.",
     "Read each source file in the repository from the top so that no call site can escape the investigation."],
  a:[0], x:{3:"readAll"},
  e:"Lần theo wrapper cần xác định mọi tên được export, rồi tìm từng tên bằng Grep. Glob chỉ khớp đường dẫn, không tìm được nội dung." },
{ s:5,d:2,t:"2.5",multi:true,
  q:"You ask Claude Code to explain how refunds flow through an unfamiliar repository of 4,000 files. Which TWO steps reflect the recommended way of building understanding?",
  o:["Start with Grep to locate entry points, such as the refund handler and related error messages.",
     "Use Read to follow the imports from those entry points and trace the flow through the code.",
     "Use Read to load all 4,000 files at the start, so that nothing relevant is left out of context.",
     "Use Glob to search within file contents for references to the words `refund` and `chargeback`.",
     "Use Write to add logging statements across the repository so that the flow can be inferred later."],
  a:[0,1], x:{2:"readAll"},
  e:"Xây dựng hiểu biết tăng dần: Grep tìm điểm vào, Read lần theo import. Đọc toàn bộ file làm cạn context; Glob không tìm theo nội dung." },
/* ===== Claude Code for CI ===== */
{ s:3,d:3,t:"3.6",
  q:"The review job runs Claude Code and stalls until the runner's timeout because it is waiting for a confirmation. What is the first change to make?",
  o:["Invoke Claude Code with `-p` so that it runs non-interactively in the pipeline.",
     "Invoke Claude Code with `--resume` so that it can continue the earlier session.",
     "Increase the CI job timeout so that the confirmation has time to be answered.",
     "Add a `CLAUDE.md` instruction telling Claude not to ask for any confirmation."],
  a:[0], x:{3:"prompt"},
  e:"`-p` (`--print`) là cờ để chạy không tương tác trong pipeline." },
{ s:3,d:3,t:"3.6",
  q:"You need review findings posted automatically as inline pull request comments, with a file, line, severity, and message for each finding. How should the output be produced?",
  o:["Use `--output-format json` with `--json-schema` that defines the fields in each finding.",
     "Ask for a Markdown table and parse its rows in the CI script using regular expressions.",
     "Ask for one finding per line in a fixed text format and split each line on its colons.",
     "Capture the terminal transcript and have a second Claude call convert it to comments."],
  a:[0], x:{1:"regexMd",2:"regexMd"},
  e:"`--output-format json` kết hợp `--json-schema` tạo đầu ra có cấu trúc để máy xử lý ổn định." },
{ s:3,d:3,t:"3.6",
  q:"After new commits are pushed, the review job re-runs and reposts many of the same comments. How should you fix this?",
  o:["Include prior findings in context and instruct Claude to report only new or still-unaddressed issues.",
     "Delete all of Claude's earlier comments on the pull request before each new review is posted.",
     "Review only the most recent commit, since earlier commits have already been reviewed by the job.",
     "Skip posting any finding whose text exactly matches one that was posted in an earlier review."],
  a:[0], x:{1:"delComments",2:"latestCommit",3:"delComments"},
  e:"Đưa phát hiện trước đó vào context và yêu cầu chỉ báo vấn đề mới hoặc chưa xử lý. Chỉ xem commit cuối có thể bỏ sót tương tác giữa các thay đổi." },
{ s:3,d:3,t:"3.6",multi:true,
  q:"Generated tests in CI are often low value and duplicate existing coverage. Which TWO changes will improve them?",
  o:["Provide the existing test files in context so that generation avoids scenarios that are already covered.",
     "Document testing standards, what makes a test valuable, and available fixtures in `CLAUDE.md`.",
     "Ask for twice as many tests per change, then have developers delete those that are not useful.",
     "Set a fixed quota of tests per pull request so that output remains a manageable length to read.",
     "Lower the temperature for test generation so that the model produces fewer unusual test cases."],
  a:[0,1], x:{4:"temp"},
  e:"Cung cấp test hiện có và tiêu chuẩn test trong `CLAUDE.md` giúp tăng chất lượng và tránh trùng lặp." },
{ s:3,d:4,t:"4.1",
  q:"Your review prompt says `check that comments are accurate`, and developers dismiss most of the comment-related findings as nitpicks. Which instruction is better?",
  o:["Flag a comment only when the behavior it claims contradicts what the code actually does.",
     "Report only those comment problems that you are highly confident developers will care about.",
     "Be conservative about comments, and prefer leaving out any finding that seems to be minor.",
     "Check comments for accuracy, clarity, grammar, and completeness, and rate each one out of ten."],
  a:[0], x:{1:"vague",2:"vague"},
  e:"Tiêu chí cụ thể tốt hơn lời dặn chung như thận trọng hoặc chỉ báo khi chắc chắn." },
{ s:3,d:4,t:"4.2",
  q:"The reviewer flags safe uses of a project-specific `unsafeCast` helper as bugs, but also needs to catch truly unsafe casts in new forms it has not seen. Which approach best handles both?",
  o:["Provide a few examples contrasting acceptable patterns with genuine issues, including the reasoning for each.",
     "Add a rule that says to never flag `unsafeCast`, because this helper has been reviewed by the team.",
     "List every known unsafe pattern in the prompt, and instruct Claude to flag only exact matches of them.",
     "Tell Claude to use its best judgment on casting and to give developers the benefit of the doubt."],
  a:[0], x:{3:"vague"},
  e:"Few-shot đối chiếu mẫu chấp nhận được và lỗi thật giúp model khái quát sang tình huống mới, giảm báo sai." },
{ s:3,d:4,t:"4.5",
  q:"The team wants to cut review costs. It runs pre-merge checks that block developers and a separate nightly security audit of the whole repository. Which API approach fits each one?",
  o:["Synchronous API for the pre-merge checks, and the Message Batches API for the nightly audit.",
     "Message Batches API for both, because it provides a 50% discount on each processed request.",
     "Synchronous API for both, because batch processing cannot be used for code-related workloads.",
     "Message Batches API for pre-merge checks, and the synchronous API for the nightly audit."],
  a:[0], x:{1:"batchMisuse",3:"batchMisuse"},
  e:"Việc chặn merge cần phản hồi nhanh nên dùng API đồng bộ; audit qua đêm chịu được độ trễ nên dùng Batch API." },
{ s:3,d:4,t:"4.5",
  q:"A team plans to use the Message Batches API for an agent that reads files with tools during its analysis. Why will this design not work as described?",
  o:["A batch request cannot execute tools mid-request and return results for multi-turn tool calling.",
     "Batch requests do not allow any system prompt, so the agent would lose its project instructions.",
     "Batch requests are limited to documents under one page, which is too small for most source files.",
     "Batch requests do not support JSON schemas, so the agent's tool definitions would simply be ignored."],
  a:[0],
  e:"Batch API không hỗ trợ gọi tool nhiều lượt trong một request vì không thể chạy tool giữa chừng rồi trả kết quả." },
{ s:3,d:4,t:"4.6",
  q:"A review of a 45-file pull request produces shallow comments, and one file's pattern is flagged while the identical pattern is passed in another. What is the best fix?",
  o:["Run focused per-file passes for local issues, plus a separate integration pass for cross-file data flow.",
     "Use a model with a larger context window so that all 45 files can be considered in a single pass.",
     "Add an instruction asking Claude to apply the same standard across all files and to be thorough.",
     "Review only the ten largest files in depth, on the assumption that they contain most of the risk."],
  a:[0], x:{1:"big",2:"vague"},
  e:"Sự pha loãng chú ý được xử lý bằng các lượt review từng file cộng một lượt tích hợp giữa các file." },
{ s:3,d:4,t:"4.6",multi:true,
  q:"You are designing a review architecture for AI-generated code. Which TWO choices are supported by sound practice?",
  o:["Use an independent review instance that does not have the generator's reasoning context.",
     "Run a verification pass that reports confidence with each finding, to help route findings for review.",
     "Ask the generating session to review its own changes, since it best understands its reasoning.",
     "Rely on extended thinking in the generating session in place of a separate review instance.",
     "Merge the review and generation prompts into one request so that defects are fixed before output."],
  a:[0,1], x:{2:"selfReview",3:"selfReview"},
  e:"Instance review độc lập và lượt xác minh kèm confidence để định tuyến là các phương pháp phù hợp. Tự review trong cùng phiên kém hiệu quả." },
{ s:3,d:4,t:"4.4",
  q:"Developers dismiss about 40% of findings, and you want to discover which code constructs cause false positives. What should you add?",
  o:["A `detected_pattern` field in each structured finding, so dismissals can be analyzed by construct.",
     "A free-text `notes` field that asks Claude to explain its overall thoughts about the pull request.",
     "A longer system prompt that tells Claude that many of its previous findings have been dismissed.",
     "A daily report of the total number of dismissed findings, broken down by the repository's team."],
  a:[0], x:{1:"freeText"},
  e:"Trường `detected_pattern` cho phép phân tích có hệ thống mẫu mã nào bị bỏ qua." },
{ s:3,d:1,t:"1.6",
  q:"Your review job always performs the same three steps: per-file correctness, per-file security, then a cross-file data-flow pass. A teammate proposes replacing this with a planner that decides for each pull request what to examine. The release team requires comparable results from run to run. What should you do?",
  o:["Keep the prompt chain, because the aspects are predictable and each step's result can be compared between runs.",
     "Adopt the planner, because letting the model choose steps always improves the depth of an automated code review.",
     "Adopt the planner but cap it at three steps, which keeps the result comparable with the current fixed sequence.",
     "Merge the three steps into a single prompt, since one combined pass is the most repeatable way to review code."],
  a:[0], x:{1:"adaptiveFixed",3:"oneTask"},
  e:"Review nhiều khía cạnh có thể dự đoán thì dùng prompt chaining. Planner thích ứng phù hợp với việc điều tra mở, không phù hợp yêu cầu so sánh được giữa các lần chạy." },
{ s:3,d:1,t:"1.5",multi:true,
  q:"The CI agent runs shell commands through a tool. It must never execute `git push --force`, and the raw output of three linters, each in a different format, should reach the model in one consistent shape. Which TWO mechanisms should you use?",
  o:["A hook that intercepts outgoing tool calls and blocks any force-push command before it can run.",
     "A `PostToolUse` hook that normalizes each linter's output before the model processes the result.",
     "A `PostToolUse` hook that detects force pushes and reports them to the repository's maintainers.",
     "A `CLAUDE.md` rule that forbids force pushes, written at the very top of the configuration file.",
     "A system prompt section that explains the output format of each linter and how to interpret it."],
  a:[0,1], x:{2:"postBlock",3:"prompt"},
  e:"Chặn lệnh cấm phải xảy ra trước khi tool chạy; chuẩn hóa kết quả dùng `PostToolUse`. `PostToolUse` không thể ngăn hành động đã thực hiện, còn `CLAUDE.md` chỉ là hướng dẫn." },
{ s:3,d:2,t:"2.1",
  q:"Your CI MCP server has `get_coverage` and `get_coverage_diff`, both described as `Returns coverage information`. When asked whether a pull request reduced coverage, the agent often fetches whole-repository totals and draws the wrong conclusion. What is the best first fix?",
  o:["Describe what each tool returns, its inputs, and when to prefer it, explicitly distinguishing repository totals from pull request changes.",
     "Add a routing step before the agent that classifies each coverage question and then calls one of the two tools directly.",
     "Set `tool_choice` to force `get_coverage_diff` on every request, because pull request reviews are the main use of this agent.",
     "Remove `get_coverage` from the server entirely, on the assumption that repository totals are not needed for reviewing pull requests."],
  a:[0], x:{1:"router",2:"forceAll"},
  e:"Mô tả tool là cơ chế chính để chọn tool; hai mô tả gần như giống nhau gây chọn nhầm. Cách sửa đầu tiên là làm rõ khác biệt." },
{ s:3,d:2,t:"2.4",
  q:"You added a `search_code_index` MCP tool that returns semantic matches with ownership data, but during reviews the agent keeps using the built-in Grep. The MCP tool's description says only `Searches code`. What should you change?",
  o:["Expand the MCP tool's description to explain its capabilities and outputs, so the agent can see when it beats Grep.",
     "Remove Grep from the agent, which guarantees that all searches now pass through the semantic index you have built.",
     "Add `search_code_index` to the personal `~/.claude.json` of each engineer so that it has priority over built-in tools.",
     "List the MCP server first in `.mcp.json`, because the first configured server takes priority during tool selection."],
  a:[0], x:{1:"disable",2:"userLevel",3:"toolOrder"},
  e:"Mô tả chi tiết năng lực và đầu ra của MCP tool giúp agent không mặc định chọn tool có sẵn. Tắt Grep không phải cách đúng vì nó vẫn hữu ích." },
/* ===== Data Extraction ===== */
{ s:4,d:4,t:"4.3",
  q:"Your extraction flow must always run `extract_metadata` before any enrichment tools are available. How should the first request be configured?",
  o:["Set `tool_choice` to `{\"type\": \"tool\", \"name\": \"extract_metadata\"}`, and handle enrichment in follow-up turns.",
     "Set `tool_choice` to `any`, and tell the model in the prompt to begin with the metadata tool.",
     "Set `tool_choice` to `auto`, and list the metadata tool first among the available tools.",
     "Remove the enrichment tools from the schema, and ask the model to do enrichment in its text."],
  a:[0], x:{1:"anyPick",2:"autoForce"},
  e:"Forced tool selection đảm bảo một tool cụ thể chạy trước; các bước sau xử lý ở lượt tiếp theo." },
{ s:4,d:4,t:"4.3",
  q:"A contract classifier needs a `clause_type` field. Most clauses fit known types, but some are genuinely unclear and new types do appear. Which schema is best?",
  o:["An enum of known types plus `unclear` and `other`, with a detail string used for `other`.",
     "A free-text string, so that the model can describe each clause in whichever way suits it.",
     "An enum of the known types only, so that the output always maps to existing categories.",
     "A required array of every clause type with a probability assigned to each of the types."],
  a:[0], x:{1:"freeText",2:"guess"},
  e:"Enum kèm `unclear`, `other` và trường chi tiết cân bằng giữa cấu trúc và khả năng mở rộng." },
{ s:4,d:4,t:"4.4",
  q:"Your retry logic resends the document and says only `your last answer was invalid, please try again`. Success on retry is low, even for simple format errors. What should you change?",
  o:["Include the original document, the failed extraction, and the specific validation errors in the follow-up.",
     "Increase the number of retries from two to five so that more attempts have a chance to succeed.",
     "Switch to a larger model for retries, because it is better at inferring what went wrong by itself.",
     "Add a stronger warning to the follow-up, saying that an invalid answer is not going to be accepted."],
  a:[0], x:{1:"retryMore",2:"big",3:"loud"},
  e:"Retry hiệu quả cần tài liệu gốc, bản lỗi và lỗi cụ thể để model tự sửa." },
{ s:4,d:4,t:"4.4",
  q:"A contract's `renewal_price` is defined only as `see Schedule B`, and Schedule B is not part of the file. Validation requires a number. What is the correct handling?",
  o:["Return null or route to human review, since a retry cannot supply information absent from the source.",
     "Retry with an instruction to search the contract more carefully until the renewal price has been found.",
     "Estimate the price from the initial contract price, and mark the value as approximate for later review.",
     "Fill in zero so that the record passes validation and continues on to the downstream finance systems."],
  a:[0], x:{1:"searchMore",2:"guess",3:"fakeOk"},
  e:"Thông tin nằm ở tài liệu không được cung cấp thì retry vô ích, cần trả null hoặc chuyển người duyệt." },
{ s:4,d:4,t:"4.5",
  q:"Before running a batch of 200,000 contracts, you are unsure if the prompt handles all formats. What is the most cost-effective step?",
  o:["Refine the prompt on a representative sample first, to improve first-pass success before the full batch.",
     "Submit the full batch at once, because the batch discount makes any resubmission inexpensive overall.",
     "Run the full set synchronously first so that errors surface sooner, then compare it to the batch output.",
     "Split the batch into two equal halves and use a different untested prompt on each of them to compare."],
  a:[0], x:{1:"redo"},
  e:"Tinh chỉnh prompt trên mẫu trước khi chạy khối lượng lớn giúp giảm chi phí gửi lại." },
{ s:4,d:5,t:"5.5",
  q:"Reviewers can examine only 10% of extractions, and the team wants to direct them where they are most needed. Which routing is best?",
  o:["Prioritize low-confidence fields, using thresholds calibrated on labeled data, and contradictory documents.",
     "Choose the 10% entirely at random, so that reviewers see an unbiased sample of the whole workload.",
     "Prioritize documents from the largest suppliers, on the assumption that these carry the most risk.",
     "Prioritize documents where the model's explanation is the longest, as this signals its uncertainty."],
  a:[0],
  e:"Định tuyến người duyệt theo độ tin cậy cấp trường đã hiệu chỉnh và tài liệu mâu thuẫn để dùng tốt năng lực có hạn." },
{ s:4,d:5,t:"5.5",multi:true,
  q:"A dashboard shows 98% accuracy, but handwritten delivery notes are often wrong and are only 3% of volume. Which TWO actions should you take?",
  o:["Report accuracy broken down by document type and field, instead of relying on the aggregate figure.",
     "Keep human review for handwritten delivery notes until their segment-level accuracy meets the target.",
     "Remove the review queue, because 98% overall accuracy exceeds what the business has asked for.",
     "Exclude handwritten notes from the dashboard so that the reported accuracy is more representative.",
     "Accept self-reported confidence on handwritten notes, because the model knows when it is uncertain."],
  a:[0,1], x:{2:"aggregate",4:"confidence"},
  e:"Accuracy tổng có thể che giấu phân khúc kém; cần đo theo loại tài liệu và trường rồi giữ duyệt ở phân khúc yếu." },
{ s:4,d:5,t:"5.6",
  q:"A summarization step compresses extracted facts about supplier obligations, and reviewers can no longer tell which contract clause supports each statement. What should you require?",
  o:["Structured claim-source mappings, with document names and excerpts preserved through summarization.",
     "A general note at the end of the summary saying that it was generated from the supplier contracts.",
     "A higher `max_tokens` value on the summarization step, so that it has the room to keep more details.",
     "A second summarization pass asking the model to recall where each of the statements originated."],
  a:[0], x:{2:"big",3:"guess"},
  e:"Giữ ánh xạ nhận định - nguồn có cấu trúc qua bước tóm tắt. Bảo model nhớ lại nguồn sau khi đã nén thì dễ bịa." },
{ s:4,d:2,t:"2.2",
  q:"A subagent's `read_vault` tool returned `isError` true for a document because it exceeded the vault's rate limit. What information makes this error most useful to the agent?",
  o:["A transient category, a retryable flag set to true, and a description of what occurred.",
     "A permission category and a retryable flag set to false, so that no further calls are made.",
     "A generic message of `Operation failed`, with the complete stack trace for debugging purposes.",
     "A successful response with an empty document, marked with an internal warning in the logs."],
  a:[0], x:{2:"generic",3:"fakeOk"},
  e:"Giới hạn tốc độ là lỗi tạm thời có thể thử lại; metadata có cấu trúc cho agent biết cách xử lý." },
{ s:4,d:2,t:"2.4",
  q:"The extraction team wants a shared Jira integration so that low-confidence documents become review tickets. A maintained community Jira MCP server covers this. What is the best choice?",
  o:["Use the community server, and reserve custom servers for workflows specific to the team.",
     "Build a custom server, because a team should always own all of the code that its agents call.",
     "Have the agent construct raw HTTP calls to Jira through Bash, in order to avoid an MCP dependency.",
     "Disable the built-in tools so that the agent is compelled to use the Jira integration consistently."],
  a:[0], x:{3:"disable"},
  e:"Với tích hợp chuẩn nên chọn MCP server cộng đồng có sẵn, chỉ viết tùy chỉnh cho quy trình đặc thù." },
{ s:4,d:2,t:"2.1",
  q:"A generic `analyze_document` tool extracts data, summarizes, or checks claims depending on a mode argument, and the agent often picks the wrong mode. What is the recommended redesign?",
  o:["Split it into purpose-specific tools such as `extract_data_points`, `summarize_content`, and `verify_claim_against_source`.",
     "Add more accepted values for the mode argument, so that each user intent has its own closely matching label.",
     "Keep the one tool and put a long table of all the modes in the system prompt for the agent to consult.",
     "Rename the tool to `document_helper` so that the name does not imply any specific analysis to the agent."],
  a:[0],
  e:"Tách tool chung thành các tool có mục đích và hợp đồng đầu vào/đầu ra rõ ràng." },
{ s:4,d:2,t:"2.3",
  q:"The extraction agent must return a tool call and never a conversational reply, but it must choose among three schemas based on the document. Which setting and why?",
  o:["`tool_choice: any`, because it requires a tool call while leaving the choice of tool to the model.",
     "`tool_choice: auto`, because it is the only setting under which the model can compare the schemas.",
     "A forced tool, because forcing is the only way of ensuring that the model calls any tool at all.",
     "No `tool_choice`, because a prompt asking for tool use is equivalent to a configured requirement."],
  a:[0], x:{1:"autoForce",3:"prompt"},
  e:"`any` buộc phải gọi tool nhưng cho phép model chọn tool phù hợp với tài liệu." },
{ s:4,d:1,t:"1.4",multi:true,
  q:"When extraction finds an unresolved conflict, the case goes to an exception reviewer who cannot see the agent's conversation or tool history. Which THREE items belong in the handoff?",
  o:["The document identifier and the specific field that could not be resolved.",
     "The conflicting values, together with where each value appears in the source.",
     "The agent's recommended action or the decision needed from the reviewer.",
     "The complete raw transcript of the agent's turns, so that nothing is summarized.",
     "A paragraph apologizing to the reviewer for the additional manual workload.",
     "A sentiment rating of the supplier's tone as it appears in the source document."],
  a:[0,1,2], x:{3:"transcript",5:"sentiment"},
  e:"Bàn giao phải tự đủ thông tin vì người duyệt không thấy transcript: tài liệu và trường, giá trị mâu thuẫn kèm vị trí, đề xuất hành động." },
{ s:4,d:1,t:"1.5",
  q:"Two MCP tools return supplier amounts in different formats, `1.234,56` and `1,234.56`, and the validation agent occasionally misreads them by a factor of a thousand. The formats cannot be changed at the source. What should you add?",
  o:["A `PostToolUse` hook that converts amounts to one canonical format before the model reads each result.",
     "A `PreToolUse` hook that inspects the tool name and asks the model to pay attention to locale differences.",
     "An instruction in the system prompt describing both number formats, together with several worked examples.",
     "A second agent that reads the first agent's answer and then corrects any amount that looks too large."],
  a:[0], x:{2:"prompt"},
  e:"`PostToolUse` chuẩn hóa dữ liệu một cách xác định trước khi model xử lý, đáng tin hơn hướng dẫn trong prompt." },
{ s:4,d:2,t:"2.2",multi:true,
  q:"`submit_to_ledger` rejects an invoice because the supplier is on a compliance hold. The agent currently waits and retries with backoff until the job times out. Which TWO changes are correct?",
  o:["Return a business error category with a not-retryable flag and a readable explanation of the hold.",
     "Have the agent respond by taking an alternative path, such as sending the invoice to the exception queue.",
     "Return a transient error so the agent's existing backoff loop keeps trying until the hold has been lifted.",
     "Return success with no ledger entry so that the batch job can complete without reporting any exceptions.",
     "Increase the backoff intervals so that the retries put less load on the ledger during the compliance hold."],
  a:[0,1], x:{2:"retryPolicy",3:"fakeOk",4:"retryPolicy"},
  e:"Lỗi nghiệp vụ không nên retry. Không thử lại không có nghĩa bỏ cuộc mà là chuyển sang đường xử lý khác, như hàng đợi ngoại lệ." }
]});

SETS.push({ id: 4, Q: [
/* ===== Developer Productivity (D1×3, D2×6, D3×5, D5×1) ===== */
{ s:6,d:1,t:"1.1",
  q:"Your codebase-explainer agent sometimes stops after a response such as `Next I will read the router module,` with a text block and no tool request, and `stop_reason` is `end_turn`. Engineers then receive an unfinished explanation. Your loop handles `stop_reason` correctly. What is the most appropriate response?",
  o:["Treat this as a prompt or task-definition problem, since the loop correctly ended when the model finished its turn.",
     "Change the loop so that any text describing a future action is treated as a signal to continue the iteration.",
     "Add a fixed minimum of ten iterations before the loop will accept `end_turn` as a legitimate stopping condition.",
     "Append a new user message saying `continue` each time a response ends without a tool call from the model."],
  a:[0], x:{1:"parseText",2:"iterCap"},
  e:"Vòng lặp đã đúng khi dừng ở `end_turn`. Nếu model kết thúc quá sớm, cần sửa nhiệm vụ hoặc prompt, không được dò chữ trong text hay đặt số vòng tối thiểu." },
{ s:6,d:1,t:"1.3",
  q:"A migration assistant uses a coordinator and an `api-mapper` subagent. The subagent needs the list of deprecated endpoints that the coordinator found earlier, but it re-discovers them each time and sometimes finds fewer. Its `AgentDefinition` has a good description and restricted tools. What should you change?",
  o:["Include the deprecated endpoint list explicitly in the prompt the coordinator gives when spawning the subagent.",
     "Set `fork_session` on the subagent's definition so that it can read the coordinator's previous tool results.",
     "Expand the subagent's description so that the coordinator understands it depends on the deprecated endpoint list.",
     "Add Grep and Glob to the subagent's tool restrictions so that it can complete its rediscovery more reliably."],
  a:[0], x:{1:"inherit"},
  e:"Subagent không thừa hưởng ngữ cảnh; dữ liệu phải được đưa rõ vào prompt khi tạo. Mô tả chỉ giúp coordinator chọn subagent chứ không truyền dữ liệu." },
{ s:6,d:1,t:"1.2",
  q:"Your agent answers `how does authentication work here?` using one subagent for code and one for docs. Both answers are individually accurate, but the combined answer describes only the web flow; the CLI and service-to-service flows are missing. Which change addresses the root cause?",
  o:["Have the coordinator identify the distinct authentication flows first and assign each one explicitly before delegating.",
     "Give both of the subagents larger context budgets so that each can read deeper into the authentication modules.",
     "Strengthen the synthesis instructions so that the final answer includes every flow that exists in the system.",
     "Run the two subagents a second time and merge the outputs so that any flow missed in one pass gets included."],
  a:[0], x:{1:"big",2:"vague",3:"runTwice"},
  e:"Thiếu phạm vi chứ không thiếu chiều sâu thì nguyên nhân là phân rã ở coordinator. Phần tổng hợp không thể đưa vào thông tin chưa từng được thu thập." },
{ s:6,d:2,t:"2.1",
  q:"The system prompt tells the agent to `check the docs for any question about configuration.` Your tools include a well-described `read_config_schema` tool and a `search_docs` tool. When asked which config keys are valid, the agent searches the docs and gets outdated answers. What should you do first?",
  o:["Revise the keyword-driven system prompt instruction so it no longer steers configuration questions toward `search_docs`.",
     "Delete `search_docs` from the tool list so that `read_config_schema` is the only tool the agent can call for these.",
     "Add several additional sentences to the description of `read_config_schema` and repeat the word configuration in them.",
     "Force `read_config_schema` through `tool_choice` on every request to ensure that outdated documentation is avoided."],
  a:[0], x:{1:"disable",2:"loud",3:"forceAll"},
  e:"Mô tả tool đã tốt nên cần xem system prompt: chỉ dẫn nhạy từ khóa đang lấn át. Xóa tool hay ép tool trên mọi request gây tác dụng phụ cho các câu hỏi khác." },
{ s:6,d:2,t:"2.2",
  q:"A `create_branch` MCP tool fails because the branch name contains a space. The tool returns `isError` true and a validation category, with `isRetryable` false. The agent then gives up and tells the engineer the task is impossible. What is the correct interpretation?",
  o:["Not retryable means not repeating the same call; the agent should correct the input and make a new call.",
     "The tool should mark validation errors as retryable so that the agent resends the same request once more.",
     "The tool should return a transient category so that the agent's standard retry handling can deal with it.",
     "The agent behaved correctly, because any error marked not retryable should end the current user task."],
  a:[0], x:{1:"sameRetry",2:"retryPolicy"},
  e:"`isRetryable: false` có nghĩa là không gửi lại y nguyên, không phải bỏ cuộc. Lỗi validation cần sửa đầu vào rồi gọi lại." },
{ s:6,d:2,t:"2.3",
  q:"A code-generation subagent has Read, Write, Bash, Grep, Glob, and twelve MCP tools for ticketing, chat, and deployment. It sometimes posts to chat when it should only be writing files. It legitimately needs to read one ticket's acceptance criteria now and then. What is the best tool setup?",
  o:["Restrict it to file tools plus a narrow `get_ticket_criteria` tool, leaving other integrations to the coordinator.",
     "Keep all of the tools, and add a system prompt rule that forbids chat messages unless a user explicitly asks.",
     "Remove all of the MCP tools, and require the engineer to paste the acceptance criteria into every request.",
     "Keep all of the tools but sort them by category so that file tools are presented first in the definition list."],
  a:[0], x:{1:"prompt",3:"toolOrder"},
  e:"Giới hạn tool theo vai trò và cung cấp tool hẹp cho nhu cầu thường gặp. Quy tắc trong prompt không loại bỏ được rủi ro dùng sai tool." },
{ s:6,d:2,t:"2.4",multi:true,
  q:"Your agent connects to three MCP servers: a project server in `.mcp.json`, a team documentation server, and a personal server in `~/.claude.json`. Which TWO statements about this setup are correct?",
  o:["Tools from all of the configured servers are discovered at connection time and available to the agent simultaneously.",
     "The project server can reference secrets through environment variable expansion instead of including them in the file.",
     "Only the project-level server's tools are available in any session that is started inside the project's directory.",
     "The agent receives tools from one server at a time and must switch servers in order to call another server's tools.",
     "The personal server's tools are shared with teammates once the repository has been cloned onto their machines."],
  a:[0,1], x:{4:"userLevel"},
  e:"Tool từ mọi MCP server được phát hiện khi kết nối và dùng đồng thời. `.mcp.json` hỗ trợ mở rộng biến môi trường; `~/.claude.json` là cấu hình cá nhân." },
{ s:6,d:2,t:"2.4",
  q:"Your agent spends its first ten calls listing wiki spaces and pages before it can answer anything about internal architecture. The wiki's page hierarchy changes slowly. Which MCP design best addresses the wasted calls?",
  o:["Expose the documentation hierarchy as an MCP resource so that the agent can see what exists without exploratory calls.",
     "Add a `list_everything` tool and force it through `tool_choice` on the first request of every single conversation.",
     "Embed the entire text of the wiki in the system prompt so that exploration is no longer required for any question.",
     "Instruct the agent in the system prompt to limit itself to five exploratory calls before it attempts to answer."],
  a:[0], x:{1:"forceAll"},
  e:"MCP resources phơi bày danh mục nội dung để agent biết có gì mà không cần gọi tool dò đường." },
{ s:6,d:2,t:"2.5",multi:true,
  q:"The agent must locate every `*.spec.ts` file, find which of them mention `legacyAuth`, and update a repeated setup block that appears several times in one file. Which TWO statements describe correct tool use?",
  o:["Glob finds the spec files by path pattern, and Grep then locates `legacyAuth` in their contents.",
     "If Edit cannot match unique anchor text, use Read for the full file and Write for the updated version.",
     "Grep finds the spec files by path pattern, and Glob then locates `legacyAuth` in their contents.",
     "Edit can change every occurrence of a non-unique anchor without any additional context being provided.",
     "Bash is required to locate the files, because built-in tools cannot search across multiple directories."],
  a:[0,1],
  e:"Glob khớp đường dẫn, Grep tìm nội dung. Edit dựa vào đoạn neo duy nhất; khi không duy nhất thì dùng Read + Write." },
{ s:6,d:3,t:"3.1",
  q:"Both the repository's root `CLAUDE.md` and an engineer's `~/.claude/CLAUDE.md` give instructions about test frameworks, and they disagree. The engineer assumes that the personal file overrides the project file. Claude Code's behavior varies. What is the best action?",
  o:["Remove the conflict by keeping one consistent instruction, then use `/memory` to confirm which files are loaded.",
     "Keep both files, and add the word `IMPORTANT` to the instruction that the engineer wants Claude to follow.",
     "Move the root instruction to a directory-level `CLAUDE.md`, because a deeper file always overrides any other.",
     "Keep both files, and tell Claude at the start of each session which one of the instructions it should follow."],
  a:[0], x:{1:"loud"},
  e:"Các file bộ nhớ được nạp cùng nhau nên hướng dẫn mâu thuẫn dễ cho kết quả không ổn định. Hãy loại bỏ xung đột rồi kiểm tra bằng `/memory`." },
{ s:6,d:3,t:"3.2",multi:true,
  q:"You are creating a `/explore-alternatives` skill that brainstorms designs and generates long, speculative discussion. It should not edit any files. Which TWO frontmatter settings best fit these requirements?",
  o:["`context: fork`, to keep the exploratory output out of the main conversation.",
     "`allowed-tools`, set to read-only tools so that the skill cannot modify files.",
     "`argument-hint`, listing the files the skill is forbidden from being able to edit.",
     "`paths`, restricting the skill so it can only ever be invoked inside design folders.",
     "`user-invocable: false`, ensuring that the skill's output cannot reach the main session."],
  a:[0,1], x:{2:"prompt"},
  e:"`context: fork` cô lập đầu ra khám phá; `allowed-tools` giới hạn tool khi skill chạy. `argument-hint` chỉ nhắc tham số." },
{ s:6,d:3,t:"3.3",
  q:"Database migration files live in several services at `services/*/db/migrations/*.sql`. You want their conventions to appear only when those files are being edited and without maintaining several copies. Which frontmatter is appropriate in a `.claude/rules/` file?",
  o:["`paths: [\"services/*/db/migrations/*.sql\"]`",
     "`context: [\"services/*/db/migrations/*.sql\"]`",
     "`allowed-tools: [\"services/*/db/migrations/*.sql\"]`",
     "`argument-hint: \"services/*/db/migrations/*.sql\"`"],
  a:[0],
  e:"Trường `paths` với glob trong frontmatter của `.claude/rules/` điều khiển việc nạp có điều kiện." },
{ s:6,d:3,t:"3.4",
  q:"An engineer asks the productivity agent to `move our job queue from Redis to SQS`. About 40 files use the queue, retry behavior differs between the two systems, and there are several rollout options. Which approach best suits this request?",
  o:["Start in plan mode to examine usage and rollout choices, then execute the agreed plan directly.",
     "Start with direct execution on the first file, and let the design emerge from each change made.",
     "Skip planning, and generate all 40 changes in a single pass that is then reviewed by the team.",
     "Fork a session for every affected file, so that each of the changes can be made independently."],
  a:[0], x:{2:"oneTask"},
  e:"Di chuyển hạ tầng nhiều file, nhiều lựa chọn: lập kế hoạch trước, thực thi sau khi đã thống nhất." },
{ s:6,d:3,t:"3.5",
  q:"You are generating a pagination helper with Claude Code. Two attempts passed your eyeball check but failed in production for empty pages and very large offsets. How should you iterate from here?",
  o:["Write tests for expected behavior, edge cases, and limits first, then iterate by sharing the test failures.",
     "Ask Claude to reconsider the helper carefully and confirm that it is correct for all possible inputs.",
     "Regenerate the helper with a different model and select whichever version appears to be the simplest.",
     "Describe the production failure in general terms and ask Claude to make the helper more robust overall."],
  a:[0], x:{1:"vague",3:"vague"},
  e:"Lặp theo test: viết test bao phủ trường hợp biên trước, rồi chia sẻ lỗi test để Claude cải thiện dần." },
{ s:6,d:5,t:"5.4",
  q:"An exploration agent has crashed twice during long runs, each time losing hours of findings from its subagents. How should the system be designed to resume reliably?",
  o:["Each agent exports structured state to a known location, and the coordinator loads a manifest and injects it on resume.",
     "The coordinator stores every raw tool result in its own conversation so that nothing exists outside of its history.",
     "The whole run restarts automatically after a crash, with a stronger prompt telling agents to work more efficiently.",
     "Each subagent writes prose notes to the terminal log, and an engineer pastes relevant parts into a new session."],
  a:[0], x:{2:"redo"},
  e:"Xuất trạng thái có cấu trúc ra vị trí biết trước và dùng manifest khi resume là mẫu thiết kế để khôi phục sau crash." },
/* ===== Multi-Agent Research (D1×5, D2×2, D4×4, D5×4) ===== */
{ s:2,d:1,t:"1.2",
  q:"Users complain that a report on `the economics of remote work` omitted housing markets and urban tax effects. Logs show the coordinator created three subtasks, all on employee productivity, and each subagent completed its subtask well. A teammate suggests improving the synthesis prompt. What is the better diagnosis?",
  o:["The coordinator's decomposition was too narrow, so it should break the topic into a broader set of subtopics.",
     "The synthesis prompt is the cause, because a strong synthesizer should notice and fill any topic that is missing.",
     "The search subagent's depth is the cause, because it should have followed links to related economic topics by itself.",
     "The iteration limit is the cause, because each subagent would have reached those subtopics if given more turns."],
  a:[0], x:{1:"guess",3:"iterCap"},
  e:"Thiếu độ phủ khi từng subagent đã làm tốt là lỗi phân rã của coordinator. Synthesis chỉ làm việc với những gì đã nhận được." },
{ s:2,d:1,t:"1.2",
  q:"An engineer proposes that the synthesis subagent ask the search subagent directly for more data whenever it detects a gap, which would remove a round trip through the coordinator. What is the strongest argument against this?",
  o:["It bypasses the coordinator's visibility, error handling, and control over how information and budget are routed.",
     "It would require the synthesis subagent to know how to use a different model from the one assigned to search.",
     "It would make the two subagents run in parallel, which the coordinator pattern does not technically support.",
     "It would prevent either of the subagents from returning structured output back to the coordinator at the end."],
  a:[0],
  e:"Giao tiếp phải đi qua coordinator để quan sát được, xử lý lỗi nhất quán và kiểm soát luồng thông tin." },
{ s:2,d:1,t:"1.3",multi:true,
  q:"You are writing the prompt that the coordinator gives to the document-analysis subagent. Which TWO elements should it include?",
  o:["The specific research goal and the quality criteria that a complete analysis must satisfy.",
     "The relevant documents or prior findings, given directly in the prompt with their metadata.",
     "A numbered list of exact tool calls that the subagent must make, in the required order.",
     "A reference to `the earlier discussion`, trusting the subagent to retrieve it from memory.",
     "The coordinator's entire conversation, so that the subagent has every possible instruction."],
  a:[0,1], x:{2:"stepProc",3:"inherit",4:"transcript"},
  e:"Prompt cho subagent nên có mục tiêu, tiêu chí chất lượng và dữ liệu cần thiết. Thủ tục cứng làm giảm khả năng thích ứng; tham chiếu mơ hồ thì subagent không có dữ liệu." },
{ s:2,d:1,t:"1.3",
  q:"Each subagent type in your system has its own tools and instructions, but the coordinator frequently chooses the document-analysis subagent for web research tasks. Which part of the `AgentDefinition` should you improve first?",
  o:["The description, because the coordinator relies on it when deciding which subagent to invoke.",
     "The tool restrictions, because adding web tools to it would make the mistaken choice harmless.",
     "The system prompt, because it is what the coordinator reads when it chooses among subagents.",
     "The name, because the coordinator picks subagents primarily by alphabetical order of their names."],
  a:[0], x:{1:"overTool"},
  e:"Coordinator dựa vào description để chọn subagent. System prompt của subagent là hướng dẫn cho chính nó sau khi đã được gọi." },
{ s:2,d:1,t:"1.6",
  q:"The team must choose a design for investigating `why did our market share fall in Q3?`, where early findings may redirect the work toward pricing, channel problems, or competitors. Which design is most appropriate?",
  o:["An adaptive plan in which the coordinator generates new subtasks based on what each step discovers.",
     "A fixed chain of pricing analysis, then channel analysis, then competitor analysis, for every question.",
     "A single subagent given all available tools and told to work until it is confident about the answer.",
     "Parallel subagents for every conceivable cause, each one run to completion before any review occurs."],
  a:[0], x:{1:"fixedOpen",2:"vague"},
  e:"Việc mở với phát hiện làm thay đổi hướng đi cần phân rã động. Chuỗi cố định không phản ứng được với các phát hiện giữa chừng." },
{ s:2,d:2,t:"2.2",
  q:"A subagent's `fetch_paper` tool returned a 503 three times despite local retries. The coordinator could obtain the paper from a preprint server instead. What should the subagent's error report contain for the coordinator to make that decision?",
  o:["The failure type, the attempts made, any partial results, and that a preprint source might be an alternative.",
     "A concise status of `paper unavailable`, because the coordinator should not concern itself with subagent details.",
     "An empty result set marked successful, because the coordinator will simply notice that no findings were returned.",
     "The full HTTP response bodies of all three attempts, which give the coordinator all the debugging data it needs."],
  a:[0], x:{1:"generic",2:"fakeOk"},
  e:"Ngữ cảnh lỗi có cấu trúc gồm loại lỗi, đã thử gì, kết quả một phần, phương án thay thế giúp coordinator khôi phục thông minh." },
{ s:2,d:2,t:"2.3",
  q:"The report-writer subagent has only a `save_report` tool, but when `tool_choice` is `auto` it sometimes returns the report as plain text and the pipeline finds nothing saved. Which configuration ensures it always saves?",
  o:["Set `tool_choice` to `any` or force `save_report`, because `auto` allows the model to reply with text.",
     "Keep `tool_choice` as `auto`, and add a sentence saying that it must always save the report.",
     "Remove the tool and parse the report text from the assistant's reply using a regular expression.",
     "Keep `tool_choice` as `auto`, and add a retry whenever the assistant replies with plain text."],
  a:[0], x:{1:"autoForce",2:"regexMd",3:"sameRetry"},
  e:"`auto` cho phép trả text thay vì gọi tool. `any` hoặc forced tool đảm bảo có tool call." },
{ s:2,d:4,t:"4.2",
  q:"Subagents disagree on how to handle sources that mention a statistic only in a chart caption or a methods appendix, so some are extracted and others are ignored. Written rules have not resolved this. What should you add?",
  o:["Two to four examples of such ambiguous sources, including the reasoning for how each should be handled.",
     "A rule saying to extract statistics wherever they occur, with an emphasis on being as careful as possible.",
     "A separate subagent for captions and another for appendices, each one running with an identical prompt.",
     "A step that discards statistics not found in the body text so that the behavior becomes fully consistent."],
  a:[0], x:{1:"vague"},
  e:"Few-shot minh họa cách xử lý trường hợp mơ hồ kèm lý do giúp model khái quát và nhất quán hơn." },
{ s:2,d:4,t:"4.3",multi:true,
  q:"Findings use a JSON schema with `claim`, `source_url`, `publication_date`, and `study_type`. Some sources lack a clear date, and some study types are new. Which TWO schema decisions are best?",
  o:["Make `publication_date` nullable so that a missing date is not fabricated to satisfy the schema.",
     "Include `other` plus a detail string in `study_type`, so that new kinds of study can be represented.",
     "Keep `publication_date` required, and tell the subagent to estimate when no date can be found.",
     "Make `study_type` free text, because the schema should not restrict how the model categorizes work.",
     "Omit `source_url` when the schema becomes too large, because prose can carry the source information."],
  a:[0,1], x:{2:"requiredMissing",3:"freeText"},
  e:"Trường có thể vắng nên nullable; enum có `other` kèm chi tiết để mở rộng. Bắt buộc trường không có sẽ dẫn tới bịa dữ liệu." },
{ s:2,d:4,t:"4.4",
  q:"A subagent's structured output passes the schema, but one finding lists a `publication_date` later than the report date. Retrying with `please try again` often returns the same value. What is the correct next step?",
  o:["Run a semantic check, then retry with the source, the failed output, and the specific date problem.",
     "Tighten the JSON schema so that it rejects dates that fall after the current report's run date.",
     "Remove the `publication_date` field from the schema, so that invalid dates can no longer appear.",
     "Increase the number of unchanged retries, because a different sample will eventually be returned."],
  a:[0], x:{2:"dropValidation",3:"sameRetry"},
  e:"Schema không bắt được lỗi ngữ nghĩa như ngày không hợp lý. Cần kiểm tra logic riêng rồi retry kèm lỗi cụ thể." },
{ s:2,d:4,t:"4.6",
  q:"The synthesis subagent drafts a report, and its own session then checks the draft for unsupported claims. Unsupported claims still get through. What change is most likely to help?",
  o:["Have a separate verification instance check claims against sources, without the drafter's reasoning context.",
     "Add a final instruction to the drafting session saying that it must be especially skeptical about its work.",
     "Give the drafting session a larger token budget so that it has more room to double-check its own claims.",
     "Ask the drafting session to output a confidence score, and publish every claim rated above a fixed value."],
  a:[0], x:{1:"selfReview",2:"big",3:"confidence"},
  e:"Instance độc lập không có ngữ cảnh lập luận của người soạn sẽ dễ phát hiện lỗi hơn tự kiểm tra." },
{ s:2,d:5,t:"5.1",
  q:"The synthesis subagent has a limited context budget, but search subagents send back long narratives containing their reasoning and every page they opened. What is the most effective change?",
  o:["Require search subagents to return structured key facts, citations, and relevance scores instead.",
     "Ask the synthesis subagent to prioritize the first and last paragraphs of each returned narrative.",
     "Increase the number of synthesis subagents and give each one a random portion of the narratives.",
     "Tell the search subagents to keep their reports short, without changing any other part of the format."],
  a:[0], x:{3:"vague"},
  e:"Sửa từ phía trên: trả dữ liệu có cấu trúc thay vì văn bản dài khi phía sau có ngân sách context hạn chế." },
{ s:2,d:5,t:"5.3",
  q:"A single news API has been failing all morning. The report currently fails entirely whenever its subagent reports an error, although other sources are working normally. Which design is best?",
  o:["Continue with available sources and let the coordinator annotate the report with the news coverage gap.",
     "Hide the failure from the coordinator so that the rest of the report is generated without interruption.",
     "Keep the current behavior, because any partial report would be misleading for every possible reader.",
     "Retry the news API continuously until it recovers, however long that takes for the current report."],
  a:[0], x:{1:"fakeOk",2:"abort",3:"retryMore"},
  e:"Một lỗi không nên kết thúc cả workflow, cũng không nên bị giấu. Dùng kết quả có sẵn và ghi rõ khoảng trống." },
{ s:2,d:5,t:"5.6",multi:true,
  q:"Findings on smartphone penetration include 62% from a 2019 survey and 78% from a 2024 survey. Which TWO requirements best prevent misinterpretation in the final report?",
  o:["Require the subagents to output publication or collection dates alongside each statistic.",
     "Require the synthesis step to preserve claim-source mappings when it combines the findings.",
     "Require the synthesis step to report only one figure per topic for the sake of readability.",
     "Require the analysis subagent to average different surveys that measure the same quantity.",
     "Require the report to remove dates, because readers mainly care about the broad conclusion."],
  a:[0,1], x:{2:"pickOne",3:"average"},
  e:"Dữ liệu ngày tháng tránh hiểu nhầm chênh lệch thời gian thành mâu thuẫn; ánh xạ nhận định - nguồn giữ khả năng truy vết." },
{ s:2,d:5,t:"5.6",
  q:"A report combines quarterly financial data, recent news, and technical findings. Currently, everything is rendered as uniform paragraphs, and readers struggle with the financial sections. What should the synthesis output do?",
  o:["Render each content type appropriately, such as financial data as tables and news as prose.",
     "Convert everything into bullet points, because a uniform format is always easier for readers.",
     "Remove the financial data, since prose cannot reliably convey numerical information accurately.",
     "Place all three kinds of content in one long table so that the entire report has one structure."],
  a:[0],
  e:"Hiển thị từng loại nội dung cho phù hợp thay vì ép về một định dạng đồng nhất." },
/* ===== Claude Code for CI (D3×7, D4×8) ===== */
{ s:3,d:3,t:"3.6",
  q:"A CI script runs `claude -p \"review this diff\" --output-format json` and passes the result to a comment poster. The output is valid JSON, but the review's findings have a different shape on each run and the poster fails. What should be added?",
  o:["`--json-schema` defining the required structure of the findings that the poster expects.",
     "`--resume` so that each run reuses the shape produced by the previous successful review.",
     "A sentence in `CLAUDE.md` asking Claude to keep the shape of its output the same each time.",
     "A regular expression that normalizes the fields in the free-form JSON before it is posted."],
  a:[0], x:{1:"staleResume",2:"prompt",3:"regexMd"},
  e:"`--output-format json` chỉ định định dạng; `--json-schema` mới ràng buộc cấu trúc nội dung." },
{ s:3,d:3,t:"3.6",multi:true,
  q:"You are hardening a pipeline in which Claude Code generates code and then reviews the pull request. Which THREE practices should the pipeline follow?",
  o:["Run the review in an independent instance instead of the session that generated the change.",
     "Run Claude Code with `-p` so that automated jobs do not wait on interactive input.",
     "Provide review criteria and testing standards through the repository's `CLAUDE.md`.",
     "Put the review criteria in the CI bot's `~/.claude/CLAUDE.md` so it is not in version control.",
     "Continue the generating session for review so that the reviewer has full knowledge of the intent.",
     "Have the generation job approve its own changes when every generated test passes in the job."],
  a:[0,1,2], x:{3:"userLevel",4:"selfReview",5:"selfReview"},
  e:"CI cần `-p`, ngữ cảnh dự án qua `CLAUDE.md` và instance review độc lập. Tự review cùng phiên làm giảm khả năng phát hiện lỗi." },
{ s:3,d:3,t:"3.6",
  q:"A re-review after a force-push reports issues that have already been fixed, and leaves out one that was reported before and still remains. The job receives only the current diff. What should you include in its context?",
  o:["The prior findings, with an instruction to report only those issues that are new or still unaddressed.",
     "The list of the commit hashes in the pull request, so that Claude knows the range that has changed.",
     "Only the files changed by the latest push, so that the review stays focused on the most recent work.",
     "A cached copy of the previous session that is resumed so the reviewer remembers its previous comments."],
  a:[0], x:{2:"latestCommit",3:"staleResume"},
  e:"Đưa phát hiện trước vào context để chỉ báo vấn đề mới hoặc còn tồn tại." },
{ s:3,d:3,t:"3.1",
  q:"CI reviews ignore the project's testing standards, but interactive sessions on developer laptops follow them. The standards are in each developer's `~/.claude/CLAUDE.md`. Why does this happen, and what is the fix?",
  o:["The CI environment has no user-level file, so move the standards into project-level `CLAUDE.md`.",
     "CI ignores all memory files, so the standards should be added to every CI job's command line.",
     "`-p` mode disables user-level files only, so remove `-p` from the job so that they are read.",
     "The CI runner needs the `/memory` command in its job script to load the standards file."],
  a:[0], x:{1:"copyMd"},
  e:"Hướng dẫn user-level không có trên CI và không được chia sẻ. Đưa vào cấp project để CI nhận được." },
{ s:3,d:3,t:"3.2",
  q:"A `/review-security` skill should accept a directory argument. When it is invoked without one, engineers should see what they are expected to provide. Which frontmatter option supports this?",
  o:["`argument-hint`, which prompts for the required parameter.",
     "`allowed-tools`, which lists the directories to be reviewed.",
     "`context: fork`, which requests arguments in the sub-agent.",
     "`paths`, which turns the first glob into a required argument."],
  a:[0], x:{2:"forkTools"},
  e:"`argument-hint` nhắc người dùng tham số cần cung cấp khi gọi skill." },
{ s:3,d:3,t:"3.3",
  q:"Review guidance for infrastructure code should only load when Claude Code touches Terraform files, and CI reviews handle many pull requests with no Terraform changes. Why is a path-scoped rule preferable to adding the guidance to the root `CLAUDE.md`?",
  o:["It loads only when matching files are in play, reducing irrelevant context and token usage.",
     "It takes precedence over everything else, so the guidance overrides any conflicting instruction.",
     "It runs as a separate agent, so the guidance cannot interfere with the code review prompt.",
     "It makes the guidance mandatory, so that violations of it are blocked before they are committed."],
  a:[0], x:{3:"prompt"},
  e:"Rule theo đường dẫn nạp khi sửa file khớp, giúp giảm context không liên quan. Rule vẫn là hướng dẫn chứ không phải cơ chế chặn." },
{ s:3,d:3,t:"3.5",
  q:"The test-generation job mishandles nulls in a data migration. Your prose prompt says to `handle null values properly`, and results still differ between runs. What is the most effective refinement?",
  o:["Provide specific test cases with example inputs and expected outputs for null handling.",
     "Rewrite the instruction to say `handle all null values correctly in every possible case`.",
     "Run the generation job three times and keep the version with the longest test file.",
     "Add `think hard about nulls` to the prompt and then raise the output token limit."],
  a:[0], x:{1:"vague",2:"runTwice",3:"big"},
  e:"Ví dụ đầu vào/đầu ra cụ thể hiệu quả hơn mô tả chung khi xử lý trường hợp biên." },
{ s:3,d:4,t:"4.1",
  q:"To reduce noise, a team adds `only report findings you are at least 90% confident about` to its review prompt. False positives barely change, and some real bugs vanish. Why, and what should be done instead?",
  o:["Confidence wording does not define what counts; specify categories to report and skip with concrete triggers.",
     "The threshold is too low; change it to 99% so that only those findings that are nearly certain get reported.",
     "The prompt is too short; add a paragraph explaining how much developers dislike receiving false positives.",
     "The model is too small; use a larger model, because it will be better calibrated at the 90% threshold."],
  a:[0], x:{1:"vague",2:"loud",3:"big"},
  e:"Lời dặn dựa trên mức tự tin không cải thiện độ chính xác; tiêu chí theo loại vấn đề mới có tác dụng." },
{ s:3,d:4,t:"4.1",
  q:"Your reviewer finds real bugs, but its `style` findings are wrong so often that developers have stopped reading any comments. Which is the best immediate action?",
  o:["Disable the style category for now, keep the bug categories running, and improve style criteria separately.",
     "Collapse all comments into a single summary so that developers need to read only one review comment.",
     "Limit reviews to the first ten findings so that the volume of comments developers see is manageable.",
     "Keep all categories, and add a sentence at the top of each review asking developers to read carefully."],
  a:[0], x:{2:"limitN"},
  e:"Tạm tắt nhóm nhiều báo sai để khôi phục niềm tin, đồng thời cải thiện tiêu chí cho nhóm đó." },
{ s:3,d:4,t:"4.2",
  q:"The test-gap reviewer reliably reports untested files but misses untested branches inside tested functions. You have already described branch coverage in the prompt. What technique best helps with these ambiguous cases?",
  o:["Few-shot examples that show branch-level gaps, explaining why each one qualifies as a gap.",
     "A stronger instruction that insists on complete coverage of every line in the changed code.",
     "A rule requiring at least five gaps per pull request so the reviewer looks harder for them.",
     "A second review pass using the same prompt, with its results appended to those from the first."],
  a:[0], x:{1:"loud",3:"runTwice"},
  e:"Few-shot đặc biệt hữu ích cho trường hợp mơ hồ như thiếu test nhánh." },
{ s:3,d:4,t:"4.3",multi:true,
  q:"A teammate is choosing `tool_choice` for a findings classifier that has several `record_*` tools and is also asked what strict schemas guarantee. Which TWO statements are accurate?",
  o:["`any` requires the model to call a tool, while still allowing it to choose which tool to call.",
     "A strict schema removes JSON syntax errors, but it does not ensure that the values are semantically right.",
     "`auto` guarantees a tool call whenever at least one tool has been defined in the API request.",
     "A strict schema also ensures that line items add up and that values are placed in the right fields.",
     "Forcing a named tool lets the model decline that tool when it believes that another would fit better."],
  a:[0,1], x:{2:"autoForce"},
  e:"`any` buộc gọi một tool và model tự chọn; strict schema loại lỗi cú pháp nhưng không loại lỗi ngữ nghĩa." },
{ s:3,d:4,t:"4.4",
  q:"A new rule produces many dismissed findings across dozens of repositories, and nobody can tell which code patterns are responsible. What is the most useful data to add to structured findings?",
  o:["A `detected_pattern` field identifying the code construct that triggered each finding.",
     "A `confidence` number for each finding, so that low values can be hidden from developers.",
     "A `model_version` field, so that dismissal rates can be compared across different releases.",
     "A `sentiment` field that records how strongly worded each finding appears to the reader."],
  a:[0], x:{1:"confidence",3:"sentiment"},
  e:"`detected_pattern` cho phép phân tích hệ thống những mẫu nào gây báo sai." },
{ s:3,d:4,t:"4.5",
  q:"Nightly test generation must be finished by 9:00 each morning. The Message Batches API has no latency SLA within its window of up to 24 hours. The team submits at midnight. What is the risk, and what is the correct conclusion?",
  o:["A batch may take up to 24 hours, so a midnight batch cannot guarantee a 9:00 result.",
     "There is no risk, because batches usually finish in less than one hour on most nights.",
     "There is no risk, because the 50% discount includes a priority completion within 12 hours.",
     "A batch may take up to 12 hours, so submitting at 21:00 guarantees it is finished by 9:00."],
  a:[0], x:{1:"batchMisuse"},
  e:"Batch API có thể mất tới 24 giờ và không có SLA độ trễ, nên phải tính theo khoảng thời gian tối đa." },
{ s:3,d:4,t:"4.6",
  q:"A large pull request is reviewed in a single pass. It reports a null risk in one file, then says the same code path is safe in the summary. Which approach best prevents such contradictory findings?",
  o:["Split the review into per-file local passes and a dedicated cross-file integration pass.",
     "Run the same single-pass review with extended thinking turned on across all of the files.",
     "Ask for a final pass in which Claude removes any finding that seems to conflict with another.",
     "Limit the review to the files with the most changed lines and skip the remaining files."],
  a:[0], x:{1:"big",2:"delComments"},
  e:"Tách review cục bộ theo file và lượt tích hợp giúp tránh loãng chú ý và phát hiện mâu thuẫn." },
{ s:3,d:4,t:"4.6",multi:true,
  q:"A code review system must catch subtle issues in generated code and use limited human attention wisely. Which TWO techniques best serve these goals?",
  o:["Run a second, independent Claude instance over the generated code without the generator's reasoning.",
     "Have a verification pass report confidence with each finding, so review can be routed accordingly.",
     "Have the generating instance add a closing statement asserting that it has reviewed its work.",
     "Have the generating instance repeat its own review until it stops reporting any new findings.",
     "Combine all review stages into one long prompt so that the full picture is available at once."],

{ s:1,d:1,t:"1.1",
  q:"The agent calls `lookup_order`, receives a shipment delay notice, and in the next iteration answers as if nothing had been looked up. Inspecting the request shows that your code appended the tool's output to a log but not to the messages. What is the fix?",
