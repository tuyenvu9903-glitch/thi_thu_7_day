  1: { name: "Agentic Architecture & Orchestration", weight: 27 },
  2: { name: "Tool Design & MCP Integration", weight: 18 },
  3: { name: "Claude Code Configuration & Workflows", weight: 20 },
  4: { name: "Prompt Engineering & Structured Output", weight: 20 },
  5: { name: "Context Management & Reliability", weight: 15 }
};

let QUESTIONS = [
/* ===== Scenario 1 ===== */
{ s:1,d:1,t:"1.1",
  q:"In production, about 7% of conversations end right after Claude says something like \"Let me pull up that order for you,\" and no lookup ever happens. Your loop ends the turn as soon as the response contains a text block. What is the correct fix?",
  o:["Continue the loop while `stop_reason` is `tool_use`, execute the requested tools, and end only when `stop_reason` is `end_turn`.",
     "Scan each text block for phrases that signal completion, and continue the loop whenever no such closing phrase is detected.",
     "Add a system prompt instruction telling Claude never to produce any explanatory text in the same response as a tool call.",
     "Remove the text check and always run the loop for a fixed 10 iterations, returning whatever the last response contained."],
  a:[0],
  e:"Vòng lặp phải dựa vào `stop_reason`: `tool_use` thì chạy tool và lặp tiếp, `end_turn` thì dừng. Claude có thể trả text cùng tool_use nên text không phải dấu hiệu hoàn thành. Dò cụm từ, cấm text bằng prompt, hoặc lặp số vòng cố định đều là anti-pattern guide nêu rõ." },
{ s:1,d:1,t:"1.1",
  q:"To reduce token usage, a developer changes the loop so each follow-up request contains only the original user message and the newest tool result. The agent now calls `get_customer` repeatedly and contradicts earlier answers. What should the team do?",
  o:["Send the complete history each iteration, including the assistant `tool_use` blocks and matching `tool_result` blocks.",
     "Keep the current request shape, and copy a running list of completed tool names into the system prompt on every turn.",
     "Keep the current request shape, and enable prompt caching so that the model retains its state between the API calls.",
     "Register a de-duplication layer that returns a cached response whenever the agent repeats a call to the same tool."],
  a:[0],
  e:"API không lưu trạng thái: mỗi request phải mang đủ lịch sử, gồm tool_use của assistant và tool_result tương ứng, để model suy luận tiếp. Prompt caching chỉ giảm chi phí xử lý prefix, không tạo bộ nhớ. Danh sách tên tool hay lớp de-dup chỉ che triệu chứng." },
{ s:1,d:1,t:"1.4",multi:1,
  q:"Compliance has given you a list of agent behaviors. Which TWO of these should be enforced programmatically instead of through system prompt instructions?",
  o:["Refunds above $500 must never execute automatically and must be redirected to the human escalation workflow.",
     "`process_refund` must be blocked until `get_customer` has returned a verified customer ID for the conversation.",
     "Replies should acknowledge the customer's frustration before explaining the next step in plain, friendly language.",
     "The agent should mention store credit as an alternative when the customer seems open to options besides a refund.",
     "Long policy explanations should be summarized in two or three sentences unless the customer asks for full detail."],
  a:[0,1],
  e:"Quy tắc tài chính và thứ tự bắt buộc cần bảo đảm tất định, nên dùng hook chặn tool call hoặc prerequisite gate; prompt luôn có tỷ lệ thất bại khác 0. Giọng văn, gợi ý store credit, độ dài trả lời là hành vi mềm, hợp với prompt và không gây hậu quả tuân thủ." },
{ s:1,d:1,t:"1.5",
  q:"`lookup_order` returns Unix timestamps, the shipping MCP server returns ISO 8601 strings, and the returns server uses numeric status codes. The agent sometimes miscalculates whether an order is still inside the 30-day return window. What is the most reliable fix?",
  o:["Add a `PostToolUse` hook that converts all timestamps and status codes to one format before the model sees the results.",
     "Add a conversion table for timestamps and status codes to the system prompt, with worked examples for each source format.",
     "Add a `convert_timestamp` tool and instruct the agent to call it before making any decision that depends on a date.",
     "Rewrite the three backend services so that each of them returns an identical schema from its existing API endpoints."],
  a:[0],
  e:"`PostToolUse` hook chuẩn hóa dữ liệu không đồng nhất một cách tất định trước khi model xử lý. Bảng quy đổi trong prompt vẫn phụ thuộc xác suất, thêm tool làm tăng số bước và vẫn có thể bị bỏ qua, còn viết lại ba backend là quá tay so với vấn đề." },
{ s:1,d:1,t:"1.4",
  q:"A customer writes: \"I was charged twice, my blender arrived cracked, and my address is wrong for next month's delivery.\" Logs show that the agent usually resolves the first concern and ends the conversation. Which approach best fits this kind of request?",
  o:["Split the message into distinct issues, investigate each using shared customer context, then give one unified resolution.",
     "Ask the customer to open a separate ticket per issue so that each conversation has exactly one concern to resolve.",
     "Resolve the first issue completely, then ask the customer to restate any remaining concerns in their following message.",
     "Route every message containing more than one concern to a human agent, because these cases are too complex to automate."],
  a:[0],
  e:"Guide nêu pattern tách yêu cầu nhiều vấn đề thành từng mục, điều tra (có thể song song) với context chung, rồi tổng hợp một phương án. Bắt khách mở nhiều ticket hoặc nhắc lại làm giảm first-contact resolution; nhiều vấn đề không đồng nghĩa phức tạp nên không cần escalate." },
{ s:1,d:1,t:"1.4",
  q:"Human agents report spending the first few minutes of each escalated case re-asking the customer for details. They work in a separate queue with no access to the conversation transcript. What change to the handoff has the highest impact?",
  o:["Require `escalate_to_human` to carry a structured summary with customer ID, root cause, amounts, and recommended action.",
     "Attach the raw conversation log, with every tool call and tool result, as JSON to the ticket created for the human queue.",
     "Have the agent tell customers which details to repeat for the human agent so that the conversation proceeds more quickly.",
     "Add a free-text `reason` parameter limited to 50 words and instruct the agent to describe the customer's mood and request."],
  a:[0],
  e:"Người nhận không thấy transcript nên cần bản tóm tắt có cấu trúc, đủ để hành động ngay. Log thô buộc họ tự đọc lại toàn bộ; bắt khách lặp lại là đúng vấn đề đang cần xóa; lý do tự do 50 từ thiếu các trường then chốt như số tiền và đề xuất xử lý." },
{ s:1,d:2,t:"2.1",
  q:"Both `get_customer` and `lookup_order` have detailed, well-differentiated descriptions, yet the agent still calls `get_customer` for simple order-status questions. The system prompt includes: \"Always review the account whenever an order is mentioned.\" What should you do first?",
  o:["Revise the system prompt instruction, because its keyword-style wording is overriding the tool descriptions.",
     "Expand both tool descriptions further with more example queries, edge cases, and accepted identifier formats.",
     "Set `tool_choice` to force `lookup_order` on any turn whose user message contains an order number.",
     "Merge the two tools into a single `lookup_entity` tool that decides internally which backend to query."],
  a:[0],
  e:"Mô tả tool đã tốt, nên nguyên nhân gốc là câu lệnh nhạy từ khóa trong system prompt tạo liên kết \"order → account\". Viết dài thêm mô tả không chạm vào nguyên nhân; ép tool_choice theo từ khóa cứng nhắc; gộp tool là thay đổi kiến trúc không cần thiết ở bước đầu." },
{ s:1,d:2,t:"2.2",
  q:"`process_refund` returns the text \"Operation failed\" for every failure. When a refund is denied because the return window has expired, the agent retries three times, then gives the customer a vague apology. Which change addresses this most directly?",
  o:["Return `isError` with `errorCategory`, `isRetryable: false`, and a customer-friendly explanation of the policy violation.",
     "Add a system prompt rule saying that any tool that has failed once must never be called again in that conversation.",
     "Wrap the tool in exponential backoff that retries all failures automatically before returning control to the agent.",
     "Return the HTTP status code along with the original message text so that the agent can look up what the code means."],
  a:[0],
  e:"Lỗi nghiệp vụ không nên retry; metadata có cấu trúc giúp agent biết không thử lại và giải thích đúng cho khách. Cấm retry mọi lỗi sẽ làm hỏng lỗi transient; backoff cho tất cả làm tệ hơn với lỗi policy; mã HTTP không nói lý do nghiệp vụ." },
{ s:1,d:2,t:"2.2",multi:1,
  q:"`lookup_order` returns an empty list both when no orders match and when its database connection times out. As a result, the agent tells some customers that their orders do not exist. Which TWO changes should you make?",
  o:["Return timeouts with `isError: true`, a transient error category, and `isRetryable: true` so the agent can decide to retry.",
     "Keep returning an empty list as a successful result when the query ran correctly and simply found no matching orders.",
     "Return `isError: true` for queries with no matches so that the agent always treats the absence of orders as a failure.",
     "Keep the empty list for timeouts but add a sentence to the tool description explaining that empty may mean unavailable.",
     "Instruct the agent to repeat any lookup three times when the result is empty before telling the customer anything."],
  a:[0,1],
  e:"Phải phân biệt access failure (cần quyết định retry) với kết quả rỗng hợp lệ (truy vấn thành công, không có match). Đánh dấu rỗng là lỗi làm sai ngữ nghĩa; thêm mô tả không giúp agent phân biệt từng lần gọi; retry mọi kết quả rỗng lãng phí và vẫn không biết nguyên nhân." },
{ s:1,d:2,t:"2.3",
  q:"After adding marketing, shipping, CRM, and analytics integrations, your single support agent has 18 tools. Tool selection accuracy has dropped noticeably, including for tools whose descriptions have not changed. What is the best architectural response?",
  o:["Use specialized subagents with four or five role-relevant tools each, coordinated by a triage agent that delegates.",
     "Keep all 18 tools on one agent, and increase the reasoning effort available so that it can compare the options better.",
     "Keep all 18 tools on one agent, and sort the definitions so that the most commonly used tools appear first in the list.",
     "Keep all 18 tools on one agent, and set `tool_choice` to `any` so that the model must always commit to a selection."],
  a:[0],
  e:"Quá nhiều tool (18 thay vì 4–5) làm giảm độ tin cậy khi chọn tool; hướng xử lý là phân quyền tool theo vai trò. Tăng reasoning hay sắp xếp không giảm độ phức tạp quyết định, còn `any` chỉ buộc gọi một tool nào đó chứ không giúp chọn đúng." },
{ s:1,d:2,t:"2.3",
  q:"For audit reasons, the first model action in every new conversation must be a call to `classify_intent`. After that, the agent should freely choose among tools or respond with text. How should you configure this?",
  o:["Use `tool_choice` `{\"type\":\"tool\",\"name\":\"classify_intent\"}` on the first request and `auto` on subsequent requests.",
     "Use `tool_choice` `any` on every request, and describe `classify_intent` as the tool that should always come first.",
     "Use `tool_choice` `auto` on every request, and state in the system prompt that `classify_intent` is required first.",
     "Use `tool_choice` `{\"type\":\"tool\",\"name\":\"classify_intent\"}` on every request until the conversation is closed."],
  a:[0],
  e:"Forced selection bảo đảm đúng tool chạy trước, sau đó chuyển về `auto` để agent tự quyết định. `any` cho phép gọi tool khác và không cho phép trả text; `auto` kèm prompt không bảo đảm; ép trên mọi request khiến agent mắc kẹt gọi mãi một tool." },
{ s:1,d:5,t:"5.1",multi:1,
  q:"Sessions covering several disputes approach context limits, and summaries turn \"$127.43 charged on 14 March for order 88213\" into \"a recent charge.\" Order lookups return over 40 fields, but only about five matter. Which TWO changes should you make?",
  o:["Persist amounts, dates, order numbers, and statuses in a case-facts block included with each prompt, outside summarized history.",
     "Trim order lookup results to the fields relevant to the current issue before they accumulate in the conversation context.",
     "Run the progressive summarization step more often so that older conversation content is compressed earlier in the session.",
     "Increase `max_tokens` on each request so that the model has more room available to hold the details of each dispute.",
     "Ask the customer to confirm the order number, amount, and date again whenever the conversation has been summarized."],
  a:[0,1],
  e:"Case-facts block giữ nguyên số liệu giao dịch ngoài phần bị tóm tắt, còn trimming giảm token do tool result phình to. Tóm tắt thường xuyên hơn làm mất chi tiết nhanh hơn; `max_tokens` chỉ giới hạn đầu ra chứ không mở rộng context; bắt khách xác nhận lại làm trải nghiệm tệ đi." },
{ s:1,d:5,t:"5.2",multi:1,
  q:"Which TWO of the following situations should cause the agent to escalate to a human?",
  o:["A customer asks a simple tracking question but states clearly that they want to speak with a person instead of the agent.",
     "A customer requests a price match against a competitor, and the written policy addresses only price changes on your own site.",
     "A customer uses angry language about a damaged item that qualifies for a standard replacement the agent is able to process.",
     "The agent's self-reported confidence score for its planned response has fallen below the configured threshold of 0.7.",
     "The conversation has passed ten turns while the agent is still making steady progress on the customer's billing question."],
  a:[0,1],
  e:"Trigger đúng là khách yêu cầu người thật (làm ngay) và policy có khoảng trống hoặc ngoại lệ. Sentiment và confidence tự báo cáo không phản ánh độ phức tạp thực; số lượt dài mà vẫn tiến triển cũng không phải lý do. Với khách bực nhưng việc đơn giản: ghi nhận và giải quyết." },
{ s:1,d:5,t:"5.2",
  q:"`get_customer` returns three accounts for the name \"J. Tran.\" In these cases, the agent currently selects the account with the most recent activity and sometimes discusses the wrong customer's orders. How should it behave?",
  o:["Ask the customer for an additional identifier, such as an email address or order number, before proceeding further.",
     "Select the account that has the most orders, because frequent buyers are statistically more likely to contact support.",
     "Show the customer all three accounts with recent orders so that they can point out which one belongs to them.",
     "Escalate to a human immediately, because an ambiguous lookup means that the agent cannot make meaningful progress."],
  a:[0],
  e:"Nhiều kết quả cần làm rõ bằng định danh bổ sung, không chọn theo heuristic. Heuristic nào cũng có thể sai tài khoản; hiển thị cả ba làm lộ dữ liệu của người khác; escalate là thừa vì chỉ cần hỏi thêm một thông tin." },
{ s:1,d:4,t:"4.2",
  q:"The agent is inconsistent about whether a request counts as \"damaged in transit\" or \"not as described,\" and each category follows a different policy. Two paragraphs of definitions have not helped. What is the most effective next step?",
  o:["Add three or four targeted examples of ambiguous cases, each showing the reasoning for choosing one category over the other.",
     "Add thirty labeled examples drawn from past tickets, each listing only the customer's message and the correct final category.",
     "Add an instruction asking the agent to think carefully and to apply its best judgment whenever the category seems unclear.",
     "Expand the two paragraphs of definitions into a full page that addresses more product types, carriers, and packaging cases."],
  a:[0],
  e:"Khi hướng dẫn dạng văn xuôi không ổn định, 2–4 ví dụ few-shot nhắm vào ca mơ hồ, có lập luận vì sao chọn phương án này, giúp model khái quát hóa. Nhiều ví dụ không có lý do tốn token và kém khái quát; \"best judgment\" quá mơ hồ; viết dài định nghĩa lặp lại cách đã thất bại." },

/* ===== Scenario 2 ===== */
{ s:2,d:1,t:"1.2",
  q:"Reports on \"grid-scale energy storage\" discuss only lithium-ion batteries. Logs show the coordinator assigned \"lithium supply,\" \"lithium costs,\" and \"lithium safety,\" and each subagent completed its assignment thoroughly. What is the most likely root cause?",
  o:["The coordinator's task decomposition was too narrow, so whole technology areas were never assigned to any subagent.",
     "The web search subagent's queries were poorly formed, so it failed to retrieve material about non-lithium technologies.",
     "The synthesis subagent filtered out non-lithium findings because its prompt told it to focus on the most frequent topics.",
     "The document analysis subagent lacks the tools needed to parse technical papers about pumped hydro and flow batteries."],
  a:[0],
  e:"Log cho thấy subagent làm đúng phần được giao, còn các phần được giao đã thu hẹp về lithium. Lỗi nằm ở bước phân rã của coordinator. Các phương án còn lại đổ lỗi cho thành phần phía sau, trong khi chúng chưa bao giờ nhận nhiệm vụ về công nghệ khác." },
{ s:2,d:1,t:"1.2",
  q:"Every request runs all four subagents. A question like \"What year was this standard published?\" costs as much as a full market study and takes several minutes. What should you change?",
  o:["Have the coordinator analyze each query's requirements and invoke only the subagents that the query actually needs.",
     "Switch all four subagents to a smaller, faster model while keeping the same pipeline for every incoming query.",
     "Cache all final reports and return the closest stored report when a new query resembles an earlier research topic.",
     "Limit the report subagent to two paragraphs so that the final step of the pipeline finishes more quickly for all queries."],
  a:[0],
  e:"Coordinator nên chọn subagent động theo độ phức tạp của truy vấn thay vì luôn chạy toàn bộ pipeline. Đổi model nhỏ làm giảm chất lượng cho nghiên cứu lớn mà pipeline vẫn thừa; cache gần đúng dễ trả sai; rút ngắn bước cuối không xử lý gốc rễ." },
{ s:2,d:1,t:"1.2",multi:1,
  q:"Reports often have coverage gaps, and two search subagents frequently return the same sources. Which TWO changes best address these problems?",
  o:["Have the coordinator evaluate synthesis output for gaps, re-delegate targeted queries, and re-run synthesis until coverage is sufficient.",
     "Assign each search subagent distinct subtopics or source types so that their scopes overlap as little as possible.",
     "Give every search subagent the full original question so that independent runs converge on the most important sources.",
     "Run the entire pipeline twice with identical inputs and merge both reports to increase the total number of sources.",
     "Give the synthesis subagent full web search access so that it can fill any gaps it notices while it writes the output."],
  a:[0,1],
  e:"Vòng refinement có mục tiêu xử lý khoảng trống, còn phân chia phạm vi riêng biệt giảm trùng lặp. Giao cùng câu hỏi hay chạy hai lần tăng trùng lặp; cho synthesis full web search là vượt chuyên môn và bỏ qua vai trò điều phối của coordinator." },
{ s:2,d:1,t:"1.3",
  q:"The search and analysis subagents complete successfully and the coordinator receives their findings. However, the synthesis subagent reports that it has \"no findings to synthesize.\" Its prompt says: \"Synthesize the research collected so far.\" What is the fix?",
  o:["Include the complete findings from earlier subagents directly in the prompt passed to the synthesis subagent.",
     "Give the synthesis subagent a larger context window so that it can access the coordinator's conversation history.",
     "Run the synthesis subagent with the same model and system prompt that the coordinator agent uses for its own turns.",
     "Rephrase the prompt to tell the synthesis subagent to check shared memory for what the other subagents reported."],
  a:[0],
  e:"Subagent có context cô lập: không tự kế thừa lịch sử của coordinator hay chia sẻ bộ nhớ giữa các lần gọi, nên mọi dữ liệu cần dùng phải nằm trong prompt. Context lớn hơn, cùng model, hay nhắc tới \"shared memory\" đều không tạo được đường truyền dữ liệu." },
{ s:2,d:1,t:"1.3",
  q:"Your `AgentDefinition` entries for all four subagents load without errors and have clear descriptions, but the coordinator never spawns a subagent and attempts the work itself. What is the most likely configuration problem?",
  o:["The coordinator's `allowedTools` does not include `Task`, the tool used to spawn subagents.",
     "Each subagent must be deployed as a separate MCP server before a coordinator can reach it.",
     "The subagent system prompts need to name the coordinator so that delegated work is accepted.",
     "The coordinator must set `tool_choice` to `none` so that its turns are reserved for delegation."],
  a:[0],
  e:"Guide nêu rõ `allowedTools` của coordinator phải có `Task` để gọi subagent (một số tài liệu SDK mới gọi tool này là `Agent`). Subagent không cần là MCP server, không cần biết tên coordinator; `none` thì lại tắt hẳn khả năng gọi tool." },
{ s:2,d:1,t:"1.3",
  q:"The coordinator spawns four independent search subagents one per turn, so overall latency is roughly four times that of a single search. Nothing in the searches depends on another search's result. How should this be changed?",
  o:["Have the coordinator emit all four `Task` tool calls in a single response so that the subagents run in parallel.",
     "Combine the four topics into one `Task` call and ask that subagent to research them at the same time.",
     "Launch four separate coordinator processes, each responsible for one topic, and merge their final reports.",
     "Add a system prompt instruction telling each search subagent to minimize the time it spends on each query."],
  a:[0],
  e:"Nhiều lời gọi Task trong cùng một response là cách chạy subagent song song. Gộp vào một subagent vẫn tuần tự và trộn phạm vi; bốn coordinator riêng đánh mất điều phối chung; nhắc nhanh hơn không giải quyết độ trễ cấu trúc." },
{ s:2,d:1,t:"1.3",
  q:"The coordinator gives search subagents long numbered procedures, such as which site to query first and which keywords to try next. Subagents perform poorly when sources turn out to be unavailable or irrelevant. Which change best improves adaptability?",
  o:["Rewrite coordinator prompts to state the research goal and quality criteria, leaving the search steps to the subagent.",
     "Extend the procedures with additional branches that cover each known case of an unavailable or irrelevant source.",
     "Add several few-shot examples that show subagents following the numbered procedures exactly from start to finish.",
     "Retry each subagent automatically with the same procedure whenever it returns fewer sources than the expected number."],
  a:[0],
  e:"Giao mục tiêu và tiêu chí chất lượng cho phép subagent tự thích ứng khi gặp tình huống bất ngờ. Thêm nhánh hay few-shot theo thủ tục càng làm cứng; retry cùng thủ tục lặp lại đúng hạn chế cũ." },
{ s:2,d:1,t:"1.7",
  q:"An analyst paused a named research session yesterday after analyzing 40 documents. Overnight, 2 of those documents were revised; the other 38 are unchanged. What is the most efficient way to continue?",
  o:["Use `--resume` with the session name and tell the agent which two documents changed so that it re-analyzes those.",
     "Start a new session and re-run the analysis of all 40 documents so that every result reflects the latest versions.",
     "Use `--resume` with the session name without mentioning the revisions, and let the agent detect the changes itself.",
     "Create a `fork_session` branch for each revised document, and merge the conclusions manually into a final analysis."],
  a:[0],
  e:"Context phần lớn còn hợp lệ nên resume, kèm thông báo cụ thể file đã đổi để phân tích lại có mục tiêu. Chạy lại tất cả là lãng phí; không nói gì thì agent dựa trên tool result cũ; `fork_session` dùng để khám phá nhánh khác nhau, không phải để cập nhật vài file." },
{ s:2,d:2,t:"2.1",
  q:"The document analysis subagent has one tool, `process_document(mode, path)`, used for extracting figures, summarizing sections, and checking claims. The output structure varies and the wrong mode is often selected. What is the best redesign?",
  o:["Split it into purpose-specific tools such as `extract_figures`, `summarize_section`, and `check_claim`, each with a defined contract.",
     "Keep the one tool, and add a long list of the valid `mode` values and their synonyms to the description of its parameter.",
     "Keep the one tool, and make its output a free-form string so that all three modes can share the same response format.",
     "Keep the one tool, and add a separate router model that inspects each request and chooses the correct `mode` value."],
  a:[0],
  e:"Tool chung nên tách thành các tool theo mục đích, có hợp đồng input/output rõ. Liệt kê mode không tạo được contract đầu ra riêng; chuỗi tự do làm hỏng tính cấu trúc; router là hạ tầng thừa so với việc thiết kế tool đúng." },
{ s:2,d:2,t:"2.3",
  q:"The synthesis subagent has full web search so that it can verify small details, but it often starts new research. About 85% of its lookups are simple checks of a date or a figure; the rest require real investigation. What is the best tool configuration?",
  o:["Replace web search with a scoped `verify_fact` tool, and route complex lookups back through the coordinator.",
     "Keep full web search, and add an instruction asking the subagent to search only for small factual details.",
     "Remove all tools from the subagent, and send every verification need back through the coordinator instead.",
     "Keep full web search, and add a limit of five calls per run to bound the amount of unrelated research it does."],
  a:[0],
  e:"Cấp một tool hẹp cho nhu cầu tần suất cao, ca phức tạp đi qua coordinator; quyền truy cập đúng vai trò ngăn lạm dụng. Prompt không ràng buộc được; bỏ hết tool thêm độ trễ cho 85% trường hợp đơn giản; giới hạn số lần gọi vẫn để subagent làm sai việc." },
{ s:2,d:2,t:"2.4",
  q:"The analysis subagent spends many turns calling `list_folders` and `search_titles` just to discover which internal reports exist before it can open the relevant ones. Which MCP design reduces this exploration most effectively?",
  o:["Expose the report catalog as an MCP resource so that the agent can see what data is available without exploratory calls.",
     "Add a `max_results` parameter to `list_folders` so that each exploratory call returns a smaller number of entries.",
     "Add a system prompt listing the current names of all internal reports, and update the prompt when reports change.",
     "Merge `list_folders` and `search_titles` into one tool with more optional filter parameters for narrowing results."],
  a:[0],
  e:"MCP resources dùng để lộ danh mục nội dung, giảm các lệnh gọi thăm dò. Giới hạn kết quả lại làm tăng số lần gọi; danh sách trong prompt dễ lỗi thời và tốn token; gộp tool vẫn là thăm dò bằng tool." },
{ s:2,d:5,t:"5.3",multi:1,
  q:"A search subagent exhausts its local retries when a data provider times out. Which THREE items should it include in the error context it returns to the coordinator?",
  o:["The failure type, for example a timeout from the provider rather than an invalid query or a permission problem.",
     "The specific query that was attempted, along with the provider and what the subagent already tried to recover.",
     "Any partial results obtained before the failure, plus possible alternative sources or approaches to try next.",
     "A short status string such as \"search unavailable\" in place of the individual details of what went wrong.",
     "A flag telling the coordinator to terminate the entire research workflow until the provider has recovered.",
     "An empty results list marked as successful so that the workflow can continue without any special handling."],
  a:[0,1,2],
  e:"Coordinator cần loại lỗi, truy vấn đã thử cùng kết quả một phần và phương án thay thế để quyết định khôi phục. Chuỗi chung chung che mất thông tin; dừng toàn bộ workflow vì một lỗi và giả thành công bằng kết quả rỗng đều là anti-pattern." },
{ s:2,d:5,t:"5.6",
  q:"One credible industry report says the market grew 14%; a government dataset covering the same period says 9%. The document analysis subagent reaches this conflict during its work. How should it be handled?",
  o:["Complete the analysis with both values annotated with their sources, and let the coordinator decide how to reconcile them.",
     "Keep the government figure, since official statistics are generally more reliable than industry reports on market growth.",
     "Report the average of the two figures, and describe the result as the estimated market growth for that period.",
     "Stop the analysis and return an error to the coordinator, because the source documents are mutually inconsistent."],
  a:[0],
  e:"Nguồn uy tín mâu thuẫn thì giữ cả hai giá trị kèm ghi chú nguồn, để bước điều phối hoặc synthesis quyết định. Tự chọn hoặc lấy trung bình làm mất thông tin và tạo ra con số không nguồn nào nêu; dừng phân tích vì mâu thuẫn là phản ứng quá mức." },
{ s:2,d:5,t:"5.6",multi:1,
  q:"Readers can no longer trace claims in final reports to their sources, and differences between 2021 and 2025 figures are being described as contradictions. Which TWO additions to subagent output best address these problems?",
  o:["Structured claim-source mappings with source URL, document name, and supporting excerpt, preserved through synthesis.",
     "Publication or data collection dates for each finding, so that downstream agents can interpret differences over time.",
     "A numeric confidence score from each subagent, so that synthesis can drop any claim that falls below a set threshold.",
     "A consolidated narrative paragraph from each subagent, so that synthesis has less structured detail to work through.",
     "A list of all search queries used by the subagent, so that synthesis can repeat any of them while it writes the report."],
  a:[0,1],
  e:"Mapping claim–nguồn giữ khả năng truy vết qua các bước tóm tắt, còn ngày xuất bản hoặc thu thập ngăn hiểu nhầm khác biệt theo thời gian là mâu thuẫn. Confidence không cho biết nguồn; đoạn tường thuật làm mất metadata; danh sách query không gắn được từng claim với nguồn." },
{ s:2,d:4,t:"4.2",
  q:"The document analysis subagent extracts citations reliably from papers with inline references but returns empty results for papers that use a bibliography or footnotes. Instructions already say to find every citation. What should you do?",
  o:["Add few-shot examples showing correct extraction from inline citations, bibliographies, and footnote formats.",
     "Add a strongly worded instruction stating that an empty citation list will be treated as a failed extraction.",
     "Make the `citations` array required with a minimum length of one so that an empty result cannot be returned.",
     "Replace the document analysis model with a larger one that has better recall across long technical documents."],
  a:[0],
  e:"Vấn đề là biến thể cấu trúc tài liệu, nên few-shot minh họa từng dạng là cách đúng. Ép độ dài tối thiểu hoặc đe dọa bằng prompt dễ dẫn tới citation bịa đặt; đổi model không dạy cách xử lý các định dạng khác nhau." },

/* ===== Scenario 3 ===== */
{ s:3,d:3,t:"3.6",
  q:"A pipeline step runs `claude \"Review this diff for security issues\"`. It works on a developer's laptop, but in CI the job hangs until the 30-minute timeout. What is the fix?",
  o:["Add the `-p` flag so that Claude Code runs non-interactively and exits after responding.",
     "Add `--output-format json` so that the process returns its result without user interaction.",
     "Add `--resume` so that the job continues from the most recent session on the CI runner.",
     "Set a `CLAUDE.md` entry telling Claude Code that it is running in an automated pipeline."],
  a:[0],
  e:"`-p`/`--print` là chế độ non-interactive; thiếu cờ này tiến trình chờ input. `--output-format` chỉ đổi định dạng; `--resume` tiếp tục phiên chứ không bỏ chế độ tương tác; `CLAUDE.md` là context, không điều khiển chế độ chạy." },
{ s:3,d:3,t:"3.6",
  q:"You want CI to post review findings as inline pull request comments. A script must reliably read each finding's file, line, severity, and message from Claude Code's output. Which approach is best?",
  o:["Run with `-p`, `--output-format json`, and `--json-schema` that defines the fields required for each finding.",
     "Run with `-p`, and instruct Claude to respond only with JSON, then repair malformed output with a regex step.",
     "Run with `-p`, and ask for a Markdown table whose columns are parsed by a small script in the pipeline.",
     "Run with `-p`, and pipe the prose output to a second Claude invocation that converts it into structured text."],
  a:[0],
  e:"`--output-format json` kết hợp `--json-schema` cho output máy đọc được, đúng schema. Yêu cầu JSON bằng prompt rồi sửa regex và bảng Markdown đều mong manh; thêm một lần gọi Claude tốn chi phí mà vẫn không có bảo đảm schema." },
{ s:3,d:3,t:"3.6",
  q:"Each new commit to a pull request triggers a fresh review, and developers complain that the same comments reappear even when issues have been addressed. What should you change in the review job?",
  o:["Include prior findings in context and instruct Claude to report only new or still-unaddressed issues.",
     "Review only the most recent commit's diff so that earlier parts of the change are never examined again.",
     "Delete all previous review comments on the pull request before each run posts its new set of comments.",
     "Drop any new comment whose text exactly matches a previous comment stored in the pipeline's database."],
  a:[0],
  e:"Đưa phát hiện trước vào context và yêu cầu chỉ báo vấn đề mới hoặc chưa xử lý. Chỉ xem commit cuối bỏ sót tương tác với thay đổi trước; xóa comment cũ không giảm việc lặp nội dung; khớp chuỗi thất bại vì Claude diễn đạt khác đi mỗi lần." },
{ s:3,d:4,t:"4.6",
  q:"A CI job generates code and then, in the same session, asks Claude to \"critically review your implementation.\" Human reviewers still find subtle bugs that the review step misses. Which change is most likely to improve detection?",
  o:["Run the review in a second, independent Claude instance that has no access to the generator's reasoning context.",
     "Keep the same session, and add a stronger instruction to challenge every assumption made during generation.",
     "Keep the same session, and enable extended thinking so that the self-review examines the code in more depth.",
     "Keep the same session, and run the self-review prompt three times, reporting the union of everything found."],
  a:[0],
  e:"Cùng phiên giữ lại bối cảnh lập luận khi sinh code, khiến model ít nghi ngờ quyết định của chính mình. Instance độc lập hiệu quả hơn self-review hoặc extended thinking; lặp lại trong cùng phiên vẫn mang thiên kiến đó." },
{ s:3,d:4,t:"4.1",
  q:"Developers are ignoring all review output because of frequent complaints about naming style and harmless local patterns. Adding \"be conservative and only report high-confidence findings\" made little difference. What should you do?",
  o:["Define explicitly which issues to report and which to skip, and temporarily disable the high false-positive categories.",
     "Strengthen the instruction by requiring a confidence score of at least 90 for each finding that the job is able to post.",
     "Limit each review to at most three findings per pull request so that developers receive fewer comments to read through.",
     "Post the findings as a single collapsed summary so that the developers can expand individual items whenever convenient."],
  a:[0],
  e:"Tiêu chí phân loại cụ thể hiệu quả hơn lời dặn chung chung; tắt tạm nhóm false positive cao giúp khôi phục niềm tin trong lúc tinh chỉnh. Confidence tự báo cáo là lọc kém; giới hạn số lượng và thu gọn hiển thị đều không làm kết quả chính xác hơn." },
{ s:3,d:4,t:"4.6",
  q:"On a 16-file pull request, a single review pass gives detailed feedback on some files, superficial feedback on others, and misses a type mismatch between an API handler and its client. What review design best addresses this?",
  o:["Run focused per-file passes for local issues, then a separate integration pass that analyzes cross-file data flow.",
     "Split the pull request by directory and review each directory once, with no step that compares results across them.",
     "Increase the context available and run one pass that is instructed to give every file exactly the same attention.",
     "Run the same complete single-pass review three times in parallel and keep only the findings reported in two of them."],
  a:[0],
  e:"Một lượt trên PR lớn gây loãng sự chú ý. Pass theo từng file giải quyết chiều sâu, pass tích hợp giải quyết lỗi xuyên file. Chia theo thư mục bỏ mất tương tác giữa các phần; nhắc đều tay không đổi được giới hạn; bỏ phiếu giữa các lần chạy vẫn cùng điểm mù." },
{ s:3,d:3,t:"3.1",
  q:"A newly joined developer reports that Claude Code ignores the team's API conventions, while it follows them for a colleague. The conventions are in that colleague's `~/.claude/CLAUDE.md`. What is the correct resolution?",
  o:["Move the conventions to project-level configuration, such as the root `CLAUDE.md`, and commit them to the repository.",
     "Have the new developer copy the conventions into their own `~/.claude/CLAUDE.md` file during machine setup.",
     "Add the conventions to a `CLAUDE.local.md` file so that they load for every contributor working on this project.",
     "Restart Claude Code on the new developer's machine so that the shared memory files are loaded again from disk."],
  a:[0],
  e:"Cấu hình cấp user chỉ áp dụng cho chính người đó và không đi qua version control. Quy chuẩn chung phải nằm ở cấp project. Sao chép thủ công sẽ lệch dần; `CLAUDE.local.md` là cấu hình cá nhân; khởi động lại không chia sẻ được file của người khác." },
{ s:3,d:3,t:"3.1",multi:1,
  q:"The monorepo's root `CLAUDE.md` has grown to 1,400 lines covering testing, deployment, and API conventions, and different packages follow different standards. Which TWO changes are the best way to organize this?",
  o:["Split the content into focused topic files, such as `testing.md` and `deployment.md`, in `.claude/rules/`.",
     "Use `@import` in each package's `CLAUDE.md` to include only the standards files relevant to that package.",
     "Copy the entire root `CLAUDE.md` into each package so that every directory has its own complete instructions.",
     "Move the shared standards into each developer's `~/.claude/CLAUDE.md` so that the repository file stays small.",
     "Convert the file into one forked skill that developers must remember to run at the beginning of each session."],
  a:[0,1],
  e:"`.claude/rules/` tách theo chủ đề, `@import` cho từng package chọn đúng chuẩn mình cần. Sao chép cả file nhân bản nội dung và làm tăng context; cấp user không chia sẻ được; quy chuẩn luôn cần áp dụng không nên phụ thuộc việc nhớ gọi skill." },
{ s:3,d:3,t:"3.2",
  q:"A project skill that audits dependencies produces hundreds of lines of exploration output. After running it, developers find that the main conversation has lost focus and is short on context. Which frontmatter setting addresses this?",
  o:["`context: fork`, so the skill runs in an isolated subagent context and its verbose work stays out of the main session.",
     "`allowed-tools: Read, Grep`, so the skill can use fewer tools and its verbose output stays out of the main session.",
     "`argument-hint: [package]`, so developers narrow the audit to one package before the skill begins its exploration.",
     "`disable-model-invocation: true`, so that the skill runs only when a developer explicitly invokes it by its name."],
  a:[0],
  e:"`context: fork` chạy skill trong sub-agent cô lập nên output dài không làm bẩn phiên chính. `allowed-tools` giới hạn quyền chứ không cô lập context; `argument-hint` chỉ gợi ý tham số; `disable-model-invocation` chỉ đổi cách kích hoạt." },
{ s:3,d:3,t:"3.2",multi:1,
  q:"You are creating a `/triage` skill. It must never be able to modify files or run shell commands, and developers should be prompted for an issue number if they run it without one. Which TWO frontmatter fields do you need?",
  o:["`allowed-tools`, restricted to the read-only tools that the triage workflow requires to complete its work.",
     "`argument-hint`, describing the issue number parameter that the developer is expected to provide to the skill.",
     "`context: fork`, which removes write and shell access from any skill that runs in the isolated sub-agent context.",
     "`paths`, listing the directories which the skill is allowed to read from when it carries out the triage workflow.",
     "`model`, selecting a smaller model that does not have the ability to request file edits or shell commands at all."],
  a:[0,1],
  e:"`allowed-tools` giới hạn tool khi skill chạy, `argument-hint` nhắc người dùng nhập tham số. `context: fork` chỉ cô lập context, không tước quyền; `paths` liên quan đến phạm vi kích hoạt theo file; đổi model không thay đổi các tool được phép." },
{ s:3,d:3,t:"3.2",
  q:"The team has two items to configure: a security standard that applies to every code change, and a multi-step release-notes workflow used about once per sprint. Where should each one live?",
  o:["Put the universal security standard in `CLAUDE.md` and the release-notes workflow in a skill invoked on demand.",
     "Put the universal security standard in a skill invoked on demand and the release-notes workflow in `CLAUDE.md`.",
     "Put both in `CLAUDE.md`, because project instructions are always loaded and cannot be overlooked by the agent.",
     "Put both in skills, because a small `CLAUDE.md` is more important than keeping any standard always available."],
  a:[0],
  e:"`CLAUDE.md` luôn được nạp, phù hợp chuẩn áp dụng mọi lúc; skill được gọi theo nhu cầu, phù hợp quy trình riêng. Đặt ngược làm tiêu chuẩn bị bỏ sót và tốn context; dồn cả hai vào một phía bỏ qua khác biệt giữa luôn-áp-dụng và theo-yêu-cầu." },
{ s:3,d:3,t:"3.4",multi:1,
  q:"Which TWO of these tasks are the best candidates for plan mode rather than direct execution?",
  o:["Migrating the HTTP client library used across 60 files, where several call patterns need different handling.",
     "Choosing between two queueing integrations that have different infrastructure and failure-handling requirements.",
     "Fixing a null dereference in one function, where the stack trace identifies the exact line that needs to change.",
     "Adding a date validation conditional to one input handler, where the expected behavior has already been defined.",
     "Correcting a misspelled label in a single configuration file after a reviewer pointed out the exact location of it."],
  a:[0,1],
  e:"Plan mode dành cho thay đổi lớn, nhiều file, có nhiều hướng hợp lệ hoặc ảnh hưởng kiến trúc. Ba việc còn lại đều rõ phạm vi, thực hiện trực tiếp là phù hợp." },
{ s:3,d:3,t:"3.4",
  q:"While preparing a large refactor, the main Claude Code session reads dozens of files during discovery and runs out of context before it can begin implementation. What is the best way to structure this work?",
  o:["Use the Explore subagent for verbose discovery so that only a summary returns to the main conversation context.",
     "Ask Claude to read all of the relevant files in one large initial step, before any discussion of the refactor plan.",
     "Disable plan mode so that Claude moves on to implementation sooner, before discovery has consumed all the context.",
     "Add the contents of the most important source files to `CLAUDE.md` so that they are already available at startup."],
  a:[0],
  e:"Explore subagent cô lập output thăm dò dài và chỉ trả về tóm tắt, bảo toàn context chính. Đọc hết từ đầu chính là nguyên nhân; bỏ plan mode tăng rủi ro làm sai; nhét source vào `CLAUDE.md` làm phình mọi phiên và nhanh lỗi thời." },
{ s:3,d:3,t:"3.5",
  q:"You asked Claude Code to write a converter for legacy date strings. Despite several rounds of prose clarification, it keeps mishandling two-digit years and blank values. What is the most effective next step?",
  o:["Provide two or three concrete input and expected output pairs that include the two-digit year and blank value cases.",
     "Write a longer description of the format rules and restate why the two-digit year and blank value logic is important.",
     "Ask Claude to re-read the code it has generated and to double-check its logic for handling the problematic date formats.",
     "Start a new session and paste in the same requirements so that earlier attempts cannot influence the next implementation."],
  a:[0],
  e:"Khi văn xuôi bị hiểu không nhất quán, ví dụ input/output cụ thể là cách truyền đạt hiệu quả nhất, đặc biệt với edge case. Mô tả dài hơn lặp lại cách đã thất bại; tự kiểm tra không có thêm tín hiệu; phiên mới với cùng yêu cầu vẫn mơ hồ như cũ." },
{ s:3,d:2,t:"2.4",
  q:"The whole team needs the same issue-tracker MCP server in Claude Code, and each developer authenticates with their own token. The configuration must live in version control without exposing credentials. What should you do?",
  o:["Define the server in the project's `.mcp.json` and reference `${TRACKER_TOKEN}` using environment variable expansion.",
     "Define the server in the project's `.mcp.json` and commit a shared service token that all of the developers can reuse.",
     "Define the server in each developer's `~/.claude.json` and copy its configuration by hand whenever the server changes.",
     "Define the server in `CLAUDE.md`, with instructions that tell Claude to ask developers for their token in each session."],
  a:[0],
  e:"`.mcp.json` là nơi chia sẻ cấu hình server cho cả team, `${VAR}` giữ secret ngoài repo. Commit token là rò rỉ credential; `~/.claude.json` dành cho cấu hình cá nhân và không đồng bộ; `CLAUDE.md` không cấu hình được MCP server." },

/* ===== Scenario 4 ===== */
{ s:4,d:4,t:"4.3",
  q:"You ask Claude to \"return only valid JSON\" for each invoice. About 2% of responses include extra commentary or malformed syntax, breaking the parser. Which change most reliably eliminates these syntax problems?",
  o:["Define an extraction tool with a JSON schema and read the structured data from the resulting `tool_use` block.",
     "Add examples to the prompt showing perfectly formatted JSON and repeat the instruction at the end of the prompt.",
     "Keep the current prompt and add a post-processing step that repairs common JSON syntax problems automatically.",
     "Keep the current prompt and lower the sampling temperature so that the model's output has less overall variation."],
  a:[0],
  e:"`tool_use` với JSON schema là cách đáng tin cậy nhất để có output đúng cú pháp. Ví dụ và temperature chỉ giảm xác suất lỗi; sửa JSON sau khi sinh ra xử lý triệu chứng và có thể làm hỏng dữ liệu." },
{ s:4,d:2,t:"2.3",
  q:"You have separate extraction tools for invoices, contracts, and statements, and you do not know a document's type before sending it. Each response must produce structured data instead of conversational text. Which `tool_choice` setting fits?",
  o:["`any`, so that the model must call one of the extraction tools while still deciding which schema applies.",
     "`auto`, so that the model can decide whether calling an extraction tool is appropriate for that document.",
     "A forced tool set to `extract_invoice`, because invoices are the most common document type in the pipeline.",
     "`none`, so that the model returns only text, which a downstream parser can then map onto the right schema."],
  a:[0],
  e:"`any` bảo đảm có tool call nhưng vẫn để model chọn schema phù hợp. `auto` có thể trả text; ép một tool sai với tài liệu không phải invoice; `none` tắt tool và mất lợi ích structured output." },
{ s:4,d:4,t:"4.3",multi:1,
  q:"When `purchase_order_number` is missing, the model invents one. Also, documents that fit no value in the `document_category` enum are forced into the nearest category. Which TWO schema changes should you make?",
  o:["Make fields that may be absent from source documents optional or nullable so that the model does not need to fabricate values.",
     "Add an `other` enum value paired with a detail string so that new categories can be captured without forcing a wrong value.",
     "Mark `purchase_order_number` as required and add a string pattern so that only realistic-looking values pass validation.",
     "Replace the `document_category` enum with an unconstrained string so that the model can write anything it finds suitable.",
     "Add a minimum length to every string so that the model must always provide a substantive value for each extracted field."],
  a:[0,1],
  e:"Trường nullable tránh bịa khi nguồn không có thông tin; `other` + chuỗi chi tiết giúp phân loại mở rộng có kiểm soát. Bắt buộc và thêm pattern càng thúc đẩy bịa ra giá trị trông hợp lý; chuỗi tự do mất tính nhất quán; độ dài tối thiểu cũng ép phải sinh ra nội dung." },
{ s:4,d:4,t:"4.4",
  q:"Some extractions fail validation because dates use `DD/MM/YY` when your schema requires ISO 8601. Your retry currently re-sends the original prompt unchanged, and most retries fail in the same way. How should the retry be built?",
  o:["Send the original document, the failed extraction, and the specific validation errors in a follow-up request.",
     "Send the original prompt again with a note saying that the previous extraction attempt was not acceptable.",
     "Send only the failed extraction and the validation errors so that the request uses as few tokens as possible.",
     "Send the original prompt to a larger model, without any information about the earlier extraction attempt."],
  a:[0],
  e:"Retry-with-error-feedback cần đủ tài liệu gốc, kết quả lỗi và lỗi cụ thể để model tự sửa. Chỉ báo \"chưa đạt\" không cho biết sửa gì; thiếu tài liệu gốc thì không đối chiếu được; đổi model mà không phản hồi lỗi vẫn thiếu tín hiệu." },
{ s:4,d:4,t:"4.4",
  q:"A contract says \"payment terms as defined in Master Agreement MA-77,\" but that agreement is not part of the submitted document set. Validation fails on `payment_terms` even after three retries. What is the best way to handle this?",
  o:["Stop retrying, since the data is absent from the source; return null and route the case for review or the missing document.",
     "Increase the retry limit to six attempts and strengthen the prompt so that the model searches the document more carefully.",
     "Add a few-shot example showing common net-30 terms so that the model can supply a reasonable payment term in such cases.",
     "Remove `payment_terms` from the validation rules so that incomplete contracts can pass to the downstream finance systems."],
  a:[0],
  e:"Retry chỉ hiệu quả với lỗi định dạng hoặc cấu trúc, không tạo ra được thông tin không có trong nguồn. Tăng số lần thử lãng phí; few-shot net-30 dẫn tới dữ liệu bịa; bỏ validation làm dữ liệu thiếu lọt xuống hệ thống tài chính." },
{ s:4,d:4,t:"4.4",
  q:"All extractions pass schema validation, but finance finds invoices where the line items do not add up to the extracted total. Sometimes the source invoice itself is wrong. Which design best detects and surfaces these cases?",
  o:["Extract `stated_total` alongside a `calculated_total` and add a `conflict_detected` flag to the structured output.",
     "Tighten the JSON schema with stricter numeric types so that invalid totals are rejected by the schema validator.",
     "Instruct the model to adjust the line items whenever necessary so that their sum always equals the stated total.",
     "Keep only the stated total, because it is the figure most likely to have been reviewed by the invoice's issuer."],
  a:[0],
  e:"Schema loại lỗi cú pháp chứ không loại lỗi ngữ nghĩa. Lưu cả giá trị được ghi và giá trị tính được, kèm cờ conflict, sẽ làm lộ sai lệch dù lỗi nằm ở tài liệu gốc. Bắt model chỉnh số là làm giả dữ liệu; chỉ giữ total thì mất khả năng phát hiện." },
{ s:4,d:4,t:"4.5",
  q:"Documents arrive continuously and must be extracted within 30 hours of arrival. The Message Batches API can take up to 24 hours per batch. Which submission schedule meets this SLA with a safety margin?",
  o:["Submit accumulated documents as a new batch every 4 hours.",
     "Submit accumulated documents as a new batch every 12 hours.",
     "Submit accumulated documents as one new batch each night.",
     "Submit accumulated documents once they reach 10,000 items."],
  a:[0],
  e:"Thời gian chờ tối đa + 24 giờ xử lý phải ≤ 30 giờ, nên chu kỳ gom không vượt quá 6 giờ; 4 giờ còn có biên an toàn. Chu kỳ 12 giờ hoặc hàng đêm có thể vượt SLA; ngưỡng theo số lượng không giới hạn được thời gian chờ." },
{ s:4,d:4,t:"4.5",
  q:"In a batch of 10,000 documents, 180 requests failed. Most of the failures exceeded context limits because the documents were very long. What is the correct recovery approach?",
  o:["Use `custom_id` to identify failures, split the oversized documents into chunks, and resubmit only those items.",
     "Resubmit the complete batch of 10,000 documents to guarantee that the output is produced from a single consistent run.",
     "Resubmit the 180 failed documents unchanged in a second batch, since batch failures are generally transient by nature.",
     "Send the 180 failed documents through the synchronous API unchanged, since it has a higher limit on document length."],
  a:[0],
  e:"`custom_id` ghép cặp request/response để chỉ xử lý lại mục lỗi, kèm sửa nguyên nhân (chunking). Gửi lại toàn bộ lãng phí; gửi lại nguyên trạng hoặc qua API đồng bộ vẫn vượt giới hạn context." },
{ s:4,d:1,t:"1.6",
  q:"You have two tasks: (1) processing each incoming invoice through classification, extraction, validation, and export; and (2) investigating why accuracy for one supplier dropped last month. Which decomposition strategy fits each one?",
  o:["Use a fixed prompt chain for (1), and dynamic decomposition that adapts to intermediate findings for (2).",
     "Use dynamic decomposition that adapts to intermediate findings for (1), and a fixed prompt chain for (2).",
     "Use a fixed prompt chain for both, because repeatable steps are the easiest to test before production.",
     "Use dynamic decomposition for both, because model-driven planning handles more variation than fixed steps."],
  a:[0],
  e:"Quy trình đã biết trước, lặp lại được thì dùng prompt chaining; điều tra mở cần kế hoạch thích ứng theo phát hiện ở mỗi bước. Các phương án còn lại đặt sai hoặc dùng một chiến lược cho cả hai loại công việc." },
{ s:4,d:1,t:"1.7",
  q:"A named Claude Code session analyzed your extraction schemas last week. Since then, a refactor has renamed most schema files and changed their field structures. You want to continue the design work. What is the most reliable way to proceed?",
  o:["Start a new session and inject a structured summary of the conclusions that remain valid after the refactor.",
     "Use `--resume` with the session name and instruct the agent to disregard any findings that appear out of date.",
     "Use `fork_session` from last week's session so that the new branch can work separately from the old analysis.",
     "Use `--resume` with the session name and run `/compact` so that the older tool results are condensed first."],
  a:[0],
  e:"Khi phần lớn tool result đã cũ, phiên mới kèm tóm tắt có cấu trúc đáng tin cậy hơn resume. Dặn bỏ qua không giúp model biết phần nào đã cũ; fork và `/compact` đều vẫn mang theo kết luận dựa trên file không còn đúng." },
{ s:4,d:3,t:"3.3",
  q:"Files ending in `.schema.json` are scattered across dozens of packages and must follow one set of naming conventions. Those conventions should be loaded only when such files are being edited. How should you configure this?",
  o:["Create a `.claude/rules/` file whose YAML frontmatter has `paths: [\"**/*.schema.json\"]`.",
     "Create a subdirectory `CLAUDE.md` that holds the conventions in every package containing schemas.",
     "Add the conventions to the root `CLAUDE.md` under a heading that names the schema file extension.",
     "Create a project skill that holds the conventions and ask developers to run it before editing schemas."],
  a:[0],
  e:"Rule theo glob trong `.claude/rules/` áp dụng theo loại file ở mọi vị trí và chỉ nạp khi cần. `CLAUDE.md` theo thư mục phải nhân bản ở nhiều nơi; root `CLAUDE.md` luôn nạp nên tốn context; skill phụ thuộc vào việc con người nhớ gọi." },
{ s:4,d:2,t:"2.5",
  q:"You are tracing a legacy parser with Claude Code. You need all files named `*.parser.ts` and every place that calls `parseAmount`. Which approach makes the best use of built-in tools?",
  o:["Use Glob to find `**/*.parser.ts`, use Grep to find callers of `parseAmount`, then Read only the relevant matches.",
     "Use Grep to find `**/*.parser.ts`, use Glob to find callers of `parseAmount`, then Read only the relevant matches.",
     "Use Read on every file in the source directory first, so that later searches can rely on content already in context.",
     "Use Bash to concatenate all TypeScript files into one output, then scan through that output for the required names."],
  a:[0],
  e:"Glob tìm theo tên hoặc đường dẫn, Grep tìm theo nội dung; sau đó mới Read có chọn lọc để hiểu dần. Phương án đảo vai hai tool không hoạt động đúng; đọc hoặc nối toàn bộ file làm cạn context." },
{ s:4,d:5,t:"5.4",
  q:"Two hours into exploring the legacy parser, Claude Code starts referring to \"typical parser patterns\" instead of the specific classes it found earlier, and its answers become inconsistent. Which practice best counteracts this?",
  o:["Have the agent record key findings in a scratchpad file and reference that file when answering later questions.",
     "Raise the output token limit so that later answers can restate more of the earlier discoveries about those classes.",
     "Begin a new session for each question and have it explore the parser again from the beginning every single time.",
     "Bundle every remaining question into one very long prompt so that they are all answered before context degrades."],
  a:[0],
  e:"Scratchpad lưu phát hiện chính qua các ranh giới context để chống suy giảm trong phiên dài. Output token không liên quan đến việc quên; khám phá lại mỗi lần rất lãng phí; prompt dài không bảo đảm chất lượng cho từng câu hỏi." },
{ s:4,d:5,t:"5.5",
  q:"Your extraction system shows 97% accuracy overall, so management proposes eliminating human review for all documents. What should you do before reducing review?",
  o:["Analyze accuracy by document type and by field to verify that performance is consistent across all segments.",
     "Confirm that the 97% figure has remained stable over several weeks of production volume in the aggregate metric.",
     "Raise the aggregate target to 99% and keep the current human review in place until that overall number is reached.",
     "Ask the model to report its overall confidence for each document, and compare the average against the 97% figure."],
  a:[0],
  e:"Accuracy tổng hợp có thể che giấu hiệu năng kém ở một số loại tài liệu hoặc trường dữ liệu. Ổn định theo thời gian hay tăng mục tiêu tổng vẫn là một con số gộp; confidence trung bình cũng không thay thế việc đo trên dữ liệu theo từng phân khúc." },
{ s:4,d:5,t:"5.5",multi:1,
  q:"With limited reviewer capacity, you auto-approve high-confidence extractions and review the rest. Which TWO practices keep this approach trustworthy over time?",
  o:["Calibrate field-level confidence thresholds against a labeled validation set instead of trusting the raw scores.",
     "Keep a stratified random sample of high-confidence extractions under review to measure errors and detect new patterns.",
     "Stop reviewing high-confidence extractions entirely, directing all reviewer capacity to low-confidence documents.",
     "Use one document-level confidence score from the model, which is simpler to route than a score for each field.",
     "Review a random sample drawn only from low-confidence extractions, as those are where errors are concentrated."],
  a:[0,1],
  e:"Điểm confidence phải hiệu chuẩn bằng dữ liệu đã gán nhãn, và cần lấy mẫu phân tầng ngay trong nhóm confidence cao để đo lỗi, phát hiện mẫu lỗi mới. Bỏ hẳn review nhóm cao khiến lỗi ẩn; điểm cấp tài liệu che lỗi từng trường; chỉ lấy mẫu nhóm thấp thì không biết sai số của nhóm tự động duyệt." }
];

{ s:5,d:3,t:"3.1",

     "Paste the full text of the relevant standard into a `CLAUDE.md` file placed inside every subdirectory of the package.",

  a:[0], x:{2:"copyMd",3:"userLevel"},

{ s:5,d:3,t:"3.1",

{ s:5,d:3,t:"3.2",
  q:"The team wants a `/changelog-entry` command that every engineer gets automatically after cloning the repository, and changes to it should go through normal code review. Where should it be defined?",

{ s:5,d:3,t:"3.2",multi:true,
  q:"You are writing a `/scaffold-service` skill. It must never run destructive shell commands while it executes, and when a developer invokes it with no arguments they should be told that a service name is required. Which TWO frontmatter settings address these requirements?",

{ s:5,d:3,t:"3.2",

{ s:5,d:3,t:"3.4",

{ s:5,d:5,t:"5.4",
