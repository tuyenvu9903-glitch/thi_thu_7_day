     "Switch to a model with a larger context window so that all of the earlier exploration output can remain available.",
     "Remind Claude in each new message to be precise and to base every statement only on what it has actually read.",
     "Restart the exploration from the beginning in a new session and keep going until the same questions are answered."],
  a:[0], x:{1:"big",2:"vague",3:"redo"},
  e:"Đây là suy giảm context trong phiên dài. File scratchpad giữ phát hiện chính qua các ranh giới context. Context lớn hơn hay nhắc nhở không xử lý gốc vấn đề, còn làm lại từ đầu thì mất hết những gì đã tìm được." },
{ s:5,d:5,t:"5.4",
  q:"Phase one of an investigation is complete, and phase two will spawn several subagents to examine specific dependencies. How should the phase-one results reach those subagents?",
  o:["Summarize the key phase-one findings and inject that summary into the initial prompt of each phase-two subagent.",
     "Rely on the subagents inheriting the main conversation automatically, since they are spawned from the same session.",
     "Instruct each subagent to repeat the phase-one exploration so that it builds the same understanding independently.",
     "Paste the complete, unedited transcript of phase one into each subagent prompt so that no detail can possibly be lost."],
  a:[0], x:{1:"inherit",2:"redo",3:"transcript"},
  e:"Subagent không tự kế thừa ngữ cảnh, nên cần đưa bản tóm tắt phát hiện vào prompt. Lặp lại khám phá lãng phí; dán cả transcript làm mất lợi ích cô lập ngữ cảnh." },
{ s:5,d:4,t:"4.6",
  q:"Claude Code generates a complex concurrency fix. In the same session, you ask it to review its work, and it reports no problems, yet a human later finds a race condition. How should the workflow change?",
  o:["Have a second, independent Claude instance review the change without access to the generator's reasoning context.",
     "Add an instruction at the end of the session asking Claude to think harder and be highly critical of its own work.",
     "Enable extended thinking during the same-session review so that it has more room to reconsider earlier decisions.",
     "Have the same session run its review twice and treat only issues found in both of the two passes as genuine."],
  a:[0], x:{1:"selfReview",2:"selfReview",3:"runTwice"},
  e:"Phiên sinh code giữ lý lẽ của chính nó nên khó tự nghi ngờ. Phiên review độc lập, không có ngữ cảnh sinh code, hiệu quả hơn tự review hay extended thinking." },
/* ===== Customer Support ===== */
{ s:1,d:1,t:"1.1",
  q:"Claude returns one response containing two `tool_use` blocks, for `get_customer` and `lookup_order`. Your code runs both tools. What must the next API request contain for the loop to work correctly?",
  o:["The prior messages, the assistant turn with both `tool_use` blocks, and matching `tool_result` content for both tools.",
     "Only the two `tool_result` blocks, since the model retains its earlier tool calls between requests within a single session.",
     "A summary of both tool outputs written into the system prompt, with the assistant turn removed to reduce the token count.",
     "The first tool's result now, then a separate later request carrying the second result after Claude has responded to it."],
  a:[0], x:{1:"latestOnly"},
  e:"API không giữ trạng thái: mỗi lần gọi phải gửi đầy đủ lịch sử, gồm lượt assistant có `tool_use` và `tool_result` tương ứng của cả hai tool." },
{ s:1,d:1,t:"1.1",
  q:"To control cost, the team made a limit of five iterations the loop's main stopping rule. Complex billing disputes now end mid-investigation with no answer to the customer. What is the best design?",
  o:["Run until `stop_reason` is `end_turn`, keeping a much higher iteration limit only as a runaway safeguard that escalates.",
     "Raise the limit to fifteen iterations so that complex disputes have room, and return whatever the last response contained.",
     "Stop when an assistant response contains text addressed to the customer, and otherwise keep calling the requested tools.",
     "Have Claude state the number of steps it expects at the beginning, then end the loop after that many iterations pass."],
  a:[0], x:{1:"iterCap",2:"parseText"},
  e:"`stop_reason` là tín hiệu chính để dừng; giới hạn vòng lặp chỉ là lưới an toàn. Nâng trần vẫn là số cố định, còn dựa vào text là anti-pattern vì text có thể đi cùng tool call." },
{ s:1,d:1,t:"1.4",
  q:"Audit logs show the agent occasionally calls `process_refund` before identity has been verified, even though the system prompt requires verification first. Compliance requires this to never happen. What should you implement?",
  o:["A programmatic prerequisite that blocks `process_refund` until `get_customer` has returned a verified customer ID in the session.",
     "A clearer system prompt section with the verification rule repeated at both the beginning and the end of the instructions.",
     "Several few-shot examples showing the agent verifying the identity of a customer before it issues any kind of refund.",
     "A routing classifier in front of the agent that sends all refund requests to a dedicated refund-only agent prompt."],
  a:[0], x:{1:"prompt",2:"prompt",3:"router"},
  e:"Yêu cầu tuyệt đối cần cơ chế xác định: chặn bằng code cho tới khi có ID đã xác minh. Prompt và few-shot chỉ mang tính xác suất; classifier chọn agent chứ không đảm bảo thứ tự bước." },
{ s:1,d:1,t:"1.4",multi:true,
  q:"A customer writes: `My last invoice charged me twice, my order 8841 arrived broken, and I want to change my email.` Which TWO practices should the agent follow?",
  o:["Decompose the message into distinct issues and investigate them in parallel using shared customer context.",
     "Synthesize the findings into one unified response that addresses all three of the customer's issues.",
     "Resolve only the first issue now and ask the customer to open a new conversation for the other two.",
     "Escalate at once to a human, because a message with several issues exceeds what an agent should handle.",
     "Ask the customer to resend each issue as a separate message so that each can be routed to the right tool."],
  a:[0,1], x:{2:"askRepeat",3:"escalateMore",4:"askRepeat"},
  e:"Yêu cầu nhiều vấn đề cần được tách, điều tra song song với ngữ cảnh chung rồi tổng hợp thành một câu trả lời. Bắt khách gửi lại hoặc escalate ngay là không cần thiết." },
{ s:1,d:1,t:"1.4",
  q:"When the agent escalates a disputed refund, human agents complain that they must re-investigate each case. The human agents cannot see the conversation transcript. What should the agent pass in the handoff?",
  o:["A structured summary with customer ID, root cause analysis, the exact refund amount, and a recommended action.",
     "The complete raw conversation and every tool result, attached so that the human can look up anything needed.",
     "A one-line note that the customer needs help with a refund, so the human agent can start without any delay.",
     "The agent's self-reported confidence score and sentiment rating, so that the human knows how to prioritize it."],
  a:[0], x:{1:"transcript",3:"confidence"},
  e:"Con người không thấy transcript nên bản bàn giao có cấu trúc phải tự đủ thông tin: ID khách, nguyên nhân, số tiền, hành động đề xuất. Transcript thô khó dùng; ghi chú một dòng thì thiếu." },
{ s:1,d:1,t:"1.5",
  q:"Business rules forbid the agent from issuing refunds above $500; those cases must go to a human. Where should this rule be enforced?",
  o:["In a hook that intercepts outgoing `process_refund` calls, blocks amounts above the limit, and redirects to escalation.",
     "In a `PostToolUse` hook that inspects the refund result and reports any amount above the limit to the supervisor queue.",
     "In the system prompt, together with a few examples of refunds over the limit being handed over to a human agent.",
     "In the description of `process_refund`, which should state clearly in capitals that the maximum permitted amount is $500."],
  a:[0], x:{1:"postBlock",2:"prompt",3:"loud"},
  e:"Cần chặn trước khi tool chạy, nên hook phải chặn lời gọi đi. `PostToolUse` chạy sau khi tiền đã hoàn; prompt và mô tả tool chỉ là hướng dẫn xác suất." },
{ s:1,d:1,t:"1.5",
  q:"`get_customer` returns signup dates as Unix timestamps, `lookup_order` returns ISO 8601, and shipping statuses arrive as numeric codes. The agent sometimes misreads them. What is the most reliable fix within the agent?",
  o:["A `PostToolUse` hook that normalizes dates and status codes before the model processes the tool results.",
     "A table in the system prompt that explains each format and how Claude should convert it during reasoning.",
     "A `PreToolUse` hook that rewrites each tool's arguments so that backends return one consistent format.",
     "A new `normalize_data` tool that Claude is told to call after every lookup and before making any decision."],
  a:[0], x:{1:"prompt"},
  e:"`PostToolUse` chuẩn hóa dữ liệu một cách xác định trước khi model đọc. Bảng trong prompt vẫn phụ thuộc xác suất; `PreToolUse` không có kết quả để xử lý; thêm tool tăng số bước và có thể bị bỏ qua." },
{ s:1,d:2,t:"2.1",
  q:"The agent often calls `get_customer` when asked `where is my order 4471?`. The tool descriptions are currently `Gets customer information` and `Gets order information`. What should you change first?",
  o:["Expand both descriptions with purpose, input formats, example queries, and when to use each tool versus the other.",
     "Build a routing classifier in front of the agent that picks the correct tool from the wording of the request.",
     "Merge the two tools into one `lookup` tool with a `type` parameter so that Claude has only one tool to choose.",
     "List `lookup_order` first in the tool array, because the model tends to favor whichever tool appears earliest."],
  a:[0], x:{1:"router",2:"merge",3:"toolOrder"},
  e:"Mô tả tool là cơ chế chính để model chọn tool, nên mở rộng mô tả là cách sửa đầu tiên. Classifier, gộp tool hay đổi thứ tự không xử lý gốc vấn đề." },
{ s:1,d:2,t:"2.2",multi:true,
  q:"`process_refund` can fail because the payment service timed out, or because the order is past the return window. The agent currently retries both. Which TWO changes to the tool's error response are correct?",
  o:["For the timeout, return `isError` true with a transient category and a retryable flag set to true.",
     "For the expired window, return a business error marked not retryable, with an explanation suitable for the customer.",
     "For both cases, return the same generic message and let the system prompt tell the agent when to retry.",
     "For the expired window, return an empty success result so that the agent moves on without alarming the customer.",
     "For the timeout, retry indefinitely inside the tool so that the agent never receives any transient failure."],
  a:[0,1], x:{2:"generic",3:"fakeOk",4:"retryMore"},
  e:"Metadata lỗi có cấu trúc giúp agent phân biệt lỗi tạm thời có thể thử lại với lỗi nghiệp vụ không thử lại được. Thông báo chung chung hay trả thành công giả đều làm mất khả năng xử lý đúng." },
{ s:1,d:2,t:"2.2",
  q:"`lookup_order` returns an identical empty response for `order not found` and for `database unreachable`. The agent retries genuine not-found cases three times and tells customers an order is missing during outages. What is the fix?",
  o:["Treat no match as a successful empty result, and return `isError` true with a transient category for access failures.",
     "Return `isError` true for both situations so that the agent always treats an empty response as something to retry.",
     "Add a system prompt instruction telling the agent to retry each empty response exactly once and then apologize.",
     "Return the text `Operation failed` for both so that the agent does not make any assumption about the order."],
  a:[0], x:{1:"retryMore",3:"generic"},
  e:"Không tìm thấy là kết quả hợp lệ, còn không truy cập được là lỗi. Phân biệt rõ để agent không thử lại vô ích và không báo sai với khách trong lúc hệ thống gặp sự cố." },
{ s:1,d:2,t:"2.3",
  q:"The support agent now has 18 tools after several integrations, and selection accuracy has dropped. Billing and shipping cases use clearly different subsets. What is the best change?",
  o:["Give specialized agents only the four or five tools needed for their role, coordinated by a top-level agent.",
     "Keep all 18 tools on one agent and set `tool_choice` to `any` so that the agent must always select a tool.",
     "Keep all 18 tools on one agent and reorder them so that the most frequently used tools appear first in the list.",
     "Keep all 18 tools on one agent and add a much longer system prompt that explains each tool again in detail."],
  a:[0], x:{1:"anyPick",2:"toolOrder"},
  e:"Quá nhiều tool làm giảm độ tin cậy khi chọn; nên giới hạn mỗi agent khoảng 4–5 tool theo vai trò. `any` chỉ ép gọi tool chứ không giúp chọn đúng tool." },
{ s:1,d:5,t:"5.1",
  q:"In long conversations, the summarized history turns `$312.40 refund promised by Friday on order 7719` into `a refund was discussed`. What is the best way to prevent this?",
  o:["Keep transactional facts in a persistent case facts block included in each prompt, outside the summarized history.",
     "Instruct the summarizer to be careful and to preserve anything that seems important to the customer's case.",
     "Stop sending earlier turns entirely and rely on the customer to restate any amounts that still matter to them.",
     "Summarize more often so that each summary covers fewer turns and individual details are less likely to vanish."],
  a:[0], x:{1:"vague",2:"askRepeat"},
  e:"Số tiền, ngày, mã đơn nên nằm trong khối case facts bền vững, tách khỏi phần lịch sử bị tóm tắt. Lời dặn chung chung không đảm bảo giữ chi tiết số." },
{ s:1,d:5,t:"5.1",
  q:"Each `lookup_order` call returns over 40 fields, but return decisions use only five. Conversations with several orders exhaust the context window quickly. What should you do?",
  o:["Trim each lookup result to the return-relevant fields before it accumulates in the conversation context.",
     "Move to a model with a larger context window so that complete order records can be retained throughout.",
     "Drop all prior tool results from the next request, retaining only the most recent lookup in the history.",
     "Ask Claude in the system prompt to pay attention only to the five fields that are relevant to a return."],
  a:[0], x:{1:"big",2:"latestOnly"},
  e:"Cắt bớt kết quả tool xuống các trường liên quan trước khi chúng tích lũy. Nhắc trong prompt không làm giảm token; bỏ kết quả cũ làm mất ngữ cảnh cần thiết." },
{ s:1,d:5,t:"5.2",multi:true,
  q:"Which TWO situations should trigger escalation to a human agent?",
  o:["A customer explicitly asks for a human, even though the agent has not yet investigated the issue.",
     "A customer asks to transfer loyalty points to a spouse, and the written policy does not address transfers.",
     "A customer uses angry language about a late delivery that the agent is able to resolve right away.",
     "The agent reports a confidence value below 0.6 on a routine question about an order's delivery date.",
     "`get_customer` returns two accounts with the same name, and no further identifiers have been requested yet."],
  a:[0,1], x:{2:"sentiment",3:"confidence",4:"escalateMore"},
  e:"Yêu cầu gặp người và khoảng trống chính sách là tiêu chí escalate. Cảm xúc và confidence tự báo là chỉ báo kém tin cậy; nhiều kết quả khớp thì nên hỏi thêm định danh." },
{ s:1,d:5,t:"5.2",
  q:"A customer writes angrily that a replacement charger has not arrived. The tracking data shows a simple resend is allowed under policy. The customer has not asked for a person. What should the agent do?",
  o:["Acknowledge the frustration and offer the resend, escalating only if the customer then says they want a person.",
     "Escalate immediately, because strongly negative sentiment is a reliable indicator that the case is too complex.",
     "Ignore the emotional tone and return only the tracking details, because tone has no bearing on the resolution.",
     "Ask the customer to score their frustration from one to ten and use that score to decide whether to escalate."],
  a:[0], x:{1:"sentiment"},
  e:"Việc nằm trong khả năng của agent thì thừa nhận sự bực bội và đề xuất giải quyết; chỉ escalate nếu khách vẫn muốn gặp người." },
/* ===== Developer Productivity ===== */
{ s:6,d:1,t:"1.2",
  q:"Your coordinator always runs the code-search, dependency, documentation, and test-history subagents, even for `what does this function return?`. Simple questions are slow and costly. What is the best change?",
  o:["Have the coordinator analyze each query's requirements and invoke only the subagents that the query actually needs.",
     "Run all four subagents in parallel so that the full pipeline finishes faster on even the simplest of questions.",
     "Add a cheaper model to each subagent so that the cost of the full pipeline is lower across every query type.",
     "Replace the coordinator with a fixed four-step prompt chain that is easier to reason about and to monitor."],
  a:[0], x:{3:"fixedOpen"},
  e:"Coordinator nên chọn subagent động theo độ phức tạp của câu hỏi. Song song hay model rẻ hơn vẫn chạy thừa; chuỗi cố định còn cứng nhắc hơn." },
{ s:6,d:1,t:"1.2",
  q:"Asked to `document how the payments system works`, your agent's output covers only the card flow and omits refunds, payouts, and reconciliation. Each subagent did its assigned work correctly. Where is the most likely cause?",
  o:["The coordinator's task decomposition was too narrow and did not partition the full scope among subagents.",
     "The subagent that reads the code needs a larger context window so that it can process more of each file.",
     "The documentation subagent needs a stronger prompt instructing it to write comprehensive output every time.",
     "The subagents should have communicated directly with each other to discover which areas nobody had covered."],
  a:[0], x:{1:"big",2:"vague",3:"peer"},
  e:"Subagent làm đúng phần được giao mà vẫn thiếu phạm vi thì lỗi nằm ở bước phân rã của coordinator. Phóng to context hay viết prompt mạnh hơn không sửa được phạm vi bị thu hẹp." },
{ s:6,d:1,t:"1.2",
  q:"A developer proposes that the dependency subagent send its results straight to the migration subagent to skip a coordinator step. What is the main reason to keep routing through the coordinator?",
  o:["Central routing preserves observability, consistent error handling, and controlled information flow across subagents.",
     "Subagents cannot produce structured output unless the output is first validated by the coordinator agent's model.",
     "The coordinator's context window is larger, so subagent results would otherwise be truncated while in transit.",
     "Direct communication would make each subagent inherit the other's full history, which increases token usage."],
  a:[0], x:{3:"inherit"},
  e:"Mô hình hub-and-spoke định tuyến qua coordinator để quan sát được, xử lý lỗi nhất quán và kiểm soát luồng thông tin." },
{ s:6,d:1,t:"1.3",
  q:"You define a coordinator and three subagents with `AgentDefinition`, but the coordinator never spawns any of them and instead tries the work itself. What should you check first?",
  o:["Whether the coordinator's `allowedTools` includes `Task`, which it needs in order to invoke subagents.",
     "Whether each subagent's system prompt tells it to wait for instructions from the coordinator agent.",
     "Whether the subagents are listed in the same order in which the coordinator is expected to call them.",
     "Whether `tool_choice` is set to `auto` on each subagent, which is required before they can be spawned."],
  a:[0], x:{2:"toolOrder"},
  e:"Coordinator cần có `Task` trong `allowedTools` mới gọi được subagent. Các lựa chọn khác không liên quan đến khả năng tạo subagent." },
{ s:6,d:1,t:"1.3",multi:true,
  q:"The coordinator must run three independent investigations and then hand their results to a summarizing subagent. Which TWO practices are correct?",
  o:["Emit all three `Task` calls in a single coordinator response so that they run in parallel.",
     "Include the complete findings of the three investigations directly in the summarizing subagent's prompt.",
     "Emit one `Task` call per turn so that each investigation can be checked before the next one begins.",
     "Rely on the shared session memory, where the summarizing subagent can read the other subagents' results.",
     "Combine the three investigations into one large `Task` so that the subagent can parallelize them internally."],
  a:[0,1], x:{3:"inherit",4:"oneTask"},
  e:"Nhiều lệnh `Task` trong một phản hồi mới chạy song song. Subagent không chia sẻ bộ nhớ nên kết quả phải được đưa thẳng vào prompt." },
{ s:6,d:1,t:"1.3",
  q:"The coordinator's prompts to subagents contain numbered procedures such as `open file A, then grep B, then read C`. When the repository differs from expectations, subagents fail. How should the prompts change?",
  o:["State the investigation goal and quality criteria, and leave the subagent to adapt how it reaches them.",
     "Add more numbered steps that cover each repository layout the agent could possibly encounter in practice.",
     "Tell each subagent to stop and return an error as soon as any step of its procedure does not match reality.",
     "Move the numbered procedure into the coordinator's own system prompt and have it perform the steps itself."],
  a:[0], x:{1:"stepProc",2:"abort"},
  e:"Prompt cho subagent nên nêu mục tiêu và tiêu chí chất lượng để nó thích ứng, thay vì thủ tục từng bước dễ vỡ." },
{ s:6,d:2,t:"2.1",
  q:"You wrote a detailed description for your `search_tickets` MCP tool, yet the agent keeps using Grep on exported files. The system prompt says `Always grep before answering any question about issues.` What should you do?",
  o:["Review the system prompt and remove the keyword-sensitive instruction that is overriding the tool's description.",
     "Disable the built-in Grep tool for the agent so that the MCP tool becomes the only available search option.",
     "Set `tool_choice` to force `search_tickets` on all requests so that it is called regardless of the question.",
     "Rewrite the MCP tool description again, making it longer and repeating the word `search` in several places."],
  a:[0], x:{1:"disable",2:"forceAll",3:"loud"},
  e:"Hướng dẫn nhạy từ khóa trong system prompt có thể lấn át mô tả tool tốt. Tắt Grep hay ép tool trên mọi request đều gây tác dụng phụ." },
{ s:6,d:2,t:"2.2",
  q:"A code-indexing subagent hits a brief timeout on one of several calls to its MCP server. How should the error be handled?",
  o:["The subagent retries locally, and propagates only an unresolved failure with partial results and what it attempted.",
     "The subagent reports `search unavailable` straight away and lets the coordinator work out what should happen next.",
     "The subagent returns an empty list marked as success so that the coordinator's workflow is not interrupted at all.",
     "The subagent ends the whole workflow, because any tool failure means that later results cannot be trusted at all."],
  a:[0], x:{1:"generic",2:"fakeOk",3:"abort"},
  e:"Lỗi tạm thời nên được xử lý cục bộ ở subagent; chỉ chuyển lên những lỗi không xử lý được, kèm kết quả một phần và điều đã thử." },
{ s:6,d:2,t:"2.3",
  q:"The agent must always run `detect_project_type` before any other tool on its first turn, and then choose freely among other tools afterward. How should you configure this?",
  o:["Force `detect_project_type` with `tool_choice` on the first request, then use `auto` on the follow-up turns.",
     "Set `tool_choice` to `any` for all requests and describe in the system prompt which tool should come first.",
     "Set `tool_choice` to `auto` and place `detect_project_type` first in the tool array so that it is favored.",
     "Force `detect_project_type` with `tool_choice` on all requests so that the required order can never be broken."],
  a:[0], x:{1:"anyPick",2:"autoForce",3:"forceAll"},
  e:"Ép tool cụ thể ở lượt đầu đảm bảo thứ tự, rồi trả về `auto` ở các lượt sau. Ép trên mọi request thì không thể gọi tool khác." },
{ s:6,d:2,t:"2.4",multi:true,
  q:"Your team needs a shared GitHub MCP server, and one engineer wants to try an experimental local server. Credentials must not be committed. Which TWO configurations are correct?",
  o:["Put the shared server in the project's `.mcp.json`, using `${GITHUB_TOKEN}` environment variable expansion.",
     "Put the experimental server in the engineer's user-scoped `~/.claude.json` so that teammates are not affected.",
     "Put the shared server in `.mcp.json` with the real token value inline, and restrict the repository's visibility.",
     "Put the shared server in each engineer's `~/.claude.json` so that its tokens stay out of the repository.",
     "Put the experimental server in `.mcp.json` and ask teammates to ignore it when it appears in their sessions."],
  a:[0,1], x:{2:"hardToken",3:"userLevel"},
  e:"Server dùng chung đặt ở `.mcp.json` với biến môi trường; server thử nghiệm cá nhân đặt ở `~/.claude.json`. Token thật không bao giờ được commit." },
{ s:6,d:2,t:"2.4",
  q:"The agent spends many calls exploring what schemas exist before it can answer database questions. How can your MCP server best reduce this exploration?",
  o:["Expose the catalog of database schemas as MCP resources so the agent can see what is available up front.",
     "Add a `try_query` tool that lets the agent test table names until it discovers which ones actually exist.",
     "Paste every schema definition into the system prompt so that it is available to the agent on every request.",
     "Raise the agent's iteration limit so that exploratory calls can complete before it has to produce an answer."],
  a:[0],
  e:"MCP resources giúp agent thấy danh mục nội dung sẵn có, giảm lời gọi dò đường. Dán toàn bộ schema vào prompt tốn context trên mọi request." },
{ s:6,d:2,t:"2.5",multi:true,
  q:"The agent must find all `*.controller.ts` files and then every place that calls `chargeCard`. Later, an Edit on a repeated code block fails because its anchor text is not unique. Which TWO tool choices are correct?",
  o:["Use Glob for the file-name pattern and Grep for the callers of `chargeCard`.",
     "Use Read to load the whole file and then Write the corrected contents when Edit fails.",
     "Use Grep for the file-name pattern and Glob for locating the callers of the function.",
     "Use Read on all source files upfront, then scan through them to find the callers.",
     "Retry the same Edit call until the file changes enough for the anchor to become unique."],
  a:[0,1], x:{3:"readAll",4:"sameRetry"},
  e:"Glob tìm theo tên file, Grep tìm theo nội dung. Khi Edit không tìm được đoạn neo duy nhất thì dùng Read rồi Write." },
{ s:6,d:3,t:"3.3",
  q:"Terraform conventions take 300 lines, and the repository's Terraform code lives under `infra/` and `services/*/deploy/`. How should you ensure that the conventions load only when relevant?",
  o:["Use a `.claude/rules/terraform.md` file with `paths` globs matching both locations.",
     "Add the conventions to the root `CLAUDE.md`, and mention that they apply only to Terraform files.",
     "Create one skill and tell developers to run it each time they are about to edit Terraform.",
     "Put the conventions in the personal `~/.claude/CLAUDE.md` of each engineer who works on Terraform."],
  a:[0], x:{3:"userLevel"},
  e:"Rule với `paths` chỉ nạp khi sửa file khớp, và một file bao được nhiều vị trí. Root `CLAUDE.md` luôn nạp; skill phụ thuộc thao tác thủ công." },
{ s:6,d:3,t:"3.5",
  q:"You ask for a tool that converts legacy config files into YAML. Two prose rewrites of your request still produce inconsistent key naming. What is the most effective next step?",
  o:["Provide two or three concrete examples of input config and the exact YAML you expect from each.",
     "Rewrite the description again in stronger language that insists on perfectly consistent key names.",
     "Lower the temperature so that repeated runs of the conversion are more likely to agree with one another.",
     "Ask Claude to run the conversion several times, then merge the most common key name from each run."],
  a:[0], x:{1:"loud",2:"temp",3:"runTwice"},
  e:"Khi mô tả bằng lời cho kết quả không ổn định, 2–3 ví dụ đầu vào/đầu ra cụ thể là cách truyền đạt hiệu quả nhất." },
{ s:6,d:3,t:"3.6",
  q:"A nightly job runs Claude Code to generate boilerplate tests, but the job hangs waiting for input and downstream tooling cannot parse its output reliably. Which invocation addresses both problems?",
  o:["Run with `-p` for non-interactive mode, plus `--output-format json` and `--json-schema` for structured output.",
     "Run with `--resume` from the previous night's session, and pipe the terminal output through a regex parser.",
     "Run in an interactive terminal multiplexer, and have a script press Enter whenever the job stops for input.",
     "Run with `--output-format json` only, because structured output also disables all interactive prompting."],
  a:[0], x:{1:"regexMd"},
  e:"`-p` tránh treo chờ nhập; `--output-format json` với `--json-schema` tạo đầu ra có cấu trúc máy đọc được. JSON output một mình không thay được `-p`." },
/* ===== Structured Data Extraction ===== */
{ s:4,d:4,t:"4.1",
  q:"Your validator prompt says `flag only suspicious line items`. Reviewers report that the flags vary widely and that many are harmless. What should you change?",
  o:["Define explicit categories to flag and skip, such as quantity times price not matching the line total.",
     "Add `only report high-confidence issues` to the prompt so that weak flags are filtered out of the results.",
     "Raise the model's temperature slightly, so that it explores more possibilities before reaching its decision.",
     "Tell the model to be conservative, and include a reminder that reviewers' time is valuable and limited."],
  a:[0], x:{1:"vague",3:"vague"},
  e:"Tiêu chí cụ thể theo loại cải thiện độ chính xác; những lời dặn chung như thận trọng hay chỉ báo khi chắc chắn thì không." },
{ s:4,d:4,t:"4.1",
  q:"The `currency mismatch` flag is right almost every time, but the `unusual vendor` flag is mostly wrong, and reviewers have started ignoring all flags. What should you do first?",
  o:["Temporarily disable the `unusual vendor` category to restore trust while you refine its criteria.",
     "Show only the top five flags on each document so that reviewers are presented with fewer items.",
     "Keep every category enabled and add a confidence score, so that reviewers can judge each flag.",
     "Remove all categories except for one and rebuild the flagging system from the very beginning."],
  a:[0], x:{1:"limitN",2:"confidence",3:"redo"},
  e:"Một nhóm có tỷ lệ báo sai cao làm giảm niềm tin vào cả nhóm tốt; tắt tạm nhóm đó rồi cải thiện tiêu chí." },
{ s:4,d:4,t:"4.2",
  q:"Measurements in delivery notes appear as `2 doz`, `half a pallet`, or `approx 40`, and the extraction model sometimes invents exact numbers. Which technique best targets this?",
  o:["Add few-shot examples showing how informal measurements are extracted, including when to report them as approximate.",
     "Add a sentence telling the model to never hallucinate and to double check every number it writes in the result.",
     "Increase `max_tokens` so that the model has more room to reason about each informal measurement that it sees.",
     "Remove the quantity field from the schema and have the review team enter those values by hand after extraction."],
  a:[0], x:{1:"loud",2:"big",3:"dropValidation"},
  e:"Few-shot giúp giảm ảo giác trong trích xuất khi cách viết đa dạng. Lời dặn chung hay tăng token không dạy được cách xử lý trường hợp mơ hồ." },
{ s:4,d:4,t:"4.2",
  q:"Extraction returns null for `payment_terms` on documents where terms appear in a footnote, although it works when terms appear in a table. What is the most effective fix?",
  o:["Add examples demonstrating correct extraction from documents with footnotes as well as tables.",
     "Make `payment_terms` a required field so that the model must always return a value for it.",
     "Retry each null result several times with the same prompt until a value finally appears.",
     "Convert the field to free text, and instruct the model to summarize whatever terms it finds."],
  a:[0], x:{1:"requiredMissing",2:"sameRetry",3:"freeText"},
  e:"Few-shot với nhiều cấu trúc tài liệu xử lý được null do bố cục khác nhau. Bắt buộc trường có thể khiến model bịa giá trị." },
{ s:4,d:4,t:"4.3",
  q:"You have separate extraction tools for invoices, contracts, and statements, and the document type is unknown. You need guaranteed structured output with no conversational reply. Which `tool_choice` should you use?",
  o:["`any`, so the model must call one of the extraction tools while still selecting which one fits.",
     "`auto`, so the model can decide whether calling an extraction tool is needed for this document.",
     "A forced selection of the invoice tool, with a schema that treats all contract fields as optional.",
     "No tools at all, with a system prompt that insists the reply must be valid JSON and nothing else."],
  a:[0], x:{1:"autoForce",3:"loud"},
  e:"`any` đảm bảo có tool call nhưng để model chọn schema phù hợp. `auto` có thể trả text; ép một tool thì sai loại tài liệu." },
{ s:4,d:4,t:"4.3",multi:true,
  q:"Purchase orders only sometimes include a `cost_center`, and categories change as new expense types appear. Reviewers have found invented cost centers. Which TWO schema changes are appropriate?",
  o:["Make `cost_center` optional and nullable so that absent values need not be fabricated.",
     "Use an enum for category that includes `other` plus a detail string for new expense types.",
     "Make `cost_center` required and instruct the model to write `N/A` whenever none is present.",
     "Replace the category enum with free text so that any new expense type can be written freely.",
     "Remove schema validation from `cost_center` so that the model can decide on its own format."],
  a:[0,1], x:{2:"na",3:"freeText",4:"dropValidation"},
  e:"Trường có thể vắng nên là nullable để model không bịa; enum có `other` kèm chi tiết giúp mở rộng mà vẫn có cấu trúc." },
{ s:4,d:4,t:"4.3",
  q:"After moving to `tool_use` with a strict JSON schema, JSON syntax errors disappeared, but some invoices still have line items that do not add up to the total. How should you interpret this?",
  o:["Schemas eliminate syntax errors but not semantic ones, so you still need validation logic for arithmetic.",
     "The schema is too loose, and adding more `required` fields will prevent the arithmetic inconsistencies.",
     "`tool_use` was misconfigured, because a strict schema guarantees that all output values are correct.",
     "The model needs a larger `max_tokens` value so that it can finish calculating each of the totals."],
  a:[0], x:{1:"requiredMissing",3:"big"},
  e:"Schema đảm bảo đúng cấu trúc chứ không đảm bảo đúng ngữ nghĩa, nên vẫn cần kiểm tra tổng, vị trí trường bằng logic riêng." },
{ s:4,d:4,t:"4.4",multi:true,
  q:"Validation fails on two extractions. In document A, `invoice_date` was returned as `03/2/24` although ISO format is required. In document B, `po_number` exists only in a separate purchase order that was not provided. Which TWO actions are correct?",
  o:["Retry document A, sending the original document, the failed extraction, and the specific format error.",
     "Route document B to human review or return null, since retrying cannot find information that is absent.",
     "Retry document B with a stronger instruction telling the model to look more carefully through the document.",
     "Retry document A with the unchanged prompt, because format problems usually clear up on a second attempt.",
     "Ask the model to infer document B's `po_number` from the supplier's previous purchase order numbers."],
  a:[0,1], x:{2:"searchMore",3:"sameRetry",4:"guess"},
  e:"Lỗi định dạng sửa được bằng retry kèm phản hồi cụ thể. Thông tin không có trong nguồn thì retry vô ích, nên chuyển người duyệt hoặc trả null." },
{ s:4,d:4,t:"4.4",
  q:"A statement shows a stated total that differs from the sum of its entries, and you need downstream systems to know when this occurs. Which design is best?",
  o:["Extract `calculated_total` alongside `stated_total`, and set a `conflict_detected` flag when they differ.",
     "Average the stated total and the calculated sum so that the downstream value is reasonably balanced.",
     "Keep the larger of the two totals so that liabilities are less likely to be understated by the system.",
     "Retry the extraction until the two values agree, then pass along the value that finally matches."],
  a:[0], x:{1:"average",2:"pickOne",3:"retryMore"},
  e:"Trích xuất cả giá trị tính toán và giá trị ghi trên tài liệu, gắn cờ khi lệch. Lấy trung bình, chọn số lớn hay retry đều che giấu mâu thuẫn trong nguồn." },
{ s:4,d:4,t:"4.5",
  q:"A compliance team needs extraction results within 30 hours of each document's arrival. The Message Batches API can take up to 24 hours. What submission plan meets this requirement?",
  o:["Submit a batch every 4 hours, so that the longest wait plus processing fits within 30 hours.",
     "Submit one batch every 24 hours, because the processing window is within the 30-hour limit.",
     "Submit one batch every 12 hours, because most batches finish far sooner than the maximum.",
     "Submit documents through the synchronous API only, because batches have no latency guarantee."],
  a:[0],
  e:"Thời gian chờ tối đa bằng khoảng gửi cộng 24 giờ xử lý: gửi mỗi 4 giờ thì tối đa 28 giờ (hoặc tối đa 6 giờ khoảng gửi cho 30 giờ). Gửi 12 hoặc 24 giờ có thể vượt hạn." },
{ s:4,d:4,t:"4.5",
  q:"Of 10,000 documents in a batch, 140 failed because they exceeded context limits. What is the most efficient recovery?",
  o:["Identify the failed items by `custom_id`, and resubmit only those documents after chunking them.",
     "Resubmit the entire batch with a larger `max_tokens` value so that all of the documents are retried.",
     "Match failed responses to documents by their position, and resubmit those positions unchanged.",
     "Move the whole pipeline to synchronous calls, because batches cannot handle any oversized documents."],
  a:[0], x:{1:"redo",2:"byOrder"},
  e:"Dùng `custom_id` để xác định các tài liệu lỗi, chỉ gửi lại chúng với chỉnh sửa phù hợp như chia nhỏ. Không ghép theo vị trí vì thứ tự kết quả không được đảm bảo." },
{ s:4,d:5,t:"5.3",
  q:"In a multi-step pipeline, the OCR subagent times out on page 7 of a 40-page contract. What should it return to the coordinator?",
  o:["The failure type, the page attempted, the text from the other pages, and any alternative it could use.",
     "An empty extraction marked as a success so that the coordinator's remaining steps are able to proceed.",
     "A general status of `OCR unavailable`, leaving the coordinator to decide what should be done about it.",
     "Nothing at all, and the pipeline should stop, since one failed page makes the entire contract invalid."],
  a:[0], x:{1:"fakeOk",2:"generic",3:"abort"},
  e:"Ngữ cảnh lỗi có cấu trúc (loại lỗi, đã thử gì, kết quả một phần, phương án khác) giúp coordinator quyết định khôi phục." },
{ s:4,d:5,t:"5.5",multi:true,
  q:"Overall extraction accuracy is 97%, and management wants to remove human review of high-confidence results. Which THREE practices should come first?",
  o:["Analyze accuracy by document type and field to confirm that performance is consistent across segments.",
     "Calibrate field-level confidence thresholds against a labeled validation set before routing on them.",
     "Continue stratified random sampling of high-confidence extractions to measure error rates and new patterns.",
     "Treat the 97% overall accuracy as sufficient evidence, because the sample size is already very large.",
     "Use the model's uncalibrated confidence scores directly as the threshold for removing human review.",
     "Remove review for every document type at once, so that the savings are measured under real conditions."],
  a:[0,1,2], x:{3:"aggregate",4:"confidence",5:"aggregate"},
  e:"Accuracy tổng có thể che giấu kết quả kém ở từng loại tài liệu hoặc trường. Cần phân tích theo phân khúc, hiệu chỉnh ngưỡng bằng tập có nhãn và lấy mẫu phân tầng liên tục." },
{ s:4,d:5,t:"5.6",
  q:"Two supplier documents report different annual volumes for the same contract: one dated 2023 and one dated 2025. The extraction step passes the results to a summary step. What should the extraction output include?",
  o:["Both values, each with its source document and date, so the difference can be interpreted correctly.",
     "Only the value from the newest document, because more recent data always replaces the older data.",
     "The average of the two values, noted as an estimate that covers both of the reporting periods.",
     "Only the larger value, so that any capacity planning downstream will be sufficiently conservative."],
  a:[0], x:{1:"pickOne",2:"average",3:"pickOne"},
  e:"Giữ cả hai giá trị kèm nguồn và ngày. Khác biệt về thời gian có thể không phải mâu thuẫn, và bước sau cần đủ thông tin để xử lý." },
{ s:4,d:2,t:"2.2",
  q:"A `fetch_contract` tool can fail because the document ID is malformed or because the caller lacks permission for that vault. The extraction agent currently retries both. What should the tool return?",
  o:["Structured errors with a category of validation or permission and a flag showing that neither is retryable.",
     "A generic failure message for both, with details written to the server log for the operations team to read.",
     "An empty document for both, so that the agent proceeds to the next file without interrupting the batch.",
     "A transient category for both, so that the agent's existing backoff logic can handle either of the cases."],
  a:[0], x:{1:"generic",2:"fakeOk",3:"retryPolicy"},
  e:"Lỗi validation và permission không nên retry nguyên trạng; metadata có cấu trúc giúp agent chọn cách xử lý đúng." }
]});

{ s:2,d:1,t:"1.2",

{ s:2,d:1,t:"1.2",

{ s:2,d:1,t:"1.2",multi:true,
  q:"A coordinator handles both `who founded this journal?` and `compare global carbon pricing schemes`. Which TWO coordinator behaviors are appropriate?",
  o:["Select only the subagents each query needs, so that the simple question skips most of the pipeline.",

  a:[0,1], x:{3:"peer"},
  e:"Coordinator chọn subagent theo độ phức tạp và phân rã câu hỏi rộng đủ độ phủ. Luôn chạy đủ pipeline là lãng phí; subagent không tự thương lượng với nhau." },
{ s:2,d:1,t:"1.3",
  q:"The synthesis subagent writes unsupported claims even though the search subagent found good sources. Logs show the coordinator told it only `Summarize what the search agent found.` What is the most likely cause?",
  o:["Subagents do not inherit context, so the coordinator must include the actual findings in the synthesis prompt.",

     "The coordinator needs to run the synthesis subagent twice so that the second run can correct the first draft."],
  a:[0], x:{1:"overTool",3:"runTwice"},
  e:"Subagent có ngữ cảnh cô lập: phải đưa toàn bộ phát hiện vào prompt. Cấp web search cho synthesis là sai vai trò và không giải quyết thiếu dữ liệu đầu vào." },
{ s:2,d:1,t:"1.3",
  q:"Findings passed between subagents arrive as paragraphs in which source details are mixed into the prose, and citations get lost. How should the handoff be redesigned?",
  o:["Use structured data that separates each claim's content from metadata such as URL, document name, and page.",

{ s:2,d:1,t:"1.6",
