ion outcomes."], "a": 3, "sk": ["occasional external account lookup"], "note": "Kiểm độ biến thiên các bước, đồ thị phụ thuộc, tác động tool → quyết định workflow hay agent. Bẫy: {A}/{B}/{C}.", "ex": "Đáp án đúng: D. Inspect step variability, dependency graph, tool side effects, missing-information branches and evaluation outcomes. This evidence distinguishes the stated failure from nearby integration problems. Framework abstractions are not a replacement for understanding where control flow, tool execution and state reside. The appropriate response is: Select an agent tool-use loop for branching information needs while retaining a fixed chain for stable transformation sequences and explicit checkpoints. Situation: A ticket classifier always translates then categorizes text but a new requirement adds occasional external account lookup.\n\nNguồn: PrepAway CCDV-F Practice Test 7, Question 64."}, {"n": 81, "cat": "E", "topic": 3, "q": "A developer force-pushes a new prompt and overwrites the last passing evaluation baseline. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect manifest versions, dependency availability, plugin scopes, installation logs and upgrade notes.", "Inspect repository diffs, test reports, secrets scanning, dependency lockfiles and reviewer decisions.", "Inspect module boundaries, unit-test seams, shared mutable state, transport mocks and error translation.", "Inspect input size, file provenance, malicious instructions, escaping, content classifications and rejection behavior."], "a": 1, "sk": ["overwrites the last passing evaluation baseline"], "note": "Kiểm diff repo, báo cáo test, review → prompt quản lý như code. Bẫy: {A} plugin, {C} module, {D} input.", "ex": "Đáp án đúng: B. Inspect repository diffs, test reports, secrets scanning, dependency lockfiles and reviewer decisions. This evidence distinguishes the stated failure from nearby integration problems. Unreviewed changes to model prompts or tool permissions are software changes even if no compiled code is modified. The appropriate response is: Track application and prompt changes through reviewed commits, reproducible dependency locks and focused pull requests with passing tests. Situation: A developer force-pushes a new prompt and overwrites the last passing evaluation baseline.\n\nNguồn: PrepAway CCDV-F Practice Test 7, Question 67."}, {"n": 82, "cat": "E", "topic": 4, "q": "A simple sentiment classifier enables maximum effort and misses its response-time target. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect item independence, batch identifiers, completion deadlines, failed records and total cost.", "Inspect API key scope, authorization headers, expiry/revocation, secret storage and server logs.", "Inspect model generation settings, task constraints, repeated responses, and deterministic downstream validators.", "Inspect model capabilities, effort options, output usage, latency budgets and request-validation errors."], "a": 3, "sk": ["enables maximum effort and misses its response-time target"], "note": "Việc đơn giản bật effort tối đa → kiểm capability, effort, độ trễ. Bẫy: {A} batch, {B} API key, {C} cài đặt sinh.", "ex": "Đáp án đúng: D. Inspect model capabilities, effort options, output usage, latency budgets and request-validation errors. This evidence distinguishes the stated failure from nearby integration problems. Reasoning effort is a resource and compatibility choice; increasing it is not a substitute for external validation. The appropriate response is: Select supported thinking or effort settings according to task complexity, latency and available token budgets; do not assume all models accept identical options. Situation: A simple sentiment classifier enables maximum effort and misses its response-time target.\n\nNguồn: PrepAway CCDV-F Practice Test 8, Question 71."}, {"n": 83, "cat": "T", "topic": 5, "q": "A team needs lint and test commands permitted automatically while deployment commands require review. Which TWO complementary actions provide an appropriate solution and the evidence needed to verify it? Select TWO.", "o": ["Inspect effective settings.json, permission rules, inherited policies, allowed tools and environment overrides.", "Two concurrent customers receive correct independent histories and cannot obtain each other's secrets or files.", "Inspect stop_reason, response blocks, token budgets, tool call IDs and continuation policy.", "Use scoped settings and environment-specific permission policies instead of granting all shell and file operations by default.", "Package repeatable instructions and external tools with pinned dependencies, documented install steps and permission reviews for consumers."], "a": [0, 3], "sk": ["deployment commands require review"], "note": "Chọn 2: kiểm settings.json, quy tắc quyền hiệu lực ({A}) + quyền theo phạm vi/môi trường ({D}). Bẫy: {B}/{C}/{E}.", "ex": ", D\nĐáp án đúng: A, D. Inspect effective settings.json, permission rules, inherited policies, allowed tools and environment overrides. This evidence distinguishes the stated failure from nearby integration problems. Configuration settings control behavior but should not be confused with external service authorization. The appropriate response is: Use scoped settings and environment-specific permission policies instead of granting all shell and file operations by default. This supplies the verification side of the complementary pair. Situation: A team needs lint and test commands permitted automatically while deployment commands require review.\n\nNguồn: PrepAway CCDV-F Practice Test 8, Question 74."}, {"n": 84, "cat": "E", "topic": 1, "q": "A document pipeline needs free-form investigation only for unmatched vendor clauses; all ordinary matches follow a fixed rule. Which observed result BEST demonstrates the requirement has been satisfied?", "o": ["A completed task ends after a verified result; repeated failed calls terminate with an actionable diagnosis instead of looping.", "A controlled agent run reaches the intended goal with attributable tools and no access beyond its allowed environment.", "The process takes reproducible paths for predictable cases and invokes model-directed planning only for approved ambiguous cases.", "A prohibited operation is blocked even when the model asks to proceed, and the hook emits an auditable explanation."], "a": 2, "sk": ["free-form investigation only for unmatched vendor clauses"], "note": "Kết quả đúng: ca dự đoán được đi đường cố định, chỉ ca lạ mới để model tự lập kế hoạch. Bẫy: {A}/{B}/{D}.", "ex": "Đáp án đúng: C. The process takes reproducible paths for predictable cases and invokes model-directed planning only for approved ambiguous cases. This result checks an observable acceptance criterion instead of only confirming a model made a claim. An agent incurs unpredictable tool trajectories and costs; workflow orchestration remains preferable when control flow is specified in advance. Situation: A document pipeline needs free-form investigation only for unmatched vendor clauses; all ordinary matches follow a fixed rule.\n\nNguồn: PrepAway CCDV-F Practice Test 8, Question 77."}, {"n": 85, "cat": "T", "topic": 2, "q": "A team repeats the same release checklist in chat instead of packaging a reusable project skill. Which TWO complementary actions provide an appropriate solution and the evidence needed to verify it? Select TWO.", "o": ["Inspect memory writes, expiration policy, sensitive fields, retrieval accuracy, and loss of decision-critical state during compaction.", "Use the CLAUDE.md hierarchy, repository context and explicit task scope so Claude Code follows the correct local development conventions.", "Inspect instruction locations, skill resources, agent role definitions and effective allowed tools.", "Use Rules for persistent constraints, Skills for repeatable task guidance and specialized agents for bounded delegated subtasks.", "The
