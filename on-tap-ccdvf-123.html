 quan trọng bị \"vùi lấp\"). Giải pháp kiến trúc chuẩn là sử dụng chiến lược context management (tóm tắt kết quả cũ, nén lịch sử hoặc xóa bỏ/cắt tỉa các payload chi tiết không còn cần thiết) để giữ ngữ cảnh gọn gàng và tập trung vào trạng thái hiện tại.\n\nTại sao các phương án khác sai\nA: Đổi framework không giải quyết triệt để bản chất cách LLM xử lý thông tin dài và tốn công sức làm lại.\n\nB: Gộp công cụ làm giảm tính đơn nhiệm (single-responsibility) của công cụ, khiến mô hình khó chọn đúng hành vi và phức tạp hóa tham số.\n\nC: Tiếp tục tăng dung lượng ngữ cảnh chỉ làm trầm trọng thêm hiện tượng thông tin bị vùi lấp (bắt được ít thông tin cốt lõi hơn) và tăng đáng kể chi phí/độ trễ."}, {"n": 27, "cat": "T", "topic": 6, "q": "Your team is integrating Claude into an existing REST API service. The service handles concurrent requests, and you are deciding how to structure the Claude API calls within the existing async codebase. How would you structure the Claude calls?", "o": ["Run Claude API calls in a separate thread pool isolated from the rest of the service so the main event loop is not affected.", "Replace the existing async REST service with a synchronous service to match the call style of synchronous Claude SDK clients.", "Use the Claude SDK's async client and structure Claude calls as awaitable operations alongside the rest of the service's async code.", "Make synchronous Claude API calls and block the async event loop until each call completes before processing the next request."], "a": 2, "sk": ["existing async codebase"], "note": "Service async → dùng async client của SDK, gọi Claude dạng await. Bẫy: {D} gọi đồng bộ chặn event loop, {B} đổi sang sync, {A} thread pool riêng.", "ex": "Đáp án đúng là C: Use the Claude SDK's async client and structure Claude calls as awaitable operations alongside the rest of the service's async code. Dịch câu hỏi:Đội ngũ của bạn đang tích hợp Claude vào một dịch vụ REST API hiện có. Dịch vụ này xử lý nhiều yêu cầu đồng thời (concurrent requests) và bạn đang quyết định cách tổ chức các lời gọi Claude API trong cơ sở mã bất đồng bộ (async codebase) hiện tại. Bạn sẽ tổ chức các lệnh gọi Claude như thế nào? Giải thích:\n\nĐáp án C (Đúng): Claude SDK cung cấp sẵn client bất đồng bộ (AsyncAnthropic trong Python hoặc hỗ trợ async/await trong Node.js/TypeScript). Việc sử dụng client bất đồng bộ chính thức giúp tích hợp mượt mà các lệnh gọi Claude như những thao tác chờ được (awaitable operations) mà không làm tắc nghẽn vòng lặp sự kiện (event loop) của dịch vụ hiện tại.\n\nĐáp án A (Sai): Đưa lời gọi API I/O-bound vào thread pool độc lập là không cần thiết và tốn tài nguyên hệ thống so với việc sử dụng cơ chế async/await có sẵn của ngôn ngữ.\n\nĐáp án B (Sai): Chuyển toàn bộ dịch vụ async sang đồng bộ (synchronous) là một quyết định kiến trúc sai lầm, làm giảm mạnh khả năng xử lý đồng thời của REST API service.\n\nĐáp án D (Sai): Gọi API đồng bộ và chặn (block) event loop sẽ làm ngưng trệ toàn bộ hệ thống, khiến ứng dụng không thể xử lý các request khác trong lúc chờ Claude phản hồi."}, {"n": 28, "cat": "E", "topic": 3, "q": "A teammate is debugging a Claude application whose system prompt has grown to several hundred lines and now contains overlapping, contradictory, and obsolete instructions. How would you advise the teammate?", "o": ["Add more explicit instructions so the most recent rules dominate the model's interpretation of the prompt during each request.", "Audit the prompt for overlap, contradiction, and obsolete content, then refactor so each instruction is clear, current, and non-redundant.", "Tighten only the contradictory rules first, treating the overlap and obsolete content as lower-priority work the team can address later.", "Split the prompt across multiple system prompts so the model sees a smaller portion at any given time."], "a": 1, "sk": ["overlapping, contradictory, and obsolete instructions"], "note": "Rà soát chồng chéo/mâu thuẫn/lỗi thời rồi refactor. Bẫy: {A} thêm luật mới, {C} chỉ sửa phần mâu thuẫn, {D} chia nhiều system prompt.", "ex": "Đáp án đúng là B: Audit the prompt for overlap, contradiction, and obsolete content, then refactor so each instruction is clear, current, and non-redundant. Giải thích:\n\nĐáp án B (Đúng): Khi một system prompt trở nên quá dài và chứa các hướng dẫn mâu thuẫn, đè lên nhau hoặc đã cũ, giải pháp chuẩn và triệt để nhất là kiểm tra (audit) toàn bộ nội dung, loại bỏ sự trùng lặp/mâu thuẫn, và tái cấu trúc (refactor) để đảm bảo mỗi hướng dẫn đều rõ ràng, cập nhật và không dư thừa.\n\nĐáp án A (Sai): Thêm nhiều hướng dẫn hơn chỉ làm tăng độ nhiễu và độ dài của prompt, khiến mô hình dễ bị nhầm lẫn hơn thay vì giải quyết các mâu thuẫn hiện có.\n\nĐáp án C (Sai): Chỉ sửa các quy tắc mâu thuẫn mà bỏ qua phần trùng lặp và nội dung cũ sẽ khiến system prompt tiếp tục cồng kềnh, tốn token không cần thiết và dễ gây ra lỗi trong tương lai.\n\nĐáp án D (Sai): Claude API chỉ hỗ trợ một chuỗi system prompt chính (hoặc hợp nhất các khối system prompt); việc cố gắng chia nhỏ thành \"nhiều system prompt\" không đúng với cơ chế hoạt động và không giải quyết được xung đột logic giữa các câu lệnh."}, {"n": 29, "cat": "T", "topic": 2, "q": "The team is debating whether to build a new capability as a custom tool or to use an existing built-in tool that nearly covers the use case but lacks one specific feature. How would you decide?", "o": ["Evaluate whether the missing feature can be addressed by extending the built-in tool or warrants a custom tool, then choose accordingly.", "Identify whether the team has previously built similar custom tools and use those precedents to determine which approach is more consistent with the existing codebase.", "Examine the custom tool option by scoping the implementation effort and determining whether the additional flexibility justifies the development and maintenance cost.", "Review the built-in tool's documentation and assess whether its existing capabilities are sufficient to cover the use case without any modification or extension."], "a": 0, "sk": ["nearly covers the use case but lacks one specific feature"], "note": "Xem có mở rộng built-in được không trước khi viết custom tool. Bẫy: {B}/{C}/{D} chỉ nhìn một phía.", "ex": "Đáp án chính xác: A\n\nGiải thích:\n\nBản chất vấn đề (A): Khi một công cụ built-in đã đáp ứng gần đủ yêu cầu (nearly covers the use case), bước quyết định chuẩn mực là xem xét khả năng mở rộng/tùy biến tính năng còn thiếu đó từ công cụ built-in (ví dụ: bọc thêm logic, bổ sung wrapper/extension) trước khi quyết định viết hẳn một custom tool từ đầu. Điều này giúp tối ưu hóa công sức phát triển mà vẫn đảm bảo đủ tính năng.\n\nTại sao các phương án khác chưa tối ưu\nB: Dựa vào tiền lệ quá khứ không giải quyết trực tiếp bài toán kỹ thuật hiện tại của công cụ.\n\nC: Chỉ tập trung đánh giá phương án custom tool mà bỏ qua việc xem xét khả năng mở rộng công cụ tích hợp sẵn.\n\nD: Đề bài đã khẳng định công cụ built-in đang thiếu một tính năng cụ thể, nên việc đánh giá xem nó có đủ mà không cần sửa đổi gì là không thực tế với đề bài."}, {"n": 30, "cat": "T", "topic": 6, "q": "You are building a Claude application that needs to maintain a persistent connection to a service that streams real-time updates. The team is unsure what communication pattern to use. Which communication pattern would you use?", "o": ["Repeated short-lived HTTP polling requests, where the application opens a new HTTP connection each time it checks for updates.", "A WebSocket, because WebSockets are designed for bidirectional, persistent, real-time communication between the client and the streaming service.", "A single long HTTP request the server holds open indefinitely, with no standard WebSocket framing on the connection.", "File-based communication where the service writes new updates to disk and the application polls the file system for changes."], "a": 1, "sk": ["streams real-time updates"], "note": "Kết nối lâu dài, hai chiều, real-time → WebSocket. Bẫy: {A} polling, {C} giữ một HTTP request mãi, {D} ghi file.", "ex": "Đáp án chính xác: B\n\nGiải thích:\n\nWebSocket (B): Đây là công nghệ chuẩn được thiết kế riêng cho việc duy trì kết nối hai chiều (bidirectional), liên tục (persistent) và có độ độ trễ thấp giữa client và server để truyền dữ liệu thời gian thực (real-time streaming).\n\nTại sao các phương án khác sai\nA (HTTP Polling): Tạo ra nhiều overhead lớn do phải đóng/mở kết nối liên tục, tốn tài nguyên và không tối ưu cho dữ liệu thời gian thực.\n\nC (HTTP Long-Polling không tiêu chuẩn): Thiếu tính chuẩn hóa, khó quản lý trạng thái kết nối và xử lý lỗi không hiệu quả bằng kết nối WebSocket chuẩn hoặc SSE.\n\nD (File-based Polling): Quá chậm, tạo độ trễ cao I/O trên ổ đĩa và không phù hợp cho ứng dụng phát luồng thời gian thực."}, {"n": 31, "cat": "E", "topic": 1, "q": "You are designing an agent that handles a multi-step research task. You want the agent to break the task into smaller pieces, hand each piece to a focused subagent, and consolidate the results. The agent pattern you would apply is...", "o": ["An orchestrator and subagent pattern with specialized subagents assigned to each subtask.", "A memory pattern that stores the entire research history in advance, before any subtask begins execution.", "A context-window pruning pattern that drops each subtask's content after the agent moves on.", "A single tool-use loop that includes every tool the agent might need across all subtasks."], "a": 0, "sk": ["hand each piece to a focused subagent"], "note": "Chia nhỏ, giao subagent chuyên biệt, tổng hợp → orchestrator + subagent. Bẫy: {D} một vòng lặp tool, {B}/{C} pattern bộ nhớ/cắt context.", "ex": "Đáp án đúng là A: An orchestrator and subagent pattern with specialized subagents assigned to each subtask. Dịch câu hỏi:Bạn đang thiết kế một agent xử lý tác vụ nghiên cứu gồm nhiều bước. Bạn muốn agent chia nhỏ tác vụ thành các phần nhỏ hơn, giao từng phần cho một subagent chuyên biệt, và tổng hợp kết quả lại. Mẫu agent (agent pattern) bạn sẽ áp dụng là... Giải thích:\n\nĐáp án A (Đúng): Mô hình Orchestrator-subagent pattern (điều phối viên và agent phụ) chính là kiến trúc thiết kế chuẩn cho bài toán này. Trong đó, Orchestrator đóng vai trò phân tích yêu cầu, chia nhỏ nhiệm vụ, phân công cho các subagent chuyên biệt xử lý độc lập và thu thập/tổng hợp kết quả cuối cùng.\n\nĐáp án B (Sai): Lớp lưu trữ lịch sử (memory pattern) không có nhiệm vụ phân rã tác vụ hay điều phối xử lý.\n\nĐáp án C (Sai): Cắt tỉa cửa sổ ngữ cảnh (context-window pruning) chỉ là kỹ thuật tối ưu hóa dung lượng bộ nhớ token, không phải mẫu thiết kế luồng xử lý agent.\n\nĐáp án D (Sai): Sử dụng một vòng lặp tool duy nhất (single tool-use loop) với tất cả các tool sẽ làm tăng độ phức tạp của prompt, giảm độ chính xác và không đáp ứng được yêu cầu chia nhỏ tác vụ cho các subagent chuyên biệt."}, {"n": 32, "cat": "T", "topic": 3, "q": "Your Claude application returns confident-sounding answers, but occasionally those answers contain factual errors that downstream systems treat as ground truth. The team is concerned about the application's confidence-versus-accuracy gap. How would you address the gap?", "o": ["Lower the model's temperature so the model's responses sound less confident and downstream systems are less likely to treat the responses as ground truth in normal operation.", "Apply skepticism toward confident output by adding validation steps, sourcing requirements, or confidence calibration before treating outputs as ground truth.", "Reject every response the application produces until a manual accuracy review is conducted on each response by a human reviewer before any downstream system uses it.", "Add a disclaimer to every output telling users to verify the accuracy of the output and treat the disclaimer as the primary mechanism for managing the confidence-versus-accuracy gap."], "a": 1, "sk": ["confidence-versus-accuracy gap"], "note": "Đa nghi với câu trả lời tự tin: thêm bước kiểm chứng, yêu cầu nguồn. Bẫy: {A} giảm temperature, {D} chỉ thêm disclaimer, {C} duyệt tay tất cả.", "ex": "Đáp án chính xác: B\n\nGiải thích:\n\nXử lý hiện tượng Hallucination / Overconfidence (B): LLM có thể đưa ra câu trả lời sai với giọng điệu rất tự tin. Giải pháp kỹ thuật chuẩn là thiết lập cơ chế kiểm soát chất lượng từ kiến trúc hệ thống: bổ sung các bước xác thực tự động (validation), yêu cầu mô hình trích dẫn nguồn tài liệu đối chiếu (RAG / sourcing), hoặc triển khai các lớp hiệu chỉnh độ tin cậy trước khi đưa dữ liệu sang các hệ thống phía sau.\n\nTại sao các phương án khác chưa tối ưu\nA: Hạ temperature giúp mô hình đưa ra câu trả lời mang tính định hướng (deterministic) hơn nhưng không làm thay đổi tone giọng tự tin hay loại bỏ triệt để các lỗi thực tế.\n\nC: Bắt con người duyệt thủ công (human-in-the-loop) 100% mọi kết quả sẽ phá hỏng tính tự động hóa và khả năng mở rộng của hệ thống.\n\nD: Thêm tuyên bố miễn trừ trách nhiệm chỉ giải quyết mặt hiển thị với người dùng cuối, không ngăn được các hệ thống phía sau (downstream systems) xử lý sai dữ liệu lỗi."}, {"n": 33, "cat": "E", "topic": 1, "q": "Your agent is processing tasks that take 30 to 60 minutes to complete. Each task has welldefined intermediate checkpoints, and the team wants the agent to be able to resume from the most recent checkpoint if a process is interrupted. How would you implement this resumability?", "o": ["Increase the agent's timeout to several hours so that interruptions become rare enough to ignore in practice.", "Apply a checkpointing pattern that persists the agent's intermediate state and reloads that state when resuming an interrupted task.", "Run two copies of the agent in parallel for every task and use whichever one finishes first as the source of truth.", "Restart the task from the beginning whenever a process is interrupted."], "a": 1, "sk": ["resume from the most recent checkpoint"], "note": "Checkpoint: lưu trạng thái trung gian, nạp lại khi resume. Bẫy: {A} tăng timeout, {C} chạy 2 bản, {D} làm lại từ đầu.", "ex": "Mô hình Checkpointing (B): Đây là thiết kế chuẩn cho các hệ thống hoặc agent xử lý tác vụ thời gian dài (long-running tasks). Việc lưu trữ trạng thái (state persistence) tại từng cột mốc cho phép hệ thống khôi phục ngay tại điểm dừng gần nhất mà không mất công sức đã xử lý trước đó.\n\nTại sao các phương án khác sai\nA: Việc tăng timeout không ngăn được các sự cố như mất kết nối mạng, lỗi hạ tầng hoặc sập nguồn.\n\nC: Chạy song song tốn gấp đôi tài nguyên và vẫn không giải quyết được vấn đề nếu cả hai cùng gặp sự cố gián đoạn hệ thống.\n\nD: Bắt đầu lại từ đầu gây lãng phí tài nguyên tính toán và thời gian (đặc biệt với các tác vụ dài 30–60 phút)."}, {"n": 34, "cat": "E", "topic": 2, "q": "Your team is choosing how to add a capability to a Claude application. You want to apply the appropriate option, whether built-in tool, custom tool, Skill, or MCP server, based on the use case. You would choose the option that...", "o": ["Is the most familiar to the team based on prior experience with similar capabilities.", "Is the newest available option among built-in tools, custom tools, Skills, and MCP servers.", "Is the easiest to build given the team's current development tools and workflows.", "Matches the use case's scope, reuse needs, and integration context."], "a": 3, "sk": ["based on the use case"], "note": "Chọn theo phạm vi, nhu cầu tái sử dụng, ngữ cảnh tích hợp. Bẫy: {A} quen thuộc, {B} mới nhất, {C} dễ làm nhất.", "ex": "Đáp án đúng là D: Matches the use case's scope, reuse needs, and integration context.\n\nGiải thích:\n\nĐáp án D (Đúng): Khi lựa chọn giữa các giải pháp mở rộng năng lực cho Claude (built-in tool, custom tool, Skill, hay MCP server), quyết định chuẩn nhất phải dựa trên phạm vi yêu cầu (scope), khả năng tái sử dụng (reuse needs), và ngữ cảnh tích hợp (integration context) của dự án.\n\nĐáp án A (Sai): Lựa chọn dựa trên thói quen hay sự quen thuộc của nhóm không bảo đảm giải pháp đó tối ưu về kiến trúc và kỹ thuật.\n\nĐáp án B (Sai): Lựa chọn chỉ vì công nghệ đó \"mới nhất\" là tư duy thiên lệch, dễ dẫn đến việc áp dụng sai mục đích.\n\nĐáp án C (Sai): Lựa chọn chỉ vì \"dễ làm nhất\" có thể bỏ qua các yếu tố quan trọng về khả năng mở rộng, bảo mật và khả năng tái sử dụng lâu dài."}, {"n": 35, "cat": "E", "topic": 6, "q": "You have just shipped a new Claude-powered application to production. The development phase is complete, and the system is now in active use by internal teams. The next phase of work for this system is...", "o": ["Retiring the system, since shipping is the final lifecycle stage for any application that reaches production.", "Running a formal post-deployment review that assesses the development phase before the team does any further work on the system.", "Operating and maintaining the system, including monitoring, responding to issues, and planning evolution.", "Handing the system over to a separate operations team that will manage it independently of the development team going forward."], "a": 2, "sk": ["The next phase of work for this system is"], "note": "Sau khi ship → vận hành, bảo trì, giám sát, xử lý sự cố. Bẫy: {A} nghỉ hưu hệ thống, {D} giao hẳn cho team khác.", "ex": "Đáp án đúng là C: Operating and maintaining the system, including monitoring, responding to issues, and planning evolution. Dịch câu hỏi:Bạn vừa triển khai một ứng dụng mới tích hợp Claude lên môi trường production. Giai đoạn phát triển đã hoàn tất và hệ thống hiện đang được các đội ngũ nội bộ sử dụng tích cực. Giai đoạn công việc tiếp theo cho hệ thống này là... Giải thích:\n\nĐáp án C (Đúng): Sau khi ứng dụng được đưa lên production, giai đoạn tiếp theo trong vòng đời ứng dụng (application lifecycle) là vận hành và bảo trì (operating and maintaining). Việc này bao gồm giám sát hiệu năng/chi phí (monitoring), xử lý các sự cố phát sinh (responding to issues), và lập kế hoạch nâng cấp/phát triển tiếp theo (planning evolution).\n\nĐáp án A (Sai): Ngừng hoạt động (retiring) hệ thống ngay sau khi vừa mới triển khai lên production là hoàn toàn vô lý.\n\nĐáp án B (Sai): Đánh giá sau triển khai (post-deployment review) có thể diễn ra nhưng không phải là giai đoạn hoạt động chính tiếp theo thay thế cho việc vận hành hệ thống.\n\nĐáp án D (Sai): Mô hình bàn giao hoàn toàn cho một đội vận hành độc lập (siloed operations) đã cũ; hiện nay các ứng dụng AI/LLM đòi hỏi sự kết hợp và liên tục cải tiến từ đội ngũ phát triển."}, {"n": 36, "cat": "T", "topic": 1, "q": "A team has deployed a multi-agent system in which a primary agent decomposes user requests and delegates subtasks to three specialized subagents: one for data retrieval, one for analysis, and one for report generation. In production, the team observes that subagents are making redundant tool calls, occasionally exceeding token budgets, and sometimes producing outputs that contradict each other - all of which the primary agent passes along without catching. What is the most appropriate way to address these failures?", "o": ["Add retry logic to each subagent so that when a tool call fails, the subagent retries automatically before escalating - and configure each subagent to log its tool calls and outputs to a shared trace so the team can audit redundancy and contradictions after the fact.", "Give each subagent read access to the other subagents' outputs so they can identify and resolve contradictions without routing back through the primary agent.", "Strengthen the primary agent's management layer to enforce per-subagent tool budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages.", "Collapse the three subagents into a single large-context model call that handles retrieval, analysis, and generation in one pass."], "a": 2, "sk": ["primary agent decomposes user requests"], "note": "Lỗi do quản lý → tăng lớp quản lý của primary agent (ngân sách tool, kiểm output). Bẫy: {A} retry, {B} subagent đọc chéo, {D} gộp thành một call.", "ex": "Đáp án đúng là C: Strengthen the primary agent's management layer to enforce per-subagent tool budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages. Dịch câu hỏi:Một đội ngũ đã triển khai hệ thống multi-agent với agent chính chia nhỏ yêu cầu của người dùng và giao việc cho 3 subagent chuyên biệt: truy xuất dữ liệu, phân tích và tạo báo cáo. Khi vận hành thực tế, các subagent thực hiện gọi tool dư thừa, thỉnh thoảng vượt giới hạn token và tạo ra đầu ra mâu thuẫn mà agent chính vẫn bỏ qua. Phương pháp phù hợp nhất để khắc phục các sự cố này là gì? Giải thích:\n\nĐáp án C (Đúng): Agent chính (Primary/Orchestrator Agent) đóng vai trò quản lý. Việc tăng cường lớp quản lý bằng cách áp dụng hạn mức gọi tool (budgeting), kiểm tra định dạng đầu ra (schema validation) và thiết lập giao ước chuyển tiếp (handoff contract) giúp ngăn chặn triệt để tình trạng gọi tool vô hạn, trôi token và dữ liệu mâu thuẫn.\n\nĐáp án A (Sai): Thêm retry logic không giải quyết được vấn đề gọi tool dư thừa hay mâu thuẫn dữ liệu, thậm chí còn làm tăng lượng token tiêu thụ.\n\nĐáp án B (Sai): Việc cho các subagent đọc trực tiếp đầu ra của nhau làm mất đi tính độc lập, tăng độ phức tạp và nguy cơ nhiễu ngữ cảnh thay vì giải quyết thông qua agent điều phối.\n\nĐáp án D (Sai): Gộp cả 3 subagent thành 1 lần gọi duy nhất làm mất đi ưu điểm của kiến trúc multi-agent, dễ gây quá tải ngữ cảnh và giảm chất lượng xử lý của mô hình đối với các tác vụ phức tạp."}, {"n": 37, "cat": "T", "topic": 2, "q": "You are extending a Claude agent with a capability that needs to be reusable across multiple teams in the organization, with each team able to invoke and use it independently. How would you build the capability?", "o": ["As a custom tool embedded in this team's agent only, with other teams able to copy the implementation into their own agents when they need the capability.", "As a shared library that each team imports into its own Claude application code, with each team responsible for keeping the library up to date in its integration.", "As a Skill or MCP server because both are purpose-built for cross-team reuse independently by each consuming team.", "As a wrapper around an existing built-in tool that adds the missing functionality, on the grounds that built-in tools cover the reuse pattern when extended carefully."], "a": 2, "sk": ["reusable across multiple teams"], "note": "Dùng lại cho nhiều team, gọi độc lập → Skill hoặc MCP server. Bẫy: {A} tool riêng của một team, {B} thư viện chung, {D} wrapper.", "ex": "Đáp án đúng là C: As a Skill or MCP server because both are purpose-built for cross-team reuse independently by each consuming team. Giải thích:\n\nĐáp án C (Đúng): Cả Skill và MCP (Model Context Protocol) server đều được thiết kế chuyên biệt nhằm chuẩn hóa và chia sẻ tính năng/công cụ cho nhiều nhóm sử dụng độc lập mà không cần phải viết lại mã nguồn hay phụ thuộc chặt chẽ vào cấu trúc của từng ứng dụng riêng lẻ.\n\nĐáp án A (Sai): Việc bắt các đội nhóm khác copy-paste mã nguồn (custom tool) tạo ra sự trùng lặp code, khó quản lý cập nhật và vi phạm nguyên tắc bảo trì phần mềm.\n\nĐáp án B (Sai): Tạo thư viện dùng chung (shared library) bắt các nhóm tự quản lý tích hợp và cập nhật phiên bản dễ dẫn đến hiện tượng trôi lệch phiên bản (version drift) và tốn chi phí bảo trì hơn so với chuẩn MCP/Skill.\n\nĐáp án D (Sai): Bọc (wrapper) lại công cụ có sẵn không giải quyết bài toán chia sẻ năng lực mới một cách độc lập chuẩn hóa cho toàn tổ chức."}, {"n": 38, "cat": "E", "topic": 2, "q": "You are choosing between using STDIO-based communication and HTTP-based communication for an MCP server. The server will be invoked by a Claude Code session running locally. Which communication pattern would you use?", "o": ["STDIO and HTTP simultaneously for redundancy, with the team running two communication patterns at the same time across Claude Code sessions.", "HTTP on the grounds that HTTP is preferable to STDIO in any context the application might encounter during normal operation.", "HTTP polling against the MCP server, treating HTTP as a substitute for the standard MCP communication patterns.", "STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup."], "a": 3, "sk": ["invoked by a Claude Code session running locally"], "note": "Chạy local → STDIO. Bẫy: {B} HTTP mọi lúc, {A} chạy cả hai, {C} HTTP polling.", "ex": "Đáp án đúng là D: STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup. Dịch câu hỏi:Bạn đang chọn giữa việc sử dụng giao tiếp dựa trên STDIO và giao tiếp dựa trên HTTP cho một MCP server. Server này sẽ được gọi bởi một phiên Claude Code đang chạy cục bộ (locally). Bạn sẽ sử dụng mô hình giao tiếp nào? Giải thích:\n\nĐáp án D (Đúng): Khi MCP server và client (Claude Code) chạy trên cùng một máy cục bộ, STDIO (Standard Input/Output) là lựa chọn tối ưu và tiêu chuẩn. Giao thức này cho phép hai tiến trình giao tiếp trực tiếp với nhau nhanh chóng, an toàn và không tốn công cấu hình mạng, cổng (port) hay quản lý xác thực HTTP phức tạp.\n\nĐáp án A (Sai): Chạy đồng thời cả hai mô hình giao tiếp gây ra sự dư thừa không cần thiết và làm phức tạp hệ thống.\n\nĐáp án B (Sai): HTTP không bắt buộc hay ưu việt hơn STDIO trong ngữ cảnh chạy tiến trình cục bộ (local process). HTTP thường chỉ được ưu tiên khi server chạy từ xa (remote server).\n\nĐáp án C (Sai): HTTP polling không phải là phương thức giao tiếp chuẩn của MCP và gây ra độ trễ (latency) cũng như lãng phí tài nguyên."}, {"n": 39, "cat": "T", "topic": 6, "q": "Your team uses several plugins across multiple Claude applications, and a recent plugin update introduced a regression. The team had not been tracking plugin versions, so the team cannot easily identify which version was previously working. How would you address this?", "o": ["Stop using all plugins until the team can rebuild equivalent functionality directly into the application code, treating plugin avoidance as a way to remove version-related risk.", "Add explicit plugin version tracking to the project's configuration so the team can identify, pin, and upgrade plugin versions deliberately.", "Treat plugins as untrackable third-party code and rely on plugin authors to communicate breaking changes when they happen, with no internal version tracking.", "Upgrade every plugin to the latest version on a regular cadence to keep version drift small, on the grounds that drift contributes to regression risk."], "a": 1, "sk": ["had not been tracking plugin versions"], "note": "Ghi rõ phiên bản plugin trong cấu hình để biết bản nào chạy tốt. Bẫy: {A} bỏ hết plugin, {C} không theo dõi, {D} luôn nâng bản mới nhất.", "ex": "Đáp án đúng là B: Add explicit plugin version tracking to the project's configuration so the team can identify, pin, and upgrade plugin versions deliberately. Giải thích:\n\nĐáp án B (Đúng): Bổ sung cơ chế theo dõi phiên bản plugin rõ ràng vào tệp cấu hình của dự án giúp đội ngũ có thể cố định (pin) các phiên bản hoạt động ổn định, dễ dàng phát hiện nguyên nhân khi có lỗi phát sinh và nâng cấp một cách có chủ đích (deliberately) thay vì phụ thuộc vào tự động cập nhật.\n\nĐáp án A (Sai): Ngừng sử dụng toàn bộ plugin và tự viết lại tính năng gây lãng phí thời gian, công sức và làm mất đi lợi ích tái sử dụng của hệ sinh thái plugin.\n\nĐáp án C (Sai): Phụ thuộc hoàn toàn vào tác giả plugin mà không tự quản lý phiên bản nội bộ là cực kỳ rủi ro đối với quy trình phát triển phần mềm chuyên nghiệp.\n\nĐáp án D (Sai): Tự động nâng cấp tất cả plugin lên bản mới nhất thường xuyên không giải quyết được gốc rễ vấn đề, thậm chí còn dễ làm tăng nguy cơ gặp lỗi do breaking changes từ các bản cập nhật mới."}, {"n": 40, "cat": "T", "topic": 2, "q": "A teammate has asked you to explain why your Claude agent's tools include detailed descriptions in the tool definition, even when the tool name is already descriptive. The teammate suggests removing the descriptions to simplify the tool definitions. How would you respond?", "o": ["Suggest replacing the descriptions with example calls embedded in the tool definition, treating example calls as a complete substitute for the prose description.", "Agree with the teammate because tool names are sufficient for the model to choose the right tool on every request the agent handles.", "Explain that the model uses the tool description to decide when to call the tool, and descriptions disambiguate cases where the tool name is not enough.", "Suggest moving the descriptions out of the tool definition and into a separate documentation file the team maintains so the tool definitions stay short and the descriptions remain available."], "a": 2, "sk": ["suggests removing the descriptions"], "note": "Model dựa vào mô tả tool để chọn khi nào gọi. Bẫy: {B} đồng ý xoá, {D} chuyển ra tài liệu, {A} thay bằng ví dụ.", "ex": "Đáp án đúng là C: Explain that the model uses the tool description to decide when to call the tool, and descriptions disambiguate cases where the tool name is not enough. Dịch câu hỏi:Một đồng nghiệp bảo bạn giải thích lý do tại sao các công cụ (tools) của Claude agent lại bao gồm mô tả chi tiết trong phần định nghĩa tool (tool definition), ngay cả khi tên tool đã mang tính mô tả rõ ràng. Đồng nghiệp đó đề xuất xóa phần mô tả đi để làm gọn định nghĩa tool. Bạn sẽ phản hồi như thế nào? Giải thích:\n\nĐáp án C (Đúng): Mô hình ngôn ngữ (Claude) dựa rất nhiều vào phần mô tả (description) của tool để hiểu mục đích, ngữ cảnh sử dụng, định dạng tham số và phân biệt giữa các công cụ tương tự nhau. Tên tool chỉ cung cấp thông tin ngắn gọn, không đủ để mô hình đưa ra quyết định gọi tool chính xác trong các tình huống phức tạp.\n\nĐáp án A (Sai): Các ví dụ gọi mẫu (example calls) có thể hỗ trợ nhưng không thể thay thế hoàn toàn cho văn bản mô tả chức năng của tool.\n\nĐáp án B (Sai): Tên tool ngắn gọn hoàn toàn không đủ để đảm bảo mô hình chọn đúng công cụ trong mọi yêu cầu.\n\nĐáp án D (Sai): Nếu chuyển phần mô tả ra một tệp tài liệu riêng ngoài API definition, mô hình sẽ không nhận được thông tin này khi xử lý request, dẫn đến việc không biết cách dùng tool."}, {"n": 41, "cat": "E", "topic": 3, "q": "Your Claude application validates structured output, but it has been treating validation failures as terminal errors. Every validation failure makes the entire user request fail. The team wants to handle validation failures more gracefully. How would you handle the validation failures?", "o": ["Tell users validation failures are unavoidable and ask for manual checks.", "Disable output validation until the cause is fixed.", "Treat validation failures as a recognized error path that triggers retry, repair, or fallback logic before failing the request.", "Pass validation failures directly to downstream systems."], "a": 2, "sk": ["treating validation failures as terminal errors"], "note": "Validate lỗi → đường xử lý có retry/sửa/fallback. Bẫy: {B} tắt validate, {D} đẩy lỗi xuống downstream, {A} bắt user tự kiểm.", "ex": "Đáp án đúng: C. Coi validation failure là nhánh lỗi dự kiến; retry, repair khi an toàn hoặc dùng fallback hợp lệ trước khi báo lỗi. Không tắt validation hay chuyển dữ liệu lỗi xuống downstream.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 42, "cat": "T", "topic": 6, "q": "The team is considering integrating with the Claude API directly or through a third-party abstraction layer supporting multiple LLM providers. All current and anticipated use cases use Claude; no customer has requested portability; the roadmap has no multi-provider support for two years. The abstraction adds code complexity and a dependency. Which approach would you recommend?", "o": ["Use the third-party abstraction because multi-provider support is always valuable.", "Integrate directly with Claude through its SDK because there is no multi-provider need and abstraction adds unjustified complexity.", "Build an in-house multi-provider abstraction.", "Use both integration paths in parallel."], "a": 1, "sk": ["no customer has requested portability"], "note": "Không có nhu cầu đa nhà cung cấp → tích hợp trực tiếp qua SDK. Bẫy: {A}/{C} lớp trừu tượng, {D} chạy song song.", "ex": "Đáp án đúng: B. Tích hợp trực tiếp Claude qua SDK vì không có nhu cầu đa nhà cung cấp. Abstraction layer làm tăng độ phức tạp và dependency nhưng không mang lại lợi ích cụ thể tương xứng.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 43, "cat": "E", "topic": 1, "q": "You are creating an agent that must call multiple internal APIs and a database in a structured, repeatable manner. Your team chose the Claude Agent SDK instead of a custom loop. How should you configure tools and the execution loop?", "o": ["Call the Messages API directly and let the model format tool calls in plain text.", "Use the SDK tool interface and loop, storing history in a separate database.", "Use the SDK tool interface and let the SDK handle the loop, dispatch, and history.", "Use the SDK tool interface but write the loop and history layer yourself."], "a": 2, "sk": ["Your team chose the Claude Agent SDK instead of a custom loop"], "note": "Đã chọn Agent SDK → để SDK lo loop, dispatch, history. Bẫy: {B}/{D} tự viết lại phần SDK đã làm, {A} gọi API trả text.", "ex": "Đáp án đúng: C. Dùng tool interface của SDK và để SDK quản lý agentic loop, dispatch, request/response và conversation history cho luồng tool-use thông thường.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 44, "cat": "T", "topic": 4, "q": "Your Claude application processes 50-page legal contracts and generates summaries with citation references to the source. The contracts fit within Claude’s context window. Whole-document processing gives better cross-section reasoning but citation accuracy sometimes drifts; chunked processing improves citation accuracy per chunk but loses cross-section reasoning. How would you guide the decision?", "o": ["Assess cost and latency first.", "Examine cross-section reasoning failures and assess whole-document accuracy.", "Review chunked citation accuracy and decide whether lost reasoning is acceptable.", "Identify which quality property matters more to the use case, choose the chunking approach accordingly, then validate on representative contracts."], "a": 3, "sk": ["citation accuracy sometimes drifts"], "note": "Đánh đổi giữa hai chất lượng → xác định cái nào quan trọng hơn rồi chọn cách chia. Bẫy: {A} chỉ xem chi phí, {B}/{C} chỉ xem một phía.", "ex": "Đáp án đúng: D. Chọn theo thuộc tính chất lượng quan trọng nhất: whole-document hỗ trợ suy luận xuyên phần; chunking tăng độ chính xác trích dẫn từng đoạn. Sau đó kiểm thử trên hợp đồng đại diện.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 45, "cat": "E", "topic": 2, "q": "A teammate asks why your Claude agent’s tool definitions contain detailed descriptions even though the tool names are already descriptive. They propose removing those descriptions to make the tool definitions simpler. How would you reply?", "o": ["Agree because tool names are sufficient for tool selection.", "Explain that the model uses tool descriptions to decide when to call a tool and to disambiguate cases where the name is insufficient.", "Move descriptions to a separate documentation file.", "Replace descriptions with example calls."], "a": 1, "sk": ["They propose removing those descriptions"], "note": "Model dựa vào mô tả tool để chọn và phân biệt tool. Bẫy: {A} đồng ý xoá, {C} chuyển ra file riêng, {D} thay bằng ví dụ.", "ex": "Đáp án đúng: B. Claude dùng mô tả tool để hiểu chức năng, thời điểm nên/không nên gọi và ý nghĩa tham số. Mô tả chi tiết giúp phân biệt tool khi tên gọi chưa đủ rõ.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 46, "cat": "E", "topic": 6, "q": "A teammate is reviewing the team’s threat model for a Claude application and asks which AI-specific threat categories should be added beyond traditional web-application threats. Which categories would you add?", "o": ["Supply-chain attacks on the Claude SDK only.", "Network denial of service and physical infrastructure attacks.", "Cross-site scripting and SQL injection.", "Prompt injection, data leakage from prompts or context, jailbreak attempts, and unsafe model output bypassing application controls."], "a": 3, "sk": ["AI-specific threat categories"], "note": "Mối đe doạ riêng của AI: prompt injection, rò rỉ dữ liệu, jailbreak, output không an toàn. Bẫy: {B}/{C} là mối đe doạ web truyền thống.", "ex": "Đáp án đúng: D. Bổ sung rủi ro đặc thù LLM: prompt injection, rò rỉ dữ liệu từ prompt/context, jailbreak và output không an toàn vượt qua kiểm soát ứng dụng.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 47, "cat": "T", "topic": 1, "q": "A team has deployed a multi-agent system where a primary agent breaks down user requests and assigns subtasks to three specialized subagents: one for data retrieval, one for analysis, and one for report generation. In production, the team finds that subagents make redundant tool calls, sometimes exceed token budgets, and occasionally produce contradictory outputs—all of which the primary agent forwards without detecting. What is the most appropriate way to resolve these failures?", "o": ["Strengthen the primary agent's management layer to enforce per-subagent tool budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages.", "Give each subagent read access to the other subagents' outputs so they can identify and resolve contradictions without routing back through the primary agent.", "Add retry logic to each subagent so that when a tool call fails, the subagent retries automatically before escalating – and configure each subagent to log its tool calls and outputs to a shared trace so the team can audit redundancy and contradictions after the fact.", "Collapse the three subagents into a single large-context model call that handles retrieval, analysis, and generation in one pass."], "a": 0, "sk": ["primary agent breaks down user requests"], "note": "Lỗi do quản lý → tăng lớp quản lý của primary agent. Bẫy: {C} retry, {B} subagent đọc chéo, {D} gộp thành một call.", "ex": "Đáp án đúng: A. Tăng cường lớp quản lý của primary agent: giới hạn ngân sách công cụ từng subagent, kiểm tra output theo schema và quy định hợp đồng bàn giao rõ ràng.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 48, "cat": "E", "topic": 5, "q": "Your team uses Claude Code across several repositories. You want team rules and general coding standards to apply to every repository, while other rules should apply only to particular repositories. The team currently duplicates instructions in each repository's CLAUDE.md file. How would you handle this?", "o": ["Use a CLAUDE.md hierarchy that scopes general standards broadly and project-specific context within each repository's local CLAUDE.md.", "Stop using CLAUDE.md altogether and ask each developer to configure Claude Code manually for each project they work on.", "Move all instructions to a separate documentation site that developers consult during Claude Code sessions across all repositories.", "Use a single repository's CLAUDE.md as the central source of truth and link to it from every other repository's CLAUDE.md file."], "a": 0, "sk": ["apply to every repository"], "note": "Chuẩn chung + chuẩn riêng → CLAUDE.md theo cấp. Bẫy: {B} bỏ CLAUDE.md, {C} tài liệu riêng, {D} một file trung tâm.", "ex": "Đáp án đúng: A. Dùng phân cấp CLAUDE.md: quy tắc chung ở phạm vi rộng, còn hướng dẫn riêng của dự án nằm trong CLAUDE.md tại repository tương ứng.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 49, "cat": "T", "topic": 3, "q": "A teammate asks you to explain the distinction between context engineering and prompt engineering. They have heard the terms used interchangeably and are uncertain how each applies to a Claude application that handles long-running, multi-step tasks. How would you describe the difference?", "o": ["Prompt engineering focuses on the model's response, while context engineering focuses on the user's input across many sessions in a long-running multi-step Claude application.", "Prompt engineering and context engineering each address content the team gives Claude, but the team can group them under a single workflow because the practices use overlapping techniques.", "Prompt engineering is the older term for prompt design, while context engineering is the newer term that has replaced it in modern Claude applications across the industry.", "Prompt engineering shapes individual prompts for specific outputs, while context engineering manages how content flows across turns and steps and takes steps to keep relevant state visible."], "a": 3, "sk": ["context engineering and prompt engineering"], "note": "Prompt engineering = từng prompt; context engineering = quản lý toàn bộ context qua nhiều bước. Bẫy: {A}/{B}/{C} định nghĩa lệch.", "ex": "Đáp án đúng: D. Prompt engineering thiết kế chỉ dẫn cho đầu ra cụ thể; context engineering quản lý luồng thông tin qua nhiều lượt/bước và duy trì trạng thái liên quan trong context.\n\nNguồn: file dump Excel (đáp án gợi ý)."}, {"n": 50, "cat": "E", "topic": 1, "q": "A developer creates an AI coding assistant for a known workflow with repeatable steps. Which design approach is appropriate?", "o": ["Use a fixed sequence of prompts", "Allow unlimited autonomous exploration", "Remove all workflow instructions", "Use random decision paths"], "a": 0, "sk": ["known workflow with repeatable steps"], "note": "Workflow đã biết, lặp lại → chuỗi prompt cố định. Bẫy: {B} tự do khám phá, {C} bỏ hướng dẫn, {D} ngẫu nhiên.", "ex": "Đáp án đúng: A. Workflow đã biết, các bước lặp lại → dùng chuỗi prompt cố định để kết quả ổn định, dễ dự đoán. B/D làm hành vi khó kiểm soát; C bỏ hướng dẫn khiến kết quả thiếu nhất quán.\n\nNguồn: CertyIQ CCDV-F câu 1. Đáp án theo CertyIQ."}, {"n": 51, "cat": "E", "topic": 1, "q": "A coordinator launches subagents to analyze API handlers, database writes, and scheduled jobs. Final architecture reports often attach claims to incorrect files or omit line ranges. What improves handoff reliability?", "o": ["Concatenate complete transcripts", "Use regex parsing on summaries.", "Ask the synthesizer to reconstruct locations.", "Require structured handoff records with paths, symbols, line ranges, and evidence snippets."], "a": 3, "sk": ["omit line ranges"], "note": "Bàn giao có cấu trúc: path, symbol, line range, evidence. Bẫy: {A} nối transcript, {B} regex, {C} để synthesizer tự đoán.", "ex": "Đáp án đúng: D. Handoff giữa agent cần bản ghi có cấu trúc: path, symbol, line range, evidence. Nối transcript (A), regex (B) hay để synthesizer tự dựng lại vị trí (C) đều làm mất/nhầm vị trí.\n\nNguồn: CertyIQ CCDV-F câu 6. Đáp án theo CertyIQ."}, {"n": 52, "cat": "E", "topic": 1, "q": "A debugging agent investigates unfamiliar systems where the correct solution is unknown at the beginning. Which strategy should it use?", "o": ["Follow a completely fixed workflow", "Use adaptive planning based on discoveries", "Ignore intermediate findings", "Always restart from the beginning"], "a": 1, "sk": ["correct solution is unknown at the beginning"], "note": "Chưa biết lời giải → lập kế hoạch thích ứng theo phát hiện. Bẫy: {A} quy trình cố định, {C} bỏ qua phát hiện, {D} làm lại từ đầu.", "ex": "Đáp án đúng: B. Vấn đề chưa biết lời giải → lập kế hoạch thích ứng, điều chỉnh theo phát hiện. Workflow cố định (A) không hợp với điều tra mở; C/D bỏ phí thông tin thu được.\n\nNguồn: CertyIQ CCDV-F câu 11. Đáp án theo CertyIQ."}, {"n": 53, "cat": "E", "topic": 1, "q": "A multi-agent research system occasionally generates reports while the synthesis agent is still incomplete, resulting in missing or unverifiable citations. What change prevents invalid reports?", "o": ["Generate reports immediately and remove invalid citations afterward.", "Tell the report agent to refuse incomplete synthesis.", "Check whether synthesis messages contain words like “complete.”", "Block report-generation tasks until synthesis returns a structured citation manifest and success status."], "a": 3, "sk": ["while the synthesis agent is still incomplete"], "note": "Chặn bước tạo báo cáo đến khi synthesis trả manifest trích dẫn có cấu trúc. Bẫy: {C} dò chữ “complete”, {B} chỉ dặn, {A} sửa sau.", "ex": "Đáp án đúng: D. Chặn bằng điều kiện có cấu trúc: chỉ cho tạo report khi synthesis trả về manifest trích dẫn + trạng thái success. Dò chữ \"complete\" (C) hay dặn trong prompt (B) không đáng tin; A sửa sau khi đã sai.\n\nNguồn: CertyIQ CCDV-F câu 15. Đáp án theo CertyIQ."}, {"n": 54, "cat": "E", "topic": 2, "q": "Multiple backend problems are returned to an agent as the same message: “Operation failed.” Problems include invalid order IDs, temporary service timeouts, expired tokens, and policy restrictions. What change most improves recovery behavior?", "o": ["Retry every failed tool call twice before escalation.", "Keep generic failures and let Claude infer retryability.", "Map failures to customer sentiment levels.", "Return structured MCP errors with categories, retryability, and user-safe details."], "a": 3, "sk": ["Operation failed."], "note": "Lỗi MCP có cấu trúc: loại lỗi, retry được không, chi tiết an toàn. Bẫy: {A} retry 2 lần mọi lỗi, {B} để Claude tự đoán, {C} map theo cảm xúc.", "ex": "Đáp án đúng: D. Trả lỗi MCP có cấu trúc: loại lỗi, có retry được không, chi tiết an toàn cho người dùng → agent biết retry timeout, xin lại ID sai, refresh token, hay dừng do policy. Retry mọi thứ (A) hay để Claude đoán (B) đều sai.\n\nNguồn: CertyIQ CCDV-F câu 20. Đáp án theo CertyIQ."}, {"n": 55, "cat": "E", "topic": 3, "q": "A team builds an application where Claude must classify customer requests into predefined categories. Which approach provides the most consistent results?", "o": ["Provide examples of each category and expected classifications", "Ask Claude to create new categories when needed", "Use a random classification approach.", "Remove category definitions from the prompt"], "a": 0, "sk": ["predefined categories"], "note": "Phân loại nhất quán → đưa ví dụ cho từng nhóm. Bẫy: {B} tự tạo nhóm mới, {D} bỏ định nghĩa nhóm.", "ex": "Đáp án đúng: A. Phân loại vào nhóm định sẵn → đưa ví dụ (few-shot) cho từng nhóm kèm cách phân loại mong muốn. Tạo nhóm mới (B), ngẫu nhiên (C), bỏ định nghĩa (D) đều làm kết quả thiếu nhất quán.\n\nNguồn: CertyIQ CCDV-F câu 25. Đáp án do Claude xác định (CertyIQ khoá đáp án từ câu 21) — nên kiểm chứng lại."}, {"n": 56, "cat": "T", "topic": 2, "q": "Scenario: Customer Support Resolution Agent Production logs show: • get_customer returns ISO 8601 timestamps and numeric loyalty tiers. • lookup_order returns Unix timestamps and numeric status codes. The agent sometimes miscomputes return windows or mislabels order status. You cannot modify upstream MCP servers. What change best addresses the reliability issue?", "o": ["Escalate all cases with mixed timestamp formats.", "Add a PostToolUse hook that converts tool results into canonical dates, status labels, and tier fields before Claude sees it.", "Add system instructions telling Claude to remember each tool's format", "Modify the final customer response parser."], "a": 1, "sk": ["Unix timestamps and numeric status codes"], "note": "Chuẩn hoá kết quả tool bằng PostToolUse hook (ngày, nhãn trạng thái). Bẫy: {C} dặn Claude nhớ định dạng, {D} sửa parser cuối, {A} escalate hết.", "ex": "Đáp án đúng: B. Không sửa được MCP server upstream → dùng PostToolUse hook chuẩn hoá kết quả tool (ngày tháng, nhãn trạng thái, tier) trước khi Claude đọc. Đây là cách xác định (deterministic); dặn trong prompt (C) không chắc chắn; A/D không đúng chỗ.\n\nNguồn: CertyIQ CCDV-F câu 29. Đáp án do Claude xác định (CertyIQ khoá đáp án từ câu 21) — nên kiểm chứng lại."}, {"n": 57, "cat": "T", "topic": 3, "q": "Scenario: Structured Data Extraction You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates output using JSON schemas, and maintains high accuracy. Production review shows inconsistent routing: documents with unreadable required values and unfamiliar layouts sometimes flow into downstream systems, while routine invoices missing optional purchase-order numbers are sent for manual review. The extraction schema already permits nullable fields for data that is absent from the source. What change would most effectively improve routing decisions?", "o": ["Require retries until all schema fields are populated, then escalate only documents still containing null values", "Escalate documents based on frustrated wording, urgent language, or negative sentiment detected in the source text.", "Add explicit human-review criteria with few-shot examples distinguishing absent optional fields, unreadable required fields, and unsupported document types.", "Route documents to reviewers whenever the model reports confidence below a single global threshold after extraction."], "a": 2, "sk": ["unreadable required values"], "note": "Tiêu chí chuyển người duyệt rõ ràng + few-shot phân biệt trường vắng hợp lệ. Bẫy: {D} ngưỡng tự tin, {B} theo ngôn từ, {A} retry.", "ex": "Đáp án đúng: C. Định tuyến sai vì tiêu chí review không rõ → đặt tiêu chí human review tường minh kèm few-shot phân biệt: field tùy chọn vắng mặt, field bắt buộc không đọc được, loại tài liệu không hỗ trợ. A dễ bịa dữ liệu; B (cảm xúc) không liên quan; D (một ngưỡng confidence chung) không đáng tin.\n\nNguồn: CertyIQ CCDV-F câu 33. Đáp án do Claude xác định (CertyIQ khoá đáp án từ câu 21) — nên kiểm chứng lại."}, {"n": 58, "cat": "T", "topic": 1, "q": "A customer support agent using Claude Agent SDK receives multiple possible customer profiles when users provide common names and partial addresses. The agent sometimes selects a profile based on recent activity or name similarity, causing incorrect refunds and privacy disclosures. What change best improves reliability without unnecessarily routing routine cases to humans?", "o": ["Rank matching customers by recent activity and continue with the highest ranked profile when confidence exceeds a threshold.", "Call lookup_order for each matching customer profile, then select the account whose order details best match the message.", "Escalate every request with duplicate customer records to a human agent before performing any lookup_order calls.", "Treat multiple customer matches as unresolved identity and request a disambiguating identifier before any order or refund operations."], "a": 3, "sk": ["multiple possible customer profiles"], "note": "Nhiều hồ sơ khớp → chưa xác định danh tính, hỏi thêm thông tin. Bẫy: {A} chọn theo hoạt động gần nhất, {B} tự suy luận, {C} escalate hết.", "ex": "Đáp án đúng: D. Nhiều hồ sơ khớp = danh tính chưa xác định → hỏi thêm một định danh phân biệt trước mọi thao tác order/refund. A/B vẫn đoán (rủi ro hoàn tiền sai, lộ thông tin); C đẩy mọi ca sang người, không cần thiết.\n\nNguồn: CertyIQ CCDV-F câu 38. Đáp án do Claude xác định (CertyIQ khoá đáp án từ câu 21) — nên kiểm chứng lại."}, {"n": 59, "cat": "E", "topic": 1, "q": "A property-management firm uses one agent to handle each tenant message from start to finish. Every message mixes different topics, such as a leaking boiler plus a disputed late fee. The agent sometimes answers one topic twice and forgets another, even though the conversations are short. Which design fixes this?", "o": ["A classifier that sends each message to one specialist agent, chosen by the first topic it mentions.", "Server-side compaction, so earlier parts of each conversation are condensed.", "Few-shot examples in the system prompt that show every topic handled exactly once.", "A coordinating agent that splits each message into topics, gives each to a specialist subagent, and tracks which ones are resolved."], "a": 3, "sk": ["Every message mixes different topics"], "note": "Tách tin nhắn thành từng chủ đề, giao subagent chuyên biệt rồi tổng hợp. Bẫy: {A} chỉ chọn một agent, {B} compaction, {C} few-shot.", "ex": "Đáp án đúng: D. Đáp án D là mẫu orchestrator–subagent: agent điều phối tách việc, mỗi subagent (agent con chạy trong context riêng) lo một vấn đề rồi trả kết quả về. Agent điều phối chỉ cần giữ danh sách vấn đề nào xong, vấn đề nào chưa, nên khó làm lặp hay bỏ sót. Mẫu này hợp khi mỗi yêu cầu gồm một tổ hợp vấn đề khác nhau.\n\nNguồn: CloudExam CCDV-F (phần làm thử 10 câu), câu 2 — chủ đề Agentic Systems."}, {"n": 60, "cat": "E", "topic": 3, "q": "A payroll system uses Claude with structured outputs to turn timesheets into JSON records, and the team assumed no further checking was needed. Then one response hit max_tokens mid-record, and the cut-off JSON made the payroll importer reject the whole batch. What is the design missing?", "o": ["Prefill the assistant turn with an opening brace, so every response starts as a valid record.", "Raise max_tokens to the maximum, since complete responses always match the schema.", "Ask for CSV instead of JSON, since a cut-off CSV loses only its last line.", "Add a check step that reads stop_reason, tests each response against the schema, and retries with a higher max_tokens after a cut-off."], "a": 3, "sk": ["hit max_tokens mid-record"], "note": "Structured output vẫn có thể bị cắt → đọc stop_reason, đối chiếu schema, gọi lại. Bẫy: {B} tăng max_tokens tối đa, {A} prefill, {C} đổi sang CSV.", "ex": "Đáp án đúng: D. Structured outputs giúp Claude trả JSON đúng khuôn trong trường hợp bình thường, nhưng docs nêu rõ những lúc nó không giữ được: response bị cắt vì chạm max_tokens thì output dở dang, còn khi model từ chối thì lời từ chối được ưu tiên hơn schema. Vì thế cần một bước kiểm nằm giữa Claude và hệ thống lương: xem stop_reason (lý do model dừng, ví dụ end_turn hay max_tokens), đối chiếu với schema, cái nào hỏng thì gọi lại. Bị cắt thì gọi lại với max_tokens lớn hơn, vì gọi y nguyên thì vẫn bị cắt đúng chỗ cũ.\n\nNguồn: CloudExam CCDV-F (phần làm thử 10 câu), câu 6 — chủ đề Context & Prompting."}, {"n": 61, "cat": "E", "topic": 1, "q": "A custom agent sends tool_result without the matching tool_use ID and the next API call is rejected. Which development or architectural response BEST addresses the primary requirement?", "o": ["Implement an application-controlled message/tool loop that checks stop_reason, executes only requested permitted tools, appends tool_result messages and continues until a valid terminal state.", "Select an agent tool-use loop for branching information needs while retaining a fixed chain for stable transformation sequences and explicit checkpoints.", "Choose a self-hosted or managed agent runtime based on residency, network access, audit obligations, deployment operations and integration capabilities.", "Evaluate Strands, LangGraph or PydanticAI based on state semantics, async execution, graph control and deployment needs, rather than picking a framework by popularity."], "a": 0, "sk": ["without the matching tool_use ID"], "note": "Tự kiểm soát vòng lặp: đọc stop_reason, ghép đúng tool_use_id với tool_result. Bẫy: {B}/{C}/{D} là chọn kiến trúc/framework, không sửa lỗi ghép ID.", "ex": "Đáp án đúng: A. Implement an application-controlled message/tool loop that checks stop_reason, executes only requested permitted tools, appends tool_result messages and continues until a valid terminal state. This response addresses the controlling engineering boundary. A tool-use response is not a completed user answer; forgetting to return tool results causes stalled or malformed continuations. Verify the prerequisites with: Inspect response stop_reason, tool_use identifiers, tool-result pairing, input schemas, and retry counters. Situation: A custom agent sends tool_result without the matching tool_use ID and the next API call is rejected.\n\nNguồn: PrepAway CCDV-F Practice Test 1, Question 1."}, {"n": 62, "cat": "E", "topic": 4, "q": "An agent repeats full tool histories on every turn even after the source facts have been summarized. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect timing traces, connection phase, server responses, client cancellation and retry idempotency.", "Inspect model capabilities, effort options, output usage, latency budgets and request-validation errors.", "Inspect model generation settings, task constraints, repeated responses, and deterministic downstream validators.", "Inspect input token counts, prompt structure, tool-result sizes, max_tokens and truncation events."], "a": 3, "sk": ["repeats full tool histories on every turn"], "note": "Kiểm tra token đầu vào, cấu trúc prompt, kích thước tool_result. Bẫy: {A} timing, {B} effort, {C} cài đặt sinh.", "ex": "Đáp án đúng: D. Inspect input token counts, prompt structure, tool-result sizes, max_tokens and truncation events. This evidence distinguishes the stated failure from nearby integration problems. Context windows and output budgets are finite and tokenization differs from character length; increasing text does not guarantee a better answer. The appropriate response is: Budget input, output, tool results and cached material as tokens rather than characters, and enforce context and output limits for the selected model. Situation: An agent repeats full tool histories on every turn even after the source facts have been summarized.\n\nNguồn: PrepAway CCDV-F Practice Test 1, Question 4."}, {"n": 63, "cat": "E", "topic": 6, "q": "A service migrates from the Anthropic API to Amazon Bedrock but keeps an unsupported endpoint parameter. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect roles, content block types, API schema versions, authentication headers and message ordering.", "Inspect provider-specific model IDs, version availability, request schemas, rate quotas and billing identity.", "Inspect image MIME types, resolution, source references, parser results and payload size limits.", "Inspect error examples, fallback ownership, confidence criteria, retry budgets and escalation permissions."], "a": 1, "sk": ["migrates from the Anthropic API to Amazon Bedrock"], "note": "Đổi nhà cung cấp → kiểm model ID, phiên bản, schema request riêng của Bedrock. Bẫy: {A}/{C}/{D} lớp khác.", "ex": "Đáp án đúng: B. Inspect provider-specific model IDs, version availability, request schemas, rate quotas and billing identity. This evidence distinguishes the stated failure from nearby integration problems. Third-party hosts may expose Claude with provider-specific configuration; transport compatibility is not feature parity. The appropriate response is: Define a provider adapter and verify what features are supported when routing Claude through another hosting platform rather than assuming endpoint and token behavior match. Situation: A service migrates from the Anthropic API to Amazon Bedrock but keeps an unsupported endpoint parameter.\n\nNguồn: PrepAway CCDV-F Practice Test 1, Question 7."}, {"n": 64, "cat": "E", "topic": 2, "q": "A payment tool call includes a customer ID belonging to another account and schema validation alone approves it. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect tool input schema, required fields, enum constraints, authenticated user and side-effect classification.", "Inspect repeated prefix byte identity, cache breakpoint, model compatibility, cache TTL and usage accounting.", "Inspect CI secret scans, environment injection, package provenance, dependency vulnerabilities and access role assignments.", "Inspect error examples, fallback ownership, confidence criteria, retry budgets and escalation permissions."], "a": 0, "sk": ["customer ID belonging to another account"], "note": "Kiểm schema tool + danh tính user đã xác thực + tác động phụ. Bẫy: {B} cache, {C} CI secret, {D} fallback.", "ex": "Đáp án đúng: A. Inspect tool input schema, required fields, enum constraints, authenticated user and side-effect classification. This evidence distinguishes the stated failure from nearby integration problems. A model-generated function call is untrusted input; schema adherence and authorization must be enforced by the application. The appropriate response is: Describe tool names and JSON schemas precisely and validate model-proposed arguments against server-side permissions before execution. Situation: A payment tool call includes a customer ID belonging to another account and schema validation alone approves it.\n\nNguồn: PrepAway CCDV-F Practice Test 2, Question 11."}, {"n": 65, "cat": "T", "topic": 1, "q": "A primary agent reviews seven repositories and tool logs from one repository contaminate code changes in another. Which TWO complementary actions provide an appropriate solution and the evidence needed to verify it? Select TWO.", "o": ["Inspect context token distribution, repeated logs, evidence freshness, truncation points and active requirements.", "Send independent subproblems into isolated contexts and return verified concise findings rather than mixing every tool transcript into one parent conversation.", "New examples improve targeted correctness without encouraging copying or excluding legitimate rare values.", "Compact long conversations into faithful state summaries recording open decisions, source identifiers and unresolved exceptions.", "Inspect delegation scopes, source links, parent assumptions and contradictions in specialist results."], "a": [1, 4], "sk": ["contaminate code changes in another"], "note": "Chọn 2: tách việc độc lập vào context riêng ({B}) + kiểm phạm vi giao việc, nguồn, mâu thuẫn ({E}). Bẫy: {D} compaction, {C} ví dụ.", "ex": ", E\nĐáp án đúng: B, E. Send independent subproblems into isolated contexts and return verified concise findings rather than mixing every tool transcript into one parent conversation. This response addresses the controlling engineering boundary. Subagents reduce context noise only when handoff results are bounded and checked against accessible sources. Verify the prerequisites with: Inspect delegation scopes, source links, parent assumptions and contradictions in specialist results. This supplies the implementation side of the complementary pair. Situation: A primary agent reviews seven repositories and tool logs from one repository contaminate code changes in another.\n\nNguồn: PrepAway CCDV-F Practice Test 2, Question 14."}, {"n": 66, "cat": "E", "topic": 6, "q": "A prototype uses a test API key hardcoded in source and is about to be deployed as a public service. Which observed result BEST demonstrates the requirement has been satisfied?", "o": ["A completed stream reconstructs the same logical response as a nonstreamed call, and interruptions do not produce phantom tool calls.", "The selected surface provides required integrations without assuming chat UI capabilities are identical to API behavior.", "Only a version with passing integration and security tests enters production under a recorded release decision.", "Small changes roll out with measurable evidence, and regressions trigger rollback before broad exposure."], "a": 2, "sk": ["hardcoded in source and is about to be deployed"], "note": "Kết quả chứng minh: chỉ bản qua test tích hợp + bảo mật mới lên production. Bẫy: {A} stream, {B} tích hợp, {D} rollout.", "ex": "Đáp án đúng: C. Only a version with passing integration and security tests enters production under a recorded release decision. This result checks an observable acceptance criterion instead of only confirming a model made a claim. A persuasive demo is not production reliability; deployment lifecycle gates must check external effects and recovery paths. Situation: A prototype uses a test API key hardcoded in source and is about to be deployed as a public service.\n\nNguồn: PrepAway CCDV-F Practice Test 2, Question 17."}, {"n": 67, "cat": "T", "topic": 4, "q": "A document service inserts a request-specific timestamp above its cached policy instructions on each call. Which TWO complementary actions provide an appropriate solution and the evidence needed to verify it? Select TWO.", "o": ["Keep durable repository instructions in appropriate CLAUDE.md locations and ensure local files do not unexpectedly override higher-level constraints.", "Inspect parser exceptions, structural schema, optional fields, encoding and validation error handling.", "Inspect repeated prefix byte identity, cache breakpoint, model compatibility, cache TTL and usage accounting.", "Place stable reusable prefix content before varying user material, use cache controls appropriately and monitor token accounting and hit rates.", "Each answer traces back to authorized input documents and unreadable sections are labeled rather than invented."], "a": [2, 3], "sk": ["timestamp above its cached policy instructions"], "note": "Chọn 2: kiểm prefix giống từng byte, breakpoint, TTL ({C}) + đặt phần ổn định trước phần thay đổi ({D}). Bẫy: {A} CLAUDE.md, {B} parser.", "ex": ", D\nĐáp án đúng: C, D. Inspect repeated prefix byte identity, cache breakpoint, model compatibility, cache TTL and usage accounting. This evidence distinguishes the stated failure from nearby integration problems. Prompt caching optimizes matching prefixes, not semantic similarity; variable content before a breakpoint defeats reuse. The appropriate response is: Place stable reusable prefix content before varying user material, use cache controls appropriately and monitor token accounting and hit rates. This supplies the verification side of the complementary pair. Situation: A document service inserts a request-specific timestamp above its cached policy instructions on each call.\n\nNguồn: PrepAway CCDV-F Practice Test 3, Question 21."}, {"n": 68, "cat": "E", "topic": 6, "q": "A tool action succeeds but the UI claims failure because its acknowledgment parser rejects an optional field. Which development or architectural response BEST addresses the primary requirement?", "o": ["Use production traces and defect reports to identify whether observed failures require a model, tool, prompt, data or application fix.", "Package repeatable instructions and external tools with pinned dependencies, documented install steps and permission reviews for consumers.", "Plan incremental releases, review code and prompt changes, and record impacts on behavior, integration contracts and measured eval results.", "Move from a prompt demo to a controlled release using requirements traceability, staged environments, integration tests and operational acceptance."], "a": 0, "sk": ["acknowledgment parser rejects an optional field"], "note": "Dùng trace production và báo cáo lỗi để xác định lỗi nằm ở lớp nào. Bẫy: {B} đóng gói, {C} release, {D} demo → release.", "ex": "Đáp án đúng: A. Use production traces and defect reports to identify whether observed failures require a model, tool, prompt, data or application fix. This response addresses the controlling engineering boundary. Changing a prompt for every symptom can conceal faults in transport, authorization or business logic. Verify the prerequisites with: Inspect event timelines, reproducible inputs, application logs, affected versions and customer impact. Situation: A tool action succeeds but the UI claims failure because its acknowledgment parser rejects an optional field.\n\nNguồn: PrepAway CCDV-F Practice Test 3, Question 24."}, {"n": 69, "cat": "E", "topic": 6, "q": "A tool action succeeds but the UI claims failure because its acknowledgment parser rejects an optional field. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect event timelines, reproducible inputs, application logs, affected versions and customer impact.", "Inspect repository state, acceptance suite, environment configuration, rollback steps and service owners.", "Inspect output schema fields, stop status, refusal indicators, validator errors and consumer expectations.", "Inspect connector permission grants, expiry, linked accounts, audit logs and error responses."], "a": 0, "sk": ["UI claims failure"], "note": "Kiểm tra trước: timeline sự kiện, input tái hiện, log ứng dụng, phiên bản. Bẫy: {B} repo, {C} schema output, {D} connector.", "ex": "Đáp án đúng: A. Inspect event timelines, reproducible inputs, application logs, affected versions and customer impact. This evidence distinguishes the stated failure from nearby integration problems. Changing a prompt for every symptom can conceal faults in transport, authorization or business logic. The appropriate response is: Use production traces and defect reports to identify whether observed failures require a model, tool, prompt, data or application fix. Situation: A tool action succeeds but the UI claims failure because its acknowledgment parser rejects an optional field.\n\nNguồn: PrepAway CCDV-F Practice Test 3, Question 27."}, {"n": 70, "cat": "T", "topic": 1, "q": "An engineer wants to resume a paused developer agent without recreating all permitted task context. Which TWO complementary actions provide an appropriate solution and the evidence needed to verify it? Select TWO.", "o": ["A completed task ends after a verified result; repeated failed calls terminate with an actionable diagnosis instead of looping.", "Inspect available tool registrations, session identifiers, permissions, turn events, and tool-result provenance.", "Inspect task variability, allowed actions, branch conditions, review obligations, and historical exception rates.", "Build an Agent SDK workflow using explicitly authorized tools, controlled session state and inspected execution events rather than treating the SDK as automatic policy enforcement.", "Implement an application-controlled message/tool loop that checks stop_reason, executes only requested permitted tools, appends tool_result messages and continues until a valid terminal state."], "a": [1, 3], "sk": ["resume a paused developer agent"], "note": "Chọn 2: kiểm tool đã đăng ký, session ID, quyền ({B}) + workflow Agent SDK với tool được cấp rõ ({D}). Bẫy: {E} tự viết loop, {C}/{A}.", "ex": ", D\nĐáp án đúng: B, D. Inspect available tool registrations, session identifiers, permissions, turn events, and tool-result provenance. This evidence distinguishes the stated failure from nearby integration problems. An Agent SDK manages orchestration plumbing but developers still own tool authorization, state scope, and failure handling. The appropriate response is: Build an Agent SDK workflow using explicitly authorized tools, controlled session state and inspected execution events rather than treating the SDK as automatic policy enforcement. This supplies the verification side of the complementary pair. Situation: An engineer wants to resume a paused developer agent without recreating all permitted task context.\n\nNguồn: PrepAway CCDV-F Practice Test 4, Question 31."}, {"n": 71, "cat": "T", "topic": 5, "q": "A pre-tool hook rejects writes outside the repository but an unrelated preview command should still execute. Which TWO complementary actions provide an appropriate solution and the evidence needed to verify it? Select TWO.", "o": ["Build an Agent SDK workflow using explicitly authorized tools, controlled session state and inspected execution events rather than treating the SDK as automatic policy enforcement.", "A completed task ends after a verified result; repeated failed calls terminate with an actionable diagnosis instead of looping.", "Inspect task variability, allowed actions, branch conditions, review obligations, and historical exception rates.", "Use deterministic lifecycle hooks for mandatory logging, validation and policy checks instead of relying on a prompt asking the model to remember them.", "Inspect hook event type, exit codes, execution order, failure handling and independent policy enforcement."], "a": [3, 4], "sk": ["unrelated preview command should still execute"], "note": "Chọn 2: hook tất định cho kiểm tra bắt buộc ({D}) + kiểm loại sự kiện hook, exit code, thứ tự chạy ({E}). Bẫy: {A}/{B}/{C}.", "ex": ", E\nĐáp án đúng: D, E. Use deterministic lifecycle hooks for mandatory logging, validation and policy checks instead of relying on a prompt asking the model to remember them. This response addresses the controlling engineering boundary. Deterministic hooks are reliable for guardrails only when placed on the relevant execution path with fail-closed semantics. Verify the prerequisites with: Inspect hook event type, exit codes, execution order, failure handling and independent policy enforcement. This supplies the implementation side of the complementary pair. Situation: A pre-tool hook rejects writes outside the repository but an unrelated preview command should still execute.\n\nNguồn: PrepAway CCDV-F Practice Test 4, Question 34."}, {"n": 72, "cat": "E", "topic": 6, "q": "A dashboard gives up after five seconds but the backend continues processing and charges for unused output. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect timing traces, connection phase, server responses, client cancellation and retry idempotency.", "Inspect SDK changelog, provider adapter, model capability flags, API version and feature-gate failures.", "Inspect API key scope, authorization headers, expiry/revocation, secret storage and server logs.", "Inspect error cases, example coverage, instruction conflicts and token overhead."], "a": 0, "sk": ["gives up after five seconds"], "note": "Client huỷ mà backend vẫn chạy → kiểm timing, giai đoạn kết nối, huỷ phía client. Bẫy: {B} SDK, {C} API key, {D} ví dụ.", "ex": "Đáp án đúng: A. Inspect timing traces, connection phase, server responses, client cancellation and retry idempotency. This evidence distinguishes the stated failure from nearby integration problems. Network reliability must be engineered around the API; a slow response is not proof that the model is ignoring instructions. The appropriate response is: Configure connection and read timeouts, retry budgets and cancellation so slow models and broken connections do not occupy server workers forever. Situation: A dashboard gives up after five seconds but the backend continues processing and charges for unused output.\n\nNguồn: PrepAway CCDV-F Practice Test 4, Question 37."}, {"n": 73, "cat": "E", "topic": 6, "q": "A user asks about today's configuration but a search index returns a retired service specification. What evidence or diagnostic detail should the engineer inspect FIRST?", "o": ["Inspect document version, access rights, retrieval scores, timestamps and underlying source span.", "Inspect baseline metrics, evaluation inputs, observed errors and parameter changes.", "Inspect message roles, conflicting text, injected commands and tool authority boundaries.", "Inspect summary coverage, lost identifiers, source availability and previous approved constraints."], "a": 0, "sk": ["returns a retired service specification"], "note": "Kiểm phiên bản tài liệu, quyền, điểm truy xuất, timestamp. Bẫy: {B} baseline, {C} injection, {D} tóm tắt.", "ex": "Đáp án đúng: A. Inspect document version, access rights, retrieval scores, timestamps and underlying source span. This evidence distinguishes the stated failure from nearby integration problems. RAG retrieval quality and authority are separate: a high similarity score cannot validate permission or recency. The appropriate response is: Retrieve only authorized relevant context for the current question and verify revisions before trusting stored snippets as current. Situation: A user asks about today's configuration but a search index returns a retired service specification.\n\nNguồn: PrepAway CCDV-F Practice Test 5, Question 41."}, {"n": 74, "cat": "E", "topic": 2, "q": "A client gets an unknown resource URI and the server crashes instead of returning a bounded error. Which development or architectural response BEST addresses the primary requirement?", "o": ["Select supported MCP transport according to locality and deployment, and protect remote connections with identity, access control and secret handling.", "Run application-controlled tools in the appropriate trusted service and send their results back into the Claude tool-use loop rather than assuming the model executes them directly.", "Return structured tool errors with enough context to recover safely while bounding retries and avoiding replay of irreversible actions.", "Design an MCP server exposing distinct tools, resources and prompts under documented names and schemas, with reliable discovery and access controls."], "a": 3, "sk": ["unknown resource URI"], "note": "Thiết kế MCP server tách rõ tool, resource, prompt với tên có tài liệu và lỗi có giới hạn. Bẫy: {A} transport, {B} tool tin cậy, {C} lỗi tool.", "ex": "Đáp án đúng: D. Design an MCP server exposing distinct tools, resources and prompts under documented names and schemas, with reliable discovery and access controls. This response addresses the controlling engineering boundary. MCP standardizes communication to external context/tools but does not itself guarantee the correctness or safety of the integration. Verify the prerequisites with: Inspect server capability advertisement, tool descriptions, resource identifiers and prompt argument handling. Situation: A client gets an unknown resource URI and the server crashes instead of returning a bounded error.\n\nNguồn: PrepAway CCDV-F Practice Test 5, Question 44."}, {"n": 75, "cat": "E", "topic": 3, "q": "A creative marketing workflow uses restrictive generation settings and produces near-identical product descriptions. Which development or architectural response BEST addresses the primary requirement?", "o": ["Choose appropriate temperature and sampling configuration where supported, and evaluate variability across multiple runs rather than expecting bit-for-bit repeatability.", "Use clear zero-shot instructions for simple tasks and representative few-shot examples when they materially reduce ambiguous output patterns.", "Group independent nonurgent work into the supported batch workflow and track job completion, throughput and retry waste.", "Configure connection and read timeouts, retry budgets and cancellation so slow models and broken connections do not occupy server workers forever."], "a": 0, "sk": ["near-identical product descriptions"], "note": "Nội dung sáng tạo bị giống nhau → chỉnh temperature/sampling và đánh giá độ đa dạng. Bẫy: {B} few-shot, {C} batch, {D} timeout.", "ex": "Đáp án đúng: A. Choose appropriate temperature and sampling configuration where supported, and evaluate variability across multiple runs rather than expecting bit-for-bit repeatability. This response addresses the controlling engineering boundary. Sampling changes candidate generation but does not guarantee reproducibility or correctness; code-level validation remains necessary. Verify the prerequisites with: Inspect model generation settings, task constraints, repeated responses, and deterministic downstream validators. Situation: A creative marketing workflow uses restrictive generation settings and produces near-identical product descriptions.\n\nNguồn: PrepAway CCDV-F Practice Test 5, Question 47."}, {"n": 76, "cat": "E", "topic": 2, "q": "A billing tool marks a transaction amount optional even though the backend cannot execute without it. Which development or architectural response BEST addresses the primary requirement?", "o": ["Write concise tool descriptions and strict input JSON schemas with explicit parameter semantics so the model chooses the appropriate operation reliably.", "Return structured tool errors with enough context to recover safely while bounding retries and avoiding replay of irreversible actions.", "Give an agent only the MCP capabilities needed for each task, distinguish retrieval from changes and verify all external outcomes.", "Run application-controlled tools in the appropriate trusted service and send their results back into t
