<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khóa ôn CCDV-F</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: course player. Navy band on every view, white cards on a pale page, question outline as the side panel. Deliberately one light theme, like learning platforms. */
:root {
  color-scheme: light;
  --bg: #f4f6fa; --sheet: #ffffff; --sunken: #eef1f6; --ink: #1a2233; --muted: #4b5669; --line: #dde2ea; --line2: #b4bdcb;
  --head: #14233d; --head-ink: #ffffff; --head-muted: #c8d2e2; --head-line: #6f7f99; --head-hover: #24375a; --head-track: #33466a; --head-alert: #ffb4a8;
  --accent: #1557d0; --accent-ink: #ffffff; --accent-soft: #e9f0fd;
  --good: #11703f; --good-soft: #e2f5ea; --bad: #b3261e; --bad-soft: #fdeceb; --warn: #875100; --warn-soft: #fff1d6; --amber: #f2a93b;
  --elim: #f0f2f6;
  --display: "Lexend", "Segoe UI", Roboto, Arial, sans-serif;
  --sans: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 18px/1.6 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
code { font: 500 .84em var(--mono); background: var(--sunken); padding: .1em .36em; border-radius: 4px; overflow-wrap: anywhere; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero :focus-visible, .bar :focus-visible { outline-color: var(--head-ink); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 16px var(--sans); color: var(--muted); }

.btn { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 17px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #1048b0; border-color: #1048b0; color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.hero .btn, .bar .btn { background: transparent; border-color: var(--head-line); color: var(--head-ink); }
.hero .btn:hover, .bar .btn:hover { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }
.hero .btn.primary, .bar .btn.primary { background: var(--head-ink); border-color: var(--head-ink); color: var(--head); }
.hero .btn.primary:hover, .bar .btn.primary:hover { background: var(--accent-soft); color: var(--head); }
.hero .btn[aria-pressed="true"], .bar .btn[aria-pressed="true"] { background: var(--head-hover); border-color: var(--head-ink); color: var(--head-ink); }

/* Navy band */
.hero { background: var(--head); color: var(--head-ink); }
.hero .wrap { padding-block: 40px 44px; display: grid; gap: 18px; }
.hero .eyebrow { color: var(--head-muted); }
.hero h1 { font-size: clamp(32px, 5vw, 46px); font-weight: 700; }
.hero .lead { max-width: 66ch; color: var(--head-muted); font-size: 19px; }
.herofacts { display: flex; flex-wrap: wrap; gap: 8px 32px; list-style: none; margin: 0; padding: 0; }
.herofacts b { font: 600 22px var(--display); margin-right: 6px; font-variant-numeric: tabular-nums; }
.herofacts li { color: var(--head-muted); }
.herofacts li b { color: var(--head-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .primary { padding: 11px 28px; font-size: 18px; }

.card, .cols > section, .sheetx { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.start { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cols > * { min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 17px; }
.tbl th, .tbl td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-weight: 400; }
.tbl tr:last-child th, .tbl tr:last-child td { border-bottom: 0; }
.tbl th { color: var(--muted); width: 38%; padding-right: 12px; }
.tbl .num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.start h2, .cols h2 { font-size: 20px; margin-bottom: 10px; }
.note { background: var(--accent-soft); padding: 18px 22px; font-size: 17px; border-radius: 12px; }
.note ul { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }

.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.setcard { display: grid; gap: 4px; text-align: left; background: var(--sheet); color: var(--ink); border: 1px solid var(--line2); border-radius: 12px; padding: 14px 18px; }
.setcard:hover { border-color: var(--accent); }
.setcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.setcard b { font: 600 20px var(--display); }
.setstat { font-weight: 600; font-size: 16px; color: var(--muted); }
.setstat.pass { color: var(--good); } .setstat.fail { color: var(--bad); }
.setscen { font-size: 16px; color: var(--muted); }
.tblwrap { overflow-x: auto; }
.hist th, .hist td { width: auto; padding-right: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Exam */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-ink); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.bar .code { font: 600 18px var(--display); }
.bar .prog { color: var(--head-muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.bar .spacer { flex: 1; }
.bar .btn { padding: 6px 14px; font-size: 16px; }
.timer { font: 600 21px var(--display); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--head-alert); }
.pbar { height: 4px; background: var(--head-track); }
.pbar span { display: block; height: 100%; background: var(--amber); }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding-block: 24px 56px; align-items: start; }
.exam > * { min-width: 0; }
.scen { background: var(--accent-soft); padding: 16px 24px; border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; font-size: 17px; }
.scen b { display: block; margin-bottom: 2px; font: 600 17px var(--display); }
.sheet { background: var(--sheet); padding: 22px 24px; border: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.qhead .btn { padding: 4px 12px; font-size: 16px; }
.stem { font-size: 20px; line-height: 1.5; font-weight: 600; max-width: 72ch; }
.instr { margin-top: 12px; font-size: 17px; font-weight: 600; color: var(--accent); }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 13px 16px; background: var(--sheet); border: 1px solid var(--line2); border-radius: 10px; cursor: pointer; }
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
.ltr { width: 30px; height: 30px; display: grid; place-items: center; border: 1.5px solid var(--line2); border-radius: 50%; font: 600 16px/1 var(--sans); background: var(--sheet); }
.opt.multi .ltr { border-radius: 7px; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.off { opacity: .6; cursor: not-allowed; }
.opt.off:hover { border-color: var(--line2); background: var(--sheet); }
.limit { margin-top: 10px; font-size: 16px; color: var(--warn); min-height: 24px; }
.navrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.navrow .spacer { flex: 1; }

.map { position: sticky; top: 90px; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; max-height: calc(100vh - 110px); overflow-y: auto; }
.map h2 { font-size: 18px; }
.map h3 { display: flex; justify-content: space-between; font: 600 16px var(--sans); margin-bottom: 6px; }
.map h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 7px; font: 500 15px var(--sans); padding: 0; }
.cell:hover { border-color: var(--accent); }
.cell.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.cur { outline: 2px solid var(--head); outline-offset: 1px; }
.cell.flag::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; background: var(--amber); border: 2px solid var(--sheet); border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .a { background: var(--accent); }
.legend .f { background: var(--amber); border-radius: 50%; }
.maptoggle { display: none; }

.veil { position: fixed; inset: 0; background: rgba(15, 25, 45, .55); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--sheet); max-width: 480px; width: 100%; padding: 26px; border-radius: 12px; display: grid; gap: 12px; }
.modal h2 { font-size: 22px; }
.modal .sub { color: var(--muted); }
.linklist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.linklist button { border: 1px solid var(--line2); background: none; color: var(--ink); border-radius: 6px; font-size: 15px; padding: 2px 9px; }

/* Result */
.result { padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 36px; align-items: end; }
.score { font: 700 clamp(56px, 10vw, 84px)/1 var(--display); font-variant-numeric: tabular-nums; }
.score small { font-size: .28em; font-weight: 500; color: var(--head-muted); }
.tag { display: inline-block; padding: 3px 14px; border-radius: 999px; font: 700 16px var(--sans); }
.tag.pass, .mark.ok { background: var(--good-soft); color: var(--good); }
.tag.fail, .mark.no { background: var(--bad-soft); color: var(--bad); }
.verdict .facts { color: var(--head-muted); margin-top: 6px; }
.scale { position: relative; height: 40px; margin-top: 8px; grid-column: 1 / -1; }
.scale .track, .scale .fill { position: absolute; left: 0; top: 6px; height: 10px; border-radius: 5px; }
.scale .track { right: 0; background: var(--head-track); }
.scale .fill { background: var(--head-ink); }
.scale .tick { position: absolute; top: 0; width: 3px; height: 22px; background: var(--amber); }
.scale .lab { position: absolute; top: 23px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--head-muted); transform: translateX(-50%); }
.scale .lab.l { transform: none; } .scale .lab.r { transform: translateX(-100%); }
.rows { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 54px 60px; gap: 4px 10px; align-items: baseline; font-size: 17px; }
.row .pct, .row .frac { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .frac { color: var(--muted); font-weight: 400; }
.row .b { grid-column: 1 / -1; height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.row .b span { display: block; height: 100%; background: var(--bad); }
.row .b span.g { background: var(--good); } .row .b span.w { background: var(--amber); }
.result > section > h2 { font-size: 22px; margin-bottom: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 4px 15px; font-size: 16px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: inherit; font-size: 16px; padding: 5px 10px; border: 1px solid var(--line2); background: var(--sheet); color: var(--ink); border-radius: 8px; max-width: 100%; }
.reviews { display: grid; gap: 14px; }
.rev { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: grid; gap: 12px; }
.rev .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; color: var(--muted); }
.mark { padding: 1px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.mark.blank { background: var(--warn-soft); color: var(--warn); }
.rev .stem { font-size: 19px; }
.ro { display: grid; gap: 6px; }
.ro div { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 12px; border: 1px solid transparent; border-radius: 8px; }
.ro .is { background: var(--good-soft); border-color: var(--good); }
.ro .is .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.ro .wrongpick { background: var(--bad-soft); border-color: var(--bad); }
.ro .wrongpick .ltr { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }
.ro .why { font: 700 15px/1.9 var(--sans); white-space: nowrap; }
.ro .is .why { color: var(--good); } .ro .wrongpick .why { color: var(--bad); }
.exp { background: var(--sunken); padding: 14px 18px; border-radius: 8px; }
.exp::before { content: "Giải thích"; display: block; font: 600 16px var(--display); margin-bottom: 2px; }
.empty { color: var(--muted); padding: 16px 0; }

/* Options the hint rules out: grey and dashed, so they recede and the live options stand out */
.opt.elim { background: var(--elim); border-style: dashed; }
.opt.elim .ltr { background: var(--elim); }
.opt.elim.sel { background: var(--accent-soft); border-style: solid; }
.opt.elim.sel .ltr { background: var(--accent); }
.elim code { background: var(--line); }
.elimnote { grid-column: 2; font-size: 16px; line-height: 1.45; color: var(--muted); }
.ro .elim { background: var(--elim); border: 1px dashed var(--line2); }
.ro .wrongpick.elim { background: var(--bad-soft); border: 1px solid var(--bad); }
.ro .elimnote { grid-column: 2 / -1; }
.ro .wrongpick .elimnote { color: var(--bad); }
.opt.right:not(.sel) { background: var(--good-soft); border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.opt.right:not(.sel) .ltr { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.rightnote { grid-column: 2; font-size: 16px; line-height: 1.45; font-weight: 700; color: var(--good); }
.hintnote { background: var(--warn-soft); color: var(--warn); display: inline-block; padding: 3px 12px; border-radius: 6px; font-size: 16px; margin-top: 8px; font-weight: 600; }

.sheetx h2 { font-size: 22px; margin-bottom: 4px; }
.sheetx .sub { color: var(--muted); max-width: 72ch; margin-bottom: 18px; }
.egroup { margin-bottom: 20px; }
.egroup h3 { font-size: 17px; padding-bottom: 6px; border-bottom: 2px solid var(--line2); }
.erow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.5; }
.erow > * { min-width: 0; }
.erow .term { font-weight: 600; }
.erow .why { color: var(--muted); }
.ehead { font: 600 15px var(--sans); color: var(--muted); padding: 8px 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
details.sheetx > summary { cursor: pointer; font: 600 20px var(--display); }
details.sheetx[open] > summary { margin-bottom: 8px; }
.dlmsg { color: var(--muted); font-size: 16px; }
.sync .sub { color: var(--muted); max-width: 72ch; margin-bottom: 14px; }
.sync textarea { display: block; width: 100%; min-height: 84px; margin-top: 12px; padding: 10px 12px; font: 400 14px/1.4 var(--mono); color: var(--ink); background: var(--sunken); border: 1px solid var(--line2); border-radius: 8px; resize: vertical; word-break: break-all; }
.sync .syncmsg { margin-top: 10px; font-size: 16px; color: var(--muted); }
.sync .syncmsg.ok { color: var(--good); }
.sync .syncmsg.err { color: var(--bad); }

@media (max-width: 860px) {
  .erow { grid-template-columns: minmax(0, 1fr); }
  .ehead { display: none; }
  .bar .wrap { gap: 6px 8px; padding-block: 8px; }
  .bar .btn { padding: 3px 10px; font-size: 15px; }
  .bar .code { font-size: 16px; }
  .bar .prog { font-size: 15px; }
  .bar .timer { font-size: 18px; }
  .cols, .exam { grid-template-columns: minmax(0, 1fr); }
  .map { position: static; max-height: none; }
  .map:not(.open) { display: none; }
  .maptoggle { display: inline-block; }
  .cells { grid-template-columns: repeat(8, 1fr); }
  .sheet, .scen, .rev, .card, .cols > section, .sheetx { padding-inline: 16px; }
  .stem { font-size: 19px; }
  .opt { padding: 11px 12px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .ro div { grid-template-columns: 30px minmax(0, 1fr); }
  .ro .why { grid-column: 2; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .btn, .cell, .chip { transition: border-color .12s, background .12s, color .12s; } }

.flashwrap { display: grid; gap: 8px; }
.diffblock { margin: 8px 0 28px; scroll-margin-top: 64px; }
.domgroup { scroll-margin-top: 56px; }
.domhead { margin: 18px 0 10px; padding-top: 14px; border-top: 1px solid var(--line2); font: 650 16px var(--sans); color: var(--muted); letter-spacing: .02em; }
.domhead span { font-weight: 500; }
.domchips { margin-bottom: 18px; }
.diffblock h2 { margin: 0 0 10px; font: 650 22px/1.3 var(--display); }
.difftable { width: 100%; }
.difftable th, .difftable td { text-align: left; vertical-align: top; padding: 12px 16px; }
.difftable th { color: var(--muted); font-weight: 600; }
.difftable th:last-child, .difftable td:last-child { width: 42%; }
.difftable td:last-child { font-weight: 600; }
.diffnote { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
.flashwrap > .filters { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 12px; }
.diffblock.diffhl { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 8px; background: var(--accent-soft); padding: 12px 14px; }
.rev .stem.hasdiff a { color: inherit; text-decoration: none; cursor: pointer; }
.rev .stem.hasdiff a:hover { color: var(--accent); }
.difflinks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0; }
.difflinks .lbl { color: var(--muted); font-size: 16px; font-weight: 600; }
a.diffjump { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 12px; font: 600 16px var(--sans); cursor: pointer; text-decoration: none; display: inline-block; }
a.diffjump:hover { background: var(--accent); color: var(--accent-ink); }
mark.kw { background: #ffe566; color: inherit; padding: 0 .12em; border-radius: 2px; font-weight: inherit; box-decoration-break: clone; -webkit-box-decoration-break: clone; }


@media (max-width: 860px) {
  .difftable th:last-child, .difftable td:last-child { width: auto; }
  .difftable, .difftable tbody, .difftable tr, .difftable th, .difftable td { display: block; }
  .difftable tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .difftable th { display: none; }
  .difftable td { padding: 4px 0; }
  .difftable td:last-child { font-weight: 650; color: var(--good); }
}
.crules { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; }
.cell.cok { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.cell.cno { background: var(--bad); border-color: var(--bad); color: var(--accent-ink); }

<script>

const COURSE_BANK = [{"n": 1, "cat": "E", "topic": 3, "q": "You are designing a Claude application that will require structured JSON output for downstream processing. The output schema is well-defined, and downstream systems will reject malformed JSON.Your application design would ...", "o": ["Structure the prompt to request output in a schema that is described in plain English, with downstream systems parsing whatever shape Claude produces.", "Define a clear schema and structure the prompt to request output in that schema, with downstream systems handling any validation needed.", "Define a clear schema, structure the prompt to request output in that schema, and validate Claude's output against the schema before passing it downstream.", "Avoid structured output and use free-form text everywhere instead, on the grounds that free-form text is more flexible and handles edge cases better than structured schemas."], "a": 2, "sk": ["downstream systems will reject malformed JSON"], "note": "Bẫy: {B} giao việc validate cho downstream; {A} chỉ mô tả schema bằng lời. Đáp án: định nghĩa schema + validate trước khi đưa xuống.", "ex": "Tại sao chọn C:\n\nThực hành tốt nhất (Best Practice): Mặc dù Claude tuân thủ cấu trúc rất tốt, nhưng các mô hình ngôn ngữ vẫn có khả năng trả về định dạng không như mong đợi. Việc thực hiện bước validation (kiểm tra hợp lệ) ở phía ứng dụng trước khi gửi tới downstream service là bắt buộc để đảm bảo tính an toàn và ngăn chặn hệ thống bị lỗi ngắt đột ngột.\n\nTại sao các phương án khác sai\nA (Mô tả schema bằng tiếng Anh tự nhiên & để downstream tự xử lý): Thiếu tính chặt chẽ trong cấu trúc prompt và đồn trách nhiệm xử lý lỗi cho downstream system (nơi đề bài đã nêu rõ là sẽ từ chối nếu sai định dạng).\n\nB (Bỏ qua bước validate trước khi gửi): Đưa trực tiếp dữ liệu chưa kiểm tra xuống downstream sẽ dẫn đến nguy cơ các hệ thống phía sau bị crash hoặc báo lỗi hàng loạt.\n\nD (Dùng văn bản tự do thay vì JSON có cấu trúc): Trái ngược hoàn toàn với yêu cầu bài toán là cần structured JSON output cho downstream processing."}, {"n": 2, "cat": "T", "topic": 3, "q": "A new Claude model release includes performance improvements for several reasoning tasks but has changed the format of its responses to system prompts that use multi-section instructions. Your application uses multi- section system prompts heavily. Initial evaluation on the application's actual workload shows the new model performs 8 percent better on reasoning tasks but produces malformed output on roughly 3 percent of requests because of the format change. The team is debating whether to upgrade. How would you decide?", "o": ["Upgrade immediately, because the 8 percent reasoning improvement outweighs the 3 percent malformed output rate across the application's typical request distribution.", "Adapt the application's system prompt to the new model's format expectations and reevaluate, then upgrade only if the adapted prompt eliminates the malformed output while preserving the reasoning improvements.", "Upgrade and add a downstream validation step that catches the 3 percent malformed output before it reaches users, treating the validation step as the team's mitigation for the format change.", "Stay on the previous model permanently to avoid the malformed output rate and any future format changes that subsequent model releases might introduce in the application."], "a": 1, "sk": ["changed the format of its responses"], "note": "Bẫy: {A}/{C} nâng cấp vội, {D} đứng yên mãi. Đáp án: chỉnh system prompt theo model mới rồi đánh giá lại.", "ex": "Bộ đề thi được cung cấp đánh dấu B là đáp án đúng. Bản thân tình huống này đã cho thấy lý do tại sao việc nâng cấp model cần được xem như một thay đổi phần mềm phải được đánh giá, chứ không phải là một sự thay thế tự động: model mới cải thiện một chỉ số nhưng lại gây ra sự thoái lui (regression) ở một chỉ số khác.\n\nHướng dẫn chính thức của Anthropic về việc lựa chọn model khuyến nghị nên xây dựng các bài kiểm tra benchmark riêng cho từng trường hợp sử dụng của ứng dụng, kiểm thử model với các prompt và dữ liệu thực tế của ứng dụng, so sánh chất lượng phản hồi và hiệu năng ở các trường hợp biên (edge case), và cân nhắc hiệu năng so với các đánh đổi vận hành. Do đó, hành động đúng đắn là điều chỉnh system prompt nhiều phần cho phù hợp với hành vi của model mới rồi lặp lại quá trình đánh giá. Chỉ khi sự thoái lui về định dạng đã được loại bỏ - hoặc giảm xuống dưới một ngưỡng chấp nhận được rõ ràng - thì mới nên tiến hành nâng cấp.\n\nPhương án A giả định sai rằng mức cải thiện 8% về suy luận có thể bù trừ về mặt số học cho tỷ lệ 3% đầu ra bị lỗi định dạng; hai chỉ số này đo lường các hậu quả khác nhau và không thể đơn giản trừ đi nhau. Phương án C chỉ xử lý sự không tương thích đã biết ở khâu hạ nguồn thay vì sửa trực tiếp mối tương tác giữa prompt và model trước. Phương án D từ chối vĩnh viễn mọi cải tiến trong tương lai và không phù hợp với nguyên tắc phát triển vòng đời có kiểm soát.\n\nNguyên tắc kỹ thuật ở đây là di trú (migration) thông qua kiểm thử hồi quy (regression testing) và điều chỉnh (adaptation), chứ không phải nâng cấp mù quáng hay né tránh phiên bản mới vĩnh viễn.\n\nCác chủ đề liên quan trong Claude Developer: Systems Life Cycle, di trú model (model migration), đánh giá hồi quy (regression evaluation), điều chỉnh prompt, kiểm thử tương thích, các cổng triển khai (deployment gates), và tiến hóa liên tục."}, {"n": 3, "cat": "E", "topic": 3, "q": "Your Claude application uses structured output that is consumed by downstream code. The team wants to handle malformed or unexpected output gracefully so it does not crash downstream systems. The best choice for handling this issue would be to...", "o": ["Crash on any unexpected output and require manual recovery on affected requests the application handles during normal operation.", "Silently drop any output that does not match expectations so downstream systems do not see the malformed output the application receives from the model.", "Use the output the model produces and leave schema enforcement to a later phase of production after the application is more complete.", "Apply defensive parsing to handle unexpected fields, missing values, and type mismatches that the downstream code might otherwise crash on."], "a": 3, "sk": ["handle malformed or unexpected output gracefully"], "note": "Bẫy: {A} crash, {B} lặng lẽ bỏ, {C} để sau mới kiểm. Đáp án: defensive parsing (field lạ, thiếu, sai kiểu).", "ex": "Đáp án D là phương án tối ưu nhất: Trong lập trình tích hợp LLM, đầu ra có cấu trúc (như JSON) đôi khi có thể bị thiếu trường, sai kiểu dữ liệu hoặc thêm trường ngoài dự kiến. Defensive Parsing (sử dụng fallback values, validation schema với các quy tắc linh hoạt) giúp ứng dụng hoạt động an toàn, không bị crash mà vẫn xử lý dữ liệu hợp lệ.\n\nCác phương án A, B, C sai:\n\nA: Crash ứng dụng làm gián đoạn trải nghiệm người dùng.\n\nB: Âm thầm bỏ dữ liệu sẽ làm mất dấu vết (loss of data) và khó debug.\n\nC: Bỏ qua kiểm tra schema dẫn đến lỗi runtime ở các bước phía sau."}, {"n": 4, "cat": "T", "topic": 6, "q": "The team is debating whether to integrate with the Claude API directly or through a thirdparty abstraction layer that supports multiple LLM providers. The team has identified that all current and projected use cases run on Claude, no internal customer has requested LLM portability, and the team's product roadmap does not mention multi-provider support over the next two years. The third-party abstraction would add roughly 15 percent overhead in code complexity and introduce one additional dependency. Which integration approach would you recommend?", "o": ["The third-party abstraction layer, on the grounds that multi-provider support is valuable for any application as a matter of long-term flexibility across vendors.", "Both integration paths in parallel, where the application uses each path on different runs to compare which performs better in production over time.", "A custom multi-provider abstraction layer the team builds in-house so that the team controls every part of the abstraction the application uses for its API calls.", "Direct integration with Claude through its SDK, because no multi-provider need exists and abstraction would add complexity that does not pay off."], "a": 3, "sk": ["no internal customer has requested LLM portability"], "note": "Không có nhu cầu đa nhà cung cấp → tích hợp trực tiếp qua SDK. Bẫy: {A}/{C} thêm lớp trừu tượng, {B} chạy song song.", "ex": "D tuân theo nguyên tắc lựa chọn kiến trúc đơn giản nhất mà vẫn đáp ứng được các yêu cầu đã được chứng minh.\n\nĐề thi được cung cấp đánh dấu rõ ràng D là đáp án đúng. Trong tình huống này, khả năng chuyển đổi nhà cung cấp (portability) không phải là một yêu cầu chức năng hiện tại, cũng không phải là một yêu cầu có thể thấy trước trong roadmap. Do đó, việc thêm một lớp trừu tượng sẽ tạo ra độ phức tạp có thể đo lường được mà không mang lại khả năng sản phẩm cụ thể nào đã được xác định.\n\nAnthropic cung cấp các SDK đa mục đích chính thức cho Claude bằng nhiều ngôn ngữ. Các SDK này expose trực tiếp Messages API đồng thời bổ sung các giao diện idiomatic, type safety, hỗ trợ streaming, retry, và xử lý lỗi. Anthropic cũng mô tả riêng các lớp tương thích (compatibility layers) và các thư viện dành riêng cho framework như những bề mặt tích hợp thay thế, chứ không phải là yêu cầu bắt buộc cho việc phát triển Claude thông thường.\n\nMột lớp trừu tượng của bên thứ ba trở nên hợp lý khi có yêu cầu thực sự về nhiều nhà cung cấp, chuyển đổi vendor, giao diện chuẩn hóa đa model, hoặc một nền tảng kiến trúc hiện có bắt buộc phải có. Không có điều nào trong số đó tồn tại ở đây. Việc xây dựng tính linh hoạt đó một cách đầu cơ sẽ làm tăng số lượng dependency, bề mặt gỡ lỗi, công việc tương thích phiên bản, và khả năng các tính năng đặc thù của Claude bị che khuất sau một API mẫu số chung thấp nhất.\n\nPhương án A tối ưu hóa cho các yêu cầu giả định trong tương lai. Phương án B nhân đôi độ phức tạp vận hành. Phương án C tạo ra gánh nặng bảo trì thậm chí còn lớn hơn.\n\nCác chủ đề liên quan trong Claude Developer: Claude App Design, lựa chọn SDK, ranh giới trừu tượng hóa, quản lý dependency, YAGNI, kiến trúc tích hợp, và yêu cầu về khả năng chuyển đổi nhà cung cấp."}, {"n": 5, "cat": "T", "topic": 2, "q": "Your Claude agent has too many tools, and many of them have overlapping functionality. The agent often picks an inappropriate tool when several could plausibly handle a request. How would you address the tool selection problem?", "o": ["Add more tools to cover every variation of the requests the agent handles, on the grounds that more tools give the agent more accurate options to choose from.", "Remove all tools and rely on the agent's general capability instead, with the application losing the workflows that previously relied on tools.", "Add detailed examples to each tool's description so the agent can match incoming requests to the right tool by example, treating the examples as the team's selection mechanism.", "Restructure the tool set by consolidating overlapping tools, removing unused tools, and clarifying tool descriptions so each tool has a distinct purpose."], "a": 3, "sk": ["many of them have overlapping functionality"], "note": "Bẫy: {A} thêm tool, {B} bỏ hết tool, {C} chỉ thêm ví dụ. Đáp án: gộp tool trùng, bỏ tool thừa, làm rõ ranh giới.", "ex": "Đáp án D là Best Practice chuẩn khi thiết kế Tool Set cho LLM/Agent: Khi tập hợp công cụ quá lớn hoặc bị chồng chéo chức năng (overlap), LLM sẽ dễ bị nhầm lẫn và chọn sai công cụ. Giải pháp tối ưu là:\n\nConsolidate (Hợp nhất): Gộp các công cụ có chức năng tương tự thành một công cụ duy nhất với tham số đầu vào linh hoạt.\n\nPrune (Cắt giảm): Loại bỏ bớt các công cụ thừa hoặc không dùng tới.\n\nClear Purpose (Mô tả rõ ràng): Viết lại description chính xác để định hình mục đích độc bản (distinct purpose) cho từng công cụ.\n\nCác phương án A, B, C sai:\n\nA: Thêm nhiều công cụ chỉ làm trầm trọng thêm tình trạng nhiễu và nhầm lẫn của mô hình.\n\nB: Bỏ hết công cụ sẽ làm ứng dụng mất đi các tính năng/quy trình quan trọng.\n\nC: Chỉ thêm ví dụ mà không giải quyết gốc rễ việc chồng chéo chức năng và sự phình to của tập công cụ sẽ không giải quyết được triệt để bài toán."}, {"n": 6, "cat": "E", "topic": 5, "q": "Your team uses Claude Code across multiple repositories. You want the team's rules and general coding standards to apply to all repositories, and other rules to apply only to specific repositories. The team is currently duplicating instructions across every repository's CLAUDE.md file. How would you address this?", "o": ["Move all instructions to a separate documentation site that developers consult during Claude Code sessions across all repositories.", "Use a CLAUDE.md hierarchy that scopes general standards broadly and project-specific context within each repository's local CLAUDE.md.", "Stop using CLAUDE.md altogether and ask each developer to configure Claude Code manually for each project they work on.", "Use a single repository's CLAUDE.md as the central source of truth and link to it from every other repository's CLAUDE.md file."], "a": 1, "sk": ["apply to all repositories"], "note": "Chuẩn chung + chuẩn riêng từng repo → CLAUDE.md theo cấp. Bẫy: {A} tài liệu riêng, {C} bỏ CLAUDE.md, {D} một file trung tâm.", "ex": "B được hỗ trợ trực tiếp bởi cả nguồn đề thi được cung cấp lẫn mô hình cấu hình của Claude Code. Nguồn đề thi đánh dấu cách tiếp cận CLAUDE.md phân cấp là đáp án đúng.\n\nClaude Code hỗ trợ hướng dẫn ở nhiều cấp độ phạm vi (scope), cho phép tách các tiêu chuẩn áp dụng rộng rãi khỏi ngữ cảnh đặc thù của từng dự án thay vì phải lặp lại ở mọi repository.\n\nAnthropic tài liệu hóa một số phạm vi cho CLAUDE.md. Hướng dẫn do tổ chức quản lý (organization-managed) có thể áp dụng rộng rãi; hướng dẫn ở cấp người dùng trong ~/.claude/CLAUDE.md áp dụng cho tất cả các dự án của một người dùng; hướng dẫn ở cấp dự án trong ./CLAUDE.md hoặc ./.claude/CLAUDE.md cung cấp kiến trúc, quy ước, lệnh, và quy trình làm việc đặc thù của từng repository. Claude Code nạp các file phù hợp theo cấu trúc thư mục, cho phép các hướng dẫn tổng quát và các hướng dẫn cục bộ chi tiết hơn cùng tồn tại.\n\nCách sắp xếp này cải thiện khả năng bảo trì vì các tiêu chuẩn coding chung chỉ cần được định nghĩa một lần ở phạm vi phù hợp, trong khi mỗi repository chỉ giữ lại ngữ cảnh riêng biệt của dự án đó. Một trang tài liệu độc lập không tự động đưa các quy tắc vào ngữ cảnh của Claude Code. Phương án C tạo ra cấu hình thủ công không nhất quán. Phương án D gắn kết không hợp lý các repository không liên quan vào cấu hình của một repository duy nhất.\n\nCác chủ đề liên quan trong Claude Developer: Configuration Management, hệ thống phân cấp CLAUDE.md, phạm vi tổ chức (organization scope), phạm vi người dùng (user scope), phạm vi dự án (project scope), cấu hình repository, kế thừa hướng dẫn, và tái sử dụng cấu hình."}, {"n": 7, "cat": "E", "topic": 4, "q": "Your Claude application has been running for several conversation turns, and you notice the model occasionally references information that was discussed many turns ago but is no longer relevant. You suspect context drift is causing the model to weight stale content too heavily. How would you address the drift?", "o": ["Increase the context window size so all turns of the conversation remain visible to the model in full detail.", "Reset the conversation after every turn so the model loses all prior turns when generating a response.", "Apply compaction to summarize older portions of the conversation so the gist remains while the specifics carry less weight.", "Truncate the conversation so the model sees only the most recent turn during each subsequent response."], "a": 2, "sk": ["context drift"], "note": "Bẫy: {A} tăng context, {B} reset mỗi lượt, {D} chỉ giữ lượt cuối. Đáp án: compaction tóm tắt phần cũ, giữ ý chính.", "ex": "Phương án C áp dụng đúng kỹ thuật quản lý ngữ cảnh phù hợp. Vấn đề không đơn thuần là liệu toàn bộ cuộc hội thoại trước đó có thể vừa vặn về mặt vật lý trong context window hay không; vấn đề là các chi tiết cũ vẫn nổi bật đến mức gây nhiễu cho nhiệm vụ hiện tại của model. Kỹ thuật quản lý ngữ cảnh (context engineering) hiệu quả tối ưu hóa chất lượng tín hiệu, chứ không chỉ đơn thuần là giữ lại tối đa số lượng token.\n\nTài liệu về context-editing của Anthropic mô tả compaction là việc tóm tắt lịch sử đã tích lũy và thay thế toàn bộ lịch sử bằng một bản tóm tắt có cấu trúc khi ngữ cảnh trở nên quá lớn. Điều này giữ lại trạng thái nhiệm vụ quan trọng trong khi giảm đáng kể các chi tiết ít giá trị có thể làm phân tán quá trình suy luận sau này.\n\nPhương án A giữ lại chính xác những nội dung cũ đang gây ra vấn đề, do đó không giải quyết được hiện tượng trôi ngữ cảnh (context drift). Phương án B phá hủy toàn bộ tính liên tục hữu ích giữa các lượt hội thoại, bao gồm cả các mục tiêu, quyết định, và trạng thái trung gian hợp lệ. Phương án D cũng quá mức tương tự vì việc giới hạn Claude chỉ thấy lượt gần nhất sẽ bỏ qua những thông tin có thể vẫn còn cần thiết.\n\nCompaction cung cấp điểm cân bằng đúng đắn: giữ lại các kết luận lâu bền, mục tiêu hiện tại, các vấn đề chưa giải quyết, và các trạng thái có giá trị tín hiệu cao khác trong khi nén lại các chi tiết hội thoại đã lỗi thời. Các chủ đề liên quan trong Study Guide: context engineering, compaction, lịch sử hội thoại, agent chạy dài (long-running agents), ngữ cảnh lỗi thời (stale context), trôi ngữ cảnh (context drift), và bảo toàn trạng thái có giá trị tín hiệu cao."}, {"n": 8, "cat": "E", "topic": 4, "q": "Your application uses the Messages API to handle multi-turn conversations. Each new turn resends the entire conversation history, and your token costs are growing as conversations get longer. You suspect there is a more efficient approach. How would you address this?", "o": ["Use prompt caching to reuse the static portions of the conversation context across turns instead of paying for them at the normal input-token rate on every request the application sends.", "Switch to the Batch API for every turn so the per-call cost is reduced, treating the batch as the team's primary cost-control mechanism for multi-turn work.", "Truncate every conversation to the last two messages so that token usage stays low and costs remain predictable across the application's normal operation.", "Summarize each conversation after every turn and replace the full history with the summary on the next request, reducing token count at the cost of fidelity."], "a": 0, "sk": ["resends the entire conversation history"], "note": "Phần lặp lại mỗi lượt → prompt caching. Bẫy: {B} Batch API cho hội thoại, {C} cắt còn 2 tin, {D} tóm tắt mỗi lượt.", "ex": "Tại sao chọn A:\n\nPrompt Caching của Anthropic cho phép bộ nhớ đệm lưu trữ các đoạn hội thoại cố định (như system prompt, lịch sử chat trước đó).\n\nKhi gửi lượt chat tiếp theo, mô hình chỉ tính phí đọc cache (rẻ hơn đáng kể — giảm đến 90% chi phí input token) thay vì tính lại toàn bộ lịch sử trò chuyện theo giá bình thường, giúp tối ưu chi phí tối đa cho ứng dụng chat nhiều lượt.\n\nTại sao các phương án khác sai\nB (Dùng Batch API cho mọi lượt chat): Batch API dành cho các tác vụ xử lý hàng loạt bất đồng bộ (có độ trễ lên tới 24h), không phù hợp cho trải nghiệm chat tương tác thời gian thực (real-time).\n\nC (Cắt ngắn hội thoại chỉ còn 2 tin nhắn cuối): Việc cắt ngắn quá mức sẽ làm mất đi ngữ cảnh quan trọng của toàn bộ cuộc trò chuyện, làm giảm chất lượng phản hồi.\n\nD (Tóm tắt sau mỗi lượt): Tóm tắt liên tục làm mất chi tiết ngữ cảnh (fidelity) và việc gọi AI để tóm tắt sau mỗi lượt cũng tốn thêm chi phí/độ trễ không cần thiết."}, {"n": 9, "cat": "T", "topic": 3, "q": "A teammate has asked why your Claude application sometimes produces a response that includes the prompt text repeated back, and other times produces a response with the prompt text rephrased. They suspect a bug in the application's request construction. How would you respond?", "o": ["Tell the teammate that the variation depends on which Claude model serves the request, and recommend pinning the application to a single model version to make the output behavior consistent.", "Explain that LLMs generate output token by token, and variation in how prompt content appears in output is a property of generation, not a bug in request construction.", "Confirm that the variation is a bug in the application's request construction and start investigating which part of the application is producing the inconsistent prompt text.", "Tell the teammate that the variation is caused by the application sending two different prompts on different runs and propose a code change that pins the system prompt to a single version."], "a": 1, "sk": ["sometimes produces a response that includes the prompt text repeated back"], "note": "Không phải bug: LLM sinh từng token nên cách lặp lại prompt có thể khác nhau. Bẫy: {C} khẳng định là bug, {A}/{D} đổ cho model/request.", "ex": "Phương án B phản ánh đúng bản chất sinh (generative) cơ bản của các mô hình ngôn ngữ lớn. Claude không truy xuất một mẫu phản hồi cố định cho một prompt cho trước. Thay vào đó, nó tạo ra phản hồi một cách tuần tự, chọn từng token tiếp theo dựa theo phân phối xác suất mà model tạo ra. Do đó, các lần chạy tương đương về mặt ngữ nghĩa có thể khác nhau về cách diễn đạt, trình tự, việc có trích dẫn nguyên văn ngôn ngữ của prompt hay không, và việc có diễn giải lại hay không.\n\nTài liệu API của Anthropic mô tả rõ ràng rằng các tham số sampling kiểm soát tính ngẫu nhiên trong việc chọn token tiếp theo, và cũng nêu rằng ngay cả các cấu hình được thiết kế để giảm thiểu tính ngẫu nhiên cũng không làm cho đầu ra hoàn toàn tất định. Các thế hệ model Claude hiện tại ngày càng tự quản lý sampling nội bộ, nhưng nguyên tắc nền tảng vẫn không đổi: đầu ra sinh ra không được đảm bảo là giống hệt nhau về mặt văn bản giữa các lệnh gọi tương đương.\n\nDo đó, việc thấy prompt gốc được lặp lại nguyên văn trong một phản hồi và được diễn giải lại trong một phản hồi khác, tự bản thân nó, không chứng minh được rằng việc xây dựng request bị lỗi. Một vấn đề xây dựng request thực sự cần được xác lập thông qua các bản trace cho thấy các hướng dẫn hệ thống, tin nhắn, tham số, hoặc ngữ cảnh khác nhau.\n\nPhương án A, C và D suy diễn không đúng về các lỗi triển khai cụ thể mà không có bằng chứng hỗ trợ.\n\nCâu hỏi được cung cấp xác định B là phản hồi đúng đắn. Các chủ đề liên quan: SW Eng Foundations, sinh token (token generation), sampling, tính không tất định (nondeterminism), gỡ lỗi, và hành vi của model."}, {"n": 10, "cat": "E", "topic": 4, "q": "Your team is preparing a new Claude application for production, and the product team has asked for a cost projection. The team needs to estimate the cost based on expected request volume, average input length, and average output length. How would you build the projection?", "o": ["Build a cost model that uses the average per-request cost from a similar Claude application the team built last year, scaling that figure by expected request volume.", "Build a cost model that combines expected request volume, average input tokens, average output tokens, the chosen model's pricing, and any caching benefits.", "Build a cost model that combines expected request volume and average input tokens, treating output tokens as a small enough share of cost to leave out of the projection.", "Build a cost model based on expected request volume and the chosen model's pricing, treating average input and output token counts as variables to be estimated post-launch."], "a": 1, "sk": ["cost projection"], "note": "Ước lượng chi phí = số request × (token vào + token ra) × giá model. Bẫy: {C}/{D} thiếu token ra hoặc thiếu token, {A} lấy số trung bình app khác.", "ex": "Đáp án B là mô hình tính toán chi phí đầy đủ và chính xác nhất: Chi phí sử dụng Claude API được tính dựa trên cả Input Tokens và Output Tokens (thường output tokens có giá cao hơn input tokens), nhân với đơn giá của model cụ thể (như Claude 3.5 Sonnet, Claude 3 Haiku...). Ngoài ra, việc tính đến cơ chế Prompt Caching giúp tối ưu và phản ánh đúng chi phí thực tế.\n\nCác phương án A, C, D sai:\n\nA: Áp dụng chi phí của ứng dụng cũ không chính xác vì mỗi ứng dụng có ngữ cảnh prompt và lượng token khác nhau.\n\nC: Bỏ qua Output Tokens là sai lầm vì giá token đầu ra luôn đắt hơn token đầu vào.\n\nD: Trì hoãn việc ước tính token đến sau khi ra mắt sẽ không đáp ứng được yêu cầu tạo bảng dự toán chi phí ban đầu của đội ngũ sản phẩm."}, {"n": 11, "cat": "E", "topic": 5, "q": "You are setting up Claude Code for a new project repository. Your team has shared coding standards, preferred libraries, and project-specific context that every developer working on the repository should have available when they use Claude Code. How would you set this up?", "o": ["Document the standards in a separate wiki page maintained outside the repository so the documentation stays decoupled from the source code.", "Configure Claude Code through environment variables that each developer sets on their own machine when they begin working in the repository.", "Initialize Claude Code in the repository and document the standards and project-specific context in a CLAUDE.md file at the repository root.", "Add the coding standards and project context to the repository's existing README file and direct developers to reference it when starting Claude Code sessions."], "a": 2, "sk": ["every developer working on the repository should have available"], "note": "Bẫy: {A} wiki ngoài repo, {B} biến môi trường từng người, {D} README. Đáp án: khởi tạo Claude Code trong repo, ghi chuẩn vào CLAUDE.md.", "ex": "Đáp án C là chuẩn kiến trúc của Claude Code: Claude Code tự động tìm kiếm và đọc file cấu hình CLAUDE.md nằm ở thư mục gốc (root) của dự án để nạp các chỉ thị về phong cách code, quy trình build/test, thư viện sử dụng và ngữ cảnh đặc thù của repository cho mọi phiên làm việc.\n\nCác phương án A, B, D sai:\n\nA & D: Claude Code không tự động tối ưu việc đọc ngữ cảnh quy chuẩn từ Wiki bên ngoài hay file README chung của dự án.\n\nB: Biến môi trường dùng để quản lý cấu hình hệ thống (như API key), không dùng để lưu trữ các tài liệu hướng dẫn ngữ cảnh và tiêu chuẩn viết code."}, {"n": 12, "cat": "E", "topic": 4, "q": "Your Claude application's token costs have grown faster than expected. The team has not been tracking token usage by feature, so the team cannot identify which features are driving cost. The team is debating how to respond. How would you respond?", "o": ["Tell the team that cost growth is unavoidable as the application scales and that no investigation will change the trajectory of the application's cost over the next several quarters.", "Switch every feature to the smallest model to cut cost broadly across the application during normal operation.", "Reduce token usage uniformly across all features by half, applying the cut evenly across the application during normal operation.", "Add token usage tracking by feature to the application's logging so the team can identify which features drive cost before recommending changes."], "a": 3, "sk": ["not been tracking token usage by feature"], "note": "Chưa biết tính năng nào tốn → đo trước: theo dõi token theo tính năng. Bẫy: {B} đổi model nhỏ nhất, {C} cắt đều 50%, {A} chấp nhận.", "ex": "Đáp án D là phương pháp quản trị chi phí chuẩn (Observability & Data-driven decision): Để giải quyết vấn đề tối ưu chi phí (cost optimization), nguyên tắc đầu tiên là phải có số liệu đo lường chính xác (Observability). Việc thêm logging theo dõi token consumption per feature giúp đội ngũ xác định đúng \"thủ phạm\" trước khi thực hiện bất kỳ điều chỉnh về mô hình hay kiến trúc nào.\n\nCác phương án A, B, C sai:\n\nA: Mang tính buông xuôi, không đưa ra giải pháp kỹ thuật phù hợp.\n\nB & C: Đưa ra hành động cắt giảm mù quáng/đồng loạt khi chưa có dữ liệu sẽ làm giảm chất lượng dịch vụ (degrade user experience) của những tính năng vốn dĩ không tiêu tốn nhiều token hoặc đòi hỏi mô hình thông minh hơn."}, {"n": 13, "cat": "T", "topic": 2, "q": "Your Claude application uses tool calling to fetch patient data and generate summary reports. The flow occasionally fails because the model returns a tool_use block that references arguments not present in the schema, and your application code does not handle this case gracefully. How would you address this?", "o": ["Validate the tool_use block's arguments against the tool schema before dispatching the tool and handle invalid arguments as a recognized error path.", "Log invalid tool_use blocks when they occur and allow the tool dispatch to proceed, relying on the tool's own error handling to surface failures back to the application.", "Retry the same request repeatedly until the model returns a valid tool_use block that matches the schema as expected.", "Stop using tool calling entirely and replace tools with prompted text generation that asks the model to describe what it would do."], "a": 0, "sk": ["references arguments not present in the schema"], "note": "Validate tham số tool_use theo schema trước khi dispatch. Bẫy: {B} chỉ log, {C} retry mãi, {D} bỏ tool calling.", "ex": "Câu hỏi này trình bày một lỗi ranh giới tin cậy (trust-boundary failure): các tham số công cụ do model tạo ra đang được chấp nhận mà không có đủ xác thực trước khi một thao tác bên ngoài được thực thi. Do đó, một lệnh gọi công cụ nên được xem như dữ liệu đầu vào đến từ bất kỳ giao diện ứng dụng có kiểu dữ liệu nào - ứng dụng phải đảm bảo rằng tên công cụ và các tham số thỏa mãn hợp đồng đã khai báo trước khi thực thi.\n\nAnthropic mô tả tool use như một hợp đồng, trong đó ứng dụng định nghĩa schema của công cụ và Claude trả về tool_use input có cấu trúc. Chức năng hiện tại của Claude cũng hỗ trợ strict: true, đảm bảo đầu vào công cụ tuân thủ schema thông qua constrained generation và giải quyết cụ thể các trường hợp tham số bịa đặt, kiểu dữ liệu không tương thích, và các trường bắt buộc bị thiếu. Đối với các ứng dụng không sử dụng strict tool use, việc xác thực rõ ràng ở phía ứng dụng và một đường xử lý lỗi có kiểm soát vẫn là điều thiết yếu.\n\nPhương án B chủ động thực thi đầu vào không hợp lệ. Phương án C dựa vào việc lặp lại không kiểm soát thay vì xác thực có tính tất định và khôi phục có giới hạn. Phương án D loại bỏ một khả năng hữu ích thay vì sửa ranh giới thực thi của nó.\n\nDo đó, A cung cấp thiết kế phòng vệ đúng đắn. Các chủ đề liên quan trong Study Guide: tool calling, tool_use, input_schema, strict tool use, xác thực schema, thực thi phòng vệ (defensive execution), xử lý lỗi, và dispatch công cụ an toàn."}, {"n": 14, "cat": "T", "topic": 2, "q": "Your Claude agent has access to a tool that retrieves customer records. A teammate has noticed that the agent occasionally calls the tool with arguments the schema does not declare, and the tool's downstream service returns an error each time. The teammate proposes loosening the schema so the tool accepts whatever arguments the model produces. How would you respond?", "o": ["Add a system prompt instruction telling the model to produce schema-conforming arguments, treating the prompt instruction as the primary mechanism for keeping the agent's tool calls valid.", "Keep the schema strict, validate arguments before dispatching, and return a structured error so the agent can retry.", "Remove the schema entirely and rely on the downstream service to reject invalid calls, treating the downstream service as the team's primary enforcement layer.", "Loosen the schema as the teammate proposed so the downstream service receives every call the agent makes during normal operation."], "a": 1, "sk": ["proposes loosening the schema"], "note": "Bẫy: {D} nới schema như teammate đề xuất, {C} bỏ schema, {A} chỉ dặn trong prompt. Đáp án: giữ schema chặt, validate, trả lỗi có cấu trúc.", "ex": "Tại sao chọn B:\n\nTrong kiến trúc làm việc với AI Agent (như Claude), schema đóng vai trò là ranh giới an toàn và quy chuẩn dữ liệu.\n\nKhi agent truyền sai tham số, cách xử lý chuẩn là thực hiện validation (kiểm tra) ở phía ứng dụng/client trước khi gọi dịch vụ downstream. Nếu tham số không hợp lệ, hãy trả về một structured error message (thông báo lỗi rõ ràng) để Claude nhận biết lỗi, tự sửa lỗi và thử gọi lại (retry).\n\nTại sao các phương án khác sai\nA (Dùng system prompt làm cơ chế chính): Prompt chỉ mang tính định hướng, không đảm bảo 100% mô hình tuân thủ quy tắc. Prompt không thể thay thế việc validation cứng ở tầng mã nguồn.\n\nC (Xóa schema, đẩy trách nhiệm cho downstream service): Việc gửi dữ liệu rác xuống downstream service làm tăng lưu lượng không cần thiết, tăng độ trễ và có thể gây lỗi hệ thống phía sau.\n\nD (Nới lỏng schema theo lời đồng nghiệp): Nới lỏng schema không giải quyết triệt để nguyên nhân gốc rễ (downstream service vẫn sẽ từ chối hoặc lỗi nếu nhận dữ liệu không mong muốn)."}, {"n": 15, "cat": "E", "topic": 5, "q": "You are running Claude Code as part of an automated continuous integration pipeline. The pipeline needs Claude Code to execute a set of well-defined tasks without prompting for confirmation, and the output needs to be captured for downstream processing. How would you configure the pipeline?", "o": ["Replace Claude Code with a different tool that does not require any configuration to operate without confirmation prompts in the pipeline.", "Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for downstream processing.", "Disable Claude Code's confirmation prompts globally across all environments so the pipeline runs without interruption from any prompt.", "Run Claude Code in interactive mode and have a developer manually approve every confirmation prompt while the pipeline executes its tasks."], "a": 1, "sk": ["without prompting for confirmation"], "note": "CI không có người duyệt → headless mode, quyền cấu hình sẵn trong settings.json. Bẫy: {C} tắt xác nhận toàn cục, {D} chạy interactive.", "ex": "Tại sao chọn B:\n\nTrong môi trường CI/CD tự động, công cụ CLI như Claude Code cần chạy ở chế độ headless (không giao diện tương tác) để tránh bị dừng chờ người dùng bấm xác nhận.\n\nCấu hình quyền sẵn trong file settings.json giúp công cụ có đủ thẩm quyền thực thi tác vụ an toàn mà không bị ngắt quãng, đồng thời cho phép bắt stdout/stderr để truyền dữ liệu cho các bước tiếp theo trong pipeline.\n\nTại sao các phương án khác sai\nA (Thay thế bằng công cụ khác): Không giải quyết yêu cầu sử dụng Claude Code và không cần thiết.\n\nC (Tắt xác nhận trên toàn bộ các môi trường): Việc tắt cảnh báo toàn cục (bao gồm cả môi trường local) gây ra rủi ro bảo mật rất lớn.\n\nD (Chạy thủ công ở chế độ interactive): Đi ngược lại hoàn toàn với bản chất của một pipeline tự động (CI/CD)."}, {"n": 16, "cat": "T", "topic": 1, "q": "You are designing an agent that handles a complex claim-processing workflow. Each claim moves through fact extraction, eligibility evaluation, and a decision step. The three subtasks have distinct success criteria, and some claims require iteration between fact extraction and eligibility evaluation before a decision can be reached. Which agent pattern would you apply?", "o": ["A graph-based pattern that lets the agent move between subtasks based on the state of each claim, with each subtask evaluated against its own criteria.", "A streaming pattern that emits partial decisions as the agent processes each claim, refining the output until a final decision emerges from the stream.", "A single tool-use loop pattern that gives one agent access to all the tools needed for fact extraction, eligibility evaluation, and decision-making.", "A linear chain pattern that processes every claim through fact extraction, then eligibility evaluation, then decision, with no return paths between subtasks."], "a": 0, "sk": ["some claims require iteration between fact extraction and eligibility evaluation"], "note": "Cần quay lại giữa các bước theo trạng thái → mẫu graph. Bẫy: {D} chuỗi tuyến tính, {C} một vòng lặp tool, {B} streaming.", "ex": "Đáp án A là lựa chọn chuẩn xác: Đối với các quy trình công việc (workflows) phức tạp có các chu kỳ lặp (cycles/feedback loops), nhiều trạng thái rẽ nhánh và tiêu chí đánh giá riêng cho từng bước, Graph-based pattern (như LangGraph hoặc các mô hình State Machine) là kiến trúc tối ưu nhất để quản lý luồng thực thi linh hoạt.\n\nCác phương án B, C, D sai:\n\nB: Streaming chỉ dùng để hiển thị dữ liệu thời gian thực cho UI, không phải là mô hình điều hướng quy trình (workflow orchestration).\n\nC: Gom tất cả công cụ vào một vòng lặp đơn lẻ sẽ làm agent dễ mất định hướng, khó kiểm soát trạng thái và không tách biệt được tiêu chí thành công cho từng bước.\n\nD: Mô hình chuỗi tuyến tính (Linear chain) không hỗ trợ đường quay lại (return paths/iterations) giữa các bước theo yêu cầu của đề bài."}, {"n": 17, "cat": "T", "topic": 1, "q": "You are designing an agent that processes vendor invoices. The work involves a small number of well- understood steps, but occasionally an invoice arrives in an unexpected format that requires the system to decide between rerouting, requesting clarification, or flagging for human review. The most appropriate architecture for this system is...", "o": ["A fully autonomous agent that handles every invoice from start to finish across all formats.", "A manager agent that delegates each step of standard invoice processing to a dedicated subagent, with a separate subagent handling each unexpected format.", "A single large prompt that processes every incoming invoice, both standard and unexpected, in one model call.", "A workflow for the standard path with an agent invoked at the decision point for unexpected formats."], "a": 3, "sk": ["a small number of well- understood steps"], "note": "Đường chuẩn → workflow; chỉ gọi agent ở điểm quyết định với hoá đơn lạ. Bẫy: {A} agent tự trị hoàn toàn, {B} manager agent, {C} một prompt lớn.", "ex": "Phương án D áp dụng đúng mô hình lai (hybrid pattern). Anthropic phân biệt workflows - nơi LLM và các công cụ thực thi theo các đường mã (code paths) đã được định nghĩa trước - với agents, nơi model tự động xác định cách tiến hành.\n\nAnthropic khuyến nghị lựa chọn kiến trúc đơn giản nhất đáp ứng được yêu cầu: workflows mang lại tính dự đoán được và nhất quán cho các nhiệm vụ đã được hiểu rõ, trong khi agents có giá trị ở những nơi cần các quyết định linh hoạt do model điều khiển.\n\nViệc xử lý hóa đơn tiêu chuẩn được mô tả rõ ràng là gồm một số ít các bước đã biết. Điều đó khiến một workflow tất định trở thành lựa chọn mặc định phù hợp vì đường xử lý có thể được kiểm thử, giám sát, và tái tạo lại.\n\nNhánh định dạng bất thường thì khác: hệ thống phải suy luận giữa việc chuyển hướng, yêu cầu làm rõ, hoặc chuyển lên con người xử lý. Điểm quyết định đó chính là nơi tính linh hoạt của agent mang lại giá trị.\n\nPhương án A biến toàn bộ quy trình thành tự động hóa mặc dù hầu hết các bước không cần đến tính tự chủ, làm tăng chi phí, độ trễ, và tính khó dự đoán. Phương án B đưa vào nhiều agent chuyên biệt mặc dù chưa chứng minh được nhu cầu cho độ phức tạp đó. Phương án C gộp việc xử lý tất định và xử lý ngoại lệ vào một lệnh gọi model duy nhất, khiến việc xác thực và gỡ lỗi khó khăn hơn.\n\nDo đó, D kết hợp tính dự đoán được của workflow với khả năng suy luận agentic có mục tiêu. Các chủ đề liên quan trong Study Guide: workflows so với agents, định tuyến (routing), xử lý ngoại lệ, kiến trúc agentic lai, chuyển lên xử lý (escalation), và giảm thiểu độ phức tạp."}, {"n": 18, "cat": "T", "topic": 4, "q": "Your Claude application runs long agentic workflows where the agent makes many tool calls, and the conversation history grows quickly. After about 20 tool calls, you notice the agent's responses become less focused and sometimes ignore earlier task constraints. How would you address this?", "o": ["Remove tool calling from the workflow entirely so the agent operates as a single textgeneration step with no tool outputs accumulating in the context window.", "Apply context engineering techniques such as tool output pruning or compaction to keep the active task state visible while reducing the volume of older content.", "Increase the model's context window so the agent can hold every tool output at full detail across the entire workflow no matter how many tool calls it accumulates.", "Restart the agent every five tool calls to prevent any drift, with the agent losing all task state at each restart point during the workflow."], "a": 1, "sk": ["After about 20 tool calls"], "note": "Context phình → context engineering: cắt output tool cũ / compaction. Bẫy: {C} tăng context, {D} restart mỗi 5 lần, {A} bỏ tool.", "ex": "Đáp án B là phương án tối ưu nhất: Khi cửa sổ ngữ cảnh bị lấp đầy bởi quá nhiều lịch sử gọi công cụ, hiện tượng \"context drift\" (lệch ngữ cảnh/mất tập trung) sẽ xảy ra. Kỹ thuật Context Engineering (như nén tóm tắt các bước cũ hoặc xóa bớt các dữ liệu kết quả công cụ dư thừa không còn dùng tới) giúp mô hình tập trung vào các ràng buộc cốt lõi và nhiệm vụ hiện tại mà không làm mất đi luồng trạng thái quan trọng.\n\nPhương án A sai: Xóa bỏ công cụ sẽ làm mất đi khả năng thực thi tác vụ phức tạp của agent.\n\nPhương án C sai: Tăng kích thước context window chỉ giúp chứa thêm dung lượng chứ không giải quyết được triệt để hiện tượng mô hình bị loãng/mất tập trung khi thông tin rác tích tụ quá nhiều (gợi nhớ hiện tượng lost in the middle).\n\nPhương án D sai: Khởi động lại và làm mất hoàn toàn trạng thái công việc sẽ khiến agent không thể hoàn thành chuỗi tác vụ liên tục."}, {"n": 19, "cat": "E", "topic": 3, "q": "Your Claude application requests structured JSON output from the model. Most of the time the JSON is well- formed, but occasionally Claude returns malformed JSON that breaks downstream processing. How would you handle the malformed output?", "o": ["Manually inspect every response before downstream processing so a human reviewer catches any malformed JSON before the application passes the response to downstream systems.", "Add output validation that parses Claude's response against the expected schema and treats malformed output as a recognized error path with retry or fallback handling.", "Switch to free-form text output so the application no longer depends on JSON parsing for any of the responses it sends to downstream systems during normal operation.", "Retry the same request repeatedly until valid JSON appears in the model's response, with the retry loop adding delay to the application's response time on affected requests."], "a": 1, "sk": ["occasionally Claude returns malformed JSON"], "note": "Validate output theo schema, sai thì coi là lỗi để xử lý (retry/sửa). Bẫy: {A} duyệt tay, {C} bỏ JSON, {D} retry mãi.", "ex": "Đáp án B là giải pháp chuẩn kiến trúc kỹ thuật (Defensive Parsing & Schema Validation): Khi làm việc với đầu ra có cấu trúc (structured output) từ LLM, luôn cần có lớp Validation (như Pydantic, Zod, hoặc json.loads) ở ứng dụng. Khi phát hiện lỗi parse hoặc sai schema, ứng dụng cần coi đó là một trường hợp lỗi hợp lệ để kích hoạt luồng Retry (có prompt nhắc lại lỗi) hoặc Fallback logic một cách an toàn.\n\nCác phương án A, C, D sai:\n\nA: Kiểm tra thủ công loại bỏ tính tự động hóa của ứng dụng.\n\nC: Bỏ JSON chuyển sang văn bản tự do không giải quyết được nhu cầu dữ liệu có cấu trúc cho các hệ thống phía sau.\n\nD: Thử lại vô hạn (loop infinitely) mà không có kiểm soát lỗi/giới hạn sẽ gây treo ứng dụng và tốn chi phí API."}, {"n": 20, "cat": "E", "topic": 6, "q": "Your Claude application receives untrusted input from external sources. The team is establishing how the application should treat this untrusted input. Untrusted input would be...", "o": ["Validated and sanitized before being incorporated into prompts, and treated as data the model should not interpret as instructions.", "Treated identically to trusted input from internal sources, on the grounds that all input the application receives can be handled the same way.", "Routed through a separate Claude application with more lax security controls so the original application does not handle the untrusted input directly.", "Blocked entirely so the application accepts only trusted input, with no path for legitimate external input the application might process."], "a": 0, "sk": ["untrusted input from external sources"], "note": "Input không tin cậy → validate, sanitize, coi là dữ liệu không phải chỉ dẫn. Bẫy: {B} coi như input tin cậy, {D} chặn hoàn toàn.", "ex": "A. Đúng (Lựa chọn chính xác):\n\nXác thực và làm sạch (Validation & Sanitization): Loại bỏ hoặc mã hóa các ký tự đặc biệt/chuỗi độc hại trước khi chèn vào prompt để giảm thiểu nguy cơ tấn công Prompt Injection.\n\nCoi là dữ liệu thuần túy (Treat as data, not instructions): Dùng các cơ chế phân tách rõ ràng (như thẻ XML <user_input>...<\/user_input>) để dặn mô hình chỉ coi đây là nội dung cần xử lý, không phải là câu lệnh điều khiển hệ thống.\n\nB. Sai:\n\nCoi dữ liệu không đáng tin cậy (từ bên ngoài) giống hệt dữ liệu đáng tin cậy (nội bộ) là một sai lầm nghiêm trọng về bảo mật. Dữ liệu bên ngoài hoàn toàn có thể chứa các câu lệnh cố tình \"ghi đè\" (override) prompt hệ thống.\n\nC. Sai:\n\nChuyển hướng qua một ứng dụng khác với cơ chế bảo mật nới lỏng hơn không giải quyết được rủi ro bảo mật mà còn làm gia tăng lỗ hổng cho toàn bộ hệ thống.\n\nD. Sai:\n\nChặn hoàn toàn dữ liệu bên ngoài sẽ khiến ứng dụng không thể tiếp nhận và xử lý các yêu cầu thực tế từ người dùng cuối, làm mất đi tính năng vốn có của hệ thống."}, {"n": 21, "cat": "T", "topic": 6, "q": "Your Claude application is deployed to development, staging, and production environments. Each environment uses a different model version, different prompt versions, and different plugin dependencies, but the configuration is currently scattered across environment variables, hardcoded values, and undocumented setup scripts. How would you manage the configuration?", "o": ["Use the latest available model version everywhere and stop pinning model versions, on the grounds that pinning adds maintenance overhead the team should aim to reduce.", "Move all configuration into hardcoded application code to reduce reliance on external configuration sources that are difficult to track over time.", "Consolidate the configuration into a version-controlled system documenting model version pinning, prompt versioning, and plugin dependencies for each environment.", "Standardize all environments to use the same configuration values to eliminate the differences between development, staging, and production."], "a": 2, "sk": ["configuration is currently scattered"], "note": "Gom cấu hình vào hệ thống có version control, ghi rõ model/prompt/plugin theo môi trường. Bẫy: {D} ép mọi môi trường giống nhau, {B} hardcode.", "ex": "Đáp án đúng là C: Consolidate the configuration into a version-controlled system documenting model version pinning, prompt versioning, and plugin dependencies for each environment. Giải thích:\n\nĐáp án C (Đúng): Quản lý cấu hình tập trung và đưa vào hệ thống quản lý phiên bản (Version Control System như Git) là thực hành chuẩn (Infrastructure as Code / Configuration Management). Điều này đảm bảo tính minh bạch, có thể tái lập (reproducibility), dễ theo dõi lịch sử thay đổi của phiên bản model (model pinning), phiên bản prompt và các plugin phụ thuộc trên từng môi trường (dev, staging, prod).\n\nĐáp án A (Sai): Không cố định (pin) phiên bản model có thể khiến ứng dụng bị lỗi đột ngột trên production khi nhà cung cấp cập nhật model mới làm thay đổi hành vi/đầu ra.\n\nĐáp án B (Sai): Hardcode cấu hình vào mã nguồn ứng dụng làm mất tính linh hoạt, gây rủi ro bảo mật và cực kỳ khó quản lý khi triển khai qua nhiều môi trường khác nhau.\n\nĐáp án D (Sai): Chuẩn hóa tất cả môi trường dùng chung một giá trị cấu hình là không thực tế, vì môi trường Dev/Staging thường cần dùng các phiên bản model thử nghiệm hoặc prompt mới trước khi đưa lên Production."}, {"n": 22, "cat": "E", "topic": 6, "q": "You are setting up a Claude application that requires API keys for several external services. What is the best way to store the keys?", "o": ["Put the keys in the application's configuration file and check the configuration file into the team's repository alongside the rest of the source code.", "Store the keys in a secrets manager or environment-specific configuration that is not checked into source code, and load them at runtime.", "Use a single shared key across all external services, so any developer working on the application can find the keys easily during development.", "Email the keys to each developer as needed and have each developer paste the keys into their local environment when they begin working on the application's code."], "a": 1, "sk": ["requires API keys for several external services"], "note": "Key → secrets manager / cấu hình theo môi trường, không commit. Bẫy: {A} commit file cấu hình, {C} dùng chung một key, {D} gửi email.", "ex": "Bảo mật và Quản lý bí mật (B): Không bao giờ được commit API keys hoặc thông tin nhạy cảm vào kho lưu trữ mã nguồn (Git/repository). Phương pháp chuẩn là sử dụng trình quản lý bí mật (như AWS Secrets Manager, HashiCorp Vault, HashiCorp Consul, dotenv/environment variables không bị commit) và tải các khóa này vào ứng dụng tại runtime.\n\nTại sao các phương án khác sai\nA: Lộ API keys trực tiếp lên kho chứa mã nguồn (đặc biệt nếu là public repo hoặc shared repo) là nguy cơ bảo mật nghiêm trọng.\n\nC: Việc dùng chung khóa làm mất tính cô lập, khó kiểm soát quyền hạn và theo dõi chi phí/hạn ngạch của từng dịch vụ.\n\nD: Gửi khóa qua email là phương thức không an toàn, dễ bị rò rỉ và khó quản lý việc xoay vòng khóa (key rotation)."}, {"n": 23, "cat": "T", "topic": 6, "q": "A teammate has asked how the Claude SDK handles transient API errors, such as a temporary network issue or a brief rate-limit response. They want to know whether the application code needs to handle every transient error or whether the SDK provides any default behavior. How would you describe the SDK's default behavior?", "o": ["The SDK provides default retry behavior for transient errors up to a fixed number of attempts, and this behavior is not configurable.", "The SDK provides default retry behavior for network errors but surfaces rate-limit responses directly to the application code, which must implement its own retry logic for those cases.", "The SDK logs transient errors to a default error stream and continues execution without retrying, leaving the application code responsible for detecting and responding to failed calls.", "The SDK provides default retry behavior for many transient errors, and the application code can configure or extend that behavior as needed."], "a": 3, "sk": ["transient API errors"], "note": "SDK có retry mặc định cho nhiều lỗi tạm thời, app vẫn xử lý lỗi còn lại. Bẫy: {A}/{B} mô tả sai phạm vi retry, {C} chỉ log.", "ex": "Đáp án chính xác: D\n\nGiải thích:\n\nHành vi thử lại của Claude SDK (D): Các Anthropic/Claude SDKs (Python, TypeScript) mặc định tự động xử lý và thử lại (auto-retry with exponential backoff) đối với các lỗi tạm thời như lỗi kết nối mạng, lỗi 429 (Rate Limit), hoặc các lỗi máy chủ 5xx (500, 529, v.v.). Đồng thời, SDK cho phép lập trình viên tùy chỉnh tham số này (ví dụ: thay đổi số lần max_retries hoặc cấu hình lại các mã lỗi cần retry).\n\nTại sao các phương án khác sai\nA: Sai vì SDK cho phép tùy chỉnh/cấu hình số lần retry chứ không phải cố định không thể thay đổi.\n\nB: Sai vì SDK mặc định có hỗ trợ thử lại cho cả lỗi 429 (rate-limit).\n\nC: Sai vì SDK không chỉ bỏ qua và tiếp tục mà chủ động thử lại cuộc gọi API trước khi trả về ngoại lệ (exception) nếu vượt quá số lần retry."}, {"n": 24, "cat": "E", "topic": 4, "q": "The product team has asked you to choose a Claude model for a new feature. The team has provided functional requirements but has not specified performance, cost, or quality targets. The team's product manager says, \"Use whatever model gives us the best results.\" How would you respond?", "o": ["Ask the product team to specify quality, latency, and cost targets, then select the model whose tradeoffs best fit those targets.", "Run every Claude model on a representative sample and pick whichever scores best on a generic benchmark.", "Choose a mid-tier model and ship the feature, because mid-tier models work for most use cases without specified targets.", "Choose the largest, highest-capability Claude model, on the grounds that \"best results\" is most likely to mean highest quality."], "a": 0, "sk": ["Use whatever model gives us the best results"], "note": "Chưa có mục tiêu → hỏi mục tiêu chất lượng, độ trễ, chi phí rồi mới chọn model. Bẫy: {D} model lớn nhất, {C} mid-tier, {B} thử hết.", "ex": "Đáp án đúng là A: Ask the product team to specify quality, latency, and cost targets, then select the model whose tradeoffs best fit those targets. Dịch câu hỏi:Đội ngũ sản xuất yêu cầu bạn chọn một mô hình Claude cho tính năng mới. Đội ngũ đã cung cấp các yêu cầu chức năng nhưng chưa xác định cụ thể các mục tiêu về hiệu năng (performance), chi phí (cost) hay chất lượng (quality). Quản lý sản phẩm (Product Manager) nói: \"Hãy dùng bất kỳ mô hình nào mang lại kết quả tốt nhất.\" Bạn sẽ phản hồi như thế nào? Giải thích:\n\nĐáp án A (Đúng): Định nghĩa \"kết quả tốt nhất\" (best results) là mơ hồ nếu không có các chỉ số cụ thể. Mỗi mô hình Claude có sự đánh đổi (tradeoffs) riêng giữa chất lượng, độ trễ và chi phí. Việc yêu cầu đội ngũ sản phẩm làm rõ các tiêu chí này là bước bắt buộc để chọn được mô hình tối ưu nhất cho bài toán.\n\nĐáp án B (Sai): Các bài đánh giá chung (generic benchmarks) không phản ánh chính xác hiệu năng của mô hình trên các tác vụ nghiệp vụ cụ thể của sản phẩm.\n\nĐáp án C (Sai): Việc tự ý chọn mô hình tầm trung mà không làm rõ yêu cầu có thể dẫn đến việc không đạt chất lượng đầu ra hoặc lãng phí tài nguyên không cần thiết.\n\nĐáp án D (Sai): Dùng mô hình lớn nhất/mạnh nhất chỉ dựa trên giả định về chất lượng sẽ dễ làm tăng chi phí API và độ trễ (latency) lên rất cao mà chưa chắc đã cần thiết cho tính năng đó."}, {"n": 25, "cat": "T", "topic": 3, "q": "Your team is debating how to manage the prompts used in your Claude application. Some prompts are checked into the code repository, some live in a separate configuration file, and some are constructed inline at runtime. The result is inconsistent, and a recent prompt change went out without code review. What steps would you take?", "o": ["Move all prompts out of version control to a separate spreadsheet that team members can edit freely as the application evolves over time.", "Move all prompts to inline runtime construction so the team can update them quickly through a streamlined process outside the standard code review workflow.", "Establish a single source of truth for prompts but keep change review optional, allowing developers to update prompts directly when changes are urgent.", "Establish a single source of truth for prompts, version-control them alongside code, and require code review for prompt changes."], "a": 3, "sk": ["Some prompts are checked into the code repository"], "note": "Một nguồn duy nhất cho prompt, version control cùng code, review thay đổi. Bẫy: {C} review không bắt buộc, {A} spreadsheet, {B} inline.", "ex": "Đáp án đúng là D: Establish a single source of truth for prompts, version-control them alongside code, and require code review for prompt changes. Dịch câu hỏi:Đội ngũ của bạn đang tranh luận về cách quản lý các prompt được sử dụng trong ứng dụng Claude. Một số prompt được lưu trong repository mã nguồn, một số nằm trong tệp cấu hình riêng, và một số được dựng trực tiếp (inline) trong lúc chạy. Kết quả là sự thiếu đồng bộ, và một thay đổi prompt gần đây đã được phát hành mà không qua kiểm duyệt code (code review). Bạn sẽ thực hiện những bước nào? Giải thích:\n\nĐáp án D (Đúng): Prompt engineering đóng vai trò cốt lõi trong logic của ứng dụng LLM và nên được quản lý như mã nguồn (Prompt-as-Code). Việc thiết lập một nguồn dữ liệu duy nhất (single source of truth), quản lý phiên bản (version control) chung với repository và bắt buộc kiểm duyệt (code review) sẽ đảm bảo tính đồng bộ, minh bạch và an toàn khi thay đổi prompt.\n\nĐáp án A (Sai): Chuyển prompt ra bảng tính ngoài gây mất kiểm soát phiên bản và không tích hợp được vào quy trình kiểm thử tự động của ứng dụng.\n\nĐáp án B (Sai): Bỏ qua quy trình kiểm duyệt chuẩn chỉ làm tăng nguy cơ phát sinh lỗi và hành vi không mong muốn trên môi trường thực tế.\n\nĐáp án C (Sai): Cho phép bỏ qua kiểm duyệt khi cần gấp dễ dẫn đến việc vi phạm quy trình quản lý chất lượng và lặp lại sự cố ban đầu."}, {"n": 26, "cat": "T", "topic": 4, "q": "Your agent makes 10 to 15 tool calls per task, and you have noticed it sometimes loses track of earlier results by the time it reaches later steps. The agent's context window is large enough to hold all the messages, but the relevant information appears to get buried as the conversation grows. How would you address this?", "o": ["Switch to a different agentic framework that advertises automatic context-window management as a built-in feature.", "Reduce the number of tool calls per task by combining several existing tools into larger, multi-purpose tools.", "Increase the context window further so all tool outputs from every prior step remain in full detail throughout the task.", "Apply a context-management pattern that summarizes or prunes older tool outputs while preserving the active task state."], "a": 3, "sk": ["loses track of earlier results"], "note": "Context đủ chỗ nhưng thông tin bị chìm → tóm tắt/cắt output tool cũ, giữ kết quả quan trọng. Bẫy: {C} tăng context, {A} đổi framework.", "ex": "Đáp án chính xác: D\n\nGiải thích:\n\nVấn đề \"Lost in the Middle\" và Quản lý ngữ cảnh (D): Dù cửa sổ ngữ cảnh đủ lớn, các mô hình ngôn ngữ lớn (LLM) vẫn gặp hiện tượng suy giảm khả năng chú ý khi hội thoại quá dài (thông tin
