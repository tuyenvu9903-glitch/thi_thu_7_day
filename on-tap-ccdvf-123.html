          <div class="qhead"><span class="eyebrow">Câu ${i + 1} · câu gốc #${q.n}</span><span class="mark ${l.cat === "E" ? "ok" : "blank"}">${l.cat === "P" ? "Cặp bẫy" : l.cat === "E" ? "Dễ" : "Khó"}</span></div>
          <p class="stem">${showKw ? cMark(q.q, q.sk) : fmt(q.q)}</p>
          ${done ? `<p class="instr"><span class="mark ${cOk(q, mine) ? "ok" : "no"}">${cOk(q, mine) ? "Đúng" : "Sai"}</span>${l.label ? ` <span class="clabel">Đáp án câu này: <b>${esc(l.label[n])}</b></span>` : ""}</p>` : `<p class="instr">${Array.isArray(q.a) ? `Select ${COUNT[q.a.length] || q.a.length}. <span class="clabel">(đã chọn ${(cPend[n] || []).length}/${q.a.length})</span>` : "Select ONE."}</p>`}
          ${opts}
          <div class="navrow">
            <button class="btn" ${cAttr({ v: "q", l: l.id, i: i - 1 })} ${i === 0 ? "disabled" : ""}>Câu trước</button>
            <span class="spacer"></span>
            ${last ? `<button class="btn primary" ${cAttr({ v: "sum", l: l.id })}>Xem kết quả bài</button>` : `<button class="btn primary" ${cAttr({ v: "q", l: l.id, i: i + 1 })}>Câu tiếp</button>`}
          </div>
        </section>
      </div>
      <aside class="map ${mapOpen ? "open" : ""}" aria-label="Danh sách câu"><h2>Danh sách câu</h2><div><h3>${esc(l.name)}<span>${d}/${ord.length}</span></h3><div class="cells">${cells}</div></div>
        <div class="legend"><span><i class="cok"></i>Đúng (${cRight(ord, l)})</span><span><i class="cno"></i>Sai (${d - cRight(ord, l)})</span></div>
        <p class="ckeys">Phím tắt: 1–5 hoặc A–E để chọn, ← → để chuyển câu.</p></aside>
    </main>`;
}
function courseSummary(l) {
  const ord = cOrder[l.id], round = cRound[l.id] || 0;
  const d = cDone(ord, l), r = cRight(ord, l), wrongRound = ord.filter(n => A(l)[n] != null && !cOk(CQ_BY[n], A(l)[n]));
  const left = ord.findIndex(n => A(l)[n] == null);
  const wrongAll = l.ns.filter(n => !cOk(CQ_BY[n], A(l)[n])), mastered = !wrongAll.length;
  const known = l.ns.length - wrongAll.length, first = (CS.res || {})[l.id];
  const idx = C_LESSONS.indexOf(l), nx = C_LESSONS[idx + 1];
  const shown = ord.filter(n => cFilter === "all" ? A(l)[n] != null : cFilter === "wrong" ? wrongRound.includes(n) : cOk(CQ_BY[n], A(l)[n]));
  const cards = shown.map(n => { const q = CQ_BY[n], ok = cOk(q, A(l)[n]); return `<article class="rev"><div class="top"><span class="mark ${ok ? "ok" : "no"}">${ok ? "Đúng" : "Sai"}</span><b>Câu ${ord.indexOf(n) + 1}</b><span>Câu gốc #${n}</span><span>${l.label ? esc(l.label[n]) : l.cat === "E" ? "Dễ" : "Khó"}</span></div><p class="stem">${CS.hl ? cMark(q.q, q.sk) : fmt(q.q)}</p>${cReview(q, A(l)[n])}</article>`; }).join("");
  const nextBtn = nx ? (nx.ch !== l.ch ? `<button class="btn primary" ${cAttr({ v: "ch", c: nx.ch.id })}>Sang Chương ${nx.ch.id}</button>` : `<button class="btn primary" ${cAttr({ v: "q", l: nx.id, i: 0, fresh: 1 })}>Bài tiếp: ${esc(nx.name)}</button>`) : `<button class="btn primary" ${cAttr({ v: "home" })}>Hoàn thành khóa ôn</button>`;
  const main = left >= 0 ? `<button class="btn primary" ${cAttr({ v: "q", l: l.id, i: left })}>Làm tiếp (còn ${ord.length - d} câu)</button>`
    : !mastered ? `<button class="btn primary" id="cloop">Ôn lại ${wrongAll.length} câu sai (vòng ${round + 1})</button>`
    : nextBtn;
  const tag = left >= 0 ? ["", "CHƯA XONG"] : mastered ? ["pass", "ĐÃ THUỘC HẾT"] : ["fail", `CÒN ${wrongAll.length} CÂU SAI`];
  return `<div class="hero"><div class="wrap">
      <div class="eyebrow">Kết quả ${round ? `vòng ôn câu sai ${round}` : "bài"} · Chương ${l.ch.id} · ${esc(l.ch.title)}</div>
      <div class="verdict">
        <div class="score">${r}<small> /${ord.length}</small></div>
        <div><span class="tag ${tag[0]}">${tag[1]}</span>
          <p class="facts">${esc(l.name)} · ${round ? `vòng ${round}: ` : ""}đã làm ${d}/${ord.length} · sai ${wrongRound.length} · đã thuộc ${known}/${l.ns.length} câu của bài</p>
          <p class="facts">${mastered ? "Bạn đã trả lời đúng mọi câu của bài, có thể sang bài tiếp." : "Phải ôn lại đến khi đúng hết các câu sai mới được sang bài tiếp."}${first ? ` Lần làm đầu: đúng ${first.r}/${first.n}.` : ""}</p></div>
      </div>
      <div class="actions">${main}<button class="btn" ${cAttr({ v: "ch", c: l.ch.id })}>Về chương</button></div>
    </div></div>
    <main class="wrap result">
      <section><h2>Xem lại và giải thích</h2>
        <div class="filters">${[["all", "Tất cả", d], ["wrong", "Sai", wrongRound.length], ["right", "Đúng", r]].map(([k, t, c]) => `<button class="chip" data-cf="${k}" aria-pressed="${cFilter === k}">${t} (${c})</button>`).join("")}</div>
        <div class="reviews">${cards || `<p class="empty">Không có câu nào khớp bộ lọc này.</p>`}</div>
      </section>
    </main>`;
}
function courseView() {
  if (cpos.v === "ch") return courseChapter(cpos.c);
  if (cpos.v === "q" && C_LB[cpos.l]) return courseQuestion(C_LB[cpos.l], Math.max(0, Math.min(cpos.i, cOrder[cpos.l].length - 1)));
  if (cpos.v === "sum" && C_LB[cpos.l]) return courseSummary(C_LB[cpos.l]);
  return courseHome();
}
function cAnswer(orig) {
  const l = C_LB[cpos.l]; if (!l) return;
  const n = cOrder[l.id][cpos.i];
  if (A(l)[n] != null) return;
  const q = CQ_BY[n];
  if (Array.isArray(q.a)) {
    const p = cPend[n] = cPend[n] || [], j = p.indexOf(orig);
    if (j >= 0) p.splice(j, 1); else p.push(orig);
    if (p.length < q.a.length) { render("co" + orig); return; }
    A(l)[n] = p.slice().sort((x, y) => x - y); delete cPend[n];
  } else A(l)[n] = orig;
  if (!cRound[l.id] && cDone(l.ns, l) === l.ns.length) { CS.res = CS.res || {}; CS.res[l.id] = { r: cRight(l.ns, l), n: l.ns.length, at: Date.now() }; }
  cSave(); render();
}
function cLoop() {
  const l = C_LB[cpos.l]; if (!l) return;
  const redo = l.ns.filter(n => !cOk(CQ_BY[n], A(l)[n]));
  if (!redo.length) return;
  redo.forEach(n => { delete A(l)[n]; cPerm[n] = shuffled(CQ_BY[n].o.length, Math.random); });
  cOrder[l.id] = shuffled(redo.length, Math.random).map(i => redo[i]);
  cRound[l.id] = (cRound[l.id] || 0) + 1;
  cSave(); cGo({ v: "q", l: l.id, i: 0 });
}
function courseClick(t) {
  if (t.dataset.cgo !== undefined) { cGo(JSON.parse(t.dataset.cgo)); return true; }
  if (t.dataset.cf) { cFilter = t.dataset.cf; render(); return true; }
  switch (t.id) {
    case "opencourse": openCourse(); return true;
    case "coursehome": closeCourse(); return true;
    case "cshuffle": cShuffle(); render(); return true;
    case "chl": CS.hl = !CS.hl; cSave(); render("chl"); return true;
    case "cloop": cLoop(); return true;
    case "maptoggle": if (courseOpen) { mapOpen = !mapOpen; render(); return true; } return false;
  }
  return false;
}
function courseKey(e) {
  if (!courseOpen || cpos.v !== "q" || modal || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== "radio") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const l = C_LB[cpos.l]; if (!l) return;
  const k = e.key.toUpperCase(), idx = "12345".includes(k) && k.length === 1 ? "12345".indexOf(k) : k.length === 1 ? C_LET.indexOf(k) : -1;
  const n = cOrder[l.id][cpos.i];
  if (idx >= 0 && A(l)[n] == null && cPerm[n][idx] != null) { e.preventDefault(); cAnswer(cPerm[n][idx]); }
  else if (e.key === "ArrowRight") { e.preventDefault(); cGo(cpos.i < cOrder[l.id].length - 1 ? { v: "q", l: l.id, i: cpos.i + 1 } : { v: "sum", l: l.id }); }
  else if (e.key === "ArrowLeft" && cpos.i > 0) { e.preventDefault(); cGo({ v: "q", l: l.id, i: cpos.i - 1 }); }
}

function render(focusId) {
  app.innerHTML = courseView();
  if (focusId) document.getElementById(focusId)?.focus();
}
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  courseClick(t);
});
app.addEventListener("change", e => {
  if (e.target.dataset.copt !== undefined) return cAnswer(+e.target.dataset.copt);
});
document.addEventListener("keydown", e => { courseKey(e); });
courseOpen = true;
cSave();
render();
</script>
